ाँचें, और सुनिश्चित करें कि वह सुरक्षित तापमान सीमा में प्राप्त हो।","শীতল ও হিমায়িত খাবারের তাপমাত্রা পরীক্ষা করুন এবং নিশ্চিত করুন যে তা নিরাপদ তাপমাত্রার মধ্যে গৃহীত হয়েছে।","Periksa suhu makanan dingin dan beku, pastikan diterima dalam rentang suhu aman."],["h3","تقييم الجودة","Quality assessment","गुणवत्ता मूल्यांकन","মান মূল্যায়ন","Penilaian mutu"],["p","فحص علامات الفساد (اللون، الرائحة، القوام). رفض الغذاء ذات الجودة السيئة.","Check signs of spoilage (colour, smell, texture). Reject food of poor quality.","खराबी के संकेत जाँचें (रंग, गंध, बनावट)। खराब गुणवत्ता का भोजन अस्वीकार करें।","নষ্ট হওয়ার লক্ষণ যাচাই করুন (রং, গন্ধ, গঠন)। খারাপ মানের খাবার ফিরিয়ে দিন।","Periksa tanda kerusakan (warna, bau, tekstur). Tolak makanan bermutu buruk."],["h3","ما هي معايير تنفيذ المهارة؟","What are the standards for doing the skill?","इस कौशल के मानक क्या हैं?","এই দক্ষতার মানদণ্ড কী?","Apa standar pelaksanaan keterampilan ini?"],["li","عدم الاستلام والفحص على الأرض مباشرة.","Do not receive and inspect food directly on the floor.","भोजन सीधे ज़मीन पर रखकर प्राप्त और जाँच न करें।","খাবার সরাসরি মেঝেতে রেখে গ্রহণ ও পরীক্ষা করবেন না।","Jangan menerima dan memeriksa makanan langsung di lantai."],["li","دقة الفحص البصري.","Accuracy of the visual check.","दृश्य जाँच में सटीकता।","দৃশ্যমান পরীক্ষায় নির্ভুলতা।","Ketelitian pemeriksaan visual."],["li","التحقق الشامل من تواريخ الصلاحية.","Thorough check of expiry dates.","समाप्ति तिथियों की पूरी जाँच।","মেয়াদের তারিখের পূর্ণাঙ্গ যাচাই।","Pemeriksaan tanggal kedaluwarsa yang menyeluruh."],["li","دقة قياس درجة الحرارة.","Accuracy of temperature measurement.","तापमान मापन में सटीकता।","তাপমাত্রা পরিমাপে নির্ভুলতা।","Ketepatan pengukuran suhu."],["li","القدرة على تمييز علامات الفساد والتلوث.","Ability to identify signs of spoilage and contamination.","खराबी और संदूषण के संकेत पहचानने की क्षमता।","নষ্ট হওয়া ও দূষণের লক্ষণ চেনার ক্ষমতা।","Kemampuan mengenali tanda kerusakan dan kontaminasi."],["li","اتخاذ قرارات سليمة بشأن قبول أو رفض الأغذية.","Make sound decisions on accepting or rejecting food.","भोजन स्वीकार या अस्वीकार करने के बारे में सही निर्णय लेना।","খাবার গ্রহণ বা প্রত্যাখ্যান সম্পর্কে সঠিক সিদ্ধান্ত নেওয়া।","Mengambil keputusan yang tepat untuk menerima atau menolak makanan."]]},{"t":["مهارة الحفاظ على دوران المخزون","Stock rotation skill","स्टॉक घुमाव का कौशल","মজুদ আবর্তনের দক্ষতা","Keterampilan rotasi stok"],"r":[["h3","ما الغرض من اتقان المهارة؟","What is the purpose of mastering this skill?","इस कौशल में निपुणता का उद्देश्य क्या है?","এই দক্ষতা আয়ত্ত করার উদ্দেশ্য কী?","Apa tujuan menguasai keterampilan ini?"],["p","ضمان استخدام المواد الغذائية بكفاءة، تقليل الهدر، والحفاظ على جودة الأغذية.","To make sure food materials are used efficiently, waste is reduced, and food quality is kept.","खाद्य सामग्री का कुशल उपयोग हो, बर्बादी कम हो और भोजन की गुणवत्ता बनी रहे।","খাদ্য উপকরণ দক্ষভাবে ব্যবহার, অপচয় কমানো ও খাবারের মান বজায় রাখা।","Memastikan bahan pangan digunakan secara efisien, mengurangi pemborosan, dan menjaga kualitas makanan."],["h3","ما هي طريقة تنفيذ المهارة؟","How is the skill carried out?","यह कौशल कैसे किया जाता है?","এই দক্ষতা কীভাবে প্রয়োগ করা হয়?","Bagaimana keterampilan ini dilakukan?"],["h3","تطبيق مبدأ \"الوارد أولاً يصرف أولاً\" (FIFO)","Applying the FIFO principle (first in, first out)","FIFO सिद्धांत लागू करना (पहले आया, पहले निकालें)","FIFO নীতি প্রয়োগ (প্রথম আসা, প্রথম বের)","Menerapkan prinsip FIFO (masuk pertama, keluar pertama)"],["li","ترتيب الغذاء حسب تواريخ الصلاحية.","Arrange food by expiry dates.","भोजन को समाप्ति तिथि के अनुसार लगाएँ।","মেয়াদের তারিখ অনুযায়ী খাবার সাজান।","Atur makanan berdasarkan tanggal kedaluwarsa."],["li","وضع المنتجات الأقدم في المقدمة للاستخدام أولاً. تخزين المنتجات الجديدة خلف أو تحت المنتجات الأقدم.","Put the older products at the front to be used first. Store new products behind or under the older ones.","पुराने उत्पाद आगे रखें ताकि पहले इस्तेमाल हों। नए उत्पाद पुराने के पीछे या नीचे रखें।","পুরনো পণ্য সামনে রাখুন যাতে আগে ব্যবহার হয়। নতুন পণ্য পুরনোর পেছনে বা নিচে রাখুন।","Letakkan produk lama di depan agar digunakan lebih dulu. Simpan produk baru di belakang atau bawah produk lama."],["li","الالتزام بمدى التخزين الموصى به لكل نوع من الغذاء، التخلص من الغذاء الذي تجاوزت مدة التخزين الآمنة.","Keep to the recommended storage period for each type of food, and throw away food that has passed its safe storage time.","हर प्रकार के भोजन के लिए अनुशंसित भंडारण अवधि का पालन करें, और जिस भोजन की सुरक्षित अवधि पार हो गई हो उसे फेंक दें।","প্রতিটি ধরনের খাবারের সুপারিশকৃত সংরক্ষণকাল মেনে চলুন, এবং নিরাপদ সময় পেরিয়ে যাওয়া খাবার ফেলে দিন।","Patuhi masa simpan yang dianjurkan untuk setiap jenis makanan, dan buang makanan yang melewati masa simpan aman."],["h3","التوسيم الدقيق","Accurate labelling","सटीक लेबलिंग","সঠিক লেবেলিং","Pelabelan yang akurat"],["li","وضع ملصقات واضحة تبين تاريخ الاستلام وتاريخ انتهاء الصلاحية.","Put clear labels showing the receiving date and the expiry date.","प्राप्ति की तारीख और समाप्ति तिथि दिखाने वाले स्पष्ट लेबल लगाएँ।","গ্রহণের তারিখ ও মেয়াদের তারিখ দেখানো স্পষ্ট লেবেল লাগান।","Tempelkan label jelas yang menunjukkan tanggal penerimaan dan tanggal kedaluwarsa."],["h3","بطاقات التاريخ","Date labels","तारीख वाले कार्ड","তারিখের কার্ড","Kartu tanggal"],["li","يفضل استخدامه قبل (Best before): يظهر على الأغذية الأقل نفعاً والتي تتمتع بعمر تخزين طويل، مثل المنتجات المعلبة، المجففة، والمعجنات.","\"Best before\": shown on foods that keep well for a long time, such as canned products, dried products and pastry.","\"Best before\" (इससे पहले उत्तम): ऐसे भोजन पर दिखता है जो लंबे समय तक ठीक रहता है, जैसे डिब्बाबंद, सूखे उत्पाद और पेस्ट्री।","\"Best before\" (এর আগে সেরা): দীর্ঘদিন ভালো থাকে এমন খাবারে থাকে, যেমন টিনজাত, শুকনো ও প্যাস্ট্রি জাতীয় পণ্য।","\"Best before\" (sebaiknya sebelum): tertera pada makanan yang tahan lama, seperti produk kalengan, kering, dan roti kue."],["li","تاريخ انتهاء الصلاحية (Used by): يوجد على الغذاء القابل للتلف والمعرضة لمخاطر عالية لنمو البكتيريا، مثل اللحوم، الأسماك، منتجات الألبان، التي تتطلب التخزين في درجة حرارة منخفضة ولها فترة صلاحية قصيرة.","\"Use by\": found on perishable food at high risk of bacterial growth, such as meat, fish and dairy, which must be stored at low temperature and have a short shelf life.","\"Use by\" (इस तारीख तक उपयोग करें): खराब होने वाले भोजन पर होता है जिसमें बैक्टीरिया तेज़ी से बढ़ते हैं, जैसे मांस, मछली, डेयरी, जिन्हें कम तापमान पर रखना होता है और जिनकी शेल्फ़ लाइफ़ छोटी होती है।","\"Use by\" (এই তারিখের মধ্যে ব্যবহার করুন): দ্রুত নষ্ট হয় এমন খাবারে থাকে, যেমন মাংস, মাছ, দুগ্ধজাত, যেগুলোতে ব্যাকটেরিয়া দ্রুত বাড়ে, কম তাপমাত্রায় রাখতে হয় ও মেয়াদ কম।","\"Use by\" (gunakan sebelum): tertera pada makanan mudah rusak yang berisiko tinggi bakteri berkembang, seperti daging, ikan, dan produk susu, yang harus disimpan suhu rendah dan masa simpannya pendek."],["h3","ما هي معايير تنفيذ المهارة؟","What are the standards for doing the skill?","इस कौशल के मानक क्या हैं?","এই দক্ষতার মানদণ্ড কী?","Apa standar pelaksanaan keterampilan ini?"],["li","دقة التوسيم وتتبع تواريخ الصلاحية.","Accurate labelling and tracking of expiry dates.","सटीक लेबलिंग और समाप्ति तिथियों का ट्रैकिंग।","সঠিক লেবেলিং ও মেয়াদের তারিখ অনুসরণ।","Pelabelan yang tepat dan pelacakan tanggal kedaluwarsa."],["li","استبعاد الأغذية المنتهية من التداول.","Remove expired food from use.","समाप्त भोजन को उपयोग से हटाना।","মেয়াদোত্তীর্ণ খাবার ব্যবহার থেকে সরানো।","Menyingkirkan makanan kedaluwarsa dari penggunaan."],["li","كفاءة استخدام مساحات التخزين.","Efficient use of storage space.","भंडारण स्थान का कुशल उपयोग।","সংরক্ষণ স্থানের দক্ষ ব্যবহার।","Penggunaan ruang penyimpanan yang efisien."]]},{"t":["مهارات التخزين والتنظيف (تابع)","Storage and cleaning skills (continued)","भंडारण और सफ़ाई कौशल (जारी)","সংরক্ষণ ও পরিষ্কারের দক্ষতা (চলমান)","Keterampilan penyimpanan dan pembersihan (lanjutan)"],"r":[["h3","مهارة تخزين الأغذية الجافة","Dry food storage skill","सूखे भोजन के भंडारण का कौशल","শুষ্ক খাবার সংরক্ষণের দক্ষতা","Keterampilan penyimpanan makanan kering"],["p","ضمان حفظ الأغذية الجافة بشكل آمن لمنع تلوثها أو تلفها والحفاظ على سلامتها وجودتها.","To keep dry food safely stored to prevent it being contaminated or damaged, and to keep it safe and good quality.","सूखे भोजन को सुरक्षित रखना ताकि वह दूषित या खराब न हो, और उसकी सुरक्षा व गुणवत्ता बनी रहे।","শুষ্ক খাবার নিরাপদে রাখা যাতে তা দূষিত বা নষ্ট না হয় এবং নিরাপত্তা ও মান বজায় থাকে।","Menyimpan makanan kering dengan aman agar tidak terkontaminasi atau rusak, serta menjaga keamanan dan mutunya."],["h3","تهيئة منطقة التخزين","Preparing the storage area","भंडारण क्षेत्र तैयार करना","সংরক্ষণ এলাকা প্রস্তুত করা","Menyiapkan area penyimpanan"],["li","التأكد من نظافة وجفاف مكان التخزين.","Make sure the storage place is clean and dry.","सुनिश्चित करें कि भंडारण स्थान साफ़ और सूखा हो।","নিশ্চিত করুন সংরক্ষণ স্থান পরিষ্কার ও শুষ্ক।","Pastikan tempat penyimpanan bersih dan kering."],["li","ضمان التهوية الجيدة ودرجة حرارة مناسبة (أقل من 25 °م).","Make sure there is good ventilation and a suitable temperature (below 25°C).","अच्छा वेंटिलेशन और उचित तापमान (25°C से कम) सुनिश्चित करें।","ভালো বায়ুচলাচল ও উপযুক্ত তাপমাত্রা (২৫°সে-এর নিচে) নিশ্চিত করুন।","Pastikan ventilasi baik dan suhu sesuai (di bawah 25°C)."],["h3","تنظيم الأغذية","Organising food","भोजन को व्यवस्थित करना","খাবার সাজানো","Menata makanan"],["li","التخزين على أرفف بارتفاع 15 سم على الأقل عن الأرض.","Store on shelves at least 15 cm above the floor.","फ़र्श से कम से कम 15 सेमी ऊपर शेल्फ़ पर रखें।","মেঝে থেকে কমপক্ষে ১৫ সেমি উপরের তাকে রাখুন।","Simpan di rak setinggi minimal 15 cm dari lantai."],["li","ترك مساحة للهواء للتدوير بين العبوات.","Leave space for air to circulate between packages.","पैकेटों के बीच हवा के आने-जाने की जगह छोड़ें।","প্যাকেটের মাঝে বাতাস চলাচলের জায়গা রাখুন।","Sisakan ruang agar udara bisa bersirkulasi di antara kemasan."],["h3","التغليف والتوسيم","Packaging and labelling","पैकेजिंग और लेबलिंग","প্যাকেজিং ও লেবেলিং","Pengemasan dan pelabelan"],["li","إبقاء الأغذية في عبواتها الأصلية أو في حاويات محكمة الإغلاق (عبوات للاستخدام الغذائي).","Keep food in its original packaging or in tightly closed containers (food-grade containers).","भोजन को मूल पैकेजिंग में या कसकर बंद डिब्बों में रखें (खाद्य-ग्रेड डिब्बे)।","খাবার আসল প্যাকেটে বা শক্ত করে বন্ধ পাত্রে রাখুন (খাদ্য-গ্রেডের পাত্র)।","Simpan makanan dalam kemasan asli atau wadah tertutup rapat (wadah khusus pangan)."],["li","وضع ملصقات تبين المحتوى وتاريخ التخزين.","Put labels showing the contents and storage date.","सामग्री और भंडारण तिथि दिखाने वाले लेबल लगाएँ।","উপাদান ও সংরক্ষণের তারিখ দেখানো লেবেল লাগান।","Tempelkan label yang menunjukkan isi dan tanggal penyimpanan."],["h3","ما هي معايير تنفيذ المهارة؟","What are the standards for doing the skill?","इस कौशल के मानक क्या हैं?","এই দক্ষতার মানদণ্ড কী?","Apa standar pelaksanaan keterampilan ini?"],["li","نظافة وتنظيم منطقة التخزين.","Clean and organised storage area.","साफ़ और व्यवस्थित भंडारण क्षेत्र।","পরিষ্কার ও সুশৃঙ্খল সংরক্ষণ এলাকা।","Area penyimpanan yang bersih dan tertata."],["li","الترتيب الصحيح للأغذية على الأرفف.","Correct arrangement of food on shelves.","अलमारियों पर भोजन का सही क्रम।","তাকে খাবারের সঠিক বিন্যাস।","Susunan makanan yang benar di rak."],["li","دقة التوسيم وتتبع تواريخ الصلاحية.","Accurate labelling and tracking of expiry dates.","सटीक लेबलिंग और समाप्ति तिथियों का ट्रैकिंग।","সঠিক লেবেলিং ও মেয়াদের তারিখ অনুসরণ।","Pelabelan yang tepat dan pelacakan tanggal kedaluwarsa."],["li","فصل الأغذية عن المواد غير الغذائية.","Keep food separate from non-food materials.","भोजन को गैर-खाद्य सामग्री से अलग रखें।","খাবার অ-খাদ্য সামগ্রী থেকে আলাদা রাখুন।","Pisahkan makanan dari bahan bukan pangan."],["n","تذكر دائماً: التخزين الجاف يحمي الغذاء من التلوث والتلف؛ ضع كل منتج في مكانه الصحيح وتحقق من تاريخ صلاحيته!","Always remember: dry storage protects food from contamination and damage. Put every product in its right place and check its expiry date!","हमेशा याद रखें: सूखा भंडारण भोजन को संदूषण और खराबी से बचाता है। हर उत्पाद को सही जगह रखें और उसकी समाप्ति तिथि जाँचें!","সবসময় মনে রাখুন: শুষ্ক সংরক্ষণ খাবারকে দূষণ ও নষ্ট হওয়া থেকে রক্ষা করে। প্রতিটি পণ্য ঠিক জায়গায় রাখুন ও মেয়াদ যাচাই করুন!","Ingat selalu: penyimpanan kering melindungi makanan dari kontaminasi dan kerusakan. Letakkan setiap produk di tempat yang tepat dan periksa tanggal kedaluwarsanya!"]]},{"t":["مهارة تخزين الأغذية المبردة / المجمدة","Chilled and frozen food storage skill","ठंडे / जमे भोजन के भंडारण का कौशल","শীতল / হিমায়িত খাবার সংরক্ষণের দক্ষতা","Keterampilan penyimpanan makanan dingin / beku"],"r":[["p","ضمان حفظ الأغذية المبردة والمجمدة بشكل آمن لمنع نمو البكتيريا الضارة والحفاظ على سلامتها وجودتها.","To keep chilled and frozen food stored safely, to stop harmful bacteria growing, and to keep food safe and good quality.","ठंडे और जमे भोजन को सुरक्षित रखना ताकि हानिकारक बैक्टीरिया न बढ़ें, और भोजन की सुरक्षा व गुणवत्ता बनी रहे।","শীতল ও হিমায়িত খাবার নিরাপদে রাখা যাতে ক্ষতিকর ব্যাকটেরিয়া না বাড়ে এবং খাবারের নিরাপত্তা ও মান বজায় থাকে।","Menyimpan makanan dingin dan beku dengan aman untuk mencegah pertumbuhan bakteri berbahaya, serta menjaga keamanan dan mutunya."],["h3","فحص درجات الحرارة","Checking temperatures","तापमान की जाँच","তাপমাত্রা পরীক্ষা","Memeriksa suhu"],["li","التأكد من درجة حرارة الثلاجة (0-4°م) والمجمدة (-18°م أو أقل)، باستخدام مقياس حرارة معتمد للتحقق.","Make sure the fridge is at 0–4°C and the freezer at -18°C or below, using a certified thermometer to check.","सुनिश्चित करें कि फ्रिज 0–4°C पर और फ़्रीज़र -18°C या उससे नीचे हो, प्रमाणित थर्मामीटर से जाँचकर।","নিশ্চিত করুন ফ্রিজ ০–৪°সে ও ফ্রিজার -১৮°সে বা নিচে আছে, প্রমাণিত থার্মোমিটার দিয়ে যাচাই করে।","Pastikan kulkas bersuhu 0–4°C dan pembeku -18°C atau lebih rendah, dengan termometer tersertifikasi."],["h3","تنظيم الأغذية","Organising food","भोजन को व्यवस्थित करना","খাবার সাজানো","Menata makanan"],["li","تخزين الأغذية النيئة أسفل الأغذية الجاهزة للأكل.","Store raw food below ready-to-eat food.","कच्चे भोजन को खाने के लिए तैयार भोजन के नीचे रखें।","কাঁচা খাবার রান্না-প্রস্তুত খাবারের নিচে রাখুন।","Simpan makanan mentah di bawah makanan siap saji."],["li","الفصل بين أنواع الأغذية المختلفة (لحوم، خضروات، ألبان).","Separate different types of food (meat, vegetables, dairy).","विभिन्न प्रकार के भोजन (मांस, सब्ज़ियाँ, डेयरी) अलग रखें।","বিভিন্ন ধরনের খাবার (মাংস, সবজি, দুগ্ধজাত) আলাদা রাখুন।","Pisahkan berbagai jenis makanan (daging, sayur, susu)."],["li","ترك مساحة للهواء للتدوير بين العبوات.","Leave space for air to circulate between packages.","पैकेटों के बीच हवा के लिए जगह छोड़ें।","প্যাকেটের মাঝে বাতাস চলাচলের জায়গা রাখুন।","Sisakan ruang untuk sirkulasi udara di antara kemasan."],["h3","التغليف والتوسيم","Packaging and labelling","पैकेजिंग और लेबलिंग","প্যাকেজিং ও লেবেলিং","Pengemasan dan pelabelan"],["li","تغطية الأغذية بإحكام لمنع التلوث (عبوات للاستخدام الغذائي).","Cover food tightly to prevent contamination (food-grade packaging).","संदूषण रोकने के लिए भोजन को कसकर ढकें (खाद्य-ग्रेड पैकेजिंग)।","দূষণ রোধে খাবার শক্ত করে ঢেকে রাখুন (খাদ্য-গ্রেডের প্যাকেজিং)।","Tutup makanan rapat untuk mencegah kontaminasi (kemasan khusus pangan)."],["li","وضع ملصقات تبين المحتوى وتاريخ التخزين.","Put labels showing the contents and storage date.","सामग्री और भंडारण तिथि दिखाने वाले लेबल लगाएँ।","উপাদান ও সংরক্ষণের তারিখ দেখানো লেবেল লাগান।","Tempelkan label yang menunjukkan isi dan tanggal penyimpanan."],["h3","ما هي معايير تنفيذ المهارة؟","What are the standards for doing the skill?","इस कौशल के मानक क्या हैं?","এই দক্ষতার মানদণ্ড কী?","Apa standar pelaksanaan keterampilan ini?"],["li","دقة ضبط وقياس درجات الحرارة.","Accuracy of temperature setting and measuring.","तापमान सेट करने और मापने में सटीकता।","তাপমাত্রা নির্ধারণ ও পরিমাপে নির্ভুলতা।","Ketepatan pengaturan dan pengukuran suhu."],["li","الترتيب الصحيح للأغذية داخل الثلاجة/المجمدة.","Correct arrangement of food inside the fridge/freezer.","फ्रिज/फ़्रीज़र के अंदर भोजन का सही क्रम।","ফ্রিজ/ফ্রিজারের ভেতরে খাবারের সঠিক বিন্যাস।","Susunan makanan yang benar di dalam kulkas/pembeku."],["li","دقة التوسيم وتتبع تواريخ التخزين.","Accurate labelling and tracking of storage dates.","सटीक लेबलिंग और भंडारण तिथियों का ट्रैकिंग।","সঠিক লেবেলিং ও সংরক্ষণের তারিখ অনুসরণ।","Pelabelan yang tepat dan pelacakan tanggal penyimpanan."],["n","تذكر دائماً: حروق التجمد (تكوّن طبقات من الثلج على الأغذية) تؤثر على نسيج وطعم الغذاء وتؤدي إلى فساده، تحدث عندما لا يتم تغليف الغذاء بشكل مناسب أثناء التخزين المجمد!","Always remember: freezer burn (ice crystals forming on food) affects the texture and taste of food and can cause spoilage. It happens when food is not wrapped properly during frozen storage!","हमेशा याद रखें: फ़्रीज़र बर्न (भोजन पर बर्फ़ की परत जमना) भोजन की बनावट और स्वाद बिगाड़ता है और खराबी ला सकता है। यह तब होता है जब जमे भोजन को ठीक से ढका या पैक न किया गया हो!","সবসময় মনে রাখুন: ফ্রিজার বার্ন (খাবারের ওপর বরফের স্তর জমা) খাবারের গঠন ও স্বাদ নষ্ট করে এবং নষ্ট হওয়ার কারণ হতে পারে। হিমায়িত সংরক্ষণের সময় খাবার ঠিকমতো মোড়ানো না থাকলে এটি ঘটে!","Ingat selalu: freezer burn (kristal es terbentuk pada makanan) memengaruhi tekstur dan rasa serta bisa menyebabkan kerusakan. Ini terjadi bila makanan tidak dikemas dengan baik saat disimpan beku!"]]},{"t":["مهارة غسل وتطهير الخضروات","Washing and sanitising vegetables skill","सब्ज़ियाँ धोने और सैनिटाइज़ करने का कौशल","সবজি ধোয়া ও জীবাণুমুক্তকরণের দক্ষতা","Keterampilan mencuci dan menyanitasi sayuran"],"r":[["p","ضمان نظافة وسلامة الخضروات من خلال إزالة الأتربة والأجسام الغريبة والبكتيريا الضارة، مما يحافظ على جودة الغذاء وصحة العملاء والمستهلكين.","To keep vegetables clean and safe by removing dirt, foreign objects and harmful bacteria, which protects food quality and the health of customers and consumers.","मिट्टी, बाहरी वस्तुओं और हानिकारक बैक्टीरिया को हटाकर सब्ज़ियों को साफ़ और सुरक्षित रखना, जिससे भोजन की गुणवत्ता और ग्राहकों की सेहत बनी रहे।","মাটি, বাইরের বস্তু ও ক্ষতিকর ব্যাকটেরিয়া দূর করে সবজি পরিষ্কার ও নিরাপদ রাখা, যাতে খাবারের মান ও ভোক্তাদের স্বাস্থ্য রক্ষা হয়।","Menjaga sayuran tetap bersih dan aman dengan menghilangkan tanah, benda asing dan bakteri berbahaya, sehingga mutu makanan dan kesehatan pelanggan terjaga."],["h3","1 - الغسل تحت الماء الجاري","1 – Washing under running water","1 – बहते पानी के नीचे धोना","১ – চলমান পানির নিচে ধোয়া","1 – Mencuci di bawah air mengalir"],["li","غسل الخضروات جيداً باستخدام الماء البارد الجاري.","Wash vegetables well under cold running water.","सब्ज़ियों को ठंडे बहते पानी में अच्छी तरह धोएँ।","ঠান্ডা চলমান পানিতে সবজি ভালোভাবে ধুন।","Cuci sayuran dengan baik di bawah air dingin mengalir."],["li","فرك الخضروات باليد أو استخدام فرشاة مخصصة لتنظيف السطح لإزالة الأتربة والأجسام الغريبة.","Rub vegetables by hand or use a dedicated brush to clean the surface and remove dirt and foreign matter.","सब्ज़ियों को हाथ से रगड़ें या मिट्टी और बाहरी कणों को हटाने के लिए अलग ब्रश इस्तेमाल करें।","হাত দিয়ে ঘষুন বা মাটি ও বাইরের কণা দূর করতে আলাদা ব্রাশ ব্যবহার করুন।","Gosok sayuran dengan tangan atau gunakan sikat khusus untuk membersihkan tanah dan kotoran."],["h3","2 - نقع في محلول المطهر","2 – Soaking in sanitiser solution","2 – सैनिटाइज़र घोल में भिगोना","২ – জীবাণুনাশক দ্রবণে ভেজানো","2 – Merendam dalam larutan sanitasi"],["li","تحضير محلول التطهير بناءً على التعليمات المدونة على العبوة.","Prepare the sanitiser solution following the instructions on the label.","लेबल पर दिए निर्देशों के अनुसार सैनिटाइज़र घोल तैयार करें।","লেবেলের নির্দেশনা অনুসারে জীবাণুনাশক দ্রবণ তৈরি করুন।","Siapkan larutan sanitasi sesuai petunjuk pada label."],["li","غمر الخضروات في المحلول للمدة المحددة وتركها للمدة المحددة.","Immerse vegetables in the solution for the set time.","सब्ज़ियों को तय समय तक घोल में डुबोकर रखें।","নির্ধারিত সময়ের জন্য সবজি দ্রবণে ডুবিয়ে রাখুন।","Rendam sayuran dalam larutan selama waktu yang ditentukan."],["h3","3 - الشطف الجيد","3 – Thorough rinsing","3 – अच्छी तरह खंगालना","৩ – ভালোভাবে ধুয়ে ফেলা","3 – Membilas dengan baik"],["li","بعد انتهاء وقت النقع، شطف الخضروات تحت الماء البارد الجاري لإزالة أي بقايا للمطهر.","After soaking, rinse vegetables under cold running water to remove any sanitiser left.","भिगोने के बाद सब्ज़ियों को ठंडे बहते पानी में खंगालें ताकि सैनिटाइज़र का कोई अंश न रहे।","ভেজানোর পর ঠান্ডা চলমান পানিতে ধুয়ে জীবাণুনাশকের অবশিষ্ট দূর করুন।","Setelah direndam, bilas sayuran di bawah air dingin mengalir untuk menghilangkan sisa sanitasi."],["h3","قياس تركيز المطهر","Measuring sanitiser concentration","सैनिटाइज़र की सांद्रता मापना","জীবাণুনাশকের ঘনত্ব মাপা","Mengukur konsentrasi sanitasi"],["li","استخدام أدوات قياس دقيقة لتحديد تركيز المطهر وفقاً لحجم غسيل حوض الغسيل، وتأكد من التخفيف حسب الإرشادات.","Use accurate measuring tools to set the sanitiser concentration to the volume of the wash basin, and make sure to dilute as directed.","सैनिटाइज़र की सांद्रता सटीक मापक से तय करें, धोने के सिंक के आयतन के अनुसार, और निर्देशानुसार पतला करें।","জীবাণুনাশকের ঘনত্ব সঠিক পরিমাপক দিয়ে ধোয়ার বেসিনের আয়তন অনুযায়ী ঠিক করুন, এবং নির্দেশ অনুযায়ী পাতলা করুন।","Gunakan alat ukur yang akurat untuk menentukan konsentrasi sanitasi sesuai volume bak cuci, dan encerkan sesuai petunjuk."],["h3","ما هي معايير تنفيذ المهارة؟","What are the standards for doing the skill?","इस कौशल के मानक क्या हैं?","এই দক্ষতার মানদণ্ড কী?","Apa standar pelaksanaan keterampilan ini?"],["li","دقة قياس تركيز المطهر وفقاً لتعليمات الشركة المصنعة.","Accurate measurement of sanitiser concentration as per the manufacturer's instructions.","निर्माता के निर्देशों के अनुसार सैनिटाइज़र की सांद्रता का सटीक मापन।","প্রস্তুতকারকের নির্দেশ অনুযায়ী জীবাণুনাশকের ঘনত্ব নির্ভুল পরিমাপ।","Pengukuran konsentrasi sanitasi yang tepat sesuai instruksi pabrikan."],["li","الالتزام بوقت التطهير الموصى به.","Keep to the recommended sanitising time.","अनुशंसित सैनिटाइज़िंग समय का पालन करें।","নির্দেশিত জীবাণুমুক্তকরণের সময় মেনে চলুন।","Patuhi waktu sanitasi yang dianjurkan."],["li","التأكد من الشطف الجيد للخضروات.","Make sure vegetables are rinsed well.","सुनिश्चित करें कि सब्ज़ियाँ अच्छी तरह खंगाली गई हों।","নিশ্চিত করুন সবজি ভালোভাবে ধোয়া হয়েছে।","Pastikan sayuran dibilas dengan baik."],["li","نظافة وسلامة الأدوات المستخدمة في عملية الغسل والتطهير.","Clean and safe tools used in the washing and sanitising process.","धोने और सैनिटाइज़ करने की प्रक्रिया में इस्तेमाल होने वाले औज़ार साफ़ और सुरक्षित हों।","ধোয়া ও জীবাণুমুক্তকরণে ব্যবহৃত সরঞ্জাম পরিষ্কার ও নিরাপদ।","Alat yang digunakan dalam proses mencuci dan menyanitasi harus bersih dan aman."]]},{"t":["مهارة تفكيك/تسييح الغذاء المجمد","Thawing frozen food skill","जमे भोजन को पिघलाने का कौशल","হিমায়িত খাবার গলানোর দক্ষতা","Keterampilan mencairkan makanan beku"],"r":[["p","ضمان سلامة الغذاء المجمدة عند تفكيكها، مما يقلل من مخاطر التلوث والتسمم ويحافظ على الجودة والتسميم، تفكيك الغذاء بشكل صحيح يضمن وصول الحرارة لجميع أجزائه عند الطهي، مما يمنع بقاء البكتيريا الضارة في الأجزاء الداخلية.","To keep frozen food safe when thawing, which lowers the risk of contamination and poisoning and keeps quality. Thawing food correctly makes sure heat reaches all parts during cooking, so harmful bacteria do not survive in the inner parts.","जमे भोजन को पिघलाते समय सुरक्षित रखना, ताकि संदूषण और विषाक्तता का जोखिम कम हो और गुणवत्ता बनी रहे। भोजन को सही तरह पिघलाने से पकाते समय गर्मी उसके हर हिस्से तक पहुँचती है, और अंदर के हिस्सों में हानिकारक बैक्टीरिया नहीं बचते।","হিমায়িত খাবার গলানোর সময় নিরাপদ রাখা, যাতে দূষণ ও বিষক্রিয়ার ঝুঁকি কমে এবং মান বজায় থাকে। সঠিকভাবে গলালে রান্নার সময় তাপ সব অংশে পৌঁছায়, ফলে ভেতরের অংশে ক্ষতিকর ব্যাকটেরিয়া টিকে থাকে না।","Menjaga makanan beku tetap aman saat dicairkan, mengurangi risiko kontaminasi dan keracunan serta menjaga mutu. Mencairkan dengan benar memastikan panas mencapai seluruh bagian saat dimasak, sehingga bakteri berbahaya tidak bertahan di bagian dalam."],["h3","التأكد من تعليمات مصنع الغذاء","Check the food maker's instructions","खाद्य निर्माता के निर्देश जाँचें","খাদ্য প্রস্তুতকারকের নির্দেশনা দেখুন","Periksa instruksi pabrikan makanan"],["li","التحقق من تعليمات الشركة المصنعة على العبوة لمعرفة ما إذا كان يمكن طهي الغذاء مباشرة من المجمد أو يجب تفكيكه أولاً.","Check the manufacturer's instructions on the pack to see if the food can be cooked straight from frozen or must be thawed first.","पैकेट पर निर्माता के निर्देश देखें कि भोजन सीधे जमे हुए से पकाया जा सकता है या पहले पिघलाना ज़रूरी है।","প্যাকেটের নির্দেশনা দেখুন, খাবার সরাসরি হিমায়িত অবস্থা থেকে রান্না করা যাবে কি না, নাকি আগে গলাতে হবে।","Periksa instruksi produsen di kemasan untuk mengetahui apakah makanan bisa langsung dimasak dari beku atau harus dicairkan dulu."],["h3","التفكيك في الثلاجة","Thawing in the fridge","फ्रिज में पिघलाना","ফ্রিজে গলানো","Mencairkan di kulkas"],["li","وضع الغذاء المجمدة في ثلاجة بدرجة حرارة (0-4°م) حتى تذوب بالكامل.","Place frozen food in a fridge at 0–4°C until fully thawed.","जमे भोजन को 0–4°C वाले फ्रिज में पूरी तरह पिघलने तक रखें।","হিমায়িত খাবার ০–৪°সে তাপমাত্রার ফ্রিজে সম্পূর্ণ না গলা পর্যন্ত রাখুন।","Letakkan makanan beku di kulkas bersuhu 0–4°C hingga benar-benar mencair."],["li","وضع الغذاء في مصفاة مغطاة لتجنب التلوث التبادلي مع الأغذية الأخرى.","Put the food in a covered tray to avoid cross-contamination with other food.","क्रॉस-संदूषण से बचने के लिए भोजन को ढकी हुई ट्रे में रखें।","অন্য খাবারের সাথে ক্রস-দূষণ এড়াতে খাবার ঢাকা ট্রেতে রাখুন।","Letakkan makanan di wadah tertutup untuk menghindari kontaminasi silang dengan makanan lain."],["h3","التفكيك باستخدام المايكروويف","Thawing in a microwave","माइक्रोवेव में पिघलाना","মাইক্রোওয়েভে গলানো","Mencairkan dengan microwave"],["li","استخدام وضع التفكيك في المايكروويف مع أوعية آمنة، والتأكد من تقليب الغذاء لضمان توزيع الحرارة.","Use the defrost setting in the microwave with microwave-safe containers, and stir or turn the food to make sure heat is spread evenly.","माइक्रोवेव में डीफ़्रॉस्ट मोड और माइक्रोवेव-सुरक्षित बर्तन इस्तेमाल करें, और समान गर्मी के लिए भोजन को पलटते रहें।","মাইক্রোওয়েভে ডিফ্রস্ট মোড ও মাইক্রোওয়েভ-নিরাপদ পাত্র ব্যবহার করুন, এবং তাপ সমানভাবে ছড়াতে খাবার নেড়ে বা উল্টে দিন।","Gunakan mode defrost pada microwave dengan wadah aman microwave, dan balik atau aduk makanan agar panas merata."],["h3","ما هي معايير تنفيذ المهارة؟","What are the standards for doing the skill?","इस कौशल के मानक क्या हैं?","এই দক্ষতার মানদণ্ড কী?","Apa standar pelaksanaan keterampilan ini?"],["li","استخدام طرق التفكيك الآمنة، عدم تعريض الغذاء لدرجة حرارة الغرفة، عدم تعريض الغذاء للهواء المكشوف أثناء التفكيك.","Use safe thawing methods, do not leave food at room temperature, and do not expose food to open air during thawing.","सुरक्षित तरीके अपनाएँ, भोजन को कमरे के तापमान पर न छोड़ें, और पिघलाते समय उसे खुली हवा में न रखें।","নিরাপদ পদ্ধতি ব্যবহার, খাবার ঘরের তাপমাত্রায় ফেলে না রাখা, এবং গলানোর সময় খোলা বাতাসে না রাখা।","Gunakan cara mencairkan yang aman, jangan biarkan makanan pada suhu ruang, dan jangan biarkan makanan terpapar udara terbuka."],["li","اتباع التعليمات الخاصة بالتفكيك على العبوة بدقة.","Follow the thawing instructions on the pack exactly.","पैकेट पर दिए पिघलाने के निर्देशों का सटीक पालन करें।","প্যাকেটের গলানোর নির্দেশনা হুবহু অনুসরণ করুন।","Ikuti instruksi pencairan pada kemasan dengan tepat."],["li","حفظ الغذاء في حاويات محكمة الإغلاق وفي درجة حرارة مناسبة.","Keep food in tightly closed containers at a suitable temperature.","भोजन को कसकर बंद डिब्बों में और उचित तापमान पर रखें।","খাবার শক্ত করে বন্ধ পাত্রে ও উপযুক্ত তাপমাত্রায় রাখুন।","Simpan makanan dalam wadah tertutup rapat pada suhu yang sesuai."],["n","تذكر دائماً: لا تترك الغذاء المجمد ليذوب في درجة حرارة الغرفة أبداً؛ فهذا يسمح بنمو البكتيريا بسرعة!","Always remember: never leave frozen food to thaw at room temperature. This lets bacteria grow quickly!","हमेशा याद रखें: जमे भोजन को कमरे के तापमान पर कभी न पिघलने दें। इससे बैक्टीरिया तेज़ी से बढ़ते हैं!","সবসময় মনে রাখুন: হিমায়িত খাবার কখনো ঘরের তাপমাত্রায় গলতে দেবেন না। এতে ব্যাকটেরিয়া দ্রুত বাড়ে!","Ingat selalu: jangan pernah membiarkan makanan beku mencair pada suhu ruang. Ini membuat bakteri cepat berkembang!"]]},{"t":["مهارة تنظيف وتطهير الأسطح - طريقة 6 مراحل","Cleaning and sanitising surfaces – 6-step method","सतहों की सफ़ाई और सैनिटाइज़ेशन – 6 चरण विधि","তল পরিষ্কার ও জীবাণুমুক্তকরণ – ৬ ধাপ পদ্ধতি","Membersihkan dan menyanitasi permukaan – metode 6 langkah"],"r":[["h3","ما الغرض من اتقان المهارة؟","What is the purpose of mastering this skill?","इस कौशल में निपुणता का उद्देश्य क्या है?","এই দক্ষতা আয়ত্ত করার উদ্দেশ্য কী?","Apa tujuan menguasai keterampilan ini?"],["p","ضمان نظافة وتطهير الأسطح (وتشمل الجدران، الأرضيات، وأسطح العمل) لإزالة الأوساخ ومنع انتشار الميكروبات للحفاظ على بيئة صحية في منشآت الغذاء.","To keep surfaces clean and sanitised (walls, floors and work surfaces) to remove dirt and stop microbes spreading, to keep a healthy environment in food establishments.","सतहों (दीवारें, फ़र्श और काम की मेज़ें) को साफ़ और सैनिटाइज़ रखना, ताकि गंदगी हटे और सूक्ष्मजीव न फैलें, और खाद्य प्रतिष्ठान में स्वस्थ वातावरण बना रहे।","তল (দেয়াল, মেঝে ও কাজের টেবিল) পরিষ্কার ও জীবাণুমুক্ত রাখা, ময়লা দূর ও জীবাণু ছড়ানো রোধ করা, যাতে খাদ্য প্রতিষ্ঠানে স্বাস্থ্যকর পরিবেশ থাকে।","Menjaga permukaan (dinding, lantai, dan meja kerja) tetap bersih dan tersanitasi untuk menghilangkan kotoran dan mencegah penyebaran mikroba, demi lingkungan usaha pangan yang sehat."],["h3","ما هي طريقة تنفيذ المهارة؟","How is the skill carried out?","यह कौशल कैसे किया जाता है?","এই দক্ষতা কীভাবে প্রয়োগ করা হয়?","Bagaimana keterampilan ini dilakukan?"],["p","قبل البدء في تنظيف السطح، تأكد من عزل المواد الغذائية في مكان آمن وبعيد عن منطقة العمل لتجنب تلوثه.","Before cleaning a surface, make sure food is kept isolated in a safe place away from the work area to avoid contaminating it.","सतह साफ़ करने से पहले सुनिश्चित करें कि भोजन सुरक्षित जगह पर, काम के क्षेत्र से दूर रखा गया हो, ताकि वह दूषित न हो।","তল পরিষ্কার শুরুর আগে নিশ্চিত করুন খাবার কাজের জায়গা থেকে দূরে নিরাপদ স্থানে রাখা আছে, যাতে দূষিত না হয়।","Sebelum membersihkan permukaan, pastikan makanan diisolasi di tempat aman yang jauh dari area kerja agar tidak terkontaminasi."],["p","طريقة تنفيذ هذه المهارة تم توضيحها في قسم \"كيفية التنظيف والتطهير\" ضمن جزء النظافة في منشآت الغذاء، وتتضمن: التنظيف الأولي، التنظيف الرئيسي، الشطف، التطهير، الشطف النهائي (عند الحاجة)، والتجفيف.","The method for this skill is explained in the \"How to clean and sanitise\" section of the cleaning part of food establishments. It includes: pre-cleaning, main cleaning, rinsing, sanitising, final rinse (if needed), and air-drying.","यह कौशल \"सफ़ाई और सैनिटाइज़ेशन कैसे करें\" भाग में समझाया गया है। इसमें शामिल है: प्रारंभिक सफ़ाई, मुख्य सफ़ाई, खंगालना, सैनिटाइज़ करना, अंतिम खंगालना (ज़रूरत हो तो) और सुखाना।","এই দক্ষতার পদ্ধতি পরিচ্ছন্নতা অংশের \"কীভাবে পরিষ্কার ও জীবাণুমুক্ত করবেন\" বিভাগে বর্ণিত। এতে রয়েছে: প্রাথমিক পরিষ্কার, মূল পরিষ্কার, ধোয়া, জীবাণুমুক্তকরণ, চূড়ান্ত ধোয়া (প্রয়োজনে) ও শুকানো।","Metode keterampilan ini dijelaskan di bagian \"Cara membersihkan dan menyanitasi\" dalam bagian kebersihan usaha pangan. Meliputi: pembersihan awal, pembersihan utama, pembilasan, penyanitasian, pembilasan akhir (bila perlu), dan pengeringan."],["h3","ما هي معايير تنفيذ المهارة؟","What are the standards for doing the skill?","इस कौशल के मानक क्या हैं?","এই দক্ষতার মানদণ্ড কী?","Apa standar pelaksanaan keterampilan ini?"],["li","استخدام المنظفات والمطهرات المناسبة بالتركيز الصحيح.","Use the right cleaners and sanitisers at the correct strength.","सही सांद्रता पर उचित क्लीनर और सैनिटाइज़र इस्तेमाल करें।","সঠিক মাত্রায় উপযুক্ত ক্লিনার ও জীবাণুনাশক ব্যবহার করুন।","Gunakan pembersih dan sanitasi yang sesuai dengan konsentrasi yang tepat."],["li","الالتزام بوقت التلامس الموصى به للمطهر.","Keep to the recommended contact time for the sanitiser.","सैनिटाइज़र के लिए अनुशंसित संपर्क समय का पालन करें।","জীবাণুনাশকের নির্দেশিত সংস্পর্শ সময় মেনে চলুন।","Patuhi waktu kontak yang dianjurkan untuk sanitasi."],["li","تغطية جميع أجزاء السطح بشكل متساوٍ.","Cover all parts of the surface evenly.","सतह के सभी हिस्सों को समान रूप से ढकें।","তলের সব অংশ সমানভাবে ঢেকে দিন।","Lapisi semua bagian permukaan secara merata."],["li","الشطف الجيد لإزالة جميع بقايا المواد الكيميائية.","Rinse well to remove all chemical residue.","सभी रासायनिक अवशेष हटाने के लिए अच्छी तरह खंगालें।","সব রাসায়নিক অবশেষ দূর করতে ভালোভাবে ধুয়ে ফেলুন।","Bilas dengan baik untuk menghilangkan semua sisa bahan kimia."]]},{"t":["مهارة تنظيف وتطهير الأسطح - طريقة 4 مراحل","Cleaning and sanitising surfaces – 4-step method","सतहों की सफ़ाई और सैनिटाइज़ेशन – 4 चरण विधि","তল পরিষ্কার ও জীবাণুমুক্তকরণ – ৪ ধাপ পদ্ধতি","Membersihkan dan menyanitasi permukaan – metode 4 langkah"],"r":[["h3","ما الغرض من اتقان المهارة؟","What is the purpose of mastering this skill?","इस कौशल में निपुणता का उद्देश्य क्या है?","এই দক্ষতা আয়ত্ত করার উদ্দেশ্য কী?","Apa tujuan menguasai keterampilan ini?"],["p","ضمان نظافة وتطهير أسطح العمل بطريقة فعالة وسريعة، للحفاظ على بيئة آمنة في منشآت الغذاء.","To keep work surfaces clean and sanitised in an effective, quick way, and to keep a safe environment in food establishments.","काम की सतहों को प्रभावी और तेज़ तरीके से साफ़ व सैनिटाइज़ रखना, ताकि खाद्य प्रतिष्ठान में सुरक्षित वातावरण रहे।","কাজের তল কার্যকর ও দ্রুতভাবে পরিষ্কার ও জীবাণুমুক্ত রাখা, যাতে খাদ্য প্রতিষ্ঠানে নিরাপদ পরিবেশ থাকে।","Menjaga permukaan kerja tetap bersih dan tersanitasi dengan cara yang efektif dan cepat, demi lingkungan usaha pangan yang aman."],["h3","ما هي طريقة تنفيذ المهارة؟","How is the skill carried out?","यह कौशल कैसे किया जाता है?","এই দক্ষতা কীভাবে প্রয়োগ করা হয়?","Bagaimana keterampilan ini dilakukan?"],["p","قبل البدء في تنظيف السطح، تأكد من عزل المواد الغذائية في مكان آمن وبعيد عن منطقة العمل لتجنب تلوثه.","Before cleaning a surface, make sure food is isolated in a safe place away from the work area to avoid contamination.","सतह साफ़ करने से पहले सुनिश्चित करें कि भोजन सुरक्षित जगह पर, काम के क्षेत्र से दूर हो।","তল পরিষ্কার শুরুর আগে খাবার কাজের জায়গা থেকে দূরে নিরাপদ স্থানে রাখুন।","Sebelum membersihkan permukaan, pastikan makanan diisolasi di tempat aman jauh dari area kerja."],["h3","التنظيف الأولي","Pre-cleaning","प्रारंभिक सफ़ाई","প্রাথমিক পরিষ্কার","Pembersihan awal"],["li","المسح أو الكشط لإزالة الأوساخ والبقايا الظاهرة.","Wipe or scrape to remove visible dirt and food debris.","दिखने वाली गंदगी और भोजन के कण हटाने के लिए पोंछें या खुरचें।","দৃশ্যমান ময়লা ও খাবারের কণা দূর করতে মুছুন বা খুরচুন।","Lap atau kikis untuk menghilangkan kotoran dan sisa makanan yang terlihat."],["h3","التنظيف والتطهير بالمنظف المطهر (Sanitizer)","Cleaning and sanitising with sanitiser","सैनिटाइज़र से सफ़ाई और सैनिटाइज़ेशन","জীবাণুনাশক দিয়ে পরিষ্কার ও জীবাণুমুক্তকরণ","Pembersihan dan penyanitasian dengan sanitasi (Sanitizer)"],["li","تطبيق محلول المنظف المطهر على السطح باستخدام رشاش وفرك السطح جيداً لإزالة الأوساخ وضمان التغطية الكاملة.","Apply sanitiser solution to the surface with a spray, and scrub well to remove dirt and make sure of full coverage.","सैनिटाइज़र घोल स्प्रे से सतह पर लगाएँ और अच्छी तरह रगड़ें ताकि गंदगी हटे और पूरी सतह ढक जाए।","স্প্রে দিয়ে তলে জীবাণুনাশক দ্রবণ লাগান এবং ভালোভাবে ঘষুন, যাতে ময়লা দূর হয় ও পুরো তল ঢাকা পড়ে।","Semprotkan larutan sanitasi ke permukaan, lalu gosok dengan baik agar kotoran hilang dan seluruh permukaan tercakup."],["h3","وقت الملامسة","Contact time","संपर्क समय","সংস্পর্শের সময়","Waktu kontak"],["li","ترك المحلول على السطح للمدة الموصى بها في تعليمات المنظف المطهر، عادة ما تكون بين 30 ثانية إلى 5 دقائق.","Leave the solution on the surface for the time in the sanitiser instructions, usually between 30 seconds and 5 minutes.","सैनिटाइज़र के निर्देशों में बताए गए समय तक घोल को सतह पर रहने दें, आमतौर पर 30 सेकंड से 5 मिनट।","জীবাণুনাশকের নির্দেশনায় বলা সময় পর্যন্ত দ্রবণ তলে রাখুন, সাধারণত ৩০ সেকেন্ড থেকে ৫ মিনিট।","Biarkan larutan di permukaan sesuai petunjuk sanitasi, biasanya antara 30 detik hingga 5 menit."],["h3","التجفيف","Air-drying","सुखाना","শুকানো","Pengeringan"],["li","ترك السطح ليجف في الهواء، أو باستخدام مناديل ورقية عالية الامتصاص، عدم الشطف ما لم تنص تعليمات المنتج على ذلك.","Let the surface air-dry, or use highly absorbent paper towels. Do not rinse unless the product instructions say so.","सतह को हवा में सूखने दें, या बहुत सोखने वाले कागज़ी तौलिये इस्तेमाल करें। उत्पाद के निर्देश न कहें तो न खंगालें।","তলটি বাতাসে শুকাতে দিন, অথবা শোষক কাগজের তোয়ালে ব্যবহার করুন। উৎপাদনের নির্দেশনা না থাকলে ধোবেন না।","Biarkan permukaan kering dengan udara, atau gunakan tisu sangat menyerap. Jangan membilas kecuali instruksi produk menyebutkannya."],["h3","ما هي معايير تنفيذ المهارة؟","What are the standards for doing the skill?","इस कौशल के मानक क्या हैं?","এই দক্ষতার মানদণ্ড কী?","Apa standar pelaksanaan keterampilan ini?"],["li","استخدام المنظف المطهر بالتركيز الصحيح.","Use the sanitiser at the correct strength.","सैनिटाइज़र सही सांद्रता पर इस्तेमाल करें।","জীবাণুনাশক সঠিক মাত্রায় ব্যবহার করুন।","Gunakan sanitasi pada konsentrasi yang benar."],["li","تغطية جميع أجزاء السطح بشكل متساوٍ.","Cover all parts of the surface evenly.","सतह के सभी हिस्सों को समान रूप से ढकें।","তলের সব অংশ সমানভাবে ঢাকুন।","Lapisi semua bagian permukaan secara merata."],["li","الالتزام بوقت التلامس الموصى به.","Keep to the recommended contact time.","अनुशंसित संपर्क समय का पालन करें।","নির্দেশিত সংস্পর্শের সময় মেনে চলুন।","Patuhi waktu kontak yang dianjurkan."],["li","عدم الشطف بعد التطبيق (ما لم تتطلب التعليمات ذلك).","Do not rinse after applying (unless the instructions require it).","लगाने के बाद न खंगालें (जब तक निर्देश न कहें)।","প্রয়োগের পর ধোবেন না (নির্দেশনায় না থাকলে)।","Jangan membilas setelah diaplikasikan (kecuali instruksi memintanya)."]]},{"t":["مهارة تنظيف وتطهير الأواني/الأدوات - طريقة الحوض الثلاثي","Cleaning and sanitising utensils – three-compartment sink method","बर्तनों की सफ़ाई और सैनिटाइज़ेशन – तीन-हौज़ विधि","পাত্র পরিষ্কার ও জীবাণুমুক্তকরণ – তিন-বেসিন পদ্ধতি","Membersihkan dan menyanitasi peralatan – metode bak tiga"],"r":[["p","ضمان نظافة وسلامة الأواني والأدوات المستخدمة في تحضير وتقديم الغذاء، مما يمنع التلوث المتبادل ويحافظ على صحة المستهلكين.","To keep utensils and tools used to prepare and serve food clean and safe, which prevents cross-contamination and protects consumers' health.","भोजन तैयार करने और परोसने में इस्तेमाल होने वाले बर्तनों और औज़ारों को साफ़ व सुरक्षित रखना, ताकि क्रॉस-संदूषण रुके और उपभोक्ताओं की सेहत बची रहे।","খাবার প্রস্তুত ও পরিবেশনে ব্যবহৃত পাত্র ও সরঞ্জাম পরিষ্কার ও নিরাপদ রাখা, যাতে ক্রস-দূষণ রোধ হয় ও ভোক্তাদের স্বাস্থ্য রক্ষা পায়।","Menjaga peralatan dan alat yang digunakan untuk menyiapkan dan menyajikan makanan tetap bersih dan aman, mencegah kontaminasi silang dan melindungi kesehatan konsumen."],["p","طريقة تنفيذ هذه المهارة تم توضيحها في قسم \"التنظيف والتطهير الثلاثي\" ضمن جزء النظافة في منشآت الغذاء، وتتضمن: التنظيف الأولي (حاوية نفايات)، التنظيف الرئيسي (الحوض الأول)، الشطف (الحوض الثاني)، التطهير (الحوض الثالث)، والتجفيف (أرفف التجفيف).","The method is explained in the \"three-compartment cleaning and sanitising\" section of the cleaning part of food establishments. It includes: pre-cleaning (waste bin), main washing (first sink), rinsing (second sink), sanitising (third sink), and air-drying (drying rack).","यह विधि खाद्य प्रतिष्ठानों के सफ़ाई भाग में \"तीन-हौज़ सफ़ाई और सैनिटाइज़ेशन\" में समझाई गई है। इसमें शामिल है: प्रारंभिक सफ़ाई (कूड़ेदान), मुख्य धुलाई (पहला हौज़), खंगालना (दूसरा हौज़), सैनिटाइज़ करना (तीसरा हौज़) और सुखाना (सुखाने की रैक)।","এই পদ্ধতি খাদ্য প্রতিষ্ঠানের পরিচ্ছন্নতা অংশের \"তিন-বেসিন পরিষ্কার ও জীবাণুমুক্তকরণ\" বিভাগে বর্ণিত। এতে রয়েছে: প্রাথমিক পরিষ্কার (ডাস্টবিন), মূল ধোয়া (প্রথম বেসিন), ধুয়ে ফেলা (দ্বিতীয় বেসিন), জীবাণুমুক্তকরণ (তৃতীয় বেসিন) ও শুকানো (শুকানোর র‍্যাক)।","Metode ini dijelaskan di bagian \"pembersihan dan penyanitasian tiga bak\" dalam bagian kebersihan usaha pangan. Meliputi: pembersihan awal (tempat sampah), pencucian utama (bak pertama), pembilasan (bak kedua), penyanitasian (bak ketiga), dan pengeringan (rak pengering)."],["h3","ما هي معايير تنفيذ المهارة؟","What are the standards for doing the skill?","इस कौशल के मानक क्या हैं?","এই দক্ষতার মানদণ্ড কী?","Apa standar pelaksanaan keterampilan ini?"],["li","استخدام الأحواض بشكل صحيح.","Use the sinks correctly.","सिंक का सही उपयोग करें।","বেসিনগুলো সঠিকভাবে ব্যবহার করুন।","Gunakan bak dengan benar."],["li","التأكد من درجات الحرارة لكل حوض.","Check the temperature of each sink.","हर हौज़ का तापमान जाँचें।","প্রতিটি বেসিনের তাপমাত্রা যাচাই করুন।","Periksa suhu setiap bak."],["li","الالتزام بالتركيزات المنظف والمطهر الموصى بها.","Keep to the recommended detergent and sanitiser concentrations.","अनुशंसित क्लीनर और सैनिटाइज़र की सांद्रता का पालन करें।","নির্দেশিত ডিটারজেন্ট ও জীবাণুনাশকের মাত্রা মেনে চলুন।","Patuhi konsentrasi deterjen dan sanitasi yang dianjurkan."],["li","التقيد بأوقات التطهير بعد التنظيف.","Keep to the sanitising times after washing.","धोने के बाद सैनिटाइज़िंग समय का पालन करें।","ধোয়ার পর জীবাণুমুক্তকরণের সময় মেনে চলুন।","Patuhi waktu sanitasi setelah pencucian."],["li","التأكد من نظافة وتطهير جميع أجزاء الأواني.","Make sure all parts of the utensils are clean and sanitised.","सुनिश्चित करें कि बर्तनों के सभी हिस्से साफ़ और सैनिटाइज़ हों।","নিশ্চিত করুন পাত্রের সব অংশ পরিষ্কার ও জীবাণুমুক্ত।","Pastikan semua bagian peralatan bersih dan tersanitasi."],["n","تذكر دائماً: سلامة الأواني تعتمد على الترتيب الصحيح للأحواض والالتزام بالتركيز ودرجة الحرارة وأوقات التطهير في كل مرحلة.","Always remember: utensil safety depends on using the sinks in the right order and keeping to the correct strength, temperature and sanitising time at each stage.","हमेशा याद रखें: बर्तनों की सुरक्षा हौज़ों के सही क्रम और हर चरण पर सही सांद्रता, तापमान और सैनिटाइज़िंग समय पर निर्भर है।","সবসময় মনে রাখুন: পাত্রের নিরাপত্তা বেসিনগুলোর সঠিক ক্রম এবং প্রতিটি ধাপে সঠিক মাত্রা, তাপমাত্রা ও জীবাণুমুক্তকরণের সময়ের ওপর নির্ভর করে।","Ingat selalu: keamanan peralatan bergantung pada urutan bak yang benar dan kepatuhan pada konsentrasi, suhu, dan waktu sanitasi di setiap tahap."]]},{"t":["مهارة تنظيف وتطهير الأواني/الأدوات - طريقة الحوض الثنائي","Cleaning and sanitising utensils – two-compartment sink method","बर्तनों की सफ़ाई और सैनिटाइज़ेशन – दो-हौज़ विधि","পাত্র পরিষ্কার ও জীবাণুমুক্তকরণ – দুই-বেসিন পদ্ধতি","Membersihkan dan menyanitasi peralatan – metode bak dua"],"r":[["p","ضمان نظافة وسلامة الأواني والأدوات في المنشآت الصغيرة أو محدودة المساحة، مع الحفاظ على معايير النظافة والتطهير العالية.","To keep utensils and tools clean and safe in small or limited-space establishments, while keeping high cleaning and sanitising standards.","छोटे या सीमित स्थान वाले प्रतिष्ठानों में बर्तनों और औज़ारों को साफ़ व सुरक्षित रखना, और उच्च सफ़ाई व सैनिटाइज़ेशन मानक बनाए रखना।","ছোট বা সীমিত জায়গার প্রতিষ্ঠানে পাত্র ও সরঞ্জাম পরিষ্কার ও নিরাপদ রাখা এবং উচ্চ পরিচ্ছন্নতার মান বজায় রাখা।","Menjaga peralatan tetap bersih dan aman di usaha kecil atau berruang terbatas, dengan menjaga standar kebersihan dan sanitasi yang tinggi."],["p","طريقة تنفيذ هذه المهارة تتضمن: التنظيف الأولي، التنظيف الرئيسي والشطف (الحوض الأول)، التطهير (الحوض الثاني) وأرفف التجفيف.","The method includes: pre-cleaning, main washing and rinsing (first sink), sanitising (second sink), and air-drying on the rack.","इस विधि में शामिल है: प्रारंभिक सफ़ाई, मुख्य धुलाई और खंगालना (पहला हौज़), सैनिटाइज़ करना (दूसरा हौज़) और रैक पर सुखाना।","এই পদ্ধতিতে রয়েছে: প্রাথমিক পরিষ্কার, মূল ধোয়া ও ধুয়ে ফেলা (প্রথম বেসিন), জীবাণুমুক্তকরণ (দ্বিতীয় বেসিন) ও র‍্যাকে শুকানো।","Metode ini meliputi: pembersihan awal, pencucian utama dan pembilasan (bak pertama), penyanitasian (bak kedua), dan pengeringan di rak."],["li","التنظيف الأولي: المسح، أو الكشط، أو الشطف، أو النقع لإزالة بقايا الغذاء والمخلفات.","Pre-cleaning: wipe, scrape, rinse or soak to remove food remains and debris.","प्रारंभिक सफ़ाई: भोजन के अवशेष और मलबा हटाने के लिए पोंछें, खुरचें, खंगालें या भिगोएँ।","প্রাথমিক পরিষ্কার: খাবারের অবশেষ ও ময়লা দূর করতে মোছা, খোঁচানো, ধোয়া বা ভেজানো।","Pembersihan awal: lap, kikis, bilas atau rendam untuk menghilangkan sisa makanan dan kotoran."],["li","التنظيف الرئيسي والشطف (الحوض الأول): الغسيل بماء ساخن (حوالي 50°م) والمنظفات، لإزالة بقايا الغذاء والمخلفات العالقة. الشطف بماء نظيف جارٍ لإزالة مخلفات الغسيل وبقايا المنظفات المتبقية.","Main washing and rinsing (first sink): wash in hot water (about 50°C) with detergent to remove food remains and stuck-on dirt. Rinse with clean running water to remove detergent residue.","मुख्य धुलाई और खंगालना (पहला हौज़): गर्म पानी (लगभग 50°C) और डिटर्जेंट से धोएँ ताकि चिपकी गंदगी हटे। डिटर्जेंट के अवशेष हटाने के लिए साफ़ बहते पानी से खंगालें।","মূল ধোয়া ও ধুয়ে ফেলা (প্রথম বেসিন): ডিটারজেন্টসহ গরম পানিতে (প্রায় ৫০°সে) ধুয়ে খাবারের অবশেষ দূর করুন। ডিটারজেন্টের অবশিষ্ট দূর করতে পরিষ্কার চলমান পানিতে ধুয়ে নিন।","Pencucian utama dan pembilasan (bak pertama): cuci dengan air hangat (sekitar 50°C) dan deterjen untuk menghilangkan sisa makanan. Bilas dengan air bersih mengalir untuk menghilangkan sisa deterjen."],["li","التطهير (الحوض الثاني): الغمر في ماء ساخن (75°م لمدة 30 ثانية أو 82°م لمدة 10 ثوانٍ) أو استخدام مطهرات كيميائية خاصة.","Sanitising (second sink): immerse in hot water (75°C for 30 seconds or 82°C for 10 seconds) or use special chemical sanitisers.","सैनिटाइज़ (दूसरा हौज़): गर्म पानी में डुबोएँ (75°C पर 30 सेकंड या 82°C पर 10 सेकंड) या विशेष रासायनिक सैनिटाइज़र इस्तेमाल करें।","জীবাণুমুক্তকরণ (দ্বিতীয় বেসিন): গরম পানিতে ডুবান (৭৫°সে-তে ৩০ সেকেন্ড বা ৮২°সে-তে ১০ সেকেন্ড) অথবা বিশেষ রাসায়নিক জীবাণুনাশক ব্যবহার করুন।","Penyanitasian (bak kedua): rendam dalam air panas (75°C selama 30 detik atau 82°C selama 10 detik) atau gunakan sanitasi kimia khusus."],["li","التجفيف: الترك للتجفيف في الهواء (الأدوات مقلوبة)، أو استخدام مناديل ورقية عالية الامتصاص.","Drying: leave to air-dry (utensils upside down), or use highly absorbent paper towels.","सुखाना: हवा में सूखने दें (बर्तन उल्टे रखकर), या बहुत सोखने वाले कागज़ी तौलिये इस्तेमाल करें।","শুকানো: বাতাসে শুকাতে দিন (পাত্র উল্টে), অথবা শোষক কাগজের তোয়ালে ব্যবহার করুন।","Pengeringan: biarkan kering di udara (peralatan terbalik), atau gunakan tisu sangat menyerap."],["h3","ما هي معايير تنفيذ المهارة؟","What are the standards for doing the skill?","इस कौशल के मानक क्या हैं?","এই দক্ষতার মানদণ্ড কী?","Apa standar pelaksanaan keterampilan ini?"],["li","استخدام الأحواض بشكل صحيح.","Use the sinks correctly.","हौज़ों का सही उपयोग करें।","বেসিনগুলো সঠিকভাবে ব্যবহার করুন।","Gunakan bak dengan benar."],["li","التأكد من درجات الحرارة لكل حوض.","Check the temperature of each sink.","हर हौज़ का तापमान जाँचें।","প্রতিটি বেসিনের তাপমাত্রা যাচাই করুন।","Periksa suhu setiap bak."],["li","الالتزام بتركيزات المنظف والمطهر الموصى بها.","Keep to the recommended detergent and sanitiser strengths.","अनुशंसित क्लीनर और सैनिटाइज़र की सांद्रता का पालन करें।","নির্দেশিত ডিটারজেন্ট ও জীবাণুনাশকের মাত্রা মেনে চলুন।","Patuhi kekuatan deterjen dan sanitasi yang dianjurkan."],["li","الالتزام بأوقات الغمر في حوض التطهير.","Keep to the soaking times in the sanitising sink.","सैनिटाइज़िंग हौज़ में भिगोने का समय पालन करें।","জীবাণুমুক্তকরণ বেসিনে ভেজানোর সময় মেনে চলুন।","Patuhi waktu rendam di bak sanitasi."],["li","ضمان الشطف الجيد بين مرحلتي الغسيل والتطهير.","Make sure there is a good rinse between the washing and sanitising stages.","धुलाई और सैनिटाइज़ेशन के बीच अच्छी तरह खंगालना सुनिश्चित करें।","ধোয়া ও জীবাণুমুক্তকরণের মাঝে ভালোভাবে ধুয়ে নিন।","Pastikan pembilasan yang baik di antara tahap pencucian dan penyanitasian."]]},{"t":["الصحة والسلامة المهنية في منشآت الغذاء","Occupational health and safety in food establishments","खाद्य प्रतिष्ठानों में व्यावसायिक स्वास्थ्य और सुरक्षा","খাদ্য প্রতিষ্ঠানে পেশাগত স্বাস্থ্য ও নিরাপত্তা","Kesehatan dan keselamatan kerja di usaha pangan"],"r":[["h2","الصحة والسلامة المهنية؟","Occupational health and safety?","व्यावसायिक स्वास्थ्य और सुरक्षा?","পেশাগত স্বাস্থ্য ও নিরাপত্তা?","Kesehatan dan keselamatan kerja?"],["p","الصحة والسلامة في أماكن العمل تعني سلامة وصحة جميع الأفراد في مكان العمل وحماية جميع الأفراد من المخاطر، سواء كانوا عاملين، أو العملاء والمستهلكين الذين يزورون المنشأة.","Health and safety at work means keeping everyone in the workplace safe and healthy and protecting them from hazards, whether they are workers, customers or consumers who visit the establishment.","कार्यस्थल पर स्वास्थ्य और सुरक्षा का अर्थ है कार्यस्थल पर हर व्यक्ति की सुरक्षा और सेहत की रक्षा करना, चाहे वे कर्मचारी हों, या प्रतिष्ठान में आने वाले ग्राहक और उपभोक्ता।","কর্মস্থলে স্বাস্থ্য ও নিরাপত্তা মানে কর্মস্থলের সবার নিরাপত্তা ও স্বাস্থ্য রক্ষা এবং ঝুঁকি থেকে সুরক্ষা, তা কর্মী, গ্রাহক বা প্রতিষ্ঠানে আসা ভোক্তা যেই হোক।","Kesehatan dan keselamatan di tempat kerja berarti menjaga semua orang di tempat kerja tetap aman dan sehat serta melindungi dari bahaya, baik pekerja maupun pelanggan dan konsumen yang berkunjung."],["h3","لماذا الصحة والسلامة في العمل مهمة؟","Why are health and safety at work important?","कार्यस्थल पर स्वास्थ्य और सुरक्षा क्यों ज़रूरी है?","কর্মস্থলে স্বাস্থ্য ও নিরাপত্তা কেন গুরুত্বপূর্ণ?","Mengapa kesehatan dan keselamatan kerja penting?"],["li","لحمايتنا من الإصابات والأمراض أثناء العمل.","To protect us from injuries and illness at work.","काम के दौरान चोट और बीमारी से बचाव के लिए।","কাজের সময় আঘাত ও অসুস্থতা থেকে আমাদের রক্ষা করতে।","Untuk melindungi kita dari cedera dan penyakit saat bekerja."],["li","لتوفير بيئة عمل آمنة للجميع.","To provide a safe working environment for everyone.","सभी के लिए सुरक्षित कार्य वातावरण देने के लिए।","সবার জন্য নিরাপদ কর্মপরিবেশ দিতে।","Untuk menyediakan lingkungan kerja yang aman bagi semua orang."],["li","لمنع الحوادث والأضرار في المنشأة.","To prevent accidents and damage in the establishment.","प्रतिष्ठान में दुर्घटनाओं और नुकसान को रोकने के लिए।","প্রতিষ্ঠানে দুর্ঘটনা ও ক্ষতি রোধ করতে।","Untuk mencegah kecelakaan dan kerusakan di usaha."],["h3","من المسؤول عن الصحة والسلامة المهنية؟","Who is responsible for occupational health and safety?","व्यावसायिक स्वास्थ्य और सुरक्षा की ज़िम्मेदारी किसकी है?","পেশাগত স্বাস্থ্য ও নিরাপত্তার দায়িত্ব কার?","Siapa yang bertanggung jawab atas kesehatan dan keselamatan kerja?"],["p","الجميع مسؤول! كل شخص في المنشأة له دور في الحفاظ على الصحة والسلامة.","Everyone is responsible! Every person in the establishment has a role in keeping health and safety.","सब ज़िम्मेदार हैं! प्रतिष्ठान में हर व्यक्ति की स्वास्थ्य और सुरक्षा बनाए रखने में भूमिका है।","সবাই দায়িত্বশীল! প্রতিষ্ঠানের প্রতিটি ব্যক্তির স্বাস্থ্য ও নিরাপত্তা রক্ষায় ভূমিকা আছে।","Semua orang bertanggung jawab! Setiap orang di usaha punya peran menjaga kesehatan dan keselamatan."],["h3","ما هي مصادر الخطر على الصحة والسلامة في منشآت الغذاء؟","What are the sources of health and safety risk in food establishments?","खाद्य प्रतिष्ठानों में स्वास्थ्य और सुरक्षा के लिए जोखिम के स्रोत क्या हैं?","খাদ্য প্রতিষ্ঠানে স্বাস্থ্য ও নিরাপত্তার ঝুঁকির উৎস কী কী?","Apa sumber risiko kesehatan dan keselamatan di usaha pangan?"],["li","العاملون: بسبب الإهمال أو عدم التركيز أو العمل تحت ضغط.","Workers: due to carelessness, lack of focus, or working under pressure.","कर्मचारी: लापरवाही, ध्यान की कमी या दबाव में काम करने के कारण।","কর্মী: অসতর্কতা, মনোযোগের অভাব বা চাপের মধ্যে কাজ করার কারণে।","Pekerja: karena kecerobohan, kurang fokus, atau bekerja di bawah tekanan."],["li","المعدات: عند سوء الاستخدام أو نقص الصيانة.","Equipment: from misuse or lack of maintenance.","उपकरण: गलत उपयोग या रखरखाव की कमी से।","যন্ত্রপাতি: অপব্যবহার বা রক্ষণাবেক্ষণের অভাবে।","Peralatan: karena penyalahgunaan atau kurangnya perawatan."],["li","المواد المستخدمة: خاصة المواد الكيميائية الخطرة.","Materials used: especially dangerous chemicals.","इस्तेमाल होने वाली सामग्री: खासकर खतरनाक रसायन।","ব্যবহৃত উপকরণ: বিশেষ করে বিপজ্জনক রাসায়নিক।","Bahan yang digunakan: terutama bahan kimia berbahaya."],["li","بيئة العمل: مثل سوء الإضاءة أو التهوية أو النظافة.","Work environment: such as poor lighting, ventilation or cleanliness.","कार्य वातावरण: जैसे खराब रोशनी, वेंटिलेशन या सफ़ाई।","কর্মপরিবেশ: যেমন খারাপ আলো, বায়ুচলাচল বা পরিচ্ছন্নতা।","Lingkungan kerja: seperti pencahayaan, ventilasi atau kebersihan yang buruk."],["h3","ما هي آثار المخاطر على الصحة والسلامة في منشآت الغذاء؟","What are the effects of these risks on health and safety in food establishments?","खाद्य प्रतिष्ठानों में इन जोखिमों के स्वास्थ्य और सुरक्षा पर क्या प्रभाव हैं?","খাদ্য প্রতিষ্ঠানে এই ঝুঁকির স্বাস্থ্য ও নিরাপত্তায় কী প্রভাব?","Apa dampak risiko ini terhadap kesehatan dan keselamatan di usaha pangan?"],["li","إصابات: مثل الجروح والحروق.","Injuries: such as cuts and burns.","चोटें: जैसे कटना और जलना।","আঘাত: যেমন কাটা ও পোড়া।","Cedera: seperti luka sayat dan luka bakar."],["li","أمراض: مثل مشاكل التنفس من الأبخرة.","Illness: such as breathing problems from fumes.","बीमारियाँ: जैसे धुएँ/वाष्प से साँस की समस्या।","অসুস্থতা: যেমন ধোঁয়া বা বাষ্পে শ্বাসকষ্ট।","Penyakit: seperti gangguan napas akibat uap."],["n","تذكر دائماً: الحفاظ على بيئة عمل آمنة وصحية هو مسؤولية الجميع!","Always remember: keeping a safe and healthy work environment is everyone's responsibility!","हमेशा याद रखें: सुरक्षित और स्वस्थ कार्य वातावरण बनाए रखना सबकी ज़िम्मेदारी है!","সবসময় মনে রাখুন: নিরাপদ ও স্বাস্থ্যকর কর্মপরিবেশ রক্ষা সবার দায়িত্ব!","Ingat selalu: menjaga lingkungan kerja yang aman dan sehat adalah tanggung jawab semua orang!"]]},{"t":["الوقاية من المخاطر الشائعة على الصحة والسلامة في منشآت الغذاء","Preventing common health and safety risks in food establishments","खाद्य प्रतिष्ठानों में आम स्वास्थ्य और सुरक्षा जोखिमों से बचाव","খাদ্য প্রতিষ্ঠানে সাধারণ স্বাস্থ্য ও নিরাপত্তা ঝুঁকি প্রতিরোধ","Pencegahan risiko kesehatan dan keselamatan yang umum di usaha pangan"],"r":[["p","كعاملين في منشآت الغذاء، من المهم أن نكون على دراية بالأخطار المحتملة في مكان عملنا. هذه الأخطار الشائعة تشمل:","As food-establishment workers, it is important to be aware of the possible hazards in our workplace. Common hazards include:","खाद्य प्रतिष्ठान के कर्मचारी के रूप में, हमें अपने कार्यस्थल के संभावित खतरों के बारे में जागरूक रहना ज़रूरी है। आम खतरों में शामिल हैं:","খাদ্য প্রতিষ্ঠানের কর্মী হিসেবে, কর্মস্থলের সম্ভাব্য ঝুঁকি সম্পর্কে সচেতন থাকা গুরুত্বপূর্ণ। সাধারণ ঝুঁকির মধ্যে রয়েছে:","Sebagai pekerja usaha pangan, penting untuk waspada terhadap bahaya yang mungkin ada di tempat kerja. Bahaya umum meliputi:"],["h3","الحروق","Burns","जलना","পোড়া","Luka bakar"],["li","تأثيرها على العامل: ألم شديد، تشوهات جلدية محتملة، وقد تؤدي إلى إعاقة مؤقتة أو دائمة.","Effect on the worker: severe pain, possible skin scarring, and may cause temporary or permanent disability.","कर्मचारी पर असर: तेज़ दर्द, त्वचा पर संभावित निशान, और अस्थायी या स्थायी अक्षमता।","কর্মীর ওপর প্রভাব: তীব্র ব্যথা, ত্বকে দাগ, এবং অস্থায়ী বা স্থায়ী অক্ষমতা।","Dampak bagi pekerja: nyeri hebat, kemungkinan bekas luka kulit, dan dapat menyebabkan cacat sementara atau permanen."],["li","تأثيرها على المنشأة: تكاليف علاج طبي، خسارة في الإنتاجية، احتمال رفع دعاوى قضائية.","Effect on the establishment: medical treatment costs, lost productivity, possible legal claims.","प्रतिष्ठान पर असर: इलाज का खर्च, उत्पादकता का नुकसान, कानूनी दावों की संभावना।","প্রতিষ্ঠানের ওপর প্রভাব: চিকিৎসা খরচ, উৎপাদনশীলতা হ্রাস, আইনি মামলার ঝুঁকি।","Dampak bagi usaha: biaya pengobatan, kehilangan produktivitas, kemungkinan tuntutan hukum."],["h3","الجروح","Cuts","कटना","কাটা","Luka sayat"],["li","تأثيرها على العامل: فقدان الدم، احتمال الإصابة بالعدوى، وقد يؤدي إلى فقدان القدرة على العمل مؤقتاً.","Effect on the worker: blood loss, risk of infection, and may cause temporary loss of ability to work.","कर्मचारी पर असर: खून बहना, संक्रमण का खतरा, और काम करने की अस्थायी अक्षमता।","কর্মীর ওপর প্রভাব: রক্তক্ষরণ, সংক্রমণের ঝুঁকি, এবং অস্থায়ীভাবে কাজ করার সামর্থ্য হারানো।","Dampak bagi pekerja: kehilangan darah, risiko infeksi, dan dapat menyebabkan hilangnya kemampuan bekerja sementara."],["li","تأثيرها على المنشأة: زيادة في تكاليف التأمين، انخفاض الكفاءة، احتمال تلوث الغذاء.","Effect on the establishment: higher insurance costs, lower efficiency, possible food contamination.","प्रतिष्ठान पर असर: बीमा का खर्च बढ़ना, कार्यक्षमता घटना, भोजन के दूषित होने की संभावना।","প্রতিষ্ঠানের ওপর প্রভাব: বিমা খরচ বৃদ্ধি, দক্ষতা হ্রাস, খাবার দূষণের সম্ভাবনা।","Dampak bagi usaha: kenaikan biaya asuransi, efisiensi menurun, kemungkinan makanan tercemar."],["h3","الانزلاق والتعثر","Slips and trips","फिसलना और ठोकर खाना","পিছলে পড়া ও হোঁচট","Tergelincir dan tersandung"],["li","تأثيرها على العامل: كسور، إصابات في الرأس، إصابات في العمود الفقري.","Effect on the worker: fractures, head injuries, spinal injuries.","कर्मचारी पर असर: हड्डी टूटना, सिर में चोट, रीढ़ की चोट।","কর্মীর ওপর প্রভাব: হাড় ভাঙা, মাথায় আঘাত, মেরুদণ্ডে আঘাত।","Dampak bagi pekerja: patah tulang, cedera kepala, cedera tulang belakang."],["li","تأثيرها على المنشأة: زيادة في أيام الغياب، ارتفاع في تكاليف التعويضات، تدهور في سمعة المنشأة.","Effect on the establishment: more sick days, higher compensation costs, damage to its reputation.","प्रतिष्ठान पर असर: अनुपस्थिति के दिन बढ़ना, मुआवज़े का खर्च बढ़ना, साख को नुकसान।","প্রতিষ্ঠানের ওপর প্রভাব: অনুপস্থিতির দিন বাড়া, ক্ষতিপূরণ খরচ বাড়া, সুনাম ক্ষুণ্ণ হওয়া।","Dampak bagi usaha: lebih banyak hari absen, biaya kompensasi naik, reputasi rusak."],["h3","إصابات الظهر والعضلات","Back and muscle injuries","पीठ और मांसपेशियों की चोट","পিঠ ও পেশির আঘাত","Cedera punggung dan otot"],["li","تأثيرها على العامل: ألم مزمن، تقييد الحركة، انخفاض في جودة الحياة.","Effect on the worker: long-term pain, limited movement, lower quality of life.","कर्मचारी पर असर: लंबे समय तक दर्द, हरकत में रुकावट, जीवन की गुणवत्ता में कमी।","কর্মীর ওপর প্রভাব: দীর্ঘস্থায়ী ব্যথা, নড়াচড়ায় সীমাবদ্ধতা, জীবনমান হ্রাস।","Dampak bagi pekerja: nyeri kronis, gerak terbatas, kualitas hidup menurun."],["li","تأثيرها على المنشأة: انخفاض في الإنتاجية، ارتفاع تكاليف الرعاية الصحية، زيادة في معدل دوران العاملين.","Effect on the establishment: lower productivity, higher health care costs, more staff turnover.","प्रतिष्ठान पर असर: उत्पादकता घटना, स्वास्थ्य सेवा खर्च बढ़ना, कर्मचारियों का आना-जाना बढ़ना।","প্রতিষ্ঠানের ওপর প্রভাব: উৎপাদনশীলতা কমা, স্বাস্থ্যসেবা খরচ বাড়া, কর্মী ছাড়ার হার বাড়া।","Dampak bagi usaha: produktivitas menurun, biaya kesehatan naik, perputaran karyawan meningkat."],["h3","الصدمات الكهربائية","Electric shocks","बिजली का झटका","বৈদ্যুতিক শক","Sengatan listrik"],["li","تأثيرها على العامل: حروق داخلية وخارجية، اضطرابات في ضربات القلب، وفي الحالات الشديدة قد تؤدي إلى الوفاة.","Effect on the worker: internal and external burns, heart rhythm problems, and in severe cases can lead to death.","कर्मचारी पर असर: अंदरूनी और बाहरी जलन, दिल की धड़कन में गड़बड़ी, और गंभीर मामलों में मौत भी।","কর্মীর ওপর প্রভাব: অভ্যন্তরীণ ও বাহ্যিক পোড়া, হৃৎস্পন্দনে অনিয়ম, এবং গুরুতর ক্ষেত্রে মৃত্যুও হতে পারে।","Dampak bagi pekerja: luka bakar dalam dan luar, gangguan detak jantung, dan pada kasus berat dapat menyebabkan kematian."],["li","تأثيرها على المنشأة: توقف العمل، تكاليف للتحقيقات والتعويضات، ضرر كبير لسمعة المنشأة.","Effect on the establishment: work stoppage, investigation and compensation costs, serious damage to its reputation.","प्रतिष्ठान पर असर: काम रुकना, जाँच और मुआवज़े का खर्च, साख को बड़ा नुकसान।","প্রতিষ্ঠানের ওপর প্রভাব: কাজ বন্ধ, তদন্ত ও ক্ষতিপূরণ খরচ, সুনামের বড় ক্ষতি।","Dampak bagi usaha: kerja terhenti, biaya investigasi dan kompensasi, kerusakan serius pada reputasi."],["h3","التعرض للمواد الكيميائية","Exposure to chemicals","रसायनों के संपर्क में आना","রাসায়নিকের সংস্পর্শ","Paparan bahan kimia"],["li","تأثيرها على العامل: تهيج الجلد والعينين، مشاكل في الجهاز التنفسي، احتمال الإصابة بأمراض مزمنة على المدى الطويل.","Effect on the worker: skin and eye irritation, breathing problems, possible long-term chronic illness.","कर्मचारी पर असर: त्वचा और आँखों में जलन, साँस की समस्या, लंबे समय में पुरानी बीमारी की संभावना।","কর্মীর ওপর প্রভাব: ত্বক ও চোখে জ্বালাপোড়া, শ্বাসের সমস্যা, দীর্ঘমেয়াদে দীর্ঘস্থায়ী রোগের আশঙ্কা।","Dampak bagi pekerja: iritasi kulit dan mata, gangguan napas, kemungkinan penyakit kronis jangka panjang."],["li","تأثيرها على المنشأة: تكاليف علاجية عالية، احتمال مواجهة دعاوى قضائية، الحاجة إلى توفير معدات حماية إضافية.","Effect on the establishment: high treatment costs, possible lawsuits, need to provide extra protective equipment.","प्रतिष्ठान पर असर: इलाज का ऊँचा खर्च, कानूनी मामले की संभावना, अतिरिक्त सुरक्षा उपकरण देने की ज़रूरत।","প্রতিষ্ঠানের ওপর প্রভাব: উচ্চ চিকিৎসা খরচ, মামলার ঝুঁকি, অতিরিক্ত সুরক্ষা সরঞ্জাম দেওয়ার প্রয়োজন।","Dampak bagi usaha: biaya pengobatan tinggi, kemungkinan gugatan hukum, perlu menyediakan peralatan pelindung tambahan."],["h3","الحرائق","Fires","आग","আগুন","Kebakaran"],["li","تأثيرها على العامل: حروق شديدة، استنشاق دخان سام، صدمات نفسية.","Effect on the worker: severe burns, breathing in toxic smoke, psychological shock.","कर्मचारी पर असर: तेज़ जलन, ज़हरीला धुआँ साँस में जाना, मानसिक सदमा।","কর্মীর ওপর প্রভাব: তীব্র পোড়া, বিষাক্ত ধোঁয়া শ্বাসে নেওয়া, মানসিক আঘাত।","Dampak bagi pekerja: luka bakar berat, menghirup asap beracun, trauma psikologis."],["li","تأثيرها على المنشأة: خسائر مادية فادحة، توقف العمل لفترات طويلة، فقدان العملاء والسمعة التجارية.","Effect on the establishment: heavy material losses, work stopping for long periods, loss of customers and business reputation.","प्रतिष्ठान पर असर: भारी आर्थिक नुकसान, लंबे समय तक काम बंद, ग्राहकों और व्यापारिक साख का नुकसान।","প্রতিষ্ঠানের ওপর প্রভাব: বড় বস্তুগত ক্ষতি, দীর্ঘদিন কাজ বন্ধ, গ্রাহক ও ব্যবসায়িক সুনাম হারানো।","Dampak bagi usaha: kerugian material besar, operasi terhenti lama, kehilangan pelanggan dan reputasi bisnis."],["p","إدراك هذه المخاطر وتأثيراتها هو الخطوة الأولى نحو الوقاية منها. في الأجزاء القادمة، سنتعمق في دراسة كل خطر على حدة، ونتعلم الإجراءات الوقائية الخاصة بكل منها، سنتعرف على كيفية استخدام معدات الوقاية الشخصية المناسبة، وكيفية اتباع ممارسات العمل الآمنة للحد من هذه المخاطر.","Being aware of these hazards and their effects is the first step to preventing them. In the next parts we will study each hazard in detail, learn the preventive measures for each one, learn how to use the right personal protective equipment, and how to follow safe work practices to reduce these risks.","इन खतरों और उनके असर को समझना उनसे बचाव की पहली सीढ़ी है। आने वाले भागों में हम हर खतरे को विस्तार से पढ़ेंगे, हर एक के बचाव के उपाय सीखेंगे, सही निजी सुरक्षा उपकरण का इस्तेमाल और सुरक्षित कार्य पद्धतियाँ जानेंगे।","এই ঝুঁকি ও এদের প্রভাব সম্পর্কে সচেতনতা প্রতিরোধের প্রথম ধাপ। পরের অংশগুলোতে আমরা প্রতিটি ঝুঁকি বিস্তারিত পড়ব, প্রতিটির প্রতিরোধ ব্যবস্থা শিখব, সঠিক ব্যক্তিগত সুরক্ষা সরঞ্জাম ব্যবহার এবং ঝুঁকি কমাতে নিরাপদ কাজের পদ্ধতি জানব।","Menyadari bahaya ini dan dampaknya adalah langkah pertama untuk mencegahnya. Pada bagian berikutnya kita akan mempelajari setiap bahaya secara mendalam, langkah pencegahannya, cara memakai alat pelindung diri yang tepat, dan cara mengikuti praktik kerja aman untuk mengurangi risiko."],["n","تذكر دائماً: سلامتك وسلامة زملائك والعملاء والمستهلكين تعتمد على يقظتك وحرصك. كن آمناً لتقدم غذاءً آمناً!","Always remember: the safety of you, your colleagues, customers and consumers depends on your alertness and care. Be safe to serve safe food!","हमेशा याद रखें: आपकी, आपके साथियों और ग्राहकों की सुरक्षा आपकी सतर्कता और लगन पर निर्भर है। सुरक्षित रहें, ताकि सुरक्षित भोजन दे सकें!","সবসময় মনে রাখুন: আপনার, সহকর্মী, গ্রাহক ও ভোক্তাদের নিরাপত্তা আপনার সতর্কতা ও যত্নের ওপর নির্ভর করে। নিরাপদ থাকুন, নিরাপদ খাবার দিন!","Ingat selalu: keselamatan Anda, rekan kerja, pelanggan dan konsumen bergantung pada kewaspadaan dan kepedulian Anda. Tetaplah aman agar bisa menyajikan makanan yang aman!"]]},{"t":["الوقاية من حوادث الحروق","Preventing burn accidents","जलने की दुर्घटनाओं से बचाव","পোড়ার দুর্ঘটনা প্রতিরোধ","Mencegah kecelakaan luka bakar"],"r":[["h2","لماذا هذا مهم؟","Why is this important?","यह क्यों ज़रूरी है?","এটি কেন গুরুত্বপূর্ণ?","Mengapa ini penting?"],["p","الحروق من الإصابات الشائعة في منشآت الغذاء. يمكن أن تسبب ألماً شديداً وتؤثر على قدرتك على العمل. الوقاية من الحروق تحافظ على سلامتك وتضمن استمرارية العمل بكفاءة.","Burns are a common injury in food establishments. They can cause severe pain and affect your ability to work. Preventing burns keeps you safe and makes sure work continues efficiently.","खाद्य प्रतिष्ठानों में जलना एक आम चोट है। इससे तेज़ दर्द हो सकता है और काम करने की क्षमता पर असर पड़ सकता है। जलने से बचाव आपकी सुरक्षा करता है और काम सुचारु रूप से चलता है।","খাদ্য প্রতিষ্ঠানে পোড়া একটি সাধারণ আঘাত। এতে তীব্র ব্যথা হতে পারে এবং কাজ করার সামর্থ্যে প্রভাব পড়ে। পোড়া প্রতিরোধ আপনাকে নিরাপদ রাখে এবং কাজ দক্ষতার সঙ্গে চালু থাকে।","Luka bakar adalah cedera umum di usaha pangan. Bisa menyebabkan nyeri hebat dan memengaruhi kemampuan kerja Anda. Mencegah luka bakar menjaga keselamatan Anda dan kelancaran kerja."],["h3","ما هي أسباب حوادث الحروق الشائعة؟","What are the common causes of burn accidents?","जलने की आम दुर्घटनाओं के कारण क्या हैं?","পোড়ার সাধারণ দুর্ঘটনার কারণ কী?","Apa penyebab umum kecelakaan luka bakar?"],["li","السوائل الساخنة (مثل الزيوت والمرق).","Hot liquids (such as oil and broth).","गर्म तरल पदार्थ (जैसे तेल और शोरबा)।","গরম তরল (যেমন তেল ও ঝোল)।","Cairan panas (seperti minyak dan kaldu)."],["li","البخار.","Steam.","भाप।","বাষ্প।","Uap."],["li","الأسطح الساخنة (مثل المواقد والأفران والشوايات).","Hot surfaces (such as stoves, ovens and grills).","गर्म सतहें (जैसे चूल्हा, ओवन और ग्रिल)।","গরম তল (যেমন চুলা, ওভেন ও গ্রিল)।","Permukaan panas (seperti kompor, oven, dan pemanggang)."],["li","الأواني والصواني الساخنة.","Hot pots and trays.","गर्म बर्तन और ट्रे।","গরম পাত্র ও ট্রে।","Panci dan nampan panas."],["h3","كيف نمنع حوادث الحروق الشائعة؟","How do we prevent common burn accidents?","आम जलने की दुर्घटनाएँ कैसे रोकें?","সাধারণ পোড়ার দুর্ঘটনা কীভাবে রোধ করবেন?","Bagaimana mencegah kecelakaan luka bakar umum?"],["h3","عند الطهي:","During cooking:","पकाते समय:","রান্নার সময়:","Saat memasak:"],["li","أغلق المواقد والأفران فور الانتهاء من استخدامها.","Turn off stoves and ovens as soon as you finish using them.","इस्तेमाल खत्म होते ही चूल्हे और ओवन बंद करें।","ব্যবহার শেষ হলেই চুলা ও ওভেন বন্ধ করুন।","Matikan kompor dan oven segera setelah selesai digunakan."],["li","اجعل مقابض الأواني بعيدة عن اللهب دائماً.","Keep pot handles away from the flame at all times.","बर्तनों के हैंडल हमेशा आग से दूर रखें।","পাত্রের হাতল সবসময় আগুন থেকে দূরে রাখুন।","Selalu jauhkan pegangan panci dari api."],["li","استخدم قفازات الفرن عند التعامل مع الأواني الساخنة.","Use oven gloves when handling hot pots.","गर्म बर्तन पकड़ते समय ओवन ग्लव्ज़ इस्तेमाल करें।","গরম পাত্র ধরার সময় ওভেন গ্লাভস ব্যবহার করুন।","Gunakan sarung tangan oven saat memegang panci panas."],["h3","عند نقل الأشياء الساخنة:","When moving hot items:","गर्म चीज़ें ले जाते समय:","গরম জিনিস সরানোর সময়:","Saat memindahkan benda panas:"],["li","اطلب المساعدة لحمل الأواني الثقيلة.","Ask for help to carry heavy pots.","भारी बर्तन उठाने के लिए मदद माँगें।","ভারী পাত্র বইতে সাহায্য চান।","Minta bantuan untuk mengangkat panci berat."],["li","دع الزيوت والدهون تبرد قبل نقلها.","Let oil and fat cool before moving them.","तेल और चिकनाई को ले जाने से पहले ठंडा होने दें।","তেল ও চর্বি সরানোর আগে ঠান্ডা হতে দিন।","Biarkan minyak dan lemak dingin sebelum dipindahkan."],["li","احذر من البخار عند فتح الغطاءات.","Be careful of steam when opening lids.","ढक्कन खोलते समय भाप से सावधान रहें।","ঢাকনা খোলার সময় বাষ্পের ব্যাপারে সতর্ক থাকুন।","Waspada uap saat membuka tutup."],["h3","عند التنظيف:","During cleaning:","सफ़ाई के समय:","পরিষ্কারের সময়:","Saat membersihkan:"],["li","تأكد من برودة المعدات قبل تنظيفها.","Make sure equipment is cool before cleaning it.","सफ़ाई से पहले सुनिश्चित करें कि उपकरण ठंडे हों।","পরিষ্কারের আগে যন্ত্রপাতি ঠান্ডা কি না নিশ্চিত করুন।","Pastikan peralatan dingin sebelum dibersihkan."],["li","ارتدِ قفازات واقية عند استخدام المنظفات الكيميائية.","Wear protective gloves when using chemical cleaners.","रसायन क्लीनर इस्तेमाल करते समय सुरक्षात्मक दस्ताने पहनें।","রাসায়নিক ক্লিনার ব্যবহারে সুরক্ষামূলক গ্লাভস পরুন।","Pakai sarung tangan pelindung saat memakai pembersih kimia."],["h3","ما هي الإجراءات الواجب اتباعها عند حدوث حرق أثناء العمل؟","What must be done when a burn happens at work?","काम के दौरान जलने पर क्या करना चाहिए?","কাজের সময় পুড়ে গেলে কী করতে হবে?","Apa yang harus dilakukan jika terjadi luka bakar saat bekerja?"],["li","تبرّد فوراً: باستخدام الماء البارد لمدة 10-20 دقيقة لتخفيف الألم.","Cool it immediately: use cold water for 10–20 minutes to ease the pain.","तुरंत ठंडा करें: दर्द कम करने के लिए 10–20 मिनट तक ठंडे पानी का इस्तेमाल करें।","সঙ্গে সঙ্গে ঠান্ডা করুন: ব্যথা কমাতে ১০–২০ মিনিট ঠান্ডা পানি ব্যবহার করুন।","Dinginkan segera: gunakan air dingin selama 10–20 menit untuk meredakan nyeri."],["li","نقيّم الإصابة: مدى شدة الحرق وما إذا كان يحتاج إلى رعاية طبية.","Assess the injury: how severe the burn is and whether it needs medical care.","चोट का आकलन करें: जलना कितना गंभीर है और क्या उसे चिकित्सा की ज़रूरत है।","আঘাত মূল্যায়ন করুন: পোড়া কতটা গুরুতর এবং চিকিৎসা লাগবে কি না।","Nilai cedera: seberapa parah lukanya dan apakah perlu perawatan medis."],["li","استخدام الإسعافات الأولية: ضع المراهم والضمادات المناسبة من صندوق الإسعافات الأولية.","First aid: apply suitable ointments and dressings from the first aid box.","प्राथमिक उपचार: प्राथमिक उपचार बॉक्स से उचित मरहम और पट्टी लगाएँ।","প্রাথমিক চিকিৎসা: প্রাথমিক চিকিৎসা বাক্স থেকে উপযুক্ত মলম ও ড্রেসিং লাগান।","P3K: oleskan salep dan perban yang sesuai dari kotak P3K."],["li","تجنب الأخطاء الشائعة: استخدام الثلج المباشر أو المواد الدهنية على الحرق.","Avoid common mistakes: putting ice directly on the burn, or greasy substances on it.","आम गलतियों से बचें: जले पर सीधे बर्फ़ या चिकनाई वाली चीज़ें न लगाएँ।","সাধারণ ভুল এড়িয়ে চলুন: পোড়ায় সরাসরি বরফ বা চর্বিজাতীয় কিছু লাগাবেন না।","Hindari kesalahan umum: jangan letakkan es langsung atau bahan berminyak pada luka bakar."],["li","ابلغ المشرف على الفور.","Report to the supervisor immediately.","तुरंत सुपरवाइज़र को बताएँ।","তৎক্ষণাৎ সুপারভাইজারকে জানান।","Segera laporkan kepada supervisor."],["li","دعـــم الزملاء: تقديم المساعدة والحفاظ على الهدوء في المكان.","Support colleagues: help them and keep calm in the area.","साथियों की मदद करें: सहायता दें और जगह पर शांति बनाए रखें।","সহকর্মীদের সহায়তা করুন: সাহায্য করুন ও জায়গাটিতে শান্ত থাকুন।","Dukung rekan kerja: bantu mereka dan tetap tenang di area itu."]]},{"t":["الوقاية من حوادث الجروح والتعثر والكهرباء والمواد الكيميائية","Preventing cuts, slips, electrical and chemical accidents","कटने, फिसलने, बिजली और रसायन दुर्घटनाओं से बचाव","কাটা, পিছলানো, বিদ্যুৎ ও রাসায়নিক দুর্ঘটনা প্রতিরোধ","Mencegah luka sayat, tergelincir, kecelakaan listrik dan bahan kimia"],"r":[["h2","السلامة عند استخدام الأدوات الحادة","Safety when using sharp tools","धारदार औज़ारों के इस्तेमाल में सुरक्षा","ধারালো সরঞ্জাম ব্যবহারে নিরাপত্তা","Keselamatan saat memakai alat tajam"],["p","العمل في منشآت الغذاء قد يتطلب استخدام أدوات حادة ومعدات، من الممكن أن تسبب إصابات. هذه الإصابات قد تتراوح من جروح بسيطة إلى إصابات خطيرة.","Work in food establishments may need sharp tools and equipment, which can cause injuries. These injuries can range from minor cuts to serious harm.","खाद्य प्रतिष्ठानों में धारदार औज़ार और मशीनें चाहिए, जिनसे चोट लग सकती है। यह चोट मामूली कट से लेकर गंभीर नुकसान तक हो सकती है।","খাদ্য প্রতিষ্ঠানে ধারালো সরঞ্জাম ও যন্ত্রপাতি লাগতে পারে, যার কারণে আঘাত হতে পারে। সাধারণ কাটা থেকে গুরুতর আঘাত পর্যন্ত হতে পারে।","Bekerja di usaha pangan mungkin memerlukan alat dan peralatan tajam yang dapat menyebabkan cedera, mulai dari luka ringan hingga cedera serius."],["h3","ما هي أسباب حوادث الجروح الشائعة؟","What are the common causes of cut accidents?","कटने की आम दुर्घटनाओं के कारण क्या हैं?","কাটার সাধারণ দুর্ঘটনার কারণ কী?","Apa penyebab umum kecelakaan luka sayat?"],["li","استخدام غير صحيح للسكاكين والأدوات الحادة.","Incorrect use of knives and sharp tools.","चाकू और धारदार औज़ारों का गलत इस्तेमाल।","ছুরি ও ধারালো সরঞ্জামের ভুল ব্যবহার।","Penggunaan pisau dan alat tajam yang salah."],["li","عدم الانتباه أثناء العمل.","Not paying attention while working.","काम के दौरान ध्यान न देना।","কাজের সময় মনোযোগ না দেওয়া।","Tidak memperhatikan saat bekerja."],["li","استخدام أدوات غير مناسبة أو معطلة.","Using unsuitable or faulty tools.","अनुपयुक्त या खराब औज़ार इस्तेमाल करना।","অনুপযুক্ত বা ত্রুটিপূর্ণ সরঞ্জাম ব্যবহার।","Menggunakan alat yang tidak sesuai atau rusak."],["h3","كيف نمنع حوادث الجروح الشائعة؟","How do we prevent common cut accidents?","आम कटने की दुर्घटनाएँ कैसे रोकें?","সাধারণ কাটার দুর্ঘটনা কীভাবে রোধ করবেন?","Bagaimana mencegah kecelakaan luka sayat umum?"],["li","عند استخدام السكاكين: اختر السكين المناسب لكل مهمة، قطع الغذاء بعيداً عن جسمك دائماً، حافظ على حدة السكاكين، اغسل وخزن السكاكين بشكل منفصل.","When using knives: choose the right knife for each task, always cut away from your body, keep knives sharp, and wash and store knives separately.","चाकू इस्तेमाल करते समय: हर काम के लिए सही चाकू चुनें, हमेशा शरीर से दूर की ओर काटें, चाकू की धार बनाए रखें, और चाकू अलग से धोकर रखें।","ছুরি ব্যবহারের সময়: প্রতিটি কাজের জন্য সঠিক ছুরি বেছে নিন, সবসময় শরীর থেকে দূরে কাটুন, ছুরি ধারালো রাখুন, এবং আলাদাভাবে ধুয়ে রাখুন।","Saat memakai pisau: pilih pisau yang tepat untuk tiap tugas, selalu potong menjauhi tubuh, jaga pisau tetap tajam, dan cuci serta simpan pisau secara terpisah."],["li","عند استخدام المعدات الكهربائية: استخدم أدوات الدفع الخاصة مع الأطعمة، افصل الكهرباء قبل التنظيف أو الصيانة، اتبع إرشادات الشركة المصنعة دائماً، ارتدِ القفازات الخاصة عند التعامل مع كميات كبيرة أو مناشير كهربائية.","When using electrical equipment: use the special pushers with food, unplug before cleaning or maintenance, always follow the manufacturer's instructions, and wear special gloves when handling large quantities or electric saws.","बिजली के उपकरण इस्तेमाल करते समय: भोजन के लिए बने पुशर का उपयोग करें, सफ़ाई या रखरखाव से पहले प्लग निकालें, हमेशा निर्माता के निर्देश मानें, और बड़ी मात्रा या बिजली की आरी के साथ विशेष दस्ताने पहनें।","বৈদ্যুতিক যন্ত্র ব্যবহারের সময়: খাবারের জন্য বিশেষ পুশার ব্যবহার করুন, পরিষ্কার বা রক্ষণাবেক্ষণের আগে প্লাগ খুলুন, সবসময় প্রস্তুতকারকের নির্দেশ মানুন, এবং বড় পরিমাণ বা বৈদ্যুতিক করাত ধরার সময় বিশেষ গ্লাভস পরুন।","Saat memakai peralatan listrik: gunakan pendorong khusus untuk makanan, cabut colokan sebelum dibersihkan atau dirawat, selalu ikuti instruksi pabrikan, dan pakai sarung tangan khusus saat menangani jumlah besar atau gergaji listrik."],["h3","ما الإجراءات الواجب اتباعها عند حدوث جرح أثناء العمل؟","What must be done when a cut happens at work?","काम के दौरान कटने पर क्या करना चाहिए?","কাজের সময় কেটে গেলে কী করতে হবে?","Apa yang harus dilakukan jika terjadi luka sayat saat bekerja?"],["li","التوقف عن العمل: لمنع تلوث الغذاء وتقليل خطر تفاقم الإصابة.","Stop working: to prevent food contamination and reduce the risk of the injury getting worse.","काम रोकें: भोजन के दूषित होने और चोट बढ़ने का खतरा कम करने के लिए।","কাজ বন্ধ করুন: খাবার দূষণ রোধ ও আঘাত বাড়ার ঝুঁকি কমাতে।","Hentikan pekerjaan: untuk mencegah kontaminasi makanan dan mengurangi risiko cedera memburuk."],["li","إبلاغ المشرف: لضمان توثيق الحادث والحصول على المساعدة.","Report to the supervisor: to make sure the incident is recorded and to get help.","सुपरवाइज़र को बताएँ: घटना दर्ज हो और मदद मिले।","সুপারভাইজারকে জানান: ঘটনা নথিভুক্ত হয় ও সহায়তা পাওয়া যায়।","Laporkan kepada supervisor: memastikan kejadian tercatat dan mendapat bantuan."],["li","تنظيف وتغطية الجرح: غسل الجرح بالماء والصابون واستخدام ضمادة مقاومة للماء.","Clean and cover the wound: wash it with water and soap and use a waterproof dressing.","घाव की सफ़ाई और ढकना: घाव को पानी और साबुन से धोएँ और वाटरप्रूफ़ पट्टी लगाएँ।","ক্ষত পরিষ্কার ও ঢাকা: পানি ও সাবান দিয়ে ধুয়ে জলরোধী ড্রেসিং লাগান।","Bersihkan dan tutup luka: cuci dengan air dan sabun, lalu pakai plester anti air."],["li","التخلص من الغذاء الملوث: إزالة أي غذاء تعرض للدم وتنظيف منطقة العمل.","Dispose of contaminated food: remove any food exposed to blood and clean the work area.","दूषित भोजन हटाएँ: जो भोजन खून के संपर्क में आया हो उसे हटाएँ और काम की जगह साफ़ करें।","দূষিত খাবার ফেলুন: রক্তের সংস্পর্শে আসা খাবার সরান এবং কাজের জায়গা পরিষ্কার করুন।","Buang makanan tercemar: singkirkan makanan yang terkena darah dan bersihkan area kerja."],["li","تقييم الحاجة للرعاية الطبية: طلب المساعدة الطبية للجروح العميقة أو الكبيرة.","Assess the need for medical care: get medical help for deep or large cuts.","चिकित्सा सहायता की ज़रूरत जाँचें: गहरे या बड़े कट के लिए डॉक्टर से मदद लें।","চিকিৎসা প্রয়োজন কি না যাচাই: গভীর বা বড় কাটায় চিকিৎসক সহায়তা নিন।","Nilai kebutuhan perawatan medis: cari bantuan medis untuk luka yang dalam atau besar."],["li","العودة للعمل بحذر: التأكد من شفاء الجرح قبل التعامل مع الغذاء ومراقبة الضمادة.","Return to work carefully: make sure the wound has healed before handling food, and check the dressing.","सावधानी से काम पर लौटें: भोजन छूने से पहले घाव भरा हो, और पट्टी की जाँच करें।","সতর্কভাবে কাজে ফিরুন: খাবার ছোঁয়ার আগে ক্ষত সেরে গেছে কি না নিশ্চিত করুন এবং ড্রেসিং দেখুন।","Kembali bekerja dengan hati-hati: pastikan luka sudah sembuh sebelum menangani makanan dan pantau pembalutnya."],["h2","الوقاية من حوادث الانزلاق والتعثر","Preventing slip and trip accidents","फिसलने और ठोकर की दुर्घटनाओं से बचाव","পিছলানো ও হোঁচটের দুর্ঘটনা প্রতিরোধ","Mencegah kecelakaan tergelincir dan tersandung"],["p","تشكل حوادث الانزلاق والتعثر حوالي 35% من الإصابات في منشآت الغذاء، وهي أكثر شيوعاً مقارنة بأماكن العمل الأخرى. يمكن أن تؤدي هذه الحوادث إلى إصابات بسيطة كالرضوض والخدوش، أو إصابات أكثر خطورة مثل كسور العظام وإصابات الرأس، وقد تصل إلى حالات خطيرة مثل إصابات الرأس أو الشلل.","Slips and trips make up about 35% of injuries in food establishments, more common than in other workplaces. These accidents can cause minor injuries such as bruises and scrapes, or more serious ones such as broken bones and head injuries, and in severe cases can lead to head injuries or paralysis.","खाद्य प्रतिष्ठानों में फिसलने और ठोकर से लगने वाली चोटें लगभग 35% होती हैं, जो दूसरे कार्यस्थलों से अधिक आम हैं। इनसे हल्की चोटें (जैसे नील और खरोंच) या गंभीर चोटें (जैसे हड्डी टूटना और सिर की चोट) हो सकती हैं, और बहुत गंभीर मामलों में सिर की चोट या लकवा।","খাদ্য প্রতিষ্ঠানে পিছলে পড়া ও হোঁচটের কারণে প্রায় ৩৫% আঘাত হয়, যা অন্য কর্মস্থলের তুলনায় বেশি। এতে সামান্য আঘাত (যেমন কালশিটে ও ছড়ে যাওয়া) বা গুরুতর আঘাত (যেমন হাড় ভাঙা ও মাথায় আঘাত) হতে পারে, এবং মারাত্মক ক্ষেত্রে মাথার আঘাত বা পক্ষাঘাতও হতে পারে।","Tergelincir dan tersandung menyumbang sekitar 35% cedera di usaha pangan, lebih sering dibanding tempat kerja lain. Kecelakaan ini dapat menyebabkan luka ringan seperti memar dan lecet, atau cedera serius seperti patah tulang dan cedera kepala, bahkan kelumpuhan pada kasus berat."],["h3","ما هي أسباب حوادث الانزلاق والتعثر الشائعة؟","What are the common causes of slip and trip accidents?","फिसलने और ठोकर की आम दुर्घटनाओं के कारण क्या हैं?","পিছলে পড়া ও হোঁচটের সাধারণ কারণ কী?","Apa penyebab umum kecelakaan tergelincir dan tersandung?"],["li","الانزلاق: أرضيات مبتلة بالماء أو الزيوت، أرضيات غير مستوية.","Slipping: floors wet with water or oil, uneven floors.","फिसलना: पानी या तेल से गीले फ़र्श, असमान फ़र्श।","পিছলানো: পানি বা তেলে ভেজা মেঝে, অসমান মেঝে।","Tergelincir: lantai basah oleh air atau minyak, lantai tidak rata."],["li","التعثر: عوائق في ممرات العمل، أرضيات غير مستوية.","Tripping: obstacles in work aisles, uneven floors.","ठोकर: काम के रास्तों में रुकावटें, असमान फ़र्श।","হোঁচট: কাজের পথে বাধা, অসমান মেঝে।","Tersandung: rintangan di lorong kerja, lantai tidak rata."],["h3","كيف نمنع حوادث الانزلاق والتعثر الشائعة؟","How do we prevent common slip and trip accidents?","आम फिसलने और ठोकर की दुर्घटनाएँ कैसे रोकें?","সাধারণ পিছলানো ও হোঁচটের দুর্ঘটনা কীভাবে রোধ করবেন?","Bagaimana mencegah kecelakaan tergelincir dan tersandung umum?"],["h3","للوقاية من الانزلاق:","To prevent slipping:","फिसलने से बचने के लिए:","পিছলানো রোধে:","Untuk mencegah tergelincir:"],["li","نظف وجفف الانسكابات فوراً (ماء، ثلج، مشروبات).","Clean and dry spills immediately (water, ice, drinks).","छलकने वाली चीज़ें (पानी, बर्फ़, पेय) तुरंत साफ़ व सूखी करें।","পানি, বরফ, পানীয়ের ছলকানো তরল তৎক্ষণাৎ মুছে শুক
