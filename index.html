<title>اختبار الوعي الصحي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap">
<style>
  /* Layout: single column, RTL, cards. Colors are tokens. */
  :root {
    --bg: #f7f8fa; --surface: #ffffff; --fg: #1a1d23; --fg-soft: #5a6072;
    --accent: #0f766e; --accent-light: #e6f4f2; --on-accent: #ffffff;
    --success: #1a8a4a; --success-bg: #e8f7ef;
    --danger: #c0392b; --danger-bg: #fdecea;
    --border: #e2e6ed; --radius: 14px; --shadow: 0 2px 12px rgba(0,0,0,0.07);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151c; --surface: #1c2030; --fg: #e8ecf4; --fg-soft: #8892a8;
      --accent: #2dd4bf; --accent-light: #12302d; --on-accent: #042f2b;
      --success: #34c974; --success-bg: #0f2a1c;
      --danger: #f07070; --danger-bg: #2a0f0f;
      --border: #2a3045; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151c; --surface: #1c2030; --fg: #e8ecf4; --fg-soft: #8892a8;
    --accent: #2dd4bf; --accent-light: #12302d; --on-accent: #042f2b;
    --success: #34c974; --success-bg: #0f2a1c;
    --danger: #f07070; --danger-bg: #2a0f0f;
    --border: #2a3045; color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--fg);
    min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding-block: 24px; padding-inline: 16px; direction: rtl;
  }
  .app { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .header { background: linear-gradient(135deg, #0f766e 0%, #115e59 100%); border-radius: 18px; padding: 24px 26px; color: #fff; box-shadow: 0 10px 30px -12px rgba(15,118,110,.55); }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand-icon { flex: 0 0 auto; width: 52px; height: 52px; border-radius: 14px; background: rgba(255,255,255,.16); display: grid; place-items: center; }
  .brand-icon svg { width: 28px; height: 28px; }
  .header h1 { font-size: 1.9rem; font-weight: 900; line-height: 1.3; }
  .header p { font-size: 1.1rem; opacity: 0.88; margin-top: 4px; }
  .lang-bar {
    background: var(--surface); border-radius: 999px; padding: 5px;
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px;
    box-shadow: 0 1px 2px rgba(15,23,42,.05), 0 6px 18px rgba(15,23,42,.05);
  }
  .lang-bar span { display: none; }
  .lang-btn {
    background: transparent; border: none; border-radius: 999px;
    padding: 9px 2px; white-space: nowrap; font-family: 'Cairo', sans-serif; font-size: 0.92rem;
    font-weight: 700; color: var(--fg-soft); cursor: pointer;
  }
  .lang-btn.active { background: var(--accent); color: var(--on-accent); }
  .screen { display: none; flex-direction: column; gap: 16px; }
  .screen.active { display: flex; }
  .card {
    background: var(--surface); border-radius: 18px; padding: 24px;
    box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 10px 30px rgba(15,23,42,.06);
  }
  .form-card { display: flex; flex-direction: column; gap: 18px; padding: 28px 24px; }
  .form-card h2 { font-size: 1.6rem; margin-bottom: 0; }
  .form-card p { margin-bottom: 4px; }
  .card h2 { font-size: 1.45rem; font-weight: 800; margin-bottom: 6px; }
  .card p { color: var(--fg-soft); font-size: 1.15rem; line-height: 1.7; }
  .input-group { display: flex; flex-direction: column; gap: 6px; }
  .input-group label { font-size: 0.95rem; font-weight: 700; color: var(--fg); }
  .text-input {
    background: var(--bg); border: 1.5px solid transparent; border-radius: 12px;
    padding: 15px 16px; font-family: 'Cairo', sans-serif; font-size: 1rem;
    color: var(--fg); width: 100%;
  }
  .text-input:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 4px var(--accent-light); }
  .btn-block { width: 100%; padding: 17px 24px; font-size: 1.1rem; }
  .btn {
    padding: 18px 32px; border-radius: 10px; font-family: 'Cairo', sans-serif;
    font-size: 1rem; font-weight: 800; cursor: pointer; border: none; text-align: center;
  }
  .btn-primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 8px 18px -8px var(--accent); }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-secondary { background: var(--surface); color: var(--accent); border: 1.5px solid var(--border); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-small { padding: 8px 14px; font-size: 0.85rem; }
  .btn:focus-visible, .lang-btn:focus-visible, .option-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .nav-link {
    font-family: 'Cairo', sans-serif; font-size: 1.05rem; font-weight: 700;
    color: var(--fg-soft); background: none; border: none; cursor: pointer; padding: 6px 12px; border-radius: 8px;
  }
  .nav-link:hover { color: var(--accent); background: var(--accent-light); }
  .quiz-header {
    background: var(--surface); border-radius: var(--radius); padding: 14px 20px;
    border: 1px solid var(--border); display: flex; align-items: center;
    justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .quiz-meta { font-size: 1.05rem; color: var(--fg-soft); font-weight: 700; }
  .progress-bar { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; flex: 1; min-width: 80px; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.3s ease; }
  .q-counter { font-size: 1.05rem; color: var(--fg-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .q-category {
    display: inline-flex; background: var(--accent-light); color: var(--accent);
    font-size: 0.78rem; font-weight: 700; padding: 4px 10px; border-radius: 99px; margin-bottom: 14px;
  }
  .q-text { font-size: 1.45rem; font-weight: 700; line-height: 1.7; margin-bottom: 20px; text-wrap: balance; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px;
    padding: 18px 22px; font-family: 'Cairo', sans-serif; font-size: 1.25rem; font-weight: 600;
    color: var(--fg); cursor: pointer; text-align: right; display: flex; align-items: center; gap: 10px;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-light); }
  .option-btn.picked { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
  .option-btn:disabled { cursor: default; }
  .opt-label {
    width: 34px; height: 34px; border-radius: 50%; background: var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.78rem; font-weight: 800; flex-shrink: 0;
  }
  .option-btn.picked .opt-label { background: var(--accent); color: #fff; }
  .next-row { display: flex; justify-content: flex-start; }
  .score-circle {
    width: 120px; height: 120px; border-radius: 50%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: 2rem; font-weight: 900; border: 6px solid; margin: 0 auto;
  }
  .score-circle.pass { border-color: var(--success); color: var(--success); background: var(--success-bg); }
  .score-circle.fail { border-color: var(--danger); color: var(--danger); background: var(--danger-bg); }
  .score-circle span { font-size: 0.72rem; font-weight: 700; opacity: 0.8; }
  .result-card { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 32px 24px; }
  .result-name { font-size: 1.3rem; font-weight: 900; }
  .verdict { padding: 8px 22px; border-radius: 99px; font-size: 1rem; font-weight: 800; }
  .verdict-pass { background: var(--success-bg); color: var(--success); }
  .verdict-fail { background: var(--danger-bg); color: var(--danger); }
  .result-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .records-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .records-table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
  .records-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; background: var(--surface); }
  .records-table th { background: var(--accent); color: #fff; padding: 12px 16px; font-weight: 700; text-align: right; white-space: nowrap; }
  .records-table td { padding: 12px 16px; border-top: 1px solid var(--border); vertical-align: middle; }
  .badge { display: inline-flex; padding: 3px 10px; border-radius: 99px; font-size: 0.8rem; font-weight: 800; }
  .badge-pass { background: var(--success-bg); color: var(--success); }
  .badge-fail { background: var(--danger-bg); color: var(--danger); }
  .password-prompt { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 36px 24px; }
  .password-prompt p { color: var(--fg-soft); font-size: 0.9rem; }
  .pw-input { max-width: 280px; text-align: center; direction: ltr; }
  .error-msg { color: var(--danger); font-size: 0.85rem; font-weight: 600; }
  .empty-state { color: var(--fg-soft); font-size: 0.92rem; padding: 32px; text-align: center; }
  .bottom-nav { display: flex; justify-content: center; }
  .rev-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
  .rev-head { font-weight: 800; color: var(--accent); font-size: 0.92rem; }
  .rev-lang { border-top: 1px dashed var(--border); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .rev-lbl { font-size: 0.75rem; font-weight: 800; color: var(--fg-soft); }
  .rev-q { font-weight: 700; line-height: 1.6; }
  .rev-opt { font-size: 0.92rem; padding: 6px 10px; border-radius: 8px; background: var(--bg); }
  .study-sec { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
  .study-sec h3 { color: var(--accent); font-size: 1.1rem; font-weight: 900; border-bottom: 2px solid var(--accent-light); padding-bottom: 8px; }
  .study-it { display: flex; flex-direction: column; gap: 4px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .study-it:last-child { border-bottom: none; padding-bottom: 0; }
  .study-q { font-weight: 700; line-height: 1.6; }
  .study-a { color: var(--success); font-weight: 600; line-height: 1.6; }
  .lang-chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .rev-opt.ok { background: var(--success-bg); color: var(--success); font-weight: 700; }
  .rev-opt.bad { background: rgba(220,38,38,.14); color: var(--danger); font-weight: 700; }
  .num-btn.res-bad { background: #d64545; border-color: #d64545; color: #fff; }
  .num-btn.res-ok { background: #1e9e62; border-color: #1e9e62; color: #fff; }
  .match-svg .match-line.res-line-bad { stroke: #d64545; }
  .match-svg .match-line.res-line-ok { stroke: #1e9e62; }

  .note-wrap { display: flex; flex-direction: column; gap: 14px; }
  .note-nav { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .note-sel { flex: 1; min-width: 160px; padding: 8px; border-radius: var(--radius); border: 1px solid var(--border); font: inherit; background: var(--surface); }
  .note-content { display: flex; flex-direction: column; gap: 12px; }
  .note-title { color: var(--accent); font-size: 1.35rem; font-weight: 900; border-bottom: 2px solid var(--accent-light); padding-bottom: 8px; }
  .note-h2 { color: var(--accent); font-size: 1.1rem; font-weight: 900; margin-top: 8px; }
  .note-h3 { font-size: 1rem; font-weight: 800; margin-top: 4px; }
  .note-p { line-height: 1.8; }
  .note-ul { padding-inline-start: 22px; display: flex; flex-direction: column; gap: 6px; line-height: 1.7; }
  .note-callout { background: var(--accent-light); border-inline-start: 4px solid var(--accent); border-radius: var(--radius); padding: 10px 14px; font-weight: 700; line-height: 1.7; }
  .note-icon { display: flex; justify-content: center; }
  .note-icon svg { width: 72px; height: 72px; color: var(--accent); background: var(--accent-light); border-radius: 50%; padding: 14px; box-sizing: content-box; }
  .note-lang-sec { display: flex; flex-direction: column; gap: 12px; padding-bottom: 14px; border-bottom: 2px dashed var(--border); }
  .note-lang-sec:last-child { border-bottom: none; }
  .ord-row { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: 12px; background: var(--surface); }
  .ord-text { font-weight: 700; line-height: 1.6; }
  .ord-ranks { display: flex; gap: 8px; }
  .num-btn { flex: 1; padding: 10px 0; border-radius: 10px; border: 1.5px solid var(--border); background: var(--bg); color: var(--fg); font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 1rem; cursor: pointer; }
  .num-btn.picked { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .match-box { position: relative; }
  .match-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
  .match-svg .match-line { stroke: var(--accent); stroke-width: 3; stroke-linecap: round; }
  .match-cols { position: relative; z-index: 1; display: flex; justify-content: space-between; gap: 48px; }
  .match-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .match-item { min-height: 58px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); color: var(--fg); font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 0.92rem; line-height: 1.4; text-align: center; cursor: pointer; }
  .match-item.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
  .match-item.linked { background: var(--accent-light); border-color: var(--accent); }
</style>

<div class="app">
  <div class="header">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg></span>
      <div>
        <h1 id="hdr-title">اختبار الوعي الصحي للموظفين</h1>
        <p id="hdr-sub">٦٠ سؤال من بنك أسئلة متنوع</p>
      </div>

  <div class="lang-bar">
    <span id="lbl-lang">اللغة:</span>

  <!-- START -->

      <h2 id="s-title"></h2>
      <p id="s-sub"></p>

      <h2 id="rev-title"></h2>

<script>
const PASS_POINTS = 70;       // pass at 70 points out of 100
const SHEET_URL = "https://script.google.com/macros/s/AKfycbyX4Quq5LQE5yF3o3q0x133Zy8iGzNGBosmgFONFS1s4EUhrX_ACRNfgUHyZEUJfS_P/exec";

// Sends the result to the Google Sheet. Fire-and-forget: no-cors means we cannot read the reply,
// but the Apps Script still receives and writes the row.
function sendToSheet(data) {
  try {
    fetch(SHEET_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
  } catch (e) {}
}
const QUIZ_LENGTH = 50;       // 10 each: food-safety MC, math, true/false, ordering, matching
const PASSWORD = "1122";
const TEST_CODE = "1234"; // code the manager gives employees when they are allowed to take the test
const CODE_T = {
  ar: { lbl: "رمز الاختبار (من المدير)", err: "رمز الاختبار غير صحيح" },
  en: { lbl: "Test code (from the manager)", err: "Incorrect test code" },
  hi: { lbl: "परीक्षा कोड (प्रबंधक से)", err: "परीक्षा कोड गलत है" },
  bn: { lbl: "পরীক্ষার কোড (ম্যানেজারের কাছ থেকে)", err: "পরীক্ষার কোড ভুল" },
  id: { lbl: "Kode tes (dari manajer)", err: "Kode tes salah" }
};

// Each question: q = question text, o = options (same order in all languages), c = index of correct option.

 {"cat":{"ar":"صحة العاملين","en":"Staff health","hi":"कर्मचारी स्वास्थ्य","bn":"কর্মী স্বাস্থ্য","id":"Kesehatan karyawan","ne":"कर्मचारी स्वास्थ्य"},"q":{"ar":"عامل يعاني من إسهال وتقيؤ، ماذا يجب أن يفعل وفق البرنامج؟","en":"A worker has diarrhoea and vomiting. What must he do under the programme?","hi":"एक कर्मचारी को दस्त और उल्टी हो रही है। कार्यक्रम के अनुसार उसे क्या करना चाहिए?","bn":"একজন কর্মীর ডায়রিয়া ও বমি হচ্ছে। প্রোগ্রাম অনুযায়ী তার কী করা উচিত?","id":"Seorang karyawan mengalami diare dan muntah. Apa yang harus dilakukan menurut program?","ne":"कामदारलाई पखाला र बान्ता भएको छ। कार्यक्रम अनुसार उसले के गर्नुपर्छ?"},"o":{"ar":["يستمر في العمل وهو يرتدي القفازات فقط ويتعامل مع كل الطعام كالمعتاد","يعمل في الفرز فقط ويتجنب الطبخ لكنه يواصل لمس الطعام","يبلغ المشرف فوراً ولا يلمس الطعام أو يجهزه","يتناول مسكناً ويستمر في العمل بشكل طبيعي ويتعامل مع الطعام كالمعتاد"],"en":["Keeps working while wearing gloves only and handles all the food as usual","Works only on sorting tasks and avoids cooking but keeps handling the food","Informs the supervisor immediately and does not handle or prepare food","Takes a painkiller and continues working as normal, handling food as usual"],"hi":["केवल दस्ताने पहनकर काम जारी रखता है और सारा खाना हमेशा की तरह संभालता है","केवल छंटाई का काम करता है और पकाने से बचता है, पर खाने को संभालता रहता है","तुरंत सुपरवाइज़र को सूचित करता है और खाना नहीं छूता या तैयार नहीं करता","दर्द की दवा लेकर सामान्य रूप से काम जारी रखता है और खाना हमेशा की तरह संभालता है"],"bn":["শুধু গ্লাভস পরে কাজ চালিয়ে যায় এবং সব খাবার আগের মতো নিয়ে কাজ করে","শুধু বাছাইয়ের কাজ করে ও রান্না এড়িয়ে চলে, কিন্তু খাবার নিয়ে কাজ করতে থাকে","সঙ্গে সঙ্গে সুপারভাইজারকে জানায় এবং খাবার স্পর্শ বা প্রস্তুত করে না","ব্যথার ওষুধ খেয়ে স্বাভাবিকভাবে কাজ চালিয়ে যায় এবং আগের মতো খাবার নিয়ে কাজ করে"],"id":["Tetap bekerja hanya dengan memakai sarung tangan dan menangani semua makanan seperti biasa","Hanya bekerja di bagian sortir dan menghindari memasak tetapi tetap mena र्दैन"]},"c":0},

"ne":["हावाले मात्र सबै अवस्थामा सबै सूक्ष्मजीव मार्छ, त्यसैले तौलिया चाहिँदैन","कपडाको तौलियाले कीटाणु फैलाउन र पुनः प्रदूषण गराउन सक्छ","हावामा सुकाउने काम भान्सामा सधैं अन्य तरिकाभन्दा छिटो हुन्छ","यसले उपकरणको धातुको सतहमा खिया लाग्नबाट मात्र बचाउँछ"]},"c":1},
 {"cat":{"ar":"المواد الكيميائية","en":"Chemicals","hi":"रसायन","bn":"রাসায়নিক","id":"Bahan kimia","ne":"रसायन"},"q":{"ar":"أين يجب تخزين المواد الكيميائية في المنشأة؟","en":"Where should chemicals be stored in the establishment?","hi":"प्रतिष्ठान में रसायनों को कहां रखना चाहिए?","bn":"প্রতিষ্ঠানে রাসায়নিক কোথায় রাখা উচিত?","id":"Di mana bahan kimia harus disimpan di fasilitas?","ne":"प्रतिष्ठानमा रसायनहरू कहाँ भण्डारण गर्नुपर्छ?"},"o":{"ar":["على الرف العلوي فوق الطعام حتى تكون محمية من الأطفال","بجانب أدوات التقديم حتى يصل إليها الموظفون بسرعة","في أماكن مخصصة بعيداً عن الطعام ومعدات تجهيزه","في زجاجات مشروبات غازية فارغة موضوعة بجانب رفوف منطقة الطبخ"],"en":["On the top shelf above food, so they are protected from children","Next to the serving utensils so staff can reach them quickly","In dedicated places away from food and food-prep equipment","In empty soft-drink bottles stored beside the cooking area shelves"],"hi":["भोजन के ऊपर वाली सबसे ऊँची शेल्फ़ पर, ताकि बच्चों से सुरक्षित रहें","परोसने वाले बर्तनों के पास, ताकि स्टाफ़ जल्दी पहुँच सके","अलग निर्धारित जगहों पर, भोजन और भोजन तैयार करने के उपकरणों से दूर","खाली सॉफ़्ट-ड्रिंक की बोतलों में, पकाने वाले क्षेत्र की शेल्फ़ों के पास"],"bn":["খাবারের উপরের তাকে, শিশুদের নাগাল থেকে রক্ষা করতে","পরিবেশনের পাত্রের পাশে, যাতে কর্মীরা দ্রুত পৌঁছাতে পারে","নির্দিষ্ট আলাদা জায়গায়, খাবার ও খাবার প্রস্তুতের যন্ত্রপাতি থেকে দূরে","খালি সফট-ড্রিঙ্কের বোতলে, রান্নার জায়গার তাকের পাশে রেখে"],"id":["Di rak paling atas di atas makanan agar terlindungi dari anak-anak","Di samping peralatan saji agar staf dapat cepat menjangkaunya","Di tempat khusus yang terpisah dari makanan dan peralatan pengolahan makanan","Dalam botol minuman ringan kosong yang disimpan di dekat rak area masak"],"ne":["खानाभन्दा माथिको सेल्फमा, बालबालिकाबाट सुरक्षित हुन","सेवा गर्ने भाँडाको छेउमा, कर्मचारीले छिटो पाउन","खाना र खाना तयार गर्ने उपकरणबाट टाढाको समर्पित ठाउँमा","पकाउने क्षेत्रको सेल्फ छेउमा राखिएका खाली सफ्ट-ड्रिङ्क बोतलमा"]},"c":2},
 {"cat":{"ar":"المواد الكيميائية","en":"Chemicals","hi":"रसायन","bn":"রাসায়নিক","id":"Bahan kimia","ne":"रसायन"},"q":{"ar":"هل يجوز استخدام عبوة كانت تحتوي على مادة تنظيف لتعبئة الماء أو العصائر؟","en":"Is it allowed to use a container that held cleaning chemicals to store water or juice?","hi":"क्या सफाई रसायन वाले डिब्बे में पानी या जूस भरना अनुमत है?","bn":"পরিষ্কারক রাসায়নিকের পাত্রে পানি বা জুস রাখা কি অনুমোদিত?","id":"Bolehkah wadah bekas bahan pembersih dipakai untuk menyimpan air atau jus?","ne":"सफाई रसायन राखिएको भाँडो पानी वा जुसको भण्डारणका लागि प्रयोग गर्न मिल्छ?"},"o":{"ar":["نعم، إذا شُطفت جيداً بالماء الساخن عدة مرات","نعم، إذا بدت العبوة نظيفة ولم يبقَ عليها أي ملصق","نعم، إذا كانت كمية المادة الكيميائية المتبقية فيها قليلة جداً","لا، لا يجوز استخدام عبوات المواد الكيميائية للطعام"],"en":["Yes, if it is rinsed well with hot water several times","Yes, if the container looks clean and has no label left","Yes, if only a small amount of chemical was left inside it","No, chemical containers must not be used for food"],"hi":["हाँ, अगर गर्म पानी से कई बार अच्छी तरह धो लिया गया हो","हाँ, अगर कंटेनर साफ़ दिखता हो और उस पर कोई लेबल न बचा हो","हाँ, अगर उसके अंदर रसायन की बहुत थोड़ी मात्रा बची हो","नहीं, रसायन के कंटेनर भोजन के लिए इस्तेमाल नहीं किए जा सकते"],"bn":["হ্যাঁ, গরম পানি দিয়ে কয়েকবার ভালোভাবে ধুয়ে নিলে","হ্যাঁ, পাত্র পরিষ্কার দেখালে এবং তাতে কোনো লেবেল না থাকলে","হ্যাঁ, ভেতরে যদি রাসায়নিক সামান্য পরিমাণে অবশিষ্ট থাকে","না, রাসায়নিকের পাত্র খাবারের জন্য ব্যবহার করা যাবে না"],"id":["Ya, jika sudah dibilas dengan air panas beberapa kali","Ya, jika wadahnya terlihat bersih dan tidak ada label yang tersisa","Ya, jika hanya tersisa sedikit bahan kimia di dalamnya","Tidak, wadah bahan kimia tidak boleh digunakan untuk makanan"],"ne":["हुन्छ, यदि तातो पानीले धेरै पटक राम्रोसँग पखालिएको छ भने","हुन्छ, यदि भाँडो सफा देखिन्छ र लेबल छैन भने","हुन्छ, यदि भित्र रसायनको थोरै मात्र बाँकी थियो भने","होइन, रसायनका भाँडा खानाको लागि प्रयोग गर्नु हुँदैन"]},"c":3}  {"cat":{"ar":"الملوثات الفيزيائية","en":"Physical contamination","hi":"भौतिक संदूषण","bn":"ভৌত দূষণ","id":"Kontaminasi fisik","ne":"भौतिक प्रदूषण"},"q":{"ar":"أي مما يلي يُعد من الملوثات الفيزيائية الناتجة عن المعدات؟","en":"Which of these is a physical contaminant from equipment?","hi":"इनमें से कौन सा उपकरणों से होने वाला भौतिक संदूषक है?","bn":"এর মধ্যে কোনটি সরঞ্জাম থেকে আসা ভৌত দূষক?","id":"Manakah yang merupakan kontaminan fisik dari peralatan?","ne":"उपकरणबाट आउने भौतिक प्रदूषक यी मध्ये कुन हो?"},"o":{"ar":["قطع معدنية صغيرة من أدوات مكسورة","جراثيم السالمونيلا التي تبقى في زوايا المعدات الرطبة","بقايا منظف كيميائي بسبب سوء شطف المعدات","أبواغ العفن التي تنمو في الزوايا الرطبة لغرفة التخزين"],"en":["Small metal pieces from broken tools","Salmonella bacteria that survive in damp equipment corners","Chemical cleaner residue left after poor rinsing of equipment","Mould spores growing in damp corners of the storage room"],"hi":["टूटे औज़ारों से निकले छोटे धात्विक टुकड़े","साल्मोनेला बैक्टीरिया जो नम उपकरणों के कोनों में बचे रहते हैं","खराब धुलाई के कारण उपकरण पर बचा रसायन क्लीनर का अवशेष","भंडार कक्ष के नम कोनों में उगने वाले फफूंद के बीजाणु"],"bn":["ভাঙা যন্ত্র থেকে আসা ছোট ধাতব টুকরো","স্যালমোনেলা জীবাণু যা ভেজা যন্ত্রপাতির কোণে টিকে থাকে","ভালোভাবে না ধোয়ায় যন্ত্রে লেগে থাকা রাসায়নিক পরিষ্কারকের অবশেষ","স্টোর রুমের ভেজা কোণে জন্মানো ছাতার বীজাণু"],"id":["Potongan logam kecil dari peralatan yang rusak","Bakteri Salmonella yang bertahan di sudut peralatan yang lembap","Sisa pembersih kimia akibat pembilasan peralatan yang buruk","Spora jamur yang tumbuh di sudut lembap ruang penyimpanan"],"ne":["बिग्रिएका औजारका धातुका साना टुक्रा","भिजेको उपकरणको कुनामा बाँच्ने साल्मोनेला जीवाणु","खराब पखालाइपछि उपकरणमा बाँकी रहेको रासायनिक सफाई अवशेष","भण्डार कोठाको भिजेको कुनामा उम्रने ढुसीको बीजाणु"]},"c":0},
 {"cat":{"ar":"الملوثات الفيزيائية","en":"Physical contamination","hi":"भौतिक संदूषण","bn":"ভৌত দূষণ","id":"Kontaminasi fisik","ne":"भौतिक प्रदूषण"},"q":{"ar":"عند كسر زجاجة أو أداة زجاجية قرب الغذاء، ما الإجراء الصحيح؟","en":"A glass bottle or glass tool breaks near food. What is the correct action?","hi":"खाने के पास कांच की बोतल या कांच का औज़ार टूट जाता है। सही कदम क्या है?","bn":"খাবারের কাছে কাঁচের বোতল বা কাঁচের যন্ত্র ভেঙে যায়। সঠিক পদক্ষেপ কী?","id":"Botol kaca atau alat kaca pecah dekat makanan. Apa tindakan yang benar?","ne":"खानाको नजिक काँचको बोतल वा काँचको औजार फुट्यो। सही कार्य के हो?"},"o":{"ar":["نظّف القطع بسرعة بقطعة قماش واستمر في العمل بشكل طبيعي في المنطقة","أوقف العمل في المنطقة وأبلغ فوراً ولا تستخدم أي طعام مكشوف","انقل الزجاج بعيداً عن الطعام فقط دون إبلاغ أي شخص بذلك إطلاقاً","أكمل الطلب أولاً وأبلغ بهدوء في نهاية الوردية بعد الانتهاء منه"],"en":["Clean up the pieces quickly with a cloth and continue working normally in the area","Stop work in the area, report immediately, and do not use any exposed food","Only move the glass away from the food without reporting it to anyone at all","Finish the order first and report it calmly at the end of the shift, once done"],"hi":["टुकड़ों को जल्दी से कपड़े से साफ़ करें और उस क्षेत्र में सामान्य रूप से काम जारी रखें","काम उस क्षेत्र में रोकें, तुरंत सूचना दें, और खुला कोई भी खाना इस्तेमाल न करें","कांच को केवल खाने से दूर खिसकाएँ, किसी को बताए बिना","पहले ऑर्डर पूरा करें और शिफ़्ट के अंत में शांति से रिपोर्ट करें"],"bn":["টুকরোগুলো কাপড় দিয়ে দ্রুত পরিষ্কার করে এলাকায় স্বাভাবিকভাবে কাজ চালিয়ে যান","ওই এলাকার কাজ থামান, সঙ্গে সঙ্গে জানান, এবং খোলা কোনো খাবার ব্যবহার করবেন না","কাচ শুধু খাবার থেকে সরান, কাউকে না জানিয়ে","আগে অর্ডার শেষ করুন, তারপর শিফটের শেষে শান্তভাবে জানান"],"id":["Bersihkan pecahannya dengan kain dengan cepat dan lanjutkan bekerja seperti biasa di area itu","Hentikan kerja di area itu, segera laporkan, dan jangan gunakan makanan yang terbuka","Hanya pindahkan kaca dari makanan tanpa melaporkannya kepada siapa pun sama sekali","Selesaikan pesanan dulu lalu laporkan dengan tenang di akhir shift setelah selesai"],"ne":["कपडाले टुक्राहरू छिटो सफा गर्ने र त्यस क्षेत्रमा सामान्य रूपमा काम जारी राख्ने","त्यस क्षेत्रमा काम रोक्ने, तुरुन्तै रिपोर्ट गर्ने, र उजागर भएको कुनै खाना प्रयोग नगर्ने","खानाबाट काँच केवल टाढा सार्ने, कसैलाई रिपोर्ट नगर्ने","अर्डर पहिले पूरा गर्ने र काम सकिएपछि सिफ्टको अन्त्यमा शान्तपूर्वक रिपोर्ट गर्ने"]},"c":1},
 {"cat":{"ar":"مكافحة الآفات","en":"Pest control","hi":"कीट नियंत्रण","bn":"কীটপতঙ্গ নিয়ন্ত্রণ","id":"Pengendalian hama","ne":"कीट नियन्त्रण"},"q":{"ar":"ما العلامة الأوضح على وجود نشاط للقوارض في المنشأة؟","en":"What is the clearest sign of rodent activity in the establishment?","hi":"प्रतिष्ठान में कृंतकों की गतिविधि का सबसे स्पष्ट संकेत क्या है?","bn":"প্রতিষ্ঠানে ইঁদুরের সক্রিয়তার সবচেয়ে স্পষ্ট লক্ষণ কী?","id":"Apa tanda paling jelas adanya aktivitas tikus di fasilitas?","ne":"प्रतिष्ठानमा मुसाको गतिविधिको सबैभन्दा स्पष्ट संकेत कुन हो?"},"o":{"ar":["رائحة عطر قوية تبقى في غرفة التخزين طوال اليوم","صوت الأجهزة الكهربائية التي تعمل في منطقة التخزين","فضلات طازجة وآثار قضم أو تمزق في المواد والتغليف","بقع ملونة على الجدران تبدو كعلامات دهان قديم"],"en":["A strong perfume smell that stays in the storage room all day","The sound of electrical appliances running in the storage area","Fresh droppings and gnaw marks or tears in packaging","Coloured stains on walls that look like old paint marks"],"hi":["तेज़ इत्र जैसी गंध जो पूरे दिन भंडार कक्ष में रहती है","भंडार क्षेत्र में चलते बिजली उपकरणों की आवाज़","ताज़ी बीट और सामान या पैकिंग में कुतरे या फटे निशान","दीवारों पर रंगीन धब्बे जो पुराने पेंट के निशान जैसे दिखें"],"bn":["কড়া সুগন্ধির গন্ধ যা সারাদিন স্টোর রুমে থাকে","স্টোর এলাকায় চালু থাকা বৈদ্যুতিক যন্ত্রের শব্দ","তাজা মল এবং উপাদান বা প্যাকেটে কাটার দাগ বা ছেঁড়া","দেয়ালে রঙিন দাগ যা পুরনো রঙের দাগের মতো দেখায়"],"id":["Bau parfum yang kuat dan bertahan di ruang penyimpanan sepanjang hari","Suara peralatan listrik yang menyala di area penyimpanan","Kotoran segar dan bekas gigitan atau robekan pada kemasan","Noda berwarna di dinding yang terlihat seperti bekas cat lama"],"ne":["भण्डार कोठामा दिनभरि रहने कडा अत्तरको गन्ध","भण्डार क्षेत्रमा चलिरहेका बिजुली उपकरणको आवाज","ताजा दिसा र प्याकेजिङमा कोरेका चिन्ह वा च्यातिएको भाग","पुराना रंगका दागजस्ता देखिने भित्ताका रंगीन दाग"]},"c":2},

 {"cat":{"ar":"السموم البكتيرية","en":"Bacterial toxins","hi":"बैक्टीरियल टॉक्सिन","bn":"ব্যাকটেরিয়াল টক্সিন","id":"Toksin bakteri","ne":"जीवाणुजन्य विष"},"q":{"ar":"لماذا لا تكفي الحرارة وحدها للتخلص من بعض سموم البكتيريا في الغذاء؟","en":"Why is heat alone not enough to remove some bacterial toxins from food?","hi":"खाने से कुछ बैक्टीरियल टॉक्सिन हटाने के लिए अकेली गर्मी काफी क्यों नहीं है?","bn":"খাবার থেকে কিছু ব্যাকটেরিয়াল টক্সিন দূর করতে শুধু তাপ যথেষ্ট নয় কেন?","id":"Mengapa panas saja tidak cukup untuk menghilangkan sebagian toksin bakteri dari makanan?","ne":"खानाबाट केही जीवाणुजन्य विष हटाउन केवल तातोले किन पर्याप्त छैन?"},"o":{"ar":["الحرارة تجعل السموم أكثر نشاطاً وأصعب في الكشف عنها","السموم تذوب في الماء الساخن وتنتشر في الطبق كله","السموم تنتج فقط في الطعام البارد المحفوظ لفترة طويلة","بعض السموم تقاوم الحرارة ولا يتم تدميرها بالطهي"],"en":["Heat makes the toxins more active and harder to notice","Toxins dissolve in hot water and spread through the whole dish","Toxins are produced only in cold food stored for a long time","Some toxins withstand heat and are not destroyed by cooking"],"hi":["गर्मी से विषाक्त पदार्थ और सक्रिय हो जाते हैं और पहचानना कठिन होता है","विषाक्त पदार्थ गर्म पानी में घुलकर पूरे व्यंजन में फैल जाते हैं","विषाक्त पदार्थ केवल लंबे समय तक रखे ठंडे खाने में बनते हैं","कुछ विषाक्त पदार्थ गर्मी सह लेते हैं और पकाने से नष्ट नहीं होते"],"bn":["তাপে বিষ আরও সক্রিয় হয় এবং শনাক্ত করা কঠিন হয়","বিষ গরম পানিতে গলে পুরো খাবারে ছড়িয়ে পড়ে","বিষ শুধু দীর্ঘক্ষণ রাখা ঠান্ডা খাবারে তৈরি হয়","কিছু বিষ তাপ সহ্য করে এবং রান্নায় ধ্বংস হয় না"],"id":["Panas membuat racun lebih aktif dan lebih sulit dikenali","Racun larut dalam air panas dan menyebar ke seluruh hidangan","Racun hanya terbentuk pada makanan dingin yang disimpan lama","Beberapa racun tahan panas dan tidak hancur oleh proses memasak"],"ne":["तातोले विषलाई बढी सक्रिय र पत्ता लगाउन कठिन बनाउँछ","विष तातो पानीमा घुलेर सम्पूर्ण परिकारमा फैलिन्छ","विष लामो समय भण्डारण गरिएको चिसो खानाम  {"cat":{"ar":"الأمراض المنقولة بالغذاء","en":"Foodborne illness","hi":"खाद्य जनित बीमारी","bn":"খাদ্যবাহিত রোগ","id":"Penyakit bawaan makanan","ne":"खानाजन्य रोग"},"q":{"ar":"ما الإجراء الصحيح مع الأرز المطبوخ لتجنب بكتيريا الباسيلس سيريوس؟","en":"What is the correct action with cooked rice to avoid Bacillus cereus?","hi":"बैसिलस सेरियस से बचने के लिए पके चावल के साथ सही कदम क्या है?","bn":"ব্যাসিলাস সেরিয়াস এড়াতে রান্না করা ভাতের সঙ্গে সঠিক পদক্ষেপ কী?","id":"Apa tindakan yang benar pada nasi matang untuk menghindari Bacillus cereus?","ne":"बेसिलस सेरियस रोक्न पकाएको भातसँग सही कार्य के हो?"},"o":{"ar":["تبريده بسرعة وتجنب تركه طويلاً في الحرارة وإعادة تسخينه إلى ٨٢°م","تركه في درجة حرارة الغرفة حتى صباح اليوم التالي للراحة","تبريده ببطء في الغرفة وتغطيته وهو ما زال دافئاً","إعادة تسخينه إلى ٤٠°م فقط وإبقاؤه دافئاً لبقية اليوم"],"en":["Cool it quickly, avoid long room-temperature holding, and reheat to 82°C","Leave it at room temperature until the next morning, which is convenient for the staff","Cool it slowly in the room and cover it while it is still warm","Reheat it only to 40°C and keep it warm for the rest of the day"],"hi":["जल्दी ठंडा करना, कमरे के तापमान पर देर तक न रखना, और 82°C तक दोबारा गरम करना","सुविधा के लिए अगली सुबह तक कमरे के तापमान पर छोड़ देना","कमरे में धीरे-धीरे ठंडा होने देना और गरम रहते ढक देना","केवल 40°C तक गरम करना और पूरे दिन गरम रखना"],"bn":["দ্রুত ঠান্ডা করা, ঘরের তাপমাত্রায় দীর্ঘক্ষণ না রাখা, এবং ৮২°C পর্যন্ত আবার গরম করা","সুবিধার জন্য পরের দিন সকাল পর্যন্ত ঘরের তাপমাত্রায় রেখে দেওয়া","ঘরে ধীরে ঠান্ডা হতে দেওয়া এবং গরম থাকতেই ঢেকে রাখা","শুধু ৪০°C পর্যন্ত গরম করা এবং সারাদিন গরম রাখা"],"id":["Dinginkan dengan cepat, hindari dibiarkan lama di suhu ruang, dan panaskan ulang hingga 82°C","Membiarkannya di suhu ruang sampai keesokan pagi agar praktis","Dinginkan perlahan di ruangan dan tutup saat masih hangat","Panaskan ulang hanya sampai 40°C dan biarkan hangat sepanjang hari"],"ne":["छिटो चिसो गर्ने, कोठाको तापक्रममा लामो समय नराख्ने, र 82°C सम्म तताउने","भोलिपल्ट बिहानसम्म कोठाको तापक्रममा छोड्ने, जुन कर्मचारीका लागि सुविधाजनक हुन्छ","कोठामा बिस्तारै चिसो गर्ने र अझै न्यानो हुँदा ढाक्ने","केवल 40°C सम्म तताएर बाँकी दिनभर न्यानो राख्ने"]},"c":0},

 {"cat":{"ar":"التخزين الجاف","en":"Dry storage","hi":"सूखा भंडारण","bn":"শুকনো সংরক্ষণ","id":"Penyimpanan kering","ne":"सुख्खा भण्डारण"},"q":{"ar":"ما أقل ارتفاع للأرفف عن الأرض في منطقة التخزين الجاف؟","en":"What is the minimum height of shelves above the floor in dry storage?","hi":"सूखे भंडारण में शेल्फ़ का फ़र्श से न्यूनतम ऊंचाई कितनी होनी चाहिए?","bn":"শুকনো মজুত এলাকায় মেঝে থেকে তাকের ন্যূনতম উচ্চতা কত?","id":"Berapa tinggi minimum rak dari lantai di area penyimpanan kering?","ne":"सुख्खा भण्डारणमा भुइँबाट सेल्फको न्यूनतम उचाइ कति हो?"},"o":{"ar":["حوالي ٥ سم فوق الأرض، بالقدر الذي يسمح للعمال بالتنظيف","لا فرق في الارتفاع مطلوب للبضائع المخزنة إطلاقاً","على ارتفاع ١٥ سم على الأقل فوق الأرض لتدفق الهواء","حوالي ٥٠ سم فوق الأرض، ويسهل على الموظفين الوصول إليها"],"en":["About 5 cm above the floor, just enough for the cleaners","No difference in height is needed for the stored goods","At least 15 cm above the floor for air flow","About 50 cm above the floor, reachable for the staff"],"hi":["फ़र्श से लगभग 5 सेमी ऊपर, बस सफ़ाई करने वालों के लिए काफ़ी","भंडारित सामान के लिए ऊँचाई में कोई फ़र्क ज़रूरी नहीं","फ़र्श से कम से कम 15 सेमी ऊपर, हवा के आने-जाने के लिए","फ़र्श से लगभग 50 सेमी ऊपर, ताकि स्टाफ़ आसानी से पहुँच सके"],"bn":["মেঝে থেকে প্রায় ৫ সেমি উপরে, শুধু পরিষ্কারকদের জন্য যথেষ্ট","মজুত পণ্যের জন্য উচ্চতার কোনো পার্থক্য দরকার নেই","মেঝে থেকে কমপক্ষে ১৫ সেমি উপরে, বাতাস চলাচলের জন্য","মেঝে থেকে প্রায় ৫০ সেমি উপরে, কর্মীরা সহজে পৌঁছাতে পারেন"],"id":["Sekitar 5 cm di atas lantai, cukup untuk petugas kebersihan","Tidak perlu perbedaan tinggi untuk barang yang disimpan","Setidaknya 15 cm di atas lantai untuk sirkulasi udara","Sekitar 50 cm di atas lantai agar mudah dijangkau staf"],"ne":["भुइँबाट करिब 5 cm, सफाई गर्नेहरूका लागि मात्र पर्याप्त","भण्डारित सामानका लागि उचाइमा कुनै फरक चाहिँदैन","हावा चल्नका लागि भुइँबाट कम्तीमा 15 cm माथि","कर्मचारीले पुग्न सक्ने भुइँबाट करिब 50 cm माथि"]},"c":2},

 {"cat":{"ar":"النظافة الشخصية","en":"Personal hygiene","hi":"व्यक्तिगत स्वच्छता","bn":"ব্যক্তিগত পরিচ্ছন্নতা","id":"Kebersihan pribadi","ne":"व्यक्तिगत सरसफाइ"},"q":{"ar":"ما الهدف الرئيسي من النظافة الشخصية للعاملين في منشآت الغذاء؟","en":"What is the main goal of personal hygiene for food-establishment workers?","hi":"खाद्य प्रतिष्ठानों में कर्मचारियों की व्यक्तिगत स्वच्छता का मुख्य लक्ष्य क्या है?","bn":"খাদ্য প্রতিষ্ঠানের কর্মীদের ব্যক্তিগত পরিচ্ছন্নতার মূল লক্ষ্য কী?","id":"Apa tujuan utama kebersihan pribadi bagi pekerja di fasilitas makanan?","ne":"खाना प्रतिष्ठानका कामदारहरूको व्यक्तिगत सरसफाइको मुख्य लक्ष्य के हो?"},"o":{"ar":["فقط لزيادة الإنتاج وتسريع الإخراج اليومي للوجبات","لتحسين شكل الزي الذي يرتديه الموظفون","منع انتشار الأمراض وحماية الطعام من التلوث","لتسريع الخدمة خلال ساعات الذروة في اليوم"],"en":["Only to increase production and speed up daily output of meals","To improve the look of the uniform worn by the staff","Prevent disease spread and protect food from contamination","To speed up service during the busiest hours of the day"],"hi":["केवल उत्पादन बढ़ाने और रोज़ का भोजन तेज़ी से बनाने के लिए","कर्मचारियों की वर्दी का रूप बेहतर बनाने के लिए","बीमारियों के फैलाव को रोकना और खाने को संदूषण से बचाना","दिन के सबसे व्यस्त समय में सेवा तेज़ करने के लिए"],"bn":["শুধু উৎপাদন বাড়াতে এবং প্রতিদিনের খাবার তৈরি দ্রুত করতে","কর্মীদের পোশাকের চেহারা উন্নত করতে","রোগ ছড়ানো রোধ করা এবং খাবারকে দূষণ থেকে রক্ষা করা","দিনের সবচেয়ে ব্যস্ত সময়ে পরিবেশন দ্রুত করতে"],"id":["Hanya untuk meningkatkan produksi dan mempercepat keluaran makanan harian","Untuk memperbaiki penampilan seragam yang dikenakan staf","Mencegah penyebaran penyakit dan melindungi makanan dari kontaminasi","Untuk mempercepat pelayanan pada jam tersibuk di hari itu"],"ne":["केवल उत्पादन बढाउन र दैनिक खाना उत्पादन छिटो गर्न","कर्मचारीको पोशाकको रूप सुधार्न","रोग फैलन रोक्न र खानालाई दूषणबाट जोगाउन","दिनको सबैभन्दा व्यस्त समयमा सेवा छिटो गर्न"]},"c":2},
 {"cat":{"ar":"نظافة الأدوات","en":"Equipment cleaning","hi":"उपकरण सफाई","bn":"সরঞ্জাম পরিষ্কার","id":"Pembersihan peralatan","ne":"उपकरण सफाई"},"q":{"ar":"متى يجب تنظيف وتطهير أدوات التقطيع والمعدات؟","en":"When should cutting tools and equipment be cleaned and sanitized?","hi":"कटिंग औज़ारों और उपकरणों को कब साफ और सैनिटाइज़ करना चाहिए?","bn":"কাটার যন্ত্র ও সরঞ্জাম কখন পরিষ্কার ও জীবাণুমুক্ত করা উচিত?","id":"Kapan alat potong dan peralatan harus dibersihkan dan disanitasi?","ne":"काट्ने औजार र उपकरणहरू कहिले सफा र कीटाणुरहित गर्नुपर्छ?"},"o":{"ar":["مرة واحدة في الأسبوع فقط، عادةً في يوم زيارة المفتش","فقط عندما تبدو متسخة بشكل واضح للعامل","في نهاية الشهر، خلال التنظيف الشهري العام","بعد كل استخدام وقبل تحضير الطعام التالي"],"en":["Once a week only, usually on the day the inspector visits","Only when they look visibly dirty to the eye of the worker","At the end of the month, during the general monthly cleaning","After every use and before preparing the next food"],"hi":["केवल सप्ताह में एक बार, आमतौर पर निरीक्षक के आने के दिन","केवल तब जब कर्मचारी को वे साफ़ तौर पर गंदे दिखें","महीने के अंत में, मासिक सामान्य सफ़ाई के दौरान","हर उपयोग के बाद और अगला खाना तैयार करने से पहले"],"bn":["শুধু সপ্তাহে একবার, সাধারণত পরিদর্শকের আসার দিনে","শুধু যখন কর্মীর চোখে স্পষ্ট নোংরা দেখায়","মাসের শেষে, মাসিক সাধারণ পরিষ্কারের সময়","প্রতিবার ব্যবহারের পর এবং পরের খাবার তৈরির আগে"],"id":["Hanya seminggu sekali, biasanya pada hari kunjungan pemeriksa","Hanya ketika terlihat jelas kotor di mata pekerja","Di akhir bulan, saat pembersihan umum bulanan","Setelah setiap penggunaan dan sebelum makanan berikutnya disiapkan"],"ne":["हप्तामा एक पटक मात्र, सामान्यतया निरीक्षक आउने दिनमा","कामदारको आँखामा स्पष्ट फोहोर देखिएमा मात्र","महिनाको अन्त्यमा, मासिक सामान्य सफाइका क्रममा","प्रत्येक प्रयोगपछि र अर्को खाना तयार गर्नु अघि"]},"c":3},
 {"cat":{"ar":"الحرائق","en":"Fire safety","hi":"आग से सुरक्षा","bn":"অগ্নি নিরাপত্তা","id":"Keselamatan kebakaran","ne":"आगो सुरक्षा"},"q":{"ar":"ماذا يجب أن تفعل عند اشتعال حريق زيت في المطبخ؟","en":"What should you do if cooking oil catches fire in the kitchen?","hi":"रसोई में खाना पकाने के तेल में आग लग जाए तो क्या करना चाहिए?","bn":"রান্নাঘরে রান্নার তেলে আগুন লাগলে কী করা উচিত?","id":"Apa yang harus dilakukan jika minyak masak terbakar di dapur?","ne":"भान्सामा पकाउने तेलमा आगो लाग्यो भने के गर्नुपर्छ?"},"o":{"ar":["تغطية الوعاء بإحكام لخنق النار، ولا تستخدم الماء أبداً","صب الماء عليه مباشرة لتبريد النيران بسرعة","تركه يحترق من تلقاء نفسه مع تهوية الغرفة","تحريكه بقوة بملعقة طويلة لنشر اللهب"],"en":["Cover the pan tightly and smother it, never use water","Pour water on it directly to cool the flames quickly down","Let it burn out on its own while the room is ventilated","Stir it vigorously with a long spoon to spread the flames"],"hi":["कड़ाही को कसकर ढककर आग को बुझाएँ, कभी पानी का इस्तेमाल न करें","लपटों को जल्दी ठंडा करने के लिए सीधे उस पर पानी डालें","कमरे में हवा रहते उसे अपने आप जल जाने दें","लपटें फैलाने के लिए लंबे चम्मच से उसे ज़ोर से हिलाएँ"],"bn":["কড়াই শক্ত করে ঢেকে আগুন নিভান, কখনো পানি ব্যবহার করবেন না","আগুন দ্রুত ঠান্ডা করতে সরাসরি তার উপর পানি ঢালুন","ঘর বাতাস চলাচলের সময় নিজে নিজে জ্বলে শেষ হতে দিন","শিখা ছড়াতে লম্বা চামচ দিয়ে জোরে নাড়ুন"],"id":["Tutup wajan rapat-rapat untuk memadamkan api, jangan pernah gunakan air","Langsung siram air agar api cepat reda","Biarkan terbakar sendiri sambil ruangan diventilasi","Aduk kuat-kuat dengan sendok panjang agar api menyebar"],"ne":["कराहीलाई पूरै छोपेर आगो निभाउने, कहिल्यै पानी प्रयोग नगर्ने","ज्वाला छिटो शान्त पार्न सिधै त्यसमा पानी खन्याउने","कोठा हावा खेलाएर आगो आफैं निभ्न दिने","ज्वाला फैलाउन लामो चम्चाले जोडले हल्लाउने"]},"c":0},
 {"cat":{"ar":"السلامة المهنية","en":"Occupational safety","hi":"व्यावसायिक सुरक्षा","bn":"পেশাগত নিরাপত্তা","id":"Keselamatan kerja","ne":"पेशागत सुरक्षा"},"q":{"ar":"عند فصل جهاز كهربائي عن المصدر، كيف يجب أن تفعل؟","en":"How should you unplug an electrical appliance?","hi":"बिजली का उपकरण बंद करने के लिए प्लग कैसे निकालना चाहिए?","bn":"বৈদ্যুতিক যন্ত্রের সংযোগ কীভাবে বিচ্ছিন্ন করা উচিত?","id":"Bagaimana cara mencabut peralatan listrik dari sumber daya?","ne":"बिजुली उपकरणको प्लग कसरी निकाल्नुपर्छ?"},"o":{"ar":["بسحب السلك بقوة","بسحب القابس نفسه وليس من السلك","بلمس الجهاز بيد مبتلة","بفصل الكهرباء عن الجهاز وهو يعمل"],"en":["By pulling the cord hard","By pulling the plug itself, not the cord","By touching the appliance with wet hands","By disconnecting power while it runs"],"hi":["तार को ज़ोर से खींचकर","प्लग को खुद पकड़कर, तार से नहीं","गीले हाथों से उपकरण छूकर","चलते उपकरण की बिजली काटकर"],"bn":["তার জোরে টেনে","প্লাগ ধরে, তার ধরে নয়","ভেজা হাতে যন্ত্র ছুঁয়ে","চলমান যন্ত্রের বিদ্যুৎ কেটে"],"id":["Dengan menarik kabel dengan keras","Dengan menarik steker itu sendiri, bukan kabelnya","Dengan menyentuh alat dengan tangan basah","Dengan memutus listrik saat alat menyala"],"ne":["डोरी जोडले तानेर","प्लग स्वयं तानेर, डोरी नतानेर","भिजेका हातले उपकरण छोएर","चलिरहँदा बिजुली विच्छेद गरेर"]},"c":1},
 {"cat":{"ar":"السلامة المهنية","en":"Occupational safety","hi":"व्यावसायिक सुरक्षा","bn":"পেশাগত নিরাপত্তা","id":"Keselamatan kerja","ne":"पेशागत सुरक्षा"},"q":{"ar":"ماذا يجب أن يحدث عند تعرض الشخص لحرق بالماء المغلي؟","en":"What should be done when someone is scalded by boiling water?","hi":"उबलते पानी से जलने पर क्या करना चाहिए?","bn":"ফুটন্ত পানিতে পুড়লে কী করা উচিত?","id":"Apa yang harus dilakukan jika seseorang tersiram air mendidih?","ne":"उमालेको पानीले कसैलाई पोलिएको छ भने के गर्नुपर्छ?"},"o":{"ar":["وضع الزبدة أو الزيت على الحرق لتهدئة المنطقة المؤلمة","تركه مكشوفاً للهواء الساخن حتى تتنفس البشرة بحرية","تبريد الحرق بالماء البارد لمدة ١٠ إلى ٢٠ دقيقة","فرك الجلد بقوة لإيقاف الألم واحمرار الجلد بسرعة"],"en":["Apply butter or oil to the burn to soothe the painful area","Leave it exposed to hot air so the skin can breathe freely","Cool the burn with cold water for 10 to 20 minutes","Rub the skin firmly to stop the pain and the redness fast"],"hi":["जलने वाली जगह पर मक्खन या तेल लगाना ताकि दर्द कम हो","उसे गर्म हवा में खुला छोड़ना ताकि त्वचा आराम से साँस ले सके","जलने की जगह को 10 से 20 मिनट तक ठंडे पानी से ठंडा करें","दर्द और लालिमा तुरंत रोकने के लिए त्वचा को ज़ोर से रगड़ना"],"bn":["পোড়া জায়গায় মাখন বা তেল লাগানো, যাতে ব্যথা কমে","গরম বাতাসে খোলা রেখে দেওয়া যাতে ত্বক স্বাধীনভাবে শ্বাস নিতে পারে","পোড়া জায়গা ১০ থেকে ২০ মিনিট ঠান্ডা পানিতে ঠান্ডা করুন","ব্যথা ও লালচে ভাব দ্রুত থামাতে ত্বক জোরে ঘষা"],"id":["Mengoleskan mentega atau minyak pada luka bakar agar terasa lebih nyaman","Membiarkannya terbuka di udara panas agar kulit bisa bernapas bebas","Mendinginkan luka bakar dengan air dingin selama 10 sampai 20 menit","Menggosok kulit dengan kuat untuk menghentikan nyeri dan kemerahan dengan cepat"],"ne":["दुखिरहेको ठाउँमा मक्खन वा तेल लगाउने","छालालाई खुला तातो हावामा छोड्ने ताकि सास फेर्न सकोस्","चिसो पानीले 10 देखि 20 मिनेटसम्म पोलेको ठाउँ चिस्याउने","दुखाइ र रातोपन छिटो रोक्न छालालाई जोडले रगड्ने"]},"c":2},
 {"cat":{"ar":"الإسعافات الأولية","en":"First aid","hi":"प्राथमिक उपचार","bn":"প্রাথমিক চিকিৎসা","id":"Pertolongan pertama","ne":"प्राथमिक उपचार"},"q":{"ar":"ما الذي يجب فعله بالجرح قبل تقديم الإسعافات الأولية؟","en":"What should be done to a wound before giving first aid?","hi":"प्राथमिक उपचार देने से पहले घाव के साथ क्या करना चाहिए?","bn":"প্রাথমিক চিকিৎসার আগে ক্ষতের সঙ্গে কী করা উচিত?","id":"Apa yang harus dilakukan pada luka sebelum memberi pertolongan pertama?","ne":"प्राथमिक उपचार दिनु अघि घाउको लागि के गर्नुपर्छ?"},"o":{"ar":["الضغط عليه بأصابع متسخة لوقف النزيف بسرعة","النفخ عليه بلطف ثم تركه مكشوفاً في الهواء","تركه مكشوفاً ليجف بسرعة في الهواء الطلق خارجاً","غسل اليدين وتنظيف الجرح بالصابون والماء ثم تغطيته"],"en":["Press it with dirty fingers to stop the bleeding quickly","Blow on it gently and then leave it uncovered in the air","Leave it uncovered so it can dry out quickly in the open air outside","Wash hands, clean the wound with soap and water, and cover it"],"hi":["गंदी उंगलियों से दबाना ताकि खून जल्दी रुके","धीरे से उस पर फूँकना और फिर उसे खुला छोड़ देना","उसे खुला छोड़ना ताकि वह बाहर खुली हवा में जल्दी सूख जाए","हाथ धोकर घाव को साबुन और पानी से साफ़ करना और फिर ढकना"],"bn":["নোংরা আঙুল দিয়ে চাপ দেওয়া যাতে দ্রুত রক্ত বন্ধ হয়","আলতো করে তাতে ফুঁ দিয়ে তারপর খোলা রেখে দেওয়া","খোলা রেখে দেওয়া যাতে বাইরে খোলা হাওয়ায় দ্রুত শুকিয়ে যায়","হাত ভালো করে ধুয়ে সাবান ও পানি দিয়ে ক্ষত পরিষ্কার করে ঢেকে দেওয়া"],"id":["Menekannya dengan jari kotor agar pendarahan cepat berhenti","Meniupnya perlahan lalu membiarkannya terbuka di udara","Membiarkannya terbuka agar cepat kering di udara terbuka di luar","Cuci tangan, bersihkan luka dengan sabun dan air, lalu tutup lukanya"],"ne":["रगत रोक्न फोहोर औंलाले थिच्ने","बिस्तारै फुक्ने र त्यसपछि खुला हावामा छोड्ने","बाहिर हावामा छिटो सुक्नका लागि ढाकेर नछोड्ने","हात धुने, साबुन र पानीले घाउ सफा गर्ने र ढाक्ने"]},"c":3},
 {"cat":{"ar":"الحساسية الغذائية","en":"Food allergy","hi":"खाद्य एलर्जी","bn":"খাদ্য অ্যালার্জি","id":"Alergi makanan","ne":"खानाको एलर्जी"},"q":{"ar":"عند سؤال عميل عن مكونات طبق يعاني من حساسية شديدة من المكسرات، ما أفضل تصرف؟","en":"A customer with a severe nut allergy asks about a dish's ingredients. What is the best response?","hi":"गंभीर मेवा एलर्जी वाला ग्राहक किसी व्यंजन की सामग्री पूछता है। सबसे अच्छा जवाब क्या है?","bn":"তীব্র বাদাম অ্যালার্জিযুক্ত গ্রাহক একটি খাবারের উপাদান জানতে চান। সবচেয়ে ভালো উত্তর কী?","id":"Pelanggan dengan alergi kacang berat bertanya tentang bahan suatu hidangan. Apa respons terbaik?","ne":"एक गम्भीर बदामको एलर्जी भएको ग्राहकले परिकारका सामग्रीबारे सोध्छ। सबैभन्दा उत्तम जवाफ कुन हो?"},"o":{"ar":["فحص المكونات والأدوات والإجابة بصدق عن مخاطر التلوث المتبادل","التأكد من أن الطبق آمن حتى يتمكن الزبون من طلبه","التخمين حسب الوصفة المعتادة لأن معظم الأطباق متشابهة","إخبار الزبون بأن يزيل المكسرات من الطبق بنفسه"],"en":["Check ingredients and equipment, and answer honestly about risks","Confirm the dish is safe so that the customer can order it","Guess based on the usual recipe, since most dishes in the kitchen are made the same way","Tell the customer to remove the nuts from the dish themselves"],"hi":["सामग्री और उपकरणों की जाँच करें और क्रॉस-संदूषण के जोखिम पर ईमानदारी से जवाब दें","यह सुनिश्चित करना कि व्यंजन सुरक्षित है ताकि ग्राहक उसे ऑर्डर कर सके","सामान्य रेसिपी के आधार पर अनुमान लगाना, क्योंकि ज़्यादातर व्यंजन एक जैसे होते हैं","ग्राहक से कहना कि वे खुद व्यंजन से मेवे निकाल दें"],"bn":["উপাদান ও যন্ত্রপাতি পরীক্ষা করে ক্রস-দূষণের ঝুঁকি সম্পর্কে সৎভাবে উত্তর দেওয়া","গ্রাহক যাতে অর্ডার দিতে পারেন সেজন্য নিশ্চিত করা যে খাবারটি নিরাপদ","সাধারণ রেসিপি দেখে আন্দাজ করা, কারণ বেশিরভাগ খাবার একই রকম","গ্রাহককে বলা যে তিনি নিজেই খাবার থেকে বাদামগুলো সরিয়ে নেবেন"],"id":["Memeriksa bahan dan peralatan, lalu menjawab jujur tentang risikonya","Memastikan hidangan aman agar pelanggan mau memesannya","Menebak berdasarkan resep biasa karena sebagian besar hidangan serupa","Menyuruh pelanggan membuang kacangnya dari hidangan sendiri"],"ne":["सामग्री र उपकरण जाँच गर्ने, र जोखिमबारे इमानदारीपूर्वक जवाफ दिने","परिकार सुरक्षित छ भनेर पक्का गर्ने ताकि ग्राहकले अर्डर गर्न सकोस्","सामान्य विधिमा आधारित अनुमान गर्ने, किनकि भान्साका अधिकांश परिकार उस्तै बनाइन्छ","ग्राहकलाई परिकारबाट बदाम आफैं हटाउन भन्ने"]},"c":0},
 {"cat":{"ar":"منطق","en":"Logic","hi":"तर्क","bn":"যুক্তি","id":"Logika","ne":"तर्क"},"q":{"ar":"بعض المتدربين نجحوا في الاختبار. وكل من نجح حضر الدورة. أي عبارة صحيحة بالضرورة؟","en":"Some trainees passed the test. Everyone who passed attended the course. Which statement must be true?","hi":"कुछ प्रशिक्षु परीक्षा में पास हुए। जो भी पास हुआ वह कोर्स में आया था। कौन सा कथन अनिवार्य रूप से सही है?","bn":"কিছু প্রশিক্ষণার্থী পরীক্ষায় পাস করেছেন। যাঁরা পাস করেছেন তাঁরা সবাই কোর্সে এসেছিলেন। কোন বিবৃতিটি অবশ্যই সত্য?","id":"Beberapa peserta lulus ujian. Semua yang lulus mengikuti kursus. Pernyataan mana yang pasti benar?","ne":"केही प्रशिक्षार्थीहरूले परीक्षा पास गरे। पास गर्ने सबैले कोर्समा भाग लिए। कुन कथन अनिवार्य रूपमा सत्य हुनुपर्छ?"},"o":{"ar":["كل المتدربين حضروا الدورة","بعض المتدربين حضروا الدورة","لم يرسب أي متدرب","كل من حضر الدورة نجح"],"en":["All trainees attended the course","Some trainees attended the course","No trainee failed","Everyone who attended the course passed"],"hi":["सभी प्रशिक्षु कोर्स में आए","कुछ प्रशिक्षु कोर्स में आए","कोई प्रशिक्षु फेल नहीं हुआ","कोर्स में आने वाला हर कोई पास हुआ"],"bn":["সব প্রশিক্ষণার্থী কোর্সে এসেছিলেন","কিছু প্রশিক্ষণার্থী কোর্সে এসেছিলেন","কোনো প্রশিক্ষণার্থী ফেল করেননি","কোর্সে আসা প্রত্যেকে পাস করেছে"],"id":["Semua peserta mengikuti kursus","Beberapa peserta mengikuti kursus","Tidak ada peserta yang gagal","Semua yang mengikuti kursus lulus"],"ne":["सबै प्रशिक्षार्थीले कोर्समा भाग लिए","केही प्रशिक्षार्थीले कोर्समा भाग लिए","कुनै प्रशिक्षार्थी फेल भएन","कोर्समा भाग लिने सबै पास भए"]},"c":1},
 {"cat":{"ar":"حساب","en":"Calculation","hi":"गणना","bn":"হিসাব","id":"Hitungan","ne":"गणना"},"q":{"ar":"يُعد مطبخ 12 صينية، كل صينية فيها 8 حصص. تم التخلص من 15 حصة بسبب سوء التخزين. كم حصة قُدِّمت؟","en":"A kitchen prepares 12 trays with 8 portions each. 15 portions are thrown away due to poor storage. How many portions were served?","hi":"एक रसोई में 12 ट्रे बनती हैं, हर ट्रे में 8 हिस्से। खराब भंडारण की वजह से 15 हिस्से फेंके गए। कितने हिस्से परोसे गए?","bn":"একটি রান্নাঘরে ১২টি ট্রে তৈরি হয়, প্রতিটিতে ৮ পরিবেশন। খারাপ সংরক্ষণের কারণে ১৫টি পরিবেশন ফেলা হয়েছে। কতটি পরিবেশন করা হয়েছে?","id":"Sebuah dapur menyiapkan 12 nampan, masing-masing berisi 8 porsi. 15 porsi dibuang karena penyimpanan buruk. Berapa porsi yang disajikan?","ne":"एउटा भान्साले प्रत्येकमा 8 भागका 12 ट्रे तयार गर्छ। खराब भण्डारणका कारण 15 भाग फालिए। कति भाग परोसियो?"},"o":{"ar":["84 حصة","91 حصة","81 حصة","87 حصة"],"en":["84 portions","91 portions","81 portions","87 portions"],"hi":["84 हिस्से","91 हिस्से","81 हिस्से","87 हिस्से"],"bn":["৮৪ পরিবেশন","৯১ পরিবেশন","৮১ পরিবেশন","৮৭ পরিবেশন"],"id":["84 porsi","91 porsi","81 porsi","87 porsi"],"ne":["84 भाग","91 भाग","81 भाग","87 भाग"]},"c":2},
 {"cat":{"ar":"حساب","en":"Calculation","hi":"गणना","bn":"হিসাব","id":"Hitungan","ne":"गणना"},"q":{"ar":"تحتاج وصفة صلصة 250 غراماً من الطحين لتحضير 10 حصص. كم غراماً تحتاج لـ16 حصة بنفس النسب؟","en":"A sauce recipe needs 250 g of flour for 10 portions. How many grams are needed for 16 portions at the same ratio?","hi":"एक सॉस की रेसिपी में 10 हिस्सों के लिए 250 ग्राम आटा चाहिए। उसी अनुपात में 16 हिस्सों के लिए कितने ग्राम चाहिए?","bn":"একটি সসের রেসিপিতে ১০ পরিবেশনের জন্য ২৫০ গ্রাম ময়দা লাগে। একই অনুপাতে ১৬ পরিবেশনের জন্য কত গ্রাম লাগবে?","id":"Resep saus membutuhkan 250 g tepung untuk 10 porsi. Berapa gram untuk 16 porsi dengan perbandingan yang sama?","ne":"एक सस बनाउन 10 जनाका लागि 250 g पिठो चाहिन्छ। उही अनुपातमा 16 जनाका लागि कति ग्राम चाहिन्छ?"},"o":{"ar":["350 غراماً","425 غراماً","450 غراماً","400 غرام"],"en":["350 g","425 g","450 g","400 g"],"hi":["350 ग्राम","425 ग्राम","450 ग्राम","400 ग्राम"],"bn":["৩৫০ গ্রাম","৪২৫ গ্রাম","৪৫০ গ্রাম","৪০০ গ্রাম"],"id":["350 g","425 g","450 g","400 g"],"ne":["350 g","425 g","450 g","400 g"]},"c":3},
 {"cat":{"ar":"أولويات","en":"Prioritizing","hi":"प्राथमिकता","bn":"অগ্রাধিকার","id":"Prioritas","ne":"प्राथमिकता निर्धारण"},"q":{"ar":"ثلاث مهام: ثلاجة معطلة فيها حليب، وجرد مخزون الغد، وتنظيف الأرضية. ما الترتيب الأصح؟","en":"Three tasks: a broken fridge holding milk, tomorrow's stock count, and mopping the floor. What is the best order?","hi":"तीन काम हैं: दूध वाला खराब फ्रिज, कल के स्टॉक की गिनती, और फर्श पोंछना। सबसे सही क्रम क्या है?","bn":"তিনটি কাজ: দুধসহ নষ্ট ফ্রিজ, আগামীকালের স্টক গণনা, এবং মেঝে মোছা। সবচেয়ে ভালো ক্রম কোনটি?","id":"Tiga tugas: kulkas rusak berisi susu, penghitungan stok besok, dan mengepel lantai. Urutan terbaik?","ne":"तीन काम: फ्रिज बिग्रिँदा दूध राखिएको, भोलिको स्टक गणना, र भुइँ पुछ्ने। सबैभन्दा राम्रो क्रम कुन हो?"},"o":{"ar":["نقل الحليب إلى ثلاجة تعمل، وإصلاح المعطلة، ثم عدّ المخزون والتنظيف","عدّ المخزون ثم التنظيف ثم إصلاح الثلاجة ونقل الحليب لاحقاً","التنظيف أولاً ثم عدّ المخزون ثم التعامل مع الثلاجة والحليب في نهاية الوردية كلها","إصلاح الثلاجة ثم عدّ المخزون ثم التنظيف ثم نقل الحليب أخيراً"],"en":["Move the milk to a working fridge, fix the broken one, then count and mop","Count stock, mop, then fix the fridge and move the milk later on","Mop the floor first, then count the stock, and only then deal with the fridge and the milk","Fix the fridge, count stock, mop, then move the milk last of all"],"hi":["दूध को किसी चालू फ़्रिज में रखें, खराब को ठीक करें, फिर स्टॉक गिनें और पोंछा लगाएँ","स्टॉक गिनें, पोंछा लगाएँ, फिर फ़्रिज ठीक करें और दूध बाद में हटाएँ","पहले फ़र्श पोंछें, फिर स्टॉक गिनें, और फ़्रिज व दूध से आख़िर में शिफ़्ट के अंत में निपटें","फ़्रिज ठीक करें, स्टॉक गिनें, पोंछा लगाएँ, फिर सबसे आख़िर में दूध हटाएँ"],"bn":["দুধ একটি চালু ফ্রিজে সরান, খারাপটি ঠিক করুন, তারপর স্টক গুনুন ও মোছা দিন","স্টক গুনুন, মোছা দিন, তারপর ফ্রিজ ঠিক করুন এবং দুধ পরে সরান","আগে মেঝে মুছুন, তারপর স্টক গুনুন, এবং শিফটের শেষে ফ্রিজ ও দুধ নিয়ে ভাবুন","ফ্রিজ ঠিক করুন, স্টক গুনুন, মোছা দিন, তারপর সবশেষে দুধ সরান"],"id":["Pindahkan susu ke kulkas yang berfungsi, perbaiki yang rusak, lalu hitung stok dan pel","Hitung stok, pel, lalu perbaiki kulkas dan pindahkan susu nanti","Pel dulu, lalu hitung stok, dan tangani kulkas serta susu di akhir shift saja","Perbaiki kulkas, hitung stok, pel, lalu pindahkan susu paling akhir"],"ne":["दूधलाई काम गर्ने फ्रिजमा सार्ने, बिग्रिएको फ्रिज मर्मत गर्ने, त्यसपछि गणना र पुछ्ने","पहिले स्टक गणना, त्यसपछि भुइँ पुछ्ने, र फ्रिज र दूधलाई पछि मात्र हेर्ने","पहिले भुइँ पुछ्ने, त्यसपछि स्टक गणना गर्ने, र त्यसपछि मात्र फ्रिज र दूधको काम गर्ने","पहिले फ्रिज मर्मत गर्ने, स्टक गणना, पुछ्ने, र दूधलाई अन्तमा सार्ने"]},"c":0},
 {"cat":{"ar":"منطق","en":"Logic","hi":"तर्क","bn":"যুক্তি","id":"Logika","ne":"तर्क"},"q":{"ar":"كل الطهاة في هذا المطبخ يرتدون غطاء الرأس. أحمد لا يرتدي غطاء رأس. أي عبارة صحيحة؟","en":"Every chef in this kitchen wears a hairnet. Ahmed does not wear a hairnet. Which statement is correct?","hi":"इस रसोई में हर शेफ हेयरनेट पहनता है। अहमद हेयरनेट नहीं पहनता। कौन सा कथन सही है?","bn":"এই রান্নাঘরের প্রতিটি শেফ হেয়ারনেট পরেন। আহমেদ হেয়ারনেট পরেন না। কোন বিবৃতিটি সঠিক?","id":"Setiap koki di dapur ini memakai penutup kepala. Ahmed tidak memakai penutup kepala. Pernyataan mana yang benar?","ne":"यस भान्सामा हरेक शेफले टोपी लगाउँछन्। अहमदले टोपी लगाएका छैनन्। कुन कथन सही छ?"},"o":{"ar":["أحمد طاهٍ بالتأكيد وقد نسي غطاء الرأس اليوم فقط","أحمد ليس طاهياً في هذا المطبخ، حسب القاعدة","أحمد ربما يكون طاهياً لأن غطاء الرأس ليس مطلوباً دائماً","أحمد يرتدي غطاء الرأس أحياناً، لذلك قد يكون طاهياً"],"en":["Ahmed is definitely a chef who simply forgot his hairnet today","Ahmed is not a chef in this kitchen, as the rule shows","Ahmed may be a chef, because hairnets are not always required","Ahmed sometimes wears a hairnet, so he might be a chef"],"hi":["अहमद पक्का शेफ़ है, बस आज उसने हेयरनेट पहनना भूल गया","इस नियम के अनुसार, अहमद इस रसोई में शेफ़ नहीं है","अहमद शायद शेफ़ हो, क्योंकि हेयरनेट हमेशा ज़रूरी नहीं होता","अहमद कभी-कभी हेयरनेट पहनता है, इसलिए वह शेफ़ हो सकता है"],"bn":["আহমদ নিশ্চিত একজন শেফ, আজ শুধু হেয়ারনেট পরতে ভুলে গেছে","এই নিয়ম অনুযায়ী, আহমদ এই রান্নাঘরের শেফ নয়","আহমদ হয়তো শেফ, কারণ হেয়ারনেট সবসময় বাধ্যতামূলক নয়","আহমদ মাঝে মাঝে হেয়ারনেট পরে, তাই সে শেফ হতে পারে"],"id":["Ahmed pasti seorang koki yang hari ini lupa memakai penutup kepala","Berdasarkan aturan ini, Ahmed bukan koki di dapur ini","Ahmed mungkin koki, karena penutup kepala tidak selalu wajib","Ahmed kadang memakai penutup kepala, jadi ia mungkin seorang koki"],"ne":["अहमद निश्चित रूपमा एक शेफ हुन् जसले आज टोपी बिर्सिए","अहमद यस भान्सामा शेफ होइनन्, नियमले देखाए अनुसार","अहमद शेफ हुन सक्छन्, किनभने टोपी सधैं अनिवार्य हुँदैन","अहमद कहिलेकाहीँ टोपी लगाउँछन्, त्यसैले उनी शेफ हुन सक्छन्"]},"c":1},
 {"cat":{"ar":"نمط","en":"Reasoning","hi":"तर्क","bn":"যুক্তি","id":"Penalaran","ne":"तार्किक सोच"},"q":{"ar":"أي رقم لا ينتمي للمجموعة: 4، 9، 16، 25، 36، 42؟","en":"Which number does not belong in this group: 4, 9, 16, 25, 36, 42?","hi":"इस समूह में कौन सी संख्या सही नहीं बैठती: 4, 9, 16, 25, 36, 42?","bn":"এই গ্রুপে কোন সংখ্যাটি মেলে না: ৪, ৯, ১৬, ২৫, ৩৬, ৪২?","id":"Angka mana yang tidak termasuk dalam kelompok ini: 4, 9, 16, 25, 36, 42?","ne":"यस समूहमा कुन संख्या मेल खाँदैन: 4, 9, 16, 25, 36, 42?"},"o":{"ar":["9","25","42","36"],"en":["9","25","42","36"],"hi":["9","25","42","36"],"bn":["৯","২৫","৪২","৩৬"],"id":["9","25","42","36"],"ne":["9","25","42","36"]},"c":2},
 {"cat":{"ar":"حساب","en":"Calculation","hi":"गणना","bn":"হিসাব","id":"Hitungan","ne":"गणना"},"q":{"ar":"عامل ينظف 4 محطات في 20 دقيقة بنفس السرعة. كم دقيقة يحتاج لتنظيف 7 محطات؟","en":"A worker cleans 4 stations in 20 minutes at a steady pace. How many minutes will 7 stations take?","hi":"एक कर्मचारी 20 मिनट में 4 स्टेशन साफ करता है, एक समान गति से। 7 स्टेशन में कितने मिनट लगेंगे?","bn":"একজন কর্মী সমান গতিতে ২০ মিনিটে ৪টি স্টেশন পরিষ্কার করেন। ৭টি স্টেশনে কত মিনিট লাগবে?","id":"Seorang pekerja membersihkan 4 stasiun dalam 20 menit dengan kecepatan tetap. Berapa menit untuk 7 stasiun?","ne":"एक कामदारले स्थिर गतिमा 20 मिनेटमा 4 स्टेसन सफा गर्छ। 7 स्टेसन सफा गर्न कति मिनेट लाग्छ?"},"o":{"ar":["30 دقيقة","40 دقيقة","45 دقيقة","35 دقيقة"],"en":["30 minutes","40 minutes","45 minutes","35 minutes"],"hi":["30 मिनट","40 मिनट","45 मिनट","35 मिनट"],"bn":["৩০ মিনিট","৪০ মিনিট","৪৫ মিনিট","৩৫ মিনিট"],"id":["30 menit","40 menit","45 menit","35 menit"],"ne":["30 मिनेट","40 मिनेट","45 मिनेट","35 मिनेट"]},"c":3},
 {"cat":{"ar":"أولويات","en":"Prioritizing","hi":"प्राथमिकता","bn":"অগ্রাধিকার","id":"Prioritas","ne":"प्राथमिकता निर्धारण"},"q":{"ar":"وصل المفتش أثناء تفريغ شحنة لحم نيء عند الباب الخلفي، وشكا زبون عند الكاونتر. ما الأولوية؟","en":"An inspector arrives while raw meat is being unloaded at the back door, and a customer complains at the counter. What is the priority?","hi":"पिछले दरवाज़े पर कच्चे मांस की उतराई चल रही है, तभी इंस्पेक्टर आता है और काउंटर पर एक ग्राहक शिकायत करता है। प्राथमिकता क्या है?","bn":"পিছনের দরজায় কাঁচা মাংস নামানো হচ্ছে, এমন সময় একজন পরিদর্শক আসেন এবং কাউন্টারে একজন গ্রাহক অভিযোগ করেন। অগ্রাধিকার কী?","id":"Seorang inspektur datang saat daging mentah sedang dibongkar di pintu belakang, dan pelanggan mengeluh di kasir. Apa prioritasnya?","ne":"पछाडिको ढोकामा काँचो मासु उतारिँदै गर्दा निरीक्षक आउँछन्, र काउन्टरमा एक ग्राहक गुनासो गर्छन्। प्राथमिकता के हो?"},"o":{"ar":["إدخال اللحم النيء إلى التخزين البارد أولاً حفاظاً على سلامة الطعام","تحية المفتش أولاً ثم التعامل مع باقي المهام","معالجة شكوى الزبون أولاً لأنها أكثر إلحاحاً","إنهاء الأوراق أولاً حتى يراها المفتش فوراً"],"en":["Get the raw meat into cold storage first, to protect food safety","Greet the inspector first and then deal with the other tasks","Address the customer complaint first, because an unhappy customer is more urgent right now","Finish the paperwork first so the inspector can see it at once"],"hi":["कच्चे मांस को पहले ठंडे भंडारण में रखें, ताकि खाने की सुरक्षा बनी रहे","पहले निरीक्षक का स्वागत करें और फिर बाकी काम देखें","पहले ग्राहक की शिकायत सुलझाएँ क्योंकि वह ज़्यादा ज़रूरी है","पहले कागज़ात पूरे करें ताकि निरीक्षक उन्हें तुरंत देख सके"],"bn":["কাঁচা মাংস আগে ঠান্ডা মজুত জায়গায় রাখুন, খাবারের নিরাপত্তা বজায় রাখতে","আগে পরিদর্শককে স্বাগত জানিয়ে তারপর বাকি কাজ দেখুন","আগে গ্রাহকের অভিযোগ মেটান, কারণ সেটি বেশি জরুরি","আগে কাগজপত্র শেষ করুন যাতে পরিদর্শক তা তৎক্ষণাৎ দেখতে পারেন"],"id":["Masukkan daging mentah ke penyimpanan dingin dulu, demi menjaga keamanan makanan","Sambut pemeriksa terlebih dahulu lalu tangani tugas lainnya","Tangani keluhan pelanggan dulu karena lebih mendesak","Selesaikan administrasi dulu agar pemeriksa bisa langsung melihatnya"],"ne":["खाद्य सुरक्षा सुरक्षित राख्न पहिले काँचो मासुलाई चिसो भण्डारणमा राख्ने","पहिले निरीक्षकलाई अभिवादन गर्ने र त्यसपछि अन्य काम गर्ने","पहिले ग्राहकको गुनासो सम्बोधन गर्ने, किनकि अहिले असन्तुष्ट ग्राहक अझ जरुरी छ","पहिले कागजात सिध्याउने ताकि निरीक्षकले तुरुन्तै देख्न सकून्"]},"c":0},
