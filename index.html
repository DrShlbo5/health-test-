د وتزيد من احترامك لذاتك.","It boosts your self-confidence: you feel proud of good work and gain more self-respect.","यह आपका आत्मविश्वास बढ़ाता है: अच्छे काम पर गर्व होता है और आत्मसम्मान बढ़ता है।","এটি আত্মবিশ্বাস বাড়ায়: ভালো কাজে গর্ব হয় এবং নিজের প্রতি সম্মান বাড়ে।","Meningkatkan kepercayaan diri: Anda merasa bangga atas pekerjaan baik dan lebih menghargai diri sendiri."],["h2","التثقيف الصحي","Health education","स्वास्थ्य शिक्षा","স্বাস্থ্য শিক্ষা","Pendidikan kesehatan"],["p","التثقيف الصحي هو برنامج تدريبي يجمع بين الجوانب النظرية والعملية، يهدف إلى تعريفك بالأخطار المحتملة في بيئة العمل.","Health education is a training programme that combines theory and practice, aiming to make you aware of the possible hazards in the work environment.","स्वास्थ्य शिक्षा एक प्रशिक्षण कार्यक्रम है जो सैद्धांतिक और व्यावहारिक पहलुओं को जोड़ता है और कार्य वातावरण के संभावित खतरों से आपको परिचित कराता है।","স্বাস্থ্য শিক্ষা এমন একটি প্রশিক্ষণ কর্মসূচি যা তত্ত্ব ও ব্যবহারিককে একত্র করে এবং কর্মপরিবেশের সম্ভাব্য ঝুঁকি সম্পর্কে আপনাকে সচেতন করে।","Pendidikan kesehatan adalah program pelatihan yang menggabungkan teori dan praktik, bertujuan mengenalkan bahaya yang mungkin ada di lingkungan kerja."],["p","إنها طريقة سهلة وبسيطة لتعليم العامل كل ما يحتاجه لمعرفته لضمان سلامة الغذاء المقدم للعملاء.","It is a simple way to teach workers everything they need to know to ensure the safety of food served to customers.","यह कर्मचारियों को वह सब सिखाने का सरल तरीका है जो ग्राहकों को परोसे जाने वाले भोजन की सुरक्षा के लिए ज़रूरी है।","গ্রাহকদের পরিবেশিত খাবারের নিরাপত্তা নিশ্চিত করতে কর্মীদের যা জানা দরকার, তা শেখানোর সহজ উপায় এটি।","Ini cara sederhana untuk mengajarkan pekerja semua yang perlu mereka ketahui agar makanan yang disajikan kepada pelanggan aman."],["p","ستكتشف كيف تحمي صحتك وصحة عملائك، وكيف تساهم في نجاح منشأتك، وكيف تفهم أسباب تلوث الغذاء وكيفية الوقاية منه، وكيفية تطبيق أفضل الممارسات في مجال سلامة الأغذية. باختصار، نتعلم كيف نقدم غذاءً آمناً للجميع.","You will discover how to protect your health and your customers' health, how you contribute to your establishment's success, how to understand the causes of food contamination and how to prevent it, and how to apply best practices in food safety. In short, we learn how to serve safe food to everyone.","आप जानेंगे कि अपने और ग्राहकों के स्वास्थ्य की रक्षा कैसे करें, प्रतिष्ठान की सफलता में आपका योगदान कैसा है, भोजन दूषित होने के कारण क्या हैं और उनसे कैसे बचें, और खाद्य सुरक्षा की सर्वोत्तम पद्धतियाँ कैसे लागू करें। संक्षेप में, हम सीखते हैं कि सबको सुरक्षित भोजन कैसे परोसें।","আপনি জানবেন কীভাবে নিজের ও গ্রাহকদের স্বাস্থ্য রক্ষা করবেন, প্রতিষ্ঠানের সাফল্যে আপনার ভূমিকা কী, খাদ্য দূষণের কারণ কী ও কীভাবে প্রতিরোধ করা যায়, এবং খাদ্য নিরাপত্তার সেরা পদ্ধতি কীভাবে প্রয়োগ করা যায়। সংক্ষেপে, সবাইকে নিরাপদ খাবার কীভাবে পরিবেশন করা যায় তা শিখব।","Anda akan mempelajari cara melindungi kesehatan Anda dan pelanggan, kontribusi Anda bagi keberhasilan usaha, penyebab kontaminasi makanan dan cara mencegahnya, serta penerapan praktik terbaik keamanan pangan. Singkatnya, kita belajar menyajikan makanan yang aman bagi semua orang."],["h3","ما هي أنواع التثقيف الصحي؟","What are the types of health education?","स्वास्थ्य शिक्षा के प्रकार क्या हैं?","স্বাস्থ্য শিক্ষার ধরন কী কী?","Apa saja jenis pendidikan kesehatan?"],["li","للعمال الجدد: تدريب أساسي قبل بدء العمل.","For new workers: basic training before starting work.","नए कर्मचारियों के लिए: काम शुरू करने से पहले बुनियादी प्रशिक्षण।","নতুন কর্মীদের জন্য: কাজ শুরুর আগে মৌলিক প্রশিক্ষণ।","Untuk pekerja baru: pelatihan dasar sebelum mulai bekerja."],["li","للعمال الحاليين: تدريب مستمر لتذكيرهم بالقواعد المهمة.","For current workers: ongoing training to remind them of the important rules.","वर्तमान कर्मचारियों के लिए: महत्वपूर्ण नियमों की याद दिलाने हेतु निरंतर प्रशिक्षण।","বর্তমান কর্মীদের জন্য: গুরুত্বপূর্ণ নিয়মগুলো মনে করিয়ে দিতে চলমান প্রশিক্ষণ।","Untuk pekerja yang sudah bekerja: pelatihan berkelanjutan untuk mengingatkan aturan penting."],["li","للمشرفين: تدريب متقدم ليتمكنوا من توجيه العمال.","For supervisors: advanced training so they can guide workers.","पर्यवेक्षकों के लिए: उन्नत प्रशिक्षण ताकि वे कर्मचारियों का मार्गदर्शन कर सकें।","সুপারভাইজারদের জন্য: উন্নত প্রশিক্ষণ যাতে তারা কর্মীদের নির্দেশনা দিতে পারেন।","Untuk supervisor: pelatihan lanjutan agar mereka dapat membimbing pekerja."],["h3","ما هو التثقيف الصحي التنشيطي؟","What is refresher health education?","स्वास्थ्य शिक्षा का पुनश्चर्या (रिफ्रेशर) रूप क्या है?","স্বাস্থ্য শিক্ষার রিফ্রেশার কী?","Apa itu pendidikan kesehatan penyegaran?"],["li","هو تدريب منتظم كل 3 سنوات لتذكيرك بما تعلمته.","It is regular training every 3 years to remind you of what you learned.","यह हर 3 वर्ष में नियमित प्रशिक्षण है ताकि आप जो सीखा है उसे याद रखें।","এটি প্রতি ৩ বছর পর নিয়মিত প্রশিক্ষণ, যাতে আপনি যা শিখেছেন তা মনে থাকে।","Pelatihan rutin setiap 3 tahun untuk mengingatkan apa yang telah Anda pelajari."],["li","يساعدك على تحديث معلوماتك.","It helps you update your information.","यह आपकी जानकारी को अद्यतन रखने में मदद करता है।","এটি আপনার তথ্য হালনাগাদ রাখতে সাহায্য করে।","Membantu Anda memperbarui pengetahuan."],["li","يضمن استمرارك في تقديم أفضل أداء.","It ensures you keep delivering your best performance.","यह सुनिश्चित करता है कि आप लगातार अपना सर्वश्रेष्ठ प्रदर्शन करते रहें।","এটি নিশ্চিত করে যে আপনি ক্রমাগত সেরা কাজ করে যাবেন।","Memastikan Anda terus memberikan kinerja terbaik."],["h2","الرقابة الصحية","Health inspection","स्वास्थ्य निरीक्षण","স্বাস্থ্য তদারকি","Inspeksi kesehatan"],["h3","الرقابة الصحية الرسمية","Official health inspection","आधिकारिक स्वास्थ्य निरीक्षण","সরকারি স্বাস্থ্য তদারকি","Inspeksi kesehatan resmi"],["li","من يقوم بها؟ مراقبون متخصصون من الجهات الحكومية المعنية بسلامة الغذاء. أو مراقبو شركات متخصصة في مجال سلامة الغذاء متعاقدة مع الجهات الحكومية المعنية للقيام بأعمال الرقابة الصحية.","Who carries it out? Specialised inspectors from the government bodies responsible for food safety, or inspectors from specialised companies contracted with those government bodies to carry out health inspection.","इसे कौन करता है? खाद्य सुरक्षा के लिए जिम्मेदार सरकारी संस्थाओं के विशेषज्ञ निरीक्षक, या उनसे अनुबंधित विशेष कंपनियों के निरीक्षक।","কে করে? খাদ্য নিরাপত্তার দায়িত্বে থাকা সরকারি সংস্থার বিশেষজ্ঞ পরিদর্শক, বা সেসব সংস্থার সঙ্গে চুক্তিবদ্ধ বিশেষায়িত কোম্পানির পরিদর্শক।","Siapa yang melakukannya? Inspektur ahli dari lembaga pemerintah yang bertanggung jawab atas keamanan pangan, atau inspektur dari perusahaan khusus yang bekerja sama dengan lembaga tersebut."],["li","ما هي؟ هؤلاء المراقبون يقومون بزيارات دورية للمنشآت الغذائية لفحصها والتأكد من التزامها بالاشتراطات الصحية.","What is it? These inspectors make periodic visits to food establishments to examine them and confirm they comply with health requirements.","यह क्या है? ये निरीक्षक खाद्य प्रतिष्ठानों का नियमित दौरा करके जांचते हैं कि वे स्वास्थ्य मानकों का पालन करते हैं।","এটা কী? এই পরিদর্শকরা খাদ্য প্রতিষ্ঠানে নিয়মিত পরিদর্শন করে স্বাস্থ্য বিধি মানা হচ্ছে কিনা তা যাচাই করেন।","Apa itu? Inspektur ini melakukan kunjungan berkala ke usaha pangan untuk memeriksa kepatuhan terhadap persyaratan kesehatan."],["li","ما الهدف منها؟ ضمان سلامة الغذاء وحماية صحة المستهلكين.","What is the purpose? To ensure food safety and protect consumers' health.","उद्देश्य क्या है? भोजन की सुरक्षा सुनिश्चित करना और उपभोक्ताओं के स्वास्थ्य की रक्षा करना।","উদ্দেশ্য কী? খাদ্যের নিরাপত্তা নিশ্চিত করা এবং ভোক্তাদের স্বাস্থ্য রক্ষা করা।","Tujuannya? Memastikan keamanan pangan dan melindungi kesehatan konsumen."],["h3","الرقابة الصحية الذاتية","Self health inspection","स्वयं स्वास्थ्य निरीक्षण","স্বতঃ স্বাস্থ্য তদারকি","Inspeksi kesehatan mandiri"],["li","من يقوم بها؟ مدير المنشأة والمشرفون والعاملون في المنشأة الغذائية أنفسهم.","Who carries it out? The establishment manager, supervisors and workers in the food establishment themselves.","इसे कौन करता है? प्रतिष्ठान के प्रबंधक, पर्यवेक्षक और कर्मचारी स्वयं।","কে করে? প্রতিষ্ঠানের ম্যানেজার, সুপারভাইজার ও কর্মীরা নিজেরাই।","Siapa yang melakukannya? Manajer usaha, supervisor, dan pekerja di usaha pangan itu sendiri."],["li","ما هي؟ هي عملية فحص دورية يقوم بها مدير المنشأة والمشرفون والعاملون للتأكد من النظافة الشخصية والعاملين، ونظافة المكان والمعدات واتباع جميع الإجراءات الصحية.","What is it? A periodic check carried out by the manager, supervisors and workers to confirm personal hygiene, cleanliness of the premises and equipment, and compliance with all health procedures.","यह क्या है? प्रबंधक, पर्यवेक्षक और कर्मचारियों द्वारा नियमित जांच, जिससे व्यक्तिगत स्वच्छता, परिसर और उपकरणों की सफाई और सभी स्वास्थ्य प्रक्रियाओं का पालन सुनिश्चित हो।","এটা কী? ব্যবস্থাপক, সুপারভাইজার ও কর্মীদের নিয়মিত পরীক্ষা, যাতে ব্যক্তিগত পরিচ্ছন্নতা, স্থান ও সরঞ্জামের পরিচ্ছন্নতা এবং সব স্বাস্থ্য বিধি মানা নিশ্চিত হয়।","Apa itu? Pemeriksaan berkala oleh manajer, supervisor dan pekerja untuk memastikan kebersihan pribadi, kebersihan tempat dan peralatan, serta kepatuhan pada seluruh prosedur kesehatan."],["li","ما الهدف منها؟ ضمان سلامة الغذاء المقدم للمستهلكين.","What is the purpose? To ensure the safety of food served to consumers.","उद्देश्य क्या है? उपभोक्ताओं को परोसे जाने वाले भोजन की सुरक्षा सुनिश्चित करना।","উদ্দেশ্য কী? ভোক্তাদের পরিবেশিত খাবারের নিরাপত্তা নিশ্চিত করা।","Tujuannya? Memastikan keamanan makanan yang disajikan kepada konsumen."],["h2","متداولو الغذاء","Food handlers","खाद्य संभालने वाले कर्मचारी","খাদ্য পরিচালনাকারী","Penjamah pangan"],["p","طبقاً لتعريف نظام الغذاء السعودي، يُعتبر متداول الغذاء \"كل من يتعامل مع الغذاء عبر الممارسات التي يمر بها الغذاء خلال السلسلة الغذائية\".","According to the Saudi food system definition, a food handler is \"anyone who deals with food through the practices the food goes through during the food chain\".","सऊदी खाद्य प्रणाली की परिभाषा के अनुसार, खाद्य संभालने वाला वह है \"जो खाद्य आपूर्ति श्रृंखला के दौरान भोजन से जुड़ी प्रक्रियाओं के माध्यम से भोजन से व्यवहार करता है\"।","সৌদি খাদ্য ব্যবস্থার সংজ্ঞা অনুযায়ী, খাদ্য পরিচালনাকারী হলো \"যে খাদ্য সরবরাহ শৃঙ্খলে খাদ্যের যেসব প্রক্রিয়া ঘটে, সেগুলোর মাধ্যমে খাবারের সঙ্গে কাজ করে\"।","Menurut definisi sistem pangan Saudi, penjamah pangan adalah \"setiap orang yang menangani pangan melalui praktik yang dilalui pangan dalam rantai pangan\"."],["li","الأشخاص الذين يتعاملون بشكل مباشر أو غير مباشر مع الغذاء في عملهم.","People who deal directly or indirectly with food in their work.","वे लोग जो अपने काम में भोजन से सीधे या अप्रत्यक्ष रूप से जुड़े हैं।","যারা তাদের কাজে সরাসরি বা পরোক্ষভাবে খাবারের সঙ্গে কাজ করেন।","Orang yang berhubungan langsung atau tidak langsung dengan pangan dalam pekerjaannya."],["li","الأشخاص الذين يلمسون الأسطح أو الأدوات التي تلامس الغذاء.","People who touch surfaces or tools that come into contact with food.","वे लोग जो सतहों या उन औज़ारों को छूते हैं जो भोजन के संपर्क में आते हैं।","যারা এমন পৃষ্ঠ বা সরঞ্জাম স্পর্শ করেন যা খাবারের সংস্পর্শে আসে।","Orang yang menyentuh permukaan atau peralatan yang bersentuhan dengan pangan."],["p","أمثلة على متداولي الغذاء:","Examples of food handlers:","खाद्य संभालने वालों के उदाहरण:","খাদ্য পরিচালনাকারীর উদাহরণ:","Contoh penjamah pangan:"],["li","الطباخون في المطاعم.","Cooks in restaurants.","रेस्तरां के रसोइये।","রেস্তোরাঁর রাঁধুনি।","Juru masak di restoran."],["li","عمال تعبئة الغذاء في المصانع.","Food packers in factories.","कारखानों में खाद्य पैकिंग कर्मचारी।","কারখানায় খাদ্য প্যাকিংকারী।","Pekerja pengemasan pangan di pabrik."],["li","بائعو الخضار والفواكه.","Vegetable and fruit sellers.","सब्ज़ी और फल विक्रेता।","সবজি ও ফল বিক্রেতা।","Penjual sayur dan buah."],["li","من ينظفون أدوات المطبخ.","Those who clean kitchen tools.","रसोई के औज़ार साफ करने वाले।","যারা রান্নাঘরের সরঞ্জাম পরিষ্কার করেন।","Orang yang membersihkan peralatan dapur."],["li","من يتعاملون مع عبوات الغذاء في المتاجر.","Those who handle food packaging in shops.","दुकानों में खाद्य पैकेट संभालने वाले।","দোকানে খাদ্যের প্যাকেট নাড়াচাড়া করেন যারা।","Orang yang menangani kemasan pangan di toko."],["h3","لماذا يعتبر هؤلاء متداولي غذاء؟","Why are these people considered food handlers?","ये लोग खाद्य संभालने वाले क्यों माने जाते हैं?","এঁরা কেন খাদ্য পরিচালনাকারী বলে গণ্য হন?","Mengapa mereka dianggap penjamah pangan?"],["li","حتى لو لم تلمس الغذاء مباشرة، يمكنك نقل الجراثيم إليه.","Even if you do not touch the food directly, you can transfer germs to it.","भले ही आप भोजन को सीधे न छुएं, आप उसमें कीटाणु पहुंचा सकते हैं।","এমনকি আপনি খাবার সরাসরি স্পর্শ না করলেও, খাবারে জীবাণু ছড়াতে পারেন।","Meskipun Anda tidak menyentuh pangan secara langsung, Anda tetap dapat memindahkan kuman ke pangan."],["li","الجراثيم يمكن أن تتنقل من يديك إلى الأسطح، ثم إلى الغذاء.","Germs can move from your hands to surfaces, then to the food.","कीटाणु आपके हाथों से सतहों पर और फिर भोजन पर पहुंच सकते हैं।","জীবাণু আপনার হাত থেকে পৃষ্ঠে, তারপর খাবারে যেতে পারে।","Kuman dapat berpindah dari tangan ke permukaan, lalu ke pangan."],["n","ماذا يعني هذا لنا؟: كل شخص في منشأة الغذاء له دور في سلامة الغذاء. يجب الانتباه لكل ما نلمسه، حتى لو لم يكن غذاءً. كل العاملين في منشأة الغذاء يحتاجون لفهم أساسيات سلامة الغذاء.","What this means for us: everyone in a food establishment has a role in food safety. We must pay attention to everything we touch, even if it is not food. All workers in a food establishment need to understand the basics of food safety.","हमारे लिए इसका अर्थ: खाद्य प्रतिष्ठान में हर व्यक्ति की खाद्य सुरक्षा में भूमिका है। हमें हर उस चीज़ पर ध्यान देना चाहिए जिसे हम छूते हैं, भले ही वह भोजन न हो। हर कर्मचारी को खाद्य सुरक्षा की बुनियादी बातें समझनी चाहिए।","আমাদের জন্য এর অর্থ: খাদ্য প্রতিষ্ঠানের প্রত্যেকের খাদ্য নিরাপত্তায় ভূমিকা আছে। খাবার না হলেও যা স্পর্শ করি সেদিকে খেয়াল রাখতে হবে। খাদ্য প্রতিষ্ঠানের সব কর্মীর খাদ্য নিরাপত্তার মূল বিষয় বোঝা দরকার।","Bagi kita: setiap orang di usaha pangan berperan dalam keamanan pangan. Perhatikan semua yang kita sentuh, meskipun bukan pangan. Semua pekerja perlu memahami dasar keamanan pangan."],["h2","اشتراطات العاملين في منشآت الغذاء","Requirements for workers in food establishments","खाद्य प्रतिष्ठानों में कर्मचारियों की आवश्यकताएँ","খাদ্য প্রতিষ্ঠানে কর্মীদের শর্তাবলি","Persyaratan pekerja di usaha pangan"],["h3","الشهادة الصحية","Health certificate","स्वास्थ्य प्रमाण पत्र","স্বাস্থ্য সনদ","Sertifikat kesehatan"],["p","يجب أن تحصل على شهادة صحية قبل العمل في مجال الغذاء. هذه الشهادة تثبت أنك:","You must obtain a health certificate before working in the food field. This certificate proves that you:","भोजन क्षेत्र में काम शुरू करने से पहले आपके पास स्वास्थ्य प्रमाण पत्र होना ज़रूरी है। यह प्रमाण पत्र साबित करता है कि आप:","খাদ্য খাতে কাজ শুরুর আগে আপনার স্বাস্থ্য সনদ থাকতে হবে। এই সনদ প্রমাণ করে যে আপনি:","Anda wajib memiliki sertifikat kesehatan sebelum bekerja di bidang pangan. Sertifikat ini menyatakan bahwa Anda:"],["li","خالٍ من الأمراض المعدية.","Are free of contagious diseases.","संक्रामक रोगों से मुक्त हैं।","সংক্রামক রোগমুক্ত।","Bebas dari penyakit menular."],["li","لا تحمل جراثيم تنتقل عبر الغذاء.","Do not carry germs that spread through food.","ऐसे कीटाणु नहीं रखते जो भोजन से फैलते हैं।","খাবারের মাধ্যমে ছড়ায় এমন জীবাণু বহন করেন না।","Tidak membawa kuman yang menular melalui pangan."],["p","للحصول على الشهادة:","To obtain the certificate:","प्रमाण पत्र पाने के लिए:","সনদ পেতে:","Untuk memperoleh sertifikat:"],["li","اذهب للجهة الصحية المختصة.","Go to the competent health authority.","सक्षम स्वास्थ्य प्राधिकरण के पास जाएँ।","দায়িত্বপ্রাপ্ত স্বাস্থ্য কর্তৃপক্ষের কাছে যান।","Datangi otoritas kesehatan yang berwenang."],["li","قم بعمل الفحوصات الطبية اللازمة.","Carry out the necessary medical tests.","ज़रूरी चिकित्सा जांच करवाएँ।","প্রয়োজনীয় চিকিৎসা পরীক্ষা করান।","Lakukan pemeriksaan medis yang diperlukan."],["li","خذ التطعيمات المطلوبة.","Take the required vaccinations.","आवश्यक टीकाकरण करवाएँ।","প্রয়োজনীয় টিকা নিন।","Lakukan vaksinasi yang diwajibkan."],["h3","تجديد الشهادة الصحية","Renewing the health certificate","स्वास्थ्य प्रमाण पत्र का नवीनीकरण","স্বাস্থ্য সনদ নবায়ন","Memperbarui sertifikat kesehatan"],["li","الشهادة صالحة لمدة سنة واحدة فقط.","The certificate is valid for one year only.","प्रमाण पत्र केवल एक वर्ष के लिए वैध है।","সনদটি শুধু এক বছরের জন্য বৈধ।","Sertifikat berlaku hanya selama satu tahun."],["li","جددها قبل انتهائها.","Renew it before it expires.","समाप्त होने से पहले इसे नवीनीकृत करवाएँ।","মেয়াদ শেষ হওয়ার আগে নবায়ন করুন।","Perbarui sebelum masa berlakunya habis."],["li","إجراءات التجديد هي نفس إجراءات الحصول على الشهادة لأول مرة.","The renewal procedure is the same as obtaining the certificate for the first time.","नवीनीकरण की प्रक्रिया वही है जो पहली बार प्रमाण पत्र लेने की होती है।","নবায়নের প্রক্রিয়া প্রথমবার সনদ নেওয়ার প্রক্রিয়ার মতোই।","Prosedur pembaruan sama dengan prosedur memperoleh sertifikat pertama kali."],["n","ماذا يعني هذا لنا؟: الشهادة الصحية تثبت أننا نحمي العملاء والمستهلكين من الأمراض المنقولة بالغذاء. نأخذ التطعيمات المطلوبة لحماية أنفسنا والآخرين من الأمراض التي تنتقل بالغذاء. نبني سمعة جيدة لأنفسنا ولمكان عملنا بالالتزام بهذه المتطلبات.","What this means for us: the health certificate shows that we protect customers and consumers from foodborne diseases. We take the required vaccinations to protect ourselves and others from diseases spread through food. We build a good reputation for ourselves and our workplace by meeting these requirements.","हमारे लिए इसका अर्थ: स्वास्थ्य प्रमाण पत्र दिखाता है कि हम ग्राहकों और उपभोक्ताओं को भोजन से फैलने वाली बीमारियों से बचाते हैं। हम खुद और दूसरों को बचाने के लिए ज़रूरी टीके लगवाते हैं। इन शर्तों के पालन से हमारी और हमारे कार्यस्थल की अच्छी साख बनती है।","আমাদের জন্য এর অর্থ: স্বাস্থ্য সনদ প্রমাণ করে যে আমরা গ্রাহক ও ভোক্তাদের খাবারবাহিত রোগ থেকে রক্ষা করি। নিজেদের ও অন্যদের খাবারবাহিত রোগ থেকে বাঁচাতে প্রয়োজনীয় টিকা নিই। এসব শর্ত মেনে আমরা নিজেদের ও কর্মস্থলের ভালো সুনাম গড়ি।","Bagi kita: sertifikat kesehatan menunjukkan bahwa kita melindungi pelanggan dan konsumen dari penyakit bawaan pangan. Kita menjalani vaksinasi yang diwajibkan untuk melindungi diri sendiri dan orang lain. Dengan memenuhi syarat ini, kita membangun reputasi baik bagi diri sendiri dan tempat kerja."],["h3","ماذا تفعل إذا مرضت أو أصبت؟","What to do if you become ill or get injured","अगर आप बीमार हों या चोट लगे तो क्या करें?","অসুস্থ হলে বা আহত হলে কী করবেন?","Apa yang harus dilakukan jika Anda sakit atau terluka?"],["p","في حالة المرض: إذا شعرت بأي من هذه الأعراض: مرض معدٍ، إسهال، جروح ملتهبة، التهابات جلدية. يجب عليك: إخبار مشرفك فوراً. عدم العمل في تحضير أو تداول الغذاء. مراجعة المستشفى أو المركز الصحي.","If the illness: if you feel any of these symptoms: contagious illness, diarrhoea, infected wounds, skin infections. You must: tell your supervisor immediately. Do not work in preparing or handling food. Visit a hospital or health centre.","बीमारी की स्थिति में: यदि आपको इनमें से कोई लक्षण हो: संक्रामक रोग, दस्त, संक्रमित घाव, त्वचा संक्रमण। आपको: तुरंत अपने पर्यवेक्षक को बताना होगा। भोजन तैयार करने या संभालने का काम नहीं करना होगा। अस्पताल या स्वास्थ्य केंद्र जाना होगा।","অসুস্থতার ক্ষেত্রে: এই লক্ষণগুলোর যেকোনো একটি থাকলে: সংক্রামক রোগ, ডায়রিয়া, পুঁজযুক্ত ক্ষত, ত্বকের সংক্রমণ। আপনাকে: অবিলম্বে সুপারভাইজারকে জানাতে হবে। খাবার তৈরি বা পরিচালনার কাজ করা যাবে না। হাসপাতাল বা স্বাস্থ্যকেন্দ্রে যেতে হবে।","Jika sakit: jika Anda mengalami gejala berikut: penyakit menular, diare, luka bernanah, infeksi kulit. Anda harus: segera memberi tahu supervisor. Tidak bekerja menyiapkan atau menangani pangan. Memeriksakan diri ke rumah sakit atau puskesmas."],["p","في حالة الإصابة أثناء العمل: توقف عن العمل فوراً. غطِ الجرح بشريط طبي: مقاوم للماء، ملون (لسهولة رؤيته إذا سقط في الغذاء)، مثبت بإحكام. استخدم قفازاً يغطي مكان الإصابة. لا تعد للعمل إلا بعد الشفاء التام.","If injured at work: stop working immediately. Cover the wound with a medical dressing that is: waterproof, coloured (so it is easy to see if it falls into food), and firmly fixed. Use a glove covering the injury. Return to work only after full recovery.","काम के दौरान चोट लगने पर: तुरंत काम बंद करें। घाव को चिकित्सा पट्टी से ढकें: जो पानी-रोधी हो, रंगीन हो (ताकि भोजन में गिरे तो आसानी से दिखे), और मज़बूती से चिपकी हो। चोट वाली जगह पर दस्ताना पहनें। पूरी तरह ठीक होने के बाद ही काम पर लौटें।","কর্মক্ষেত্রে আঘাত পেলে: অবিলম্বে কাজ বন্ধ করুন। ক্ষত চিকিৎসা ব্যান্ডেজ দিয়ে ঢাকুন: যা জলরোধী, রঙিন (খাবারে পড়লে সহজে চোখে পড়ে) এবং শক্ত করে আটকানো। আহত স্থানে গ্লাভস পরুন। সম্পূর্ণ সুস্থ হওয়ার পর কাজে ফিরুন।","Jika terluka saat bekerja: segera hentikan pekerjaan. Tutup luka dengan plester medis yang tahan air, berwarna (agar mudah terlihat jika jatuh ke pangan), dan terpasang kuat. Gunakan sarung tangan yang menutupi luka. Kembali bekerja hanya setelah sembuh total."],["n","ماذا يعني هذا لنا؟: الإبلاغ عن المرض يمنع انتشار الأمراض. نحن مسؤولون عن إدراك صحتنا والإبلاغ عنها. التوقف عن العمل عند المرض يحمي الجميع. إخبارنا للمشرف يظهر التزامنا بالسلامة.","What this means for us: reporting illness prevents the spread of disease. We are responsible for recognising our health and reporting it. Stopping work when ill protects everyone. Telling the supervisor shows our commitment to safety.","हमारे लिए इसका अर्थ: बीमारी की सूचना देने से रोग फैलने से रुकता है। अपने स्वास्थ्य को पहचानना और उसकी सूचना देना हमारी ज़िम्मेदारी है। बीमार होने पर काम रोकना सबकी रक्षा करता है। पर्यवेक्षक को बताना सुरक्षा के प्रति हमारी प्रतिबद्धता दिखाता है।","আমাদের জন্য এর অর্থ: অসুস্থতার খবর দিলে রোগ ছড়ানো রোধ হয়। নিজের স্বাস্থ্য বোঝা ও জানানো আমাদের দায়িত্ব। অসুস্থ থাকলে কাজ বন্ধ রাখা সবাইকে রক্ষা করে। সুপারভাইজারকে জানানো নিরাপত্তায় আমাদের অঙ্গীকার দেখায়।","Bagi kita: melaporkan sakit mencegah penyebaran penyakit. Kita bertanggung jawab mengenali dan melaporkan kondisi kesehatan kita. Berhenti bekerja saat sakit melindungi semua orang. Memberi tahu supervisor menunjukkan komitmen kita pada keselamatan."],["h2","النظافة الشخصية والسلوك","Personal hygiene and behaviour","व्यक्तिगत स्वच्छता और आचरण","ব্যক্তিগত পরিচ্ছন্নতা ও আচরণ","Kebersihan pribadi dan perilaku"],["p","يجب عليك دائماً:","You must always:","आपको हमेशा:","আপনাকে সবসময়:","Anda harus selalu:"],["li","الحفاظ على نظافتك الشخصية.","Keep yourself clean.","अपनी व्यक्तिगत सफाई बनाए रखें।","নিজের ব্যক্তিগত পরিচ্ছন্নতা বজায় রাখুন।","Menjaga kebersihan diri."],["li","الحفاظ على نظافة مكان العمل.","Keep the workplace clean.","कार्यस्थल साफ रखें।","কর্মস্থল পরিষ্কার রাখুন।","Menjaga kebersihan tempat kerja."],["li","حماية الغذاء من التلوث.","Protect food from contamination.","भोजन को संदूषण से बचाएँ।","খাবারকে দূষণ থেকে রক্ষা করুন।","Melindungi pangan dari kontaminasi."],["li","اتباع قواعد النظافة الجيدة.","Follow good hygiene rules.","अच्छे स्वच्छता नियमों का पालन करें।","ভালো পরিচ্ছন্নতার নিয়ম মেনে চলুন।","Mengikuti aturan kebersihan yang baik."],["li","ارتداء ملابس العمل المناسبة.","Wear appropriate work clothing.","उचित कार्य वस्त्र पहनें।","উপযুক্ত কাজের পোশাক পরুন।","Memakai pakaian kerja yang sesuai."],["n","ماذا يعني هذا لنا؟: الحفاظ على نظافتنا الشخصية مطلب نظامي ويعكس صورة المنشأة. نظافة مكان العمل مطلب نظامي وتقلل من مخاطر التلوث. التدريب يزودنا بأحدث معلومات السلامة. الالتزام بالممارسات الصحية يحمينا نظامياً.","What this means for us: personal cleanliness is a regulatory requirement and reflects the establishment's image. Workplace cleanliness is a regulatory requirement and reduces contamination risks. Training gives us the latest safety information. Following good health practices protects us as a system.","हमारे लिए इसका अर्थ: व्यक्तिगत सफाई एक नियामक आवश्यकता है और प्रतिष्ठान की छवि दर्शाती है। कार्यस्थल की सफाई भी नियामक आवश्यकता है और संदूषण का खतरा घटाती है। प्रशिक्षण से हमें सुरक्षा की ताज़ा जानकारी मिलती है। अच्छी स्वास्थ्य आदतें हमें नियमों के अनुसार सुरक्षित रखती हैं।","আমাদের জন্য এর অর্থ: ব্যক্তিগত পরিচ্ছন্নতা বিধিগত প্রয়োজন এবং প্রতিষ্ঠানের ভাবমূর্তি প্রতিফলিত করে। কর্মস্থলের পরিচ্ছন্নতাও বিধিগত প্রয়োজন এবং দূষণের ঝুঁকি কমায়। প্রশিক্ষণ আমাদের সর্বশেষ নিরাপত্তা তথ্য দেয়। স্বাস্থ্য বিধি মেনে চললে আমরা নিয়মমাফিক সুরক্ষিত থাকি।","Bagi kita: kebersihan pribadi adalah ketentuan peraturan dan mencerminkan citra usaha. Kebersihan tempat kerja juga ketentuan dan mengurangi risiko kontaminasi. Pelatihan memberi informasi keselamatan terbaru. Mematuhi praktik kesehatan melindungi kita secara sistematis."],["h3","التثقيف الصحي/التدريب","Health education / training","स्वास्थ्य शिक्षा / प्रशिक्षण","স্বাস্থ্য শিক্ষা / প্রশিক্ষণ","Pendidikan kesehatan / pelatihan"],["li","يجب عليك الحصول على التثقيف الصحي/التدريب قبل العمل في منشآت الغذاء.","You must obtain health education / training before working in food establishments.","खाद्य प्रतिष्ठानों में काम से पहले आपको स्वास्थ्य शिक्षा / प्रशिक्षण लेना ज़रूरी है।","খাদ্য প্রতিষ্ঠানে কাজের আগে আপনাকে স্বাস্থ্য শিক্ষা / প্রশিক্ষণ নিতে হবে।","Anda wajib mengikuti pendidikan kesehatan / pelatihan sebelum bekerja di usaha pangan."],["li","هذا التثقيف/التدريب يكون من مركز معتمد لتثقيف/تدريب العاملين في منشآت الغذاء والصحة العامة.","This education / training is provided by an accredited centre for training workers in food establishments and public health.","यह शिक्षा / प्रशिक्षण खाद्य प्रतिष्ठान और सार्वजनिक स्वास्थ्य कर्मचारियों को प्रशिक्षित करने वाले मान्यता प्राप्त केंद्र से होता है।","এই শিক্ষা / প্রশিক্ষণ খাদ্য প্রতিষ্ঠান ও জনস্বাস্থ্যের কর্মীদের প্রশিক্ষণে স্বীকৃত কেন্দ্র থেকে দেওয়া হয়।","Pendidikan / pelatihan ini diselenggarakan oleh pusat terakreditasi untuk melatih pekerja usaha pangan dan kesehatan masyarakat."]]},{"t":["مقدمة سلامة الغذاء","Introduction to food safety","खाद्य सुरक्षा का परिचय","খাদ্য নিরাপত্তার ভূমিকা","Pengantar keamanan pangan"],"r":[["h2","لماذا تهمنا سلامة الغذاء؟","Why does food safety matter to us?","हमारे लिए खाद्य सुरक्षा क्यों मायने रखती है?","খাদ্য নিরাপত্তা আমাদের জন্য কেন গুরুত্বপূর্ণ?","Mengapa keamanan pangan penting bagi kita?"],["h3","الأمراض المنقولة بالغذاء","Foodborne diseases","भोजन से फैलने वाली बीमारियाँ","খাবারবাহিত রোগ","Penyakit bawaan pangan"],["li","هناك أكثر من 200 مرض ينتقل عبر الغذاء.","There are more than 200 diseases transmitted through food.","भोजन के माध्यम से 200 से अधिक बीमारियाँ फैलती हैं।","খাবারের মাধ্যমে ২০০-রও বেশি রোগ ছড়ায়।","Ada lebih dari 200 penyakit yang ditularkan melalui pangan."],["li","الملايين يمرضون كل عام بسبب الغذاء غير الآمن.","Millions fall ill every year because of unsafe food.","असुरक्षित भोजन के कारण हर साल लाखों लोग बीमार पड़ते हैं।","অনিরাপদ খাবারের কারণে প্রতি বছর লক্ষ লক্ষ মানুষ অসুস্থ হয়।","Jutaan orang sakit setiap tahun karena pangan yang tidak aman."],["li","بعض الناس يموتون بسبب هذه الأمراض.","Some people die from these diseases.","इन बीमारियों से कुछ लोगों की मृत्यु हो जाती है।","এসব রোগে কিছু মানুষের মৃত্যু হয়।","Sebagian orang meninggal karena penyakit ini."],["li","الإسهال وحده يقتل حوالي 1.5 مليون طفل سنوياً.","Diarrhoea alone kills about 1.5 million children a year.","अकेले दस्त से हर साल लगभग 15 लाख बच्चों की मृत्यु होती है।","শুধু ডায়রিয়াতেই প্রতি বছর প্রায় ১৫ লক্ষ শিশুর মৃত্যু হয়।","Diare saja membunuh sekitar 1,5 juta anak setiap tahun."],["li","معظم هذه الحالات سببها الغذاء أو الماء الملوث.","Most of these cases are caused by contaminated food or water.","इन मामलों का अधिकांश कारण दूषित भोजन या पानी होता है।","এসব ঘটনার বেশিরভাগের কারণ দূষিত খাবার বা পানি।","Sebagian besar kasus ini disebabkan pangan atau air yang terkontaminasi."],["li","75% من الأمراض الجديدة تأتي من الحيوانات ومنتجاتها.","75% of new diseases come from animals and their products.","नई बीमारियों का 75% जानवरों और उनके उत्पादों से आता है।","নতুন রোগের ৭৫% প্রাণী ও তাদের উৎপাদন থেকে আসে।","75% penyakit baru berasal dari hewan dan produknya."],["h3","مشكلة فساد الغذاء","The problem of food spoilage","भोजन खराब होने की समस्या","খাবার নষ্টের সমস্যা","Masalah kerusakan pangan"],["li","فساد الغذاء يحدث عندما لا نهتم بسلامته.","Food spoils when we do not care about its safety.","भोजन तब खराब होता है जब हम उसकी सुरक्षा पर ध्यान नहीं देते।","খাবারের নিরাপত্তায় খেয়াল না রাখলে খাবার নষ্ট হয়।","Pangan rusak ketika kita tidak memperhatikan keamanannya."],["li","يؤثر سلباً على: موارد الغذاء، الأعمال التجارية، سلامة وثقة المستهلكين.","It harms: food resources, businesses, and the safety and trust of consumers.","इससे प्रभावित होते हैं: खाद्य संसाधन, व्यवसाय, और उपभोक्ताओं की सुरक्षा व भरोसा।","এতে ক্ষতিগ্রস্ত হয়: খাদ্যসম্পদ, ব্যবসা, এবং ভোক্তাদের নিরাপত্তা ও আস্থা।","Berdampak buruk pada: sumber daya pangan, usaha, serta keamanan dan kepercayaan konsumen."],["h3","توقعات المستهلكين","Consumer expectations","उपभोक्ताओं की अपेक्षाएँ","ভোক্তাদের প্রত্যাশা","Harapan konsumen"],["li","الغذاء ضروري لكل إنسان.","Food is essential for every person.","भोजन हर इंसान के लिए ज़रूरी है।","খাবার প্রতিটি মানুষের জন্য অপরিহার্য।","Pangan penting bagi setiap orang."],["li","الجميع يتوقع أن يكون غذاؤهم آمناً وصالحاً للأكل.","Everyone expects their food to be safe and fit to eat.","हर कोई उम्मीद करता है कि उसका भोजन सुरक्षित और खाने योग्य हो।","সবাই আশা করে তাদের খাবার নিরাপদ ও খাওয়ার উপযুক্ত হবে।","Setiap orang berharap pangannya aman dan layak dimakan."],["li","المستهلكون يثقون بنا لتقديم غذاء آمن.","Consumers trust us to serve safe food.","उपभोक्ता हम पर सुरक्षित भोजन परोसने का भरोसा करते हैं।","ভোক্তারা নিরাপদ খাবার পরিবেশনের জন্য আমাদের উপর আস্থা রাখেন।","Konsumen mempercayai kita untuk menyajikan pangan yang aman."],["h2","لماذا سلامة الغذاء مهمة الآن أكثر من قبل؟","Why is food safety more important now than before?","भोजन सुरक्षा अब पहले से अधिक ज़रूरी क्यों है?","আগের চেয়ে এখন খাদ্য নিরাপত্তা বেশি গুরুত্বপূর্ণ কেন?","Mengapa keamanan pangan kini lebih penting dari sebelumnya?"],["p","الغذاء غير الآمن يضر بسمعة المنشأة ويقلل أرباحها. لذلك أصبحت سلامة الغذاء أكثر أهمية الآن. كما أن تداول الغذاء غير الآمن يعتبر مخالفة للنظام الغذائي السعودي ولائحته التنفيذية.","Unsafe food harms an establishment's reputation and reduces its profits. That is why food safety has become more important now. Handling unsafe food is also a violation of the Saudi food system and its executive regulations.","असुरक्षित भोजन प्रतिष्ठान की साख को नुकसान पहुँचाता है और उसका मुनाफा घटाता है। इसीलिए खाद्य सुरक्षा अब और ज़रूरी हो गई है। असुरक्षित भोजन का व्यवहार सऊदी खाद्य प्रणाली और उसके क्रियान्वयन नियमों का उल्लंघन भी है।","অনিরাপদ খাবার প্রতিষ্ঠানের সুনাম নষ্ট করে এবং মুনাফা কমায়। তাই এখন খাদ্য নিরাপত্তা আরও গুরুত্বপূর্ণ। অনিরাপদ খাবার পরিচালনা সৌদি খাদ্য ব্যবস্থা ও এর নির্বাহী বিধির লঙ্ঘনও।","Pangan yang tidak aman merusak reputasi usaha dan mengurangi keuntungan. Karena itu keamanan pangan kini semakin penting. Menangani pangan yang tidak aman juga merupakan pelanggaran sistem pangan Saudi dan peraturan pelaksanaannya."],["p","دعونا نفهم الأسباب:","Let us understand the reasons:","आइए कारणों को समझें:","চলুন কারণগুলো বুঝি:","Mari pahami alasannya:"],["h3","تغير الجراثيم","Changing microbes","बदलते सूक्ष्मजीव","জীবাণুর পরিবর্তন","Perubahan mikroba"],["li","بعض الجراثيم أصبحت تنمو في ظروف كانت لا تنمو فيها من قبل (مثل البرودة).","Some microbes now grow in conditions where they could not grow before (such as cold).","कुछ सूक्ष्मजीव अब ऐसी परिस्थितियों में भी बढ़ते हैं जहाँ पहले नहीं बढ़ते थे (जैसे ठंड में)।","কিছু জীবাণু এখন এমন পরিবেশে বাড়ে যেখানে আগে বাড়ত না (যেমন ঠান্ডায়)।","Beberapa mikroba kini tumbuh dalam kondisi yang sebelumnya tidak memungkinkan (misalnya dingin)."],["li","بعض الأنواع أصبحت خطيرة حتى بكميات قليلة في الغذاء.","Some types have become dangerous even in small amounts in food.","कुछ प्रकार भोजन में थोड़ी मात्रा में भी खतरनाक हो गए हैं।","কিছু প্রজাতি খাবারে অল্প পরিমাণেও বিপজ্জনক হয়ে উঠেছে।","Beberapa jenis kini berbahaya meski dalam jumlah kecil di pangan."],["h3","تغير عادات الأكل","Changing eating habits","खाने की आदतों में बदलाव","খাওয়ার অভ্যাসের পরিবর্তন","Perubahan kebiasaan makan"],["li","زيادة الإقبال على تناول الصحي.","Growing demand for healthy eating.","स्वस्थ भोजन की बढ़ती माँग।","স্বাস্থ্যকর খাবারের চাহিদা বৃদ্ধি।","Meningkatnya minat pada makanan sehat."],["li","زيادة تناول الوجبات خارج المنزل ومطاعم الوجبات السريعة.","Increased eating outside the home and in fast-food restaurants.","घर से बाहर और फ़ास्ट-फ़ूड रेस्तरां में अधिक खाना।","বাড়ির বাইরে ও ফাস্টফুড রেস্তোরাঁয় বেশি খাওয়া।","Peningkatan makan di luar rumah dan restoran cepat saji."],["h3","تغير المجتمع","Changing society","समाज में बदलाव","সমাজের পরিবর্তন","Perubahan masyarakat"],["li","عدد كبار السن يزداد بسبب تحسن الرعاية الصحية.","The number of elderly people is rising because healthcare has improved.","स्वास्थ्य सेवाओं में सुधार के कारण बुज़ुर्गों की संख्या बढ़ रही है।","স্বাস্থ্যসেবার উন্নতির কারণে বয়স্কদের সংখ্যা বাড়ছে।","Jumlah lansia meningkat karena membaiknya layanan kesehatan."],["li","كثير من الناس لديهم جهاز مناعة ضعيف.","Many people have a weak immune system.","बहुत से लोगों की रोग-प्रतिरोधक क्षमता कमज़ोर होती है।","অনেক মানুষের রোগ প্রতিরোধ ক্ষমতা দুর্বল।","Banyak orang memiliki sistem kekebalan yang lemah."],["h3","تغير طرق إنتاج الغذاء","Changing food production methods","खाद्य उत्पादन के तरीकों में बदलाव","খাদ্য উৎপাদনের পদ্ধতিতে পরিবর্তন","Perubahan cara produksi pangan"],["li","الغذاء يأتي من كل أنحاء العالم.","Food comes from all over the world.","भोजन दुनिया के हर कोने से आता है।","খাবার সারা বিশ্ব থেকে আসে।","Pangan datang dari seluruh dunia."],["li","إنتاج كميات كبيرة من الغذاء قد يزيد فرص التلوث.","Producing large quantities of food may increase the chance of contamination.","बड़ी मात्रा में भोजन उत्पादन से संदूषण का खतरा बढ़ सकता है।","বড় পরিমাণে খাবার উৎপাদনে দূষণের সম্ভাবনা বাড়তে পারে।","Produksi pangan dalam jumlah besar dapat meningkatkan risiko kontaminasi."],["li","استخدام مواد حافظة أقل في الغذاء.","Less use of preservatives in food.","भोजन में कम परिरक्षकों (प्रिज़र्वेटिव) का उपयोग।","খাবারে কম সংরক্ষক ব্যবহার।","Penggunaan bahan pengawet yang lebih sedikit pada pangan."],["h2","الأدوار في مجال سلامة الغذاء","Roles in food safety","खाद्य सुरक्षा में भूमिकाएँ","খাদ্য নিরাপত্তায় ভূমিকা","Peran dalam keamanan pangan"],["p","سلامة الغذاء مسؤولية الجميع. دعونا نتعرف على دور كل طرف:","Food safety is everyone's responsibility. Let us look at each party's role:","भोजन सुरक्षा सबकी ज़िम्मेदारी है। आइए हर पक्ष की भूमिका देखें:","খাদ্য নিরাপত্তা সবার দায়িত্ব। চলুন প্রতিটি পক্ষের ভূমিকা জেনে নিই:","Keamanan pangan adalah tanggung jawab semua orang. Mari kenali peran masing-masing pihak:"],["h3","دور الجهات الحكومية المختصة","The role of competent government authorities","सक्षम सरकारी प्राधिकरणों की भूमिका","দায়িত্বপ্রাপ্ত সরকারি কর্তৃপক্ষের ভূমিকা","Peran otoritas pemerintah yang berwenang"],["p","تضع اللوائح وتفرض العقوبات على من لا يلتزم وتشجع الجميع على تطبيق قواعد السلامة. وتشمل مهامها:","They set regulations, impose penalties on those who do not comply, and encourage everyone to apply safety rules. Their tasks include:","वे नियम बनाते हैं, नियमों का पालन न करने वालों पर दंड लगाते हैं, और सभी को सुरक्षा नियम लागू करने के लिए प्रोत्साहित करते हैं। उनके कार्य हैं:","তারা বিধিমালা প্রণয়ন করে, বিধি না মানলে জরিমানা করে, এবং সবাইকে নিরাপত্তা বিধি প্রয়োগে উৎসাহিত করে। তাদের দায়িত্ব:","Mereka menetapkan peraturan, memberi sanksi bagi yang tidak patuh, dan mendorong semua pihak menerapkan aturan keamanan. Tugasnya meliputi:"],["li","حماية الناس من الأمراض التي يسببها الغذاء غير الآمن.","Protecting people from diseases caused by unsafe food.","असुरक्षित भोजन से होने वाली बीमारियों से लोगों की रक्षा।","অনিরাপদ খাবারে সৃষ্ট রোগ থেকে মানুষকে রক্ষা।","Melindungi masyarakat dari penyakit akibat pangan tidak aman."],["li","الاهتمام بالأشخاص الأكثر عرضة للمرض.","Giving attention to people most at risk of illness.","बीमारी के सबसे अधिक खतरे में रहने वाले लोगों पर ध्यान देना।","রোগের সবচেয়ে ঝুঁকিপূর্ণ মানুষের প্রতি মনোযোগ দেওয়া।","Memberi perhatian pada orang yang paling berisiko sakit."],["li","التأكد من أن الغذاء صالح للأكل.","Making sure food is fit to eat.","यह सुनिश्चित करना कि भोजन खाने योग्य है।","খাবার খাওয়ার উপযুক্ত কিনা তা নিশ্চিত করা।","Memastikan pangan layak dikonsumsi."],["li","الحفاظ على ثقة الناس في الغذاء المحلي والمستورد.","Maintaining people's trust in domestic and imported food.","घरेलू और आयातित भोजन पर लोगों का भरोसा बनाए रखना।","দেশীয় ও আমদানিকৃত খাবারের প্রতি মানুষের আস্থা ধরে রাখা।","Menjaga kepercayaan masyarakat pada pangan lokal dan impor."],["h3","دور صانعي ومنتجي الغذاء","The role of food manufacturers and producers","खाद्य निर्माताओं और उत्पादकों की भूमिका","খাদ্য উৎপাদক ও প্রস্তুতকারকের ভূমিকা","Peran produsen dan pengolah pangan"],["p","على صانعي ومنتجي الغذاء والعاملين في المجال:","Food manufacturers, producers and workers in the field must:","खाद्य निर्माताओं, उत्पादकों और इस क्षेत्र के कर्मचारियों को:","খাদ্য প্রস্তুতকারক, উৎপাদক ও এই খাতের কর্মীদের:","Produsen dan pengolah pangan serta pekerja di bidang ini wajib:"],["li","إنتاج غذاء آمن وصالح للأكل.","Produce food that is safe and fit to eat.","सुरक्षित और खाने योग्य भोजन का उत्पादन करना।","নিরাপদ ও খাওয়ার উপযুক্ত খাবার উৎপাদন করা।","Memproduksi pangan yang aman dan layak dimakan."],["li","وضع معلومات واضحة على عبوات الغذاء عن: كيفية حفظ الغذاء، طرق التخزين الصحيحة، كيفية تحضير الغذاء بأمان.","Put clear information on food packaging about: how to store food, correct storage methods, and how to prepare food safely.","भोजन के पैकेट पर स्पष्ट जानकारी दें: भोजन कैसे रखें, सही भंडारण के तरीके, और भोजन सुरक्षित रूप से कैसे तैयार करें।","খাবারের প্যাকেটে স্পষ্ট তথ্য দিতে হবে: কীভাবে খাবার সংরক্ষণ করতে হয়, সঠিক সংরক্ষণ পদ্ধতি, এবং কীভাবে নিরাপদে রান্না করতে হয়।","Mencantumkan informasi jelas pada kemasan pangan tentang: cara menyimpan, cara penyimpanan yang benar, dan cara menyiapkan pangan dengan aman."],["li","المحافظة على ثقة الناس في الغذاء الذي يتم إنتاجه.","Maintaining people's trust in the food they produce.","अपने उत्पादित भोजन पर लोगों का भरोसा बनाए रखना।","তাদের উৎপাদিত খাবারের প্রতি মানুষের আস্থা ধরে রাখা।","Menjaga kepercayaan masyarakat pada pangan yang diproduksi."],["h3","دور المستهلك","The role of the consumer","उपभोक्ता की भूमिका","ভোক্তার ভূমিকা","Peran konsumen"],["p","على المستهلك أن: يقرأ التعليمات الموجودة على عبوات الغذاء. يتبع طرق حفظ وتحضير الغذاء بشكل آمن.","The consumer should: read the instructions on food packaging, and follow safe storage and preparation methods.","उपभोक्ता को: भोजन के पैकेट पर दिए निर्देश पढ़ने चाहिए, और भोजन को सुरक्षित रूप से रखने और तैयार करने के तरीके अपनाने चाहिए।","ভোক্তার উচিত: খাবারের প্যাকেটের নির্দেশনা পড়া এবং নিরাপদভাবে সংরক্ষণ ও রান্নার পদ্ধতি অনুসরণ করা।","Konsumen sebaiknya: membaca petunjuk pada kemasan pangan, dan mengikuti cara penyimpanan serta penyiapan yang aman."],["n","تذكر: كل خطوة نقوم بها في عملنا تؤثر على سلامة الغذاء وصحة الناس!","Remember: every step we take in our work affects food safety and people's health!","याद रखें: हमारे काम का हर कदम भोजन की सुरक्षा और लोगों के स्वास्थ्य को प्रभावित करता है!","মনে রাখুন: আমাদের কাজের প্রতিটি ধাপ খাদ্য নিরাপত্তা ও মানুষের স্বাস্থ্যকে প্রভাবিত করে!","Ingat: setiap langkah dalam pekerjaan kita memengaruhi keamanan pangan dan kesehatan masyarakat!"],["h2","نظام سلامة الغذاء: الفوائد والتكاليف","The food safety system: benefits and costs","खाद्य सुरक्षा प्रणाली: लाभ और लागत","খাদ্য নিরাপত্তা ব্যবস্থা: সুবিধা ও খরচ","Sistem keamanan pangan: manfaat dan biaya"],["h3","فوائد نظام سلامة الغذاء الجيد","Benefits of a good food safety system","अच्छी खाद्य सुरक्षा प्रणाली के लाभ","ভালো খাদ্য নিরাপত্তা ব্যবস্থার সুবিধা","Manfaat sistem keamanan pangan yang baik"],["li","ضمان إنتاج غذاء آمن وسليم: يضمن تقديم غذاء خالٍ من الملوثات يحقق سلامة وصحة المستهلك.","Safe, sound food production: guarantees food free of contaminants that protects consumer safety and health.","सुरक्षित और स्वस्थ भोजन उत्पादन: प्रदूषकों से मुक्त भोजन सुनिश्चित करता है जो उपभोक्ता की सुरक्षा और स्वास्थ्य की रक्षा करता है।","নিরাপদ ও সুস্থ খাদ্য উৎপাদন: দূষণমুক্ত খাবার নিশ্চিত করে, যা ভোক্তার নিরাপত্তা ও স্বাস্থ্য রক্ষা করে।","Produksi pangan aman dan sehat: menjamin pangan bebas kontaminan sehingga melindungi keselamatan dan kesehatan konsumen."],["li","توفير مكان عمل أفضل: الجميع يعمل في مكان أنظف وآمن.","A better workplace: everyone works in a cleaner and safer place.","बेहतर कार्यस्थल: सब कहीं अधिक साफ़ और सुरक्षित जगह पर काम करते हैं।","উন্নত কর্মস্থল: সবাই আরও পরিষ্কার ও নিরাপদ স্থানে কাজ করে।","Tempat kerja yang lebih baik: semua orang bekerja di tempat yang lebih bersih dan aman."],["li","ضمان إطالة فترة صلاحية الغذاء: تقليل الهدر وتوفير الأموال.","Longer food shelf life: less waste and money saved.","भोजन की शेल्फ-लाइफ बढ़ना: बर्बादी कम और पैसों की बचत।","খাবারের মেয়াদ বৃদ্ধি: অপচয় কম এবং অর্থ সাশ্রয়।","Masa simpan pangan lebih panjang: mengurangi limbah dan menghemat biaya."],["li","الالتزام بالأنظمة: تجنب مشاكل عدم الالتزام مع الجهات الرسمية.","Compliance with regulations: avoids problems with official authorities.","नियमों का पालन: आधिकारिक प्राधिकरणों के साथ समस्याओं से बचाव।","বিধি মানা: সরকারি কর্তৃপক্ষের সঙ্গে সমস্যা এড়ানো যায়।","Kepatuhan pada peraturan: menghindari masalah dengan otoritas resmi."],["li","كسب رضى العملاء والمستهلكين: المستفيدون يثقون فيما يقدم من غذاء ويعودون مراراً.","Winning customer and consumer satisfaction: beneficiaries trust the food served and come back again and again.","ग्राहकों और उपभोक्ताओं की संतुष्टि: लाभार्थी परोसे गए भोजन पर भरोसा करते हैं और बार-बार लौटते हैं।","গ্রাহক ও ভোক্তার সন্তুষ্টি: পরিবেশিত খাবারে আস্থা রেখে মানুষ বারবার ফিরে আসে।","Kepuasan pelanggan dan konsumen: penerima layanan percaya pada pangan yang disajikan dan kembali berulang kali."],["li","زيادة الأرباح: السمعة الجيدة تجذب عملاء ومستهلكين جدد.","Higher profits: a good reputation attracts new customers and consumers.","अधिक मुनाफा: अच्छी साख नए ग्राहकों और उपभोक्ताओं को आकर्षित करती है।","বেশি মুনাফা: ভালো সুনাম নতুন গ্রাহক ও ভোক্তাদের আকর্ষণ করে।","Keuntungan meningkat: reputasi baik menarik pelanggan dan konsumen baru."],["h3","مشاكل ناجمة من عدم وجود نظام سلامة الغذاء","Problems caused by not having a food safety system","खाद्य सुरक्षा प्रणाली न होने से उत्पन्न समस्याएँ","খাদ্য নিরাপত্তা ব্যবস্থা না থাকলে যেসব সমস্যা হয়","Masalah akibat tidak adanya sistem keamanan pangan"],["li","وجود حشرات وقوارض: تنتشر في مكان العمل وتسبب المزيد من المشاكل.","Insects and rodents: they spread through the workplace and cause more problems.","कीड़े और कृंतक: वे कार्यस्थल में फैलते हैं और अधिक समस्याएँ पैदा करते हैं।","পোকামাকড় ও ইঁদুর: কর্মস্থলে ছড়িয়ে আরও সমস্যা সৃষ্টি করে।","Serangga dan hewan pengerat: menyebar di tempat kerja dan menimbulkan masalah lebih banyak."],["li","خسارة في الإنتاج وهدر الغذاء: اضطرار لإتلاف كميات كبيرة من الغذاء الفاسد وغير الصالح.","Production loss and food waste: having to destroy large quantities of spoiled and unfit food.","उत्पादन में नुकसान और भोजन की बर्बादी: बड़ी मात्रा में खराब और अनुपयुक्त भोजन नष्ट करना पड़ता है।","উৎপাদন ক্ষতি ও খাবারের অপচয়: নষ্ট ও অনুপযুক্ত প্রচুর খাবার ফেলে দিতে হয়।","Kerugian produksi dan limbah pangan: harus memusnahkan banyak pangan yang rusak dan tidak layak."],["li","أمراض خطيرة: قد يمرض الناس أو يموتون بسبب التسمم الغذائي.","Serious diseases: people may fall ill or die from food poisoning.","गंभीर बीमारियाँ: फ़ूड पॉइज़निंग से लोग बीमार या मृत हो सकते हैं।","গুরুতর রোগ: খাদ্যে বিষক্রিয়ায় মানুষ অসুস্থ বা মারা যেতে পারে।","Penyakit serius: orang bisa sakit atau meninggal akibat keracunan pangan."],["li","شكاوى العملاء والمستهلكين: الغذاء الملوث يجعل العملاء والمستهلكين غير راضين.","Complaints from customers and consumers: contaminated food makes customers and consumers unhappy.","ग्राहकों और उपभोक्ताओं की शिकायतें: दूषित भोजन से वे असंतुष्ट होते हैं।","গ্রাহক ও ভোক্তার অভিযোগ: দূষিত খাবার গ্রাহক ও ভোক্তাদের অসন্তুষ্ট করে।","Keluhan pelanggan dan konsumen: pangan yang terkontaminasi membuat mereka tidak puas."],["li","غرامات: دفع أموال كثيرة بسبب المخالفات.","Fines: paying large sums because of violations.","जुर्माने: उल्लंघनों के कारण बड़ी रकम चुकानी पड़ती है।","জরিমানা: বিধি লঙ্ঘনের কারণে বড় অর্থ দিতে হয়।","Denda: membayar banyak uang karena pelanggaran."],["li","إغلاق المنشأة: السلطات قد تغلق مكان العمل إذا كان غير آمن.","Closure of the establishment: authorities may close the workplace if it is unsafe.","प्रतिष्ठान बंद होना: असुरक्षित होने पर अधिकारी कार्यस्थल बंद कर सकते हैं।","প্রতিষ্ঠান বন্ধ: অনিরাপদ হলে কর্তৃপক্ষ কর্মস্থল বন্ধ করে দিতে পারে।","Penutupan usaha: otoritas dapat menutup tempat kerja jika tidak aman."],["n","تذكر دائماً: اتباع نظام سلامة الغذاء ليس خياراً، بل ضرورة لنجاح عملنا وحماية صحة عملائنا!","Always remember: following the food safety system is not optional but a necessity for our success and for protecting our customers' health!","हमेशा याद रखें: खाद्य सुरक्षा प्रणाली का पालन विकल्प नहीं, बल्कि हमारे काम की सफलता और ग्राहकों के स्वास्थ्य की रक्षा के लिए ज़रूरी है!","সবসময় মনে রাখুন: খাদ্য নিরাপত্তা ব্যবস্থা মানা ঐচ্ছিক নয়, বরং আমাদের সাফল্য ও গ্রাহকদের স্বাস্থ্য রক্ষার জন্য অপরিহার্য!","Selalu ingat: mengikuti sistem keamanan pangan bukan pilihan, melainkan keharusan demi keberhasilan usaha dan kesehatan pelanggan kita!"],["h2","المخاطر على سلامة الغذاء","Hazards to food safety","भोजन सुरक्षा के लिए खतरे","খাদ্য নিরাপত্তার ঝুঁকি","Bahaya terhadap keamanan pangan"],["h3","ما هو مصدر الخطر على الغذاء؟","What is a hazard source in food?","भोजन में खतरे का स्रोत क्या है?","খাবারে ঝুঁকির উৎস কী?","Apa itu sumber bahaya pada pangan?"],["p","مصدر الخطر هو أي شيء في الغذاء قد يضر بصحة العميل أو المستهلك، أو يسبب مرضه، أو إصابته، أو فساد، أو تلف الغذاء.","A hazard source is anything in food that may harm the customer's or consumer's health, cause illness or injury, or cause the food to spoil or be damaged.","खतरे का स्रोत भोजन में वह कोई भी चीज़ है जो ग्राहक या उपभोक्ता के स्वास्थ्य को नुकसान पहुँचा सकती है, बीमारी या चोट का कारण बन सकती है, या भोजन को खराब कर सकती है।","খাবারের যেকোনো বিষয় যা গ্রাহক বা ভোক্তার স্বাস্থ্যের ক্ষতি, অসুস্থতা, আঘাত, বা খাবার নষ্ট করতে পারে, তাই ঝুঁকির উৎস।","Sumber bahaya adalah segala sesuatu dalam pangan yang dapat membahayakan kesehatan pelanggan atau konsumen, menyebabkan sakit atau cedera, atau membuat pangan rusak."],["h3","ما هي أنواع المخاطر على الغذاء؟","What are the types of hazards to food?","भोजन के लिए खतरों के प्रकार क्या हैं?","খাবারের ঝুঁকির ধরন কী কী?","Apa saja jenis bahaya pada pangan?"],["p","هناك أربعة أنواع رئيسية من المخاطر، وسيتم دراستها بالتفصيل في الأجزاء القادمة هي:","There are four main types of hazards, which will be studied in detail in the following parts:","खतरों के चार मुख्य प्रकार हैं, जिनका विस्तार से अध्ययन आगे के भागों में होगा:","ঝুঁকির চারটি প্রধান ধরন আছে, যেগুলো পরের অংশগুলোতে বিস্তারিত পড়ানো হবে:","Ada empat jenis bahaya utama, yang akan dipelajari secara rinci pada bagian berikutnya:"],["li","1. مخاطر ميكروبية: أمثلة: الجراثيم أو الكائنات الحية الدقيقة مثل: البكتيريا، الفيروسات، فطر العفن، والطفيليات.","1. Microbiological hazards: examples are microorganisms such as bacteria, viruses, moulds and parasites.","1. सूक्ष्मजैविक खतरे: उदाहरण: जीवाणु (बैक्टीरिया), वायरस, फफूंद (मोल्ड) और परजीवी जैसे सूक्ष्मजीव।","1. অণুজীবীয় ঝুঁকি: উদাহরণ: ব্যাকটেরিয়া, ভাইরাস, ছত্রাক (মোল্ড) ও পরজীবীর মতো অণুজীব।","1. Bahaya mikrobiologis: contohnya mikroorganisme seperti bakteri, virus, kapang, dan parasit."],["li","2. مخاطر كيميائية: أمثلة: مبيدات الآفات الزراعية، المبيدات الحشرية، مواد التنظيف، زيوت الآلات.","2. Chemical hazards: examples are agricultural pesticides, insecticides, cleaning materials, and machine oils.","2. रासायनिक खतरे: उदाहरण: कृषि कीटनाशक, कीटनाशक दवाएँ, सफाई सामग्री, और मशीन के तेल।","2. রাসায়নিক ঝুঁকি: উদাহরণ: কৃষি কীটনাশক, পোকামাকড় নাশক, পরিষ্কারক পদার্থ, যন্ত্রের তেল।","2. Bahaya kimia: contohnya pestisida pertanian, insektisida, bahan pembersih, dan minyak mesin."],["li","3. مخاطر فيزيائية (مادية): أمثلة: الغبار والأوساخ، الدبابيس، القطع المعدنية، الزجاج المكسور، قطع العظام، الضمادات، الحلي والمجوهرات، الشعر، أقلام السجائر، بقايا الحشرات.","3. Physical hazards: examples are dust and dirt, pins, metal pieces, broken glass, bone fragments, bandages, jewellery, hair, cigarette lighters and insect remains.","3. भौतिक खतरे: उदाहरण: धूल और गंदगी, पिन, धातु के टुकड़े, टूटा कांच, हड्डी के टुकड़े, पट्टियाँ, गहने, बाल, सिगरेट लाइटर और कीड़ों के अवशेष।","3. ভৌত ঝুঁকি: উদাহরণ: ধুলোময়লা, পিন, ধাতুর টুকরো, ভাঙা কাঁচ, হাড়ের টুকরো, ব্যান্ডেজ, গয়না, চুল, সিগারেটের লাইটার ও পোকার অবশেষ।","3. Bahaya fisik: contohnya debu dan kotoran, peniti, potongan logam, pecahan kaca, serpihan tulang, perban, perhiasan, rambut, korek api rokok, dan sisa serangga."],["li","4. مخاطر الحساسية من الغذاء: مكونات أو أنواع من الغذاء تسبب حساسية لبعض الناس، قد تكون خطرة على فئة معينة من الناس، ولكنها آمنة لمعظم الناس.","4. Food allergy hazards: ingredients or food types that cause allergy in some people; they may be dangerous for a particular group but safe for most people.","4. भोजन एलर्जी के खतरे: कुछ लोगों में एलर्जी पैदा करने वाली सामग्री या भोजन; कुछ समूहों के लिए खतरनाक हो सकते हैं, पर अधिकांश लोगों के लिए सुरक्षित।","4. খাদ্য অ্যালার্জির ঝুঁকি: কিছু মানুষের অ্যালার্জি সৃষ্টিকারী উপাদান বা খাবার; নির্দিষ্ট দলের জন্য বিপজ্জনক হতে পারে, তবে বেশিরভাগ মানুষের জন্য নিরাপদ।","4. Bahaya alergi pangan: bahan atau jenis pangan yang menyebabkan alergi pada sebagian orang; bisa berbahaya bagi kelompok tertentu namun aman bagi kebanyakan orang."]]},{"t":["مقدمة سلامة الغذاء (تابع)","Introduction to food safety (continued)","खाद्य सुरक्षा का परिचय (जारी)","খাদ্য নিরাপত্তার ভূমিকা (চলমান)","Pengantar keamanan pangan (lanjutan)"],"r":[["h2","كيف يحدث التلوث للغذاء؟","How does food contamination happen?","भोजन दूषित कैसे होता है?","খাবার কীভাবে দূষিত হয়?","Bagaimana kontaminasi pangan terjadi?"],["h3","أين يمكن أن يحدث التلوث؟","Where can contamination happen?","संदूषण कहाँ हो सकता है?","দূষণ কোথায় ঘটতে পারে?","Di mana kontaminasi dapat terjadi?"],["p","في أي مكان يتم فيه تناول وإعداد الغذاء: مطاعم، مطابخ مركزية، بوفيات، بقالة، أسواق مركزية الخ. ويمكن أن يحدث التلوث في أي مرحلة من مراحل السلسلة الغذائية:","Contamination can happen anywhere food is eaten or prepared: restaurants, central kitchens, buffets, groceries, central markets, etc. It can occur at any stage of the food chain:","भोजन जहाँ खाया या तैयार किया जाता है वहीं संदूषण हो सकता है: रेस्तरां, केंद्रीय रसोई, बुफे, किराना दुकानें, केंद्रीय बाज़ार आदि। खाद्य श्रृंखला के किसी भी चरण में यह हो सकता है:","যেখানে খাবার খাওয়া বা তৈরি হয় সেখানেই দূষণ ঘটতে পারে: রেস্তোরাঁ, কেন্দ্রীয় রান্নাঘর, বুফে, মুদির দোকান, কেন্দ্রীয় বাজার ইত্যাদি। খাদ্য শৃঙ্খলের যেকোনো ধাপে এটি ঘটতে পারে:","Kontaminasi dapat terjadi di mana pun pangan dimakan atau disiapkan: restoran, dapur sentral, prasmanan, toko kelontong, pasar induk, dll. Ini dapat terjadi di setiap tahap rantai pangan:"],["li","الحصاد أو الذبح.","Harvesting or slaughter.","कटाई या वध।","ফসল তোলা বা জবাই।","Panen atau pemotongan hewan."],["li","التصنيع والمعالجة.","Manufacturing and processing.","निर्माण और प्रसंस्करण।","উৎপাদন ও প্রক্রিয়াজাতকরণ।","Pengolahan dan pemrosesan."],["li","التخزين والتوزيع.","Storage and distribution.","भंडारण और वितरण।","সংরক্ষণ ও বিতরণ।","Penyimpanan dan distribusi."],["li","الإعداد والطهي.","Preparation and cooking.","तैयारी और पकाना।","প্রস্তুতি ও রান্না।","Persiapan dan memasak."],["li","العرض والبيع.","Display and sale.","प्रदर्शन और बिक्री।","প্রদর্শন ও বিক্রি।","Penyajian dan penjualan."],["h3","ما هي أنواع تلوث الغذاء؟","What are the types of food contamination?","भोजन संदूषण के प्रकार क्या हैं?","খাবার দূষণের ধরন কী কী?","Apa saja jenis kontaminasi pangan?"],["h3","1. التلوث الخلطي (غير المباشر)","1. Cross-contamination (indirect)","1. क्रॉस-संदूषण (अप्रत्यक्ष)","১. ক্রস-দূষণ (পরোক্ষ)","1. Kontaminasi silang (tidak langsung)"],["p","انتقال المواد الضارة أو الأحياء الدقيقة إلى الغذاء الجاهز للتقديم عن طريق اليدين والأسطح والمعدات التي تكون متسخة وتلامس الغذاء الخام ثم تلامس الغذاء الجاهز للتقديم. يشمل ملامسة الغذاء الخام أو السائل الناجم عنه للغذاء الجاهز للتقديم.","The transfer of harmful substances or microorganisms to ready-to-eat food through hands, surfaces and equipment that are dirty, touch raw food and then touch ready-to-eat food. It includes contact between raw food, or its drippings, and ready-to-eat food.","हानिकारक पदार्थ या सूक्ष्मजीव हाथों, सतहों और उपकरणों के ज़रिए तैयार भोजन तक पहुँचते हैं, जब वे गंदे होकर पहले कच्चे भोजन को और फिर तैयार भोजन को छूते हैं। इसमें कच्चे भोजन या उसके रिसते तरल का तैयार भोजन से संपर्क भी शामिल है।","ক্ষতিকর পদার্থ বা অণুজীব নোংরা হাত, পৃষ্ঠ ও সরঞ্জামের মাধ্যমে তৈরি খাবারে পৌঁছায়, যখন সেগুলো আগে কাঁচা খাবার ও পরে তৈরি খাবার স্পর্শ করে। এতে কাঁচা খাবার বা তার চুঁইয়ে পড়া তরলের সঙ্গে তৈরি খাবারের সংস্পর্শও অন্তর্ভুক্ত।","Perpindahan zat berbahaya atau mikroorganisme ke pangan siap saji melalui tangan, permukaan, dan peralatan yang kotor, yang menyentuh pangan mentah lalu pangan siap saji. Termasuk kontak antara pangan mentah atau cairannya dengan pangan siap saji."],["n","أمثلة: استخدام سكين غير نظيف لتقطيع غذاء مطبوخ؛ تحضير غذاء على سطح ملوث؛ استخدام قفازات ملوثة في التعامل مع الغذاء.","Examples: using an unclean knife to cut cooked food; preparing food on a dirty surface; using contaminated gloves when handling food.","उदाहरण: पके भोजन को गंदे चाकू से काटना; गंदी सतह पर भोजन तैयार करना; भोजन संभालते समय दूषित दस्ताने इस्तेमाल करना।","উদাহরণ: রান্না করা খাবার অপরিষ্কার ছুরি দিয়ে কাটা; নোংরা পৃষ্ঠে খাবার তৈরি; দূষিত গ্লাভস দিয়ে খাবার ধরা।","Contoh: memakai pisau kotor untuk memotong pangan matang; menyiapkan pangan di permukaan yang kotor; memakai sarung tangan terkontaminasi saat menangani pangan."],["h3","2. التلوث الميكروبيولوجي (المباشر)","2. Microbiological contamination (direct)","2. सूक्ष्मजैविक संदूषण (प्रत्यक्ष)","২. অণুজীবীয় দূষণ (সরাসরি)","2. Kontaminasi mikrobiologis (langsung)"],["p","التلوث بالأحياء الدقيقة أو السموم التي تنتجها الأحياء الدقيقة على سطح الغذاء أو داخله أثناء إنتاج الغذاء أو تصنيعه أو تغليفه أو تعبئته أو معاملته أو احتفاظه أو نقله أو تحضيره أو تعبئته أو تغليفه أو معاملته أو الاحتفاظ به أو نقله.","Contamination with microorganisms, or toxins they produce, on or inside food during its production, manufacture, packaging, processing, holding, transport, preparation or handling.","भोजन के उत्पादन, निर्माण, पैकिंग, प्रसंस्करण, भंडारण, परिवहन या तैयारी के दौरान भोजन की सतह पर या भीतर सूक्ष्मजीवों या उनके विषैले पदार्थों से संदूषण।","খাবারের উৎপাদন, প্রস্তুত, প্যাকেজিং, প্রক্রিয়াকরণ, সংরক্ষণ, পরিবহন বা প্রস্তুতির সময় খাবারের উপরে বা ভেতরে অণুজীব বা তাদের বিষাক্ত পদার্থ দ্বারা দূষণ।","Kontaminasi oleh mikroorganisme atau toksinnya pada atau di dalam pangan selama produksi, pengolahan, pengemasan, penyimpanan, pengangkutan, atau penyiapan."],["n","أمثلة: لمس الغذاء بأيدٍ متسخة؛ سقوط حشرة على الغذاء؛ تقطير سوائل من غذاء نيء على غذاء مطهي في الثلاجة.","Examples: touching food with dirty hands; an insect falling onto food; liquid dripping from raw food onto cooked food in the fridge.","उदाहरण: गंदे हाथों से भोजन छूना; भोजन पर कीड़ा गिरना; फ्रिज में कच्चे भोजन से पके भोजन पर तरल टपकना।","উদাহরণ: নোংরা হাতে খাবার ছোঁয়া; খাবারের উপর পোকা পড়া; ফ্রিজে কাঁচা খাবারের তরল রান্না করা খাবারে চুঁইয়ে পড়া।","Contoh: menyentuh pangan dengan tangan kotor; serangga jatuh ke pangan; cairan menetes dari pangan mentah ke pangan matang di kulkas."],["n","أنتبه دائماً: يجب حفظ الغذاء النيء مغطى وفي الجزء السفلي من الثلاجة لمنع تساقط السوائل على الأغذية الأخرى. يجب تغطية الغذاء في كل الأوقات لحمايته من التلوث. متداولو الغذاء هم المصدر الرئيسي للتلوث العرضي في منشآت الغذاء.","Always pay attention: raw food must be stored covered and on the bottom shelf of the fridge to prevent liquids dripping onto other food. Food must be covered at all times to protect it from contamination. Food handlers are the main source of accidental contamination in food establishments.","हमेशा ध्यान दें: कच्चा भोजन ढककर फ्रिज के सबसे निचले हिस्से में रखें ताकि तरल दूसरे भोजन पर न टपके। भोजन को हर समय ढककर रखें। भोजन संभालने वाले खाद्य प्रतिष्ठानों में आकस्मिक संदूषण का मुख्य स्रोत हैं।","সবসময় খেয়াল রাখুন: কাঁচা খাবার ঢেকে ফ্রিজের নিচের তাকে রাখতে হবে যাতে অন্য খাবারে তরল না পড়ে। সব সময় খাবার ঢেকে রাখতে হবে। খাবার পরিচালনাকারীরা খাদ্য প্রতিষ্ঠানে আকস্মিক দূষণের প্রধান উৎস।","Selalu perhatikan: pangan mentah harus disimpan tertutup dan di rak bawah kulkas agar cairannya tidak menetes ke pangan lain. Pangan harus selalu ditutup untuk melindunginya dari kontaminasi. Penjamah pangan adalah sumber utama kontaminasi tidak sengaja di usaha pangan."]]},{"t":["تلوث الغذاء الميكروبي","Microbial food contamination","सूक्ष्मजैविक खाद्य संदूषण","অণুজীবীয় খাদ্য দূষণ","Kontaminasi mikroba pada pangan"],"r":[["h2","ما هي ملوثات الغذاء الميكروبية؟","What are microbial food contaminants?","सूक्ष्मजैविक खाद्य प्रदूषक क्या हैं?","অণুজীবীয় খাদ্য দূষক কী?","Apa itu kontaminan mikroba pada pangan?"],["p","كائنات حية صغيرة جداً يمكنها أن تضر بصحة الإنسان. وتشمل الكائنات الحية الدقيقة (الجراثيم): البكتيريا، الفيروسات، الطفيليات، الفطريات. ويعتبر أكبر مصدر قلق في سلامة الغذاء هو البكتيريا.","Very small living organisms that can harm human health. Microorganisms (germs) include bacteria, viruses, parasites and fungi. Bacteria are the biggest concern in food safety.","बहुत छोटे जीवित सूक्ष्मजीव जो मानव स्वास्थ्य को नुकसान पहुँचा सकते हैं। सूक्ष्मजीवों (कीटाणुओं) में जीवाणु, वायरस, परजीवी और फफूंद शामिल हैं। खाद्य सुरक्षा में सबसे बड़ी चिंता जीवाणु हैं।","খুব ছোট জীবন্ত জীব যা মানুষের স্বাস্থ্যের ক্ষতি করতে পারে। অণুজীবের (জীবাণুর) মধ্যে রয়েছে ব্যাকটেরিয়া, ভাইরাস, পরজীবী ও ছত্রাক। খাদ্য নিরাপত্তায় ব্যাকটেরিয়াই সবচেয়ে বড় উদ্বেগ।","Organisme hidup yang sangat kecil dan dapat membahayakan kesehatan manusia. Mikroorganisme (kuman) meliputi bakteri, virus, parasit, dan jamur. Bakteri merupakan perhatian terbesar dalam keamanan pangan."],["h3","كيف تؤثر ملوثات الغذاء الميكروبية على عملنا وعلى المستهلكين؟","How do microbial food contaminants affect our work and consumers?","सूक्ष्मजैविक प्रदूषक हमारे काम और उपभोक्ताओं को कैसे प्रभावित करते हैं?","অণুজীবীয় দূষক আমাদের কাজ ও ভোক্তাদের কীভাবে প্রভাবিত করে?","Bagaimana kontaminan mikroba memengaruhi pekerjaan kita dan konsumen?"],["li","تسبب معظم حالات التسمم الغذائي.","They cause most cases of food poisoning.","भोजन विषाक्तता के अधिकांश मामलों का कारण बनते हैं।","বেশিরভাগ খাদ্যে বিষক্রিয়ার কারণ।","Menyebabkan sebagian besar kasus keracunan pangan."],["li","المسؤول الرئيسي عن تلف الغذاء.","They are the main cause of food spoilage.","भोजन खराब होने का मुख्य कारण हैं।","খাবার নষ্টের প্রধান কারণ।","Penyebab utama kerusakan pangan."],["h3","أين توجد ملوثات الغذاء الميكروبية؟","Where are microbial food contaminants found?","सूक्ष्मजैविक प्रदूषक कहाँ पाए जाते हैं?","অণুজীবীয় দূষক কোথায় পাওয়া যায়?","Di mana kontaminan mikroba ditemukan?"],["li","موجودة طبيعياً في بعض الأغذية.","Naturally present in some foods.","कुछ खाद्य पदार्थों में स्वाभाविक रूप से मौजूद।","কিছু খাবারে স্বাভাবিকভাবে থাকে।","Secara alami terdapat pada beberapa pangan."],["li","تصل للغذاء بسبب ممارسات التعامل الخاطئة.","They reach food because of incorrect handling practices.","गलत संभालने की प्रथाओं के कारण भोजन तक पहुँचते हैं।","ভুল পরিচালনার কারণে খাবারে পৌঁছায়।","Mencapai pangan karena praktik penanganan yang keliru."],["h3","لماذا يجب أن نعرف عن الكائنات الحية الدقيقة؟","Why should we know about microorganisms?","हमें सूक्ष्मजीवों के बारे में क्यों जानना चाहिए?","আমাদের অণুজীব সম্পর্কে কেন জানা উচিত?","Mengapa kita perlu mengetahui tentang mikroorganisme?"],["li","تهدد الصحة: تسبب الأمراض وتهدد سلامة الغذاء.","They threaten health: they cause disease and threaten food safety.","स्वास्थ्य को खतरा: बीमारियाँ पैदा करते हैं और खाद्य सुरक्षा को खतरे में डालते हैं।","স্বাস্থ্যের ঝুঁকি: রোগ সৃষ্টি করে ও খাদ্য নিরাপত্তায় হুমকি দেয়।","Mengancam kesehatan: menyebabkan penyakit dan mengancam keamanan pangan."],["li","سبب التسمم: المسؤولة عن معظم حالات التسمم الغذائي.","Cause of poisoning: responsible for most food poisoning cases.","विषाक्तता का कारण: भोजन विषाक्तता के अधिकांश मामलों के लिए ज़िम्मेदार।","বিষক্রিয়ার কারণ: বেশিরভাগ খাদ্যে বিষক্রিয়ার জন্য দায়ী।","Penyebab keracunan: bertanggung jawab atas sebagian besar keracunan pangan."],["li","تفسد الغذاء: تؤثر على جودة الغذاء وصلاحيته.","They spoil food: they affect food's quality and fitness.","भोजन बिगाड़ते हैं: भोजन की गुणवत्ता और उपयुक्तता पर असर डालते हैं।","খাবার নষ্ট করে: খাবারের মান ও উপযোগিতায় প্রভাব ফেলে।","Merusak pangan: memengaruhi mutu dan kelayakan pangan."],["li","منتشرة: موجودة طبيعياً وتنتقل بسهولة.","Widespread: naturally present and spread easily.","व्यापक: स्वाभाविक रूप से मौजूद और आसानी से फैलते हैं।","ব্যাপক: স্বাভাবিকভাবে উপস্থিত এবং সহজে ছড়ায়।","Tersebar luas: terdapat secara alami dan mudah menyebar."],["li","غير مرئية: صغيرة جداً، تحتاج معرفة خاصة للتعامل معها.","Invisible: very small, and need special knowledge to handle them.","अदृश्य: बहुत छोटे, इनसे निपटने के लिए विशेष ज्ञान चाहिए।","অদৃশ্য: খুব ছোট, এদের মোকাবিলায় বিশেষ জ্ঞান দরকার।","Tak kasat mata: sangat kecil dan memerlukan pengetahuan khusus untuk menanganinya."],["li","تؤثر على العمل: تحدد إجراءات التخزين والتحضير والتقديم.","They affect work: they determine storage, preparation and service procedures.","काम पर असर: भंडारण, तैयारी और परोसने की प्रक्रियाएँ तय करते हैं।","কাজে প্রভাব: সংরক্ষণ, প্রস্তুতি ও পরিবেশনের পদ্ধতি নির্ধারণ করে।","Memengaruhi pekerjaan: menentukan prosedur penyimpanan, persiapan, dan penyajian."],["li","متنوعة: أنواع مختلفة تتطلب طرق تعامل مختلفة.","Varied: different types need different ways of handling.","विविध: अलग-अलग प्रकारों को अलग तरह से संभालना पड़ता है।","বৈচিত্র্যময়: বিভিন্ন ধরনের জন্য আলাদা পরিচালনা লাগে।","Beragam: jenis yang berbeda memerlukan cara penanganan yang berbeda."],["p","فهم هذه الكائنات يساعدنا على حماية الغذاء والمستهلكين بشكل أفضل.","Understanding these organisms helps us protect food and consumers better.","इन जीवों को समझने से हम भोजन और उपभोक्ताओं की बेहतर रक्षा कर पाते हैं।","এসব জীব বুঝলে আমরা খাবার ও ভোক্তাদের আরও ভালোভাবে রক্ষা করতে পারি।","Memahami organisme ini membantu kita melindungi pangan dan konsumen dengan lebih baik."],["h2","البكتيريا","Bacteria","जीवाणु (बैक्टीरिया)","ব্যাকটেরিয়া","Bakteri"],["h3","ما هي البكتيريا؟","What are bacteria?","जीवाणु क्या हैं?","ব্যাকটেরিয়া কী?","Apa itu bakteri?"],["li","كائنات حية صغيرة جداً لا نراها بالعين.","Very tiny living organisms that we cannot see with the naked eye.","बहुत छोटे जीव जिन्हें नंगी आँखों से नहीं देखा जा सकता।","খালি চোখে দেখা যায় না এমন খুব ছোট জীবন্ত জীব।","Organisme hidup yang sangat kecil dan tidak terlihat oleh mata telanjang."],["li","موجودة في كل مكان حولنا.","Found everywhere around us.","हमारे चारों ओर हर जगह पाए जाते हैं।","আমাদের চারপাশে সর্বত্র রয়েছে।","Terdapat di mana-mana di sekitar kita."],["li","بعضها مفيد وبعضها ضار.","Some are beneficial and some are harmful.","कुछ लाभकारी हैं और कुछ हानिकारक।","কিছু উপকারী, কিছু ক্ষতিকর।","Sebagian bermanfaat dan sebagian berbahaya."],["h3","لماذا ندرس البكتيريا بالتفصيل؟","Why do we study bacteria in detail?","हम जीवाणुओं का विस्तार से अध्ययन क्यों करते हैं?","আমরা ব্যাকটেরিয়া বিস্তারিত কেন পড়ি?","Mengapa kita mempelajari bakteri secara rinci?"],["p","البكتيريا هي السبب الرئيسي لمعظم حالات التسمم الغذائي. فهم البكتيريا يساعدنا على منع انتشارها وحماية صحة المستهلكين. معرفة مصادر البكتيريا تمكننا من اتخاذ إجراءات وقائية فعالة.","Bacteria are the main cause of most food poisoning cases. Understanding bacteria helps us prevent their spread and protect consumers' health. Knowing where bacteria come from lets us take effective preventive measures.","जीवाणु भोजन विषाक्तता के अधिकांश मामलों का मुख्य कारण हैं। जीवाणुओं को समझने से हम उनके फैलाव को रोक सकते हैं और उपभोक्ताओं का स्वास्थ्य बचा सकते हैं। उनके स्रोत जानकर हम प्रभावी बचाव उपाय कर सकते हैं।","ব্যাকটেরিয়া বেশিরভাগ খাদ্যে বিষক্রিয়ার প্রধান কারণ। ব্যাকটেরিয়া বুঝলে তাদের ছড়ানো রোধ করা ও ভোক্তাদের স্বাস্থ্য রক্ষা করা যায়। উৎস জানলে কার্যকর প্রতিরোধ ব্যবস্থা নেওয়া যায়।","Bakteri adalah penyebab utama sebagian besar keracunan pangan. Memahami bakteri membantu kita mencegah penyebarannya dan melindungi kesehatan konsumen. Mengetahui sumbernya memungkinkan tindakan pencegahan yang efektif."],["h3","أنواع البكتيريا","Types of bacteria","जीवाणुओं के प्रकार","ব্যাকটেরিয়ার ধরন","Jenis bakteri"],["li","البكتيريا النافعة: تساعد في صنع بعض الأغذية (مثل الزبادي والجبن). مفيدة لهضم الغذاء.","Beneficial bacteria: help make some foods (such as yoghurt and cheese). Useful for digesting food.","लाभकारी जीवाणु: कुछ खाद्य पदार्थ (जैसे दही और पनीर) बनाने में मदद करते हैं। भोजन पचाने में उपयोगी।","উপকারী ব্যাকটেরিয়া: কিছু খাবার (যেমন দই ও পনির) তৈরিতে সাহায্য করে। খাবার হজমে উপকারী।","Bakteri bermanfaat: membantu membuat beberapa pangan (seperti yogurt dan keju). Berguna untuk mencerna makanan."],["li","البكتيريا الضارة:","Harmful bacteria:","हानिकारक जीवाणु:","ক্ষতিকর ব্যাকটেরিয়া:","Bakteri berbahaya:"],["li","المفسدة: تغير لون وطعم ورائحة الغذاء.","Spoilage types: change the colour, taste and smell of food.","बिगाड़ने वाले: भोजन का रंग, स्वाद और गंध बदलते हैं।","নষ্টকারী: খাবারের রং, স্বাদ ও গন্ধ বদলে দেয়।","Pembusuk: mengubah warna, rasa, dan bau pangan."],["li","الممرضة: تسبب الأمراض دون تغيير شكل الغذاء.","Pathogenic types: cause disease without changing the food's appearance.","रोगजनक: भोजन का रूप बदले बिना बीमारी पैदा करते हैं।","রোগজীবাণু: খাবারের চেহারা না বদলেই রোগ সৃষ্টি করে।","Patogen: menyebabkan penyakit tanpa mengubah tampilan pangan."],["h3","من أين تأتي البكتيريا الضارة؟","Where do harmful bacteria come from?","हानिकारक जीवाणु कहाँ से आते हैं?","ক্ষতিকর ব্যাকটেরিয়া কোথা থেকে আসে?","Dari mana bakteri berbahaya berasal?"],["li","الأشخاص: على الأيدي، في الفم والأنف، وعلى الملابس.","People: on hands, in the mouth and nose, and on clothing.","लोग: हाथों पर, मुँह और नाक में, और कपड़ों पर।","মানুষ: হাতে, মুখে ও নাকে, এবং পোশাকে।","Manusia: di tangan, mulut, hidung, dan pakaian."],["li","الغذاء النيء: خاصة اللحوم، والدواجن، والبيض.","Raw food: especially meat, poultry and eggs.","कच्चा भोजन: विशेष रूप से मांस, मुर्गी और अंडे।","কাঁচা খাবার: বিশেষ করে মাংস, হাঁস-মুরগি ও ডিম।","Pangan mentah: terutama daging, unggas, dan telur."],["li","الماء: إذا لم يتم معالجته بشكل صحيح.","Water: if it has not been treated properly.","पानी: यदि उसे ठीक से शुद्ध न किया गया हो।","পানি: সঠিকভাবে শোধন না করা হলে।","Air: jika tidak diolah dengan benar."],["li","الهواء والغبار: خاصة في الأماكن غير النظيفة.","Air and dust: especially in unclean places.","हवा और धूल: विशेष रूप से गंदे स्थानों में।","বাতাস ও ধুলো: বিশেষ করে অপরিষ্কার স্থানে।","Udara dan debu: terutama di tempat yang tidak bersih."],["li","الآفات والحيوانات: مثل الذباب والصراصير والفئران.","Pests and animals: such as flies, cockroaches and rats.","कीट और जानवर: जैसे मक्खी, तिलचट्टे और चूहे।","পোকামাকড় ও প্রাণী: যেমন মাছি, তেলাপোকা ও ইঁদুর।","Hama dan hewan: seperti lalat, kecoa, dan tikus."],["li","التربة: على الفواكه والخضروات غير المغسولة.","Soil: on fruit and vegetables that have not been washed.","मिट्टी: बिना धुले फलों और सब्ज़ियों पर।","মাটি: না-ধোয়া ফল ও সবজিতে।","Tanah: pada buah dan sayur yang belum dicuci."],["li","النفايات: إذا لم يتم التخلص منها بسرعة وبشكل صحيح.","Waste: if it is not disposed of quickly and properly.","कचरा: यदि उसे जल्दी और सही तरीके से न हटाया जाए।","আবর্জনা: দ্রুত ও সঠিকভাবে না সরালে।","Limbah: jika tidak dibuang dengan cepat dan benar."],["h3","كيف تتكاثر البكتيريا؟","How do bacteria multiply?","जीवाणु कैसे बढ़ते हैं?","ব্যাকটেরিয়া কীভাবে বাড়ে?","Bagaimana bakteri berkembang biak?"],["li","تنقسم البكتيريا إلى قسمين كل 10-20 دقيقة في الظروف المناسبة.","Bacteria divide into two every 10 to 20 minutes in suitable conditions.","उपयुक्त परिस्थितियों में जीवाणु हर 10-20 मिनट में दो में बंट जाते हैं।","উপযুক্ত পরিবেশে ব্যাকটেরিয়া প্রতি ১০-২০ মিনিটে দুই ভাগে ভাগ হয়।","Dalam kondisi yang sesuai, bakteri membelah menjadi dua setiap 10–20 menit."],["li","بكتيريا واحدة يمكن أن تصبح أكثر من 130 ألف بكتيريا في 6 ساعات فقط!","One bacterium can become more than 130,000 bacteria in just 6 hours!","एक जीवाणु केवल 6 घंटे में 1,30,000 से अधिक जीवाणु बन सकता है!","একটি ব্যাকটেরিয়া মাত্র ৬ ঘণ্টায় ১ লক্ষ ৩০ হাজারের বেশি হতে পারে!","Satu bakteri bisa menjadi lebih dari 130.000 bakteri hanya dalam 6 jam!"],["h3","العوامل الأربعة الرئيسية لنمو البكتيريا","The four main factors for bacterial growth","जीवाणु वृद्धि के चार मुख्य कारक","ব্যাকটেরিয়া বৃদ্ধির চার প্রধান উপাদান","Empat faktor utama pertumbuhan bakteri"],["h3","1. الغذاء","1. Food","1. भोजन","১. খাবার","1. Pangan"],["li","تفضل البكتيريا الأغذية الغنية بالبروتين والرطوبة.","Bacteria prefer foods rich in protein and moisture.","जीवाणु प्रोटीन और नमी वाले भोजन पसंद करते हैं।","ব্যাকটেরিয়া প্রোটিন ও আর্দ্রতাসমৃদ্ধ খাবার পছন্দ করে।","Bakteri menyukai pangan yang kaya protein dan kelembapan."],["li","أمثلة: اللحوم، الدواجن، الأسماك، الألبان، البيض، الأرز المطبوخ.","Examples: meat, poultry, fish, dairy, eggs, cooked rice.","उदाहरण: मांस, मुर्गी, मछली, डेयरी, अंडे, पका चावल।","উদাহরণ: মাংস, হাঁস-মুরগি, মাছ, দুগ্ধজাত, ডিম, রান্না করা ভাত।","Contoh: daging, unggas, ikan, produk susu, telur, nasi matang."],["li","البكتيريا تنمو في الغذاء النيء والمطبوخ.","Bacteria grow in both raw and cooked food.","जीवाणु कच्चे और पके दोनों भोजन में बढ़ते हैं।","ব্যাকটেরিয়া কাঁচা ও রান্না করা উভয় খাবারেই বাড়ে।","Bakteri tumbuh pada pangan mentah maupun matang."],["h3","2. الرطوبة","2. Moisture","2. नमी","২. আর্দ্রতা","2. Kelembapan"],["li","معظم الأغذية تحتوي على رطوبة كافية لنمو البكتيريا.","Most foods contain enough moisture for bacteria to grow.","अधिकांश खाद्य पदार्थों में जीवाणु वृद्धि के लिए पर्याप्त नमी होती है।","বেশিরভাগ খাবারে ব্যাকটেরিয়া বৃদ্ধির মতো যথেষ্ট আর্দ্রতা থাকে।","Sebagian besar pangan mengandung kelembapan yang cukup bagi bakteri untuk tumbuh."],["li","الأغذية الجافة (مثل الحليب المجفف) آمنة ولا تنمو فيها البكتيريا حتى يضاف إليها الماء.","Dry foods (such as powdered milk) are safe and bacteria do not grow in them until water is added.","सूखे खाद्य पदार्थ (जैसे सूखा दूध) सुरक्षित हैं और पानी मिलाने तक उनमें जीवाणु नहीं बढ़ते।","শুকনো খাবার (যেমন গুঁড়ো দুধ) নিরাপদ এবং পানি না মেশানো পর্যন্ত ব্যাকটেরিয়া বাড়ে না।","Pangan kering (seperti susu bubuk) aman dan bakteri tidak tumbuh di dalamnya sampai ditambahkan air."],["h3","3. الوقت","3. Time","3. समय","৩. সময়","3. Waktu"],["li","كلما طالت مدة بقاء الغذاء في درجة حرارة الغرفة، زاد نمو البكتيريا.","The longer food stays at room temperature, the more bacteria grow.","भोजन कमरे के तापमान पर जितनी देर रहेगा, जीवाणु उतने बढ़ेंगे।","খাবার ঘরের তাপমাত্রায় যত বেশি সময় থাকবে, ব্যাকটেরিয়া তত বাড়বে।","Semakin lama pangan berada pada suhu ruang, semakin banyak bakteri yang tumbuh."],["h3","4. الدفء (درجة الحرارة)","4. Warmth (temperature)","4. तापमान","৪. তাপমাত্রা","4. Suhu"],["li","تحت 5°م: البكتيريا تنمو بشكل بطيء جداً.","Below 5°C: bacteria grow very slowly.","5°C से नीचे: जीवाणु बहुत धीरे बढ़ते हैं।","৫°C-এর নিচে: ব্যাকটেরিয়া খুব ধীরে বাড়ে।","Di bawah 5°C: bakteri tumbuh sangat lambat."],["li","المنطقة الخطرة: البكتيريا تنمو بشكل سريع بين 5°م و63°م.","Danger zone: bacteria grow rapidly between 5°C and 63°C.","खतरे का क्षेत्र: 5°C और 63°C के बीच जीवाणु तेज़ी से बढ़ते हैं।","বিপদসীমা: ৫°C থেকে ৬৩°C-এর মধ্যে ব্যাকটেরিয়া দ্রুত বাড়ে।","Zona bahaya: bakteri tumbuh cepat antara 5°C dan 63°C."],["li","أفضل درجة حرارة لنمو البكتيريا: حوالي 37°م (درجة حرارة الجسم).","Best temperature for bacterial growth: about 37°C (body temperature).","जीवाणु वृद्धि का सबसे अच्छा तापमान: लगभग 37°C (शरीर का तापमान)।","ব্যাকটেরিয়া বৃদ্ধির সেরা তাপমাত্রা: প্রায় ৩৭°C (শরীরের তাপমাত্রা)।","Suhu terbaik pertumbuhan bakteri: sekitar 37°C (suhu tubuh)."],["li","فوق 63°م: تتوقف البكتيريا عن النمو.","Above 63°C: bacteria stop growing.","63°C से ऊपर: जीवाणु बढ़ना बंद कर देते हैं।","৬৩°C-এর উপরে: ব্যাকটেরিয়ার বৃদ্ধি থেমে যায়।","Di atas 63°C: bakteri berhenti tumbuh."],["li","من 75°م وأعلى: تموت معظم البكتيريا الضارة.","From 75°C and above: most harmful bacteria die.","75°C और उससे ऊपर: अधिकांश हानिकारक जीवाणु मर जाते हैं।","৭৫°C বা তার বেশিতে: বেশিরভাগ ক্ষতিকর ব্যাকটেরিয়া মারা যায়।","Dari 75°C ke atas: sebagian besar bakteri berbahaya mati."],["n","ماذا يعني هذا لنا؟: لا نعتمد على التجميد (-12 إلى -22°م) لقتل البكتيريا، فهي تبقى في حالة سكون فقط. نراقب درجة حرارة الثلاجات (1 إلى 4°م) بانتظام لضمان بقائها تحت 5°م. نقلل وقت بقاء الغذاء في النطاق الحراري الخطر (5 إلى 63°م) قدر الإمكان. نحافظ على درجة حرارة الأغذية الساخنة فوق 63°م دائماً. نستخدم مقياس حرارة للتأكد من وصول درجة حرارة الغذاء إلى 75°م على الأقل.","What this means for us: we do not rely on freezing (-12 to -22°C) to kill bacteria; it only keeps them dormant. We check fridge temperatures (1 to 4°C) regularly to keep them below 5°C. We minimise the time food spends in the danger zone (5 to 63°C). We always keep hot food above 63°C. We use a thermometer to confirm food reaches at least 75°C.","हमारे लिए इसका अर्थ: हम जीवाणु मारने के लिए जमाव (-12 से -22°C) पर निर्भर नहीं रहते; उससे वे केवल सुप्त होते हैं। हम फ्रिज का तापमान (1 से 4°C) नियमित जांचते हैं ताकि वह 5°C से नीचे रहे। भोजन खतरे के क्षेत्र (5 से 63°C) में कम से कम समय रहे। गर्म भोजन हमेशा 63°C से ऊपर रखें। थर्मामीटर से पक्का करें कि भोजन कम से कम 75°C तक पहुँचे।","আমাদের জন্য এর অর্থ: ব্যাকটেরিয়া মারতে আমরা হিমায়নের (-১২ থেকে -২২°C) উপর নির্ভর করি না; তাতে কেবল ওরা নিষ্ক্রিয় থাকে। ফ্রিজের তাপমাত্রা (১ থেকে ৪°C) নিয়মিত দেখি যেন ৫°C-এর নিচে থাকে। খাবার বিপদসীমায় (৫ থেকে ৬৩°C) যতটা সম্ভব কম রাখি। গরম খাবার সবসময় ৬৩°C-এর উপরে রাখি। থার্মোমিটারে যাচাই করি খাবার অন্তত ৭৫°C-এ পৌঁছেছে।","Bagi kita: kita tidak mengandalkan pembekuan (-12 sampai -22°C) untuk membunuh bakteri; itu hanya membuatnya dormant. Kita memeriksa suhu kulkas (1 sampai 4°C) secara rutin agar tetap di bawah 5°C. Kita meminimalkan waktu pangan berada di zona bahaya (5 sampai 63°C). Pangan panas selalu dijaga di atas 63°C. Kita memakai termometer untuk memastikan pangan mencapai minimal 75°C."],["h2","الجراثيم المتبوغة والسموم البكتيرية","Spore-forming bacteria and bacterial toxins","बीजाणु बनाने वाले जीवाणु और जीवाणु विष","স্পোর-গঠনকারী ব্যাকটেরিয়া ও ব্যাকটেরিয়াল টক্সিন","Bakteri pembentuk spora dan toksin bakteri"],["h3","الجراثيم المتبوغة","Spore-forming bacteria","बीजाणु बनाने वाले जीवाणु","স্পোর-গঠনকারী ব্যাকটেরিয়া","Bakteri pembentuk spora"],["p","عندما تصبح الظروف غير مناسبة لنمو البكتيريا - مثل ارتفاع درجات الحرارة أو عدم توفر الرطوبة - تموت معظم البكتيريا. لكن هناك أنواع من البكتيريا تستطيع النجاة عن طريق تكوين أبواغ، وهي تراكيب خلوية صلبة تحتوي على البكتيريا، مما يسمح للبكتيريا بالتوقف عن النشاط حتى تتحسن البيئة المحيطة، ويعود البوغ إلى شكل البكتيريا ويصبح نشطاً وقادراً على النمو والتكاثر من جديد.","When conditions are unsuitable for bacterial growth, such as high temperature or lack of moisture, most bacteria die. But some bacteria survive by forming spores, which are hard cell structures containing the bacterium. This lets the bacterium stop being active until the surroundings improve, and then the spore returns to the bacterial form, becomes active again and can grow and multiply.","जब परिस्थितियाँ जीवाणु वृद्धि के लिए अनुकूल नहीं रहतीं, जैसे उच्च तापमान या नमी की कमी, तो अधिकांश जीवाणु मर जाते हैं। लेकिन कुछ जीवाणु बीजाणु (स्पोर) बनाकर बच जाते हैं, जो सख्त कोशिका संरचनाएँ हैं और जीवाणु को अपने भीतर रखती हैं। इससे जीवाणु सक्रिय होना रोक देता है जब तक माहौल सुधर न जाए; फिर बीजाणु जीवाणु के रूप में लौटकर फिर से बढ़ता और फैलता है।","যখন পরিবেশ ব্যাকটেরিয়া বৃদ্ধির উপযোগী থাকে না, যেমন উচ্চ তাপমাত্রা বা আর্দ্রতার অভাবে, তখন বেশিরভাগ ব্যাকটেরিয়া মরে যায়। কিন্তু কিছু ব্যাকটেরিয়া স্পোর তৈরি করে বেঁচে থাকে, যা ব্যাকটেরিয়া ধারণকারী শক্ত কোষ কাঠামো। এতে পরিবেশ ভালো হওয়া পর্যন্ত ব্যাকটেরিয়া সক্রিয়তা বন্ধ রাখে; তারপর স্পোর আবার ব্যাকটেরিয়ায় রূপ নিয়ে সক্রিয় হয়ে বাড়ে ও ছড়ায়।","Ketika kondisi tidak sesuai untuk pertumbuhan bakteri, seperti suhu tinggi atau tidak adanya kelembapan, sebagian besar bakteri mati. Namun beberapa bakteri bertahan dengan membentuk spora, yaitu struktur sel keras yang berisi bakteri. Ini membuat bakteri berhenti aktif sampai lingkungan membaik; kemudian spora kembali menjadi bakteri, aktif lagi, dan dapat tumbuh serta berkembang biak."],["li","أمثلة على الجراثيم المتبوغة التي تشكل خطراً في منشآت الغذاء:","Examples of spore-forming bacteria that pose a risk in food establishments:","खाद्य प्रतिष्ठानों में खतरा पैदा करने वाले बीजाणु-जीवाणुओं के उदाहरण:","খাদ্য প্রতিষ্ঠানে ঝুঁকি সৃষ্টিকারী স্পোর-গঠনকারী ব্যাকটেরিয়ার উদাহরণ:","Contoh bakteri pembentuk spora yang berisiko di usaha pangan:"],["li","بكتيريا الباسيلس سيريس: توجد عادة في الأرز المطبوخ وأطباق الأرز.","Bacillus cereus: usually found in cooked rice and rice dishes.","बैसिलस सेरियस: आमतौर पर पके चावल और चावल के व्यंजनों में मिलता है।","ব্যাসিলাস সেরিয়াস: সাধারণত রান্না করা ভাত ও ভাতের পদে পাওয়া যায়।","Bacillus cereus: biasanya ditemukan pada nasi matang dan hidangan nasi."],["li","بكتيريا الكلوستريديوم بيرفرنجنز: تتواجد في اللحوم وأحياناً في التربة العالقة بالخضروات.","Clostridium perfringens: found in meat, and sometimes in soil clinging to vegetables.","क्लॉस्ट्रिडियम परफ्रिंजेंस: मांस में मिलता है, और कभी-कभी सब्ज़ियों पर चिपकी मिट्टी में।","ক্লস্ট্রিডিয়াম পারফ্রিনজেনস: মাংসে পাওয়া যায়, কখনো সবজিতে লেগে থাকা মাটিতেও।","Clostridium perfringens: ditemukan pada daging, dan kadang pada tanah yang menempel di sayuran."],["h3","السموم البكتيرية","Bacterial toxins","जीवाणु विष","ব্যাকটেরিয়াল টক্সিন","Toksin bakteri"],["p","تنتج بعض البكتيريا مواد سامة (تسمى التوكسين) داخل الغذاء. قد تسبب هذه السموم المرض حتى لو تم طهي الغذاء وقتل البكتيريا، لأن بعض هذه السموم مقاوم للحرارة. على سبيل المثال، السم الذي تنتجه بكتيريا ستافيلوكوكس أوريس يبقى فعالاً حتى بعد عملية الطهي، مما يعني أن قتل البكتيريا لا يمنع التسمم الغذائي.","Some bacteria produce toxic substances (called toxins) inside food. These toxins can cause illness even if the food is cooked and the bacteria are killed, because some toxins are heat-resistant. For example, the toxin produced by Staphylococcus aureus remains active even after cooking, meaning that killing the bacteria does not prevent food poisoning.","कुछ जीवाणु भोजन के भीतर विषैले पदार्थ (जिन्हें टॉक्सिन कहते हैं) बनाते हैं। ये टॉक्सिन भोजन पकाकर जीवाणु मार देने पर भी बीमारी पैदा कर सकते हैं, क्योंकि कुछ टॉक्सिन गर्मी-रोधी होते हैं। उदाहरण के लिए, स्टैफिलोकॉकस ऑरियस द्वारा बना विष पकाने के बाद भी सक्रिय रहता है; यानी जीवाणु मारने से फ़ूड पॉइज़निंग नहीं रुकती।","কিছু ব্যাকটেরিয়া খাবারের ভেতরে বিষাক্ত পদার্থ (টক্সিন) তৈরি করে। খাবার রান্না করে ব্যাকটেরিয়া মারা হলেও এই টক্সিন অসুখ ঘটাতে পারে, কারণ কিছু টক্সিন তাপ-প্রতিরোধী। যেমন স্ট্যাফাইলোকক্কাস অরিয়াসের টক্সিন রান্নার পরও সক্রিয় থাকে; অর্থাৎ ব্যাকটেরিয়া মারলেই খাদ্যে বিষক্রিয়া বন্ধ হয় না।","Beberapa bakteri menghasilkan zat beracun (disebut toksin) di dalam pangan. Toksin ini dapat menyebabkan sakit meski pangan sudah dimasak dan bakterinya mati, karena sebagian toksin tahan panas. Contohnya, toksin dari Staphylococcus aureus tetap aktif setelah dimasak, sehingga membunuh bakteri tidak mencegah keracunan pangan."],["h3","أمثلة على البكتيريا التي تنتج السموم","Examples of bacteria that produce toxins","विष बनाने वाले जीवाणुओं के उदाहरण","টক্সিন তৈরিকারী ব্যাকটেরিয়ার উদাহরণ","Contoh bakteri penghasil toksin"],["li","بكتيريا الكلوستريديوم بوتولينوم: تتواجد في الأسماك، اللحوم، الخضروات، والصلصات المحفوظة أو المعبأة تحت تفريغ. تنتج سموماً تؤثر على الجهاز العصبي، وقد تؤدي إلى حالات تسمم خطيرة قد تصل إلى الوفاة.","Clostridium botulinum: found in fish, meat, vegetables, and sauces that are canned or vacuum-packed. It produces toxins that affect the nervous system and can cause serious poisoning that may lead to death.","क्लॉस्ट्रिडियम बोटुलिनम: मछली, मांस, सब्ज़ियों और डिब्बाबंद या वैक्यूम-पैक सॉस में मिलता है। यह नसों पर असर डालने वाले विष बनाता है, जिससे गंभीर विषाक्तता और मृत्यु तक हो सकती है।","ক্লস্ট্রিডিয়াম বোটুলিনাম: মাছ, মাংস, সবজি এবং টিনজাত বা ভ্যাকুয়াম-প্যাকড সসে পাওয়া যায়। এটি স্নায়ুতন্ত্রে প্রভাব ফেলা টক্সিন তৈরি করে, যা গুরুতর বিষক্রিয়া ও মৃত্যু ঘটাতে পারে।","Clostridium botulinum: ditemukan pada ikan, daging, sayuran, dan saus yang dikalengkan atau dikemas vakum. Ia menghasilkan toksin yang memengaruhi sistem saraf dan dapat menyebabkan keracunan serius hingga kematian."],["n","ماذا يعني هذا لنا؟: فهم تكوين الأبواغ يساعدنا على طرق تخزين الغذاء، مثل التحكم في الحرارة والرطوبة لمنع نمو البكتيريا. التعامل بحذر مع الأغذية المحفوظة في المعلبات، والتأكد من عدم وجود تسرب أو انتفاخ. معرفة خطورة البكتيريا يجعلنا أكثر حرصاً في التعامل مع
