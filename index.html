ান।","Bersihkan dan keringkan tumpahan segera (air, es, minuman)."],["li","ضع علامات تحذيرية عند تنظيف الأرضيات.","Put warning signs when cleaning floors.","फ़र्श साफ़ करते समय चेतावनी संकेत लगाएँ।","মেঝে পরিষ্কারের সময় সতর্কতা চিহ্ন লাগান।","Pasang tanda peringatan saat membersihkan lantai."],["li","ارتدِ أحذية مانعة للانزلاق مناسبة للمطبخ.","Wear non-slip shoes suitable for the kitchen.","रसोई के लिए उपयुक्त फिसलन-रोधी जूते पहनें।","রান্নাঘরের উপযুক্ত অ-পিছল জুতা পরুন।","Pakai sepatu anti-selip yang cocok untuk dapur."],["li","كن حذراً على الأرضيات الزلقة (مثل غرف التبريد).","Be careful on slippery floors (such as cold rooms).","फिसलन भरे फ़र्श (जैसे कोल्ड रूम) पर सावधान रहें।","পিচ্ছিল মেঝে (যেমন কোল্ড রুম) নিয়ে সতর্ক থাকুন।","Waspada di lantai licin (seperti ruang pendingin)."],["h3","للوقاية من التعثر:","To prevent tripping:","ठोकर से बचने के लिए:","হোঁচট রোধে:","Untuk mencegah tersandung:"],["li","حافظ على ممرات العمل خالية من العوائق.","Keep work aisles free of obstacles.","काम के रास्तों को रुकावटों से मुक्त रखें।","কাজের পথ বাধামুক্ত রাখুন।","Jaga lorong kerja bebas dari rintangan."],["li","تأكد من وجود إضاءة كافية في مكان العمل.","Make sure there is enough light in the work area.","काम की जगह पर पर्याप्त रोशनी सुनिश्चित करें।","কর্মস্থলে পর্যাপ্ত আলো নিশ্চিত করুন।","Pastikan cukup cahaya di area kerja."],["li","استخدم الحصير المخصص في الأماكن الرطبة دائماً.","Always use the mats provided in wet areas.","गीली जगहों पर हमेशा दी गई चटाई इस्तेमाल करें।","ভেজা জায়গায় সবসময় নির্ধারিত মাদুর ব্যবহার করুন।","Selalu gunakan keset yang disediakan di area basah."],["h3","ما الإجراءات الواجب اتباعها عند حدوث انزلاق أو تعثر؟","What must be done after a slip or trip?","फिसलने या ठोकर लगने पर क्या करना चाहिए?","পিছলে পড়লে বা হোঁচট খেলে কী করতে হবে?","Apa yang harus dilakukan setelah tergelincir atau tersandung?"],["li","تقييم الموقف: التأكد من سلامة مصدر الخطر (مثل الأرضيات المبتلة أو العوائق).","Assess the situation: make sure the source of the hazard is safe (such as wet floors or obstacles).","स्थिति का आकलन करें: खतरे का स्रोत (जैसे गीला फ़र्श या रुकावट) सुरक्षित करें।","পরিস্থিতি মূল্যায়ন: ঝুঁকির উৎস (যেমন ভেজা মেঝে বা বাধা) নিরাপদ করুন।","Nilai situasi: pastikan sumber bahaya aman (seperti lantai basah atau rintangan)."],["li","تقديم المساعدة: إذا كنت مصاباً، اطلب المساعدة، أحضر مصاباً آخر، أسعفه أو ساعده على الجلوس.","Give help: if you are hurt, ask for help; if someone else is hurt, help them, and help them sit or lie down.","मदद दें: यदि आप घायल हों तो मदद माँगें; यदि कोई और घायल हो तो उसकी मदद करें और उसे बैठने या लेटने में सहायता दें।","সাহায্য করুন: নিজে আহত হলে সাহায্য চান; অন্য কেউ আহত হলে তাকে সাহায্য করুন ও বসতে বা শুতে সহায়তা করুন।","Berikan bantuan: jika Anda terluka, minta tolong; jika orang lain terluka, bantu dan bantu mereka duduk atau berbaring."],["li","إبلاغ المشرف: اطلب المساعدة من الزملاء وأبلغ المشرف بما حدث.","Report to the supervisor: ask colleagues for help and tell the supervisor what happened.","सुपरवाइज़र को बताएँ: साथियों से मदद माँगें और सुपरवाइज़र को जो हुआ वह बताएँ।","সুপারভাইজারকে জানান: সহকর্মীদের সাহায্য চান এবং যা ঘটেছে তা জানান।","Laporkan kepada supervisor: minta bantuan rekan dan beri tahu supervisor apa yang terjadi."],["li","تأمين المنطقة: ضع علامات تحذير عند الحادث وأبعد الآخرين عن منطقة الخطر.","Secure the area: put warning signs at the scene and keep others away from the danger zone.","जगह सुरक्षित करें: घटनास्थल पर चेतावनी संकेत लगाएँ और दूसरों को खतरे वाले क्षेत्र से दूर रखें।","এলাকা নিরাপদ করুন: ঘটনাস্থলে সতর্কতা চিহ্ন লাগান এবং অন্যদের বিপজ্জনক এলাকা থেকে দূরে রাখুন।","Amankan area: pasang tanda peringatan di lokasi dan jauhkan orang lain dari area berbahaya."],["li","معالجة السبب: ننظف الانسكابات ونزيل العوائق إذا كان ذلك آمناً.","Fix the cause: clean up spills and remove obstacles if it is safe to do so.","कारण दूर करें: छलकाव साफ़ करें और यदि सुरक्षित हो तो रुकावटें हटाएँ।","কারণ দূর করুন: ছলকানো তরল পরিষ্কার করুন এবং নিরাপদ হলে বাধা সরান।","Atasi penyebab: bersihkan tumpahan dan singkirkan rintangan jika aman."]]},{"t":["الوقاية من حوادث الكهرباء","Preventing electrical accidents","बिजली दुर्घटनाओं से बचाव","বিদ্যুৎ দুর্ঘটনা প্রতিরোধ","Mencegah kecelakaan listrik"],"r":[["h2","لماذا هذا مهم؟","Why is this important?","यह क्यों ज़रूरी है?","এটি কেন গুরুত্বপূর্ণ?","Mengapa ini penting?"],["p","الحوادث الكهربائية قد تكون خطيرة جداً، وتسبب صدمات كهربائية أو حروقاً أو حتى الوفاة. الوعي بمخاطر الكهرباء ضروري لسلامة جميع العاملين في منشآت الغذاء.","Electrical accidents can be very dangerous, causing electric shocks, burns, or even death. Awareness of electrical risks is essential for the safety of all workers in food establishments.","बिजली दुर्घटनाएँ बेहद खतरनाक हो सकती हैं, इनसे बिजली का झटका, जलन या मौत तक हो सकती है। खाद्य प्रतिष्ठानों में सभी कर्मचारियों की सुरक्षा के लिए बिजली के खतरों की जागरूकता ज़रूरी है।","বৈদ্যুতিক দুর্ঘটনা খুবই বিপজ্জনক হতে পারে, এতে বৈদ্যুতিক শক, পোড়া বা এমনকি মৃত্যুও হতে পারে। খাদ্য প্রতিষ্ঠানের সব কর্মীর নিরাপত্তার জন্য বিদ্যুতের ঝুঁকি সম্পর্কে সচেতনতা অপরিহার্য।","Kecelakaan listrik bisa sangat berbahaya, menyebabkan sengatan listrik, luka bakar, bahkan kematian. Kesadaran akan risiko listrik sangat penting bagi keselamatan semua pekerja usaha pangan."],["h3","ما هي أسباب حوادث الكهرباء؟","What are the causes of electrical accidents?","बिजली दुर्घटनाओं के कारण क्या हैं?","বৈদ্যুতিক দুর্ঘটনার কারণ কী?","Apa penyebab kecelakaan listrik?"],["li","ممارسات العمل غير الآمنة.","Unsafe work practices.","असुरक्षित कार्य पद्धतियाँ।","অনিরাপদ কাজের পদ্ধতি।","Praktik kerja yang tidak aman."],["li","عطب أو خلل في الأجهزة والأسلاك الكهربائية.","Faults in electrical appliances and wires.","बिजली के उपकरणों और तारों में खराबी।","বৈদ্যুতিক যন্ত্র ও তারে ত্রুটি।","Kerusakan pada peralatan dan kabel listrik."],["li","عمليات التنظيف (وصول الماء إلى المعدات والأجهزة الكهربائية).","Cleaning operations (water reaching equipment and electrical devices).","सफ़ाई के काम (पानी का बिजली के उपकरणों तक पहुँचना)।","পরিষ্কারের কাজ (যন্ত্র ও বৈদ্যুতিক সরঞ্জামে পানি পৌঁছানো)।","Kegiatan pembersihan (air mengenai peralatan dan perangkat listrik)."],["h3","كيف نمنع حوادث الكهرباء؟","How do we prevent electrical accidents?","बिजली दुर्घटनाएँ कैसे रोकें?","বৈদ্যুতিক দুর্ঘটনা কীভাবে রোধ করবেন?","Bagaimana mencegah kecelakaan listrik?"],["li","عند فصل القابس، شده من القابس نفسه وليس من السلك.","When unplugging, pull the plug itself, not the cable.","प्लग निकालते समय प्लग को ही पकड़कर खींचें, तार को नहीं।","প্লাগ খোলার সময় প্লাগ ধরে টানুন, তার ধরে নয়।","Saat mencabut, tarik colokannya, bukan kabelnya."],["li","لا توصل محوّل كهرباء على آخر ولا تستعمل محوّل موصول عليه عدة قوابس.","Do not plug one adapter into another, and do not use an adapter with several plugs on it.","एक एडाप्टर को दूसरे में न लगाएँ, और एक एडाप्टर पर कई प्लग न लगाएँ।","একটি অ্যাডাপ্টার অন্যটিতে লাগাবেন না, এবং একটি অ্যাডাপ্টারে একাধিক প্লাগ লাগাবেন না।","Jangan colokkan adaptor ke adaptor lain, dan jangan memakai adaptor yang diberi banyak colokan."],["li","انزع القابس عن المعدات عند عدم استعمالها.","Unplug equipment when not in use.","इस्तेमाल न होने पर उपकरणों का प्लग निकालें।","ব্যবহার না হলে যন্ত্রের প্লাগ খুলে রাখুন।","Cabut peralatan saat tidak digunakan."],["li","لا تضع أو تستعمل آلات كهربائية بجوار مصادر الماء إلا إذا كانت مصممة لذلك.","Do not place or use electrical machines next to water sources unless they are designed for it.","पानी के स्रोतों के पास बिजली की मशीनें न रखें या न चलाएँ, जब तक वे उसी के लिए बनी न हों।","পানির উৎসের কাছে বৈদ্যুতিক যন্ত্র রাখবেন বা চালাবেন না, যদি না সেগুলো সেভাবে তৈরি হয়।","Jangan letakkan atau pakai mesin listrik di dekat sumber air kecuali memang dirancang untuk itu."],["li","لا تمرر تمديدات الأسلاك فوق طاولات التحضير.","Do not run cables over preparation tables.","तारों को तैयारी की मेज़ों के ऊपर से न ले जाएँ।","তারগুলো প্রস্তুতির টেবিলের ওপর দিয়ে নেবেন না।","Jangan melewatkan kabel di atas meja persiapan."],["li","لا تتعامل مع الأجهزة الكهربائية بأيدٍ مبتلة.","Do not handle electrical devices with wet hands.","गीले हाथों से बिजली के उपकरण न छुएँ।","ভেজা হাতে বৈদ্যুতিক যন্ত্র ছোঁবেন না।","Jangan menyentuh peralatan listrik dengan tangan basah."],["li","تأكد من سلامة جميع التمديدات والتوصيلات والأسلاك الكهربائية.","Make sure all wiring, connections and cables are safe.","सभी वायरिंग, कनेक्शन और तारों की सुरक्षा सुनिश्चित करें।","সব বৈদ্যুতিক ওয়্যারিং, সংযোগ ও তার নিরাপদ কি না নিশ্চিত করুন।","Pastikan semua instalasi, sambungan, dan kabel listrik aman."],["li","افصل الكهرباء من المصدر الأساسي عند القيام بتصليحات.","Turn off power at the main source when carrying out repairs.","मरम्मत करते समय मुख्य स्रोत से बिजली बंद करें।","মেরামতের সময় মূল উৎস থেকে বিদ্যুৎ বন্ধ করুন।","Matikan listrik dari sumber utama saat melakukan perbaikan."],["li","استخدم التوصيلات الجيدة الصنع واتبع التعليمات المدونة عليها.","Use good-quality connectors and follow the instructions printed on them.","अच्छी गुणवत्ता के कनेक्टर इस्तेमाल करें और उन पर लिखे निर्देश मानें।","ভালো মানের সংযোগকারী ব্যবহার করুন এবং তাতে লেখা নির্দেশ অনুসরণ করুন।","Gunakan konektor berkualitas baik dan ikuti petunjuk yang tertera."],["h3","ما الإجراءات الواجب اتباعها عند حدوث صدمة كهربائية أثناء العمل؟","What must be done when an electric shock happens at work?","काम के दौरान बिजली का झटका लगने पर क्या करना चाहिए?","কাজের সময় বৈদ্যুতিক শক লাগলে কী করতে হবে?","Apa yang harus dilakukan jika terjadi sengatan listrik saat bekerja?"],["li","افصل التيار الكهربائي فوراً.","Cut the electricity immediately.","तुरंत बिजली बंद करें।","অবিলম্বে বিদ্যুৎ বন্ধ করুন।","Matikan listrik segera."],["li","عدم لمس الشخص المصاب إذا كان لا يزال متصلاً بمصدر الكهرباء.","Do not touch the injured person if they are still in contact with the power source.","यदि घायल व्यक्ति अभी भी बिजली के स्रोत से जुड़ा हो तो उसे न छुएँ।","আহত ব্যক্তি এখনো বিদ্যুতের উৎসের সাথে যুক্ত থাকলে তাকে ছোঁবেন না।","Jangan menyentuh korban jika masih terhubung dengan sumber listrik."],["li","طلب المساعدة الطبية فوراً.","Call for medical help immediately.","तुरंत चिकित्सा सहायता बुलाएँ।","তৎক্ষণাৎ চিকিৎসা সহায়তা ডাকুন।","Segera minta bantuan medis."],["li","تقديم الإسعافات الأولية إذا كنا مدربين على ذلك.","Give first aid if you are trained to do so.","यदि प्रशिक्षित हों तो प्राथमिक उपचार दें।","প্রশিক্ষিত হলে প্রাথমিক চিকিৎসা দিন।","Berikan pertolongan pertama jika sudah terlatih."],["li","إبلاغ المشرف والإدارة بالحادث.","Report the incident to the supervisor and management.","घटना की सूचना सुपरवाइज़र और प्रबंधन को दें।","ঘটনাটি সুপারভাইজার ও ব্যবস্থাপনাকে জানান।","Laporkan kejadian kepada supervisor dan manajemen."]]},{"t":["السلامة في المناولة اليدوية (الحمل والرفع)","Safety in manual handling (lifting and carrying)","हाथ से उठाने और ढोने में सुरक्षा (उठाना व ढोना)","হাতে তোলা ও বহনে নিরাপত্তা (ওঠানো ও বহন)","Keselamatan saat mengangkat secara manual (mengangkat dan membawa)"],"r":[["h2","لماذا هذا مهم؟","Why is this important?","यह क्यों ज़रूरी है?","এটি কেন গুরুত্বপূর্ণ?","Mengapa ini penting?"],["p","المناولة اليدوية غير الصحيحة قد تسبب إصابات في العضلات والعظام. هذه الإصابات قد تؤثر على قدرتك على العمل لفترات طويلة.","Incorrect manual handling can cause injuries to muscles and bones. These injuries may affect your ability to work for long periods.","हाथ से गलत तरीके से उठाने से मांसपेशियों और हड्डियों में चोट लग सकती है। ये चोटें लंबे समय तक काम करने की क्षमता पर असर डाल सकती हैं।","হাতে ভুলভাবে তোলা মাংসপেশি ও হাড়ে আঘাত করতে পারে। এসব আঘাত দীর্ঘদিন কাজ করার সামর্থ্যে প্রভাব ফেলতে পারে।","Mengangkat secara manual yang salah dapat menyebabkan cedera otot dan tulang. Cedera ini dapat memengaruhi kemampuan Anda bekerja dalam waktu lama."],["h3","ما هي أسباب إصابات المناولة اليدوية؟","What causes manual handling injuries?","हाथ से उठाने की चोटों के कारण क्या हैं?","হাতে তোলার আঘাতের কারণ কী?","Apa penyebab cedera pengangkatan manual?"],["li","استخدام الجسم لرفع، أو حمل، أو دفع، أو سحب حمولة، أو شيء بطريقة غير سليمة.","Using the body to lift, carry, push or pull a load or item in an incorrect way.","भार या चीज़ को उठाने, ढोने, धकेलने या खींचने में शरीर का गलत इस्तेमाल।","বোঝা বা জিনিস তোলা, বহন, ঠেলা বা টানার সময় শরীরের ভুল ব্যবহার।","Menggunakan tubuh untuk mengangkat, membawa, mendorong, atau menarik beban dengan cara yang salah."],["h3","كيف نمنع إصابات المناولة اليدوية؟","How do we prevent manual handling injuries?","हाथ से उठाने की चोटें कैसे रोकें?","হাতে তোলার আঘাত কীভাবে রোধ করবেন?","Bagaimana mencegah cedera pengangkatan manual?"],["li","قيّم الحمل قبل رفعه. إذا كان ثقيلاً جداً، اطلب المساعدة أو استخدم المعدات المخصصة.","Assess the load before lifting it. If it is very heavy, ask for help or use the equipment provided.","उठाने से पहले भार का आकलन करें। बहुत भारी हो तो मदद माँगें या दिए गए उपकरण इस्तेमाल करें।","তোলার আগে বোঝার মূল্যায়ন করুন। খুব ভারী হলে সাহায্য চান বা নির্ধারিত যন্ত্র ব্যবহার করুন।","Nilai beban sebelum diangkat. Jika sangat berat, minta bantuan atau gunakan alat yang tersedia."],["li","تأكد أن الطريق خالٍ قبل حمل الأشياء.","Make sure the path is clear before carrying items.","सामान उठाने से पहले रास्ता खाली है, यह सुनिश्चित करें।","জিনিস বহনের আগে পথ খালি কি না নিশ্চিত করুন।","Pastikan jalur bebas sebelum membawa barang."],["li","عند رفع الأشياء اقترب من الحمل قدر الإمكان، ارفع بقوة الساقين وليس الظهر، وامسك بالحمل جيداً، وأبقِ الحمل قريباً من وسط جسمك.","When lifting, get as close to the load as possible, lift with your legs not your back, hold the load firmly, and keep it close to your body's centre.","उठाते समय भार के जितना हो सके पास जाएँ, पीठ से नहीं पैरों के ज़ोर से उठाएँ, भार को मज़बूती से पकड़ें और उसे शरीर के बीच के पास रखें।","তোলার সময় বোঝার যতটা সম্ভব কাছে যান, পিঠ নয় পায়ের জোরে তুলুন, বোঝা শক্ত করে ধরুন এবং শরীরের মাঝখানের কাছে রাখুন।","Saat mengangkat, dekatkan diri ke beban sebanyak mungkin, angkat dengan kaki bukan punggung, pegang beban dengan kuat, dan jaga beban dekat dengan tengah tubuh."],["h3","ما الإجراءات الواجب اتباعها عند الشعور بألم أثناء حمل الأشياء؟","What must be done if you feel pain while lifting?","उठाते समय दर्द महसूस हो तो क्या करना चाहिए?","তোলার সময় ব্যথা অনুভব করলে কী করতে হবে?","Apa yang harus dilakukan jika merasa nyeri saat mengangkat?"],["li","التوقف عن الحمل فوراً عند الشعور بألم.","Stop lifting immediately when you feel pain.","दर्द महसूस होते ही उठाना बंद करें।","ব্যথা অনুভব করলে সঙ্গে সঙ্গে তোলা বন্ধ করুন।","Hentikan mengangkat segera saat merasa nyeri."],["li","وضع الحمل بحذر على الأرض.","Put the load down carefully on the floor.","भार को सावधानी से ज़मीन पर रखें।","বোঝা সাবধানে মেঝেতে নামান।","Letakkan beban dengan hati-hati di lantai."],["li","إبلاغ المشرف عن الألم أو الإصابة.","Report the pain or injury to the supervisor.","दर्द या चोट की सूचना सुपरवाइज़र को दें।","ব্যথা বা আঘাতের কথা সুপারভাইজারকে জানান।","Laporkan nyeri atau cedera kepada supervisor."],["li","طلب المساعدة الطبية إذا استمر الألم.","Ask for medical help if the pain continues.","दर्द बना रहे तो चिकित्सा सहायता लें।","ব্যথা চলতে থাকলে চিকিৎসা সহায়তা নিন।","Minta bantuan medis jika nyeri berlanjut."]]},{"t":["الوقاية من المواد الكيميائية الخطرة","Preventing hazardous chemicals","खतरनाक रसायनों से बचाव","বিপজ্জনক রাসায়নিক প্রতিরোধ","Mencegah bahan kimia berbahaya"],"r":[["h2","لماذا هذا مهم؟","Why is this important?","यह क्यों ज़रूरी है?","এটি কেন গুরুত্বপূর্ণ?","Mengapa ini penting?"],["p","التعرض للمواد الخطرة والأبخرة قد يسبب مشاكل صحية فورية أو على المدى الطويل. الوقاية تحمي صحتك وتضمن سلامة الغذاء.","Exposure to hazardous materials and fumes may cause immediate or long-term health problems. Prevention protects your health and keeps food safe.","खतरनाक पदार्थों और धुएँ के संपर्क से तुरंत या लंबे समय की स्वास्थ्य समस्याएँ हो सकती हैं। बचाव आपकी सेहत की रक्षा करता है और भोजन को सुरक्षित रखता है।","বিপজ্জনক পদার্থ ও ধোঁয়ার সংস্পর্শে তাৎক্ষণিক বা দীর্ঘমেয়াদি স্বাস্থ্য সমস্যা হতে পারে। প্রতিরোধ আপনার স্বাস্থ্য রক্ষা করে এবং খাবার নিরাপদ রাখে।","Paparan bahan dan asap berbahaya dapat menyebabkan masalah kesehatan segera atau jangka panjang. Pencegahan melindungi kesehatan Anda dan menjaga keamanan makanan."],["h3","ما هي مصادر المواد الكيميائية الخطرة؟","What are the sources of hazardous chemicals?","खतरनाक रसायनों के स्रोत क्या हैं?","বিপজ্জনক রাসায়নিকের উৎস কী?","Apa sumber bahan kimia berbahaya?"],["li","المواد الكيميائية (مواد التنظيف، المطهرات، المبيدات).","Chemicals (cleaning materials, sanitisers, pesticides).","रसायन (सफ़ाई सामग्री, सैनिटाइज़र, कीटनाशक)।","রাসায়নিক (পরিষ্কারক, জীবাণুনাশক, কীটনাশক)।","Bahan kimia (pembersih, sanitasi, pestisida)."],["li","أبخرة الطهي.","Cooking fumes.","खाना पकाने का धुआँ।","রান্নার ধোঁয়া।","Asap memasak."],["li","غبار المواد الغذائية (مثل الدقيق في المخابز).","Food dust (such as flour in bakeries).","खाद्य पदार्थों की धूल (जैसे बेकरी में आटा)।","খাদ্যের ধুলো (যেমন বেকারিতে ময়দা)।","Debu bahan pangan (seperti tepung di toko roti)."],["h3","كيف نمنع مخاطر المواد الكيميائية؟","How do we prevent chemical hazards?","रसायन के खतरों से कैसे बचें?","রাসায়নিকের ঝুঁকি কীভাবে প্রতিরোধ করবেন?","Bagaimana mencegah bahaya bahan kimia?"],["li","تخزين المواد الكيميائية بعيداً عن الغذاء والمعدات.","Store chemicals away from food and equipment.","रसायनों को भोजन और उपकरणों से दूर रखें।","রাসায়নিক খাবার ও যন্ত্রপাতি থেকে দূরে রাখুন।","Simpan bahan kimia jauh dari makanan dan peralatan."],["li","قراءة تعليمات الاستخدام الآمن للمواد الكيميائية واتباعها.","Read and follow the safe-use instructions for chemicals.","रसायनों के सुरक्षित उपयोग के निर्देश पढ़ें और उनका पालन करें।","রাসায়নিকের নিরাপদ ব্যবহারের নির্দেশনা পড়ুন ও মেনে চলুন।","Baca dan ikuti instruksi penggunaan aman untuk bahan kimia."],["li","استخدام أدوات الوقاية الشخصية (مثل القفازات والكمامات).","Use personal protective equipment (such as gloves and masks).","निजी सुरक्षा उपकरण (जैसे दस्ताने और मास्क) इस्तेमाल करें।","ব্যক্তিগত সুরক্ষা সরঞ্জাম (যেমন গ্লাভস ও মাস্ক) ব্যবহার করুন।","Pakai alat pelindung diri (seperti sarung tangan dan masker)."],["li","عدم مزج وخلط المواد الكيميائية المختلفة.","Do not mix different chemicals.","अलग-अलग रसायनों को आपस में न मिलाएँ।","বিভিন্ন রাসায়নিক একসঙ্গে মেশাবেন না।","Jangan mencampur bahan kimia yang berbeda."],["li","الحفاظ على التهوية الجيدة في مكان العمل.","Keep good ventilation in the workplace.","कार्यस्थल पर अच्छा वेंटिलेशन रखें।","কর্মস্থলে ভালো বায়ুচলাচল রাখুন।","Jaga ventilasi yang baik di tempat kerja."],["li","غسل اليدين بعد استخدام المواد الكيميائية.","Wash hands after using chemicals.","रसायन इस्तेमाल करने के बाद हाथ धोएँ।","রাসায়নিক ব্যবহারের পর হাত ধুন।","Cuci tangan setelah memakai bahan kimia."],["li","التعامل مع الغبار بحذر للمواد المسببة للغبار.","Handle dust-causing materials carefully.","धूल पैदा करने वाली सामग्री को सावधानी से संभालें।","ধুলো সৃষ্টিকারী উপকরণ সাবধানে পরিচালনা করুন।","Tangani bahan penyebab debu dengan hati-hati."],["li","استخدام المواد الكيميائية الخطرة تحت إشراف أشخاص متخصصين ومدربين إذا تطلب الأمر.","Use dangerous chemicals under the supervision of specialists and trained staff if needed.","ज़रूरत हो तो खतरनाक रसायन विशेषज्ञों और प्रशिक्षित लोगों की देखरेख में ही इस्तेमाल करें।","প্রয়োজনে বিশেষজ্ঞ ও প্রশিক্ষিতদের তত্ত্বাবধানে বিপজ্জনক রাসায়নিক ব্যবহার করুন।","Gunakan bahan kimia berbahaya di bawah pengawasan ahli dan staf terlatih bila diperlukan."],["h3","ما الإجراءات الواجب اتباعها عند التعرض لمواد كيميائية خطرة أثناء العمل؟","What must be done if you are exposed to a hazardous chemical at work?","काम के दौरान खतरनाक रसायन के संपर्क में आने पर क्या करना चाहिए?","কাজের সময় বিপজ্জনক রাসায়নিকের সংস্পর্শে এলে কী করতে হবে?","Apa yang harus dilakukan jika terpapar bahan kimia berbahaya saat bekerja?"],["li","الابتعاد عن المصدر: توقف عن العمل وانتقل إلى منطقة جيدة التهوية.","Move away from the source: stop work and go to a well-ventilated area.","स्रोत से दूर हटें: काम रोकें और अच्छे वेंटिलेशन वाली जगह पर जाएँ।","উৎস থেকে সরুন: কাজ থামিয়ে ভালো বায়ুচলাচলযুক্ত জায়গায় যান।","Menjauh dari sumber: hentikan pekerjaan dan pindah ke area berventilasi baik."],["li","التصرف حسب نوع التعرض: للجلد: غسل المنطقة بالماء الجاري لمدة 15-20 دقيقة. للعينين: غسل العين بالماء لمدة 20-15 دقيقة مع فتح الجفن. للاستنشاق: الخروج إلى الهواء الطلق وتجنب المجهود.","Act according to the type of exposure: for skin: rinse the area with running water for 15–20 minutes. For eyes: rinse the eye with water for 15–20 minutes while holding the eyelid open. For inhalation: go out into fresh air and avoid exertion.","संपर्क के प्रकार के अनुसार कार्रवाई करें: त्वचा के लिए: प्रभावित जगह को 15–20 मिनट बहते पानी से धोएँ। आँखों के लिए: पलक खोलकर 15–20 मिनट पानी से धोएँ। साँस के लिए: खुली हवा में जाएँ और ज़ोर लगाने से बचें।","সংস্পর্শের ধরন অনুযায়ী ব্যবস্থা নিন: ত্বকে: জায়গাটি ১৫–২০ মিনিট চলমান পানিতে ধুন। চোখে: পাতা খুলে ১৫–২০ মিনিট পানি দিয়ে ধুন। শ্বাসে: খোলা বাতাসে যান এবং পরিশ্রম এড়িয়ে চলুন।","Tindak sesuai jenis paparan: untuk kulit: bilas area dengan air mengalir selama 15–20 menit. Untuk mata: bilas mata dengan air selama 15–20 menit sambil membuka kelopak. Untuk terhirup: keluar ke udara segar dan hindari bekerja keras."],["li","مراجعة بيانات السلامة للمادة: للحصول على تعليمات الإسعافات الأولية.","Check the material safety data: to get first aid instructions.","सामग्री सुरक्षा डेटा देखें: प्राथमिक उपचार के निर्देश पाने के लिए।","উপকরণের নিরাপত্তা তথ্য দেখুন: প্রাথমিক চিকিৎসার নির্দেশনা পেতে।","Periksa data keselamatan bahan: untuk mendapatkan instruksi pertolongan pertama."],["li","إبلاغ المشرف: أخبار المشرف على الفور بما حدث.","Report to the supervisor: tell the supervisor immediately what happened.","सुपरवाइज़र को बताएँ: जो हुआ वह तुरंत बताएँ।","সুপারভাইজারকে জানান: যা ঘটেছে তৎক্ষণাৎ জানান।","Laporkan kepada supervisor: beri tahu supervisor segera apa yang terjadi."],["li","الحصول على الرعاية الطبية: الذهاب إلى المركز الطبي إذا كانت الأعراض خطيرة.","Get medical care: go to the medical centre if symptoms are serious.","चिकित्सा देखभाल लें: लक्षण गंभीर हों तो चिकित्सा केंद्र जाएँ।","চিকিৎসা নিন: উপসর্গ গুরুতর হলে চিকিৎসা কেন্দ্রে যান।","Dapatkan perawatan medis: pergi ke pusat medis jika gejalanya parah."]]},{"t":["رموز المواد الكيميائية الخطرة الشائعة","Common hazardous chemical symbols","आम खतरनाक रसायन चिह्न","সাধারণ বিপজ্জনক রাসায়নিক চিহ্ন","Simbol bahan kimia berbahaya yang umum"],"r":[["h2","لماذا هذا مهم؟","Why is this important?","यह क्यों ज़रूरी है?","এটি কেন গুরুত্বপূর্ণ?","Mengapa ini penting?"],["p","فهم رموز المواد الكيميائية الخطرة يساعدك على التعامل معها بأمان وحماية نفسك وزملائك والغذاء الذي تتعامل معه.","Understanding hazardous chemical symbols helps you handle them safely and protects you, your colleagues and the food you handle.","खतरनाक रसायन चिह्नों को समझने से आप इन्हें सुरक्षित रूप से संभाल पाते हैं और खुद, साथियों और भोजन की रक्षा करते हैं।","বিপজ্জনক রাসায়নিক চিহ্ন বুঝলে আপনি এগুলো নিরাপদে পরিচালনা করতে পারেন এবং নিজেকে, সহকর্মীদের ও খাবারকে রক্ষা করতে পারেন।","Memahami simbol bahan kimia berbahaya membantu Anda menanganinya dengan aman dan melindungi diri, rekan kerja, dan makanan yang Anda tangani."],["li","مواد مسببة للتآكل: قد تسبب حروقاً للجلد أو العين، أو تتلف المعادن. أمثلة: منظفات الأفران القوية، مزيلات الدهون.","Corrosive materials: can cause burns to skin or eyes, or damage metals. Examples: strong oven cleaners, degreasers.","संक्षारक पदार्थ: त्वचा या आँखों पर जलन कर सकते हैं, या धातु खराब कर सकते हैं। उदाहरण: तेज़ ओवन क्लीनर, ग्रीस रिमूवर।","ক্ষয়কারী পদার্থ: ত্বক বা চোখে পোড়া বা ধাতু নষ্ট করতে পারে। উদাহরণ: শক্তিশালী ওভেন ক্লিনার, গ্রিজ রিমুভার।","Bahan korosif: dapat menyebabkan luka bakar pada kulit atau mata, atau merusak logam. Contoh: pembersih oven kuat, penghilang lemak."],["li","مواد سامة: قد تكون ضارة إذا تم ابتلاعها أو استنشاقها أو ملامستها للجلد. أمثلة: بعض المبيدات الحشرية، مواد التنظيف القوية.","Toxic materials: can be harmful if swallowed, inhaled or touching the skin. Examples: some insecticides, strong cleaners.","विषैले पदार्थ: निगलने, साँस में लेने या त्वचा से छूने पर हानिकारक हो सकते हैं। उदाहरण: कुछ कीटनाशक, तेज़ क्लीनर।","বিষাক্ত পদার্থ: গিললে, শ্বাসে নিলে বা ত্বকে লাগলে ক্ষতিকর হতে পারে। উদাহরণ: কিছু কীটনাশক, শক্তিশালী ক্লিনার।","Bahan beracun: dapat berbahaya jika tertelan, terhirup, atau mengenai kulit. Contoh: beberapa insektisida, pembersih kuat."],["li","مواد قابلة للاشتعال: احفظها بعيداً عن مصادر الحرارة واللهب. أمثلة: بعض المنظفات، المطهرات الكحولية.","Flammable materials: keep away from heat and flames. Examples: some cleaners, alcohol-based sanitisers.","ज्वलनशील पदार्थ: गर्मी और आग से दूर रखें। उदाहरण: कुछ क्लीनर, अल्कोहल-आधारित सैनिटाइज़र।","দাহ্য পদার্থ: তাপ ও আগুন থেকে দূরে রাখুন। উদাহরণ: কিছু ক্লিনার, অ্যালকোহলভিত্তিক জীবাণুনাশক।","Bahan mudah terbakar: jauhkan dari panas dan api. Contoh: beberapa pembersih, sanitasi berbasis alkohol."],["li","خطر على البيئة: قد تكون ضارة للبيئة، خاصة للحياة المائية. أمثلة: بعض المبيدات الحشرية، المنظفات الكيميائية.","Environmental hazard: can harm the environment, especially aquatic life. Examples: some insecticides, chemical cleaners.","पर्यावरण का खतरा: पर्यावरण, खासकर जलीय जीवन को नुकसान पहुँचा सकते हैं। उदाहरण: कुछ कीटनाशक, रासायनिक क्लीनर।","পরিবেশের ঝুঁকি: পরিবেশ, বিশেষ করে জলজ জীবনের ক্ষতি করতে পারে। উদাহরণ: কিছু কীটনাশক, রাসায়নিক ক্লিনার।","Bahaya lingkungan: dapat merusak lingkungan, terutama kehidupan air. Contoh: beberapa insektisida, pembersih kimia."],["li","مواد مهيجة: قد تسبب تهيجاً للجلد أو العين أو الجهاز التنفسي. أمثلة: بعض المنظفات العامة، سوائل غسل الأطباق.","Irritant materials: can irritate skin, eyes or the breathing system. Examples: some general cleaners, dishwashing liquids.","परेशान करने वाले पदार्थ: त्वचा, आँखों या साँस की नली में जलन कर सकते हैं। उदाहरण: कुछ सामान्य क्लीनर, बर्तन धोने का तरल।","উত্তেজক পদার্থ: ত্বক, চোখ বা শ্বাসতন্ত্রে জ্বালা করতে পারে। উদাহরণ: কিছু সাধারণ ক্লিনার, থালা ধোয়ার তরল।","Bahan iritan: dapat mengiritasi kulit, mata atau sistem pernapasan. Contoh: beberapa pembersih umum, cairan cuci piring."],["li","مواد قابلة للانفجار: قد تنفجر عند تعرضها للحرارة أو الصدمات أو الاحتكاك. أمثلة: علب الأيروسول (الرذاذ) المضغوطة، بعض أنواع المنظفات أو المطهرات.","Explosive materials: may explode when exposed to heat, shock or friction. Examples: pressurised aerosol cans, some types of cleaners or sanitisers.","विस्फोटक पदार्थ: गर्मी, झटके या घर्षण से फट सकते हैं। उदाहरण: दबाव वाले एयरोसोल कैन, कुछ प्रकार के क्लीनर या सैनिटाइज़र।","বিস্ফোরক পদার্থ: তাপ, আঘাত বা ঘর্ষণে ফেটে যেতে পারে। উদাহরণ: চাপযুক্ত অ্যারোসল ক্যান, কিছু ধরনের ক্লিনার বা জীবাণুনাশক।","Bahan eksplosif: dapat meledak jika terkena panas, benturan, atau gesekan. Contoh: kaleng aerosol bertekanan, beberapa jenis pembersih atau sanitasi."],["n","تذكر دائماً: التأكد من قراءة ملصقات المواد الكيميائية قبل استخدامها. التخزين الصحيح للمواد الكيميائية في أماكنها المخصصة، بعيداً عن الغذاء والمعدات المستخدمة في تحضير الغذاء. الإبلاغ عن أي مواد كيميائية غير مغنونة بشكل صحيح أو مخزنة بشكل غير آمن، ابلغ المشرف فوراً!","Always remember: read chemical labels before using them. Store chemicals properly in their designated places, away from food and food-preparation equipment. Report any chemical that is not labelled correctly or stored unsafely, and tell your supervisor immediately!","हमेशा याद रखें: इस्तेमाल से पहले रसायन पर लिखे लेबल पढ़ें। रसायनों को उनकी तय जगह पर, भोजन और भोजन तैयारी के उपकरणों से दूर रखें। जिस रसायन पर सही लेबल न हो या जो असुरक्षित तरीके से रखा हो, उसकी तुरंत सुपरवाइज़र को सूचना दें!","সবসময় মনে রাখুন: ব্যবহারের আগে রাসায়নিকের লেবেল পড়ুন। রাসায়নিক নির্ধারিত জায়গায়, খাবার ও খাবার প্রস্তুতির যন্ত্র থেকে দূরে সঠিকভাবে রাখুন। যেকোনো রাসায়নিক সঠিকভাবে লেবেলযুক্ত না হলে বা অনিরাপদভাবে রাখা হলে তৎক্ষণাৎ সুপারভাইজারকে জানান!","Ingat selalu: baca label bahan kimia sebelum dipakai. Simpan bahan kimia dengan benar di tempat yang ditentukan, jauh dari makanan dan peralatan persiapan makanan. Laporkan bahan kimia yang tidak berlabel benar atau disimpan tidak aman, segera beri tahu supervisor!"]]},{"t":["الوقاية من الحرائق، أدوات الحماية الشخصية، وصندوق الإسعافات","Fire prevention, personal protective equipment and first aid kit","आग से बचाव, निजी सुरक्षा उपकरण और प्राथमिक उपचार बॉक्स","আগুন প্রতিরোধ, ব্যক্তিগত সুরক্ষা সরঞ্জাম ও প্রাথমিক চিকিৎসা বাক্স","Pencegahan kebakaran, alat pelindung diri dan kotak P3K"],"r":[["h2","الوقاية من الحرائق في منشآت الغذاء","Fire prevention in food establishments","खाद्य प्रतिष्ठानों में आग से बचाव","খাদ্য প্রতিষ্ঠানে আগুন প্রতিরোধ","Pencegahan kebakaran di usaha pangan"],["p","الحرائق في منشآت الغذاء تشكل خطراً كبيراً على سلامة العاملين والعملاء، وقد تؤدي إلى خسائر مادية جسيمة. الوقاية من الحرائق لا تحمي الأرواح والممتلكات فحسب، بل تضمن استمرارية العمل وسلامة البيئة المحيطة. فالدخان والأبخرة المحيطة الاختناق، في حين تؤدي الحرارة واللهب إلى الحروق الخطيرة. بالإضافة إلى ذلك، قد يتسبب الانفجار في تدمير المباني وتحطم المعدات، مما يؤدي إلى توقف العمل لفترات طويلة.","Fires in food establishments are a major risk to the safety of workers and customers and can cause heavy material losses. Fire prevention protects lives and property, and keeps work going and the surrounding environment safe. Smoke and fumes can cause suffocation, while heat and flames cause serious burns. Explosions can also destroy buildings and wreck equipment, stopping work for long periods.","खाद्य प्रतिष्ठानों में आग कर्मचारियों और ग्राहकों की सुरक्षा के लिए बड़ा खतरा है और भारी आर्थिक नुकसान कर सकती है। आग से बचाव जान-माल की रक्षा करता है और काम व आसपास के वातावरण को सुरक्षित रखता है। धुआँ और वाष्प दम घोंट सकते हैं, जबकि गर्मी और लपटें गंभीर जलन पैदा करती हैं। विस्फोट इमारतों और उपकरणों को नष्ट कर सकता है और लंबे समय तक काम रोक सकता है।","খাদ্য প্রতিষ্ঠানে আগুন কর্মী ও গ্রাহকদের নিরাপত্তার জন্য বড় ঝুঁকি এবং বড় বস্তুগত ক্ষতি করতে পারে। আগুন প্রতিরোধ প্রাণ ও সম্পদ রক্ষা করে এবং কাজ ও পারিপার্শ্বিক পরিবেশ নিরাপদ রাখে। ধোঁয়া ও বাষ্পে শ্বাসরোধ হতে পারে, আর তাপ ও শিখায় গুরুতর পোড়া হয়। বিস্ফোরণে ভবন ও যন্ত্রপাতি ধ্বংস হতে পারে এবং দীর্ঘদিন কাজ বন্ধ থাকতে পারে।","Kebakaran di usaha pangan merupakan risiko besar bagi keselamatan pekerja dan pelanggan, serta dapat menimbulkan kerugian material besar. Pencegahan kebakaran melindungi nyawa dan harta, serta menjaga kelancaran kerja dan lingkungan sekitar. Asap dan uap dapat menyebabkan sesak napas, sedangkan panas dan api menyebabkan luka bakar serius. Ledakan juga dapat merusak bangunan dan peralatan sehingga kerja terhenti lama."],["h3","ما هي أسباب حرائق منشآت الغذاء؟","What causes fires in food establishments?","खाद्य प्रतिष्ठानों में आग के कारण क्या हैं?","খাদ্য প্রতিষ্ঠানে আগুনের কারণ কী?","Apa penyebab kebakaran di usaha pangan?"],["li","التحميل الزائد على الأجهزة الكهربائية.","Overloading electrical appliances.","बिजली के उपकरणों पर अधिक भार डालना।","বৈদ্যুতিক যন্ত্রে অতিরিক্ত লোড দেওয়া।","Kelebihan beban pada peralatan listrik."],["li","تجمع الدهون على مراوح الشفط.","Grease build-up on extractor fans.","एग्ज़ॉस्ट पंखों पर चिकनाई जमना।","এক্সজস্ট ফ্যানে চর্বি জমা।","Penumpukan lemak pada kipas exhaust."],["li","الإحماء المفرط للزيوت في المقالي.","Overheating of oil in frying pans.","कड़ाही में तेल का अधिक गरम होना।","কড়াইয়ে তেলের অতিরিক্ত গরম হওয়া।","Pemanasan berlebih minyak di wajan."],["li","سوء استخدام المعدات الكهربائية.","Misuse of electrical equipment.","बिजली के उपकरणों का गलत इस्तेमाल।","বৈদ্যুতিক যন্ত্রের অপব্যবহার।","Penyalahgunaan peralatan listrik."],["li","التدخين في أماكن غير مخصصة.","Smoking in unauthorised places.","अनुमति न होने वाली जगहों पर धूम्रपान।","অননুমোদিত জায়গায় ধূমপান।","Merokok di tempat yang tidak diperbolehkan."],["li","الأسطح الساخنة جداً للمعدات.","Very hot equipment surfaces.","उपकरणों की बहुत गर्म सतहें।","যন্ত্রের অত্যন্ত গরম তল।","Permukaan peralatan yang sangat panas."],["li","السوائل الساخنة مثل الزيوت والدهون.","Hot liquids such as oil and fat.","तेल और चिकनाई जैसे गर्म तरल पदार्थ।","তেল ও চর্বির মতো গরম তরল।","Cairan panas seperti minyak dan lemak."],["h3","كيف نمنع حرائق منشآت الغذاء؟","How do we prevent fires in food establishments?","खाद्य प्रतिष्ठानों में आग कैसे रोकें?","খাদ্য প্রতিষ্ঠানে আগুন কীভাবে রোধ করবেন?","Bagaimana mencegah kebakaran di usaha pangan?"],["li","التخزين الآمن: خزّن المواد القابلة للاشتعال بعيداً عن مصادر الحرارة واللهب، وحفظ الزيوت بعيداً عن المواقد ومصادر اللهب.","Safe storage: store flammable materials away from heat and flames, and keep oils away from stoves and flame sources.","सुरक्षित भंडारण: ज्वलनशील पदार्थ गर्मी और आग से दूर रखें, और तेल चूल्हों व आग के स्रोतों से दूर रखें।","নিরাপদ সংরক্ষণ: দাহ্য পদার্থ তাপ ও আগুন থেকে দূরে রাখুন, এবং তেল চুলা ও আগুনের উৎস থেকে দূরে রাখুন।","Penyimpanan aman: simpan bahan mudah terbakar jauh dari panas dan api, dan jauhkan minyak dari kompor dan sumber api."],["li","ممارسات العمل الآمنة: استخدم معدات نظيفة وأدوات جافة ونظيفة أثناء الطهي، عدم ارتداء ملابس فضفاضة، عدم ترك الطهي بدون مراقبة، عدم ترك مراوح شفط الدخان بانتظام، عدم ترك أماكن الطهو دون مراقبة.","Safe work practices: use clean equipment and dry, clean tools while cooking, do not wear loose clothing, do not leave cooking unattended, clean extractor fans regularly, and do not leave cooking areas unattended.","सुरक्षित कार्य पद्धतियाँ: पकाते समय साफ़ उपकरण और सूखे, साफ़ औज़ार इस्तेमाल करें, ढीले कपड़े न पहनें, पकाते समय उसे अकेला न छोड़ें, एग्ज़ॉस्ट पंखे नियमित साफ़ करें, और पकाने की जगह बिना निगरानी न छोड़ें।","নিরাপদ কাজের পদ্ধতি: রান্নার সময় পরিষ্কার যন্ত্র ও শুকনো, পরিষ্কার সরঞ্জাম ব্যবহার করুন, ঢিলেঢালা পোশাক পরবেন না, রান্না অযত্নে ফেলে রাখবেন না, এক্সজস্ট ফ্যান নিয়মিত পরিষ্কার করুন।","Praktik kerja aman: gunakan peralatan bersih dan alat kering saat memasak, jangan memakai pakaian longgar, jangan meninggalkan masakan tanpa pengawasan, bersihkan kipas exhaust secara teratur."],["li","التدريب والوعي: التعرف على مواقع معدات الإطفاء وكيفية استخدامها، والتأكد من أن جميع مخارج الطوارئ سالكة وخالية من العوائق.","Training and awareness: know where fire-fighting equipment is and how to use it, and make sure all emergency exits are clear and free of obstacles.","प्रशिक्षण और जागरूकता: अग्निशमन उपकरण कहाँ हैं और उन्हें कैसे चलाना है जानें, और सुनिश्चित करें कि सभी आपातकालीन निकास खुले और रुकावट-मुक्त हों।","প্রশিক্ষণ ও সচেতনতা: অগ্নিনির্বাপক যন্ত্র কোথায় ও কীভাবে ব্যবহার করতে হয় জানুন, এবং সব জরুরি নির্গমন পথ খোলা ও বাধামুক্ত আছে নিশ্চিত করুন।","Pelatihan dan kesadaran: ketahui lokasi dan cara memakai peralatan pemadam, serta pastikan semua pintu darurat terbuka dan bebas rintangan."],["h3","ما الإجراءات الواجب اتباعها عند اكتشاف حريق أثناء العمل؟","What must be done when a fire is found at work?","काम के दौरान आग दिखे तो क्या करना चाहिए?","কাজের সময় আগুন দেখলে কী করতে হবে?","Apa yang harus dilakukan jika menemukan kebakaran saat bekerja?"],["li","الإنذار: عند اكتشاف حريق، أطلق جرس الإنذار فوراً، وابلغ المشرفين والزملاء في المكان.","Raise the alarm: when you find a fire, sound the alarm immediately and tell supervisors and colleagues nearby.","अलार्म बजाएँ: आग दिखते ही तुरंत अलार्म बजाएँ और पास के सुपरवाइज़रों व साथियों को बताएँ।","সতর্ক করুন: আগুন দেখলে তৎক্ষণাৎ অ্যালার্ম বাজান এবং কাছের সুপারভাইজার ও সহকর্মীদের জানান।","Beri peringatan: saat menemukan kebakaran, bunyikan alarm segera dan beri tahu supervisor serta rekan di sekitar."],["li","الإخلاء: اتبع خطة الإخلاء المعتمدة في المنشأة، وغادر المبنى فوراً عبر أقرب مخرج طوارئ، وغلق الأبواب لمنع انتشار الحريق.","Evacuate: follow the approved evacuation plan, leave the building immediately by the nearest emergency exit, and close doors to stop the fire spreading.","निकासी: स्वीकृत निकासी योजना का पालन करें, सबसे नज़दीकी आपातकालीन निकास से तुरंत इमारत से बाहर निकलें, और आग फैलने से रोकने के लिए दरवाज़े बंद करें।","সরিয়ে নেওয়া: অনুমোদিত সরিয়ে নেওয়ার পরিকল্পনা মেনে কাছের জরুরি পথে তৎক্ষণাৎ ভবন ছাড়ুন, এবং আগুন ছড়ানো রোধে দরজা বন্ধ করুন।","Evakuasi: ikuti rencana evakuasi yang disetujui, segera keluar gedung lewat pintu darurat terdekat, dan tutup pintu untuk mencegah api menyebar."],["li","مكافحة الحريق (للمدربين فقط): محاولة إطفاء الحريق فقط إذا كان صغيراً، واستخدام طفاية الحريق المناسبة لنوع الحريق.","Fight the fire (trained staff only): try to put out the fire only if it is small, using the right extinguisher for the type of fire.","आग बुझाना (केवल प्रशिक्षित के लिए): आग छोटी हो तो ही बुझाने की कोशिश करें, और आग के प्रकार के अनुसार सही अग्निशामक इस्तेमाल करें।","আগুন নেভানো (শুধু প্রশিক্ষিতদের জন্য): আগুন ছোট হলেই নেভানোর চেষ্টা করুন, এবং আগুনের ধরন অনুযায়ী সঠিক অগ্নিনির্বাপক ব্যবহার করুন।","Memadamkan api (hanya untuk yang terlatih): coba padamkan api hanya jika kecil, dengan alat pemadam yang sesuai jenis kebakaran."],["li","عدم استخدام الماء لإطفاء حرائق الزيت أبداً.","Never use water to put out oil fires.","तेल की आग बुझाने के लिए कभी पानी का इस्तेमाल न करें।","তেলের আগুন নেভাতে কখনো পানি ব্যবহার করবেন না।","Jangan pernah memakai air untuk memadamkan kebakaran minyak."],["li","التجمع: التوجه إلى نقطة التجمع المحددة خارج المبنى، وانتظار التعليمات من المشرفين أو رجال الإطفاء.","Assembly: go to the set assembly point outside the building and wait for instructions from supervisors or firefighters.","एकत्र होना: इमारत के बाहर तय स्थान पर जाएँ और सुपरवाइज़रों या दमकल कर्मियों के निर्देश का इंतज़ार करें।","জমায়েত: ভবনের বাইরে নির্ধারিত জমায়েত স্থানে যান এবং সুপারভাইজার বা দমকলকর্মীদের নির্দেশের অপেক্ষা করুন।","Berkumpul: menuju titik kumpul yang ditentukan di luar gedung dan tunggu instruksi dari supervisor atau petugas pemadam."],["n","تذكر دائماً: الإبلاغ عن أي خطر حريق فوراً، فالوقاية خير من العلاج، وسلامتك أولاً!","Always remember: report any fire risk immediately. Prevention is better than cure, and your safety comes first!","हमेशा याद रखें: आग के किसी भी खतरे की तुरंत सूचना दें। बचाव इलाज से बेहतर है, और आपकी सुरक्षा सबसे पहले है!","সবসময় মনে রাখুন: আগুনের যেকোনো ঝুঁকি তৎক্ষণাৎ জানান। প্রতিরোধ চিকিৎসার চেয়ে ভালো, আর আপনার নিরাপত্তা সবার আগে!","Ingat selalu: laporkan setiap risiko kebakaran segera. Mencegah lebih baik daripada mengobati, dan keselamatan Anda yang utama!"]]},{"t":["أدوات الحماية الشخصية","Personal protective equipment (PPE)","निजी सुरक्षा उपकरण","ব্যক্তিগত সুরক্ষা সরঞ্জাম","Alat pelindung diri (APD)"],"r":[["h2","لماذا هذا مهم؟","Why is this important?","यह क्यों ज़रूरी है?","এটি কেন গুরুত্বপূর্ণ?","Mengapa ini penting?"],["p","استخدام الملابس وأدوات الحماية الشخصية يحمي العاملين من الإصابات والأمراض المهنية في منشآت الغذاء. هذه الحماية تضمن سلامة العاملين وتحافظ على جودة الغذاء.","Wearing protective clothing and personal protective equipment protects workers from injuries and occupational illness in food establishments. This protection keeps workers safe and keeps food quality intact.","खाद्य प्रतिष्ठानों में सुरक्षात्मक कपड़े और निजी सुरक्षा उपकरण पहनने से कर्मचारी चोट और व्यावसायिक बीमारियों से बचते हैं। इससे कर्मचारियों की सुरक्षा होती है और भोजन की गुणवत्ता बनी रहती है।","খাদ্য প্রতিষ্ঠানে সুরক্ষামূলক পোশাক ও ব্যক্তিগত সুরক্ষা সরঞ্জাম পরলে কর্মী আঘাত ও পেশাগত রোগ থেকে রক্ষা পান। এতে কর্মীদের নিরাপত্তা ও খাবারের মান বজায় থাকে।","Memakai pakaian pelindung dan alat pelindung diri melindungi pekerja dari cedera dan penyakit akibat kerja di usaha pangan. Perlindungan ini menjaga keselamatan pekerja dan mutu makanan."],["li","المعاطف: للحماية من الحرارة المنخفضة. وتستخدم داخل غرف التبريد والتجميد.","Coats: protect from low temperatures. Used inside cold rooms and freezers.","कोट: कम तापमान से बचाव। कोल्ड रूम और फ़्रीज़र के अंदर इस्तेमाल होते हैं।","কোট: নিম্ন তাপমাত্রা থেকে সুরক্ষা। কোল্ড রুম ও ফ্রিজারের ভেতরে ব্যবহৃত।","Jaket: melindungi dari suhu rendah. Dipakai di dalam ruang pendingin dan pembeku."],["li","القفازات: للحماية من المواد الكيميائية، وتستخدم عند التعامل مع مواد التنظيف والتطهير.","Gloves: protect from chemicals, used when handling cleaning and sanitising materials.","दस्ताने: रसायनों से बचाव, सफ़ाई और सैनिटाइज़ करने वाली सामग्री के साथ इस्तेमाल होते हैं।","গ্লাভস: রাসায়নিক থেকে সুরক্ষা, পরিষ্কার ও জীবাণুনাশক উপকরণ ধরার সময় ব্যবহৃত।","Sarung tangan: melindungi dari bahan kimia, dipakai saat menangani bahan pembersih dan sanitasi."],["li","الأقنعة: للحماية من استنشاق الغبار وأبخرة المواد الكيميائية. وتستخدم عند التعامل مع مواد كيميائية في أماكن مغلقة.","Masks: protect from breathing in dust and chemical fumes. Used when handling chemicals in closed areas.","मास्क: धूल और रसायन के धुएँ को साँस में जाने से बचाते हैं। बंद जगहों पर रसायन संभालते समय इस्तेमाल होते हैं।","মাস্ক: ধুলো ও রাসায়নিকের ধোঁয়া শ্বাসে নেওয়া থেকে সুরক্ষা। বদ্ধ জায়গায় রাসায়নিক নিয়ে কাজের সময় ব্যবহৃত।","Masker: melindungi dari menghirup debu dan asap bahan kimia. Dipakai saat menangani bahan kimia di area tertutup."],["li","الأحذية الواقية: لحماية وعزل الأقدام، وتستخدم طوال فترة العمل في بيئات العمل المبللة.","Protective boots: protect and insulate the feet, worn throughout the shift in wet work areas.","सुरक्षात्मक जूते: पैरों की सुरक्षा और बचाव, गीले कार्य क्षेत्र में पूरी शिफ़्ट के दौरान पहने जाते हैं।","সুরক্ষামূলক বুট: পায়ের সুরক্ষা ও অন্তরণ, ভেজা কর্মস্থলে পুরো শিফ্টে পরা হয়।","Sepatu pelindung: melindungi dan mengisolasi kaki, dipakai sepanjang shift di area kerja basah."],["li","المرايل المعدنية: لحماية القسم الأسفل من الجسم من الجروح، وتستعمل عند استعمال أدوات حادة مثل منشار اللحوم الكهربائي.","Metal aprons: protect the lower part of the body from cuts, used when using sharp tools such as electric meat saws.","धातु का एप्रन: शरीर के निचले हिस्से को कटने से बचाता है, धारदार औज़ार जैसे बिजली की मीट आरी के इस्तेमाल में पहना जाता है।","ধাতব অ্যাপ্রন: শরীরের নিচের অংশকে কাটা থেকে রক্ষা করে, বৈদ্যুতিক মাংস-করাতের মতো ধারালো যন্ত্র ব্যবহারে পরা হয়।","Celemek logam: melindungi bagian bawah tubuh dari luka sayat, dipakai saat memakai alat tajam seperti gergaji daging listrik."],["li","القفازات المقاومة للحرارة: للحماية من الحروق، تستخدم عند التعامل مع الأواني والمعدات الساخنة في أماكن الطهي الساخن.","Heat-resistant gloves: protect from burns, used when handling hot pots and equipment in hot cooking areas.","गर्मी-रोधी दस्ताने: जलन से बचाव, गर्म खाना पकाने की जगह पर गर्म बर्तन और उपकरण संभालते समय।","তাপ-প্রতিরোধী গ্লাভস: পোড়া থেকে সুরক্ষা, গরম রান্নার জায়গায় গরম পাত্র ও যন্ত্র ধরার সময়।","Sarung tangan tahan panas: melindungi dari luka bakar, dipakai saat memegang panci dan peralatan panas di area masak."],["h3","مسؤولياتنا تجاه أدوات الحماية الشخصية:","Our responsibilities for personal protective equipment:","निजी सुरक्षा उपकरणों के प्रति हमारी ज़िम्मेदारियाँ:","ব্যক্তিগত সুরক্ষা সরঞ্জামের প্রতি আমাদের দায়িত্ব:","Tanggung jawab kita terhadap alat pelindung diri:"],["li","الاستخدام الصحيح: الالتزام بتعليمات استخدام الأدوات.","Correct use: follow the instructions for using the equipment.","सही उपयोग: उपकरण इस्तेमाल के निर्देशों का पालन करें।","সঠিক ব্যবহার: সরঞ্জাম ব্যবহারের নির্দেশনা মেনে চলুন।","Penggunaan yang benar: ikuti petunjuk pemakaian alat."],["li","التأكد من الصلاحية: فحص الأدوات قبل كل استخدام.","Check it is in good condition: inspect the equipment before every use.","सही हालत जाँचें: हर उपयोग से पहले उपकरण जाँचें।","ভালো অবস্থা নিশ্চিত করুন: প্রতিবার ব্যবহারের আগে সরঞ্জাম পরীক্ষা করুন।","Pastikan layak pakai: periksa alat sebelum setiap penggunaan."],["li","ارتداء المعدات المناسبة: ارتداء المعدات المناسبة لكل مهمة.","Wear the right equipment: wear suitable equipment for each task.","सही उपकरण पहनें: हर काम के लिए उचित उपकरण पहनें।","সঠিক সরঞ্জাম পরুন: প্রতিটি কাজের জন্য উপযুক্ত সরঞ্জাম পরুন।","Pakai peralatan yang tepat: kenakan peralatan yang sesuai untuk setiap tugas."],["li","الإبلاغ عن التلف: الإبلاغ عن أي عيوب فوراً.","Report damage: report any defects immediately.","क्षति की सूचना दें: कोई भी खराबी तुरंत बताएँ।","ক্ষতির কথা জানান: যেকোনো ত্রুটি তৎক্ষণাৎ জানান।","Laporkan kerusakan: laporkan setiap cacat segera."],["li","تذكير الزملاء: تعزيز ثقافة السلامة بين الزملاء.","Remind colleagues: build a culture of safety among colleagues.","साथियों को याद दिलाएँ: साथियों के बीच सुरक्षा की संस्कृति मज़बूत करें।","সহকর্মীদের মনে করিয়ে দিন: সহকর্মীদের মধ্যে নিরাপত্তার সংস্কৃতি গড়ুন।","Ingatkan rekan: bangun budaya keselamatan di antara rekan kerja."],["li","التخزين السليم: تخزين الأدوات بشكل صحيح بعد الاستخدام.","Proper storage: store equipment correctly after use.","सही भंडारण: इस्तेमाल के बाद उपकरण सही तरीके से रखें।","সঠিক সংরক্ষণ: ব্যবহারের পর সরঞ্জাম ঠিকভাবে রাখুন।","Penyimpanan yang benar: simpan alat dengan benar setelah dipakai."],["li","التصرف السليم في حالة عدم توفر أدوات الحماية الشخصية: إبلاغ المشرف فوراً، وعدم بدء العمل حتى يتم توفير الأدوات المناسبة.","If protective equipment is not available: report to the supervisor immediately, and do not start work until suitable equipment is provided.","अगर सुरक्षा उपकरण उपलब्ध न हों: तुरंत सुपरवाइज़र को बताएँ और उचित उपकरण मिलने तक काम शुरू न करें।","সুরক্ষা সরঞ্জাম না থাকলে: তৎক্ষণাৎ সুপারভাইজারকে জানান, এবং উপযুক্ত সরঞ্জাম না পাওয়া পর্যন্ত কাজ শুরু করবেন না।","Jika alat pelindung tidak tersedia: segera laporkan kepada supervisor, dan jangan mulai bekerja sampai alat yang sesuai tersedia."]]},{"t":["صندوق الإسعافات الأولية","First aid kit","प्राथमिक उपचार बॉक्स","প্রাথমিক চিকিৎসা বাক্স","Kotak P3K"],"r":[["h2","لماذا هذا مهم؟","Why is this important?","यह क्यों ज़रूरी है?","এটি কেন গুরুত্বপূর্ণ?","Mengapa ini penting?"],["p","وجود صندوق إسعافات أولية مجهز وفهم كيفية استخدامه يساعد في التعامل السريع مع الحوادث البسيطة، مما يقلل من مضاعفاتها ويحافظ على سلامة العاملين والعملاء.","Having a well-stocked first aid kit and knowing how to use it helps you deal quickly with minor accidents, which reduces complications and keeps workers and customers safe.","अच्छी तरह भरा प्राथमिक उपचार बॉक्स होना और उसका उपयोग जानना छोटी दुर्घटनाओं से तुरंत निपटने में मदद करता है, जिससे जटिलताएँ कम होती हैं और कर्मचारियों व ग्राहकों की सुरक्षा होती है।","সুসজ্জিত প্রাথমিক চিকিৎসা বাক্স থাকা এবং তা ব্যবহারের নিয়ম জানা ছোটখাটো দুর্ঘটনায় দ্রুত সাড়া দিতে সাহায্য করে, যা জটিলতা কমায় এবং কর্মী ও গ্রাহকদের নিরাপদ রাখে।","Kotak P3K yang lengkap dan pengetahuan cara memakainya membantu Anda menangani kecelakaan kecil dengan cepat, sehingga komplikasi berkurang dan pekerja serta pelanggan tetap aman."],["h3","ما هي محتويات صندوق الإسعافات الأولية؟","What does a first aid kit contain?","प्राथमिक उपचार बॉक्स में क्या होता है?","প্রাথমিক চিকিৎসা বাক্সে কী থাকে?","Apa isi kotak P3K?"],["li","ضمادات لاصقة وضمادات معقمة بأحجام مختلفة.","Adhesive plasters and sterile dressings in different sizes.","अलग-अलग आकार की चिपकने वाली पट्टियाँ और निर्जमित (स्टेराइल) पट्टियाँ।","বিভিন্ন আকারের আঠালো ব্যান্ডেজ ও জীবাণুমুক্ত ড্রেসিং।","Plester perekat dan kasa steril dalam berbagai ukuran."],["li","ضمادات للحروق.","Dressings for burns.","जलने के लिए पट्टियाँ।","পোড়ার জন্য ড্রেসিং।","Pembalut untuk luka bakar."],["li","أدوات: ملقط، مقص، دبابيس أمان.","Tools: tweezers, scissors, safety pins.","औज़ार: चिमटी, कैंची, सेफ़्टी पिन।","সরঞ্জাম: চিমটা, কাঁচি, সেফটি পিন।","Alat: pinset, gunting, peniti pengaman."],["li","مناديل تطهير الجروح.","Wound-cleaning wipes.","घाव साफ़ करने वाले वाइप्स।","ক্ষত পরিষ্কারের ওয়াইপস।","Tisu pembersih luka."],["li","أوراق وقلم رصاص لتسجيل الحوادث.","Paper and pencil for recording accidents.","घटनाएँ दर्ज करने के लिए कागज़ और पेंसिल।","ঘটনা লিপিবদ্ধ করার জন্য কাগজ ও পেন্সিল।","Kertas dan pensil untuk mencatat kecelakaan."],["h3","كيف نتعامل مع صندوق الإسعافات الأولية؟","How do we handle the first aid kit?","प्राथमिक उपचार बॉक्स को कैसे संभालें?","প্রাথমিক চিকিৎসা বাক্স কীভাবে পরিচালনা করবেন?","Bagaimana menangani kotak P3K?"],["li","تعرف على موقع صندوق الإسعافات الأولية في منشأتك.","Know where the first aid kit is in your establishment.","अपने प्रतिष्ठान में प्राथमिक उपचार बॉक्स कहाँ है, यह जानें।","আপনার প্রতিষ্ঠানে প্রাথমিক চিকিৎসা বাক্স কোথায় তা জানুন।","Ketahui lokasi kotak P3K di usaha Anda."],["li","تأكد من أن الصندوق في مكان سهل الوصول إليه.","Make sure the box is in an easy-to-reach place.","सुनिश्चित करें कि बॉक्स आसानी से पहुँच वाली जगह पर हो।","নিশ্চিত করুন বাক্সটি সহজে পৌঁছানোর জায়গায় আছে।","Pastikan kotak berada di tempat yang mudah dijangkau."],["li","راجع محتويات الصندوق بانتظام واطلب تجديد المواد المستهلكة.","Check the box contents regularly and ask for used items to be replaced.","बॉक्स की सामग्री नियमित जाँचें और इस्तेमाल हो चुकी चीज़ें दोबारा माँगें।","বাক্সের উপাদান নিয়মিত দেখুন এবং ব্যবহৃত জিনিস পুনরায় চাইুন।","Periksa isi kotak secara berkala dan minta penggantian bahan yang habis."],["li","تدرب على استخدام محتويات الصندوق بشكل صحيح.","Practise using the box contents correctly.","बॉक्स की सामग्री सही तरीके से इस्तेमाल करने का अभ्यास करें।","বাক্সের উপাদান সঠিকভাবে ব্যবহারের অনুশীলন করুন।","Latih penggunaan isi kotak dengan benar."],["n","تذكر دائماً: معرفة موقع صندوق الإسعافات الأولية وطريقة استخدامه تنقذ الأرواح في الوقت المناسب!","Always remember: knowing where the first aid kit is and how to use it can save lives at the right moment!","हमेशा याद रखें: प्राथमिक उपचार बॉक्स कहाँ है और उसे कैसे इस्तेमाल करना है, यह जानना सही समय पर जान बचा सकता है!","সবসময় মনে রাখুন: প্রাথমিক চিকিৎসা বাক্স কোথায় এবং কীভাবে ব্যবহার করতে হয় জানলে সঠিক সময়ে প্রাণ বাঁচানো যায়!","Ingat selalu: mengetahui lokasi kotak P3K dan cara memakainya dapat menyelamatkan nyawa pada saat yang tepat!"]]},{"t":["قائمة المصطلحات","Glossary","शब्दावली","পরিভাষা","Daftar istilah"],"r":[["li","الاحترافية في العمل: التزام العامل بأداء عمله بأفضل طريقة ممكنة، متضمنًا الالتزام بقواعد العمل والسلامة والنظافة.","Professionalism at work: the worker's commitment to doing their job in the best possible way, including following work, safety and hygiene rules.","कार्य में व्यावसायिकता: कर्मचारी का अपना काम सबसे अच्छे तरीके से करने का संकल्प, जिसमें काम, सुरक्षा और स्वच्छता के नियमों का पालन शामिल है।","কাজে পেশাদারিত্ব: কর্মীর সর্বোত্তম উপায়ে কাজ করার অঙ্গীকার, যার মধ্যে কাজ, নিরাপত্তা ও পরিচ্ছন্নতার নিয়ম মানা অন্তর্ভুক্ত।","Profesionalisme kerja: komitmen pekerja untuk melakukan tugasnya dengan cara terbaik, termasuk mematuhi aturan kerja, keselamatan, dan kebersihan."],["li","التثقيف الصحي: برنامج تدريبي يهدف إلى تعريف العاملين بالأخطار المحتملة في بيئة العمل وكيفية التعامل معها.","Health education: a training programme that aims to make workers aware of possible hazards in the workplace and how to handle them.","स्वास्थ्य शिक्षा: प्रशिक्षण कार्यक्रम जिसका उद्देश्य कर्मचारियों को कार्यस्थल के संभावित खतरों और उनसे निपटने के तरीके से परिचित कराना है।","স্বাস্থ্য শিক্ষা: প্রশিক্ষণ কর্মসূচি যার লক্ষ্য কর্মীদের কর্মস্থলের সম্ভাব্য ঝুঁকি ও তা মোকাবিলার উপায় সম্পর্কে জানানো।","Pendidikan kesehatan: program pelatihan untuk memberi tahu pekerja tentang kemungkinan bahaya di tempat kerja dan cara menanganinya."],["li","الرقابة الصحية: عملية فحص دورية للتأكد من نظافة المكان ومعدات العمل واتباع جميع الإجراءات الصحية.","Health inspection: a regular check to confirm the premises and equipment are clean and all health procedures are followed.","स्वास्थ्य निरीक्षण: नियमित जाँच कि परिसर और उपकरण साफ़ हैं और सभी स्वास्थ्य प्रक्रियाएँ मानी जा रही हैं।","স্বাস্থ্য পরিদর্শন: নিয়মিত পরীক্ষা যে স্থান ও যন্ত্রপাতি পরিষ্কার এবং সব স্বাস্থ্য পদ্ধতি মানা হচ্ছে।","Inspeksi kesehatan: pemeriksaan rutin untuk memastikan tempat dan peralatan bersih serta semua prosedur kesehatan diikuti."],["li","متداولو الغذاء: الأشخاص الذين يتعاملون مباشرة مع الغذاء في عملهم أو يلمسون الأسطح أو الأدوات التي تلامس الغذاء.","Food handlers: people who work directly with food, or touch surfaces or tools that come into contact with food.","खाद्य संभालने वाले: वे लोग जो सीधे भोजन के साथ काम करते हैं या ऐसी सतहों और औज़ारों को छूते हैं जो भोजन के संपर्क में आते हैं।","খাদ্য পরিচালনাকারী: যারা সরাসরি খাবারের সাথে কাজ করেন বা খাবারের সংস্পর্শে আসা তল বা সরঞ্জাম ছোঁন।","Penangan makanan: orang yang bekerja langsung dengan makanan, atau menyentuh permukaan dan alat yang bersentuhan dengan makanan."],["li","الشهادة الصحية: وثيقة تثبت أن حاملها خالٍ من الأمراض المعدية ولا يحمل جراثيم تنتقل عبر الغذاء.","Health certificate: a document proving its holder is free from infectious disease and does not carry germs that spread through food.","स्वास्थ्य प्रमाणपत्र: ऐसा दस्तावेज़ जो साबित करता है कि उसका धारक संक्रामक रोग से मुक्त है और भोजन से फैलने वाले कीटाणु नहीं रखता।","স্বাস্থ্য সনদ: এমন নথি যা প্রমাণ করে ধারক সংক্রামক রোগমুক্ত এবং খাবারের মাধ্যমে ছড়ানো জীবাণু বহন করেন না।","Sertifikat kesehatan: dokumen yang membuktikan pemegangnya bebas penyakit menular dan tidak membawa kuman yang menular melalui makanan."],["li","سلامة الغذاء: ضمان أن الغذاء لن يسبب ضرراً للمستهلك عند إعداده و/أو تناوله وفقاً للاستخدام المقصود.","Food safety: making sure food will not harm the consumer when prepared and/or eaten as intended.","खाद्य सुरक्षा: यह सुनिश्चित करना कि भोजन तैयार करने और/या खाने पर, इच्छित उपयोग के अनुसार, उपभोक्ता को नुकसान न पहुँचाए।","খাদ্য নিরাপত্তা: নিশ্চিত করা যে খাবার প্রস্তুত ও/অথবা উদ্দিষ্টভাবে খেলে ভোক্তার ক্ষতি করবে না।","Keamanan pangan: memastikan makanan tidak membahayakan konsumen saat disiapkan dan/atau dikonsumsi sesuai penggunaan yang dimaksud."],["li","تلوث الغذاء: دخول أي شيء غريب أو ضار إلى الغذاء، سواء كان كيميائياً أو فيزيائياً أو بيولوجياً.","Food contamination: any foreign or harmful thing getting into food, whether chemical, physical or biological.","भोजन संदूषण: किसी बाहरी या हानिकारक चीज़ का भोजन में जाना, चाहे वह रासायनिक, भौतिक या जैविक हो।","খাবার দূষণ: কোনো বাইরের বা ক্ষতিকর বস্তু খাবারে ঢোকা, তা রাসায়নিক, ভৌত বা জৈব যা-ই হোক।","Kontaminasi makanan: masuknya benda asing atau berbahaya ke dalam makanan, baik kimia, fisik, maupun biologis."],["li","السلسلة الغذائية: جميع مراحل إنتاج الغذاء من المزرعة إلى المائدة، بما في ذلك الإنتاج، والتصنيع، والتوزيع، والاستهلاك.","Food chain: all stages of food production from farm to table, including production, processing, distribution and consumption.","खाद्य शृंखला: खेत से थाली तक भोजन उत्पादन के सभी चरण, जिनमें उत्पादन, प्रसंस्करण, वितरण और उपभोग शामिल हैं।","খাদ্য শৃঙ্খল: খামার থেকে থালা পর্যন্ত খাদ্য উৎপাদনের সব ধাপ, যার মধ্যে উৎপাদন, প্রক্রিয়াকরণ, বিতরণ ও ভোগ অন্তর্ভুক্ত।","Rantai pangan: semua tahap produksi pangan dari kebun ke meja makan, termasuk produksi, pengolahan, distribusi, dan konsumsi."],["li","التلوث المباشر: حدوث التلوث عند ملامسة مصدر التلوث للغذاء مباشرة.","Direct contamination: contamination that happens when the source touches the food directly.","प्रत्यक्ष संदूषण: जब संदूषण का स्रोत सीधे भोजन को छूता है तब होने वाला संदूषण।","সরাসরি দূষণ: দূষণের উৎস সরাসরি খাবার স্পর্শ করলে যে দূষণ ঘটে।","Kontaminasi langsung: kontaminasi yang terjadi saat sumber pencemar menyentuh makanan secara langsung."],["li","التلوث الخلطي (غير المباشر): انتقال المواد الضارة أو الأحياء الدقيقة إلى الغذاء الجاهز للتقديم عن طريق اليدين والأسطح الملامسة للغذاء والمعدات التي تكون متسخة وتلامس الغذاء الخام ثم تلامس الغذاء الجاهز للتقديم، كما يشمل ملامسة الغذاء الخام أو السائل الناجم عنه للغذاء الجاهز للتقديم.","Cross-contamination (indirect): harmful substances or microbes moving to ready-to-serve food through hands, food-contact surfaces and equipment that were dirty, touched raw food and then touched ready-to-serve food. It also includes raw food or the liquid from it touching ready-to-serve food.","क्रॉस-संदूषण (अप्रत्यक्ष): हानिकारक पदार्थ या सूक्ष्मजीव हाथों, भोजन के संपर्क की सतहों और गंदे उपकरणों के ज़रिए परोसने के लिए तैयार भोजन तक पहुँचना, जो पहले कच्चे भोजन को छूकर फिर तैयार भोजन को छू गए हों। इसमें कच्चे भोजन या उससे निकले तरल का तैयार भोजन से छूना भी शामिल है।","ক্রস-দূষণ (পরোক্ষ): হাত, খাবারের সংস্পর্শের তল ও নোংরা যন্ত্র দিয়ে ক্ষতিকর পদার্থ বা অণুজীব পরিবেশনের জন্য প্রস্তুত খাবারে যাওয়া, যা আগে কাঁচা খাবার ছুঁয়েছে। এর মধ্যে কাঁচা খাবার বা তা থেকে গড়ানো তরল প্রস্তুত খাবার স্পর্শ করাও পড়ে।","Kontaminasi silang (tidak langsung): zat berbahaya atau mikroba berpindah ke makanan siap saji melalui tangan, permukaan kontak makanan, dan peralatan kotor yang sebelumnya menyentuh makanan mentah. Termasuk juga makanan mentah atau cairannya yang menyentuh makanan siap saji."],["li","البكتيريا: كائنات حية دقيقة وحيدة الخلية، بعضها مفيد وبعضها ضار ويسبب الأمراض.","Bacteria: tiny single-celled living organisms; some are useful, and some are harmful and cause disease.","बैक्टीरिया: एक-कोशिकीय सूक्ष्म जीव; कुछ लाभदायक हैं और कुछ हानिकारक होकर बीमारी पैदा करते हैं।","ব্যাকটেরিয়া: এককোষী ক্ষুদ্র জীব; কিছু উপকারী, কিছু ক্ষতিকর ও রোগ সৃষ্টি করে।","Bakteri: organisme hidup uniseluler kecil; sebagian bermanfaat dan sebagian berbahaya penyebab penyakit."],["li","الفيروسات: كائنات دقيقة أصغر من البكتيريا، تحتاج لخلايا حية للتكاثر وتسبب الأمراض.","Viruses: microorganisms smaller than bacteria, which need living cells to multiply and cause disease.","वायरस: बैक्टीरिया से छोटे सूक्ष्म जीव, जो बढ़ने के लिए जीवित कोशिकाओं की ज़रूरत रखते हैं और बीमारी पैदा करते हैं।","ভাইরাস: ব্যাকটেরিয়ার চেয়ে ছোট অণুজীব, যা বংশবৃদ্ধির জন্য জীবিত কোষ প্রয়োজন এবং রোগ সৃষ্টি করে।","Virus: mikroorganisme lebih kecil dari bakteri, yang membutuhkan sel hidup untuk berkembang biak dan menyebabkan penyakit."],["li","الفطريات (العفن): كائنات دقيقة تنمو على الغذاء وقد تنتج سموماً ضارة.","Fungi (moulds): microorganisms that grow on food and may produce harmful toxins.","फफूंद (मोल्ड): सूक्ष्म जीव जो भोजन पर उगते हैं और हानिकारक विष पैदा कर सकते हैं।","ছাতা (মোল্ড): অণুজীব যা খাবারে জন্মায় এবং ক্ষতিকর বিষ উৎপন্ন করতে পারে।","Jamur (kapang): mikroorganisme yang tumbuh pada makanan dan dapat menghasilkan racun berbahaya."],["li","الطفيليات: كائنات تعيش على أو داخل كائن حي آخر (المضيف) وتتغذى منه.","Parasites: organisms that live on or inside another living organism (the host) and feed on it.","परजीवी: ऐसे जीव जो किसी अन्य जीवित प्राणी (मेज़बान) पर या अंदर रहते हैं और उससे पोषण लेते हैं।","পরজীবী: যেসব জীব অন্য জীবের (পোষক) ওপরে বা ভেতরে বাস করে ও তা থেকে পুষ্টি নেয়।","Parasit: organisme yang hidup di atas atau di dalam organisme lain (inang) dan mengambil makanan darinya."],["li","منطقة الخطر الحرارية: نطاق درجات الحرارة بين 5°م و63°م حيث تنمو البكتيريا بسرعة.","Temperature danger zone: the temperature range between 5°C and 63°C where bacteria grow quickly.","तापमान खतरे का क्षेत्र: 5°C से 63°C के बीच का तापमान क्षेत्र जहाँ बैक्टीरिया तेज़ी से बढ़ते हैं।","তাপমাত্রার বিপদ অঞ্চল: ৫°সে থেকে ৬৩°সে-এর মধ্যকার তাপমাত্রার পরিসর, যেখানে ব্যাকটেরিয়া দ্রুত বাড়ে।","Zona bahaya suhu: rentang suhu antara 5°C dan 63°C tempat bakteri berkembang biak dengan cepat."],["li","الأغذية عالية الخطورة: أغذية غنية بالبروتين والرطوبة وتسمح بنمو البكتيريا بسرعة إذا لم تُحفظ بشكل صحيح.","High-risk foods: foods rich in protein and moisture that let bacteria grow quickly if not stored properly.","उच्च-जोखिम वाले भोजन: प्रोटीन और नमी से भरपूर भोजन, जिनमें सही भंडारण न होने पर बैक्टीरिया तेज़ी से बढ़ते हैं।","উচ্চ-ঝুঁকির খাবার: প্রোটিন ও আর্দ্রতায় ভরপুর খাবার, যা ঠিকভাবে সংরক্ষণ না করলে ব্যাকটেরিয়া দ্রুত বাড়ে।","Makanan berisiko tinggi: makanan kaya protein dan kelembapan yang memungkinkan bakteri berkembang cepat jika tidak disimpan dengan benar."],["li","التلوث الكيميائي: وجود مواد كيميائية ضارة في الغذاء، مثل مواد التنظيف أو المبيدات.","Chemical contamination: harmful chemicals in food, such as cleaning materials or pesticides.","रासायनिक संदूषण: भोजन में हानिकारक रसायन, जैसे सफ़ाई सामग्री या कीटनाशक।","রাসায়নিক দূষণ: খাবারে ক্ষতিকর রাসায়নিক, যেমন পরিষ্কারক বা কীটনাশক।","Kontaminasi kimia: adanya bahan kimia berbahaya dalam makanan, seperti bahan pembersih atau pestisida."],["li","التلوث الفيزيائي: وجود أجسام غريبة في الغذاء مثل الزجاج أو المعادن أو الشعر.","Physical contamination: foreign objects in food such as glass, metal or hair.","भौतिक संदूषण: भोजन में बाहरी वस्तुएँ, जैसे काँच, धातु या बाल।","ভৌত দূষণ: খাবারে বাইরের বস্তু, যেমন কাঁচ, ধাতু বা চুল।","Kontaminasi fisik: benda asing dalam makanan seperti kaca, logam, atau rambut."],["li","فساد الغذاء: تغير في خصائص الغذاء يجعله غير صالح للاستهلاك الآدمي.","Food spoilage: a change in food's properties that makes it unfit for human consumption.","भोजन का बिगड़ना: भोजन के गुणों में ऐसा बदलाव जिससे वह मनुष्य के खाने योग्य न रहे।","খাবার নষ্ট হওয়া: খাবারের গুণে এমন পরিবর্তন যাতে তা মানুষের খাওয়ার অযোগ্য হয়।","Pembusukan makanan: perubahan sifat makanan yang membuatnya tidak layak dikonsumsi manusia."],["li","التسمم الغذائي: مرض ينتج عن تناول غذاء ملوث بالبكتيريا أو السموم.","Food poisoning: illness caused by eating food contaminated with bacteria or toxins.","खाद्य विषाक्तता: बैक्टीरिया या विषों से दूषित भोजन खाने से होने वाली बीमारी।","খাদ্যে বিষক্রিয়া: ব্যাকটেরিয়া বা বিষে দূষিত খাবার খাওয়ার ফলে হওয়া অসুখ।","Keracunan makanan: penyakit yang disebabkan memakan makanan yang tercemar bakteri atau racun."],["li","الأمراض المنقولة عن طريق الغذاء: أمراض تسببها كائنات دقيقة تنتقل عبر الغذاء والمياه.","Foodborne illnesses: diseases caused by microorganisms that spread through food and water.","खाद्यजनित रोग: सूक्ष्म जीवों द्वारा होने वाली बीमारियाँ जो भोजन और पानी से फैलती हैं।","খাদ্যবাহিত রোগ: খাবার ও পানির মাধ্যমে ছড়ানো অণুজীবের কারণে হওয়া রোগ।","Penyakit bawaan pangan: penyakit yang disebabkan mikroorganisme yang menyebar melalui makanan dan air."],["li","حساسية الغذاء: ردة فعل سلبية من الجهاز المناعي في جسم الإنسان تجاه بعض الأغذية، مما قد يسبب أعراضاً جانبية حساسة للمرضى، ولا يوجد علاج لمرضى حساسية إلا بتجنب الأغذية المسببة لها وفقاً للائحة SFDA FD 2506 الإفصاح عن مسببات الحساسية في قائمة وجبات المنشآت الغذائية التي تقدم الطعام خارج المنزل.","Food allergy: a negative reaction from the body's immune system to certain foods, which can cause serious side effects in patients. The only treatment is avoiding the foods that cause it. Under SFDA regulation FD 2506, allergens must be disclosed on the menus of food establishments that serve meals outside the home.","खाद्य एलर्जी: शरीर की प्रतिरक्षा प्रणाली की कुछ खाद्य पदार्थों के प्रति नकारात्मक प्रतिक्रिया, जिससे गंभीर दुष्प्रभाव हो सकते हैं। इसका एकमात्र उपाय उन खाद्य पदार्थों से बचना है। SFDA विनियम FD 2506 के तहत, घर से बाहर भोजन परोसने वाले प्रतिष्ठानों के मेनू पर एलर्जन बताना ज़रूरी है।","খাদ্য অ্যালার্জি: শরীরের রোগ-প্রতিরোধ ব্যবস্থার কিছু খাবারের প্রতি নেতিবাচক প্রতিক্রিয়া, যা রোগীদের গুরুতর প্রতিক্রিয়া ঘটাতে পারে। এর একমাত্র চিকিৎসা হলো ওই খাবার এড়িয়ে চলা। SFDA বিধি FD 2506 অনুযায়ী বাইরে খাবার পরিবেশনকারী প্রতিষ্ঠানের মেনুতে অ্যালার্জেন উল্লেখ করা বাধ্যতামূলক।","Alergi makanan: reaksi negatif sistem kekebalan tubuh terhadap makanan tertentu yang dapat menimbulkan efek samping serius. Satu-satunya pengobatan adalah menghindari makanan penyebabnya. Berdasarkan regulasi SFDA FD 2506, alergen harus dicantumkan di menu usaha pangan yang menyajikan makanan di luar rumah."],["li","النظافة الشخصية: مجموعة من الممارسات الصحية التي يتبعها الفرد للحفاظ على نظافته وصحته.","Personal hygiene: a set of healthy habits a person follows to keep clean and healthy.","व्यक्तिगत स्वच्छता: स्वस्थ आदतों का समूह जिन्हें व्यक्ति साफ़ और स्वस्थ रहने के लिए अपनाता है।","ব্যক্তিগত পরিচ্ছন্নতা: পরিষ্কার ও সুস্থ থাকার জন্য ব্যক্তির অনুসরণ করা স্বাস্থ্যকর অভ্যাসের সমষ্টি।","Kebersihan pribadi: sekumpulan kebiasaan sehat yang diikuti seseorang untuk menjaga kebersihan dan kesehatannya."],["li","التنظيف والتطهير: عمليات متتالية لإزالة الأوساخ والمنظفات ومكافحة الميكروبات على الأسطح والمعدات.","Cleaning and sanitising: a series of steps to remove dirt and detergents and control microbes on surfaces and equipment.","सफ़ाई और सैनिटाइज़ेशन: गंदगी और डिटर्जेंट हटाने और सतहों व उपकरणों पर सूक्ष्मजीवों को नियंत्रित करने के लिए क्रमिक चरण।","পরিষ্কার ও জীবাণুমুক্তকরণ: তল ও যন্ত্রের ময়লা ও ডিটারজেন্ট দূর এবং জীবাণু নিয়ন্ত্রণের ধারাবাহিক ধাপ।","Pembersihan dan sanitasi: serangkaian langkah untuk menghilangkan kotoran dan deterjen serta mengendalikan mikroba pada permukaan dan peralatan."],["li","مكافحة الآفات: إجراءات لمنع دخول الحشرات والقوارض وانتشارها.","Pest control: measures to prevent insects and rodents from entering and spreading.","कीट नियंत्रण: कीड़ों और चूहों को घुसने और फैलने से रोकने के उपाय।","কীটপতঙ্গ নিয়ন্ত্রণ: পোকামাকড় ও ইঁদুরের প্রবেশ ও বিস্তার রোধের ব্যবস্থা।","Pengendalian hama: langkah mencegah masuk dan menyebarnya serangga dan hewan pengerat."],["li","الاشتراطات العامة لمنشآت الغذاء: المتطلبات الأساسية للمباني والمعدات في منشآت الغذاء لضمان سلامة الغذاء.","General requirements for food establishments: the basic requirements for buildings and equipment in food establishments to ensure food safety.","खाद्य प्रतिष्ठानों की सामान्य आवश्यकताएँ: भोजन की सुरक्षा सुनिश्चित करने के लिए प्रतिष्ठान की इमारत और उपकरणों की बुनियादी शर्तें।","খাদ্য প্রতিষ্ঠানের সাধারণ প্রয়োজনীয়তা: খাদ্য নিরাপত্তা নিশ্চিত করতে প্রতিষ্ঠানের ভবন ও যন্ত্রপাতির মৌলিক শর্ত।","Persyaratan umum usaha pangan: persyaratan dasar bangunan dan peralatan di usaha pangan untuk menjamin keamanan pangan."],["li","التداول الآمن للغذاء: ممارسات تضمن سلامة الغذاء خلال جميع مراحل إعداده وتقديمه.","Safe food handling: practices that keep food safe through all stages of preparation and serving.","सुरक्षित खाद्य संभाल: ऐसी पद्धतियाँ जो तैयारी और परोसने के सभी चरणों में भोजन को सुरक्षित रखें।","নিরাপদ খাদ্য পরিচালনা: এমন পদ্ধতি যা প্রস্তুতি ও পরিবেশনের সব ধাপে খাবার নিরাপদ রাখে।","Penanganan pangan yang aman: praktik yang menjaga makanan tetap aman di semua tahap persiapan dan penyajian."],["li","الصحة والسلامة في أماكن العمل: إجراءات وممارسات تهدف إلى حماية العاملين من الإصابات والأمراض المهنية.","Health and safety at work: procedures and practices aimed at protecting workers from injuries and occupational illness.","कार्यस्थल पर स्वास्थ्य और सुरक्षा: ऐसी प्रक्रियाएँ और पद्धतियाँ जो कर्मचारियों को चोट और व्यावसायिक बीमारियों से बचाएँ।","কর্মস্থলে স্বাস্থ্য ও নিরাপত্তা: কর্মীদের আঘাত ও পেশাগত রোগ থেকে রক্ষার পদ্ধতি ও অনুশীলন।","Kesehatan dan keselamatan di tempat kerja: prosedur dan praktik untuk melindungi pekerja dari cedera dan penyakit akibat kerja."],["li","أدوات الحماية الشخصية: معدات يرتديها العاملون لحماية أنفسهم من المخاطر في بيئة العمل.","Personal protective equipment: equipment workers wear to protect themselves from hazards in the work environment.","निजी सुरक्षा उपकरण: ऐसे उपकरण जिन्हें कर्मचारी कार्य वातावरण के खतरों से खुद को बचाने के लिए पहनते हैं।","ব্যক্তিগত সুরক্ষা সরঞ্জাম: কর্মস্থলের ঝুঁকি থেকে নিজেকে রক্ষায় কর্মীদের পরা সরঞ্জাম।","Alat pelindung diri: peralatan yang dikenakan pekerja untuk melindungi diri dari bahaya di lingkungan kerja."],["li","صندوق الإسعافات الأولية: حاوية تحتوي على مستلزمات طبية أساسية للتعامل مع الإصابات البسيطة في مكان العمل.","First aid kit: a container with basic medical supplies for dealing with minor i function noteIcon() {
  const k = CHAPTER_ICON[studyChap] || 'book';
  return `<div class="note-icon" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${NOTE_ICONS[k]}</svg></div>`;
}
const NOTE_IDX = { ar: 1, en: 2, hi: 3, bn: 4, id: 5 };
const NOTE_TITLE_IDX = { ar: 0, en: 1, hi: 2, bn: 3, id: 4 };
let studyChap = 0;
function showStudy() {
  if (!studyLang) studyLang = lang;
  renderStudy();
  showScreen('study');
  window.scrollTo(0, 0);
}
function noteText(row, L) { return escHtml(row[NOTE_IDX[L]]); }
function renderNoteRow(row, L) {
  const t = row[0], txt = noteText(row, L), dir = ' dir="auto"';
  if (t === 'h2') return `<h3 class="note-h2"${dir}>${txt}</h3>`;
  if (t === 'h3') return `<h4 class="note-h3"${dir}>${txt}</h4>`;
  if (t === 'n') return `<div class="note-callout"${dir}>${txt}</div>`;
  return `<p class="note-p"${dir}>${txt}</p>`; // p
}
function renderNoteBlock(chap, L) {
  // groups consecutive li rows into one list
  let out = '', inList = false;
  for (const row of chap.r) {
    if (row[0] === 'li') {
      if (!inList) { out += '<ul class="note-ul">'; inList = true; }
      out += `<li dir="auto">${noteText(row, L)}</li>`;
    } else {
      if (inList) { out += '</ul>'; inList = false; }
      out += renderNoteRow(row, L);
    }
  }
  if (inList) out += '</ul>';
  return out;
}
function renderStudy() {
  const chipDefs = [['all', STUDY_T[lang].all], ...REV_LANGS];
  document.getElementById('study-chips').innerHTML = chipDefs.map(([L, name]) =>
    `<button class="lang-btn${(studyLang === L) ? ' active' : ''}" data-sl="${L}">${escHtml(name)}</button>`).join('');
  document.querySelectorAll('#study-chips [data-sl]').forEach(b =>
    b.addEventListener('click', () => { studyLang = b.dataset.sl; renderStudy(); }));

  const titleL = studyLang === 'all' ? 'ar' : studyLang;
  const opts = STUDY_NOTES.map((c, i) =>
    `<option value="${i}"${i === studyChap ? ' selected' : ''}>${i + 1}. ${escHtml(c.t[NOTE_TITLE_IDX[titleL]])}</option>`).join('');
  const nav = `<div class="note-nav">` +
    `<button class="btn btn-secondary btn-small" id="note-prev"${studyChap === 0 ? ' disabled' : ''}>${escHtml(STUDY_T[lang].prev)}</button>` +
    `<select id="note-sel" class="note-sel">${opts}</select>` +
    `<button class="btn btn-secondary btn-small" id="note-next"${studyChap >= STUDY_NOTES.length - 1 ? ' disabled' : ''}>${escHtml(STUDY_T[lang].next)}</button>` +
    `</div>`;
  const chap = STUDY_NOTES[studyChap];
  let body;
  if (studyLang === 'all') {
    body = REV_LANGS.map(([L, name]) =>
      `<section class="note-lang-sec"><div class="rev-lbl">${escHtml(name)}</div>${noteIcon()}<h2 class="note-title" dir="auto">${escHtml(chap.t[NOTE_TITLE_IDX[L]])}</h2>${renderNoteBlock(chap, L)}</section>`).join('');
  } else {
    body = `${noteIcon()}<h2 class="note-title" dir="auto">${escHtml(chap.t[NOTE_TITLE_IDX[studyLang]])}</h2>${renderNoteBlock(chap, studyLang)}`;
  }
  document.getElementById('study-body').innerHTML =
    `<div class="card note-wrap">${nav}<div class="note-content">${body}</div></div>`;
  const go = i => { studyChap = Math.max(0, Math.min(STUDY_NOTES.length - 1, i)); renderStudy(); window.scrollTo(0, 0); };
  document.getElementById('note-sel').addEventListener('change', e => go(+e.target.value));
  document.getElementById('note-prev').addEventListener('click', () => go(studyChap - 1));
  document.getElementById('note-next').addEventListener('click', () => go(studyChap + 1));
}
