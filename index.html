HACCP system.", "कर्मचारी प्रशिक्षण: कर्मचारियों को सामान्य स्वास्थ्य व स्वच्छता सिद्धांतों और HACCP प्रणाली के उपयोग का प्रशिक्षण देना।", "কর্মী প্রশিক্ষণ: কর্মীদের সাধারণ স্বাস্থ্য ও পরিচ্ছন্নতার নীতি এবং HACCP ব্যবস্থা প্রয়োগে প্রশিক্ষণ দেওয়া।", "Pelatihan pekerja: melatih pekerja tentang prinsip kesehatan dan kebersihan umum serta penerapan sistem HACCP.", "कर्मचारी तालिम: कामदारलाई सामान्य स्वास्थ्य र सरसफाइका सिद्धान्त र HACCP प्रणालीको प्रयोगमा तालिम दिनु।"], ["li", "التعامل مع شكاوى العملاء: وضع آلية لاستقبال ومعالجة شكاوى العملاء المتعلقة بجودة الغذاء.", "Handling customer complaints: setting up a system to receive and deal with customer complaints about food quality.", "ग्राहक शिकायतें: भोजन की गुणवत्ता से जुड़ी ग्राहक शिकायतें प्राप्त करने और उनका समाधान करने की व्यवस्था बनाना।", "গ্রাহক অভিযোগ: খাবারের মান সংক্রান্ত গ্রাহক অভিযোগ গ্রহণ ও নিষ্পত্তির ব্যবস্থা তৈরি।", "Penanganan keluhan pelanggan: menyiapkan mekanisme untuk menerima dan menangani keluhan pelanggan tentang kualitas makanan.", "ग्राहक गुनासो ह्यान्डल गर्नु: खानाको गुणस्तरबारे ग्राहकका गुनासो प्राप्त गर्ने र सम्बोधन गर्ने प्रणाली बनाउनु।"], ["li", "تتبع المنتجات وسحبها: توفير نظام لتتبع المنتجات وسحبها عند الضرورة للحفاظ على سلامة المستهلكين.", "Product tracing and recall: providing a system to trace products and recall them when necessary to protect consumers.", "उत्पाद ट्रेसिंग और वापसी: ज़रूरत पड़ने पर उत्पादों को ट्रेस करने और वापस मँगाने की व्यवस्था, ताकि उपभोक्ता सुरक्षित रहें।", "পণ্য ট্রেসিং ও প্রত্যাহার: প্রয়োজনে ভোক্তাদের নিরাপত্তায় পণ্য ট্রেস ও প্রত্যাহারের ব্যবস্থা রাখা।", "Penelusuran dan penarikan produk: menyediakan sistem untuk melacak dan menarik produk bila diperlukan demi keselamatan konsumen.", "उत्पादन ट्रेसिङ र फिर्ता: उपभोक्ता सुरक्षाका लागि उत्पादन ट्रेस गर्ने र आवश्यक परेमा फिर्ता लिने प्रणाली दिनु।"], ["li", "إدارة الزوار والمقاولين: وضع ضوابط لزيارة المنشأة من قبل الأفراد غير العاملين بها.", "Visitor and contractor management: setting rules for visits to the establishment by people who do not work there.", "आगंतुक और ठेकेदार प्रबंधन: प्रतिष्ठान में बाहरी लोगों के आने-जाने के लिए नियम बनाना।", "দর্শনার্থী ও ঠিকাদার ব্যবস্থাপনা: যারা প্রতিষ্ঠানে কাজ করেন না তাদের পরিদর্শনের নিয়ম তৈরি।", "Pengelolaan pengunjung dan kontraktor: menetapkan aturan kunjungan ke usaha oleh orang yang bukan pekerja di sana.", "आगन्तुक र ठेकेदार व्यवस्थापन: त्यहाँ काम नगर्ने मानिसहरूले प्रतिष्ठानमा भ्रमण गर्दा नियम तोक्नु।"]]}, {"t": ["نظام الهاسب: عملية من 12 خطوة", "HACCP system: a 12-step process", "HACCP प्रणाली: 12 चरणों की प्रक्रिया", "HACCP ব্যবস্থা: ১২ ধাপের প্রক্রিয়া", "Sistem HACCP: proses 12 langkah", "HACCP प्रणाली: 12 चरणको प्रक्रिया"], "r": [["p", "بعد تطبيق الإجراءات الأساسية، يمكن تنفيذ نظام الهاسب من خلال 12 خطوة (الخطوات 6-12 تعرف بالمبادئ السبعة للنظام):", "After the prerequisites are in place, HACCP can be implemented through 12 steps (steps 6–12 are known as the seven principles of the system):", "पूर्वापेक्षाएँ लागू होने के बाद, HACCP को 12 चरणों में लागू किया जा सकता है (चरण 6–12 प्रणाली के सात सिद्धांत कहलाते हैं):", "পূর্বশর্ত প্রতিষ্ঠিত হওয়ার পর HACCP ১২টি ধাপে বাস্তবায়ন করা যায় (৬–১২ নম্বর ধাপগুলো ব্যবস্থার সাতটি নীতি নামে পরিচিত):", "Setelah prasyarat terpenuhi, HACCP dapat diterapkan melalui 12 langkah (langkah 6–12 dikenal sebagai tujuh prinsip sistem):", "पूर्वशर्तहरू तयार भएपछि, HACCP 12 चरणमार्फत लागू गर्न सकिन्छ (चरण 6–12 लाई प्रणालीका सात सिद्धान्त भनिन्छ):"], ["li", "1. تشكيل فريق الهاسب: يضم أعضاء من مختلف مستويات المسؤولية ومجالات العمل.", "1. Form the HACCP team: includes members from different levels of responsibility and work areas.", "1. HACCP टीम बनाएँ: इसमें जिम्मेदारी के विभिन्न स्तरों और कार्य क्षेत्रों के सदस्य शामिल हों।", "১. HACCP দল গঠন: দায়িত্বের বিভিন্ন স্তর ও কাজের ক্ষেত্রের সদস্য অন্তর্ভুক্ত।", "1. Membentuk tim HACCP: beranggotakan orang dari berbagai tingkat tanggung jawab dan bidang kerja.", "1. HACCP टोली गठन गर्नुहोस्: विभिन्न जिम्मेवारी तह र कामका क्षेत्रका सदस्य समावेश गर्नुहोस्।"], ["li", "2. وصف المنتج: معرفة المكونات، طريقة التحضير، ظروف التخزين، ومدة الصلاحية.", "2. Describe the product: know the ingredients, how it is prepared, storage conditions and shelf life.", "2. उत्पाद का वर्णन: सामग्री, तैयारी का तरीका, भंडारण की स्थिति और शेल्फ़ लाइफ़ जानें।", "২. পণ্যের বর্ণনা: উপাদান, প্রস্তুতির পদ্ধতি, সংরক্ষণের অবস্থা ও মেয়াদকাল জানা।", "2. Mendeskripsikan produk: mengetahui bahan, cara penyiapan, kondisi penyimpanan dan masa simpan.", "2. उत्पादनको वर्णन गर्नुहोस्: सामग्री, तयारी तरिका, भण्डारण अवस्था र म्याद थाहा पाउनुहोस्।"], ["li", "3. تحديد الاستخدام المقصود: معرفة المستهلكين المحتملين وكيفية استخدامهم للمنتج.", "3. Identify the intended use: know the likely consumers and how they will use the product.", "3. इच्छित उपयोग तय करें: संभावित उपभोक्ताओं और उनके उत्पाद के उपयोग के तरीके को जानें।", "৩. উদ্দিষ্ট ব্যবহার নির্ধারণ: সম্ভাব্য ভোক্তা ও তারা পণ্যটি কীভাবে ব্যবহার করবে তা জানা।", "3. Menentukan penggunaan yang dimaksud: mengetahui calon konsumen dan cara mereka menggunakan produk.", "3. अभिप्रेत प्रयोग पहिचान गर्नुहोस्: सम्भावित उपभोक्ता र तिनीहरूले उत्पादन कसरी प्रयोग गर्छन् थाहा पाउनुहोस्।"], ["li", "4. إنشاء مخطط تدفق العمليات: يشمل جميع مراحل إنتاج الغذاء من شراء المواد الخام حتى البيع أو الاستهلاك.", "4. Draw a process flow diagram: covers all stages of production from buying raw materials to sale or consumption.", "4. प्रक्रिया प्रवाह आरेख बनाएँ: कच्चा माल खरीदने से लेकर बिक्री या उपभोग तक के सभी चरण शामिल करें।", "৪. প্রক্রিয়া প্রবাহ চিত্র তৈরি: কাঁচামাল কেনা থেকে বিক্রি বা ভোগ পর্যন্ত উৎপাদনের সব ধাপ অন্তর্ভুক্ত।", "4. Membuat diagram alur proses: mencakup semua tahap produksi dari pembelian bahan mentah hingga penjualan atau konsumsi.", "4. प्रक्रिया प्रवाह चित्र बनाउनुहोस्: कच्चा पदार्थ खरिददेखि बिक्री वा उपभोगसम्मका उत्पादनका सबै चरण समेट्नुहोस्।"], ["li", "5. التأكد من صحة مخطط تدفق العمليات في الموقع: للتحقق من مطابقة المخطط للواقع.", "5. Verify the process flow diagram on site: to confirm the diagram matches what really happens.", "5. प्रवाह आरेख को मौके पर जाँचें: यह सुनिश्चित करने के लिए कि आरेख वास्तविकता से मेल खाता है।", "৫. ঘটনাস্থলে প্রবাহ চিত্র যাচাই: চিত্রটি বাস্তবের সাথে মিলছে কি না তা নিশ্চিত করা।", "5. Memverifikasi diagram alur di lokasi: memastikan diagram sesuai dengan kenyataan.", "5. प्रक्रिया प्रवाह चित्र स्थलमै प्रमाणित गर्नुहोस्: चित्र वास्तविकतासँग मेल खान्छ कि पक्का गर्न।"], ["li", "6. إجراء تحليل المخاطر: تحديد المخاطر المحتملة وتقييمها ووضع إجراءات التحكم.", "6. Conduct a hazard analysis: identify and assess potential hazards and set control measures.", "6. खतरा विश्लेषण करें: संभावित खतरों की पहचान, मूल्यांकन और नियंत्रण उपाय तय करें।", "৬. বিপদ বিশ্লেষণ: সম্ভাব্য বিপদ চিহ্নিত, মূল্যায়ন ও নিয়ন্ত্রণ ব্যবস্থা ঠিক করা।", "6. Melakukan analisis bahaya: mengidentifikasi dan menilai bahaya potensial serta menetapkan tindakan pengendalian.", "6. खतरा विश्लेषण गर्नुहोस्: सम्भावित खतरा पहिचान र मूल्याङ्कन गर्नुहोस्, र नियन्त्रण उपाय तोक्नुहोस्।"], ["li", "7. تحديد نقاط التحكم الحرجة: النقاط التي يجب التحكم فيها لضمان سلامة الغذاء.", "7. Identify critical control points: the points that must be controlled to keep food safe.", "7. महत्वपूर्ण नियंत्रण बिंदु तय करें: वे बिंदु जिन पर भोजन की सुरक्षा के लिए नियंत्रण ज़रूरी है।", "৭. সংকটপূর্ণ নিয়ন্ত্রণ বিন্দু নির্ধারণ: যে বিন্দুগুলো খাবারের নিরাপত্তার জন্য নিয়ন্ত্রণ করতে হবে।", "7. Menentukan titik kendali kritis: titik yang harus dikendalikan untuk menjaga keamanan pangan.", "7. महत्त्वपूर्ण नियन्त्रण बिन्दु पहिचान गर्नुहोस्: खाना सुरक्षित राख्न नियन्त्रण गर्नुपर्ने बिन्दु।"], ["li", "8. وضع الحدود الحرجة: تحديد المستويات المقبولة لكل نقطة تحكم حرجة.", "8. Set critical limits: define the acceptable levels for each critical control point.", "8. महत्वपूर्ण सीमाएँ तय करें: हर महत्वपूर्ण नियंत्रण बिंदु के लिए स्वीकार्य स्तर तय करें।", "৮. সংকটপূর্ণ সীমা নির্ধারণ: প্রতিটি সংকটপূর্ণ নিয়ন্ত্রণ বিন্দুর গ্রহণযোগ্য মাত্রা ঠিক করা।", "8. Menetapkan batas kritis: menentukan tingkat yang dapat diterima untuk setiap titik kendali kritis.", "8. महत्त्वपूर्ण सीमा तोक्नुहोस्: हरेक महत्त्वपूर्ण नियन्त्रण बिन्दुका लागि स्वीकार्य स्तर परिभाषित गर्नुहोस्।"], ["li", "9. إنشاء إجراءات المراقبة: لضمان التحكم في المخاطر وحماية سلامة الغذاء.", "9. Set up monitoring procedures: to make sure hazards are controlled and food safety is protected.", "9. निगरानी प्रक्रियाएँ बनाएँ: खतरों पर नियंत्रण और भोजन की सुरक्षा सुनिश्चित करने के लिए।", "৯. পর্যবেক্ষণ পদ্ধতি তৈরি: বিপদ নিয়ন্ত্রণ ও খাদ্য নিরাপত্তা নিশ্চিত করতে।", "9. Membuat prosedur pemantauan: untuk memastikan bahaya terkendali dan keamanan pangan terjaga.", "9. अनुगमन प्रक्रिया बनाउनुहोस्: खतरा नियन्त्रणमा छन् र खाद्य सुरक्षा सुरक्षित छ भनी पक्का गर्न।"], ["li", "10. تحديد الإجراءات التصحيحية: لمعالجة أي انحراف عن الحدود الحرجة.", "10. Define corrective actions: to deal with any deviation from the critical limits.", "10. सुधारात्मक कार्रवाई तय करें: महत्वपूर्ण सीमाओं से किसी भी विचलन से निपटने के लिए।", "১০. সংশোধনমূলক ব্যবস্থা নির্ধারণ: সংকটপূর্ণ সীমা থেকে যেকোনো বিচ্যুতি মোকাবিলা করতে।", "10. Menetapkan tindakan korektif: untuk menangani setiap penyimpangan dari batas kritis.", "10. सुधारात्मक कार्य परिभाषित गर्नुहोस्: महत्त्वपूर्ण सीमाबाट कुनै विचलन भएमा सम्बोधन गर्न।"], ["li", "11. إنشاء إجراءات التحقق: للتأكد من فعالية نظام الهاسب.", "11. Set up verification procedures: to confirm the HACCP system is working.", "11. सत्यापन प्रक्रियाएँ बनाएँ: यह पुष्टि करने के लिए कि HACCP प्रणाली काम कर रही है।", "১১. যাচাইকরণ পদ্ধতি তৈরি: HACCP ব্যবস্থা কার্যকর কি না তা নিশ্চিত করতে।", "11. Membuat prosedur verifikasi: untuk memastikan sistem HACCP efektif.", "11. प्रमाणीकरण प्रक्रिया बनाउनुहोस्: HACCP प्रणाली काम गरिरहेको छ भनी पुष्टि गर्न।"], ["li", "12. إنشاء نظام للتوثيق وحفظ السجلات: لإثبات تطبيق وصيانة نظام الهاسب.", "12. Set up documentation and record-keeping: to prove the HACCP system is applied and maintained.", "12. दस्तावेज़ीकरण और रिकॉर्ड रखने की व्यवस्था बनाएँ: यह साबित करने के लिए कि HACCP प्रणाली लागू और बनाए रखी जा रही है।", "১২. নথিভুক্তকরণ ও রেকর্ড সংরক্ষণ: HACCP ব্যবস্থা প্রয়োগ ও রক্ষণাবেক্ষণের প্রমাণ রাখতে।", "12. Membuat sistem dokumentasi dan pencatatan: untuk membuktikan sistem HACCP diterapkan dan dipelihara.", "12. कागजात र अभिलेख राख्ने प्रणाली बनाउनुहोस्: HACCP प्रणाली लागू र कायम राखिएको प्रमाणित गर्न।"], ["n", "تذكر دائماً: التسجيل الدقيق لدرجات الحرارة والإجراءات التصحيحية ومراقبة النقاط الحرجة من أهم السجلات التي يجب الاحتفاظ بها وتعبئتها بدقة: سجلات درجات الحرارة (للمواد المستلمة، ووحدات التخزين، والغذاء أثناء الطهي والتبريد).", "Always remember: accurate recording of temperatures, corrective actions and monitoring of critical points are among the most important records to keep and read: temperature logs (for received materials, storage units, food during cooking and cooling).", "हमेशा याद रखें: तापमान, सुधारात्मक कार्रवाई और महत्वपूर्ण बिंदुओं की निगरानी का सटीक रिकॉर्ड सबसे ज़रूरी रिकॉर्ड हैं: तापमान लॉग (प्राप्त सामग्री, भंडारण इकाइयों और पकाने-ठंडा करने के दौरान भोजन के लिए)।", "সবসময় মনে রাখুন: তাপমাত্রা, সংশোধনমূলক ব্যবস্থা ও সংকটপূর্ণ বিন্দু পর্যবেক্ষণের নির্ভুল রেকর্ড সবচেয়ে গুরুত্বপূর্ণ: তাপমাত্রা লগ (গৃহীত উপকরণ, সংরক্ষণ ইউনিট, রান্না ও শীতলীকরণের সময় খাবার)।", "Ingat selalu: pencatatan suhu, tindakan korektif dan pemantauan titik kritis yang akurat adalah catatan terpenting: log suhu (bahan diterima, unit penyimpanan, makanan saat dimasak dan didinginkan).", "सधैं याद राख्नुहोस्: तापक्रम, सुधारात्मक कार्य र महत्त्वपूर्ण बिन्दुको अनुगमनको सही अभिलेख राख्नु सबैभन्दा महत्त्वपूर्ण अभिलेखहरूमध्ये हो: तापक्रम लग (प्राप्त सामग्री, भण्डारण एकाइ, पकाउँदा र चिसो गर्दाको खाना)।"]]}, {"t": ["التداول الآمن للغذاء في منشآت الغذاء", "Safe food handling in food establishments", "खाद्य प्रतिष्ठानों में सुरक्षित खाद्य संभाल", "খাদ্য প্রতিষ্ঠানে নিরাপদ খাদ্য পরিচালনা", "Penanganan pangan yang aman di usaha pangan", "खाद्य प्रतिष्ठानमा सुरक्षित खाना ह्यान्डलिङ"], "r": [["h2", "التداول الآمن للغذاء في منشآت الغذاء", "Safe food handling in food establishments", "खाद्य प्रतिष्ठानों में सुरक्षित खाद्य संभाल", "খাদ্য প্রতিষ্ঠানে নিরাপদ খাদ্য পরিচালনা", "Penanganan pangan yang aman di usaha pangan", "खाद्य प्रतिष्ठानमा सुरक्षित खाना ह्यान्डलिङ"], ["p", "كعامل في منشآت الغذاء، وأيّاً كان دورك، فإن فهمك الكامل لجميع مراحل التداول الآمن للغذاء داخل المنشأة أمر بالغ الأهمية، ومعرفتك بكيفية التداول الآمن للغذاء تساعدك على:", "As a worker in a food establishment, whatever your role, fully understanding every stage of safe food handling inside the establishment is very important. Knowing how to handle food safely helps you to:", "खाद्य प्रतिष्ठान में कर्मचारी के रूप में, आपकी भूमिका जो भी हो, प्रतिष्ठान के भीतर भोजन संभालने के हर चरण को पूरी तरह समझना बहुत ज़रूरी है। सुरक्षित खाद्य संभाल जानने से आप:", "খাদ্য প্রতিষ্ঠানের কর্মী হিসেবে, আপনার ভূমিকা যা-ই হোক, প্রতিষ্ঠানের ভেতরে নিরাপদ খাদ্য পরিচালনার প্রতিটি ধাপ পুরোপুরি বোঝা খুব গুরুত্বপূর্ণ। নিরাপদভাবে খাবার পরিচালনা জানলে আপনি:", "Sebagai pekerja di usaha pangan, apa pun peran Anda, memahami sepenuhnya setiap tahap penanganan pangan yang aman di dalam usaha sangat penting. Mengetahui cara menangani pangan dengan aman membantu Anda untuk:", "खाद्य प्रतिष्ठानको कर्मचारीका रूपमा, तपाईंको जुनसुकै भूमिका भए पनि, प्रतिष्ठानभित्र सुरक्षित खाना ह्यान्डलिङको हरेक चरण पूरा बुझ्नु अत्यन्त महत्त्वपूर्ण छ। खाना सुरक्षित तरिकाले ह्यान्डल गर्न जान्दा तपाईंलाई यी गर्न मद्दत मिल्छ:"], ["li", "ضمان سلامة الغذاء في جميع المراحل لتقديم غذاء صحي وآمن.", "Keep food safe at every stage to serve healthy, safe food.", "हर चरण पर भोजन सुरक्षित रखें ताकि स्वस्थ और सुरक्षित भोजन परोसा जा सके।", "স্বাস্থ্যকর ও নিরাপদ খাবার পরিবেশনের জন্য প্রতিটি ধাপে খাবার নিরাপদ রাখতে।", "Menjaga makanan aman di setiap tahap untuk menyajikan makanan yang sehat dan aman.", "स्वस्थ, सुरक्षित खाना दिन हरेक चरणमा खाना सुरक्षित राख्न।"], ["li", "منع التلوث والأمراض المنقولة بالغذاء من خلال اتباع الإرشادات والإجراءات الصحيحة.", "Prevent contamination and foodborne illness by following the correct guidance and procedures.", "सही दिशानिर्देश और प्रक्रियाएँ अपनाकर संदूषण और खाद्यजनित बीमारियों को रोकना।", "সঠিক নির্দেশনা ও পদ্ধতি অনুসরণ করে দূষণ ও খাদ্যবাহিত রোগ প্রতিরোধ করতে।", "Mencegah kontaminasi dan penyakit bawaan pangan dengan mengikuti panduan dan prosedur yang benar.", "सही निर्देशन र प्रक्रियाहरू पालना गरेर दूषण र खानाजन्य रोग रोक्न।"], ["li", "العمل بكفاءة وفعالية لضمان سلامة سير العمليات وتقليل الأخطاء والمخاطر.", "Work efficiently and effectively to keep operations running smoothly and reduce errors and risks.", "कार्य को कुशलता से करना ताकि संचालन सुचारु रहे और गलतियाँ व जोखिम कम हों।", "দক্ষতা ও কার্যকরভাবে কাজ করে কার্যক্রম সুচারুভাবে চালাতে এবং ভুল ও ঝুঁকি কমাতে।", "Bekerja efisien dan efektif agar operasi lancar serta kesalahan dan risiko berkurang.", "कार्यहरू सुचारु चलाउन र त्रुटि र जोखिम घटाउन प्रभावकारी रूपमा काम गर्न।"], ["p", "على الرغم من اختلاف الأنشطة في منشآت الغذاء (مثل المطاعم، البقالات، بوفيهات، وغيرها)، إلا أن هناك عمليات رئيسية مشتركة لتداول الغذاء في جميع هذه الأنشطة، وهي:", "Although food establishments differ (such as restaurants, grocery shops, buffets and others), all of them share the same main handling steps:", "हालाँकि खाद्य प्रतिष्ठान अलग-अलग होते हैं (जैसे रेस्तराँ, किराना दुकानें, बुफ़े आदि), फिर भी सभी में भोजन संभालने के ये मुख्य चरण समान होते हैं:", "যদিও খাদ্য প্রতিষ্ঠান আলাদা (যেমন রেস্তোরাঁ, মুদি দোকান, বুফে ইত্যাদি), তবু সবগুলোতে খাবার পরিচালনার এই প্রধান ধাপগুলো একই:", "Meskipun usaha pangan berbeda-beda (seperti restoran, toko kelontong, prasmanan dan lainnya), semuanya memiliki tahapan penanganan utama yang sama:", "खाद्य प्रतिष्ठानहरू (जस्तै रेस्टुरेन्ट, किराना पसल, बुफे र अन्य) फरक भए पनि, तिनीहरूका सबैका मुख्य ह्यान्डलिङ चरण उस्तै हुन्छन्:"], ["li", "الشراء والنقل.", "Purchase and transport.", "खरीद और परिवहन।", "ক্রয় ও পরিবহন।", "Pembelian dan pengangkutan.", "खरिद र ढुवानी।"], ["li", "الاستلام والتخزين.", "Receiving and storage.", "प्राप्ति और भंडारण।", "গ্রহণ ও সংরক্ষণ।", "Penerimaan dan penyimpanan.", "प्राप्ति र भण्डारण।"], ["li", "التحضير والإعداد.", "Preparation an "مهارات التخزين والتنظيف (تابع)", "Storage and cleaning skills (continued)", "भंडारण और सफ़ाई कौशल (जारी)", "সংরক্ষণ ও পরিষ্কারের দক্ষতা (চলমান)", "Keterampilan penyimpanan dan pembersihan (lanjutan)", "भण्डारण र सफाइ सीप (जारी)"], "r": [["h3", "مهارة تخزين الأغذية الجافة", "Dry food storage skill", "सूखे भोजन के भंडारण का कौशल", "শুষ্ক খাবার সংরক্ষণের দক্ষতা", "Keterampilan penyimpanan makanan kering", "सुख्खा खाना भण्डारण सीप"], ["p", "ضمان حفظ الأغذية الجافة بشكل آمن لمنع تلوثها أو تلفها والحفاظ على سلامتها وجودتها.", "To keep dry food safely stored to prevent it being contaminated or damaged, and to keep it safe and good quality.", "सूखे भोजन को सुरक्षित रखना ताकि वह दूषित या खराब न हो, और उसकी सुरक्षा व गुणवत्ता बनी रहे।", "শুষ্ক খাবার নিরাপদে রাখা যাতে তা দূষিত বা নষ্ট না হয় এবং নিরাপত্তা ও মান বজায় থাকে।", "Menyimpan makanan kering dengan aman agar tidak terkontaminasi atau rusak, serta menjaga keamanan dan mutunya.", "सुख्खा खाना दूषित वा बिग्रिन नदिन सुरक्षित रूपमा भण्डारण गर्न, र सुरक्षित र राम्रो गुणस्तरको राख्न।"], ["h3", "تهيئة منطقة التخزين", "Preparing the storage area", "भंडारण क्षेत्र तैयार करना", "সংরক্ষণ এলাকা প্রস্তুত করা", "Menyiapkan area penyimpanan", "भण्डारण ठाउँ तयार गर्नु"], ["li", "التأكد من نظافة وجفاف مكان التخزين.", "Make sure the storage place is clean and dry.", "सुनिश्चित करें कि भंडारण स्थान साफ़ और सूखा हो।", "নিশ্চিত করুন সংরক্ষণ স্থান পরিষ্কার ও শুষ্ক।", "Pastikan tempat penyimpanan bersih dan kering.", "भण्डारण ठाउँ सफा र सुक्खा रहेको पक्का गर्नुहोस्।"], ["li", "ضمان التهوية الجيدة ودرجة حرارة مناسبة (أقل من 25 °م).", "Make sure there is good ventilation and a suitable temperature (below 25°C).", "अच्छा वेंटिलेशन और उचित तापमान (25°C से कम) सुनिश्चित करें।", "ভালো বায়ুচলাচল ও উপযুক্ত তাপমাত্রা (২৫°সে-এর নিচে) নিশ্চিত করুন।", "Pastikan ventilasi baik dan suhu sesuai (di bawah 25°C).", "राम्रो भेन्टिलेसन र उपयुक्त तापक्रम (25°C भन्दा कम) रहेको पक्का गर्नुहोस्।"], ["h3", "تنظيم الأغذية", "Organising food", "भोजन को व्यवस्थित कर "t": ["مهارة تفكيك/تسييح الغذاء المجمد", "Thawing frozen food skill", "जमे भोजन को पिघलाने का कौशल", "হিমায়িত খাবার গলানোর দক্ষতা", "Keterampilan mencairkan makanan beku", "जमेको खाना पगाल्ने सीप"], "r": [["p", "ضمان سلامة الغذاء المجمدة عند تفكيكها، مما يقلل من مخاطر التلوث والتسمم ويحافظ على الجودة والتسميم، تفكيك الغذاء بشكل صحيح يضمن وصول الحرارة لجميع أجزائه عند الطهي، مما يمنع بقاء البكتيريا الضارة في الأجزاء الداخلية.", "To keep frozen food safe when thawing, which lowers the risk of contamination and poisoning and keeps quality. Thawing food correctly makes sure heat reaches all parts during cooking, so harmful bacteria do not survive in the inner parts.", "जमे भोजन को पिघलाते समय सुरक्षित रखना, ताकि संदूषण और विषाक्तता का जोखिम कम हो और गुणवत्ता बनी रहे। भोजन को सही तरह पिघलाने से पकाते समय गर्मी उसके हर हिस्से तक पहुँचती है, और अंदर के हिस्सों में हानिकारक बैक्टीरिया नहीं बचते।", "হিমায়িত খাবার গলানোর সময় নিরাপদ রাখা, যাতে দূষণ ও বিষক্রিয়ার ঝুঁকি কমে এবং মান বজায় থাকে। সঠিকভাবে গলালে রান্নার সময় তাপ সব অংশে পৌঁছায়, ফলে ভেতরের অংশে ক্ষতিকর ব্যাকটেরিয়া টিকে থাকে না।", "Menjaga makanan beku tetap aman saat dicairkan, mengurangi risiko kontaminasi dan keracunan serta menjaga mutu. Mencairkan dengan benar memastikan panas mencapai seluruh bagian saat dimasak, sehingga bakteri berbahaya tidak bertahan di bagian dalam.", "जमेको खाना पगाल्दा सुरक्षित राख्न, दूषण र विषाक्तताको जोखिम घटाउन, र गुणस्तर कायम राख्न। खाना सही तरिकाले पगाल्दा पकाउँदा तातो सबै भागमा पुग्छ, ताकि भित्री भागमा हानिकारक जीवाणु बाँच्दैनन्।"], ["h3", "التأكد من تعليمات مصنع الغذاء", "Check the food maker's instructions", "खाद्य निर्माता के निर्देश जाँचें", "খাদ্য প্রস্তুতকারকের নির্দেশনা দেখুন", "Periksa instruksi pabrikan makanan", "खाना बनाउने निर्माताको निर्देशन जाँच गर्नुहोस्"], ["li", "التحقق من تعليمات الشركة المصنعة على العبوة لمعرفة ما إذا كان يمكن طهي الغذاء مباشرة من المجمد أو يجب تفكيكه أولاً.", "Check the manufacturer's instructions on the pack to see if the food can be cooked straight from frozen or must be thawed first.", "पैकेट पर निर्माता के निर्देश देखें कि भोजन सीधे जमे हुए से पकाया जा सकता है या पहले पिघलाना ज़रूरी है।", "প্যাকেটের নির্দেশনা দেখুন, খাবার সরাসরি হিমায়িত অবস্থা থেকে রান্না করা যাবে কি না, নাকি আগে গলাতে হবে।", "Periksa instruksi produsen di kemasan untuk mengetahui apakah makanan bisa langsung dimasak dari beku atau harus dicairkan dulu.", "प्याकमा निर्माताको निर्देशन जाँच गरेर खाना जमेको अवस्थाबाटै पकाउन मिल्छ कि पहिले पगाल्नुपर्छ भनी हेर्नुहोस्।"], ["h3", "التفكيك في الثلاجة", "Thawing in the fridge", "फ्रिज में पिघलाना", "ফ্রিজে গলানো", "Mencairkan di kulkas", "फ्रिजमा पगाल्नु"], ["li", "وضع الغذاء المجمدة في ثلاجة بدرجة حرارة (0-4°م) حتى تذوب بالكامل.", "Place frozen food in a fridge at 0–4°C until fully thawed.", "जमे भोजन को 0–4°C वाले फ्रिज में पूरी तरह पिघलने तक रखें।", "হিমায়িত খাবার ০–৪°সে তাপমাত্রার ফ্রিজে সম্পূর্ণ না গলা পর্যন্ত রাখুন।", "Letakkan makanan beku di kulkas bersuhu 0–4°C hingga benar-benar mencair.", "जमेको खाना पूर्ण रूपमा नपग्लुन्जेल 0–4°C को फ्रिजमा राख्नुहोस्।"], ["li", "وضع الغذاء في مصفاة مغطاة لتجنب التلوث التبادلي مع الأغذية الأخرى.", "Put the food in a covered tray to avoid cross-contamination with other food.", "क्रॉस-संदूषण से बचने के लिए भोजन को ढकी हुई ट्रे में रखें।", "অন্য খাবারের সাথে ক্রস-দূষণ এড়াতে খাবার ঢাকা ট্রেতে রাখুন।", "Letakkan makanan di wadah tertutup untuk menghindari kontaminasi silang dengan makanan lain.", "अन्य खानासँग दूषण रोक्न खाना ढाकिएको ट्रेमा राख्नुहोस्।"], ["h3", "التفكيك باستخدام المايكروويف", "Thawing in a microwave", "माइक्रोवेव में पिघलाना", "মাইক্রোওয়েভে গলানো", "Mencairkan dengan microwave", "माइक्रोवेभमा पगाल्नु"], ["li", "استخدام وضع التفكيك في المايكروويف مع أوعية آمنة، والتأكد من تقليب الغذاء لضمان توزيع الحرارة.", "Use the defrost setting in the microwave with microwave-safe containers, and stir or turn the food to make sure heat is spread evenly.", "माइक्रोवेव में डीफ़्रॉस्ट मोड और माइक्रोवेव-सुरक्षित बर्तन इस्तेमाल करें, और समान गर्मी के लिए भोजन को पलटते रहें।", "মাইক্রোওয়েভে ডিফ্রস্ট মোড ও মাইক্রোওয়েভ-নিরাপদ পাত্র ব্যবহার করুন, এবং তাপ সমানভাবে ছড়াতে খাবার নেড়ে বা উল্টে দিন।", "Gunakan mode defrost pada microwave dengan wadah aman microwave, dan balik atau aduk makanan agar panas merata.", "माइक्रोवेभ-सुरक्षित भाँडोमा माइक्रोवेभको डिफ्रस्ट सेटिङ प्रयोग गर्नुहोस्, र तातो समान रूपमा फैलियोस् भनी खाना चलाउनुहोस् वा घुमाउनुहोस्।"], ["h3", "ما هي معايير تنفيذ المهارة؟", "What are the standards for doing the skill?", "इस कौशल के मानक क्या हैं?", "এই দক্ষতার মানদণ্ড কী?", "Apa standar pelaksanaan keterampilan ini?", "यो सीप गर्ने मापदण्डहरू के हुन्?"], ["li", "استخدام طرق التفكيك الآمنة، عدم تعريض الغذاء لدرجة حرارة الغرفة، عدم تعريض الغذاء للهواء المكشوف أثناء التفكيك.", "Use safe thawing methods, do not leave food at room temperature, and do not expose food to open air during thawing.", "सुरक्षित तरीके अपनाएँ, भोजन को कमरे के तापमान पर न छोड़ें, और पिघलाते समय उसे खुली हवा में न रखें।", "নিরাপদ পদ্ধতি ব্যবহার, খাবার ঘরের তাপমাত্রায় ফেলে না রাখা, এবং গলানোর সময় খোলা বাতাসে না রাখা।", "Gunakan cara mencairkan yang aman, jangan biarkan makanan pada suhu ruang, dan jangan biarkan makanan terpapar udara terbuka.", "सुरक्षित पगाल्ने विधि प्रयोग गर्नुहोस्, खाना कोठाको तापक्रममा नछोड्नुहोस्, र पगाल्दा खुला हावामा नराख्नुहोस्।"], ["li", "اتباع التعليمات الخاصة بالتفكيك على العبوة بدقة.", "Follow the thawing instructions on the pack exactly.", "पैकेट पर दिए पिघलाने के निर्देशों का सटीक पालन करें।", "প্যাকেটের গলানোর নির্দেশনা হুবহু অনুসরণ করুন।", "Ikuti instruksi pencairan pada kemasan dengan tepat.", "प्याकमा दिइएको पगाल्ने निर्देशन ठीक पालना गर्नुहोस्।"], ["li", "حفظ الغذاء في حاويات محكمة الإغلاق وفي درجة حرارة مناسبة.", "Keep food in tightly closed containers at a suitable temperature.", "भोजन को कसकर बंद डिब्बों में और उचित तापमान पर रखें।", "খাবার শক্ত করে বন্ধ পাত্রে ও উপযুক্ত তাপমাত্রায় রাখুন।", "Simpan makanan dalam wadah tertutup rapat pada suhu yang sesuai.", "खाना उपयुक्त तापक्रममा कसेर बन्द भाँडोमा राख्नुहोस्।"], ["n", "تذكر دائماً: لا تترك الغذاء المجمد ليذوب في درجة حرارة الغرفة أبداً؛ فهذا يسمح بنمو البكتيريا بسرعة!", "Always remember: never leave frozen food to thaw at room temperature. This lets bacteria grow quickly!", "हमेशा याद रखें: जमे भोजन को कमरे के तापमान पर कभी न पिघलने दें। इससे बैक्टीरिया तेज़ी से बढ़ते हैं!", "সবসময় মনে রাখুন: হিমায়িত খাবার কখনো ঘরের তাপমাত্রায় গলতে দেবেন না। এতে ব্যাকটেরিয়া দ্রুত বাড়ে!", "Ingat selalu: jangan pernah membiarkan makanan beku mencair pada suhu ruang. Ini membuat bakteri cepat berkembang!", "सधैं याद राख्नुहोस्: जमेको खाना कहिल्यै कोठाको तापक्रममा पग्लन नछोड्नुहोस्। यसले जीवाणु छिटो बढ्न दिन्छ!"]]}, {"t": ["مهارة تنظيف وتطهير الأسطح - طريقة 6 مراحل", "Cleaning and sanitising surfaces – 6-step method", "सतहों की सफ़ाई और सैनिटाइज़ेशन – 6 चरण विधि", "তল পরিষ্কার ও জীবাণুমুক্তকরণ – ৬ ধাপ পদ্ধতি", "Membersihkan dan menyanitasi permukaan – metode 6 langkah", "सतह सफा र कीटाणुरहित गर्ने – 6 चरणको विधि"], "r": [["h3", "ما الغرض من اتقان المهارة؟", "What is the purpose of mastering this skill?", "इस कौशल में निपुणता का उद्देश्य क्या है?", "এই দক্ষতা আয়ত্ত করার উদ্দেশ্য কী?", "Apa tujuan menguasai keterampilan ini?", "यो सीप सिक्नुको उद्देश्य के हो?"], ["p", "ضمان نظافة وتطهير الأسطح (وتشمل الجدران، الأرضيات، وأسطح العمل) لإزالة الأوساخ ومنع انتشار الميكروبات للحفاظ على بيئة صحية في منشآت الغذاء.", "To keep surfaces clean and sanitised (walls, floors and work surfaces) to remove dirt and stop microbes spreading, to keep a healthy environment in food establishments.", "सतहों (दीवारें, फ़र्श और काम की मेज़ें) को साफ़ और सैनिटाइज़ रखना, ताकि गंदगी हटे और सूक्ष्मजीव न फैलें, और खाद्य प्रतिष्ठान में स्वस्थ वातावरण बना रहे।", "তল (দেয়াল, মেঝে ও কাজের টেবিল) পরিষ্কার ও জীবাণুমুক্ত রাখা, ময়লা দূর ও জীবাণু ছড়ানো রোধ করা, যাতে খাদ্য প্রতিষ্ঠানে স্বাস্থ্যকর পরিবেশ থাকে।", "Menjaga permukaan (dinding, lantai, dan meja kerja) tetap bersih dan tersanitasi untuk menghilangkan kotoran dan mencegah penyebaran mikroba, m bagian kebersihan usaha pangan. Meliputi: pembersihan awal, pembersihan utama, pembilasan, penyanitasian, pembilasan akhir (bila perlu), dan pengeringan.", "यो विधि खाद्य प्रतिष्ठानको सफाइ खण्डको \"सफा र कीटाणुरहित गर्ने तरिका\" भागमा वर्णन गरिएको छ। यसमा समावेश छन्: पूर्व-सफाइ, मुख्य सफाइ, पखाला, कीटाणुशोधन, अन्तिम पखाला (आवश्यक परेमा), र हावामा सुकाउने।"], ["h3", "ما هي معايير تنفيذ المهارة؟", "What are the standards for doing the skill?", "इस कौशल के मानक क्या हैं?", "এই দক্ষতার মানদণ্ড কী?", "Apa standar pelaksanaan keterampilan ini?", "यो सीप गर्ने मापदण्डहरू के हुन्?"], ["li", "استخدام المنظفات والمطهرات المناسبة بالتركيز الصحيح.", "Use the right cleaners and sanitisers at the correct strength.", "सही सांद्रता पर उचित क्लीनर और सैनिटाइज़र इस्तेमाल करें।", "সঠিক মাত্রায় উপযুক্ত ক্লিনার ও জীবাণুনাশক ব্যবহার করুন।", "Gunakan pembersih dan sanitasi yang sesuai dengan konsentrasi yang tepat.", "सही सांद्रतामा सही सफाइ र कीटाणुनाशक प्रयोग गर्नुहोस्।"], ["li", "الالتزام بوقت التلامس الموصى به للمطهر.", "Keep to the recommended contact time for the sanitiser.", "सैनिटाइज़र के लिए अनुशंसित संपर्क समय का पालन करें।", "জীবাণুনাশকের নির্দেশিত সংস্পর্শ সময় মেনে চলুন।", "Patuhi waktu kontak yang dianjurkan untuk sanitasi.", "कीटाणुनाशकको सिफारिस गरिएको सम्पर्क समय पालना गर्नुहोस्।"], ["li", "تغطية جميع أجزاء السطح بشكل متساوٍ.", "Cover all parts of the surface evenly.", "सतह के सभी हिस्सों को समान रूप से ढकें।", "তলের সব অংশ সমানভাবে ঢেকে দিন।", "Lapisi semua bagian permukaan secara merata.", "सतहका सबै भाग समान रूपमा ढाक्नुहोस्।"], ["li", "الشطف الجيد لإزالة جميع بقايا المواد الكيميائية.", "Rinse well to remove all chemical residue.", "सभी रासायनिक अवशेष हटाने के लिए अच्छी तरह खंगालें।", "সব রাসায়নিক অবশেষ দূর করতে ভালোভাবে ধুয়ে ফেলুন।", "Bilas dengan baik untuk menghilangkan semua sisa bahan kimia.", "सबै रासायनिक अवशेष हटाउन राम्रोसँग पखाल्नुहोस्।"]]}, {"t": ["مهارة تنظيف وتطهير الأسطح - طريقة 4 مراحل", "Cleaning and sanitising surfaces – 4-step method", "सतहों की ying (drying rack).", "यह विधि खाद्य प्रतिष्ठानों के सफ़ाई भाग में \"तीन-हौज़ सफ़ाई और सैनिटाइज़ेशन\" में समझाई गई है। इसमें शामिल है: प्रारंभिक सफ़ाई (कूड़ेदान), मुख्य धुलाई (पहला हौज़), खंगालना (दूसरा हौज़), सैनिटाइज़ करना (तीसरा हौज़) और सुखाना (सुखाने की रैक)।", "এই পদ্ধতি খাদ্য প্রতিষ্ঠানের পরিচ্ছন্নতা অংশের \"তিন-বেসিন পরিষ্কার ও জীবাণুমুক্তকরণ\" বিভাগে বর্ণিত। এতে রয়েছে: প্রাথমিক পরিষ্কার (ডাস্টবিন), মূল ধোয়া (প্রথম বেসিন), ধুয়ে ফেলা (দ্বিতীয় বেসিন), জীবাণুমুক্তকরণ (তৃতীয় বেসিন) ও শুকানো (শুকানোর র‍্যাক)।", "Metode ini dijelaskan di bagian \"pembersihan dan penyanitasian tiga bak\" dalam bagian kebersihan usaha pangan. Meliputi: pembersihan awal (tempat sampah), pencucian utama (bak pertama), pembilasan (bak kedua), penyanitasian (bak ketiga), dan pengeringan (rak pengering).", "यो विधि खाद्य प्रतिष्ठानको सफाई भागमा \"तीन-हौज सफाई र सेनिटाइजेसन\" खण्डमा बताइएको छ। यसमा समावेश छ: प्रारम्भिक सफाई (फोहोर भाँडो), मुख्य धुने (पहिलो हौज), पखाल्ने (दोस्रो हौज), सेनिटाइज गर्ने (तेस्रो हौज) र सुकाउने (सुकाउने र्याक)।"], ["h3", "ما هي معايير تنفيذ المهارة؟", "What are the standards for doing the skill?", "इस कौशल के मानक क्या हैं?", "এই দক্ষতার মানদণ্ড কী?", "Apa standar pelaksanaan keterampilan ini?", "सीपका मापदण्डहरू के हुन्?"], ["li", "استخدام الأحواض بشكل صحيح.", "Use the sinks correctly.", "सिंक का सही उपयोग करें।", "বেসিনগুলো সঠিকভাবে ব্যবহার করুন।", "Gunakan bak dengan benar.", "हौजहरू सही तरिकाले प्रयोग गर्नुहोस्।"], ["li", "التأكد من درجات الحرارة لكل حوض.", "Check the temperature of each sink.", "हर हौज़ का तापमान जाँचें।", "প্রতিটি বেসিনের তাপমাত্রা যাচাই করুন।", "Periksa suhu setiap bak.", "प्रत्येक हौजको तापक्रम जाँच गर्नुहोस्।"], ["li", "الالتزام بالتركيزات المنظف والمطهر الموصى بها.", "Keep to the recommended detergent and sanitiser concentrations.", "अनुशंसित क्लीनर और सैनिटाइज़र की सांद्रता का पालन करें।", "নির্দেশিত ডিটারজেন্ট ও জীবাণুনাশকের মাত্রা মেনে চলুন।", "Patuhi konsentrasi deterjen dan sanitasi yang dianjurkan.", "सिफारिस गरिएको डिटर्जेन لعالية.", "To keep utensils and tools clean and safe in small or limited-space establishments, while keeping high cleaning and sanitising standards.", "छोटे या सीमित स्थान वाले प्रतिष्ठानों में बर्तनों और औज़ारों को साफ़ व सुरक्षित रखना, और उच्च सफ़ाई व सैनिटाइज़ेशन मानक बनाए रखना।", "ছোট বা সীমিত জায়গার প্রতিষ্ঠানে পাত্র ও সরঞ্জাম পরিষ্কার ও নিরাপদ রাখা এবং উচ্চ পরিচ্ছন্নতার মান বজায় রাখা।", "Menjaga peralatan tetap bersih dan aman di usaha kecil atau berruang terbatas, dengan menjaga standar kebersihan dan sanitasi yang tinggi.", "सानो वा सीमित ठाउँ भएका प्रतिष्ठानहरूमा बर्तन र औजारहरू सफा र सुरक्षित राख्नु, र उच्च सफाई तथा सेनिटाइजेसन मापदण्ड कायम राख्नु।"], ["p", "طريقة تنفيذ هذه المهارة تتضمن: التنظيف الأولي، التنظيف الرئيسي والشطف (الحوض الأول)، التطهير (الحوض الثاني) وأرفف التجفيف.", "The method includes: pre-cleaning, main washing and rinsing (first sink), sanitising (second sink), and air-drying on the rack.", "इस विधि में शामिल है: प्रारंभिक सफ़ाई, मुख्य धुलाई और खंगालना (पहला हौज़), सैनिटाइज़ करना (दूसरा हौज़) और रैक पर सुखाना।", "এই পদ্ধতিতে রয়েছে: প্রাথমিক পরিষ্কার, মূল ধোয়া ও ধুয়ে ফেলা (প্রথম বেসিন), জীবাণুমুক্তকরণ (দ্বিতীয় বেসিন) ও র‍্যাকে শুকানো।", "Metode ini meliputi: pembersihan awal, pencucian utama dan pembilasan (bak pertama), penyanitasian (bak kedua), dan pengeringan di rak.", "यो विधिमा समावेश छ: प्रारम्भिक सफाई, मुख्य धुने र पखाल्ने (पहिलो हौज), सेनिटाइज गर्ने (दोस्रो हौज) र र्याकमा सुकाउने।"], ["li", "التنظيف الأولي: المسح، أو الكشط، أو الشطف، أو النقع لإزالة بقايا الغذاء والمخلفات.", "Pre-cleaning: wipe, scrape, rinse or soak to remove food remains and debris.", "प्रारंभिक सफ़ाई: भोजन के अवशेष और मलबा हटाने के लिए पोंछें, खुरचें, खंगालें या भिगोएँ।", "প্রাথমিক পরিষ্কার: খাবারের অবশেষ ও ময়লা দূর করতে মোছা, খোঁচানো, ধোয়া বা ভেজানো।", "Pembersihan awal: lap, kikis, bilas atau rendam untuk menghilangkan sisa makanan dan kotoran.", "प्रारम्भिक सफाई: खानाको अवशेष र फोहोर हटाउन पुछ्नुहोस्, खुर्कनुहोस्, पखाल्नुहोस् वा भिजाउनुहोस्।"], ["li", "التنظيف الرئيسي والشطف (الحوض الأول): الغسيل بماء ساخن (حوالي 50°م) والمنظفات، لإزالة بقايا الغذاء والمخلفات العالقة. الشطف بماء نظيف جارٍ لإزالة مخلفات الغسيل وبقايا المنظفات المتبقية.", "Main washing and rinsing (first sink): wash in hot water (about 50°C) with detergent to remove food remains and stuck-on dirt. Rinse with clean running water to remove detergent residue.", "मुख्य धुलाई और खंगालना (पहला हौज़): गर्म पानी (लगभग 50°C) और डिटर्जेंट से धोएँ ताकि चिपकी गंदगी हटे। डिटर्जेंट के अवशेष हटाने के लिए साफ़ बहते पानी से खंगालें।", "মূল ধোয়া ও ধুয়ে ফেলা (প্রথম বেসিন): ডিটারজেন্টসহ গরম পানিতে (প্রায় ৫০°সে) ধুয়ে খাবারের অবশেষ দূর করুন। ডিটারজেন্টের অবশিষ্ট দূর করতে পরিষ্কার চলমান পানিতে ধুয়ে নিন।", "Pencucian utama dan pembilasan (bak pertama): cuci dengan air hangat (sekitar 50°C) dan deterjen untuk menghilangkan sisa makanan. Bilas dengan air bersih mengalir untuk menghilangkan sisa deterjen.", "मुख्य धुने र पखाल्ने (पहिलो हौज): डिटर्जेन्टसहित तातो पानी (लगभग 50°C) ले धोएर खानाको अवशेष र टाँसिएको फोहोर हटाउनुहोस्। डिटर्जेन्टको अवशेष हटाउन सफा बगिरहेको पानीले पखाल्नुहोस्।"], ["li", "التطهير (الحوض الثاني): الغمر في ماء ساخن (75°م لمدة 30 ثانية أو 82°م لمدة 10 ثوانٍ) أو استخدام مطهرات كيميائية خاصة.", "Sanitising (second sink): immerse in hot water (75°C for 30 seconds or 82°C for 10 seconds) or use special chemical sanitisers.", "सैनिटाइज़ (दूसरा हौज़): गर्म पानी में डुबोएँ (75°C पर 30 सेकंड या 82°C पर 10 सेकंड) या विशेष रासायनिक सैनिटाइज़र इस्तेमाल करें।", "জীবাণুমুক্তকরণ (দ্বিতীয় বেসিন): গরম পানিতে ডুবান (৭৫°সে-তে ৩০ সেকেন্ড বা ৮২°সে-তে ১০ সেকেন্ড) অথবা বিশেষ রাসায়নিক জীবাণুনাশক ব্যবহার করুন।", "Penyanitasian (bak kedua): rendam dalam air panas (75°C selama 30 detik atau 82°C selama 10 detik) atau gunakan sanitasi kimia khusus.", "सेनिटाइज गर्ने (दोस्रो हौज): तातो पानीमा डुबाउनुहोस् (75°C मा 30 सेकेन्ड वा 82°C मा 10 सेकेन्ड) वा विशेष रासायनिक सेनिटाइजर प्रयोग गर्नुहोस्।"], ["li", "التجفيف: الترك للتجفيف في الهواء (الأدوات مقلوبة)، أو استخدام مناديل ورقية عالية الامتصاص.", "Drying: leave to air-dry (utensils upside down), or use highly absorbent paper towels.", "सुखाना: हवा में सूखने दें (बर्तन उल्टे रखकर), या बहुत सोखने वाले कागज़ी तौलिये इस्तेमाल करें।", "শুকানো: বাতাসে শুকাতে দিন (পাত্র উল্টে), অথবা শোষক কাগজের তোয়ালে ব্যবহার করুন।", "Pengeringan: biarkan kering di udara (peralatan terbalik), atau gunakan tisu sangat menyerap.", "सुकाउने: बर्तनलाई उल्टो पारेर हावामा सुकाउन दिनुहोस्, वा धेरै सोस्ने कागजी तौलिया प्रयोग गर्नुहोस्।"], ["h3", "ما هي معايير تنفيذ المهارة؟", "What are the standards for doing the skill?", "इस कौशल के मानक क्या हैं?", "এই দক্ষতার মানদণ্ড কী?", "Apa standar pelaksanaan keterampilan ini?", "सीपका मापदण्डहरू के हुन्?"], ["li", "استخدام الأحواض بشكل صحيح.", "Use the sinks correctly.", "हौज़ों का सही उपयोग करें।", "বেসিনগুলো সঠিকভাবে ব্যবহার করুন।", "Gunakan bak dengan benar.", "हौजहरू सही तरिकाले प्रयोग गर्नुहोस्।"], ["li", "التأكد من درجات الحرارة لكل حوض.", "Check the temperature of each sink.", "हर हौज़ का तापमान जाँचें।", "প্রতিটি বেসিনের তাপমাত্রা যাচাই করুন।", "Periksa suhu setiap bak.", "प्रत्येक हौजको तापक्रम जाँच गर्नुहोस्।"], ["li", "الالتزام بتركيزات المنظف والمطهر الموصى بها.", "Keep to the recommended detergent and sanitiser strengths.", "अनुशंसित क्लीनर और सैनिटाइज़र की सांद्रता का पालन करें।", "নির্দেশিত ডিটারজেন্ট ও জীবাণুনাশকের মাত্রা মেনে চলুন।", "Patuhi kekuatan deterjen dan sanitasi yang dianjurkan.", "सिफारिस गरिएको डिटर्जेन्ट र सेनिटाइजरको सान्द्रता पालना गर्नुहोस्।"], ["li", "الالتزام بأوقات الغمر في حوض التطهير.", "Keep to the soaking times in the sanitising sink.", "सैनिटाइज़िंग हौज़ में भिगोने का समय पालन करें।", "জীবাণুমুক্তকরণ বেসিনে ভেজানোর সময় মেনে চলুন।", "Patuhi waktu rendam di bak sanitasi.", "सेनिटाइज हौजमा भिजाउने समय पालना गर्नुहोस्।"], ["li", "ضمان الشطف الجيد بين مرحلتي الغسيل والتطهير.", "Make sure there is a good rinse between the washing and sanitising stages.", "धुलाई और सैनिटाइज़ेशन के बीच अच्छी तरह खंगालना सुनिश्चित करें।", "ধোয়া ও জীবাণুমুক্ত  "स्रोत से दूर हटें: काम रोकें और अच्छे वेंटिलेशन वाली जगह पर जाएँ।", "উৎস থেকে সরুন: কাজ থামিয়ে ভালো বায়ুচলাচলযুক্ত জায়গায় যান।", "Menjauh dari sumber: hentikan pekerjaan dan pindah ke area berventilasi baik.", "स्रोतबाट टाढा जानुहोस्: काम रोक्नुहोस् र राम्रो हावा चल्ने ठाउँमा जानुहोस्।"], ["li", "التصرف حسب نوع التعرض: للجلد: غسل المنطقة بالماء الجاري لمدة 15-20 دقيقة. للعينين: غسل العين بالماء لمدة 20-15 دقيقة مع فتح الجفن. للاستنشاق: الخروج إلى الهواء الطلق وتجنب المجهود.", "Act according to the type of exposure: for skin: rinse the area with running water for 15–20 minutes. For eyes: rinse the eye with water for 15–20 minutes while holding the eyelid open. For inhalation: go out into fresh air and avoid exertion.", "संपर्क के प्रकार के अनुसार कार्रवाई करें: त्वचा के लिए: प्रभावित जगह को 15–20 मिनट बहते पानी से धोएँ। आँखों के लिए: पलक खोलकर 15–20 मिनट पानी से धोएँ। साँस के लिए: खुली हवा में जाएँ और ज़ोर लगाने से बचें।", "সংস্পর্শের ধরন অনুযায়ী ব্যবস্থা নিন: ত্বকে: জায়গাটি ১৫–২০ মিনিট চলমান পানিতে ধুন। চোখে: পাতা খুলে ১৫–২০ মিনিট পানি দিয়ে ধুন। শ্বাসে: খোলা বাতাসে যান এবং পরিশ্রম এড়িয়ে চলুন।", "Tindak sesuai jenis paparan: untuk kulit: bilas area dengan air mengalir selama 15–20 menit. Untuk mata: bilas mata dengan air selama 15–20 menit sambil membuka kelopak. Untuk terhirup: keluar ke udara segar dan hindari bekerja keras.", "सम्पर्कको प्रकार अनुसार कार्य गर्नुहोस्: छालाको हकमा: 15–20 मिनेटसम्म बगिरहेको पानीले क्षेत्र पखाल्नुहोस्। आँखाको हकमा: पाताल खुला राखेर 15–20 मिनेटसम्म पानीले आँखा पखाल्नुहोस्। सास लिएको हकमा: ताजा हावामा जानुहोस् र अत्यधिक परिश्रम नगर्नुहोस्।"], ["li", "مراجعة بيانات السلامة للمادة: للحصول على تعليمات الإسعافات الأولية.", "Check the material safety data: to get first aid instructions.", "सामग्री सुरक्षा डेटा देखें: प्राथमिक उपचार के निर्देश पाने के लिए।", "উপকরণের নিরাপত্তা তথ্য দেখুন: প্রাথমিক চিকিৎসার নির্দেশনা পেতে।", "Periksa data keselamatan bahan: untuk mendapatkan instruksi pertolongan pertama.", "सामग्री सुरक्षा डेटा जाँ للتآكل: قد تسبب حروقاً للجلد أو العين، أو تتلف المعادن. أمثلة: منظفات الأفران القوية، مزيلات الدهون.", "Corrosive materials: can cause burns to skin or eyes, or damage metals. Examples: strong oven cleaners, degreasers.", "संक्षारक पदार्थ: त्वचा या आँखों पर जलन कर सकते हैं, या धातु खराब कर सकते हैं। उदाहरण: तेज़ ओवन क्लीनर, ग्रीस रिमूवर।", "ক্ষয়কারী পদার্থ: ত্বক বা চোখে পোড়া বা ধাতু নষ্ট করতে পারে। উদাহরণ: শক্তিশালী ওভেন ক্লিনার, গ্রিজ রিমুভার।", "Bahan korosif: dapat menyebabkan luka bakar pada kulit atau mata, atau merusak logam. Contoh: pembersih oven kuat, penghilang lemak.", "संक्षारक सामग्री: छाला वा आँखामा पोल्ने घाउ निम्त्याउन, वा धातु बिगार्न सक्छ। उदाहरण: कडा ओभन क्लिनर, ग्रीज हटाउने सामग्री।"], ["li", "مواد سامة: قد تكون ضارة إذا تم ابتلاعها أو استنشاقها أو ملامستها للجلد. أمثلة: بعض المبيدات الحشرية، مواد التنظيف القوية.", "Toxic materials: can be harmful if swallowed, inhaled or touching the skin. Examples: some insecticides, strong cleaners.", "विषैले पदार्थ: निगलने, साँस में लेने या त्वचा से छूने पर हानिकारक हो सकते हैं। उदाहरण: कुछ कीटनाशक, तेज़ क्लीनर।", "বিষাক্ত পদার্থ: গিললে, শ্বাসে নিলে বা ত্বকে লাগলে ক্ষতিকর হতে পারে। উদাহরণ: কিছু কীটনাশক, শক্তিশালী ক্লিনার।", "Bahan beracun: dapat berbahaya jika tertelan, terhirup, atau mengenai kulit. Contoh: beberapa insektisida, pembersih kuat.", "विषाक्त सामग्री: निल्दा, सास लिँदा वा छालामा सम्पर्क हुँदा हानिकारक हुन सक्छ। उदाहरण: केही कीटनाशक, कडा क्लिनर।"], ["li", "مواد قابلة للاشتعال: احفظها بعيداً عن مصادر الحرارة واللهب. أمثلة: بعض المنظفات، المطهرات الكحولية.", "Flammable materials: keep away from heat and flames. Examples: some cleaners, alcohol-based sanitisers.", "ज्वलनशील पदार्थ: गर्मी और आग से दूर रखें। उदाहरण: कुछ क्लीनर, अल्कोहल-आधारित सैनिटाइज़र।", "দাহ্য পদার্থ: তাপ ও আগুন থেকে দূরে রাখুন। উদাহরণ: কিছু ক্লিনার, অ্যালকোহলভিত্তিক জীবাণুনাশক।", "Bahan mudah terbakar: jauhkan dari panas dan api. Contoh: beberapa pembersih, sanitasi berbasis alkohol.", "ज्वलनशील सामग्री: तातो र आगोबाट टाढा राख्नुहोस्। उदाहरण: केही क्लिनर, अल्कोहलमा आधारित सेनिटाइजर।"], ["li", "خطر على البيئة: قد تكون ضارة للبيئة، خاصة للحياة المائية. أمثلة: بعض المبيدات الحشرية، المنظفات الكيميائية.", "Environmental hazard: can harm the environment, especially aquatic life. Examples: some insecticides, chemical cleaners.", "पर्यावरण का खतरा: पर्यावरण, खासकर जलीय जीवन को नुकसान पहुँचा सकते हैं। उदाहरण: कुछ कीटनाशक, रासायनिक क्लीनर।", "পরিবেশের ঝুঁকি: পরিবেশ, বিশেষ করে জলজ জীবনের ক্ষতি করতে পারে। উদাহরণ: কিছু কীটনাশক, রাসায়নিক ক্লিনার।", "Bahaya lingkungan: dapat merusak lingkungan, terutama kehidupan air. Contoh: beberapa insektisida, pembersih kimia.", "वातावरणीय खतरा: वातावरणलाई हानि गर्न सक्छ, विशेषगरी जलचर जीवलाई। उदाहरण: केही कीटनाशक, रासायनिक क्लिनर।"], ["li", "مواد مهيجة: قد تسبب تهيجاً للجلد أو العين أو الجهاز التنفسي. أمثلة: بعض المنظفات العامة، سوائل غسل الأطباق.", "Irritant materials: can irritate skin, eyes or the breathing system. Examples: some general cleaners, dishwashing liquids.", "परेशान करने वाले पदार्थ: त्वचा, आँखों या साँस की नली में जलन कर सकते हैं। उदाहरण: कुछ सामान्य क्लीनर, बर्तन धोने का तरल।", "উত্তেজক পদার্থ: ত্বক, চোখ বা শ্বাসতন্ত্রে জ্বালা করতে পারে। উদাহরণ: কিছু সাধারণ ক্লিনার, থালা ধোয়ার তরল।", "Bahan iritan: dapat mengiritasi kulit, mata atau sistem pernapasan. Contoh: beberapa pembersih umum, cairan cuci piring.", "जलन गराउने सामग्री: छाला, आँखा वा सास प्रणालीमा जलन गराउन सक्छ। उदाहरण: केही सामान्य क्लिनर, भाँडा माझ्ने तरल।"], ["li", "مواد قابلة للانفجار: قد تنفجر عند تعرضها للحرارة أو الصدمات أو الاحتكاك. أمثلة: علب الأيروسول (الرذاذ) المضغوطة، بعض أنواع المنظفات أو المطهرات.", "Explosive materials: may explode when exposed to heat, shock or friction. Examples: pressurised aerosol cans, some types of cleaners or sanitisers.", "विस्फोटक पदार्थ: गर्मी, झटके या घर्षण से फट सकते हैं। उदाहरण: दबाव वाले एयरोसोल कैन, कुछ प्रकार के क्लीनर या सैनिटाइज़र।", "বিস্ফোরক পদার্থ: তাপ, আঘাত বা ঘর্ষণে ফেটে যেতে পারে। উদাহরণ: চাপযুক্ত অ্যারোসল ক্যান, কিছু ধরনের ক্লিনার বা জীবাণুনাশক।", "Bahan eksplosif: dapat meledak jika terkena panas, benturan, atau gesekan. Contoh: kaleng aerosol bertekanan, beberapa jenis pembersih atau sanitasi.", "विस्फोटक सामग्री: तातो, झट्का वा घर्षणमा पर्दा विस्फोट हुन सक्छ। उदाहरण: दबाबयुक्त एरोसोल क्यान, केही प्रकारका क्लिनर वा सेनिटाइजर।"], ["n", "تذكر دائماً: التأكد من قراءة ملصقات المواد الكيميائية قبل استخدامها. التخزين الصحيح للمواد الكيميائية في أماكنها المخصصة، بعيداً عن الغذاء والمعدات المستخدمة في تحضير الغذاء. الإبلاغ عن أي مواد كيميائية غير مغنونة بشكل صحيح أو مخزنة بشكل غير آمن، ابلغ المشرف فوراً!", "Always remember: read chemical labels before using them. Store chemicals properly in their designated places, away from food and food-preparation equipment. Report any chemical that is not labelled correctly or stored unsafely, and tell your supervisor immediately!", "हमेशा याद रखें: इस्तेमाल से पहले रसायन पर लिखे लेबल पढ़ें। रसायनों को उनकी तय जगह पर, भोजन और भोजन तैयारी के उपकरणों से दूर रखें। जिस रसायन पर सही लेबल न हो या जो असुरक्षित तरीके से रखा हो, उसकी तुरंत सुपरवाइज़र को सूचना दें!", "সবসময় মনে রাখুন: ব্যবহারের আগে রাসায়নিকের লেবেল পড়ুন। রাসায়নিক নির্ধারিত জায়গায়, খাবার ও খাবার প্রস্তুতির যন্ত্র থেকে দূরে সঠিকভাবে রাখুন। যেকোনো রাসায়নিক সঠিকভাবে লেবেলযুক্ত না হলে বা অনিরাপদভাবে রাখা হলে তৎক্ষণাৎ সুপারভাইজারকে জানান!", "Ingat selalu: baca label bahan kimia sebelum dipakai. Simpan bahan kimia dengan benar di tempat yang ditentukan, jauh dari makanan dan peralatan persiapan makanan. Laporkan bahan kimia yang tidak berlabel benar atau disimpan tidak aman, segera beri tahu supervisor!", "सधैं याद राख्नुहोस्: प्रयोग गर्नु अघि रासायनिक लेबल पढ्नुहोस्। रसायनलाई तोकिएको ठाउँमा, खाना र खाना तयारी उपकरणबाट टाढा, राम्रोसँग भण्डारण गर्नुहोस्। गलत लेबल गरिएको वा असुरक्षित रूपमा भण्डारण गरिएको कुनै पनि रसायनको बारेमा तुरुन्त सुपरभाइजरलाई जानकारी दिनुहोस्!"]]}, {"t": ["الوقاية من الحرائق، أدوات الحماية الشخصية، وصندوق الإسعافات", "Fire prevention, personal protective equipment and first aid kit", "आग से बचाव, निजी सुरक्षा उपकरण और प्राथमिक उपचार बॉक्स", "আগুন প্রতিরোধ, ব্যক্তিগত সুরক্ষা সরঞ্জাম ও প্রাথমিক চিকিৎসা বাক্স", "Pencegahan kebakaran, alat pelindung diri dan kotak P3K", "आग से बचाव, निजी सुरक्षा उपकरण और प्राथमिक उपचार बॉक्स"], "r": [["h2", "الوقاية من الحرائق في منشآت الغذاء", "Fire prevention in food establishments", "खाद्य प्रतिष्ठानों में आग से बचाव", "খাদ্য প্রতিষ্ঠানে আগুন প্রতিরোধ", "Pencegahan kebakaran di usaha pangan", "खाद्य प्रतिष्ठानमा आगो रोकथाम"], ["p", "الحرائق في منشآت الغذاء تشكل خطراً كبيراً على سلامة العاملين والعملاء، وقد تؤدي إلى خسائر مادية جسيمة. الوقاية من الحرائق لا تحمي الأرواح والممتلكات فحسب، بل تضمن استمرارية العمل وسلامة البيئة المحيطة. فالدخان والأبخرة المحيطة الاختناق، في حين تؤدي الحرارة واللهب إلى الحروق الخطيرة. بالإضافة إلى ذلك، قد يتسبب الانفجار في تدمير المباني وتحطم المعدات، مما يؤدي إلى توقف العمل لفترات طويلة.", "Fires in food establishments are a major risk to the safety of workers and customers and can cause heavy material losses. Fire prevention protects lives and property, and keeps work going and the surrounding environment safe. Smoke and fumes can cause suffocation, while heat and flames cause serious burns. Explosions can also destroy buildings and wreck equipment, stopping work for long periods.", "खाद्य प्रतिष्ठानों में आग कर्मचारियों और ग्राहकों की सुरक्षा के लिए बड़ा खतरा है और भारी आर्थिक नुकसान कर सकती है। आग से बचाव जान-माल की रक्षा करता है और काम व आसपास के वातावरण को सुरक्षित रखता है। धुआँ और वाष्प दम घोंट सकते हैं, जबकि गर्मी और लपटें गंभीर जलन पैदा करती हैं। विस्फोट इमारतों और उपकरणों को नष्ट कर सकता है और लंबे समय तक काम रोक सकता है।", "খাদ্য প্রতিষ্ঠানে আগুন কর্মী ও গ্রাহকদের নিরাপত্তার জন্য বড় ঝুঁকি এবং বড় বস্তুগত ক্ষতি করতে পারে। আগুন প্রতিরোধ প্রাণ ও সম্পদ রক্ষা করে এবং কাজ ও পারিপার্শ্বিক পরিবেশ নিরাপদ রাখে। ধোঁয়া ও বাষ্পে শ্বাসরোধ হতে পারে, আর তাপ ও শিখায় গুরুতর পোড়া হয়। বিস্ফোরণে ভবন ও যন্ত্রপাতি ধ্বংস হতে পারে এবং দীর্ঘদিন কাজ বন্ধ থাকতে পারে।", "Kebakaran di usaha pangan merupakan risiko besar bagi keselamatan pekerja dan pelanggan, serta dapat menimbulkan kerugian material besar. Pencegahan kebakaran melindungi nyawa dan harta, serta menjaga kelancaran kerja dan lingkungan sekitar. Asap dan uap dapat menyebabkan sesak napas, sedangkan panas dan api menyebabkan luka bakar serius. Ledakan juga dapat merusak bangunan dan peralatan sehingga kerja terhenti lama.", "खाद्य प्रतिष्ठानमा लाग्ने आगो कामदार र ग्राहकको सुरक्षाका लागि ठूलो जोखिम हो र ठूलो सामग्री क्षति निम्त्याउन सक्छ। आगो रोकथामले जीवन र सम्पत्ति जोगाउँछ, र काम चलिरहने र वरपरको वातावरण सुरक्षित राख्छ। धुवाँ र धुवाँकणले सास घुट्ने हुन सक्छ, जबकि तातो र आगोले गम्भीर पोल्ने घाउ निम्त्याउँछ। विस्फोटले भवन पनि नष्ट गर्न सक्छ र उपकरण बिगार्न सक्छ, जसले लामो समयसम्म काम रोक्छ।"], ["h3", "ما هي أسباب حرائق منشآت الغذاء؟", "What causes fires in food establishments?", "खाद्य प्रतिष्ठानों में आग के कारण क्या हैं?", "খাদ্য প্রতিষ্ঠানে আগুনের কারণ কী?", "Apa penyebab kebakaran di usaha pangan?", "खाद्य प्रतिष्ठानमा आगो लाग्नुका कारणहरू के हुन्?"], ["li", "التحميل الزائد على الأجهزة الكهربائية.", "Overloading electrical appliances.", "बिजली के उपकरणों पर अधिक भार डालना।", "বৈদ্যুতিক যন্ত্রে অতিরিক্ত লোড দেওয়া।", "Kelebihan beban pada peralatan listrik.", "बिजुलीका उपकरणमा धेरै भार हाल्नु।"], ["li", "تجمع الدهون على مراوح الشفط.", "Grease build-up on extractor fans.", "एग्ज़ॉस्ट पंखों पर चिकनाई जमना।", "এক্সজস্ট ফ্যানে চর্বি জমা।", "Penumpukan lemak pada kipas exhaust.", "एक्स्ट्र्याक्टर फ्यानमा बोसो जम्नु।"], ["li", "الإحماء المفرط للزيوت في المقالي.", "Overheating of oil in frying pans.", "कड़ाही में तेल का अधिक गरम होना।", "কড়াইয়ে তেলের অতিরিক্ত গরম হওয়া।", "Pemanasan berlebih minyak di wajan.", "फ्राइङ प्यानमा तेल धेरै तातिनु।"], ["li", "سوء استخدام المعدات الكهربائية.", "Misuse of electrical equipment.", "बिजली के उपकरणों का गलत इस्तेमाल।", "বৈদ্যুতিক যন্ত্রের অপব্যবহার।", "Penyalahgunaan peralatan listrik.", "बिजुलीका उपकरणको गलत प्रयोग।"], ["li", "التدخين في أماكن غير مخصصة.", "Smoki ्षित कार्य पद्धतियाँ: पकाते समय साफ़ उपकरण और सूखे, साफ़ औज़ार इस्तेमाल करें, ढीले कपड़े न पहनें, पकाते समय उसे अकेला न छोड़ें, एग्ज़ॉस्ट पंखे नियमित साफ़ करें, और पकाने की जगह बिना निगरानी न छोड़ें।", "নিরাপদ কাজের পদ্ধতি: রান্নার সময় পরিষ্কার যন্ত্র ও শুকনো, পরিষ্কার সরঞ্জাম ব্যবহার করুন, ঢিলেঢালা পোশাক পরবেন না, রান্না অযত্নে ফেলে রাখবেন না, এক্সজস্ট ফ্যান নিয়মিত পরিষ্কার করুন।", "Praktik kerja aman: gunakan peralatan bersih dan alat kering saat memasak, jangan memakai pakaian longgar, jangan meninggalkan masakan tanpa pengawasan, bersihkan kipas exhaust secara teratur.", "सुरक्षित कार्य अभ्यास: पकाउँदा सफा उपकरण र सुख्खा, सफा औजार प्रयोग गर्नुहोस्, ढिलो लुगा नलगाउनुहोस्, पकाइरहेको खाना एक्लै नछोड्नुहोस्, एक्स्ट्र्याक्टर फ्यान नियमित सफा गर्नुहोस्, र पकाउने क्षेत्र निगरानीविना नछोड्नुहोस्।"], ["li", "التدريب والوعي: التعرف على مواقع معدات الإطفاء وكيفية استخدامها، والتأكد من أن جميع مخارج الطوارئ سالكة وخالية من العوائق.", "Training and awareness: know where fire-fighting equipment is and how to use it, and make sure all emergency exits are clear and free of obstacles.", "प्रशिक्षण और जागरूकता: अग्निशमन उपकरण कहाँ हैं और उन्हें कैसे चलाना है जानें, और सुनिश्चित करें कि सभी आपातकालीन निकास खुले और रुकावट-मुक्त हों।", "প্রশিক্ষণ ও সচেতনতা: অগ্নিনির্বাপক যন্ত্র কোথায় ও কীভাবে ব্যবহার করতে হয় জানুন, এবং সব জরুরি নির্গমন পথ খোলা ও বাধামুক্ত আছে নিশ্চিত করুন।", "Pelatihan dan kesadaran: ketahui lokasi dan cara memakai peralatan pemadam, serta pastikan semua pintu darurat terbuka dan bebas rintangan.", "तालिम र सजगता: आगो नियन्त्रण उपकरण कहाँ छ र त्यसलाई कसरी प्रयोग गर्ने भन्ने थाहा राख्नुहोस्, र सबै आपतकालीन निकास सफा र अवरोधमुक्त भएको पक्का गर्नुहोस्।"], ["h3", "ما الإجراءات الواجب اتباعها عند اكتشاف حريق أثناء العمل؟", "What must be done when a fire is found at work?", "काम के दौरान आग दिखे तो क्या करना चाहिए?", "কাজের সময় আগুন দেখলে কী করতে হবে?", "Apa yang harus dilakukan jika menemukan kebakaran saat bekerja?", "कार्यस्थलमा आगो देखिँदा के गर्नुपर्छ?"], ["li", "الإنذار: عند اكتشاف حريق، أطلق جرس الإنذار فوراً، وابلغ المشرفين والزملاء في المكان.", "Raise the alarm: when you find a fire, sound the alarm immediately and tell supervisors and colleagues nearby.", "अलार्म बजाएँ: आग दिखते ही तुरंत अलार्म बजाएँ और पास के सुपरवाइज़रों व साथियों को बताएँ।", "সতর্ক করুন: আগুন দেখলে তৎক্ষণাৎ অ্যালার্ম বাজান এবং কাছের সুপারভাইজার ও সহকর্মীদের জানান।", "Beri peringatan: saat menemukan kebakaran, bunyikan alarm segera dan beri tahu supervisor serta rekan di sekitar.", "अलार्म बजाउनुहोस्: आगो देख्नासाथ तुरुन्त अलार्म बजाउनुहोस् र नजिकका सुपरभाइजर र सहकर्मीलाई जानकारी दिनुहोस्।"], ["li", "الإخلاء: اتبع خطة الإخلاء المعتمدة في المنشأة، وغادر المبنى فوراً عبر أقرب مخرج طوارئ، وغلق الأبواب لمنع انتشار الحريق.", "Evacuate: follow the approved evacuation plan, leave the building immediately by the nearest emergency exit, and close doors to stop the fire spreading.", "निकासी: स्वीकृत निकासी योजना का पालन करें, सबसे नज़दीकी आपातकालीन निकास से तुरंत इमारत से बाहर निकलें, और आग फैलने से रोकने के लिए दरवाज़े बंद करें।", "সরিয়ে নেওয়া: অনুমোদিত সরিয়ে নেওয়ার পরিকল্পনা মেনে কাছের জরুরি পথে তৎক্ষণাৎ ভবন ছাড়ুন, এবং আগুন ছড়ানো রোধে দরজা বন্ধ করুন।", "Evakuasi: ikuti rencana evakuasi yang disetujui, segera keluar gedung lewat pintu darurat terdekat, dan tutup pintu untuk mencegah api menyebar.", "निकास गर्नुहोस्: स्वीकृत निकास योजना पालना गर्नुहोस्, नजिकको आपतकालीन निकासबाट तुरुन्त भवन छोड्नुहोस्, र आगो फैलिन नदिन ढोका बन्द गर्नुहोस्।"], ["li", "مكافحة الحريق (للمدربين فقط): محاولة إطفاء الحريق فقط إذا كان صغيراً، واستخدام طفاية الحريق المناسبة لنوع الحريق.", "Fight the fire (trained staff only): try to put out the fire only if it is small, using the right extinguisher for the type of fire.", "आग बुझाना (केवल प्रशिक्षित के लिए): आग छोटी हो तो ही बुझाने की कोशिश करें, और आग के प्रकार के अनुसार सही अग्निशामक इस्तेमाल करें।", "আগুন নেভানো (শুধু প্রশিক্ষিতদের জন্য): আগুন ছোট হলেই নেভানোর চেষ্টা করুন, এবং আগুনের ধরন অনুযায়ী সঠিক অগ্নিনির্বাপক ব্যবহার কর आउँछ!"]]}, {"t": ["أدوات الحماية الشخصية", "Personal protective equipment (PPE)", "निजी सुरक्षा उपकरण", "ব্যক্তিগত সুরক্ষা সরঞ্জাম", "Alat pelindung diri (APD)", "निजी सुरक्षा उपकरण"], "r": [["h2", "لماذا هذا مهم؟", "Why is this important?", "यह क्यों ज़रूरी है?", "এটি কেন গুরুত্বপূর্ণ?", "Mengapa ini penting?", "यो किन महत्त्वपूर्ण छ?"], ["p", "استخدام الملابس وأدوات الحماية الشخصية يحمي العاملين من الإصابات والأمراض المهنية في منشآت الغذاء. هذه الحماية تضمن سلامة العاملين وتحافظ على جودة الغذاء.", "Wearing protective clothing and personal protective equipment protects workers from injuries and occupational illness in food establishments. This protection keeps workers safe and keeps food quality intact.", "खाद्य प्रतिष्ठानों में सुरक्षात्मक कपड़े और निजी सुरक्षा उपकरण पहनने से कर्मचारी चोट और व्यावसायिक बीमारियों से बचते हैं। इससे कर्मचारियों की सुरक्षा होती है और भोजन की गुणवत्ता बनी रहती है।", "খাদ্য প্রতিষ্ঠানে সুরক্ষামূলক পোশাক ও ব্যক্তিগত সুরক্ষা সরঞ্জাম পরলে কর্মী আঘাত ও পেশাগত রোগ থেকে রক্ষা পান। এতে কর্মীদের নিরাপত্তা ও খাবারের মান বজায় থাকে।", "Memakai pakaian pelindung dan alat pelindung diri melindungi pekerja dari cedera dan penyakit akibat kerja di usaha pangan. Perlindungan ini menjaga keselamatan pekerja dan mutu makanan.", "सुरक्षात्मक कपडा र निजी सुरक्षा उपकरण लगाउँदा खाद्य प्रतिष्ठानमा कामदारलाई चोट र व्यावसायिक रोगबाट बचाउँछ। यो सुरक्षाले कामदारलाई सुरक्षित राख्छ र खानाको गुणस्तर कायम राख्छ।"], ["li", "المعاطف: للحماية من الحرارة المنخفضة. وتستخدم داخل غرف التبريد والتجميد.", "Coats: protect from low temperatures. Used inside cold rooms and freezers.", "कोट: कम तापमान से बचाव। कोल्ड रूम और फ़्रीज़र के अंदर इस्तेमाल होते हैं।", "কোট: নিম্ন তাপমাত্রা থেকে সুরক্ষা। কোল্ড রুম ও ফ্রিজারের ভেতরে ব্যবহৃত।", "Jaket: melindungi dari suhu rendah. Dipakai di dalam ruang pendingin dan pembeku.", "कोट: न्यानो तापक्रमबाट बचाउँछ। चिसो कोठा र फ्रिजरभित्र प्रयोग गरिन्छ।"], ["li", "القفازات: للحماية من المواد الكيميائية، وتستخدم عند التعامل مع مواد التنظيف والتطهير.", "Gloves: protect from chemicals, used when handling cleaning and sanitising materials.", "दस्ताने: रसायनों से बचाव, सफ़ाई और सैनिटाइज़ करने वाली सामग्री के साथ इस्तेमाल होते हैं।", "গ্লাভস: রাসায়নিক থেকে সুরক্ষা, পরিষ্কার ও জীবাণুনাশক উপকরণ ধরার সময় ব্যবহৃত।", "Sarung tangan: melindungi dari bahan kimia, dipakai saat menangani bahan pembersih dan sanitasi.", "पन्जा: रसायनबाट बचाउँछ, सफा गर्ने र सेनिटाइज गर्ने सामग्री ह्यान्डल गर्दा प्रयोग गरिन्छ।"], ["li", "الأقنعة: للحماية من استنشاق الغبار وأبخرة المواد الكيميائية. وتستخدم عند التعامل مع مواد كيميائية في أماكن مغلقة.", "Masks: protect from breathing in dust and chemical fumes. Used when handling chemicals in closed areas.", "मास्क: धूल और रसायन के धुएँ को साँस में जाने से बचाते हैं। बंद जगहों पर रसायन संभालते समय इस्तेमाल होते हैं।", "মাস্ক: ধুলো ও রাসায়নিকের ধোঁয়া শ্বাসে নেওয়া থেকে সুরক্ষা। বদ্ধ জায়গায় রাসায়নিক নিয়ে কাজের সময় ব্যবহৃত।", "Masker: melindungi dari menghirup debu dan asap bahan kimia. Dipakai saat menangani bahan kimia di area tertutup.", "मास्क: धुलो र रासायनिक धुवाँ सास लिनबाट बचाउँछ। बन्द ठाउँमा रसायन ह्यान्डल गर्दा प्रयोग गरिन्छ।"], ["li", "الأحذية الواقية: لحماية وعزل الأقدام، وتستخدم طوال فترة العمل في بيئات العمل المبللة.", "Protective boots: protect and insulate the feet, worn throughout the shift in wet work areas.", "सुरक्षात्मक जूते: पैरों की सुरक्षा और बचाव, गीले कार्य क्षेत्र में पूरी शिफ़्ट के दौरान पहने जाते हैं।", "সুরক্ষামূলক বুট: পায়ের সুরক্ষা ও অন্তরণ, ভেজা কর্মস্থলে পুরো শিফ্টে পরা হয়।", "Sepatu pelindung: melindungi dan mengisolasi kaki, dipakai sepanjang shift di area kerja basah.", "सुरक्षात्मक जुत्ता: खुट्टालाई बचाउँछ र इन्सुलेट गर्छ, भिजेको कार्य क्षेत्रमा सिफ्टभरि लगाइन्छ।"], ["li", "المرايل المعدنية: لحماية القسم الأسفل من الجسم من الجروح، وتستعمل عند استعمال أدوات حادة مثل منشار اللحوم الكهربائي.", "Metal aprons: protect the lower part of the body from cuts, used when using sharp tools such as electric meat saws.", "धातु का एप्रन: शरीर के निचले हिस्से को // Old records were stored as one line per wrong answer ("... | إجابته: ... | الصح: ...").
// Convert them to the same readable layout used for new tests.
function reformatWrong(text) {
  if (!text || text.indexOf('إجابتك') !== -1 || text === 'لا يوجد' || text.indexOf('إجابته:') === -1) return text;
  const render = (label, arr) => {
    const items = arr.flatMap(x => x.split(' ← '));
    if (items.length === 1 && items[0].indexOf('↔') === -1) return '\n  ' + label + ' ' + items[0];
    const numbered = items.length > 1 && items[0].indexOf('↔') === -1;
    return '\n  ' + label + '\n' + items.map((x, k) => numbered ? '   ' + (k + 1) + '. ' + x : '   • ' + x).join('\n');
  };
  return text.split('\n').filter(l => l.trim()).map(line => {
    const parts = line.split(' | ');
    const chosen = [], correct = [];
    let cur = null;
    parts.slice(1).forEach(seg => {
      if (seg.indexOf('إجابته:') === 0) { cur = chosen; seg = seg.slice('إجابته:'.length).trim(); }
      else if (seg.indexOf('الصح:') === 0) { cur = correct; seg = seg.slice('الصح:'.length).trim(); }
      if (cur) cur.push(seg);
    });
    return parts[0] + render('إجابتك:', chosen) + render('الصحيح:', correct);
  }).join('\n\n');
}

    else if (items.length && line.trim()) items[items.length - 1] += '\n' + line;
  });
  return items;
}

function parseWrongItem(item) {

  const bi = BANK.findIndex(b => b.q.ar === question);

  const raw = cm ? cm[1] : '';
  const tokens = raw.split(/\n|\s\|\s/)
    .map(t => t.replace(/^\s*(?:•|✓|✗|\d+\.)\s*/, '').replace(/\s*(?:✓|✗)\s*$/, '').trim())

}

function buildWrongCard(bq, tokens, ok, num) {
  const good = !!ok;
  const cls = good ? 'res-ok' : 'res-bad';
  const lineCls = good ? 'res-line-ok' : 'res-line-bad';
  const wrap = document.createElement('div');
  wrap.className = 'rev-item';
  const head = document.createElement('div'); head.className = 'rev-head';
  head.style.display = 'flex'; head.style.justifyContent = 'space-between'; head.style.alignItems = 'center'; head.style.gap = '8px';
  const hTitle = document.createElement('span'); hTitle.textContent = (num ? num + '. ' : '') + bq.cat.ar;
  const hBadge = document.createElement('span');
  hBadge.className = 'badge ' + (good ? 'badge-pass' : 'badge-fail');
  hBadge.textContent = good ? 'صح ✓' : 'غلط ✗';
  head.appendChild(hTitle); head.appendChild(hBadge);
  const q = document.createElement('div'); q.className = 'rev-q'; q.textContent = bq.q.ar;
  wrap.appendChild(head); wrap.appendChild(q);
  if (bq.matching) {
    // Employee's joined pairs (red) and the correct pairs (green).
    const his = tokens.map(t => {
      const parts = t.split(' ↔ ');
      return [bq.l.ar.indexOf(parts[0]), bq.r.ar.indexOf(parts[1])];
    }).filter(([i, j]) => i !== -1 && j !== -1);
    const correct = bq.l.ar.map((x, i) => [i, i]);
    wrap.appendChild(buildMatchBlock(bq, his, lineCls, 'إجابة الموظف'));
    if (!good) wrap.appendChild(buildMatchBlock(bq, correct, 'res-line-ok', 'الإجابة الصحيحة'));
  } else if (bq.ordering) {
    // Employee's rank for each step (red) and the correct rank (green).
    const hisRank = bq.o.ar.map(step => { const k = tokens.indexOf(step); return k === -1 ? null : k + 1; });
    const correctRank = bq.o.ar.map((step, j) => j + 1);
    wrap.appendChild(buildOrderBlock(bq, hisRank, cls, 'إجابة الموظف'));
    if (!good) wrap.appendChild(buildOrderBlock(bq, correctRank, 'res-ok', 'الإجابة الصحيحة'));
  } else {
    const his = tokens.map(t => ({ text: t, ok: good }));
    const addRows = (label, rows) => {
      const lbl = document.createElement('div'); lbl.className = 'rev-lbl'; lbl.textContent = label;
      wrap.appendChild(lbl);
      rows.forEach(r => {
        const d = document.createElement('div');
        d.className = 'rev-opt ' + (r.ok ? 'ok' : 'bad');
        d.textContent = (r.ok ? '✓ ' : '✗ ') + r.text;
        wrap.appendChild(d);
      });
    };
    addRows('إجابة الموظف', his);
    if (!good) addRows('الإجابة الصحيحة', [{ text: bq.o.ar[bq.c], ok: true }]);
  }
  return wrap;
}
function buildWrongItem(item) {
  const parsed = parseWrongItem(item);
  if (parsed) return buildWrongCard(parsed.bq, parsed.tokens);
  // Unknown question (e.g. text changed): show the stored text as is.
  const pre = document.createElement('pre');
  pre.style.whiteSpace = 'pre-wrap'; pre.style.fontFamily = 'inherit'; pre.style.lineHeight = '1.7'; pre.style.margin = '0';
  pre.textContent = reformatWrong(item);
  return pre;
}
function renderImported() {
  const box = document.getElementById('import-box');
  box.innerHTML = '';
  if (!importedRows || importedRows.length === 0) { setImportMsg('لا توجد نتائج في الشيت.'); return; }
  const title = document.createElement('h3');
  title.className = 'note-h2';
  title.textContent = 'نتائج من الشيت (' + importedRows.length + ')';
  box.appendChild(title);
  importedRows.slice().reverse().forEach(r => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.marginTop = '10px';
    card.style.display = 'flex'; card.style.flexDirection = 'column'; card.style.gap = '12px';
    const head = document.createElement('div');
    head.style.display = 'flex'; head.style.justifyContent = 'space-between'; head.style.gap = '8px'; head.style.flexWrap = 'wrap';
    const nm = document.createElement('strong'); nm.textContent = r.name;
    const sc = document.createElement('span'); sc.textContent = r.score + ' (' + r.pct + ') — ' + r.verdict;
    const dt = document.createElement('small'); dt.style.color = 'var(--fg-soft)'; dt.textContent = r.date;
    const del = document.createElement('button');
    del.type = 'button';
    del.textContent = 'حذف';
    del.style.cssText = 'background:#d64545;color:#fff;border:0;border-radius:8px;padding:4px 12px;font:inherit;cursor:pointer;';
    del.addEventListener('click', e => { e.stopPropagation(); deleteFromSheet(r); });
    head.appendChild(nm); head.appendChild(sc); head.appendChild(dt); head.appendChild(del);
    head.style.cursor = 'pointer';
    card.appendChild(head);
    // Details hidden until the manager taps the name/row.
    pendingDraws = [];
    const body = document.createElement('div');
    body.style.display = 'none';
    body.style.flexDirection = 'column';
    body.style.gap = '12px';
    let detailItems = null;
    try { if (r.detail) detailItems = JSON.parse(r.detail); } catch (e) { detailItems = null; }
    if (Array.isArray(detailItems) && detailItems.length) {
      detailItems.forEach(([qAr, ok, tokens], idx) => {
        const num = idx + 1;
        const bi = BANK.findIndex(b => b.q.ar === qAr);
        if (bi !== -1) body.appendChild(buildWrongCard(BANK[bi], tokens || [], ok, num));
      });
    }
    const items = (Array.isArray(detailItems) && detailItems.length) ? [] : splitWrongItems(r.wrong);
    if (!Array.isArray(detailItems) && items.length === 0) {
      const none = document.createElement('p'); none.className = 'empty-state'; none.textContent = 'لا توجد إجابات غلط';
      body.appendChild(none);
    } else {
      items.forEach(item => body.appendChild(buildWrongItem(item)));
    }
    const myDraws = pendingDraws; pendingDraws = [];
    card.appendChild(body);
    head.addEventListener('click', () => {
      const open = body.style.display === 'none';
      body.style.display = open ? 'flex' : 'none';
      // Lines can only be measured once the block is visible.
      if (open) myDraws.forEach(f => f());
    });
    box.appendChild(card);
  });
  const draws = pendingDraws; pendingDraws = [];
  draws.forEach(f => f());
}
