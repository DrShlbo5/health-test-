 {"cat":{"en":"Food safety","ar":"سلامة الطعام","hi":"खाद्य सुरक्षा","bn":"খাদ্য নিরাপত্তা","id":"Keamanan pangan","ne":"खाद्य सुरक्षा"},"q":{"en":"Which practice prevents cross-contamination in the kitchen?","ar":"أي ممارسة تمنع التلوث المتبادل في المطبخ؟","hi":"रसोई में क्रॉस-संदूषण रोकने वाली कौन-सी प्रथा है?","bn":"রান্নাঘরে কোন অভ্যাস ক্রস-দূষণ রোধ করে?","id":"Praktik apa yang mencegah kontaminasi silang di dapur?","ne":"भान्सामा कुन अभ्यासले क्रस-दूषण रोक्छ?"},"o":{"ar":["استخدام ألواح تقطيع منفصلة للحم النيء والخضروات","تقطيع الخضروات على اللوح مباشرة بعد الدجاج النيء دون غسله","وضع اللحم النيء فوق الطعام الجاهز للأكل في الثلاجة","ترك السكاكين والألواح على الأرض بين المهام"],"en":["Using separate cutting boards for raw meat and vegetables","Cutting vegetables on the board right after raw chicken, without washing it","Placing raw meat above ready-to-eat food in the fridge","Leaving knives and boards on the floor between tasks"],"hi":["कच्चे मांस और सब्ज़ियों के लिए अलग-अलग कटिंग बोर्ड इस्तेमाल करना","कच्चे चिकन के बाद बिना धोए उसी बोर्ड पर सब्ज़ी काटना","फ़्रिज में कच्चे मांस को तैयार खाने के ऊपर रखना","काम के बीच चाकू और बोर्ड ज़मीन पर छोड़ना"],"bn":["কাঁচা মাংস ও সবজির জন্য আলাদা কাটিং বোর্ড ব্যবহার করা","কাঁচা মুরগির পর না ধুয়ে সেই বোর্ডেই সবজি কাটা","ফ্রিজে কাঁচা মাংস তৈরি খাবারের উপরে রাখা","কাজের মাঝে ছুরি ও বোর্ড মেঝেতে ফেলে রাখা"],"id":["Menggunakan talenan terpisah untuk daging mentah dan sayuran","Memotong sayuran di talenan yang sama setelah ayam mentah tanpa dicuci","Menyimpan daging mentah di atas makanan siap saji di kulkas","Membiarkan pisau dan talenan di lantai di antara tugas"],"ne":["काँचो मासु र तरकारीका लागि छुट्टाछुट्टै काटने बोर्ड प्रयोग गर्ने","काँचो कुखुरापछि धोएविना सिधै बोर्डमा तरकारी काट्ने","फ्रिजमा काँचो मासुलाई तयार खानाभन्दा माथि राख्ने","कामहरूको बीचमा चक्कु र बोर्ड भुइँमा छोड्ने"]},"c":0},
 {"cat":{"en":"Damaged food","ar":"الأطعمة التالفة","hi":"क्षतिग्रस्त खाना","bn":"ক্ষতিগ্রস্ত খাবার","id":"Makanan rusak","ne":"बिग्रिएको खाना"},"q":{"en":"What should be done with a can that is badly dented or bulging?","ar":"ماذا يجب أن يُفعل بعلبة متعرجة بشدة أو منتفخة؟","hi":"बुरी तरह पिचके या फूले डिब्बे के साथ क्या करना चाहिए?","bn":"খুব বেশি ডেন্ট বা ফোলা ক্যানের সঙ্গে কী করা উচিত?","id":"Apa yang harus dilakukan dengan kaleng yang penyok parah atau menggembung?","ne":"धेरै डेन्ट वा फुलेको डिब्बाको के गर्नुपर्छ?"},"o":{"ar":["تقديمها بعد مسح الجزء الخارجي من العلبة جيداً","سحبها من الاستخدام وإبلاغ المشرف وعدم تقديمها","الاحتفاظ بها لاستخدامها لاحقاً إذا كان التعرج صغيراً فقط","فتحها بسرعة والتأكد من أن رائحتها طبيعية"],"en":["Serve it after wiping the outside of the can clean","Remove it from use, report it, and do not serve it","Keep it for later use if the dent is only small","Open it quickly and check whether it smells normal"],"hi":["डिब्बे के बाहर को पोंछकर उसे परोसना","डिब्बा हटाकर अलग रखें, रिपोर्ट करें और उसे परोसें नहीं","अगर पिचक छोटी है तो बाद में इस्तेमाल के लिए रख लेना","जल्दी से खोलकर देखना कि उसकी गंध सामान्य है या नहीं"],"bn":["ক্যানের বাইরেটা মুছে পরিবেশন করা","ক্যানটি সরিয়ে রাখুন, রিপোর্ট করুন এবং কোনোভাবেই পরিবেশন করবেন না","ডেন্ট ছোট হলে পরে ব্যবহারের জন্য রেখে দেওয়া","দ্রুত খুলে গন্ধ স্বাভাবিক কিনা দেখা"],"id":["Menyajikannya setelah bagian luar kaleng dilap bersih","Singkirkan dari penggunaan, laporkan, dan jangan disajikan","Menyimpannya untuk dipakai nanti jika penyok hanya kecil","Membukanya dengan cepat dan memeriksa apakah baunya normal"],"ne":["डिब्बाको बाहिरी भाग पुछेर परोस्ने","प्रयोगबाट हटाउने, रिपोर्ट गर्ने, र परोस्न नहुने","डेन्ट सानो भए पछि प्रयोगका लागि राख्ने","छिटो खोलेर गन्ध सामान्य छ कि छैन जाँच गर्ने"]},"c":1},
 {"cat":{"en":"Personal hygiene","ar":"النظافة الشخصية","hi":"व्यक्तिगत स्वच्छता","bn":"ব্যক্তিগত পরিচ্ছন্নতা","id":"Higiene pribadi","ne":"व्यक्तिगत सरसफाइ"},"q":{"en":"Why must food handlers wash their hands after using the toilet?","ar":"لماذا يجب على العاملين في الطعام غسل أيديهم بعد استخدام المرحاض؟","hi":"शौचालय के बाद खाना संभालने वाले कर्मचारियों को हाथ क्यों धोने चाहिए?","bn":"টয়লেট ব্যবহারের পর খাবার পরিচালনাকারীদের কেন হাত ধোয়া উচিত?","id":"Mengapa penjamah makanan harus mencuci tangan setelah dari toilet?","ne":"खाना ह्यान्डल गर्ने व्यक्तिले शौचालय प्रयोग गरेपछि किन हात धुनुपर्छ?"},"o":{"ar":["لتقليل الروائح فقط في المكان","لأن ماء المرحاض دافئ دائماً ويقتل الجراثيم","لإزالة الجراثيم التي يمكن أن تنتقل إلى الطعام","فقط لأن المشرف يطلبه كتابياً"],"en":["To make the hands look cleaner for customers","Because toilet water is always warm enough to kill germs","To remove germs that can spread to food","Only because the supervisor requires it on paper"],"hi":["ग्राहकों को हाथ साफ़ दिखाने के लिए","क्योंकि शौचालय का पानी हमेशा गर्म होता है और कीटाणु मार देता है","कीटाणु हटाने के लिए जो खाने तक फैल सकते हैं","सिर्फ़ इसलिए कि सुपरवाइज़र काग़ज़ पर इसकी माँग करते हैं"],"bn":["গ্রাহকদের হাত পরিষ্কার দেখাতে","কারণ টয়লেটের পানি সবসময় গরম থাকে ও জীবাণু মারে","জীবাণু দূর করতে যা খাবারে ছড়িয়ে পড়তে পারে","শুধু সুপারভাইজার লিখিতভাবে চান বলে"],"id":["Agar tangan terlihat lebih bersih bagi pelanggan","Karena air toilet selalu cukup panas untuk membunuh kuman","Untuk menghilangkan kuman yang bisa menyebar ke makanan","Hanya karena pengawas memintanya secara tertulis"],"ne":["ग्राहकका लागि हात सफा देखिन","किनभने शौचालयको पानी सधैं जीवाणु मार्न पर्याप्त न्यानो हुन्छ","खानामा फैलन सक्ने जीवाणु हटाउन","केवल सुपरवाइजरले कागजमा माग गरेको हुनाले"]},"c":2},
 {"cat":{"en":"Chemical safety","ar":"سلامة المواد الكيميائية","hi":"रासायनिक सुरक्षा","bn":"রাসায়নিক নিরাপত্তা","id":"Keamanan bahan kimia","ne":"रासायनिक सुरक्षा"},"q":{"en":"How should cleaning chemicals be stored?","ar":"كيف يجب تخزين مواد التنظيف؟","hi":"सफ़ाई के रसायन कैसे रखे जाने चाहिए?","bn":"পরিষ্কারের রাসায়নিক কীভাবে রাখা উচিত?","id":"Bagaimana bahan pembersih seharusnya disimpan?","ne":"सफाई रसायन कसरी भण्डारण गर्नुपर्छ?"},"o":{"ar":["في زجاجات مشروبات فارغة على الرف فوق طاولة التحضير","بجانب الخضروات الطازجة حتى يجدها الموظفون بسرعة","في عبوات بلا بيانات قرب منطقة التقديم","في عبواتها الأصلية المكتوبة بعيداً عن الطعام"],"en":["In empty drink bottles on the shelf above the prep table","Beside the fresh vegetables so staff can find them quickly","In unmarked containers near the serving area","In their original labelled containers, away from food"],"hi":["तैयारी मेज़ के ऊपर की शेल्फ़ पर खाली पेय की बोतलों में","ताज़ी सब्ज़ियों के बगल में, ताकि स्टाफ़ जल्दी ढूँढ सके","परोसने वाले क्षेत्र के पास बिना लेबल के डिब्बों में","मूल लेबल वाले डिब्बों में, खाने से दूर"],"bn":["প্রস্তুতির টেবিলের উপরের তাকে খালি পানীয়ের বোতলে","তাজা সবজির পাশে, যাতে কর্মীরা দ্রুত খুঁজে পান","পরিবেশন এলাকার কাছে লেবেল ছাড়া পাত্রে","মূল লেবেলযুক্ত পাত্রে, খাবার থেকে দূরে"],"id":["Dalam botol minuman kosong di rak atas meja persiapan","Di samping sayuran segar agar staf cepat menemukannya","Dalam wadah tanpa label di dekat area penyajian","Dalam wadah asli yang berlabel, jauh dari makanan"],"ne":["तयारी टेबुलमाथिको सेल्फमा खाली पेय बोतलमा","ताजा तरकारीको छेउमा ताकि कर्मचारीले छिटो फेला पारून्","सेवा क्षेत्रनजिक लेबल नभएका भाँडामा","तिनीहरूको मूल लेबल भएको भाँडामा, खानाबाट टाढा"]},"c":3},
 {"cat":{"en":"Illness and food safety","ar":"المرض وسلامة الطعام","hi":"बीमारी और खाद्य सुरक्षा","bn":"অসুস্থতা ও খাদ্য নিরাপত্তা","id":"Penyakit dan keamanan pangan","ne":"रोग र खाद्य सुरक्षा"},"q":{"en":"Why must a food handler with a fever stay away from food work?","ar":"لماذا يجب أن يبتعد العامل المصاب بالحمى عن العمل في الطعام؟","hi":"बुखार वाले खाना संभालने वाले कर्मचारी को खाने के काम से दूर क्यों रहना चाहिए?","bn":"জ্বরে আক্রান্ত খাবার পরিচালনাকারীকে খাবারের কাজ থেকে কেন দূরে থাকতে হবে?","id":"Mengapa penjamah makanan yang demam harus menjauh dari pekerjaan makanan?","ne":"ज्वरो भएको खाना ह्यान्डलरले खाना काममा किन टाढा रहनुपर्छ?"},"o":{"ar":["لأن المرض يمكن أن ينتقل إلى الطعام والزبائن","لأن الحمى تجعل اليدين جافتين ومتشققتين مما يؤثر على النظافة","لأن الحمى تعني دائماً إقامة طويلة في المستشفى للعامل","لأن العامل المصاب بالحمى لا يُسمح له بلبس الزي الرسمي"],"en":["Because the illness can spread to food and customers","Because fever makes the hands dry and cracked, which affects hygiene","Because a fever always means a long hospital stay for the worker","Because workers with fever are not allowed to wear uniforms"],"hi":["क्योंकि बीमारी खाने और ग्राहकों तक फैल सकती है","क्योंकि बुखार से हाथ सूखकर फट जाते हैं, जिससे स्वच्छता पर असर पड़ता है","क्योंकि बुखार का मतलब हमेशा कर्मचारी का लंबे समय तक अस्पताल में रहना है","क्योंकि बुखार वाले कर्मचारियों को वर्दी पहनने की अनुमति नहीं होती"],"bn":["কারণ অসুস্থতা খাবার ও গ্রাহকদের মধ্যে ছড়াতে পারে","কারণ জ্বরে হাত শুকিয়ে ফেটে যায়, যা পরিচ্ছন্নতায় প্রভাব ফেলে","কারণ জ্বর মানেই কর্মীর দীর্ঘ সময় হাসপাতালে থাকা","কারণ জ্বরে আক্রান্ত কর্মীদের ইউনিফর্ম পরতে দেওয়া হয় না"],"id":["Karena penyakit dapat menular ke makanan dan pelanggan","Karena demam membuat tangan kering dan pecah-pecah sehingga kebersihan terganggu","Karena demam selalu berarti pekerja harus dirawat lama di rumah sakit","Karena pekerja yang demam tidak boleh memakai seragam"],"ne":["किनभने रोग खाना र ग्राहकमा फैलन सक्छ","किनभने ज्वरोले हात सुक्खा र चिरिने बनाउँछ, जसले सफाइमा असर गर्छ","किनभने ज्वरो भएको मानिसलाई सधैं लामो अस्पताल बसाइ आवश्यक हुन्छ","किनभने ज्वरो भएका कामदारलाई पोशाक लगाउन अनुमति छैन"]},"c":0},
 {"cat":{"en":"Temperature control","ar":"التحكم في الحرارة","hi":"तापमान नियंत्रण","bn":"তাপমাত্রা নিয়ন্ত্রণ","id":"Kontrol suhu","ne":"तापक्रम नियन्त्रण"},"q":{"en":"As a general rule, how long can perishable food stay at room temperature before it must be discarded?","ar":"كقاعدة عامة، كم من الوقت يمكن أن يبقى الطعام سريع التلف في حرارة الغرفة قبل التخلص منه؟","hi":"सामान्य नियम के अनुसार, खराब होने वाला खाना कमरे के तापमान पर कितनी देर रह सकता है, फिर उसे फेंकना होगा?","bn":"সাধারণ নিয়ম অনুযায়ী, পচনশীল খাবার ঘরের তাপমাত্রায় কতক্ষণ রাখা যায়, তারপর ফেলে দিতে হবে?","id":"Secara umum, berapa lama makanan yang mudah rusak boleh berada di suhu ruang sebelum harus dibuang?","ne":"सामान्य नियमअनुसार, बिग्रिने खाना फाल्नु अघि कोठाको तापक्रममा कति समयसम्म राख्न सकिन्छ?"},"o":{"ar":["٦ ساعات إجمالاً","ساعتين إجمالاً","٢٤ ساعة إجمالاً","طالما هو مغطى"],"en":["6 hours in total","2 hours in total","24 hours in total","As long as it is covered"],"hi":["कुल 6 घंटे","कुल 2 घंटे","कुल 24 घंटे","जब तक ढका हो तब तक"],"bn":["মোট ৬ ঘণ্টা","মোট ২ ঘণ্টা","মোট ২৪ ঘণ্টা","যতক্ষণ ঢাকা থাকে ততক্ষণ"],"id":["Total 6 jam","Total 2 jam","Total 24 jam","Selama tertutup"],"ne":["कुल 6 घण्टा","कुल 2 घण्टा","कुल 24 घण्टा","ढाकिएको भए जतिसुकै समय"]},"c":1},
 {"cat":{"en":"Personal hygiene","ar":"النظافة الشخصية","hi":"व्यक्तिगत स्वच्छता","bn":"ব্যক্তিগত পরিচ্ছন্নতা","id":"Higiene pribadi","ne":"व्यक्तिगत सरसफाइ"},"q":{"en":"Why should a food handler not touch ready-to-eat food with bare hands?","ar":"لماذا لا يجب أن يلمس العامل الطعام الجاهز للأكل بيدين عاريتين؟","hi":"खाना संभालने वाले कर्मचारी को तैयार खाने को खाली हाथ से क्यों नहीं छूना चाहिए?","bn":"খাবার পরিচালনাকারী কেন তৈরি খাবার খালি হাতে ছোঁবেন না?","id":"Mengapa penjamah makanan tidak boleh menyentuh makanan siap saji dengan tangan kosong?","ne":"खाना ह्यान्डलरले तयार खानालाई नाङ्गो हातले किन छुनु हुँदैन?"},"o":{"ar":["لأن اليد العارية دائماً أوسخ من القفاز في كل الحالات","لأن غسل اليدين قبل بدء كل وردية يستغرق وقتاً أطول","لأن اليد قد تنقل الجراثيم إلى طعام لن يُطبخ مرة أخرى","لأن الزبائن قد يرون اليدين ويشعرون بعدم الارتياح هناك"],"en":["Because bare hands are always dirtier than gloves in every situation","Because it takes more time to wash the hands before each shift starts","Because hands can carry germs onto food that will not be cooked again","Because customers can see the hands and may feel uncomfortable there"],"hi":["क्योंकि खाली हाथ हर हाल में दस्ताने से ज़्यादा गंदे होते हैं","क्योंकि हर शिफ़्ट शुरू होने से पहले हाथ धोने में ज़्यादा समय लगता है","क्योंकि हाथ से कीटाणु उस खाने तक जा सकते हैं जिसे दोबारा पकाया नहीं जाएगा","क्योंकि ग्राहक वहाँ हाथों को देख सकते हैं और असहज महसूस कर सकते हैं"],"bn":["কারণ খালি হাত সব পরিস্থিতিতে গ্লাভসের চেয়ে বেশি নোংরা থাকে","কারণ প্রতিটি শিফট শুরুর আগে হাত ধুতে বেশি সময় লাগে","কারণ হাত থেকে জীবাণু এমন খাবারে যেতে পারে যা আর রান্না করা হবে না","কারণ গ্রাহকরা সেখানে হাত দেখতে পারেন এবং অস্বস্তি বোধ করতে পারেন"],"id":["Karena tangan dapat membawa kuman ke makanan yang tidak akan dimasak lagi","Karena tangan kosong selalu lebih kotor daripada sarung tangan dalam segala kondisi","Karena mencuci tangan sebelum setiap shift membutuhkan waktu lebih lama","Karena pelanggan dapat melihat tangan dan merasa tidak nyaman di sana"],"ne":["किनभने नाङ्गो हात हरेक अवस्थामा पञ्जाभन्दा सधैं फोहोर हुन्छ","किनभने हरेक सिफ्ट सुरु हुनु अघि हात धुन बढी समय लाग्छ","किनभने हातले जीवाणु बोक्न सक्छ, जसले फेरि पकाइने छैन भन्ने खानामा पुग्न सक्छ","किनभने ग्राहकले हात देख्न सक्छन् र त्यहाँ असहज महसुस गर्न सक्छन्"]},"c":2},
 {"cat":{"en":"Food spoilage","ar":"فساد الطعام","hi":"खाना खराब होना","bn":"খাবার নষ্ট হওয়া","id":"Pembusukan makanan","ne":"खाना बिग्रने"},"q":{"en":"Which is a clear sign that food has spoiled?","ar":"ما العلامة الواضحة على أن الطعام قد فسد؟","hi":"खाना खराब होने का साफ़ संकेत कौन-सा है?","bn":"খাবার নষ্ট হওয়ার স্পষ্ট লক্ষণ কোনটি?","id":"Mana tanda yang jelas bahwa makanan telah rusak?","ne":"खाना बिग्रिएको स्पष्ट संकेत कुन हो?"},"o":{"ar":["لون أغمق قليلاً من نفس لون الطعام","ملصق مطبوع بخط باهت","عبوة باردة عند لمسها مباشرة من الثلاجة","رائحة حامضة أو غريبة، أو سطح لزج، أو تغير في اللون"],"en":["A slightly darker shade of the same food colour","A label that is printed in a faded font","Packaging that is cold to touch straight from the fridge","A sour or off smell, slimy surface, or changed colour"],"hi":["वही खाने के रंग का थोड़ा गहरा शेड","फीके फ़ॉन्ट में छपा लेबल","फ़्रिज से सीधे निकलने पर ठंडी लगने वाली पैकिंग","खट्टी या अजीब गंध, चिपचिपी सतह, या रंग बदलना"],"bn":["একই খাবারের রঙের একটু গাঢ় শেড","ফ্যাকাশে ফন্টে ছাপা লেবেল","ফ্রিজ থেকে সরাসরি নিলে ঠান্ডা লাগা প্যাকেট","টক বা অদ্ভুত গন্ধ, পিচ্ছিল তল, বা রঙের পরিবর্তন"],"id":["Warna sedikit lebih gelap dari warna makanan yang sama","Label yang dicetak dengan huruf pudar","Kemasan yang terasa dingin saat langsung diambil dari kulkas","Bau asam atau tidak wajar, permukaan berlendir, atau warna berubah"],"ne":["उही खानाको रङको अलिकति गाढा छाँया","छापिएको लेबलको फिका अक्षर","फ्रिजबाट सिधै निकालेको प्याकेजिङ छुँदा चिसो हुनु","अमिलो वा अनौठो गन्ध, चिप्लो सतह, वा रङ परिवर्तन"]},"c":3},
 {"cat":{"en":"Personal hygiene","ar":"النظافة الشخصية","hi":"व्यक्तिगत स्वच्छता","bn":"ব্যক্তিগত পরিচ্ছন্নতা","id":"Higiene pribadi","ne":"व्यक्तिगत सरसफाइ"},"q":{"en":"What should a food handler do after handling raw eggs?","ar":"ماذا يجب أن يفعل العامل بعد التعامل مع البيض النيء؟","hi":"कच्चे अंडे संभालने के बाद कर्मचारी को क्या करना चाहिए?","bn":"কাঁচা ডিম ধরার পর খাবার পরিচালনাকারীর কী করা উচিত?","id":"Apa yang harus dilakukan penjamah makanan setelah menangani telur mentah?","ne":"काँचो अण्डा ह्यान्डल गरेपछि खाना ह्यान्डलरले के गर्नुपर्छ?"},"o":{"ar":["غسل اليدين بالصابون قبل لمس الطعام الجاهز للأكل","مسح اليدين بالمريلة لأنه أسرع ثم متابعة العمل","شطف اليدين بالماء البارد فقط ومتابعة المهمة التالية","الانتظار حتى نهاية الوردية لغسل اليدين جيداً"],"en":["Wash hands with soap before touching ready-to-eat food","Wipe hands on the apron, which is faster, and then continue working","Rinse hands with cold water only and continue with the next task","Wait until the end of the shift to wash the hands properly"],"hi":["तैयार खाने को छूने से पहले साबुन से हाथ धोना","एप्रन से हाथ पोंछना, क्योंकि यह तेज़ है, फिर काम जारी रखना","केवल ठंडे पानी से हाथ धोकर अगला काम जारी रखना","शिफ़्ट के अंत तक रुककर फिर ठीक से हाथ धोना"],"bn":["তৈরি খাবার ছোঁয়ার আগে সাবান দিয়ে হাত ধোয়া","অ্যাপ্রনে হাত মুছে নেওয়া, কারণ এটি দ্রুত, তারপর কাজ চালানো","শুধু ঠান্ডা পানিতে হাত ধুয়ে পরের কাজ চালিয়ে যাওয়া","শিফটের শেষ পর্যন্ত অপেক্ষা করে তারপর ভালো করে হাত ধোয়া"],"id":["Mencuci tangan dengan sabun sebelum menyentuh makanan siap saji","Mengelap tangan di celemek karena lebih cepat, lalu lanjut bekerja","Membilas tangan hanya dengan air dingin lalu lanjut tugas berikutnya","Menunggu sampai akhir shift baru mencuci tangan dengan benar"],"ne":["तयार खाना छुनु अघि साबुनले हात धुने","एप्रनमा हात पुछ्ने, जुन छिटो हुन्छ, र त्यसपछि काम जारी राख्ने","केवल चिसो पानीले हात पखालेर अर्को काम जारी राख्ने","सिफ्टको अन्त्यसम्म पर्खेर हात राम्रोसँग धुने"]},"c":0},
 {"cat":{"en":"Storage","ar":"التخزين","hi":"भंडारण","bn":"সংরক্ষণ","id":"Penyimpanan","ne":"भण्डारण"},"q":{"en":"Which order is correct for storing items in a fridge, from top to bottom?","ar":"ما الترتيب الصحيح لتخزين الأصناف في الثلاجة من الأعلى إلى الأسفل؟","hi":"फ़्रिज में चीज़ें ऊपर से नीचे किस क्रम में रखनी चाहिए?","bn":"ফ্রিজে উপর থেকে নিচে জিনিস সাজানোর সঠিক ক্রম কোনটি?","id":"Urutan mana yang benar untuk menyimpan barang di kulkas, dari atas ke bawah?","ne":"फ्रिजमा सामान माथिबाट तलसम्म राख्ने सही क्रम कुन हो?"},"o":{"ar":["الدواجن النيئة على الرف العلوي، والطعام الجاهز للأكل في أسفل الثلاجة","الطعام الجاهز للأكل في الأعلى، ثم اللحم النيء، والدواجن النيئة في الأسفل","اللحم النيء على الرف العلوي، والطعام الجاهز للأكل في أسفل الثلاجة","أي ترتيب مقبول طالما أن الثلاجة تبدو نظيفة وأن الباب مغلق"],"en":["Raw poultry on the top shelf, with ready-to-eat food stored at the bottom of the fridge","Ready-to-eat food on top, then raw meat, and raw poultry at the bottom","Raw meat on the top shelf, with ready-to-eat food stored at the bottom of the fridge","Any order is fine as long as the fridge looks clean and the door stays closed"],"hi":["सबसे ऊपर की शेल्फ़ पर कच्चा पोल्ट्री, और फ़्रिज के सबसे नीचे तैयार खाना रखा जाए","सबसे ऊपर तैयार खाना, फिर कच्चा मांस, और सबसे नीचे कच्चा पोल्ट्री","सबसे ऊपर की शेल्फ़ पर कच्चा मांस, और फ़्रिज के सबसे नीचे तैयार खाना रखा जाए","कोई भी क्रम चलेगा, बस फ़्रिज साफ़ दिखे और दरवाज़ा बंद रहे"],"bn":["উপরের তাকে কাঁচা পোল্ট্রি, আর ফ্রিজের নিচে তৈরি খাবার রাখা হবে","উপরে তৈরি খাবার, তারপর কাঁচা মাংস, এবং নিচে কাঁচা পোল্ট্রি","উপরের তাকে কাঁচা মাংস, আর ফ্রিজের নিচে তৈরি খাবার রাখা হবে","যেকোনো ক্রম চলবে, শুধু ফ্রিজ পরিষ্কার দেখালে ও দরজা বন্ধ থাকলে"],"id":["Unggas mentah di rak atas, dengan makanan siap saji disimpan di bagian bawah kulkas","Makanan siap saji di atas, lalu daging mentah, dan unggas mentah di bawah","Daging mentah di rak atas, dengan makanan siap saji disimpan di bagian bawah kulkas","Urutan apa pun boleh asalkan kulkas terlihat bersih dan pintunya tertutup"],"ne":["काँचो कुखुरा माथिल्लो सेल्फमा, र तयार खाना फ्रिजको तल्लो भागमा","तयार खाना माथि, त्यसपछि काँचो मासु, र काँचो कुखुरा तल","काँचो मासु माथिल्लो सेल्फमा, र तयार खाना फ्रिजको तल्लो भागमा","फ्रिज सफा देखिए र ढोका बन्द भए जुनसुकै क्रम मिल्छ"]},"c":1},
 {"cat":{"en":"Cleaning and spills","ar":"التنظيف والانسكابات","hi":"सफ़ाई और फैलाव","bn":"পরিষ্কার ও ছড়ানো","id":"Kebersihan dan tumpahan","ne":"सफाई र फैलिएको पदार्थ"},"q":{"en":"What should be used to clean a small spill of raw meat juice on the floor?","ar":"بماذا يجب تنظيف انسكاب صغير لعصارة اللحم النيء على الأرض؟","hi":"फ़र्श पर कच्चे मांस के रस के छोटे फैलाव को किससे साफ़ करना चाहिए?","bn":"মেঝেতে কাঁচা মাংসের রসের ছোট ছড়ানো অংশ কী দিয়ে পরিষ্কার করা উচিত?","id":"Apa yang sebaiknya digunakan untuk membersihkan tumpahan kecil cairan daging mentah di lantai?","ne":"भुइँमा काँचो मासुको रसको सानो फैलावट सफा गर्न के प्रयोग गर्नुपर्छ?"},"o":{"ar":["ممسحة جافة فقط، لأن الماء ينشر العصارة أكثر على الأرض","نشارة خشب تُترك على الأرض حتى نهاية الوردية كلها","مناديل قابلة للتخلص منها ومنظف، ثم تعقيم المكان","صب الزيت الساخن على الانسكاب لإزالة الرائحة"],"en":["A dry mop only, since water spreads the juice further across the floor","Sawdust left on the floor until the end of the shift is finished","Disposable cloths and detergent, then sanitizing the area","Pouring hot oil over the spill, which helps remove the smell"],"hi":["केवल सूखा पोंछा, क्योंकि पानी रस को फ़र्श पर और ज़्यादा फैला देता है","फ़र्श पर शिफ़्ट के अंत तक छोड़ा गया बुरादा","डिस्पोज़ेबल कपड़े और डिटर्जेंट, फिर जगह को सैनिटाइज़ करना","बदबू हटाने के लिए गिरे हुए रस पर गर्म तेल डालना"],"bn":["শুধু শুকনো মপ, কারণ পানি রস মেঝে জুড়ে আরও ছড়ায়","মেঝেতে শিফটের শেষ পর্যন্ত রাখা করাতের গুঁড়ো","ডিসপোজেবল কাপড় ও ডিটারজেন্ট, তারপর জায়গাটি জীবাণুমুক্ত করা","গন্ধ দূর করতে পড়া রসে গরম তেল ঢালা"],"id":["Hanya pel kering, karena air akan menyebarkan cairan lebih jauh di lantai","Serbuk gergaji yang dibiarkan di lantai sampai akhir shift","Lap sekali pakai dan deterjen, lalu sanitasi area tersebut","Menuangkan minyak panas ke tumpahan agar baunya hilang"],"ne":["केवल सुख्खा मप, किनभने पानीले रस भुइँभरि फैलाउँछ","काम सिफ्टको अन्त्यसम्म भुइँमा छोडिएको भुस","फोहोर उठाउने कपडा र डिटर्जेन्ट, त्यसपछि क्षेत्रको कीटाणुशोधन","भुइँमा तातो तेल खन्याउने, जसले गन्ध हटाउन मद्दत गर्छ"]},"c":2},
 {"cat":{"en":"Logic","ar":"منطق","hi":"तर्क","bn":"যুক্তি","id":"Logika","ne":"तर्क"},"q":{"en":"All cooked dishes in this kitchen are covered. This dish is not covered. What can be concluded?","ar":"كل الأطباق المطبوخة في هذا المطبخ مغطاة. هذا الطبق غير مغطى. ماذا نستنتج؟","hi":"इस रसोई के सभी पके व्यंजन ढके हुए हैं। यह व्यंजन ढका हुआ नहीं है। क्या निष्कर्ष निकलता है?","bn":"এই রান্নাঘরের সব রান্না করা খাবার ঢাকা থাকে। এই খাবারটি ঢাকা নেই। কী সিদ্ধান্ত নেওয়া যায়?","id":"Semua hidangan matang di dapur ini ditutup. Hidangan ini tidak ditutup. Apa kesimpulannya?","ne":"यस भान्सामा सबै पकाएका परिकार ढाकिएका छन्। यो परिकार ढाकिएको छैन। के निष्कर्ष निकाल्न सकिन्छ?"},"o":{"ar":["هذا الطبق مطبوخ بالتأكيد","هذا الطبق قد يكون مطبوخاً لأن التغطية اختيارية","هذا الطبق كان مغطى سابقاً ثم أزيل الغطاء","هذا الطبق ليس طبقاً مطبوخاً في هذا المطبخ"],"en":["This dish is definitely cooked","This dish may be cooked, since covering is optional","This dish was covered earlier and then removed","This dish is not a cooked dish in this kitchen"],"hi":["यह व्यंजन निश्चित रूप से पका हुआ है","यह पका हुआ हो सकता है, क्योंकि ढकना वैकल्पिक है","यह पहले ढका था और फिर ढक्कन हटा दिया गया","इस रसोई में यह पका हुआ व्यंजन नहीं है"],"bn":["এই খাবারটি নিশ্চিতভাবে রান্না করা","এটি রান্না করা হতে পারে, কারণ ঢাকা দেওয়া ঐচ্ছিক","আগে এটি ঢাকা ছিল, তারপর খুলে ফেলা হয়েছে","এই রান্নাঘরে এটি রান্না করা খাবার নয়"],"id":["Hidangan ini pasti sudah dimasak","Hidangan ini mungkin sudah dimasak, karena menutup itu opsional","Hidangan ini tadinya ditutup lalu tutupnya dibuka","Hidangan ini bukan hidangan matang di dapur ini"],"ne":["यो परिकार निश्चित रूपमा पकाइएको हो","यो परिकार पकाइएको हुन सक्छ, किनभने ढाक्नु ऐच्छिक हो","यो परिकार पहिले ढाकिएको थियो र त्यसपछि हटाइयो","यो परिकार यस भान्सामा पकाइएको परिकार होइन"]},"c":3},
 {"cat":{"en":"Calculation","ar":"حساب","hi":"गणना","bn":"হিসাব","id":"Perhitungan","ne":"गणना"},"q":{"en":"A recipe needs 3 kg of rice for 12 portions. How much rice is needed for 20 portions?","ar":"وصفة تحتاج ٣ كغ أرز لـ ١٢ حصة. كم كيلو أرز نحتاج لـ ٢٠ حصة؟","hi":"एक नुस्खे में 12 भागों के लिए 3 किग्रा चावल चाहिए। 20 भागों के लिए कितना चावल चाहिए?","bn":"একটি রেসিপিতে ১২ পরিবেশনের জন্য ৩ কেজি চাল লাগে। ২০ পরিবেশনের জন্য কত চাল লাগবে?","id":"Sebuah resep membutuhkan 3 kg beras untuk 12 porsi. Berapa kg beras untuk 20 porsi?","ne":"एक रेसिपीमा 12 जनाका लागि 3 kg चामल चाहिन्छ। 20 जनाका लागि कति चामल चाहिन्छ?"},"o":{"ar":["٥ كغ","٤ كغ","٦ كغ","٨ كغ"],"en":["5 kg","4 kg","6 kg","8 kg"],"hi":["5 किग्रा","4 किग्रा","6 किग्रा","8 किग्रा"],"bn":["৫ কেজি","৪ কেজি","৬ কেজি","৮ কেজি"],"id":["5 kg","4 kg","6 kg","8 kg"],"ne":["5 kg","4 kg","6 kg","8 kg"]},"c":0},
 {"cat":{"en":"Calculation","ar":"حساب","hi":"गणना","bn":"হিসাব","id":"Perhitungan","ne":"गणना"},"q":{"en":"A tray holds 6 portions. How many trays are needed for 50 portions?","ar":"الصينية تتسع لـ ٦ حصص. كم صينية نحتاج لـ ٥٠ حصة؟","hi":"एक ट्रे में 6 भाग आते हैं। 50 भागों के लिए कितनी ट्रे चाहिए?","bn":"একটি ট্রেতে ৬ পরিবেশন ধরে। ৫০ পরিবেশনের জন্য কতটি ট্রে লাগবে?","id":"Satu nampan memuat 6 porsi. Berapa nampan dibutuhkan untuk 50 porsi?","ne":"एउटा ट्रेमा 6 भाग अटाउँछ। 50 भागका लागि कति ट्रे चाहिन्छ?"},"o":{"ar":["٨ صواني","٩ صواني","١٠ صواني","١٢ صينية"],"en":["8 trays","9 trays","10 trays","12 trays"],"hi":["8 ट्रे","9 ट्रे","10 ट्रे","12 ट्रे"],"bn":["৮টি","৯টি","১০টি","১২টি"],"id":["8 nampan","9 nampan","10 nampan","12 nampan"],"ne":["8 ट्रे","9 ट्रे","10 ट्रे","12 ट्रे"]},"c":1},
 {"cat":{"en":"Prioritizing","ar":"ترتيب الأولويات","hi":"प्राथमिकता","bn":"অগ্রাধিকার","id":"Prioritas","ne":"प्राथमिकता निर्धारण"},"q":{"en":"A delivery arrives, a fridge alarm sounds, and a customer is waiting. What is the first action?","ar":"وصل توريد، وانطلق إنذار الثلاجة، والزبون ينتظر. ما الإجراء الأول؟","hi":"डिलीवरी आई है, फ़्रिज का अलार्म बज रहा है, और एक ग्राहक इंतज़ार कर रहा है। पहला कदम क्या है?","bn":"ডেলিভারি এসেছে, ফ্রিজের অ্যালার্ম বাজছে, আর একজন গ্রাহক অপেক্ষা করছেন। প্রথম কাজ কী?","id":"Pengiriman datang, alarm kulkas berbunyi, dan pelanggan sedang menunggu. Apa tindakan pertama?","ne":"एक डेलिभरी आइपुग्छ, फ्रिजको अलार्म बज्छ, र एक ग्राहक पर्खिरहेका छन्। पहिलो कार्य के हो?"},"o":{"ar":["خدمة الزبون أولاً قبل أي شيء آخر حتى يبقى راضياً","توقيع إشعار التوريد وإنهاء الأوراق","فحص حرارة الثلاجة ونقل الطعام إذا لزم الأمر","تنظيف منطقة التوريد قبل فحص الثلاجة"],"en":["Serve the customer first before anything else, to keep them happy","Sign the delivery note and finish the paperwork","Check the fridge temperature and move food if needed","Clean the delivery area before checking the fridge"],"hi":["किसी भी चीज़ से पहले ग्राहक को सेवा दें","डिलीवरी नोट पर दस्तखत करें और कागज़ात पूरे करें","फ़्रिज का तापमान जाँचें और ज़रूरत हो तो खाना हटाएँ","फ़्रिज जाँचने से पहले डिलीवरी क्षेत्र साफ़ करें"],"bn":["আগে গ্রাহককে সেবা দেওয়া","ডেলিভারি নোটে সই করা ও কাগজপত্র শেষ করা","ফ্রিজের তাপমাত্রা দেখা এবং প্রয়োজনে খাবার সরানো","ফ্রিজ দেখার আগে ডেলিভারি এলাকা পরিষ্কার করা"],"id":["Melayani pelanggan dulu sebelum hal lain","Menandatangani surat jalan dan menyelesaikan administrasi","Memeriksa suhu kulkas dan memindahkan makanan jika perlu","Membersihkan area pengiriman sebelum memeriksa kulkas"],"ne":["अरू केही गर्नु अघि ग्राहकलाई पहिले सेवा दिने, खुसी राख्न","डेलिभरी नोट हस्ताक्षर गरेर कागजात सिध्याउने","फ्रिजको तापक्रम जाँच गर्ने र आवश्यक परे खाना सार्ने","फ्रिज जाँच गर्नु अघि डेलिभरी क्षेत्र सफा गर्ने"]},"c":2},
 {"cat":{"en":"Reasoning","ar":"استنتاج","hi":"तर्कशक्ति","bn":"যুক্তি","id":"Penalaran","ne":"तार्किक सोच"},"q":{"en":"Ahmed finishes before Sara. Sara finishes before Omar. Who finishes first?","ar":"أحمد ينتهي قبل سارة. سارة تنتهي قبل عمر. من ينتهي أولاً؟","hi":"अहमद, सारा से पहले खत्म करता है। सारा, उमर से पहले खत्म करती है। सबसे पहले कौन खत्म करता है?","bn":"আহমদ সারার আগে শেষ করে। সারা উমরের আগে শেষ করে। প্রথম কে শেষ করে?","id":"Ahmed selesai sebelum Sara. Sara selesai sebelum Omar. Siapa yang selesai paling awal?","ne":"अहमद सारा भन्दा अघि सक्छन्। सारा ओमर भन्दा अघि सक्छिन्। पहिले कसले सक्छ?"},"o":{"ar":["سارة","عمر","لا يمكن تحديد ذلك","أحمد"],"en":["Sara","Omar","It cannot be determined","Ahmed"],"hi":["सारा","उमर","यह तय नहीं किया जा सकता","अहमद"],"bn":["সারা","উমর","এটি নির্ধারণ করা যায় না","আহমদ"],"id":["Sara","Omar","Tidak dapat ditentukan","Ahmed"],"ne":["सारा","ओमर","निर्धारण गर्न सकिँदैन","अहमद"]},"c":3},

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ───── QUIZ FLOW ─────
function startQuiz() {
  empName = document.getElementById('emp-name').value.trim();
  const err = document.getElementById('name-error');
  if (!empName) {
    err.textContent = T[lang].enterName;
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';
  const codeErr = document.getElementById('code-error');
  if (document.getElementById('test-code').value.trim() !== TEST_CODE) {
    codeErr.textContent = CODE_T[lang].err;
    codeErr.style.display = 'block';
    return;
  }
  codeErr.style.display = 'none';
  // 50 questions: 10 food-safety MC, 10 reasoning MC, 10 true/false, 10 ordering, 10 matching.
  // Options are shuffled per employee so the answer position changes.
  const REASONING_CATS = ['Logic', 'Calculation', 'Prioritizing', 'Reasoning'];
  const isTF = i => !!BANK[i].tf;
  const isOrd = i => !!BANK[i].ordering;
  const isMatch = i => !!BANK[i].matching;
  const isReasoning = i => REASONING_CATS.includes(BANK[i].cat.en);
  const allIdx = BANK.map((_, i) => i);
  const mcIdx = allIdx.filter(i => !isTF(i) && !isOrd(i) && !isMatch(i));
  const TF_COUNT = 10, ORD_COUNT = 10, REASON_COUNT = 10, MATCH_COUNT = 10;
  const reasoningPick = shuffle(mcIdx.filter(isReasoning)).slice(0, REASON_COUNT);
  const healthPick = shuffle(mcIdx.filter(i => !isReasoning(i))).slice(0, QUIZ_LENGTH - TF_COUNT - ORD_COUNT - REASON_COUNT - MATCH_COUNT);
  const tfPick = shuffle(allIdx.filter(isTF)).slice(0, TF_COUNT);
  const ordPick = shuffle(allIdx.filter(isOrd)).slice(0, ORD_COUNT);
  const matchPick = shuffle(allIdx.filter(isMatch)).slice(0, MATCH_COUNT);
  const picked60 = shuffle(reasoningPick.concat(healthPick, tfPick, ordPick, matchPick));
  quiz = picked60.map(qi => {
    if (isOrd(qi)) {
      // Steps are shown in a shuffled order; the employee gives each one a rank 1-4.
      return { qi, order: shuffle([0, 1, 2, 3]), ordering: true, correctPos: null };
    }
    if (isMatch(qi)) {
      // Right-hand items are shown in a shuffled order; order[k] = which pair's right item is shown in slot k.
      return { qi, order: shuffle([0, 1, 2, 3]), matching: true, correctPos: null };
    }
    const order = shuffle(BANK[qi].o.ar.map((_, k) => k));
    return { qi, order, correctPos: order.indexOf(BANK[qi].c) };
  });
  currentQ = 0;
  score = 0;
  picked = null;
  answers = quiz.map(it => (it.ordering || it.matching) ? [null, null, null, null] : null);
  matchSel = null;
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion() {
  picked = answers[currentQ] ?? null;
  const item = quiz[currentQ];
  const bq = BANK[item.qi];
  const total = quiz.length;
  document.getElementById('emp-display').textContent = T[lang].empOf + ' ' + empName;
  document.getElementById('progress-fill').style.width = Math.round((currentQ / total) * 100) + '%';
  document.getElementById('q-counter').textContent = (currentQ + 1) + ' / ' + total;
  document.getElementById('q-cat').textContent = bq.cat[lang];
  document.getElementById('q-text').textContent = bq.q[lang];

  const labels = lang === 'ar' ? ['أ','ب','ج','د'] : ['A','B','C','D'];
  const opts = bq.o[lang];
  const wrap = document.getElementById('options');
  wrap.innerHTML = '';
  if (item.matching) {
    renderMatch(item, bq);
  } else if (item.ordering) {
    // item.order[k] is the step shown in row k; answers[currentQ][k] is the rank (1-4) the employee gave it.
    item.order.forEach((stepIdx, k) => {
      const row = document.createElement('div');
      row.className = 'ord-row';
      const txt = document.createElement('div');
      txt.className = 'ord-text';
      txt.textContent = opts[stepIdx];
      row.appendChild(txt);
      const ranks = document.createElement('div');
      ranks.className = 'ord-ranks';
      [1, 2, 3, 4].forEach(n => {
        const b = document.createElement('button');
        b.className = 'num-btn' + (answers[currentQ][k] === n ? ' picked' : '');
        b.textContent = n;
        b.addEventListener('click', () => setRank(k, n));
        ranks.appendChild(b);
      });
      row.appendChild(ranks);
      wrap.appendChild(row);
    });
  } else item.order.forEach((origIdx, pos) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn' + (picked === pos ? ' picked' : '');
    btn.innerHTML = '<span class="opt-label">' + labels[pos] + '</span>';
    const txt = document.createElement('span');
    txt.textContent = opts[origIdx];
    btn.appendChild(txt);
    btn.addEventListener('click', () => selectOption(pos));
    wrap.appendChild(btn);
  });

  const next = document.getElementById('btn-next');
  next.textContent = currentQ === total - 1 ? T[lang].finish : T[lang].next;
  next.style.display = isAnswered(currentQ) ? '' : 'none';
  next.onclick = nextQuestion;
  const prev = document.getElementById('btn-prev');
  prev.textContent = T[lang].prev;
  prev.style.display = currentQ > 0 ? '' : 'none';
  prev.onclick = prevQuestion;
}

// No feedback shown during the test, so the next employee cannot learn the answers.
// The employee can change the answer on the same question, or go back to earlier questions.
function selectOption(pos) {
  answers[currentQ] = pos;
  renderQuestion();
}

// ───── MATCHING (tap a left item, then a right item, to join them with a line) ─────
// answers[currentQ][i] = the right slot k joined to left item i, or null.
let matchSel = null; // { side: 'L' | 'R', idx } while the employee is choosing the first item

function renderMatch(item, bq) {
  const wrap = document.getElementById('options');
  const a = answers[currentQ];
  const box = document.createElement('div');
  box.className = 'match-box';
  const cols = document.createElement('div');
  cols.className = 'match-cols';
  const colL = document.createElement('div'); colL.className = 'match-col';
  const colR = document.createElement('div'); colR.className = 'match-col';
  const used = new Set(a.filter(v => v !== null));
  bq.l[lang].forEach((txt, i) => {
    const b = document.createElement('button');
    b.className = 'match-item' + (a[i] !== null ? ' linked' : '') + (matchSel && matchSel.side === 'L' && matchSel.idx === i ? ' sel' : '');
    b.dataset.side = 'L'; b.dataset.idx = i;
    b.textContent = txt;
    b.addEventListener('click', () => matchClick('L', i));
    colL.appendChild(b);
  });
  item.order.forEach((pairIdx, k) => {
    const b = document.createElement('button');
    b.className = 'match-item' + (used.has(k) ? ' linked' : '') + (matchSel && matchSel.side === 'R' && matchSel.idx === k ? ' sel' : '');
    b.dataset.side = 'R'; b.dataset.idx = k;
    b.textContent = bq.r[lang][pairIdx];
    b.addEventListener('click', () => matchClick('R', k));
    colR.appendChild(b);
  });
  cols.appendChild(colL); cols.appendChild(colR);
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'match-svg');
  box.appendChild(svg);
  box.appendChild(cols);
  wrap.appendChild(box);
  drawMatchLines();
}

function drawMatchLines() {
  const box = document.querySelector('#options .match-box');
  const item = quiz[currentQ];
  if (!box || !item || !item.matching) return;
  const svg = box.querySelector('svg.match-svg');
  const br = box.getBoundingClientRect();
  svg.setAttribute('width', br.width); svg.setAttribute('height', br.height);
  svg.setAttribute('viewBox', '0 0 ' + br.width + ' ' + br.height);
  svg.innerHTML = '';
  const a = answers[currentQ];
  a.forEach((k, i) => {
    if (k === null) return;
    const l = box.querySelector('[data-side="L"][data-idx="' + i + '"]');
    const r = box.querySelector('[data-side="R"][data-idx="' + k + '"]');
    if (!l || !r) return;
    const lr = l.getBoundingClientRect(), rr = r.getBoundingClientRect();
    // Left column is on the right of the screen (RTL): line leaves its left edge and enters the right column's right edge.
    const x1 = lr.left - br.left, y1 = lr.top + lr.height / 2 - br.top;
    const x2 = rr.right - br.left, y2 = rr.top + rr.height / 2 - br.top;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1); line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('class', 'match-line');
    svg.appendChild(line);
  });
}

window.addEventListener('resize', () => { if (quiz[currentQ] && quiz[currentQ].matching) drawMatchLines(); });

function matchClick(side, idx) {
  const a = answers[currentQ].slice();
  // Second tap on the other side: join the two items (a previous link on either item is replaced).
  if (matchSel && matchSel.side !== side) {
    const li = side === 'L' ? idx : matchSel.idx;
    const rk = side === 'L' ? matchSel.idx : idx;
    for (let j = 0; j < a.length; j++) if (a[j] === rk) a[j] = null;
    a[li] = rk;
    answers[currentQ] = a; matchSel = null; renderQuestion(); return;
  }
  // Tapping an item that is already joined removes that line.
  const linkedLeft = side === 'L' && a[idx] !== null;
  const linkedRight = side === 'R' && a.indexOf(idx) !== -1;
  if (linkedLeft || linkedRight) {
    if (side === 'L') a[idx] = null; else a[a.indexOf(idx)] = null;
    answers[currentQ] = a; matchSel = null; renderQuestion(); return;
  }
  // First tap: remember the item and wait for the other side.
  matchSel = { side, idx }; renderQuestion();
}

function isAnswered(i) {
  const a = answers[i];
  if (quiz[i].matching) return Array.isArray(a) && a.every(v => v !== null);
  if (quiz[i].ordering) return Array.isArray(a) && a.every(v => v !== null);
  return a !== null && a !== undefined;
}

// Give step k the rank n. If another step already has rank n, that step takes k's old rank (swap).
function setRank(k, n) {
  const arr = answers[currentQ].slice();
  const other = arr.indexOf(n);
  if (other !== -1 && other !== k) arr[other] = arr[k];
  arr[k] = n;
  answers[currentQ] = arr;
  renderQuestion();
}

// Points: ordering questions are worth 1-4 by difficulty (BANK pts); every other question is worth 1.
function itemPoints(item) { return 2; } // every question is worth 2 points: 50 x 2 = 100

function isCorrect(item, a) {
  if (item.matching) return a.every((k, i) => k !== null && item.order[k] === i);
  if (item.ordering) return a.every((n, k) => n - 1 === item.order[k]);
  return a === item.correctPos;
}

function nextQuestion() {
  if (!isAnswered(currentQ)) return;
  matchSel = null;
  currentQ++;
  if (currentQ >= quiz.length) { showResult(); return; }
  renderQuestion();
}

function prevQuestion() {
  if (currentQ === 0) return;
  matchSel = null;
  currentQ--;
  renderQuestion();
}

// ───── RESULT ─────
function showResult() {
  const t = T[lang];
  const log = quiz.map((item, i) => ({ qi: item.qi, order: item.order, chosen: answers[i], correctPos: item.correctPos, ordering: !!item.ordering, matching: !!item.matching, ok: isCorrect(item, answers[i]), pts: itemPoints(item) }));
  const totalPts = log.reduce((sum, a) => sum + a.pts, 0);
  score = log.filter(a => a.ok).reduce((sum, a) => sum + a.pts, 0);
  const total = totalPts;
  const pct = Math.round((score / total) * 100);
  const pass = score >= PASS_POINTS;

  showScreen('result');
  const circle = document.getElementById('score-circle');
  circle.className = 'score-circle ' + (pass ? 'pass' : 'fail');
  document.getElementById('score-pct').textContent = pct + '%';
  document.getElementById('score-frac').textContent = score + '/' + totalPts;
  document.getElementById('res-name').textContent = empName;
  const verdict = document.getElementById('res-verdict');
  verdict.textContent = pass ? t.pass : t.fail;
  verdict.className = 'verdict ' + (pass ? 'verdict-pass' : 'verdict-fail');
  document.getElementById('btn-new-emp').onclick = newEmployee;
  document.getElementById('btn-back-start').onclick = showStart;

  const now = new Date();
  const date = now.toLocaleDateString('ar-SA') + ' ' + now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
  records.push({ name: empName, score, total, pct, pass, date, sent: true });
  saveRecords();
  // List of wrong answers (Arabic text): question, what the employee chose, and the correct answer.
  const wrongLines = log
    .filter(a => !a.ok)
    .map((a, i) => {
      const bq = BANK[a.qi];
      const head = (i + 1) + ') ' + bq.q.ar;
      if (a.matching) {
        // Each joined pair on its own line: what the employee joined vs. the correct pairs.
        const chosen = a.chosen.map((k, j) => {
          const right = k === null ? '(بدون وصل)' : bq.r.ar[a.order[k]];
          const mark = (k !== null && a.order[k] === j) ? '✓' : '✗';
          return '   ' + mark + ' ' + bq.l.ar[j] + ' ↔ ' + right;
        }).join('\n');
        const correct = bq.l.ar.map((x, j) => '   ✓ ' + x + ' ↔ ' + bq.r.ar[j]).join('\n');
        return head + '\n  إجابتك:\n' + chosen + '\n  الصحيح:\n' + correct;
      }
      if (a.ordering) {
        // Steps listed in the order the employee ranked them, then the correct order.
        const chosenSeq = [1, 2, 3, 4].map(r => {
          const k = a.chosen.indexOf(r);
          return '   ' + r + '. ' + (k === -1 ? '—' : bq.o.ar[a.order[k]]);
        }).join('\n');
        const correct = bq.o.ar.map((x, j) => '   ' + (j + 1) + '. ' + x).join('\n');
        return head + '\n  إجابتك:\n' + chosenSeq + '\n  الصحيح:\n' + correct;
      }
      return head + '\n  إجابتك: ' + bq.o.ar[a.order[a.chosen]] + '\n  الصحيح: ' + bq.o.ar[a.order[a.correctPos]];
    });
  // Every answer in test order, so the results log can show the whole test: [question, correct?, employee's answer tokens]
  const detailArr = log.map(a => {
    const bq = BANK[a.qi];
    let tokens = [];
    if (a.matching) tokens = a.chosen.map((k, j) => k === null ? null : bq.l.ar[j] + ' ↔ ' + bq.r.ar[a.order[k]]).filter(Boolean);
    else if (a.ordering) tokens = [1, 2, 3, 4].map(r => { const k = a.chosen.indexOf(r); return k === -1 ? null : bq.o.ar[a.order[k]]; }).filter(Boolean);
    else if (a.chosen !== null && a.chosen !== undefined) tokens = [bq.o.ar[a.order[a.chosen]]];
    return [bq.q.ar, !!a.ok, tokens];
  });
  sendToSheet({ name: empName, score, total, pct, pass, wrong: wrongLines.join('\n\n') || 'لا يوجد', detail: JSON.stringify(detailArr) });
}

function newEmployee() {
  document.getElementById('emp-name').value = '';

}

// ───── RECORDS ─────
function showRecords() {
  document.getElementById('pw-input').value = '';
  document.getElementById('pw-error').style.display = 'none';
  showScreen('password');
  document.getElementById('pw-input').focus();
}

function checkPassword() {
  const val = document.getElementById('pw-input').value;
  if (val === PASSWORD) {
    document.getElementById('pw-error').style.display = 'none';
    renderRecords();
    showScreen('records');
  } else {
    const e = document.getElementById('pw-error');
    e.textContent = T[lang].pwWrong;
    e.style.display = 'block';
  }
}

function renderRecords() {
  const t = T[lang];
  const tbody = document.getElementById('records-body');
  tbody.innerHTML = '';
  if (records.length === 0) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 6;
    td.className = 'empty-state';
    td.textContent = t.noRecords;
    tr.appendChild(td);
    tbody.appendChild(tr);
    return;
  }
  records.slice().reverse().forEach((r, i) => {
    const tr = document.createElement('tr');
    const cells = [
      String(records.length - i),
      r.name,
      r.score + ' / ' + r.total,
      r.pct + '%',
      null,
      r.date
    ];
    cells.forEach((val, ci) => {
      const td = document.createElement('td');
      if (ci === 4) {
        const b = document.createElement('span');
        b.className = 'badge ' + (r.pass ? 'badge-pass' : 'badge-fail');
        b.textContent = r.pass ? t.pass : t.fail;
        td.appendChild(b);
      } else {
        td.textContent = val;
        if (ci === 1) td.style.fontWeight = '700';
        if (ci === 5) { td.style.color = 'var(--fg-soft)'; td.style.fontSize = '0.82rem'; td.style.whiteSpace = 'nowrap'; }
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

// Sends records saved in this browser that were never sent to the sheet (e.g. older tests).
function uploadRecords() {
  const btn = document.getElementById('btn-upload');
  const pending = records.filter(r => !r.sent);
  if (pending.length === 0) { btn.textContent = T[lang].btnUploadDone; return; }
  pending.forEach((r, i) => setTimeout(() => {
    sendToSheet({ name: r.name, score: r.score, total: r.total, pct: r.pct, pass: r.pass,
                  wrong: r.wrong || 'مرفوع من السجل المحلي (بدون تفاصيل)' });
    r.sent = true;
    saveRecords();
  }, i * 400));
  setTimeout(() => { btn.textContent = T[lang].btnUploadDone; }, pending.length * 400 + 200);
}

let clearArmed = false;
function clearRecords() {
  const btn = document.getElementById('btn-clear');
  if (!clearArmed) {
    clearArmed = true;
    btn.textContent = T[lang].confirmClear;
    setTimeout(() => { clearArmed = false; btn.textContent = T[lang].btnClear; }, 4000);
    return;
  }
  clearArmed = false;
  records = [];
  saveRecords();
  renderRecords();
  btn.textContent = T[lang].btnClear;
}

const REV_LANGS = [['ar','عربي'],['en','English'],['hi','हिंदी'],['bn','বাংলা'],['id','Indonesia'],['ne','नेपाली']];
function escHtml(s) { return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function showReview() {
  renderReview();
  showScreen('review');
}
function renderReview() {
  const letters = ['A','B','C','D'];
  const html = BANK.map((bq, i) => {
    const langs = REV_LANGS.map(([L, name]) => {
      const opts = bq.o[L].map((o, p) => {
        const ok = p === bq.c;
        return `<div class="rev-opt${ok ? ' ok' : ''}">${ok ? '✓ ' : ''}${escHtml(letters[p])}. ${escHtml(o)}</div>`;
      }).join('');
      return `<div class="rev-lang"><div class="rev-lbl">${name}</div><div class="rev-q">${escHtml(bq.q[L])}</div>${opts}</div>`;
    }).join('');
    return `<div class="rev-item"><div class="rev-head">${i + 1}. ${escHtml(bq.cat.en)} — ${escHtml(bq.cat.ar)}</div>${langs}</div>`;
  }).join('');
  document.getElementById('review-body').innerHTML = html;
}

िरीक्षण"], ["h3", "الرقابة الصحية الرسمية", "Official health inspection", "आधिकारिक स्वास्थ्य निरीक्षण", "সরকারি স্বাস্থ্য তদারকি", "Inspeksi kesehatan resmi", "आधिकारिक स्वास्थ्य निरीक्षण"], ["li", "من يقوم بها؟ مراقبون متخصصون من الجهات الحكومية المعنية بسلامة الغذاء. أو مراقبو شركات متخصصة في مجال سلامة الغذاء متعاقدة مع الجهات الحكومية المعنية للقيام بأعمال الرقابة الصحية.", "Who carries it out? Specialised inspectors from the government bodies responsible for food safety, or inspectors from specialised companies contracted with those government bodies to carry out health inspection.", "इसे कौन करता है? खाद्य सुरक्षा के लिए जिम्मेदार सरकारी संस्थाओं के विशेषज्ञ निरीक्षक, या उनसे अनुबंधित विशेष कंपनियों के निरीक्षक।", "কে করে? খাদ্য নিরাপত্তার দায়িত্বে থাকা সরকারি সংস্থার বিশেষজ্ঞ পরিদর্শক, বা সেসব সংস্থার সঙ্গে চুক্তিবদ্ধ বিশেষায়িত কোম্পানির পরিদর্শক।", "Siapa yang melakukannya? Inspektur ahli dari lembaga pemerintah yang bertanggung jawab atas keamanan pangan, atau inspektur dari perusahaan khusus yang bekerja sama dengan lembaga tersebut.", "कसले गर्छ? खाद्य सुरक्षाको जिम्मेवार सरकारी निकायका विशेषज्ञ निरीक्षक, वा ती सरकारी निकायसँग सम्झौता भएका विशेष कम्पनीका निरीक्षक, जसले स्वास्थ्य निरीक्षण गर्छन्।"], ["li", "ما هي؟ هؤلاء المراقبون يقومون بزيارات دورية للمنشآت الغذائية لفحصها والتأكد من التزامها بالاشتراطات الصحية.", "What is it? These inspectors make periodic visits to food establishments to examine them and confirm they comply with health requirements.", "यह क्या है? ये निरीक्षक खाद्य प्रतिष्ठानों का नियमित दौरा करके जांचते हैं कि वे स्वास्थ्य मानकों का पालन करते हैं।", "এটা কী? এই পরিদর্শকরা খাদ্য প্রতিষ্ঠানে নিয়মিত পরিদর্শন করে স্বাস্থ্য বিধি মানা হচ্ছে কিনা তা যাচাই করেন।", "Apa itu? Inspektur ini melakukan kunjungan berkala ke usaha pangan untuk memeriksa kepatuhan terhadap persyaratan kesehatan.", "यो के हो? यी निरीक्षकहरू खाद्य प्रतिष्ठानहरूमा समय-समयमा भ्रमण गरेर जाँच गर्छन् र स्वास्थ्य आवश्यकता पूरा भएको छ कि छैन पक्का गर्छन्।"], ["li", "ما الهدف منها؟ ضمان سلامة الغذاء وحماية صحة المستهلكين.", "What is the purpose? To ensure food safety and protect consumers' health.", "उद्देश्य क्या है? भोजन की सुरक्षा सुनिश्चित करना और उपभोक्ताओं के स्वास्थ्य की रक्षा करना।", "উদ্দেশ্য কী? খাদ্যের নিরাপত্তা নিশ্চিত করা এবং ভোক্তাদের স্বাস্থ্য রক্ষা করা।", "Tujuannya? Memastikan keamanan pangan dan melindungi kesehatan konsumen.", "उद्देश्य के हो? खाद्य सुरक्षा सुनिश्चित गर्नु र उपभोक्ताको स्वास्थ्य जोगाउनु।"], ["h3", "الرقابة الصحية الذاتية", "Self health inspection", "स्वयं स्वास्थ्य निरीक्षण", "স্বতঃ স্বাস্থ্য তদারকি", "Inspeksi kesehatan mandiri", "आत्म-स्वास्थ्य निरीक्षण"], ["li", "من يقوم بها؟ مدير المنشأة والمشرفون والعاملون في المنشأة الغذائية أنفسهم.", "Who carries it out? The establishment manager, supervisors and workers in the food establishment themselves.", "इसे कौन करता है? प्रतिष्ठान के प्रबंधक, पर्यवेक्षक और कर्मचारी स्वयं।", "কে করে? প্রতিষ্ঠানের ম্যানেজার, সুপারভাইজার ও কর্মীরা নিজেরাই।", "Siapa yang melakukannya? Manajer usaha, supervisor, dan pekerja di usaha pangan itu sendiri.", "कसले गर्छ? प्रतिष्ठानका प्रबन्धक, सुपरवाइजर र खाद्य प्रतिष्ठानका कामदार आफैं।"], ["li", "ما هي؟ هي عملية فحص دورية يقوم بها مدير المنشأة والمشرفون والعاملون للتأكد من النظافة الشخصية والعاملين، ونظافة المكان والمعدات واتباع جميع الإجراءات الصحية.", "What is it? A periodic check carried out by the manager, supervisors and workers to confirm personal hygiene, cleanliness of the premises and equipment, and compliance with all health procedures.", "यह क्या है? प्रबंधक, पर्यवेक्षक और कर्मचारियों द्वारा नियमित जांच, जिससे व्यक्तिगत स्वच्छता, परिसर और उपकरणों की सफाई और सभी स्वास्थ्य प्रक्रियाओं का पालन सुनिश्चित हो।", "এটা কী? ব্যবস্থাপক, সুপারভাইজার ও কর্মীদের নিয়মিত পরীক্ষা, যাতে ব্যক্তিগত পরিচ্ছন্নতা, স্থান ও সরঞ্জামের পরিচ্ছন্নতা এবং সব স্বাস্থ্য বিধি মানা নিশ্চিত হয়।", "Apa itu? Pemeriksaan berkala oleh manajer, supervisor dan pekerja untuk memastikan kebersihan pribadi, kebersihan tempat dan peralatan, serta kepatuhan pada seluruh prosedur kesehatan.", "यो के हो? प्रबन्धक, सुपरवाइजर र कामदारहरूले गर्ने समय-समयको जाँच, जसले व्यक्तिगत सरसफाइ, परिसर र उपकरणको सफाइ, र सबै स्वास्थ्य प्रक्रियाको पालना पक्का गर्छ।"], ["li", "ما الهدف منها؟ ضمان سلامة الغذاء المقدم للمستهلكين.", "What is the purpose? To ensure the safety of food served to consumers.", "उद्देश्य क्या है? उपभोक्ताओं को परोसे जाने वाले भोजन की सुरक्षा सुनिश्चित करना।", "উদ্দেশ্য কী? ভোক্তাদের পরিবেশিত খাবারের নিরাপত্তা নিশ্চিত করা।", "Tujuannya? Memastikan keamanan makanan yang disajikan kepada konsumen.", "उद्देश्य के हो? उपभोक्तालाई दिइने खानाको सुरक्षा सुनिश्चित गर्नु।"], ["h2", "متداولو الغذاء", "Food handlers", "खाद्य संभालने वाले कर्मचारी", "খাদ্য পরিচালনাকারী", "Penjamah pangan", "खाना ह्यान्डल गर्ने व्यक्तिहरू"], ["p", "طبقاً لتعريف نظام الغذاء السعودي، يُعتبر متداول الغذاء \"كل من يتعامل مع الغذاء عبر الممارسات التي يمر بها الغذاء خلال السلسلة الغذائية\".", "According to the Saudi food system definition, a food handler is \"anyone who deals with food through the practices the food goes through during the food chain\".", "सऊदी खाद्य प्रणाली की परिभाषा के अनुसार, खाद्य संभालने वाला वह है \"जो खाद्य आपूर्ति श्रृंखला के दौरान भोजन से जुड़ी प्रक्रियाओं के माध्यम से भोजन से व्यवहार करता है\"।", "সৌদি খাদ্য ব্যবস্থার সংজ্ঞা অনুযায়ী, খাদ্য পরিচালনাকারী হলো \"যে খাদ্য সরবরাহ শৃঙ্খলে খাদ্যের যেসব প্রক্রিয়া ঘটে, সেগুলোর মাধ্যমে খাবারের সঙ্গে কাজ করে\"।", "Menurut definisi sistem pangan Saudi, penjamah pangan adalah \"setiap orang yang menangani pangan melalui praktik yang dilalui pangan dalam rantai pangan\".", "साउदी खाद्य प्रणालीको परिभाषा अनुसार, खाना ह्यान्डलर भनेको \"खाद्य शृंखलामा खाना गुज्रने प्रक्रियाहरूमार्फत खानासँग काम गर्ने जो कोही\" हो।"], ["li", "الأشخاص الذين يتعاملون بشكل مباشر أو غير مباشر مع الغذاء في عملهم.", "People who deal directly or indirectly with food in their work.", "वे लोग जो अपने काम में भोजन से सीधे या अप्रत्यक्ष रूप से जुड़े हैं।", "যারা তাদের কাজে সরাসরি বা পরোক্ষভাবে খাবারের সঙ্গে কাজ করেন।"  diseases. We take the required vaccinations to protect ourselves and others from diseases spread through food. We build a good reputation for ourselves and our workplace by meeting these requirements.", "हमारे लिए इसका अर्थ: स्वास्थ्य प्रमाण पत्र दिखाता है कि हम ग्राहकों और उपभोक्ताओं को भोजन से फैलने वाली बीमारियों से बचाते हैं। हम खुद और दूसरों को बचाने के लिए ज़रूरी टीके लगवाते हैं। इन शर्तों के पालन से हमारी और हमारे कार्यस्थल की अच्छी साख बनती है।", "আমাদের জন্য এর অর্থ: স্বাস্থ্য সনদ প্রমাণ করে যে আমরা গ্রাহক ও ভোক্তাদের খাবারবাহিত রোগ থেকে রক্ষা করি। নিজেদের ও অন্যদের খাবারবাহিত রোগ থেকে বাঁচাতে প্রয়োজনীয় টিকা নিই। এসব শর্ত মেনে আমরা নিজেদের ও কর্মস্থলের ভালো সুনাম গড়ি।", "Bagi kita: sertifikat kesehatan menunjukkan bahwa kita melindungi pelanggan dan konsumen dari penyakit bawaan pangan. Kita menjalani vaksinasi yang diwajibkan untuk melindungi diri sendiri dan orang lain. Dengan memenuhi syarat ini, kita membangun reputasi baik bagi diri sendiri dan tempat kerja.", "हाम्रो लागि यसको अर्थ: स्वास्थ्य प्रमाणपत्रले हामी खानामार्फत लाग्ने रोगबाट ग्राहक र उपभोक्ताको रक्षा गर्छौं भन्ने देखाउँछ। हामी आफूलाई र अरूलाई खानामार्फत सर्ने रोगबाट जोगाउन आवश्यक खोप लिन्छौं। यी आवश्यकताहरू पूरा गरेर हामी आफ्नो र कार्यस्थलको राम्रो साख बनाउँछौं।"], ["h3", "ماذا تفعل إذا مرضت أو أصبت؟", "What to do if you become ill or get injured", "अगर आप बीमार हों या चोट लगे तो क्या करें?", "অসুস্থ হলে বা আহত হলে কী করবেন?", "Apa yang harus dilakukan jika Anda sakit atau terluka?", "बिरामी वा चोट लाग्दा के गर्ने?"], ["p", "في حالة المرض: إذا شعرت بأي من هذه الأعراض: مرض معدٍ، إسهال، جروح ملتهبة، التهابات جلدية. يجب عليك: إخبار مشرفك فوراً. عدم العمل في تحضير أو تداول الغذاء. مراجعة المستشفى أو المركز الصحي.", "If the illness: if you feel any of these symptoms: contagious illness, diarrhoea, infected wounds, skin infections. You must: tell your supervisor immediately. Do not work in preparing or handling food. Visit a hospital or health centre.", "बीमारी की स्थिति में: यदि आपको इनमें से कोई लक्षण हो: संक्रामक रोग, दस्त, संक्रमित घाव, त्वचा संक्रमण। आपको: तुरंत अपने पर्यवेक्षक को बताना होगा। भोजन तैयार करने या संभालने का काम नहीं करना होगा। अस्पताल या स्वास्थ्य केंद्र जाना होगा।", "অসুস্থতার ক্ষেত্রে: এই লক্ষণগুলোর যেকোনো একটি থাকলে: সংক্রামক রোগ, ডায়রিয়া, পুঁজযুক্ত ক্ষত, ত্বকের সংক্রমণ। আপনাকে: অবিলম্বে সুপারভাইজারকে জানাতে হবে। খাবার তৈরি বা পরিচালনার কাজ করা যাবে না। হাসপাতাল বা স্বাস্থ্যকেন্দ্রে যেতে হবে।", "Jika sakit: jika Anda mengalami gejala berikut: penyakit menular, diare, luka bernanah, infeksi kulit. Anda harus: segera memberi tahu supervisor. Tidak bekerja menyiapkan atau menangani pangan. Memeriksakan diri ke rumah sakit atau puskesmas.", "यदि बिरामी भयो भने: यदि तपाईंमा यी लक्षणहरू देखिए: सरुवा रोग, पखाला, संक्रमित घाउ, छालाका संक्रमण। तपाईंले: तुरुन्तै आफ्नो सुपरवाइजरलाई भन्नुपर्छ। खाना तयार गर्ने वा ह्यान्डल गर्ने काम नगर्नुहोस्। अस्पताल वा स्वास्थ्य केन्द्रमा जानुहोस्।"], ["p", "في حالة الإصابة أثناء العمل: توقف عن العمل فوراً. غطِ الجرح بشريط طبي: مقاوم للماء، ملون (لسهولة رؤيته إذا سقط في الغذاء)، مثبت بإحكام. استخدم قفازاً يغطي مكان الإصابة. لا تعد للعمل إلا بعد الشفاء التام.", "If injured at work: stop working immediately. Cover the wound with a medical dressing that is: waterproof, coloured (so it is easy to see if it falls into food), and firmly fixed. Use a glove covering the injury. Return to work only after full recovery.", "काम के दौरान चोट लगने पर: तुरंत काम बंद करें। घाव को चिकित्सा पट्टी से ढकें: जो पानी-रोधी हो, रंगीन हो (ताकि भोजन में गिरे तो आसानी से दिखे), और मज़बूती से चिपकी हो। चोट वाली जगह पर दस्ताना पहनें। पूरी तरह ठीक होने के बाद ही काम पर लौटें।", "কর্মক্ষেত্রে আঘাত পেলে: অবিলম্বে কাজ বন্ধ করুন। ক্ষত চিকিৎসা ব্যান্ডেজ দিয়ে ঢাকুন: যা জলরোধী, রঙিন (খাবারে পড়লে সহজে চোখে পড়ে) এবং শক্ত করে আটকানো। আহত স্থানে গ্লাভস পরুন। সম্পূর্ণ সুস্থ হওয়ার পর কাজে ফিরুন।", "Jika terluka saat bekerja: segera hentikan pekerjaan. Tutup luka dengan plester medis yang tahan air, berwarna (agar mudah terlihat jika jatuh ke pangan), dan terpasang kuat. Gunakan sarung tangan yang menutupi luka. Kembali bekerja hanya setelah sembuh total.", "कामका क्रममा चोट लागेमा: तुरुन्तै काम रोक्नुहोस्। घाउलाई मेडिकल ड्रेसिङले छोप्नुहोस्, जुन: पानी नपर्ने, रंगीन (ताकि खानामा खसे सजिलै देखियोस्), र बलियोसँग टाँसिएको हुनुपर्छ। चोटलाई ढाक्ने गरी पञ्जा लगाउनुहोस्। पूर्ण निको भएपछि मात्र काममा फर्कनुहोस्।"], ["n", "ماذا يعني هذا لنا؟: الإبلاغ عن المرض يمنع انتشار الأمراض. نحن مسؤولون عن إدراك صحتنا والإبلاغ عنها. التوقف عن العمل عند المرض يحمي الجميع. إخبارنا للمشرف يظهر التزامنا بالسلامة.", "What this means for us: reporting illness prevents the spread of disease. We are responsible for recognising our health and reporting it. Stopping work when ill protects everyone. Telling the supervisor shows our commitment to safety.", "हमारे लिए इसका अर्थ: बीमारी की सूचना देने से रोग फैलने से रुकता है। अपने स्वास्थ्य को पहचानना और उसकी सूचना देना हमारी ज़िम्मेदारी है। बीमार होने पर काम रोकना सबकी रक्षा करता है। पर्यवेक्षक को बताना सुरक्षा के प्रति हमारी प्रतिबद्धता दिखाता है।", "আমাদের জন্য এর অর্থ: অসুস্থতার খবর দিলে রোগ ছড়ানো রোধ হয়। নিজের স্বাস্থ্য বোঝা ও জানানো আমাদের দায়িত্ব। অসুস্থ থাকলে কাজ বন্ধ রাখা সবাইকে রক্ষা করে। সুপারভাইজারকে জানানো নিরাপত্তায় আমাদের অঙ্গীকার দেখায়।", "Bagi kita: melaporkan sakit mencegah penyebaran penyakit. Kita bertanggung jawab mengenali dan melaporkan kondisi kesehatan kita. Berhenti bekerja saat sakit melindungi semua orang. Memberi tahu supervisor menunjukkan komitmen kita pada keselamatan.", "हाम्रो लागि यसको अर्थ: रोग रिपोर्ट गर्दा रोगको फैलावट रोकिन्छ। आफ्नो स्वास्थ्य पहिचान गर्ने र रिपोर्ट गर्ने जिम्मेवारी हाम्रो हो। बिरामी हुँदा काम रोक्दा सबैको सुरक्षा हुन्छ। सुपरवाइजरलाई भन्नु सुरक्षाप्रतिको प्रतिबद्धता देखाउँछ।"], ["h2", "النظافة الشخصية والسلوك", "Personal hygiene and behaviour", "व्यक्तिगत स्वच्छता और आचरण", "ব্যক্তিগত পরিচ্ছন্নতা ও আচরণ", "Kebersihan pribadi dan perilaku", "व्यक्तिगत सरसफाइ र व्यवहार"], ["p", "يجب عليك دائماً:", "You must always:", "आपको हमेशा:", " in food?", "भोजन में खतरे का स्रोत क्या है?", "খাবারে ঝুঁকির উৎস কী?", "Apa itu sumber bahaya pada pangan?", "खानामा खतराको स्रोत भनेको के हो?"], ["p", "مصدر الخطر هو أي شيء في الغذاء قد يضر بصحة العميل أو المستهلك، أو يسبب مرضه، أو إصابته، أو فساد، أو تلف الغذاء.", "A hazard source is anything in food that may harm the customer's or consumer's health, cause illness or injury, or cause the food to spoil or be damaged.", "खतरे का स्रोत भोजन में वह कोई भी चीज़ है जो ग्राहक या उपभोक्ता के स्वास्थ्य को नुकसान पहुँचा सकती है, बीमारी या चोट का कारण बन सकती है, या भोजन को खराब कर सकती है।", "খাবারের যেকোনো বিষয় যা গ্রাহক বা ভোক্তার স্বাস্থ্যের ক্ষতি, অসুস্থতা, আঘাত, বা খাবার নষ্ট করতে পারে, তাই ঝুঁকির উৎস।", "Sumber bahaya adalah segala sesuatu dalam pangan yang dapat membahayakan kesehatan pelanggan atau konsumen, menyebabkan sakit atau cedera, atau membuat pangan rusak.", "खतराको स्रोत भनेको खानामा भएको जुनसुकै कुरा हो, जसले ग्राहक वा उपभोक्ताको स्वास्थ्यलाई हानि पुर्‍याउन सक्छ, बिरामी वा चोट पुर्‍याउन सक्छ, वा खाना बिग्रन वा बिग्रन सक्छ।"], ["h3", "ما هي أنواع المخاطر على الغذاء؟", "What are the types of hazards to food?", "भोजन के लिए खतरों के प्रकार क्या हैं?", "খাবারের ঝুঁকির ধরন কী কী?", "Apa saja jenis bahaya pada pangan?", "खानाका खतराका प्रकारहरू के हुन्?"], ["p", "هناك أربعة أنواع رئيسية من المخاطر، وسيتم دراستها بالتفصيل في الأجزاء القادمة هي:", "There are four main types of hazards, which will be studied in detail in the following parts:", "खतरों के चार मुख्य प्रकार हैं, जिनका विस्तार से अध्ययन आगे के भागों में होगा:", "ঝুঁকির চারটি প্রধান ধরন আছে, যেগুলো পরের অংশগুলোতে বিস্তারিত পড়ানো হবে:", "Ada empat jenis bahaya utama, yang akan dipelajari secara rinci pada bagian berikutnya:", "मुख्य चार प्रकारका खतरा छन्, जसबारे अर्को भागहरूमा विस्तृत अध्ययन गरिनेछ:"], ["li", "1. مخاطر ميكروبية: أمثلة: الجراثيم أو الكائنات الحية الدقيقة مثل: البكتيريا، الفيروسات، فطر العفن، والطفيليات.", "1. Microbiological hazards: examples are microorganisms such as bacteria, viruses, moulds and parasites.", "1. सूक्ष्मजैविक खतरे: उदाहरण: जीवाणु (बैक्टीरिया), वायरस, फफूंद (मोल्ड) और परजीवी जैसे सूक्ष्मजीव।", "1. অণুজীবীয় ঝুঁকি: উদাহরণ: ব্যাকটেরিয়া, ভাইরাস, ছত্রাক (মোল্ড) ও পরজীবীর মতো অণুজীব।", "1. Bahaya mikrobiologis: contohnya mikroorganisme seperti bakteri, virus, kapang, dan parasit.", "1. सूक्ष्मजैविक खतरा: उदाहरणका लागि जीवाणु, भाइरस, ढुसी र परजीवी जस्ता सूक्ष्मजीव।"], ["li", "2. مخاطر كيميائية: أمثلة: مبيدات الآفات الزراعية، المبيدات الحشرية، مواد التنظيف، زيوت الآلات.", "2. Chemical hazards: examples are agricultural pesticides, insecticides, cleaning materials, and machine oils.", "2. रासायनिक खतरे: उदाहरण: कृषि कीटनाशक, कीटनाशक दवाएँ, सफाई सामग्री, और मशीन के तेल।", "2. রাসায়নিক ঝুঁকি: উদাহরণ: কৃষি কীটনাশক, পোকামাকড় নাশক, পরিষ্কারক পদার্থ, যন্ত্রের তেল।", "2. Bahaya kimia: contohnya pestisida pertanian, insektisida, bahan pembersih, dan minyak mesin.", "2. रासायनिक खतरा: उदाहरणका लागि कृषि विषादी, कीटनाशक, सफाई सामग्री, र मेसिनको तेल।"], ["li", "3. مخاطر فيزيائية (مادية): أمثلة: الغبار والأوساخ، الدبابيس، القطع المعدنية، الزجاج المكسور، قطع العظام، الضمادات، الحلي والمجوهرات، الشعر، أقلام السجائر، بقايا الحشرات.", "3. Physical hazards: examples are dust and dirt, pins, metal pieces, broken glass, bone fragments, bandages, jewellery, hair, cigarette lighters and insect remains.", "3. भौतिक खतरे: उदाहरण: धूल और गंदगी, पिन, धातु के टुकड़े, टूटा कांच, हड्डी के टुकड़े, पट्टियाँ, गहने, बाल, सिगरेट लाइटर और कीड़ों के अवशेष।", "3. ভৌত ঝুঁকি: উদাহরণ: ধুলোময়লা, পিন, ধাতুর টুকরো, ভাঙা কাঁচ, হাড়ের টুকরো, ব্যান্ডেজ, গয়না, চুল, সিগারেটের লাইটার ও পোকার অবশেষ।", "3. Bahaya fisik: contohnya debu dan kotoran, peniti, potongan logam, pecahan kaca, serpihan tulang, perban, perhiasan, rambut, korek api rokok, dan sisa serangga.", "3. भौतिक खतरा: उदाहरणका लागि धुलो र माटो, काँटी, धातुका टुक्रा, फुटेको काँच, हड्डीका टुक्रा, ब्यान्डेज, गहना, कपाल, चुरोटको लाइटर, र कीराका अवशेष।"], ["li", "4. مخاطر الحساسية من الغذاء: مكونات أو أنواع من الغذاء تسبب حساسية لبعض الناس، قد تكون خطرة على فئة معينة من الناس، ولكنها آمنة لمعظم الناس.", "4. Food allergy hazards: ingredients or food types that cause allergy in some people; they may be dangerous for a particular group but safe for most people.", "4. भोजन एलर्जी के खतरे: कुछ लोगों में एलर्जी पैदा करने वाली सामग्री या भोजन; कुछ समूहों के लिए खतरनाक हो सकते हैं, पर अधिकांश लोगों के लिए सुरक्षित।", "4. খাদ্য অ্যালার্জির ঝুঁকি: কিছু মানুষের অ্যালার্জি সৃষ্টিকারী উপাদান বা খাবার; নির্দিষ্ট দলের জন্য বিপজ্জনক হতে পারে, তবে বেশিরভাগ মানুষের জন্য নিরাপদ।", "4. Bahaya alergi pangan: bahan atau jenis pangan yang menyebabkan alergi pada sebagian orang; bisa berbahaya bagi kelompok tertentu namun aman bagi kebanyakan orang.", "4. खानाको एलर्जीको खतरा: केही मानिसलाई एलर्जी गराउने सामग्री वा खानाका प्रकार; कुनै विशेष समूहका लागि खतरनाक हुन सक्छन् तर अधिकांश मानिसका लागि सुरक्षित।"]]}, {"t": ["مقدمة سلامة الغذاء (تابع)", "Introduction to food safety (continued)", "खाद्य सुरक्षा का परिचय (जारी)", "খাদ্য নিরাপত্তার ভূমিকা (চলমান)", "Pengantar keamanan pangan (lanjutan)", "खाद्य सुरक्षाको परिचय (जारी)"], "r": [["h2", "كيف يحدث التلوث للغذاء؟", "How does food contamination happen?", "भोजन दूषित कैसे होता है?", "খাবার কীভাবে দূষিত হয়?", "Bagaimana kontaminasi pangan terjadi?", "खानामा दूषण कसरी हुन्छ?"], ["h3", "أين يمكن أن يحدث التلوث؟", "Where can contamination happen?", "संदूषण कहाँ हो सकता है?", "দূষণ কোথায় ঘটতে পারে?", "Di mana kontaminasi dapat terjadi?", "दूषण कहाँ हुन सक्छ?"], ["p", "في أي مكان يتم فيه تناول وإعداد الغذاء: مطاعم، مطابخ مركزية، بوفيات، بقالة، أسواق مركزية الخ. ويمكن أن يحدث التلوث في أي مرحلة من مراحل السلسلة الغذائية:", "Contamination can happen anywhere food is eaten or prepared: restaurants, central kitchens, buffets, groceries, central markets, etc. It can occur at any stage of the food chain:", "भोजन जहाँ खाया या तैयार किया जाता है वहीं संदूषण हो सकता है: रेस्तरां, केंद्रीय रसोई, बुफे, किराना दुकानें, केंद्रीय बाज़ार आदि। खाद्य श्रृंखला के किसी भी चरण में यह हो सकता है:", "যেখানে খাবার খাওয়া বা তৈরি হয় সেখানেই দূষণ ঘটতে পারে: রেস্তোরাঁ, কেন্দ্রীয় রান্নাঘর, বুফে, মুদির দোকান, কেন্দ্রীয় বাজার ইত্যাদি। খাদ্য শৃঙ্খলের যেকোনো ধাপে এটি ঘটতে পারে:", "Kontaminasi dapat terjadi di mana pun pangan dimakan atau disiapkan: restoran, dapur sentral, prasmanan, toko kelontong, pasar induk, dll. Ini dapat terjadi di setiap tahap rantai pangan:", "दूषण खाना खाइने वा तयार गरिने जुनसुकै ठाउँमा हुन सक्छ: रेस्टुरेन्ट, केन्द्रीय भान्सा, बुफे, पसल, केन्द्रीय बजार, आदि। खाद्य शृंखलाको कुनै पनि चरणमा हुन सक्छ:"], ["li", "الحصاد أو الذبح.", "Harvesting or slaughter.", "कटाई या वध।", "ফসল তোলা বা জবাই।", "Panen atau pemotongan hewan.", "टिप्ने वा काट्ने।"], ["li", "التصنيع والمعالجة.", "Manufacturing and processing.", "निर्माण और प्रसंस्करण।", "উৎপাদন ও প্রক্রিয়াজাতকরণ।", "Pengolahan dan pemrosesan.", "उत्पादन र प्रशोधन।"], ["li", "التخزين والتوزيع.", "Storage and distribution.", "भंडारण और वितरण।", "সংরক্ষণ ও বিতরণ।", "Penyimpanan dan distribusi.", "भण्डारण र वितरण।"], ["li", "الإعداد والطهي.", "Preparation and cooking.", "तैयारी और पकाना।", "প্রস্তুতি ও রান্না।", "Persiapan dan memasak.", "तयारी र पकाउने।"], ["li", "العرض والبيع.", "Display and sale.", "प्रदर्शन और बिक्री।", "প্রদর্শন ও বিক্রি।", "Penyajian dan penjualan.", "प्रदर्शन र बिक्री।"], ["h3", "ما هي أنواع تلوث الغذاء؟", "What are the types of food contamination?", "भोजन संदूषण के प्रकार क्या हैं?", "খাবার দূষণের ধরন কী কী?", "Apa saja jenis kontaminasi pangan?", "दूषणका प्रकारहरू के हुन्?"], ["h3", "1. التلوث الخلطي (غير المباشر)", "1. Cross-contamination (indirect)", "1. क्रॉस-संदूषण (अप्रत्यक्ष)", "১. ক্রস-দূষণ (পরোক্ষ)", "1. Kontaminasi silang (tidak langsung)", "1. क्रस-दूषण (अप्रत्यक्ष)"], ["p", "انتقال المواد الضارة أو الأحياء الدقيقة إلى الغذاء الجاهز للتقديم عن طريق اليدين والأسطح والمعدات التي تكون متسخة وتلامس الغذاء الخام ثم تلامس الغذاء الجاهز للتقديم. يشمل ملامسة الغذاء الخام أو السائل الناجم عنه للغذاء الجاهز للتقديم.", "The transfer of harmful substances or microorganisms to ready-to-eat food through hands, surfaces and equipment that are dirty, touch raw food and then touch ready-to-eat food. It includes contact between raw food, or its drippings, and ready-to-eat food.", "हानिकारक पदार्थ या सूक्ष्मजीव हाथों, सतहों और उपकरणों के ज़रिए तैयार भोजन तक पहुँचते हैं, जब वे गंदे होकर पहले कच्चे भोजन को और फिर तैयार भोजन को छूते हैं। इसमें कच्चे भोजन या उसके रिसते तरल का तैयार भोजन से संपर्क भी शामिल है।", "ক্ষতিকর পদার্থ বা অণুজীব নোংরা হাত, পৃষ্ঠ ও সরঞ্জামের মাধ্যমে তৈরি খাবারে পৌঁছায়, যখন সেগুলো আগে কাঁচা খাবার ও পরে তৈরি খাবার স্পর্শ করে। এতে কাঁচা খাবার বা তার চুঁইয়ে পড়া তরলের সঙ্গে তৈরি খাবারের সংস্পর্শও অন্তর্ভুক্ত।", "Perpindahan zat berbahaya atau mikroorganisme ke pangan siap saji melalui tangan, permukaan, dan peralatan yang kotor, yang menyentuh pangan mentah lalu pangan siap saji. Termasuk kontak antara pangan mentah atau cairannya dengan pangan siap saji.", "दूषित हात, सतह र उपकरण मार्फत हानिकारक पदार्थ वा सूक्ष्मजीव तयार खानामा सर्नु। काँचो खाना छोएको हात वा सतहले तयार खानालाई छुँदा यस्तो हुन्छ। यसमा काँचो खाना वा त्यसको चुहिएको भाग र तयार खानाबीचको सम्पर्क पनि पर्छ।"], ["n", "أمثلة: استخدام سكين غير نظيف لتقطيع غذاء مطبوخ؛ تحضير غذاء على سطح ملوث؛ استخدام قفازات ملوثة في التعامل مع الغذاء.", "Examples: using an unclean knife to cut cooked food; preparing food on a dirty surface; using contaminated gloves when handling food.", "उदाहरण: पके भोजन को गंदे चाकू से काटना; गंदी सतह पर भोजन तैयार करना; भोजन संभालते समय दूषित दस्ताने इस्तेमाल करना।", "উদাহরণ: রান্না করা খাবার অপরিষ্কার ছুরি দিয়ে কাটা; নোংরা পৃষ্ঠে খাবার তৈরি; দূষিত গ্লাভস দিয়ে খাবার ধরা।", "Contoh: memakai pisau kotor untuk memotong pangan matang; menyiapkan pangan di permukaan yang kotor; memakai sarung tangan terkontaminasi saat menangani pangan.", "उदाहरणहरू: पकाएको खाना काट्न फोहोर चक्कु प्रयोग गर्नु; फोहोर सतहमा खाना तयार गर्नु; खाना ह्यान्डल गर्दा दूषित पञ्जा प्रयोग गर्नु।"], ["h3", "2. التلوث الميكروبيولوجي (المباشر)", "2. Microbiological contamination (direct)", "2. सूक्ष्मजैविक संदूषण (प्रत्यक्ष)", "২. অণুজীবীয় দূষণ (সরাসরি)", "2. Kontaminasi mikrobiologis (langsung)", "2. सूक्ष्मजैविक दूषण (प्रत्यक्ष)"], ["p", "التلوث بالأحياء الدقيقة أو السموم التي تنتجها الأحياء الدقيقة على سطح الغذاء أو داخله أثناء إنتاج الغذاء أو تصنيعه أو تغليفه أو تعبئته أو معاملته أو احتفاظه أو نقله أو تحضيره أو تعبئته أو تغليفه أو معاملته أو الاحتفاظ به أو نقله.", "Contamination with microorganisms, or toxins they produce, on or inside food during its production, manufacture, packaging, processing, holding, transport, preparation or handling.", "भोजन के उत्पादन, निर्माण, पैकिंग, प्रसंस्करण, भंडारण, परिवहन या तैयारी के दौरान भोजन की सतह पर या भीतर सूक्ष्मजीवों या उनके विषैले पदार्थों से संदूषण।", "খাবারের উৎপাদন, প্রস্তুত, প্যাকেজিং, প্রক্রিয়াকরণ, সংরক্ষণ, পরিবহন বা প্রস্তুতির সময় খাবারের উপরে বা ভেতরে অণুজীব বা তাদের বিষাক্ত পদার্থ দ্বারা দূষণ।", "Kontaminasi oleh mikroorganisme atau toksinnya pada atau di dalam pangan selama produksi, pengolahan, pengemasan, penyimpanan, pengangkutan, atau penyiapan.", "खाना उत्पादन, निर्माण, प्याकेजिङ, प्रशोधन, भण्डारण, ढुवानी, तयारी वा ह्यान्डल गर्दा खानामा वा खानाभित्र सूक्ष्मजीव वा तिनीहरूले बनाएको विषाक्त पदार्थ मिसिनु।"], ["n", "أمثلة: لمس الغذاء بأيدٍ متسخة؛ سقوط حشرة على الغذاء؛ تقطير سوائل من غذاء نيء على غذاء مطهي في الثلاجة.", "Examples: touching food with dirty hands; an insect falling onto food; liquid dripping from raw food onto cooked food in the fridge.", "उदाहरण: गंदे हाथों से भोजन छूना; भोजन पर कीड़ा गिरना; फ्रिज में कच्चे भोजन से पके भोजन पर तरल टपकना।", "উদাহরণ: নোংরা হাতে খাবার ছোঁয়া; খাবারের উপর পোকা পড়া; ফ্রিজে কাঁচা খাবারের তরল রান্না করা খাবারে চুঁইয়ে পড়া।", "Contoh: menyentuh pangan dengan tangan kotor; serangga jatuh ke pangan; cairan menetes dari pangan mentah ke pangan matang di kulkas.", "उदाहरणहरू: फोहोर हातले खाना छुनु; खानामा कीरा खस्नु; फ्रिजमा काँचो खानाबाट चुहिएको तरल पकाएको खानामा चुहिनु।"], ["n", "أنتبه دائماً: يجب حفظ الغذاء النيء مغطى وفي الجزء السفل
