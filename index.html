an sabun."],["li","وجود أحواض منفصلة لغسل الغذاء والمعدات.","Separate sinks exist for washing food and equipment.","भोजन और उपकरण धोने के लिए अलग सिंक हों।","খাবার ও যন্ত্র ধোয়ার জন্য আলাদা বেসিন থাকবে।","Tersedia wastafel terpisah untuk mencuci pangan dan peralatan."],["n","ماذا يعني هذا لنا؟ (الاشتراطات العامة): علينا العمل في أماكن نظيفة وواضحة تفصل بين المناطق التي تتعامل فيها مع المواد النيئة وتلك المناطق التي يتم فيها تحضير وتقديم الغذاء. هذا يمنع انتقال التلوث ويجعل العمل أكثر أماناً. الأدوات والمعدات التي نستخدمها يجب أن تكون مصنوعة من مواد آمنة وصحية وسهلة التنظيف. عند استخدام معدات تنظيف، نضمن أن الغذاء الذي نقدمه آمن وخالٍ من المخاطر.","What this means for us (general requirements): we must work in clean, clearly organised places that separate areas where we handle raw materials from areas where food is prepared and served. This prevents contamination spreading and makes work safer. The tools and equipment we use must be made of safe, healthy, easy-to-clean materials. When we use cleaning equipment, we make sure the food we serve is safe and free of hazards.","हमारे लिए इसका अर्थ (सामान्य शर्तें): हमें साफ़ और स्पष्ट रूप से व्यवस्थित जगहों पर काम करना चाहिए जहाँ कच्चे माल वाले क्षेत्र भोजन तैयार और परोसने वाले क्षेत्रों से अलग हों। इससे संदूषण नहीं फैलता और काम सुरक्षित होता है। हमारे औज़ार और उपकरण सुरक्षित, स्वच्छ और आसानी से साफ़ होने वाली सामग्री के होने चाहिए। सफाई उपकरण इस्तेमाल करते समय सुनिश्चित करें कि परोसा गया भोजन सुरक्षित और खतरों से मुक्त हो।","আমাদের জন্য এর অর্থ (সাধারণ শর্তাবলি): আমাদের পরিষ্কার ও সুস্পষ্টভাবে গোছানো জায়গায় কাজ করতে হবে, যেখানে কাঁচামাল নাড়াচাড়ার এলাকা খাবার প্রস্তুত ও পরিবেশনের এলাকা থেকে আলাদা। এতে দূষণ ছড়ায় না এবং কাজ নিরাপদ হয়। আমরা যে সরঞ্জাম ও যন্ত্র ব্যবহার করি তা নিরাপদ, স্বাস্থ্যকর ও সহজে পরিষ্কারযোগ্য উপাদানে হতে হবে। পরিষ্কারের যন্ত্র ব্যবহারে নিশ্চিত করি যে পরিবেশিত খাবার নিরাপদ ও বিপদমুক্ত।","Bagi kita (persyaratan umum): kita harus bekerja di tempat yang bersih dan tertata jelas, dengan memisahkan area penanganan bahan mentah dari area persiapan dan penyajian pangan. Ini mencegah kontaminasi menyebar dan membuat kerja lebih aman. Perkakas dan peralatan yang kita pakai harus terbuat dari bahan yang aman, sehat, dan mudah dibersihkan. Saat memakai peralatan pembersih, kita pastikan pangan yang disajikan aman dan bebas bahaya."],["h3","ما دورك في الحفاظ على الاشتراطات العامة؟","What is your role in maintaining the general requirements?","सामान्य शर्तों को बनाए रखने में आपकी भूमिका क्या है?","সাধারণ শর্তাবলি বজায় রাখায় আপনার ভূমিকা কী?","Apa peranmu dalam menjaga persyaratan umum?"],["p","كعاملين في منشآت الغذاء، لديك دور حيوي في ضمان الحفاظ على الاشتراطات العامة يومياً.","As workers in food establishments, you have a vital role in maintaining the general requirements every day.","खाद्य प्रतिष्ठान के कर्मचारी के रूप में, हर दिन सामान्य शर्तों को बनाए रखने में आपकी अहम भूमिका है।","খাদ্য প্রতিষ্ঠানের কর্মী হিসেবে, প্রতিদিন সাধারণ শর্তাবলি বজায় রাখায় আপনার গুরুত্বপূর্ণ ভূমিকা আছে।","Sebagai pekerja di usaha pangan, Anda memiliki peran vital dalam menjaga persyaratan umum setiap hari."],["h3","الحفاظ على سير العمل","Maintaining the workflow","कार्यप्रवाह बनाए रखना","কাজের প্রবাহ বজায় রাখা","Menjaga alur kerja"],["p","تتبع خطوات العمل بشكل صحيح، من الاستلام إلى تقديم الغذاء.","Follow the work steps correctly, from receiving to serving food.","प्राप्ति से भोजन परोसने तक कार्य के चरण सही क्रम में अपनाएँ।","গ্রহণ থেকে পরিবেশন পর্যন্ত কাজের ধাপ সঠিকভাবে অনুসরণ করুন।","Ikuti langkah kerja dengan benar, dari penerimaan hingga penyajian pangan."],["li","مثال: لا تعيد الغذاء المطبوخ إلى منطقة النيئة.","Example: do not return cooked food to the raw area.","उदाहरण: पका भोजन वापस कच्चे क्षेत्र में न ले जाएँ।","উদাহরণ: রান্না করা খাবার আবার কাঁচা এলাকায় ফেরত নিয়ে যাবেন না।","Contoh: jangan kembalikan pangan matang ke area mentah."],["li","لماذا؟ لمنع التلوث العرضي وتحسين كفاءة العمل.","Why? To prevent accidental contamination and improve work efficiency.","क्यों? आकस्मिक संदूषण रोकने और काम की कुशलता बढ़ाने के लिए।","কেন? আকস্মিক দূষণ রোধ ও কাজের দক্ষতা বাড়াতে।","Mengapa? Untuk mencegah kontaminasi tidak sengaja dan meningkatkan efisiensi kerja."],["h3","الفصل بين المناطق النظيفة وغير النظيفة","Separating clean and unclean areas","साफ़ और गंदे क्षेत्रों को अलग रखना","পরিষ্কার ও অপরিষ্কার এলাকা আলাদা রাখা","Memisahkan area bersih dan kotor"],["p","الفصل بين مناطق العمليات المختلفة في المنشأة الغذائية.","Separating the different operating areas within the food establishment.","खाद्य प्रतिष्ठान के विभिन्न परिचालन क्षेत्रों को अलग रखना।","খাদ্য প্রতিষ্ঠানের বিভিন্ন কার্যক্রমের এলাকা আলাদা রাখা।","Memisahkan berbagai area operasional dalam usaha pangan."],["li","مثال: لا تقطع اللحم النيء في أماكن إعداد السلطة.","Example: do not cut raw meat in salad preparation areas.","उदाहरण: सलाद तैयार करने की जगह पर कच्चा मांस न काटें।","উদাহরণ: সালাদ প্রস্তুতির জায়গায় কাঁচা মাংস কাটবেন না।","Contoh: jangan memotong daging mentah di area penyiapan salad."],["li","لماذا؟ لمنع انتقال الملوثات بين المناطق المختلفة، ما يسمى بالتلوث الخلطي.","Why? To prevent contaminants passing between different areas, known as cross-contamination.","क्यों? विभिन्न क्षेत्रों के बीच प्रदूषक न जाएँ, इसे क्रॉस-संदूषण कहते हैं।","কেন? বিভিন্ন এলাকার মধ্যে দূষক যাওয়া ঠেকাতে, যাকে ক্রস-দূষণ বলে।","Mengapa? Untuk mencegah bahan pencemar berpindah antar area, yang disebut kontaminasi silang."],["h3","العناية بالأدوات والمعدات","Caring for tools and equipment","औज़ारों और उपकरणों की देखभाल","সরঞ্জাম ও যন্ত্রের যত্ন","Merawat perkakas dan peralatan"],["p","تستخدم الأدوات بشكل صحيح وتنظفها وتطهرها بعد كل استخدام.","Use tools correctly and clean and sanitise them after every use.","औज़ार सही तरह इस्तेमाल करें और हर इस्तेमाल के बाद साफ़ और सैनिटाइज़ करें।","সরঞ্জাম সঠিকভাবে ব্যবহার করুন এবং প্রতিবার ব্যবহারের পর পরিষ্কার ও জীবাণুমুক্ত করুন।","Gunakan perkakas dengan benar dan bersihkan serta sanitasi setelah setiap penggunaan."],["li","مثال: تنظيف الأدوات وتخزينها بشكل صحيح بعد الاستخدام.","Example: clean and store tools properly after use.","उदाहरण: इस्तेमाल के बाद औज़ार साफ़ करें और सही तरीके से रखें।","উদাহরণ: ব্যবহারের পর সরঞ্জাম সঠিকভাবে পরিষ্কার ও সংরক্ষণ করুন।","Contoh: bersihkan dan simpan perkakas dengan benar setelah dipakai."],["li","لماذا؟ للحفاظ عليها، وضمان سلامتها للاستخدام مع الغذاء.","Why? To keep them in good condition and ensure they are safe for use with food.","क्यों? उन्हें अच्छी हालत में रखने और भोजन के साथ सुरक्षित इस्तेमाल सुनिश्चित करने के लिए।","কেন? এগুলো ভালো রাখতে এবং খাবারের সঙ্গে নিরাপদে ব্যবহার নিশ্চিত করতে।","Mengapa? Untuk menjaganya tetap baik dan memastikan aman digunakan bersama pangan."],["h3","الحفاظ على التهوية الجيدة","Keeping good ventilation","अच्छा वेंटिलेशन बनाए रखना","ভালো বায়ু চলাচল বজায় রাখা","Menjaga ventilasi yang baik"],["p","تأكد من تشغيل أنظمة التهوية بانتظام.","Make sure ventilation systems run regularly.","सुनिश्चित करें कि वेंटिलेशन सिस्टम नियमित चलें।","নিশ্চিত করুন বায়ু চলাচল ব্যবস্থা নিয়মিত চালু থাকে।","Pastikan sistem ventilasi berjalan secara teratur."],["li","مثال: تشغيل مراوح الشفط أثناء الطهي وإبقاؤها مشغلة.","Example: running extraction fans during cooking and keeping them on.","उदाहरण: पकाते समय एग्ज़ॉस्ट पंखे चलाएँ और उन्हें चालू रखें।","উদাহরণ: রান্নার সময় এক্সট্র্যাক্টর ফ্যান চালু রাখা।","Contoh: menyalakan kipas pengisap saat memasak dan membiarkannya menyala."],["li","لماذا؟ لمنع تراكم الروائح والحرارة والحفاظ على بيئة عمل صحية.","Why? To prevent odours and heat building up and to keep a healthy work environment.","क्यों? गंध और गर्मी जमा होने से रोकने और स्वस्थ कार्य वातावरण बनाए रखने के लिए।","কেন? গন্ধ ও তাপ জমা রোধ এবং সুস্থ কর্মপরিবেশ বজায় রাখতে।","Mengapa? Untuk mencegah bau dan panas menumpuk serta menjaga lingkungan kerja yang sehat."],["n","تذكر دائماً: الالتزام بالاشتراطات العامة يمنع المشاكل الصحية والنظامية، ما يدعم استمرارية المنشأة وأمان وظائفنا!","Always remember: following the general requirements prevents health and regulatory problems, which supports the continued operation and security of the establishment and our jobs!","हमेशा याद रखें: सामान्य शर्तों का पालन स्वास्थ्य और नियामक समस्याएँ रोकता है, जो प्रतिष्ठान के निरंतर संचालन और हमारी नौकरियों की सुरक्षा में मदद करता है!","সবসময় মনে রাখুন: সাধারণ শর্তাবলি মানলে স্বাস্থ্য ও বিধিগত সমস্যা রোধ হয়, যা প্রতিষ্ঠানের টিকে থাকা ও আমাদের চাকরির নিরাপত্তায় সাহায্য করে!","Selalu ingat: mematuhi persyaratan umum mencegah masalah kesehatan dan regulasi, yang mendukung kelangsungan usaha serta keamanan pekerjaan kita!"]]},{"t":["الحفاظ على الاشتراطات العامة (تابع)","General requirements (continued)","सामान्य आवश्यकताएँ (जारी)","সাধারণ প্রয়োজনীয়তা (চলমান)","Persyaratan umum (lanjutan)"],"r":[["h3","الحفاظ على الإضاءة الكافية","Maintaining adequate lighting","पर्याप्त प्रकाश बनाए रखना","পর্যাপ্ত আলো বজায় রাখা","Menjaga pencahayaan yang cukup"],["li","مثال: تنظيف المصابيح المعطلة أو المكسورة ونحرص على نظافتها.","Example: report burnt-out or broken lights and keep them clean.","उदाहरण: खराब या टूटे बल्बों की सूचना दें और उन्हें साफ़ रखें।","উদাহরণ: নষ্ট বা ভাঙা বাতি জানান এবং সেগুলো পরিষ্কার রাখুন।","Contoh: laporkan lampu yang mati atau rusak dan jaga kebersihannya."],["li","لماذا؟ يساعد في رؤية الغذاء بوضوح والتأكد من جودته.","Why? It helps us see the food clearly and confirm its quality.","क्यों? इससे भोजन साफ़ दिखता है और उसकी गुणवत्ता जाँचने में मदद मिलती है।","কেন? এতে খাবার স্পষ্ট দেখা যায় এবং মান যাচাই করা সহজ হয়।","Mengapa? Membantu melihat makanan dengan jelas dan memastikan kualitasnya."],["h3","الاستخدام الصحيح لأحواض غسل الغذاء والمعدات","Correct use of sinks for washing food and equipment","खाद्य और उपकरण धोने के लिए सिंक का सही उपयोग","খাবার ও সরঞ্জাম ধোয়ার সিংকের সঠিক ব্যবহার","Penggunaan wastafel yang benar untuk mencuci makanan dan peralatan"],["p","نستخدم الأحواض المخصصة لكل غرض.","Each sink is used only for its designated purpose.","हर सिंक का उपयोग केवल उसके निर्धारित काम के लिए करें।","প্রতিটি সিংক শুধু তার নির্দিষ্ট কাজের জন্য ব্যবহার করুন।","Setiap wastafel digunakan hanya untuk tujuannya."],["li","مثال: غسل الخضروات في الحوض المخصص لها، وليس في حوض غسل الأواني.","Example: wash vegetables in their own sink, not in the utensil-washing sink.","उदाहरण: सब्ज़ियाँ उनके लिए तय सिंक में धोएँ, बर्तन धोने वाले सिंक में नहीं।","উদাহরণ: সবজি তার নিজের সিংকে ধুন, বাসন ধোয়ার সিংকে নয়।","Contoh: cuci sayuran di wastafel khususnya, bukan di wastafel pencuci peralatan."],["li","لماذا؟ لمنع التلوث المتبادل بين الغذاء والمعدات.","Why? To prevent cross-contamination between food and equipment.","क्यों? भोजन और उपकरणों के बीच क्रॉस-संदूषण रोकने के लिए।","কেন? খাবার ও সরঞ্জামের মধ্যে ক্রস-দূষণ রোধ করতে।","Mengapa? Untuk mencegah kontaminasi silang antara makanan dan peralatan."],["n","تذكر دائماً: الإبلاغ الفوري عن أي مشاكل أو أعطال في المبنى أو المعدات للمشرف.","Always remember: report any problems or faults in the building or equipment to your supervisor immediately.","हमेशा याद रखें: इमारत या उपकरणों में किसी भी समस्या या खराबी की तुरंत सुपरवाइज़र को सूचना दें।","সবসময় মনে রাখুন: ভবন বা সরঞ্জামের যেকোনো সমস্যা বা ত্রুটি তৎক্ষণাৎ সুপারভাইজারকে জানান।","Ingat selalu: laporkan segera setiap masalah atau kerusakan pada bangunan atau peralatan kepada supervisor."]]},{"t":["إدارة سلامة الغذاء","Food safety management","खाद्य सुरक्षा प्रबंधन","খাদ্য নিরাপত্তা ব্যবস্থাপনা","Manajemen keamanan pangan"],"r":[["h2","ما هي إدارة سلامة الغذاء؟","What is food safety management?","खाद्य सुरक्षा प्रबंधन क्या है?","খাদ্য নিরাপত্তা ব্যবস্থাপনা কী?","Apa itu manajemen keamanan pangan?"],["p","إدارة سلامة الغذاء هي نظام شامل يهدف إلى ضمان سلامة الغذاء في جميع مراحل إنتاجه وتداوله. تبدأ بتحديد وتقييم المخاطر المحتملة التي تؤثر على سلامة الغذاء، ثم تضع تدابير السيطرة المناسبة للتحكم في هذه المخاطر أو تقليلها.","Food safety management is a comprehensive system aimed at ensuring food is safe at every stage of production and handling. It starts by identifying and assessing the potential hazards that affect food safety, then sets appropriate control measures to manage or reduce these risks.","खाद्य सुरक्षा प्रबंधन एक व्यापक प्रणाली है जिसका उद्देश्य उत्पादन और संभालने के हर चरण पर भोजन को सुरक्षित रखना है। यह संभावित खतरों की पहचान और मूल्यांकन से शुरू होता है, फिर इन जोखिमों को नियंत्रित या कम करने के लिए उचित नियंत्रण उपाय तय करता है।","খাদ্য নিরাপত্তা ব্যবস্থাপনা এমন একটি সামগ্রিক ব্যবস্থা যা উৎপাদন ও পরিচালনার প্রতিটি ধাপে খাবার নিরাপদ রাখার লক্ষ্যে কাজ করে। এটি খাবারের নিরাপত্তাকে প্রভাবিত করতে পারে এমন সম্ভাব্য ঝুঁকি চিহ্নিত ও মূল্যায়ন দিয়ে শুরু হয়, তারপর এসব ঝুঁকি নিয়ন্ত্রণ বা কমানোর উপযুক্ত ব্যবস্থা ঠিক করে।","Manajemen keamanan pangan adalah sistem menyeluruh untuk memastikan makanan aman di setiap tahap produksi dan penanganannya. Dimulai dengan mengidentifikasi dan menilai potensi bahaya yang memengaruhi keamanan pangan, lalu menetapkan tindakan pengendalian yang sesuai untuk mengelola atau mengurangi risiko tersebut."],["p","يحدد إطار المتطلبات اللازمة لضمان سلامة الغذاء في كل مرحلة، موجهة العاملين لتطبيق ممارسات آمنة وصحية. يتم تطبيق هذه الإجراءات عملياً من خلال التداول الآمن للغذاء، بدءاً من الاستلام وحتى تقديم الخدمة.","A framework sets the requirements needed to keep food safe at every stage, guiding workers to apply safe and hygienic practices. These actions are applied in practice through safe food handling, from receiving to serving.","एक ढाँचा हर चरण पर भोजन को सुरक्षित रखने के लिए आवश्यक शर्तें तय करता है और कर्मचारियों को सुरक्षित व स्वच्छ तरीके अपनाने का मार्गदर्शन देता है। ये कदम व्यवहार में सुरक्षित खाद्य संभाल के ज़रिए लागू होते हैं, प्राप्ति से परोसने तक।","প্রতিটি ধাপে খাবার নিরাপদ রাখার জন্য প্রয়োজনীয় শর্ত একটি কাঠামো ঠিক করে এবং কর্মীদের নিরাপদ ও স্বাস্থ্যসম্মত পদ্ধতি অনুসরণে পরিচালিত করে। গ্রহণ থেকে পরিবেশন পর্যন্ত নিরাপদ খাদ্য পরিচালনার মাধ্যমে এগুলো বাস্তবে প্রয়োগ হয়।","Sebuah kerangka menetapkan persyaratan untuk menjaga makanan tetap aman di setiap tahap, membimbing pekerja menerapkan praktik yang aman dan higienis. Tindakan ini diterapkan melalui penanganan pangan yang aman, mulai dari penerimaan hingga penyajian."],["p","تعتمد المنشآت الغذائية على أنظمة معترف بها عالمياً مثل الهاسب (HACCP) أو الآيزو 22000، والتي تركز على الوقاية وتحديد نقاط التحكم الحرجة. من خلال تطبيق إدارة سلامة الغذاء، تضمن المنشآت تقديم غذاء آمن وعالي الجودة، مع الامتثال للمعايير المحلية والدولية، والحفاظ على سمعتها في السوق.","Food businesses rely on internationally recognised systems such as HACCP or ISO 22000, which focus on prevention and identifying critical control points. By applying food safety management, establishments provide safe, high-quality food, comply with local and international standards, and protect their reputation in the market.","खाद्य व्यवसाय HACCP या ISO 22000 जैसी अंतरराष्ट्रीय मान्यता प्राप्त प्रणालियों पर निर्भर करते हैं, जो रोकथाम और महत्वपूर्ण नियंत्रण बिंदुओं की पहचान पर केंद्रित हैं। इनके ज़रिए प्रतिष्ठान सुरक्षित और उच्च गुणवत्ता का भोजन देते हैं, स्थानीय व अंतरराष्ट्रीय मानकों का पालन करते हैं और बाज़ार में अपनी साख बनाए रखते हैं।","খাদ্য ব্যবসাগুলো HACCP বা ISO 22000-এর মতো আন্তর্জাতিকভাবে স্বীকৃত ব্যবস্থার ওপর নির্ভর করে, যা প্রতিরোধ এবং সংকটপূর্ণ নিয়ন্ত্রণ বিন্দু চিহ্নিতকরণে গুরুত্ব দেয়। এর মাধ্যমে প্রতিষ্ঠানগুলো নিরাপদ ও উচ্চমানের খাবার সরবরাহ করে, স্থানীয় ও আন্তর্জাতিক মান মেনে চলে এবং বাজারে সুনাম ধরে রাখে।","Usaha pangan mengandalkan sistem yang diakui secara internasional seperti HACCP atau ISO 22000, yang berfokus pada pencegahan dan penentuan titik kendali kritis. Dengan menerapkan manajemen keamanan pangan, usaha menyediakan makanan yang aman dan berkualitas, memenuhi standar lokal dan internasional, serta menjaga reputasinya di pasar."],["n","رغم أن إعداد نظام إدارة سلامة المنشأة هو مسؤولية إدارة المنشأة، فإن نجاح هذا النظام يعتمد على جهود كل فرد في المنشأة. بمجرد وضع النظام، يصبح كل منا جزءاً مهماً من عملية تنفيذه والحفاظ عليه.","Although setting up the food safety management system is the responsibility of management, its success depends on the efforts of every person in the establishment. Once the system is in place, each of us becomes an important part of carrying it out and maintaining it.","हालाँकि खाद्य सुरक्षा प्रबंधन प्रणाली तैयार करना प्रबंधन की ज़िम्मेदारी है, पर इसकी सफलता प्रतिष्ठान के हर व्यक्ति के प्रयासों पर निर्भर करती है। एक बार प्रणाली लागू हो जाने पर, हम में से हर कोई इसे चलाने और बनाए रखने का महत्वपूर्ण हिस्सा बन जाता है।","যদিও খাদ্য নিরাপত্তা ব্যবস্থাপনা ব্যবস্থা তৈরি করা ব্যবস্থাপনার দায়িত্ব, এর সফলতা প্রতিষ্ঠানের প্রত্যেক ব্যক্তির প্রচেষ্টার ওপর নির্ভর করে। ব্যবস্থা চালু হলে আমাদের প্রত্যেকেই এটি বাস্তবায়ন ও রক্ষণাবেক্ষণের গুরুত্বপূর্ণ অংশ হয়ে যাই।","Meski menyiapkan sistem manajemen keamanan pangan adalah tanggung jawab manajemen, keberhasilannya bergantung pada upaya setiap orang di usaha ini. Setelah sistem berjalan, masing-masing dari kita menjadi bagian penting dalam melaksanakan dan menjaganya."],["n","تذكر دائماً: التداول الآمن للغذاء في المنشآت هو التطبيق العملي لنظام سلامة الغذاء في جميع مراحل التعامل مع الغذاء: الاستلام، التخزين، التحضير، التقديم، والخدمة!","Always remember: safe food handling in establishments is the practical application of the food safety system at every stage of dealing with food: receiving, storage, preparation, serving and service!","हमेशा याद रखें: प्रतिष्ठानों में सुरक्षित खाद्य संभाल खाद्य सुरक्षा प्रणाली का व्यावहारिक रूप है, जो भोजन के हर चरण पर लागू होता है: प्राप्ति, भंडारण, तैयारी, परोसना और सेवा!","সবসময় মনে রাখুন: প্রতিষ্ঠানে নিরাপদ খাদ্য পরিচালনা হলো খাদ্য নিরাপত্তা ব্যবস্থার বাস্তব প্রয়োগ, যা খাবারের প্রতিটি ধাপে প্রযোজ্য: গ্রহণ, সংরক্ষণ, প্রস্তুতি, পরিবেশন ও সেবা!","Ingat selalu: penanganan pangan yang aman di usaha adalah penerapan sistem keamanan pangan di setiap tahap: penerimaan, penyimpanan, persiapan, penyajian dan layanan!"]]},{"t":["نظام الهاسب (HACCP)","HACCP system","HACCP प्रणाली","HACCP ব্যবস্থা","Sistem HACCP"],"r":[["h2","ما هو نظام الهاسب (HACCP)؟","What is the HACCP system?","HACCP प्रणाली क्या है?","HACCP ব্যবস্থা কী?","Apa itu sistem HACCP?"],["li","هو اختصار لـ \"تحليل المخاطر ونقاط التحكم الحرجة\" Hazard Analysis Critical Control Points - HACCP.","HACCP stands for Hazard Analysis and Critical Control Points.","HACCP का अर्थ है खतरा विश्लेषण और महत्वपूर्ण नियंत्रण बिंदु (Hazard Analysis Critical Control Points)।","HACCP মানে হলো বিপদ বিশ্লেষণ ও সংকটপূর্ণ নিয়ন্ত্রণ বিন্দু (Hazard Analysis Critical Control Points)।","HACCP adalah singkatan dari Hazard Analysis Critical Control Points (Analisis Bahaya dan Titik Kendali Kritis)."],["li","نظام عالمي معترف به لإدارة سلامة الغذاء.","An internationally recognised system for managing food safety.","खाद्य सुरक्षा प्रबंधन के लिए एक अंतरराष्ट्रीय मान्यता प्राप्त प्रणाली।","খাদ্য নিরাপত্তা ব্যবস্থাপনার একটি আন্তর্জাতিক স্বীকৃত পদ্ধতি।","Sistem yang diakui secara internasional untuk mengelola keamanan pangan."],["li","يساعد المنشآت الغذائية على تحديد وتقييم والتحكم في المخاطر المهمة التي قد تؤثر على سلامة الغذاء.","It helps food businesses identify, assess and control the important hazards that may affect food safety.","यह खाद्य व्यवसायों को उन महत्वपूर्ण खतरों की पहचान, मूल्यांकन और नियंत्रण में मदद करता है जो भोजन की सुरक्षा को प्रभावित कर सकते हैं।","এটি খাদ্য ব্যবসাকে খাদ্য নিরাপত্তাকে প্রভাবিত করতে পারে এমন গুরুত্বপূর্ণ বিপদ চিহ্নিত, মূল্যায়ন ও নিয়ন্ত্রণে সাহায্য করে।","Membantu usaha pangan mengidentifikasi, menilai dan mengendalikan bahaya penting yang dapat memengaruhi keamanan pangan."],["li","يتكون من 7 مبادئ، 12 خطوة لتنفيذه.","It consists of 7 principles and 12 steps for implementation.","इसमें 7 सिद्धांत और लागू करने के लिए 12 चरण हैं।","এতে ৭টি নীতি ও বাস্তবায়নের জন্য ১২টি ধাপ রয়েছে।","Terdiri dari 7 prinsip dan 12 langkah pelaksanaan."],["h3","كيف يعمل نظام الهاسب؟","How does HACCP work?","HACCP कैसे काम करता है?","HACCP কীভাবে কাজ করে?","Bagaimana cara kerja HACCP?"],["li","يحدد جميع النقاط في عملية إنتاج الغذاء حيث قد تحدث مخاطر.","It identifies all points in the food production process where hazards may occur.","यह भोजन उत्पादन की हर उस प्रक्रिया-बिंदु की पहचान करता है जहाँ खतरा उत्पन्न हो सकता है।","এটি খাদ্য উৎপাদনের সব সেই বিন্দু চিহ্নিত করে যেখানে বিপদ ঘটতে পারে।","Mengidentifikasi semua titik dalam proses produksi pangan tempat bahaya dapat terjadi."],["li","يقرر أي من هذه النقاط حرجة لسلامة المنتج النهائي.","It decides which of these points are critical to the safety of the final product.","यह तय करता है कि इनमें से कौन-से बिंदु अंतिम उत्पाद की सुरक्षा के लिए महत्वपूर्ण हैं।","এসবের মধ্যে কোনগুলো চূড়ান্ত পণ্যের নিরাপত্তার জন্য সংকটপূর্ণ তা নির্ধারণ করে।","Menentukan titik mana yang kritis bagi keamanan produk akhir."],["li","يركز على التحكم في هذه النقاط الحرجة.","It focuses on controlling these critical points.","यह इन महत्वपूर्ण बिंदुओं के नियंत्रण पर ध्यान केंद्रित करता है।","এটি এই সংকটপূর্ণ বিন্দুগুলো নিয়ন্ত্রণের ওপর জোর দেয়।","Berfokus pada pengendalian titik-titik kritis tersebut."]]},{"t":["المتطلبات الأساسية لتطبيق نظام الهاسب","Prerequisites for applying the HACCP system","HACCP लागू करने की मूल आवश्यकताएँ","HACCP প্রয়োগের মৌলিক প্রয়োজনীয়তা","Prasyarat dasar penerapan sistem HACCP"],"r":[["p","يحتاج تطبيق نظام الهاسب في أي منشأة إلى إجراءات تمهيدية قبل البدء في التطبيق. يجب أن تكون المنشأة مصممة بشكل آمن، بها مرافق كافية، ومعدات مناسبة.","Applying HACCP in any establishment needs preliminary steps before starting. The facility must be designed safely, with adequate utilities and suitable equipment.","किसी भी प्रतिष्ठान में HACCP लागू करने से पहले प्रारंभिक कदम ज़रूरी हैं। प्रतिष्ठान सुरक्षित रूप से डिज़ाइन किया गया हो, उसमें पर्याप्त सुविधाएँ और उचित उपकरण हों।","যেকোনো প্রতিষ্ঠানে HACCP প্রয়োগের আগে প্রাথমিক পদক্ষেপ প্রয়োজন। প্রতিষ্ঠানটি নিরাপদভাবে নকশা করা, পর্যাপ্ত সুবিধা ও উপযুক্ত সরঞ্জামসম্পন্ন হতে হবে।","Penerapan HACCP di usaha mana pun memerlukan langkah awal sebelum dimulai. Fasilitas harus dirancang aman, dengan utilitas dan peralatan yang memadai."],["p","يجب وضع إجراءات تغطي هذه المتطلبات الأساسية، وتشمل هذه الإجراءات:","Procedures must also be set up to cover these prerequisites, including:","इन मूल आवश्यकताओं को कवर करने के लिए प्रक्रियाएँ भी बनानी होंगी, जिनमें शामिल हैं:","এই মৌলিক প্রয়োজনীয়তাগুলো ঢাকতে পদ্ধতিও ঠিক করতে হবে, যার মধ্যে রয়েছে:","Prosedur juga harus disusun untuk memenuhi prasyarat ini, meliputi:"],["li","المواصفات القياسية للمنتجات: وضع معايير واضحة لجودة المواد الأولية والمنتجات.","Product specifications: setting clear standards for the quality of raw materials and products.","उत्पाद विनिर्देश: कच्चे माल और उत्पादों की गुणवत्ता के स्पष्ट मानक तय करना।","পণ্যের স্পেসিফিকেশন: কাঁচামাল ও পণ্যের মানের স্পষ্ট মান নির্ধারণ।","Spesifikasi produk: menetapkan standar yang jelas untuk kualitas bahan baku dan produk."],["li","التصميم والبنية التحتية: ضمان أن المنشأة والمعدات مصممة لتسهيل النظافة ومنع التلوث.","Design and infrastructure: making sure the establishment and equipment are designed to make cleaning easy and prevent contamination.","डिज़ाइन और आधारभूत ढाँचा: सुनिश्चित करना कि प्रतिष्ठान और उपकरण सफ़ाई आसान बनाने और संदूषण रोकने के लिए डिज़ाइन हों।","নকশা ও অবকাঠামো: প্রতিষ্ঠান ও সরঞ্জাম সহজে পরিষ্কার করা ও দূষণ রোধের জন্য নকশা করা নিশ্চিত করা।","Desain dan infrastruktur: memastikan bangunan dan peralatan dirancang agar mudah dibersihkan dan mencegah kontaminasi."],["li","النظافة الشخصية: الحفاظ على معايير عالية للنظافة للعاملين في المنشأة.","Personal hygiene: maintaining high hygiene standards for the workers in the establishment.","व्यक्तिगत स्वच्छता: प्रतिष्ठान के कर्मचारियों के लिए उच्च स्वच्छता मानक बनाए रखना।","ব্যক্তিগত পরিচ্ছন্নতা: প্রতিষ্ঠানের কর্মীদের জন্য উচ্চ পরিচ্ছন্নতার মান বজায় রাখা।","Higiene pribadi: menjaga standar kebersihan yang tinggi bagi pekerja di usaha."],["li","التنظيف والتطهير: وضع جداول لتنظيف وتطهير الأسطح والمعدات بشكل دوري.","Cleaning and sanitising: setting schedules to clean and sanitise surfaces and equipment regularly.","सफ़ाई और सैनिटाइज़ेशन: सतहों और उपकरणों को नियमित रूप से साफ़ व सैनिटाइज़ करने के लिए कार्यक्रम बनाना।","পরিষ্কার ও জীবাণুমুক্তকরণ: তল ও সরঞ্জাম নিয়মিত পরিষ্কার ও জীবাণুমুক্ত করার সময়সূচি তৈরি।","Pembersihan dan sanitasi: menyusun jadwal untuk membersihkan dan menyanitasi permukaan serta peralatan secara berkala."],["li","التخلص من النفايات: التخلص الآمن والمنظم من النفايات.","Waste disposal: safe and organised disposal of waste.","अपशिष्ट निपटान: कचरे का सुरक्षित और व्यवस्थित तरीके से निपटान।","বর্জ্য নিষ্কাশন: বর্জ্য নিরাপদ ও সুশৃঙ্খলভাবে ফেলা।","Pembuangan limbah: membuang limbah secara aman dan teratur."],["li","مكافحة الآفات: تطبيق خطة فعالة لمكافحة الحشرات والقوارض.","Pest control: applying an effective plan to control insects and rodents.","कीट नियंत्रण: कीड़ों और चूहों को नियंत्रित करने के लिए प्रभावी योजना लागू करना।","কীটপতঙ্গ নিয়ন্ত্রণ: পোকামাকড় ও ইঁদুর নিয়ন্ত্রণে কার্যকর পরিকল্পনা প্রয়োগ।","Pengendalian hama: menerapkan rencana efektif untuk mengendalikan serangga dan hewan pengerat."],["li","التخزين والتحكم بالمخزون: ترتيب المواد الغذائية وتخزينها بطريقة تمنع التلوث أو التلف.","Storage and stock control: arranging and storing food materials in a way that prevents contamination or spoilage.","भंडारण और स्टॉक नियंत्रण: खाद्य सामग्री को इस तरह व्यवस्थित करना कि संदूषण या खराबी न हो।","সংরক্ষণ ও মজুদ নিয়ন্ত্রণ: খাদ্য উপকরণ এমনভাবে সাজানো ও সংরক্ষণ যেন দূষণ বা নষ্ট না হয়।","Penyimpanan dan pengendalian stok: menata dan menyimpan bahan pangan agar tidak terkontaminasi atau rusak."],["li","تدريب العاملين: تدريب العاملين على مبادئ الصحة والنظافة العامة وتطبيق نظام الهاسب.","Staff training: training workers in general health and hygiene principles and applying the HACCP system.","कर्मचारी प्रशिक्षण: कर्मचारियों को सामान्य स्वास्थ्य व स्वच्छता सिद्धांतों और HACCP प्रणाली के उपयोग का प्रशिक्षण देना।","কর্মী প্রশিক্ষণ: কর্মীদের সাধারণ স্বাস্থ্য ও পরিচ্ছন্নতার নীতি এবং HACCP ব্যবস্থা প্রয়োগে প্রশিক্ষণ দেওয়া।","Pelatihan pekerja: melatih pekerja tentang prinsip kesehatan dan kebersihan umum serta penerapan sistem HACCP."],["li","التعامل مع شكاوى العملاء: وضع آلية لاستقبال ومعالجة شكاوى العملاء المتعلقة بجودة الغذاء.","Handling customer complaints: setting up a system to receive and deal with customer complaints about food quality.","ग्राहक शिकायतें: भोजन की गुणवत्ता से जुड़ी ग्राहक शिकायतें प्राप्त करने और उनका समाधान करने की व्यवस्था बनाना।","গ্রাহক অভিযোগ: খাবারের মান সংক্রান্ত গ্রাহক অভিযোগ গ্রহণ ও নিষ্পত্তির ব্যবস্থা তৈরি।","Penanganan keluhan pelanggan: menyiapkan mekanisme untuk menerima dan menangani keluhan pelanggan tentang kualitas makanan."],["li","تتبع المنتجات وسحبها: توفير نظام لتتبع المنتجات وسحبها عند الضرورة للحفاظ على سلامة المستهلكين.","Product tracing and recall: providing a system to trace products and recall them when necessary to protect consumers.","उत्पाद ट्रेसिंग और वापसी: ज़रूरत पड़ने पर उत्पादों को ट्रेस करने और वापस मँगाने की व्यवस्था, ताकि उपभोक्ता सुरक्षित रहें।","পণ্য ট্রেসিং ও প্রত্যাহার: প্রয়োজনে ভোক্তাদের নিরাপত্তায় পণ্য ট্রেস ও প্রত্যাহারের ব্যবস্থা রাখা।","Penelusuran dan penarikan produk: menyediakan sistem untuk melacak dan menarik produk bila diperlukan demi keselamatan konsumen."],["li","إدارة الزوار والمقاولين: وضع ضوابط لزيارة المنشأة من قبل الأفراد غير العاملين بها.","Visitor and contractor management: setting rules for visits to the establishment by people who do not work there.","आगंतुक और ठेकेदार प्रबंधन: प्रतिष्ठान में बाहरी लोगों के आने-जाने के लिए नियम बनाना।","দর্শনার্থী ও ঠিকাদার ব্যবস্থাপনা: যারা প্রতিষ্ঠানে কাজ করেন না তাদের পরিদর্শনের নিয়ম তৈরি।","Pengelolaan pengunjung dan kontraktor: menetapkan aturan kunjungan ke usaha oleh orang yang bukan pekerja di sana."]]},{"t":["نظام الهاسب: عملية من 12 خطوة","HACCP system: a 12-step process","HACCP प्रणाली: 12 चरणों की प्रक्रिया","HACCP ব্যবস্থা: ১২ ধাপের প্রক্রিয়া","Sistem HACCP: proses 12 langkah"],"r":[["p","بعد تطبيق الإجراءات الأساسية، يمكن تنفيذ نظام الهاسب من خلال 12 خطوة (الخطوات 6-12 تعرف بالمبادئ السبعة للنظام):","After the prerequisites are in place, HACCP can be implemented through 12 steps (steps 6–12 are known as the seven principles of the system):","पूर्वापेक्षाएँ लागू होने के बाद, HACCP को 12 चरणों में लागू किया जा सकता है (चरण 6–12 प्रणाली के सात सिद्धांत कहलाते हैं):","পূর্বশর্ত প্রতিষ্ঠিত হওয়ার পর HACCP ১২টি ধাপে বাস্তবায়ন করা যায় (৬–১২ নম্বর ধাপগুলো ব্যবস্থার সাতটি নীতি নামে পরিচিত):","Setelah prasyarat terpenuhi, HACCP dapat diterapkan melalui 12 langkah (langkah 6–12 dikenal sebagai tujuh prinsip sistem):"],["li","1. تشكيل فريق الهاسب: يضم أعضاء من مختلف مستويات المسؤولية ومجالات العمل.","1. Form the HACCP team: includes members from different levels of responsibility and work areas.","1. HACCP टीम बनाएँ: इसमें जिम्मेदारी के विभिन्न स्तरों और कार्य क्षेत्रों के सदस्य शामिल हों।","১. HACCP দল গঠন: দায়িত্বের বিভিন্ন স্তর ও কাজের ক্ষেত্রের সদস্য অন্তর্ভুক্ত।","1. Membentuk tim HACCP: beranggotakan orang dari berbagai tingkat tanggung jawab dan bidang kerja."],["li","2. وصف المنتج: معرفة المكونات، طريقة التحضير، ظروف التخزين، ومدة الصلاحية.","2. Describe the product: know the ingredients, how it is prepared, storage conditions and shelf life.","2. उत्पाद का वर्णन: सामग्री, तैयारी का तरीका, भंडारण की स्थिति और शेल्फ़ लाइफ़ जानें।","২. পণ্যের বর্ণনা: উপাদান, প্রস্তুতির পদ্ধতি, সংরক্ষণের অবস্থা ও মেয়াদকাল জানা।","2. Mendeskripsikan produk: mengetahui bahan, cara penyiapan, kondisi penyimpanan dan masa simpan."],["li","3. تحديد الاستخدام المقصود: معرفة المستهلكين المحتملين وكيفية استخدامهم للمنتج.","3. Identify the intended use: know the likely consumers and how they will use the product.","3. इच्छित उपयोग तय करें: संभावित उपभोक्ताओं और उनके उत्पाद के उपयोग के तरीके को जानें।","৩. উদ্দিষ্ট ব্যবহার নির্ধারণ: সম্ভাব্য ভোক্তা ও তারা পণ্যটি কীভাবে ব্যবহার করবে তা জানা।","3. Menentukan penggunaan yang dimaksud: mengetahui calon konsumen dan cara mereka menggunakan produk."],["li","4. إنشاء مخطط تدفق العمليات: يشمل جميع مراحل إنتاج الغذاء من شراء المواد الخام حتى البيع أو الاستهلاك.","4. Draw a process flow diagram: covers all stages of production from buying raw materials to sale or consumption.","4. प्रक्रिया प्रवाह आरेख बनाएँ: कच्चा माल खरीदने से लेकर बिक्री या उपभोग तक के सभी चरण शामिल करें।","৪. প্রক্রিয়া প্রবাহ চিত্র তৈরি: কাঁচামাল কেনা থেকে বিক্রি বা ভোগ পর্যন্ত উৎপাদনের সব ধাপ অন্তর্ভুক্ত।","4. Membuat diagram alur proses: mencakup semua tahap produksi dari pembelian bahan mentah hingga penjualan atau konsumsi."],["li","5. التأكد من صحة مخطط تدفق العمليات في الموقع: للتحقق من مطابقة المخطط للواقع.","5. Verify the process flow diagram on site: to confirm the diagram matches what really happens.","5. प्रवाह आरेख को मौके पर जाँचें: यह सुनिश्चित करने के लिए कि आरेख वास्तविकता से मेल खाता है।","৫. ঘটনাস্থলে প্রবাহ চিত্র যাচাই: চিত্রটি বাস্তবের সাথে মিলছে কি না তা নিশ্চিত করা।","5. Memverifikasi diagram alur di lokasi: memastikan diagram sesuai dengan kenyataan."],["li","6. إجراء تحليل المخاطر: تحديد المخاطر المحتملة وتقييمها ووضع إجراءات التحكم.","6. Conduct a hazard analysis: identify and assess potential hazards and set control measures.","6. खतरा विश्लेषण करें: संभावित खतरों की पहचान, मूल्यांकन और नियंत्रण उपाय तय करें।","৬. বিপদ বিশ্লেষণ: সম্ভাব্য বিপদ চিহ্নিত, মূল্যায়ন ও নিয়ন্ত্রণ ব্যবস্থা ঠিক করা।","6. Melakukan analisis bahaya: mengidentifikasi dan menilai bahaya potensial serta menetapkan tindakan pengendalian."],["li","7. تحديد نقاط التحكم الحرجة: النقاط التي يجب التحكم فيها لضمان سلامة الغذاء.","7. Identify critical control points: the points that must be controlled to keep food safe.","7. महत्वपूर्ण नियंत्रण बिंदु तय करें: वे बिंदु जिन पर भोजन की सुरक्षा के लिए नियंत्रण ज़रूरी है।","৭. সংকটপূর্ণ নিয়ন্ত্রণ বিন্দু নির্ধারণ: যে বিন্দুগুলো খাবারের নিরাপত্তার জন্য নিয়ন্ত্রণ করতে হবে।","7. Menentukan titik kendali kritis: titik yang harus dikendalikan untuk menjaga keamanan pangan."],["li","8. وضع الحدود الحرجة: تحديد المستويات المقبولة لكل نقطة تحكم حرجة.","8. Set critical limits: define the acceptable levels for each critical control point.","8. महत्वपूर्ण सीमाएँ तय करें: हर महत्वपूर्ण नियंत्रण बिंदु के लिए स्वीकार्य स्तर तय करें।","৮. সংকটপূর্ণ সীমা নির্ধারণ: প্রতিটি সংকটপূর্ণ নিয়ন্ত্রণ বিন্দুর গ্রহণযোগ্য মাত্রা ঠিক করা।","8. Menetapkan batas kritis: menentukan tingkat yang dapat diterima untuk setiap titik kendali kritis."],["li","9. إنشاء إجراءات المراقبة: لضمان التحكم في المخاطر وحماية سلامة الغذاء.","9. Set up monitoring procedures: to make sure hazards are controlled and food safety is protected.","9. निगरानी प्रक्रियाएँ बनाएँ: खतरों पर नियंत्रण और भोजन की सुरक्षा सुनिश्चित करने के लिए।","৯. পর্যবেক্ষণ পদ্ধতি তৈরি: বিপদ নিয়ন্ত্রণ ও খাদ্য নিরাপত্তা নিশ্চিত করতে।","9. Membuat prosedur pemantauan: untuk memastikan bahaya terkendali dan keamanan pangan terjaga."],["li","10. تحديد الإجراءات التصحيحية: لمعالجة أي انحراف عن الحدود الحرجة.","10. Define corrective actions: to deal with any deviation from the critical limits.","10. सुधारात्मक कार्रवाई तय करें: महत्वपूर्ण सीमाओं से किसी भी विचलन से निपटने के लिए।","১০. সংশোধনমূলক ব্যবস্থা নির্ধারণ: সংকটপূর্ণ সীমা থেকে যেকোনো বিচ্যুতি মোকাবিলা করতে।","10. Menetapkan tindakan korektif: untuk menangani setiap penyimpangan dari batas kritis."],["li","11. إنشاء إجراءات التحقق: للتأكد من فعالية نظام الهاسب.","11. Set up verification procedures: to confirm the HACCP system is working.","11. सत्यापन प्रक्रियाएँ बनाएँ: यह पुष्टि करने के लिए कि HACCP प्रणाली काम कर रही है।","১১. যাচাইকরণ পদ্ধতি তৈরি: HACCP ব্যবস্থা কার্যকর কি না তা নিশ্চিত করতে।","11. Membuat prosedur verifikasi: untuk memastikan sistem HACCP efektif."],["li","12. إنشاء نظام للتوثيق وحفظ السجلات: لإثبات تطبيق وصيانة نظام الهاسب.","12. Set up documentation and record-keeping: to prove the HACCP system is applied and maintained.","12. दस्तावेज़ीकरण और रिकॉर्ड रखने की व्यवस्था बनाएँ: यह साबित करने के लिए कि HACCP प्रणाली लागू और बनाए रखी जा रही है।","১২. নথিভুক্তকরণ ও রেকর্ড সংরক্ষণ: HACCP ব্যবস্থা প্রয়োগ ও রক্ষণাবেক্ষণের প্রমাণ রাখতে।","12. Membuat sistem dokumentasi dan pencatatan: untuk membuktikan sistem HACCP diterapkan dan dipelihara."],["n","تذكر دائماً: التسجيل الدقيق لدرجات الحرارة والإجراءات التصحيحية ومراقبة النقاط الحرجة من أهم السجلات التي يجب الاحتفاظ بها وتعبئتها بدقة: سجلات درجات الحرارة (للمواد المستلمة، ووحدات التخزين، والغذاء أثناء الطهي والتبريد).","Always remember: accurate recording of temperatures, corrective actions and monitoring of critical points are among the most important records to keep and read: temperature logs (for received materials, storage units, food during cooking and cooling).","हमेशा याद रखें: तापमान, सुधारात्मक कार्रवाई और महत्वपूर्ण बिंदुओं की निगरानी का सटीक रिकॉर्ड सबसे ज़रूरी रिकॉर्ड हैं: तापमान लॉग (प्राप्त सामग्री, भंडारण इकाइयों और पकाने-ठंडा करने के दौरान भोजन के लिए)।","সবসময় মনে রাখুন: তাপমাত্রা, সংশোধনমূলক ব্যবস্থা ও সংকটপূর্ণ বিন্দু পর্যবেক্ষণের নির্ভুল রেকর্ড সবচেয়ে গুরুত্বপূর্ণ: তাপমাত্রা লগ (গৃহীত উপকরণ, সংরক্ষণ ইউনিট, রান্না ও শীতলীকরণের সময় খাবার)।","Ingat selalu: pencatatan suhu, tindakan korektif dan pemantauan titik kritis yang akurat adalah catatan terpenting: log suhu (bahan diterima, unit penyimpanan, makanan saat dimasak dan didinginkan)."]]},{"t":["التداول الآمن للغذاء في منشآت الغذاء","Safe food handling in food establishments","खाद्य प्रतिष्ठानों में सुरक्षित खाद्य संभाल","খাদ্য প্রতিষ্ঠানে নিরাপদ খাদ্য পরিচালনা","Penanganan pangan yang aman di usaha pangan"],"r":[["h2","التداول الآمن للغذاء في منشآت الغذاء","Safe food handling in food establishments","खाद्य प्रतिष्ठानों में सुरक्षित खाद्य संभाल","খাদ্য প্রতিষ্ঠানে নিরাপদ খাদ্য পরিচালনা","Penanganan pangan yang aman di usaha pangan"],["p","كعامل في منشآت الغذاء، وأيّاً كان دورك، فإن فهمك الكامل لجميع مراحل التداول الآمن للغذاء داخل المنشأة أمر بالغ الأهمية، ومعرفتك بكيفية التداول الآمن للغذاء تساعدك على:","As a worker in a food establishment, whatever your role, fully understanding every stage of safe food handling inside the establishment is very important. Knowing how to handle food safely helps you to:","खाद्य प्रतिष्ठान में कर्मचारी के रूप में, आपकी भूमिका जो भी हो, प्रतिष्ठान के भीतर भोजन संभालने के हर चरण को पूरी तरह समझना बहुत ज़रूरी है। सुरक्षित खाद्य संभाल जानने से आप:","খাদ্য প্রতিষ্ঠানের কর্মী হিসেবে, আপনার ভূমিকা যা-ই হোক, প্রতিষ্ঠানের ভেতরে নিরাপদ খাদ্য পরিচালনার প্রতিটি ধাপ পুরোপুরি বোঝা খুব গুরুত্বপূর্ণ। নিরাপদভাবে খাবার পরিচালনা জানলে আপনি:","Sebagai pekerja di usaha pangan, apa pun peran Anda, memahami sepenuhnya setiap tahap penanganan pangan yang aman di dalam usaha sangat penting. Mengetahui cara menangani pangan dengan aman membantu Anda untuk:"],["li","ضمان سلامة الغذاء في جميع المراحل لتقديم غذاء صحي وآمن.","Keep food safe at every stage to serve healthy, safe food.","हर चरण पर भोजन सुरक्षित रखें ताकि स्वस्थ और सुरक्षित भोजन परोसा जा सके।","স্বাস্থ্যকর ও নিরাপদ খাবার পরিবেশনের জন্য প্রতিটি ধাপে খাবার নিরাপদ রাখতে।","Menjaga makanan aman di setiap tahap untuk menyajikan makanan yang sehat dan aman."],["li","منع التلوث والأمراض المنقولة بالغذاء من خلال اتباع الإرشادات والإجراءات الصحيحة.","Prevent contamination and foodborne illness by following the correct guidance and procedures.","सही दिशानिर्देश और प्रक्रियाएँ अपनाकर संदूषण और खाद्यजनित बीमारियों को रोकना।","সঠিক নির্দেশনা ও পদ্ধতি অনুসরণ করে দূষণ ও খাদ্যবাহিত রোগ প্রতিরোধ করতে।","Mencegah kontaminasi dan penyakit bawaan pangan dengan mengikuti panduan dan prosedur yang benar."],["li","العمل بكفاءة وفعالية لضمان سلامة سير العمليات وتقليل الأخطاء والمخاطر.","Work efficiently and effectively to keep operations running smoothly and reduce errors and risks.","कार्य को कुशलता से करना ताकि संचालन सुचारु रहे और गलतियाँ व जोखिम कम हों।","দক্ষতা ও কার্যকরভাবে কাজ করে কার্যক্রম সুচারুভাবে চালাতে এবং ভুল ও ঝুঁকি কমাতে।","Bekerja efisien dan efektif agar operasi lancar serta kesalahan dan risiko berkurang."],["p","على الرغم من اختلاف الأنشطة في منشآت الغذاء (مثل المطاعم، البقالات، بوفيهات، وغيرها)، إلا أن هناك عمليات رئيسية مشتركة لتداول الغذاء في جميع هذه الأنشطة، وهي:","Although food establishments differ (such as restaurants, grocery shops, buffets and others), all of them share the same main handling steps:","हालाँकि खाद्य प्रतिष्ठान अलग-अलग होते हैं (जैसे रेस्तराँ, किराना दुकानें, बुफ़े आदि), फिर भी सभी में भोजन संभालने के ये मुख्य चरण समान होते हैं:","যদিও খাদ্য প্রতিষ্ঠান আলাদা (যেমন রেস্তোরাঁ, মুদি দোকান, বুফে ইত্যাদি), তবু সবগুলোতে খাবার পরিচালনার এই প্রধান ধাপগুলো একই:","Meskipun usaha pangan berbeda-beda (seperti restoran, toko kelontong, prasmanan dan lainnya), semuanya memiliki tahapan penanganan utama yang sama:"],["li","الشراء والنقل.","Purchase and transport.","खरीद और परिवहन।","ক্রয় ও পরিবহন।","Pembelian dan pengangkutan."],["li","الاستلام والتخزين.","Receiving and storage.","प्राप्ति और भंडारण।","গ্রহণ ও সংরক্ষণ।","Penerimaan dan penyimpanan."],["li","التحضير والإعداد.","Preparation and processing.","तैयारी और प्रसंस्करण।","প্রস্তুতি ও প্রক্রিয়াকরণ।","Persiapan dan pengolahan."],["li","التقديم والعرض.","Serving and display.","परोसना और प्रदर्शन।","পরিবেশন ও প্রদর্শন।","Penyajian dan pajangan."],["h3","أهمية التحكم في الوقت ودرجة الحرارة","The importance of controlling time and temperature","समय और तापमान नियंत्रण का महत्व","সময় ও তাপমাত্রা নিয়ন্ত্রণের গুরুত্ব","Pentingnya mengendalikan waktu dan suhu"],["p","التحكم في الوقت ودرجة الحرارة هو عنصر أساسي في كل عمليات تداول الغذاء في منشآت الغذاء وعاملين، يجب أن تفهم:","Controlling time and temperature is a basic element of every food-handling process in food establishments. You must understand:","समय और तापमान नियंत्रण खाद्य प्रतिष्ठानों में भोजन संभालने की हर प्रक्रिया का बुनियादी तत्व है। आपको यह समझना चाहिए:","সময় ও তাপমাত্রা নিয়ন্ত্রণ খাদ্য প্রতিষ্ঠানের প্রতিটি খাদ্য পরিচালনা প্রক্রিয়ার মূল উপাদান। আপনাকে বুঝতে হবে:","Mengendalikan waktu dan suhu adalah elemen dasar dalam setiap proses penanganan pangan di usaha pangan. Anda harus memahami:"],["li","كيفية وتوقيت فحص درجات الحرارة.","How and when to check temperatures.","तापमान कैसे और कब जाँचें।","তাপমাত্রা কীভাবে ও কখন পরীক্ষা করতে হয়।","Cara dan waktu memeriksa suhu."],["li","ما يجب فعله إذا كانت درجة الحرارة غير آمنة.","What to do if the temperature is unsafe.","तापमान असुरक्षित हो तो क्या करना है।","তাপমাত্রা অনিরাপদ হলে কী করতে হবে।","Apa yang harus dilakukan jika suhu tidak aman."],["li","أهمية قياس درجة الحرارة الداخلية (الجوهرية) للغذاء عالي الخطورة.","The importance of measuring the internal (core) temperature of high-risk food.","उच्च-जोखिम वाले भोजन का आंतरिक (कोर) तापमान मापने का महत्व।","উচ্চ-ঝুঁকির খাবারের অভ্যন্তরীণ (কোর) তাপমাত্রা মাপার গুরুত্ব।","Pentingnya mengukur suhu inti (internal) makanan berisiko tinggi."],["p","في هذه الوحدة، سنستعرض التداول الآمن للغذاء في الأنشطة الرئيسية في الأنشطة الغذائية وفقاً لمعايير إدارة سلامة الغذاء مثل الهاسب، لضمان تقديم غذاء آمن وعالي الجودة.","In this unit we will review safe food handling in the main activities of food establishments, following food safety management standards such as HACCP, to ensure safe, high-quality food.","इस इकाई में हम HACCP जैसे खाद्य सुरक्षा प्रबंधन मानकों के अनुसार खाद्य प्रतिष्ठानों की मुख्य गतिविधियों में सुरक्षित खाद्य संभाल की समीक्षा करेंगे, ताकि सुरक्षित और उच्च गुणवत्ता का भोजन दिया जा सके।","এই ইউনিটে আমরা HACCP-এর মতো খাদ্য নিরাপত্তা ব্যবস্থাপনার মানদণ্ড অনুসারে খাদ্য প্রতিষ্ঠানের প্রধান কার্যক্রমে নিরাপদ খাদ্য পরিচালনা পর্যালোচনা করব, যাতে নিরাপদ ও উচ্চমানের খাবার সরবরাহ নিশ্চিত হয়।","Dalam unit ini kita akan meninjau penanganan pangan yang aman pada kegiatan utama usaha pangan sesuai standar manajemen keamanan pangan seperti HACCP, untuk memastikan makanan yang aman dan berkualitas tinggi."]]},{"t":["الشراء والنقل","Purchasing and transport","खरीद और परिवहन","ক্রয় ও পরিবহন","Pembelian dan pengangkutan"],"r":[["h3","كيفية التداول الآمن؟","How to handle food safely?","सुरक्षित संभाल कैसे करें?","নিরাপদ পরিচালনা কীভাবে করবেন?","Bagaimana menangani pangan dengan aman?"],["li","الشراء من موردين موثوقين.","Buy from trusted suppliers.","भरोसेमंद आपूर्तिकर्ताओं से खरीदें।","বিশ্বস্ত সরবরাহকারীদের কাছ থেকে কিনুন।","Beli dari pemasok yang terpercaya."],["li","نقل الغذاء المبرد في درجة حرارة أقل من 5°م.","Transport chilled food at a temperature below 5°C.","ठंडा (चिल्ड) भोजन 5°C से कम तापमान पर ले जाएँ।","শীতল খাবার ৫°সে-এর নিচে পরিবহন করুন।","Angkut makanan dingin pada suhu di bawah 5°C."],["li","نقل الغذاء المجمد في درجة حرارة أقل من -18°م.","Transport frozen food at a temperature below -18°C.","जमा हुआ भोजन -18°C से कम तापमान पर ले जाएँ।","হিমায়িত খাবার -১৮°সে-এর নিচে পরিবহন করুন।","Angkut makanan beku pada suhu di bawah -18°C."],["h3","ما هي مسؤولياتك في عملية التداول؟","What are your responsibilities in the handling process?","खाद्य संभाल की प्रक्रिया में आपकी ज़िम्मेदारियाँ क्या हैं?","পরিচালনা প্রক্রিয়ায় আপনার দায়িত্ব কী?","Apa tanggung jawab Anda dalam proses penanganan?"],["li","التحقق من موردين موثوقية الموردين قبل الشراء.","Check the reliability of suppliers before buying.","खरीद से पहले आपूर्तिकर्ता की विश्वसनीयता जाँचें।","কেনার আগে সরবরাহকারীর নির্ভরযোগ্যতা যাচাই করুন।","Periksa keandalan pemasok sebelum membeli."],["li","فحص نظافة وسائل النقل قبل التحميل.","Check the cleanliness of transport vehicles before loading.","लोड करने से पहले परिवहन वाहन की सफ़ाई जाँचें।","লোড করার আগে পরিবহন যানের পরিচ্ছন্নতা পরীক্ষা করুন।","Periksa kebersihan kendaraan pengangkut sebelum memuat."],["li","مراقبة درجات الحرارة أثناء التحميل والنقل.","Monitor temperatures during loading and transport.","लोड करते और ले जाते समय तापमान की निगरानी करें।","লোড ও পরিবহনের সময় তাপমাত্রা পর্যবেক্ষণ করুন।","Pantau suhu selama pemuatan dan pengangkutan."],["li","التأكد من سرعة عملية التحميل والتفريغ.","Make sure loading and unloading are done quickly.","सुनिश्चित करें कि लोडिंग और अनलोडिंग जल्दी हो।","নিশ্চিত করুন লোড ও আনলোড দ্রুত হয়।","Pastikan proses pemuatan dan pembongkaran dilakukan dengan cepat."],["h3","ما التصرف في حالة التداول غير الآمن؟","What to do when handling is unsafe?","असुरक्षित संभाल की स्थिति में क्या करें?","অনিরাপদ পরিচালনার ক্ষেত্রে কী করবেন?","Apa yang dilakukan saat penanganan tidak aman?"],["li","أبلغ المشرف فوراً في جميع الحالات.","Report to your supervisor immediately in all cases.","सभी मामलों में तुरंत सुपरवाइज़र को बताएँ।","সব ক্ষেত্রে তৎক্ষণাৎ সুপারভাইজারকে জানান।","Segera laporkan kepada supervisor dalam semua kasus."],["li","ارفض التحميل أو الاستلام عند وجود مشاكل واضحة: وسائل النقل غير النظيفة أو الفروق الكبيرة في درجات الحرارة.","Refuse loading or receiving when there are clear problems: dirty transport, or big temperature differences.","स्पष्ट समस्या होने पर लोडिंग या प्राप्ति से इनकार करें: गंदा परिवहन या तापमान में बड़ा अंतर।","স্পষ্ট সমস্যা থাকলে লোড বা গ্রহণ প্রত্যাখ্যান করুন: অপরিষ্কার যান বা বড় তাপমাত্রার পার্থক্য।","Tolak pemuatan atau penerimaan jika ada masalah jelas: kendaraan kotor atau perbedaan suhu yang besar."],["li","استشر المشرف لاتخاذ إجراء فورياً: نقل الغذاء إلى منطقة آمنة إذا لزم الأمر وعزل المنتجات المشكوك فيها.","Consult your supervisor for an immediate action: move the food to a safe area if needed and isolate the doubtful products.","तुरंत कार्रवाई के लिए सुपरवाइज़र से सलाह लें: ज़रूरत हो तो भोजन को सुरक्षित क्षेत्र में ले जाएँ और संदिग्ध उत्पादों को अलग करें।","তাৎক্ষণিক ব্যবস্থার জন্য সুপারভাইজারের পরামর্শ নিন: প্রয়োজনে খাবার নিরাপদ স্থানে সরান এবং সন্দেহজনক পণ্য আলাদা করুন।","Konsultasikan dengan supervisor untuk tindakan segera: pindahkan makanan ke area aman jika perlu dan isolasi produk yang meragukan."]]},{"t":["الاستلام والتخزين","Receiving and storage","प्राप्ति और भंडारण","গ্রহণ ও সংরক্ষণ","Penerimaan dan penyimpanan"],"r":[["h3","التداول الآمن","Safe handling","सुरक्षित संभाल","নিরাপদ পরিচালনা","Penanganan yang aman"],["li","التأكد من درجات الحرارة عند الاستلام.","Check temperatures on receipt.","प्राप्ति के समय तापमान जाँचें।","গ্রহণের সময় তাপমাত্রা পরীক্ষা করুন।","Periksa suhu saat penerimaan."],["li","تخزين الغذاء الجاف في درجة حرارة لا تزيد عن 25°م.","Store dry food at a temperature not above 25°C.","सूखा भोजन 25°C से अधिक तापमान पर न रखें।","শুষ্ক খাবার ২৫°সে-এর বেশি তাপমাত্রায় রাখবেন না।","Simpan makanan kering pada suhu tidak lebih dari 25°C."],["li","تخزين الغذاء المبرد في درجة حرارة 4°م أو أقل.","Store chilled food at 4°C or below.","ठंडा भोजन 4°C या उससे कम पर रखें।","শীতল খাবার ৪°সে বা তার নিচে রাখুন।","Simpan makanan dingin pada suhu 4°C atau lebih rendah."],["li","تخزين الغذاء المجمد في درجة حرارة -18°م أو أقل.","Store frozen food at -18°C or below.","जमा भोजन -18°C या उससे कम पर रखें।","হিমায়িত খাবার -১৮°সে বা তার নিচে রাখুন।","Simpan makanan beku pada suhu -18°C atau lebih rendah."],["h3","ما هي مسؤولياتك في عملية التداول؟","What are your responsibilities in the handling process?","खाद्य संभाल की प्रक्रिया में आपकी ज़िम्मेदारियाँ क्या हैं?","পরিচালনা প্রক্রিয়ায় আপনার দায়িত্ব কী?","Apa tanggung jawab Anda dalam proses penanganan?"],["li","فحص الغذاء فور وصوله للتأكد من جودته وسلامته (عدم وجود علامات تلف أو فساد، وأنه طازج، نظيف، ويحتوي على تاريخ صلاحية ساري).","Inspect food as soon as it arrives to confirm quality and safety (no signs of damage or spoilage, it is fresh and clean, and it has a valid use-by date).","आने के तुरंत बाद भोजन जाँचें कि वह अच्छा और सुरक्षित है (खराबी या सड़न के संकेत न हों, वह ताज़ा और साफ़ हो, और उस पर मान्य तिथि हो)।","পৌঁছানোর সঙ্গে সঙ্গে খাবার পরীক্ষা করুন যে তা ভালো ও নিরাপদ (নষ্ট হওয়ার চিহ্ন নেই, তাজা ও পরিষ্কার, এবং মেয়াদ বৈধ)।","Periksa makanan segera setelah tiba untuk memastikan mutu dan keamanannya (tidak ada tanda rusak atau busuk, segar, bersih, dan masih dalam masa berlaku)."],["li","قياس درجات الحرارة عند الاستلام وتسجيلها.","Measure and record temperatures on receipt.","प्राप्ति पर तापमान मापें और दर्ज करें।","গ্রহণের সময় তাপমাত্রা মেপে লিখে রাখুন।","Ukur dan catat suhu saat penerimaan."],["li","نقل الغذاء بسرعة إلى مناطق التخزين المناسبة.","Move food quickly to the right storage areas.","भोजन को जल्दी उचित भंडारण क्षेत्र में ले जाएँ।","খাবার দ্রুত উপযুক্ত সংরক্ষণ স্থানে সরান।","Pindahkan makanan dengan cepat ke area penyimpanan yang sesuai."],["li","ترتيب الغذاء في مناطق التخزين وفقاً لمبدأ \"الوارد أولاً يصرف أولاً\" (FIFO)، يصرف أولاً. \"للمزيد عن ذلك، يرجى الرجوع إلى جزء المهارات العملية\".","Arrange food in storage areas by the FIFO principle (first in, first out). For more, see the practical skills section.","भंडारण क्षेत्रों में भोजन को FIFO सिद्धांत (पहले आया, पहले निकालें) से व्यवस्थित करें। अधिक जानकारी के लिए व्यावहारिक कौशल भाग देखें।","FIFO নীতি (প্রথম আসা, প্রথম বের হওয়া) অনুযায়ী সংরক্ষণ স্থানে খাবার সাজান। আরও জানতে ব্যবহারিক দক্ষতা অংশ দেখুন।","Atur makanan di area penyimpanan menurut prinsip FIFO (masuk pertama, keluar pertama). Untuk informasi lebih, lihat bagian keterampilan praktis."],["li","مراقبة درجات حرارة التخزين بانتظام وتسجيلها.","Monitor storage temperatures regularly and record them.","भंडारण तापमान नियमित रूप से जाँचें और दर्ज करें।","সংরক্ষণের তাপমাত্রা নিয়মিত পর্যবেক্ষণ ও রেকর্ড করুন।","Pantau suhu penyimpanan secara teratur dan catat."],["li","التحقق من تواريخ الصلاحية بشكل دوري.","Check expiry dates regularly.","समय-समय पर समाप्ति तिथियाँ जाँचें।","নিয়মিত মেয়াদের তারিখ যাচাই করুন।","Periksa tanggal kedaluwarsa secara berkala."],["h3","ما التصرف في حالة التداول غير الآمن؟","What to do when handling is unsafe?","असुरक्षित संभाल की स्थिति में क्या करें?","অনিরাপদ পরিচালনার ক্ষেত্রে কী করবেন?","Apa yang dilakukan saat penanganan tidak aman?"],["li","أبلغ المشرف فوراً في كل الحالات وقسم الصيانة لمشاكل المعدات (الثلاجات/المجمدات).","Report to the supervisor immediately in all cases, and to the maintenance department for equipment problems (fridges/freezers).","हर मामले में तुरंत सुपरवाइज़र को, और उपकरण समस्या (फ्रिज/फ़्रीज़र) के लिए रखरखाव विभाग को बताएँ।","সব ক্ষেত্রে তৎক্ষণাৎ সুপারভাইজারকে এবং যন্ত্রের সমস্যায় (ফ্রিজ/ফ্রিজার) রক্ষণাবেক্ষণ বিভাগকে জানান।","Segera laporkan kepada supervisor dalam semua kasus, dan ke bagian pemeliharaan untuk masalah peralatan (kulkas/pembeku)."],["li","استشر المشرف لاتخاذ إجراء فورياً: نقل الغذاء إلى منطقة آمنة إذا لزم الأمر وعزل المنتجات المشكوك فيها.","Consult your supervisor for an immediate action: move the food to a safe area if needed and isolate the doubtful products.","तुरंत कार्रवाई के लिए सुपरवाइज़र से सलाह लें: ज़रूरत हो तो भोजन को सुरक्षित क्षेत्र में ले जाएँ और संदिग्ध उत्पादों को अलग करें।","তাৎক্ষণিক ব্যবস্থার জন্য সুপারভাইজারের পরামর্শ নিন: প্রয়োজনে খাবার নিরাপদ স্থানে সরান এবং সন্দেহজনক পণ্য আলাদা করুন।","Konsultasikan dengan supervisor untuk tindakan segera: pindahkan makanan ke area aman jika perlu dan isolasi produk yang meragukan."]]},{"t":["التحضير والإعداد","Preparation and processing","तैयारी और प्रसंस्करण","প্রস্তুতি ও প্রক্রিয়াকরণ","Persiapan dan pengolahan"],"r":[["h3","التداول الآمن","Safe handling","सुरक्षित संभाल","নিরাপদ পরিচালনা","Penanganan yang aman"],["li","قياس الدرجة الداخلية (الجوهرية) أثناء الطهي والتبريد.","Measure the internal (core) temperature during cooking and cooling.","खाना पकाने और ठंडा करने के दौरान आंतरिक (कोर) तापमान मापें।","রান্না ও শীতলীকরণের সময় অভ্যন্তরীণ (কোর) তাপমাত্রা মাপুন।","Ukur suhu inti selama memasak dan mendinginkan."],["li","طهي الغذاء حتى تصل درجة حرارته الداخلية إلى 75°م (لمدة 30 ثانية على الأقل).","Cook food until its internal temperature reaches 75°C (for at least 30 seconds).","भोजन को तब तक पकाएँ जब तक उसका आंतरिक तापमान 75°C न पहुँचे (कम से कम 30 सेकंड के लिए)।","খাবারের অভ্যন্তরীণ তাপমাত্রা ৭৫°সে না পৌঁছানো পর্যন্ত রান্না করুন (অন্তত ৩০ সেকেন্ড)।","Masak makanan hingga suhu internalnya mencapai 75°C (minimal 30 detik)."],["li","تبريد الغذاء الساخن بسرعة (خلال ساعة ونصف).","Cool hot food quickly (within an hour and a half).","गर्म भोजन को जल्दी ठंडा करें (डेढ़ घंटे के भीतर)।","গরম খাবার দ্রুত ঠান্ডা করুন (দেড় ঘণ্টার মধ্যে)।","Dinginkan makanan panas dengan cepat (dalam waktu satu setengah jam)."],["li","إعادة تسخين الغذاء لدرجة حرارة أعلى من 82°م.","Reheat food to a temperature above 82°C.","भोजन को 82°C से ऊपर तक दोबारा गर्म करें।","খাবার ৮২°সে-এর বেশি তাপমাত্রায় পুনরায় গরম করুন।","Panaskan ulang makanan hingga suhu di atas 82°C."],["h3","ما هي مسؤولياتك في عملية التداول؟","What are your responsibilities in the handling process?","खाद्य संभाल की प्रक्रिया में आपकी ज़िम्मेदारियाँ क्या हैं?","পরিচালনা প্রক্রিয়ায় আপনার দায়িত্ব কী?","Apa tanggung jawab Anda dalam proses penanganan?"],["li","فحص المكونات قبل التحضير للتأكد من جودتها وسلامتها.","Check ingredients before preparation to confirm their quality and safety.","तैयारी से पहले सामग्री की गुणवत्ता और सुरक्षा जाँचें।","প্রস্তুতির আগে উপাদানের মান ও নিরাপত্তা পরীক্ষা করুন।","Periksa bahan sebelum persiapan untuk memastikan mutunya dan keamanannya."],["li","غسل الخضروات والفواكه جيداً قبل التقطيع والتحضير.","Wash vegetables and fruit well before cutting and preparing.","काटने और तैयार करने से पहले सब्ज़ियाँ और फल अच्छी तरह धोएँ।","কাটা ও প্রস্তুতির আগে সবজি ও ফল ভালোভাবে ধুন।","Cuci sayuran dan buah dengan baik sebelum dipotong dan disiapkan."],["li","فصل الأغذية النيئة عن الأغذية الجاهزة للأكل أثناء التحضير.","Keep raw food separate from ready-to-eat food during preparation.","तैयारी के दौरान कच्चे भोजन को खाने के लिए तैयार भोजन से अलग रखें।","প্রস্তুতির সময় কাঁচা খাবার রান্না-প্রস্তুত খাবার থেকে আলাদা রাখুন।","Pisahkan makanan mentah dari makanan siap saji selama persiapan."],["li","استخدام الأدوات والمعدات النظيفة والمطهرة.","Use clean, sanitised tools and equipment.","साफ़ और सैनिटाइज़ किए गए औज़ार और उपकरण इस्तेमाल करें।","পরিষ্কার ও জীবাণুমুক্ত সরঞ্জাম ব্যবহার করুন।","Gunakan alat dan peralatan yang bersih dan tersanitasi."],["li","قياس درجات الحرارة أثناء الطهي والتبريد وتسجيلها.","Measure temperatures during cooking and cooling and record them.","खाना पकाने और ठंडा करने के दौरान तापमान मापें और दर्ज करें।","রান্না ও শীতলীকরণের সময় তাপমাত্রা মেপে রেকর্ড করুন।","Ukur suhu selama memasak dan mendinginkan, lalu catat."],["li","اتباع وصفات وإجراءات التحضير بدقة.","Follow recipes and preparation procedures exactly.","रेसिपी और तैयारी की प्रक्रिया सटीक रूप से अपनाएँ।","রেসিপি ও প্রস্তুতির পদ্ধতি হুবহু অনুসরণ করুন।","Ikuti resep dan prosedur persiapan dengan tepat."],["li","تنظيف وتطهير مناطق العمل بعد الانتهاء من التحضير.","Clean and sanitise work areas after finishing preparation.","तैयारी खत्म होने के बाद कार्य क्षेत्र साफ़ और सैनिटाइज़ करें।","প্রস্তুতি শেষে কাজের জায়গা পরিষ্কার ও জীবাণুমুক্ত করুন।","Bersihkan dan sanitasi area kerja setelah persiapan selesai."],["h3","ما التصرف في حالة التداول غير الآمن؟","What to do when handling is unsafe?","असुरक्षित संभाल की स्थिति में क्या करें?","অনিরাপদ পরিচালনার ক্ষেত্রে কী করবেন?","Apa yang dilakukan saat penanganan tidak aman?"],["li","أبلغ المشرف فوراً في كل الحالات وقسم الصيانة لمشاكل المعدات.","Report to the supervisor immediately in all cases, and to maintenance for equipment problems.","हर मामले में तुरंत सुपरवाइज़र को, और उपकरण समस्या के लिए रखरखाव विभाग को बताएँ।","সব ক্ষেত্রে তৎক্ষণাৎ সুপারভাইজারকে এবং যন্ত্রের সমস্যায় রক্ষণাবেক্ষণ বিভাগকে জানান।","Segera laporkan kepada supervisor dalam semua kasus, dan ke pemeliharaan untuk masalah peralatan."],["li","استشر المشرف لاتخاذ إجراء فورياً: نقل الغذاء إلى منطقة آمنة إذا لزم الأمر وعزل المنتجات المشكوك فيها.","Consult your supervisor for an immediate action: move the food to a safe area if needed and isolate the doubtful products.","तुरंत कार्रवाई के लिए सुपरवाइज़र से सलाह लें: ज़रूरत हो तो भोजन को सुरक्षित क्षेत्र में ले जाएँ और संदिग्ध उत्पादों को अलग करें।","তাৎক্ষণিক ব্যবস্থার জন্য সুপারভাইজারের পরামর্শ নিন: প্রয়োজনে খাবার নিরাপদ স্থানে সরান এবং সন্দেহজনক পণ্য আলাদা করুন।","Konsultasikan dengan supervisor untuk tindakan segera: pindahkan makanan ke area aman jika perlu dan isolasi produk yang meragukan."]]},{"t":["الحفظ والتقديم والعرض","Holding, serving and display","रखना, परोसना और प्रदर्शन","ধরে রাখা, পরিবেশন ও প্রদর্শন","Penahanan, penyajian dan pajangan"],"r":[["h3","التداول الآمن","Safe handling","सुरक्षित संभाल","নিরাপদ পরিচালনা","Penanganan yang aman"],["li","حفظ وعرض الغذاء الساخن عند درجة حرارة 63°م أو أعلى.","Hold and display hot food at 63°C or above.","गर्म भोजन 63°C या उससे अधिक पर रखें और प्रदर्शित करें।","গরম খাবার ৬৩°সে বা তার বেশি তাপমাত্রায় ধরে রাখুন ও প্রদর্শন করুন।","Tahan dan pajang makanan panas pada suhu 63°C atau lebih."],["li","حفظ وعرض الغذاء البارد عند درجة حرارة 8°م أو أقل.","Hold and display cold food at 8°C or below.","ठंडा भोजन 8°C या उससे कम पर रखें और प्रदर्शित करें।","ঠান্ডা খাবার ৮°সে বা তার নিচে ধরে রাখুন ও প্রদর্শন করুন।","Tahan dan pajang makanan dingin pada suhu 8°C atau lebih rendah."],["li","مراقبة الوقت والحرارة أثناء العرض.","Monitor time and temperature during display.","प्रदर्शन के दौरान समय और तापमान की निगरानी करें।","প্রদর্শনের সময় সময় ও তাপমাত্রা পর্যবেক্ষণ করুন।","Pantau waktu dan suhu selama pajangan."],["h3","ما هي مسؤولياتك في عملية التداول؟","What are your responsibilities in the handling process?","खाद्य संभाल की प्रक्रिया में आपकी ज़िम्मेदारियाँ क्या हैं?","পরিচালনা প্রক্রিয়ায় আপনার দায়িত্ব কী?","Apa tanggung jawab Anda dalam proses penanganan?"],["li","فحص الغذاء قبل العرض للتأكد من جودته وسلامته.","Check food before display to confirm its quality and safety.","प्रदर्शन से पहले भोजन की गुणवत्ता और सुरक्षा जाँचें।","প্রদর্শনের আগে খাবারের মান ও নিরাপত্তা পরীক্ষা করুন।","Periksa makanan sebelum dipajang untuk memastikan mutu dan keamanannya."],["li","مراعاة الفصل بين الأغذية المختلفة أثناء العرض.","Keep different foods separated during display.","प्रदर्शन के दौरान विभिन्न खाद्य पदार्थों को अलग रखें।","প্রদর্শনের সময় বিভিন্ন খাবার আলাদা রাখুন।","Pisahkan berbagai jenis makanan selama pajangan."],["li","استخدام أدوات ومعدات العرض النظيفة والمطهرة.","Use clean, sanitised display tools and equipment.","साफ़ और सैनिटाइज़ किए गए प्रदर्शन औज़ार और उपकरण इस्तेमाल करें।","পরিষ্কার ও জীবাণুমুক্ত প্রদর্শন সরঞ্জাম ব্যবহার করুন।","Gunakan alat dan peralatan pajangan yang bersih dan tersanitasi."],["li","مراقبة نظافة منطقة العرض والحفاظ عليها.","Keep the display area clean and maintained.","प्रदर्शन क्षेत्र को साफ़ और व्यवस्थित रखें।","প্রদর্শন এলাকা পরিষ্কার ও সুরক্ষিত রাখুন।","Jaga area pajangan tetap bersih dan terawat."],["li","التأكد من وجود حواجز واقية مناسبة لحماية الغذاء.","Make sure suitable protective barriers are in place to protect the food.","भोजन की सुरक्षा के लिए उचित सुरक्षात्मक अवरोध मौजूद हों, यह सुनिश्चित करें।","খাবার রক্ষায় উপযুক্ত সুরক্ষা বেষ্টনী আছে কি না নিশ্চিত করুন।","Pastikan ada penghalang pelindung yang sesuai untuk melindungi makanan."],["li","قياس درجات الحرارة بانتظام أثناء العرض وتسجيلها.","Measure temperatures regularly during display and record them.","प्रदर्शन के दौरान नियमित रूप से तापमान मापें और दर्ज करें।","প্রদর্শনের সময় নিয়মিত তাপমাত্রা মেপে রেকর্ড করুন।","Ukur suhu secara teratur selama pajangan dan catat."],["li","تجديد المعروض بشكل دوري.","Refresh displayed food regularly.","प्रदर्शित भोजन को नियमित रूप से ताज़ा करें।","প্রদর্শিত খাবার নিয়মিত নতুন করুন।","Perbarui makanan yang dipajang secara berkala."],["h3","ما التصرف في حالة التداول غير الآمن؟","What to do when handling is unsafe?","असुरक्षित संभाल की स्थिति में क्या करें?","অনিরাপদ পরিচালনার ক্ষেত্রে কী করবেন?","Apa yang dilakukan saat penanganan tidak aman?"],["li","أبلغ المشرف فوراً في حالة اكتشاف أي مشكلة في درجات الحرارة، وقسم الصيانة في حالة عطل معدات العرض.","Report to the supervisor immediately if any temperature problem is found, and to maintenance if display equipment breaks down.","तापमान में कोई समस्या मिले तो तुरंत सुपरवाइज़र को, और प्रदर्शन उपकरण खराब हो तो रखरखाव विभाग को बताएँ।","তাপমাত্রায় কোনো সমস্যা পেলে তৎক্ষণাৎ সুপারভাইজারকে, এবং প্রদর্শন যন্ত্র খারাপ হলে রক্ষণাবেক্ষণ বিভাগকে জানান।","Segera laporkan kepada supervisor jika ditemukan masalah suhu, dan ke pemeliharaan jika peralatan pajangan rusak."],["li","استشر المشرف لاتخاذ إجراء فورياً: إزالة الغذاء من العرض إذا تجاوز الوقت أو درجة الحرارة الآمنة.","Consult your supervisor for an immediate action: remove the food from display if it exceeds the safe time or temperature.","तुरंत कार्रवाई के लिए सुपरवाइज़र से सलाह लें: यदि समय या सुरक्षित तापमान की सीमा पार हो जाए तो भोजन प्रदर्शन से हटा दें।","তাৎক্ষণিক ব্যবস্থার জন্য সুপারভাইজারের পরামর্শ নিন: নিরাপদ সময় বা তাপমাত্রা পার হলে খাবার প্রদর্শন থেকে সরান।","Konsultasikan dengan supervisor untuk tindakan segera: angkat makanan dari pajangan jika melewati waktu atau suhu aman."]]},{"t":["المهارات العملية في منشآت الغذاء","Practical skills in food establishments","खाद्य प्रतिष्ठानों में व्यावहारिक कौशल","খাদ্য প্রতিষ্ঠানে ব্যবহারিক দক্ষতা","Keterampilan praktis di usaha pangan"],"r":[["p","هذا الجزء سيتم دراسته وتطبيقه بطريقة عملية لضمان إتقان هذه المهارات.","This part will be studied and applied in a practical way to make sure these skills are mastered.","यह भाग व्यावहारिक रूप से पढ़ा और लागू किया जाएगा ताकि ये कौशल पूरी तरह आ जाएँ।","এই অংশটি ব্যবহারিকভাবে পড়া ও প্রয়োগ করা হবে, যাতে এই দক্ষতাগুলো আয়ত্ত হয়।","Bagian ini akan dipelajari dan diterapkan secara praktis agar keterampilan ini dikuasai."],["li","غسل اليدين.","Hand washing.","हाथ धोना।","হাত ধোয়া।","Mencuci tangan."],["li","ارتداء وخلع القفازات.","Putting on and taking off gloves.","दस्ताने पहनना और उतारना।","গ্লাভস পরা ও খোলা।","Memakai dan melepas sarung tangan."],["li","قياس درجة حرارة الغذاء.","Measuring food temperature.","भोजन का तापमान मापना।","খাবারের তাপমাত্রা মাপা।","Mengukur suhu makanan."],["li","استلام الأغذية.","Receiving food.","भोजन प्राप्त करना।","খাবার গ্রহণ।","Menerima makanan."],["li","الحفاظ على دوران المخزون.","Stock rotation.","स्टॉक का घुमाव (रोटेशन)।","মজুদ আবর্তন।","Rotasi stok."],["li","مهارة تخزين الأغذية الجافة.","Dry food storage.","सूखे भोजन का भंडारण।","শুষ্ক খাবার সংরক্ষণ।","Penyimpanan makanan kering."],["li","مهارة تخزين الأغذية المبردة / المجمدة.","Chilled / frozen food storage.","ठंडे / जमे भोजन का भंडारण।","শীতল / হিমায়িত খাবার সংরক্ষণ।","Penyimpanan makanan dingin / beku."],["li","مهارة تفكيك/تسييح الغذاء المجمد.","Thawing frozen food.","जमे भोजन को पिघलाना।","হিমায়িত খাবার গলানো।","Mencairkan makanan beku."],["li","تنظيف وتطهير الأسطح بالطرق المختلفة.","Cleaning and sanitising surfaces by different methods.","अलग-अलग तरीकों से सतहों की सफ़ाई और सैनिटाइज़ेशन।","বিভিন্ন পদ্ধতিতে তল পরিষ্কার ও জীবাণুমুক্তকরণ।","Membersihkan dan menyanitasi permukaan dengan berbagai metode."],["li","تنظيف وتطهير الأواني بالطرق المختلفة.","Cleaning and sanitising utensils by different methods.","अलग-अलग तरीकों से बर्तनों की सफ़ाई और सैनिटाइज़ेशन।","বিভিন্ন পদ্ধতিতে পাত্র পরিষ্কার ও জীবাণুমুক্তকরণ।","Membersihkan dan menyanitasi peralatan makan dengan berbagai metode."],["li","اختبر معلوماتك.","Test your knowledge.","अपनी जानकारी जाँचें।","আপনার জ্ঞান যাচাই করুন।","Uji pengetahuan Anda."]]},{"t":["مهارة غسل اليدين","Hand washing skill","हाथ धोने का कौशल","হাত ধোয়ার দক্ষতা","Keterampilan mencuci tangan"],"r":[["h3","ما الغرض من اتقان المهارة؟","What is the purpose of mastering this skill?","इस कौशल में निपुणता का उद्देश्य क्या है?","এই দক্ষতা আয়ত্ত করার উদ্দেশ্য কী?","Apa tujuan menguasai keterampilan ini?"],["p","ضمان غسل اليدين بشكل صحيح لمنع تلوث الغذاء وحمايته من الجراثيم المحتملة (غسل اليدين الصحيح من أهم أجزاء النظافة الشخصية).","To make sure hands are washed correctly to prevent food contamination and protect food from possible germs (correct hand washing is one of the most important parts of personal hygiene).","भोजन को संभावित कीटाणुओं से बचाने और संदूषण रोकने के लिए हाथ सही तरीके से धोना सुनिश्चित करना (सही हाथ धोना व्यक्तिगत स्वच्छता का सबसे ज़रूरी हिस्सा है)।","খাবারকে সম্ভাব্য জীবাণু থেকে রক্ষা ও দূষণ রোধে সঠিকভাবে হাত ধোয়া নিশ্চিত করা (সঠিক হাত ধোয়া ব্যক্তিগত পরিচ্ছন্নতার অন্যতম গুরুত্বপূর্ণ অংশ)।","Memastikan tangan dicuci dengan benar untuk mencegah kontaminasi makanan dan melindungi makanan dari kuman (mencuci tangan dengan benar adalah bagian terpenting kebersihan pribadi)."],["h3","ما هي طريقة تنفيذ المهارة؟","How is the skill carried out?","यह कौशल कैसे किया जाता है?","এই দক্ষতা কীভাবে প্রয়োগ করা হয়?","Bagaimana keterampilan ini dilakukan?"],["p","تنفيذ طريقة غسل الأيدي طبقاً للإجراء السليم المتبع في جزء النظافة الشخصية.","Hand washing is done following the correct procedure described in the personal hygiene section.","हाथ धोने की विधि व्यक्तिगत स्वच्छता भाग में बताए सही तरीके के अनुसार होती है।","হাত ধোয়ার পদ্ধতি ব্যক্তিগত পরিচ্ছন্নতা অংশে বর্ণিত সঠিক নিয়ম অনুসারে হয়।","Mencuci tangan dilakukan sesuai prosedur yang benar pada bagian kebersihan pribadi."],["h3","ما هي معايير تنفيذ المهارة؟","What are the standards for doing the skill?","इस कौशल के मानक क्या हैं?","এই দক্ষতার মানদণ্ড কী?","Apa standar pelaksanaan keterampilan ini?"],["li","إزالة المجوهرات وساعة اليد.","Remove jewellery and watches.","आभूषण और घड़ी उतारें।","গয়না ও হাতঘড়ি খুলুন।","Lepaskan perhiasan dan jam tangan."],["li","استخدام حوض غسيل الأيدي.","Use the hand-washing sink.","हाथ धोने के सिंक का उपयोग करें।","হাত ধোয়ার সিংক ব্যবহার করুন।","Gunakan wastafel cuci tangan."],["li","استخدام الماء الدافئ والصابون السائل.","Use warm water and liquid soap.","गुनगुने पानी और तरल साबुन का उपयोग करें।","গরম পানি ও তরল সাবান ব্যবহার করুন।","Gunakan air hangat dan sabun cair."],["li","وضع الصابون في اليدين وفرك الأيدي معاً بقوة.","Put soap on the hands and rub them together firmly.","हाथों पर साबुन लगाकर उन्हें ज़ोर से रगड़ें।","হাতে সাবান লাগিয়ে জোরে ঘষুন।","Oleskan sabun di tangan dan gosok kuat-kuat."],["li","غسل بين الأصابع والمعصمين.","Wash between the fingers and the wrists.","उंगलियों के बीच और कलाइयों को धोएँ।","আঙুলের ফাঁকে ও কব্জি ধুন।","Cuci sela jari dan pergelangan tangan."],["li","شطف اليدين جيداً بالماء النظيف.","Rinse the hands well with clean water.","साफ़ पानी से हाथ अच्छी तरह धोएँ।","পরিষ্কার পানিতে হাত ভালোভাবে ধুয়ে ফেলুন।","Bilas tangan dengan baik menggunakan air bersih."],["li","تنشيف اليدين بمناديل ورقية نظيفة.","Dry the hands with clean paper towels.","साफ़ कागज़ी तौलिये से हाथ सुखाएँ।","পরিষ্কার কাগজের তোয়ালে দিয়ে হাত মুছুন।","Keringkan tangan dengan tisu kertas bersih."],["li","إيقاف تشغيل الصنبور باستخدام مناديل ورقية نظيفة والتخلص منها في حاوية النفايات مرة واحدة.","Turn off the tap using a clean paper towel and throw it away in the waste bin once.","साफ़ कागज़ी तौलिये से नल बंद करें और उसे एक बार इस्तेमाल के बाद कूड़ेदान में डालें।","পরিষ্কার কাগজের তোয়ালে দিয়ে কল বন্ধ করে একবার ব্যবহারের পর ডাস্টবিনে ফেলুন।","Matikan keran dengan tisu bersih dan buang ke tempat sampah sekali pakai."],["li","تجفيف اليدين باستخدام مناديل ورقية نظيفة.","Dry the hands using clean paper towels.","साफ़ कागज़ी तौलिये से हाथ सुखाएँ।","পরিষ্কার কাগজের তোয়ালে দিয়ে হাত শুকান।","Keringkan tangan dengan tisu kertas bersih."],["li","عدم لمس الصنبور أو حاوية النفايات باليدين النظيفتين مباشرة.","Do not touch the tap or waste bin with clean hands directly.","साफ़ हाथों से सीधे नल या कूड़ेदान को न छुएँ।","পরিষ্কার হাতে সরাসরি কল বা ডাস্টবিন ছোঁবেন না।","Jangan menyentuh keran atau tempat sampah dengan tangan bersih secara langsung."]]},{"t":["مهارة ارتداء وخلع القفازات","Putting on and taking off gloves","दस्ताने पहनने और उतारने का कौशल","গ্লাভস পরা ও খোলার দক্ষতা","Keterampilan memakai dan melepas sarung tangan"],"r":[["h3","ما الغرض من اتقان المهارة؟","What is the purpose of mastering this skill?","इस कौशल में निपुणता का उद्देश्य क्या है?","এই দক্ষতা আয়ত্ত করার উদ্দেশ্য কী?","Apa tujuan menguasai keterampilan ini?"],["p","ضمان استخدام القفازات بشكل صحيح لمنع تلوث الغذاء وحماية متداوليه من التلوث المحتمل.","To make sure gloves are used correctly to prevent food contamination and protect those handling food from possible contamination.","दस्तानों का सही उपयोग सुनिश्चित करना ताकि भोजन दूषित न हो और उसे संभालने वाले लोग संभावित संदूषण से बचें।","গ্লাভসের সঠিক ব্যবহার নিশ্চিত করা যাতে খাবার দূষিত না হয় এবং খাবার পরিচালনাকারীরা সম্ভাব্য দূষণ থেকে সুরক্ষিত থাকেন।","Memastikan sarung tangan digunakan dengan benar untuk mencegah kontaminasi makanan dan melindungi penangan makanan."],["h3","ما هي طريقة تنفيذ المهارة؟","How is the skill carried out?","यह कौशल कैसे किया जाता है?","এই দক্ষতা কীভাবে প্রয়োগ করা হয়?","Bagaimana keterampilan ini dilakukan?"],["h3","ارتداء القفازات","Putting on gloves","दस्ताने पहनना","গ্লাভস পরা","Memakai sarung tangan"],["li","غسل اليدين وتجفيفها جيداً.","Wash and dry hands well.","हाथ अच्छी तरह धोकर सुखाएँ।","হাত ভালোভাবে ধুয়ে শুকান।","Cuci dan keringkan tangan dengan baik."],["li","إخراج قفاز من العلبة بلمس الحافة فقط.","Take a glove out of the box by touching only the edge.","डिब्बे से दस्ताना केवल किनारे को छूकर निकालें।","বাক্স থেকে শুধু কিনারা ছুঁয়ে গ্লাভস বের করুন।","Keluarkan sarung tangan dari kotak dengan menyentuh tepinya saja."],["li","ارتداء القفاز بدون لمس الأسطح الخارجية للقفاز.","Put on the glove without touching the outer surfaces of the glove.","दस्ताने की बाहरी सतह को छुए बिना पहनें।","গ্লাভসের বাইরের পৃষ্ঠ না ছুঁয়ে পরুন।","Pakai sarung tangan tanpa menyentuh permukaan luarnya."],["li","تكرار العملية مع اليد الأخرى.","Repeat the process with the other hand.","दूसरे हाथ के साथ प्रक्रिया दोहराएँ।","অন্য হাতেও একই প্রক্রিয়া করুন।","Ulangi proses dengan tangan lainnya."],["h3","خلع القفازات","Taking off gloves","दस्ताने उतारना","গ্লাভস খোলা","Melepas sarung tangan"],["li","مسك حافة القفاز الأول من المعصم. سحب القفاز للخارج، قلبه على نفسه.","Grip the edge of the first glove at the wrist. Pull the glove off outward, turning it inside out.","पहले दस्ताने को कलाई के पास से पकड़ें। उसे बाहर की ओर खींचें, अंदर से बाहर पलटते हुए।","প্রথম গ্লাভসের কব্জির কাছের কিনারা ধরুন। বাইরের দিকে টেনে খুলুন, ভেতরটা বাইরে আসবে।","Pegang tepi sarung tangan pertama di pergelangan. Tarik ke luar sambil membaliknya."],["li","إدخال إصبع اليد المكشوفة تحت حافة القفاز الثاني.","Slide the bare finger of the other hand under the edge of the second glove.","दूसरे दस्ताने के किनारे के नीचे खाली उंगली डालें।","দ্বিতীয় গ্লাভসের কিনারার নিচে খালি আঙুল ঢুকান।","Selipkan jari tangan yang tidak tertutup di bawah tepi sarung tangan kedua."],["li","سحب القفاز للخارج، محتوياً على القفاز الأول.","Pull the glove outward, containing the first glove inside it.","पहले दस्ताने को अंदर समेटते हुए दूसरे दस्ताने को बाहर खींचें।","প্রথমটি ভেতরে রেখে দ্বিতীয়টি বাইরে টানুন।","Tarik sarung tangan ke luar sambil membungkus yang pertama di dalamnya."],["li","التخلص من القفازات في حاوية النفايات المناسبة.","Dispose of the gloves in the proper waste bin.","दस्तानों को उचित कूड़ेदान में फेंकें।","গ্লাভস উপযুক্ত ডাস্টবিনে ফেলুন।","Buang sarung tangan ke tempat sampah yang tepat."],["h3","ما هي معايير تنفيذ المهارة؟","What are the standards for doing the skill?","इस कौशल के मानक क्या हैं?","এই দক্ষতার মানদণ্ড কী?","Apa standar pelaksanaan keterampilan ini?"],["li","غسل اليدين قبل ارتداء القفازات.","Wash hands before putting on gloves.","दस्ताने पहनने से पहले हाथ धोएँ।","গ্লাভস পরার আগে হাত ধুন।","Cuci tangan sebelum memakai sarung tangan."],["li","عدم لمس الجزء الخارجي من القفاز أثناء الارتداء.","Do not touch the outer part of the glove while putting it on.","पहनते समय दस्ताने के बाहरी हिस्से को न छुएँ।","পরার সময় গ্লাভসের বাইরের অংশ ছোঁবেন না।","Jangan menyentuh bagian luar sarung tangan saat memakainya."],["li","خلع القفاز بطريقة تمنع تلوث اليدين.","Take the glove off in a way that stops the hands getting dirty.","ऐसे उतारें कि हाथ गंदे न हों।","হাত দূষিত না হয় এমনভাবে গ্লাভস খুলুন।","Lepas sarung tangan dengan cara yang mencegah tangan terkontaminasi."],["li","التخلص من القفازات المستعملة بشكل صحيح.","Dispose of used gloves correctly.","इस्तेमाल किए दस्ताने सही तरीके से फेंकें।","ব্যবহৃত গ্লাভস সঠিকভাবে ফেলুন।","Buang sarung tangan bekas dengan benar."],["li","تغيير القفازات بانتظام وعند تلوثها أو تمزقها.","Change gloves regularly, and whenever they get dirty or torn.","दस्ताने नियमित रूप से और गंदे या फटने पर बदलें।","নিয়মিত এবং ময়লা বা ছিঁড়ে গেলে গ্লাভস বদলান।","Ganti sarung tangan secara teratur dan setiap kali kotor atau sobek."],["li","عدم إعادة استخدام القفازات ذات الاستخدام الواحد.","Do not reuse single-use gloves.","एक बार उपयोग वाले दस्ताने दोबारा इस्तेमाल न करें।","একবার ব্যবহারের গ্লাভস আবার ব্যবহার করবেন না।","Jangan menggunakan ulang sarung tangan sekali pakai."]]},{"t":["مهارة قياس درجة حرارة الغذاء","Measuring food temperature","भोजन का तापमान मापने का कौशल","খাবারের তাপমাত্রা মাপার দক্ষতা","Keterampilan mengukur suhu makanan"],"r":[["h3","ما الغرض من اتقان المهارة؟","What is the purpose of mastering this skill?","इस कौशल में निपुणता का उद्देश्य क्या है?","এই দক্ষতা আয়ত্ত করার উদ্দেশ্য কী?","Apa tujuan menguasai keterampilan ini?"],["p","ضمان التحقق من درجات حرارة الغذاء، للتحكم في البكتيريا الضارة لتقديم غذاء آمن.","To check food temperatures and control harmful bacteria, so that food is served safely.","भोजन के तापमान की जाँच करना और हानिकारक बैक्टीरिया पर नियंत्रण रखना, ताकि सुरक्षित भोजन परोसा जा सके।","খাবারের তাপমাত্রা যাচাই করা এবং ক্ষতিকর ব্যাকটেরিয়া নিয়ন্ত্রণ করা, যাতে নিরাপদ খাবার পরিবেশন হয়।","Memeriksa suhu makanan dan mengendalikan bakteri berbahaya agar makanan disajikan dengan aman."],["h3","ما هي طريقة تنفيذ المهارة؟","How is the skill carried out?","यह कौशल कैसे किया जाता है?","এই দক্ষতা কীভাবে প্রয়োগ করা হয়?","Bagaimana keterampilan ini dilakukan?"],["h3","تحضير مقياس الحرارة","Preparing the thermometer","थर्मामीटर तैयार करना","থার্মোমিটার প্রস্তুত করা","Menyiapkan termometer"],["li","فحص المقياس للتأكد من عدم وجود تلف.","Check the thermometer for damage.","थर्मामीटर में खराबी न होने की जाँच करें।","থার্মোমিটারে ক্ষতি নেই কি না দেখুন।","Periksa termometer untuk memastikan tidak rusak."],["li","تنظيف وتطهير طرف مقياس الحرارة قبل الاستخدام.","Clean and sanitise the tip of the thermometer before use.","उपयोग से पहले थर्मामीटर की नोक को साफ़ और सैनिटाइज़ करें।","ব্যবহারের আগে থার্মোমিটারের প্রান্ত পরিষ্কার ও জীবাণুমুক্ত করুন।","Bersihkan dan sanitasi ujung termometer sebelum digunakan."],["h3","قياس درجة الحرارة","Measuring the temperature","तापमान मापना","তাপমাত্রা মাপা","Mengukur suhu"],["li","غسل وتجفيف اليدين قبل استخدام المقياس.","Wash and dry your hands before using the thermometer.","थर्मामीटर इस्तेमाल करने से पहले हाथ धोकर सुखाएँ।","থার্মোমিটার ব্যবহারের আগে হাত ধুয়ে শুকান।","Cuci dan keringkan tangan sebelum menggunakan termometer."],["li","إدخال طرف المقياس في أسمك جزء من الغذاء (2.5 سم).","Insert the tip of the thermometer into the thickest part of the food (2.5 cm).","थर्मामीटर की नोक भोजन के सबसे मोटे हिस्से में 2.5 सेमी तक डालें।","থার্মোমিটারের প্রান্ত খাবারের সবচেয়ে মোটা অংশে ২.৫ সেমি ঢুকান।","Masukkan ujung termometer ke bagian makanan yang paling tebal (2,5 cm)."],["li","تجنب لمس جوانب الوعاء أو قاعه أثناء أثناء القياس.","Avoid touching the sides or bottom of the container during measuring.","माप के दौरान बर्तन की किनारी या तले को न छुएँ।","মাপার সময় পাত্রের পাশ বা তলা ছোঁবেন না।","Hindari menyentuh sisi atau dasar wadah saat mengukur."],["li","الانتظار لمدة 15-20 ثانية أو حتى تستقر القراءة.","Wait 15–20 seconds or until the reading settles.","15–20 सेकंड प्रतीक्षा करें या जब तक पाठ स्थिर न हो जाए।","১৫–২০ সেকেন্ড অপেক্ষা করুন বা রিডিং স্থির না হওয়া পর্যন্ত।","Tunggu 15–20 detik atau sampai pembacaan stabil."],["h3","قراءة وتسجيل درجة الحرارة","Reading and recording the temperature","तापमान पढ़ना और दर्ज करना","তাপমাত্রা পড়া ও লিপিবদ্ধ করা","Membaca dan mencatat suhu"],["li","قراءة وتسجيل درجة الحرارة بدقة في سجل درجات الحرارة.","Read and record the temperature accurately in the temperature log.","तापमान लॉग में तापमान सटीक रूप से पढ़ें और दर्ज करें।","তাপমাত্রা লগে নির্ভুলভাবে তাপমাত্রা পড়ুন ও লিখুন।","Baca dan catat suhu dengan akurat di log suhu."],["h3","تنظيف مقياس الحرارة","Cleaning the thermometer","थर्मामीटर की सफ़ाई","থার্মোমিটার পরিষ্কার করা","Membersihkan termometer"],["li","تنظيف وتطهير المقياس بعد كل استخدام.","Clean and sanitise the thermometer after every use.","हर उपयोग के बाद थर्मामीटर साफ़ और सैनिटाइज़ करें।","প্রতিবার ব্যবহারের পর থার্মোমিটার পরিষ্কার ও জীবাণুমুক্ত করুন।","Bersihkan dan sanitasi termometer setelah setiap penggunaan."],["h3","ما هي معايير تنفيذ المهارة؟","What are the standards for doing the skill?","इस कौशल के मानक क्या हैं?","এই দক্ষতার মানদণ্ড কী?","Apa standar pelaksanaan keterampilan ini?"],["li","استخدام مقياس حرارة معاير.","Use a calibrated thermometer.","अंशांकित (कैलिब्रेटेड) थर्मामीटर का उपयोग करें।","ক্যালিব্রেটেড থার্মোমিটার ব্যবহার করুন।","Gunakan termometer yang sudah dikalibrasi."],["li","قياس درجة الحرارة في المكان الصحيح من الغذاء.","Measure the temperature at the correct point in the food.","भोजन के सही स्थान पर तापमान मापें।","খাবারের সঠিক স্থানে তাপমাত্রা মাপুন।","Ukur suhu di titik yang tepat pada makanan."],["li","الانتظار للوقت الكافي للحصول على قراءة دقيقة.","Wait long enough to get an accurate reading.","सटीक पाठ प्राप्त करने के लिए पर्याप्त समय प्रतीक्षा करें।","সঠিক রিডিং পেতে যথেষ্ট সময় অপেক্ষা করুন।","Tunggu cukup lama untuk mendapat pembacaan yang akurat."],["li","تسجيل القراءات بدقة وبشكل منتظم.","Record readings accurately and regularly.","रीडिंग सटीक और नियमित रूप से दर्ज करें।","রিডিং নির্ভুল ও নিয়মিতভাবে লিখুন।","Catat pembacaan secara akurat dan teratur."],["li","تنظيف وتطهير المقياس قبل وبعد كل استخدام.","Clean and sanitise the thermometer before and after each use.","हर उपयोग से पहले और बाद में थर्मामीटर साफ़ और सैनिटाइज़ करें।","প্রতিটি ব্যবহারের আগে ও পরে থার্মোমিটার পরিষ্কার ও জীবাণুমুক্ত করুন।","Bersihkan dan sanitasi termometer sebelum dan sesudah setiap penggunaan."],["li","معرفة درجات الحرارة الآمنة لمختلف أنواع الغذاء.","Know the safe temperatures for different types of food.","विभिन्न प्रकार के भोजन के सुरक्षित तापमान जानें।","বিভিন্ন ধরনের খাবারের নিরাপদ তাপমাত্রা জানুন।","Ketahui suhu aman untuk berbagai jenis makanan."]]},{"t":["مهارة استلام الأغذية","Receiving food skill","भोजन प्राप्ति का कौशल","খাবার গ্রহণের দক্ষতা","Keterampilan menerima makanan"],"r":[["h3","ما الغرض من اتقان المهارة؟","What is the purpose of mastering this skill?","इस कौशल में निपुणता का उद्देश्य क्या है?","এই দক্ষতা আয়ত্ত করার উদ্দেশ্য কী?","Apa tujuan menguasai keterampilan ini?"],["p","ضمان استلام أغذية آمنة وعالية الجودة، ومنع دخول الأغذية الملوثة أو غير الصالحة إلى المنشأة.","To make sure safe, high-quality food is received, and to stop contaminated or unfit food entering the establishment.","सुरक्षित और उच्च गुणवत्ता का भोजन प्राप्त हो, और दूषित या अनुपयुक्त भोजन प्रतिष्ठान में न आए।","নিরাপদ ও উচ্চমানের খাবার গ্রহণ নিশ্চিত করা, এবং দূষিত বা অনুপযুক্ত খাবার প্রতিষ্ঠানে ঢোকা রোধ করা।","Memastikan makanan yang diterima aman dan berkualitas tinggi, serta mencegah makanan tercemar atau tidak layak masuk ke usaha."],["h3","ما هي طريقة تنفيذ المهارة؟","How is the skill carried out?","यह कौशल कैसे किया जाता है?","এই দক্ষতা কীভাবে প্রয়োগ করা হয়?","Bagaimana keterampilan ini dilakukan?"],["h3","الفحص البصري","Visual check","दृश्य जाँच","দৃশ্যমান পরীক্ষা","Pemeriksaan visual"],["p","فحص الأغذية على طاولة نظيفة، تفقد سلامة العبوات والأغلفة، البحث عن علامات الحشرات أو القوارض، التحقق من عدم وجود أجسام غريبة (أوساخ، زجاج).","Check food on a clean table: look at the safety of packaging and wrappers, search for signs of insects or rodents, and check there are no foreign objects (dirt, glass).","साफ़ मेज़ पर भोजन जाँचें: पैकेजिंग और रैपर की सुरक्षा देखें, कीड़ों या चूहों के निशान खोजें, और यह जाँचें कि कोई बाहरी चीज़ (मिट्टी, काँच) तो नहीं।","পরিষ্কার টেবিলে খাবার পরীক্ষা করুন: প্যাকেট ও মোড়ক নিরাপদ কি না দেখুন, পোকামাকড় বা ইঁদুরের চিহ্ন খুঁজুন, এবং বাইরের বস্তু (ময়লা, কাঁচ) নেই কি না যাচাই করুন।","Periksa makanan di meja bersih: lihat keamanan kemasan dan bungkusnya, cari tanda serangga atau hewan pengerat, dan pastikan tidak ada benda asing (kotoran, kaca)."],["h3","التحقق من تواريخ الصلاحية","Checking expiry dates","समाप्ति तिथि जाँचना","মেয়াদের তারিখ যাচাই","Memeriksa tanggal kedaluwarsa"],["p","التحقق من تواريخ الإنتاج والانتهاء. رفض المنتجات منتهية الصلاحية.","Check production and expiry dates. Reject expired products.","उत्पादन और समाप्ति तिथियाँ जाँचें। समाप्त हो चुके उत्पाद अस्वीकार करें।","উৎপাদন ও মেয়াদের তারিখ যাচাই করুন। মেয়াদোত্তীর্ণ পণ্য ফিরিয়ে দিন।","Periksa tanggal produksi dan kedaluwarsa. Tolak produk yang sudah kedaluwarsa."],["h3","قياس درجات الحرارة","Measuring temperatures","तापमान मापना","তাপমাত্রা মাপা","Mengukur suhu"],["p","فحص درجة حرارة الأغذية المبردة والمجمدة، التأكد من استلامها ضمن نطاق الحرارة الآمن.","Check the temperature of chilled and frozen food, and make sure it is received within the safe temperature range.","ठंडे और जमे भोजन का तापमान ज
