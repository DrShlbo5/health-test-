<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار الوعي الصحي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Noto+Sans+Telugu:wght@400;700;900&display=swap">
<link rel="stylesheet" href="css/style.css?v=20261107d">

<div class="app">
  <div class="header">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg></span>
      <div>
        <h1 id="hdr-title">اختبار الوعي الصحي للموظفين</h1>
        <p id="hdr-sub">٦٠ سؤال من بنك أسئلة متنوع</p>
      </div>
    </div>
  </div>

  <div class="lang-bar">
    <span id="lbl-lang">اللغة:</span>
    <button class="lang-btn active" data-lang="ar">عربي</button>
    <button class="lang-btn" data-lang="en">English</button>
    <button class="lang-btn" data-lang="hi">हिंदी</button>
    <button class="lang-btn" data-lang="bn">বাংলা</button>
    <button class="lang-btn" data-lang="id">Indonesia</button>
    <button class="lang-btn" data-lang="ne">नेपाली</button>
    <button class="lang-btn" data-lang="te">తెలుగు</button>
  </div>

  <!-- QUIZ -->
  <div id="screen-quiz" class="screen">
    <div class="quiz-header">
      <div class="quiz-meta" id="emp-display"></div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="q-counter" id="q-counter"></div>
    </div>
    <div class="card">
      <div class="q-category" id="q-cat"></div>
      <div class="q-text" id="q-text"></div>
      <div class="options" id="options"></div>
    </div>
    <div class="next-row" style="gap:10px;flex-wrap:wrap">
      <button class="btn btn-secondary" id="btn-prev" style="display:none"></button>
      <button class="btn btn-primary" id="btn-next" style="display:none"></button>
    </div>
  </div>

  <!-- RESULT -->
  <div id="screen-result" class="screen">
    <div class="card result-card">
      <div class="score-circle" id="score-circle">
        <div id="score-pct">0%</div>
        <span id="score-frac">0/100</span>
      </div>
      <div class="result-name" id="res-name"></div>
      <div class="verdict" id="res-verdict"></div>
      <div class="result-actions">
        <button class="btn btn-primary btn-small" id="btn-new-emp"></button>
        <button class="btn btn-secondary btn-small" id="btn-back-start"></button>
      </div>
    </div>
  </div>

  <!-- RECORDS -->
  <div id="screen-records" class="screen">
    <div class="card records-header">
      <h2 id="rec-title"></h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-secondary btn-small" id="btn-import"></button>
        <button class="btn btn-primary btn-small" id="btn-upload"></button>
        <button class="btn btn-danger btn-small" id="btn-clear"></button>
        <button class="btn btn-secondary btn-small" id="btn-review"></button>
        <button class="btn btn-secondary btn-small" id="btn-rec-back"></button>
      </div>
    </div>
    <div class="records-table-wrap">
      <table class="records-table">
        <thead>
          <tr>
            <th id="th-num">#</th><th id="th-name"></th><th id="th-score"></th>
            <th id="th-pct"></th><th id="th-verdict"></th><th id="th-date"></th>
          </tr>
        </thead>
        <tbody id="records-body"></tbody>
      </table>
    </div>
    <div id="import-box"></div>
  </div>

  <!-- STUDY (public study notes from the book, all languages) -->
  <div id="screen-study" class="screen">
    <div class="card records-header">
      <h2 id="study-title"></h2>
      <button class="btn btn-secondary btn-small" id="btn-study-back"></button>
    </div>
    <div class="card"><div class="lang-chips" id="study-chips"></div></div>
    <div id="study-body" style="display:flex;flex-direction:column;gap:14px"></div>
  </div>

  <!-- REVIEW (all questions in all languages; reachable only after the password) -->
  <div id="screen-review" class="screen">
    <div class="card records-header">
      <h2 id="rev-title"></h2>
      <button class="btn btn-secondary btn-small" id="btn-rev-back"></button>
    </div>
    <div id="review-body" style="display:flex;flex-direction:column;gap:14px"></div>
  </div>
</div>

<script src="js/translations.js?v=20261107j"></script>
<script src="js/questions.js?v=20261107j"></script>
<script src="js/google-sheets.js?v=20261107j"></script>
<script src="js/quiz.js?v=20261107j"></script>
<script src="js/results.js?v=20261107j"></script>
<script src="js/records.js?v=20261107j"></script>
<script src="js/study.js?v=20261107j"></script>
<script src="js/app.js?v=20261107j"></script>
</body>
</html>
