<title>اختبار الوعي الصحي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap">
<style>
  /* Layout: single column, RTL, cards. Colors are tokens. */
  :root {
    --bg: #f7f8fa; --surface: #ffffff; --fg: #1a1d23; --fg-soft: #5a6072;
    --accent: #1b6ca8; --accent-light: #e8f2fb;
    --success: #1a8a4a; --success-bg: #e8f7ef;
    --danger: #c0392b; --danger-bg: #fdecea;
    --border: #e2e6ed; --radius: 14px; --shadow: 0 2px 12px rgba(0,0,0,0.07);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151c; --surface: #1c2030; --fg: #e8ecf4; --fg-soft: #8892a8;
      --accent: #4a9edd; --accent-light: #1a2d42;
      --success: #34c974; --success-bg: #0f2a1c;
      --danger: #f07070; --danger-bg: #2a0f0f;
      --border: #2a3045; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151c; --surface: #1c2030; --fg: #e8ecf4; --fg-soft: #8892a8;
    --accent: #4a9edd; --accent-light: #1a2d42;
    --success: #34c974; --success-bg: #0f2a1c;
    --danger: #f07070; --danger-bg: #2a0f0f;
    --border: #2a3045; color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--fg);
    min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding-block: 24px; padding-inline: 16px; direction: rtl;
  }
  /* Center only the start screen; quiz and result screens start at the top. */
  body:has(#screen-start.active) { justify-content: center; }
  .app { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .header { background: var(--accent); border-radius: var(--radius); padding: 22px 26px; color: #fff; }
  .header h1 { font-size: 1.9rem; font-weight: 900; line-height: 1.3; }
  .header p { font-size: 1.1rem; opacity: 0.88; margin-top: 4px; }
  .lang-bar {
    background: var(--surface); border-radius: var(--radius); padding: 14px 20px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    border: 1px solid var(--border); box-shadow: var(--shadow);
  }
  .lang-bar span { font-size: 0.82rem; color: var(--fg-soft); font-weight: 600; }
  .lang-btn {
    background: var(--bg); border: 1.5px solid var(--border); border-radius: 8px;
    padding: 9px 16px; font-family: 'Cairo', sans-serif; font-size: 1.05rem;
    font-weight: 700; color: var(--fg-soft); cursor: pointer;
  }
  .lang-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .screen { display: none; flex-direction: column; gap: 16px; }
  .screen.active { display: flex; }
  .card {
    background: var(--surface); border-radius: var(--radius); padding: 24px;
    border: 1px solid var(--border); box-shadow: var(--shadow);
  }
  .card h2 { font-size: 1.45rem; font-weight: 800; margin-bottom: 6px; }
  .card p { color: var(--fg-soft); font-size: 1.15rem; line-height: 1.7; }
  .input-group { display: flex; flex-direction: column; gap: 6px; }
  .input-group label { font-size: 0.88rem; font-weight: 700; color: var(--fg-soft); }
  .text-input {
    background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px;
    padding: 16px 18px; font-family: 'Cairo', sans-serif; font-size: 1rem;
    color: var(--fg); width: 100%;
  }
  .text-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn {
    padding: 18px 32px; border-radius: 10px; font-family: 'Cairo', sans-serif;
    font-size: 1rem; font-weight: 800; cursor: pointer; border: none; text-align: center;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--bg); color: var(--fg); border: 1.5px solid var(--border); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-small { padding: 8px 14px; font-size: 0.85rem; }
  .btn:focus-visible, .lang-btn:focus-visible, .option-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .nav-link {
    font-family: 'Cairo', sans-serif; font-size: 1.05rem; font-weight: 700;
    color: var(--fg-soft); background: none; border: none; cursor: pointer; padding: 6px 12px; border-radius: 8px;
  }
  .nav-link:hover { color: var(--accent); background: var(--accent-light); }
  .quiz-header {
    background: var(--surface); border-radius: var(--radius); padding: 14px 20px;
    border: 1px solid var(--border); display: flex; align-items: center;
    justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .quiz-meta { font-size: 1.05rem; color: var(--fg-soft); font-weight: 700; }
  .progress-bar { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; flex: 1; min-width: 80px; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.3s ease; }
  .q-counter { font-size: 1.05rem; color: var(--fg-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .q-category {
    display: inline-flex; background: var(--accent-light); color: var(--accent);
    font-size: 0.78rem; font-weight: 700; padding: 4px 10px; border-radius: 99px; margin-bottom: 14px;
  }
  .q-text { font-size: 1.45rem; font-weight: 700; line-height: 1.7; margin-bottom: 20px; text-wrap: balance; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px;
    padding: 18px 22px; font-family: 'Cairo', sans-serif; font-size: 1.25rem; font-weight: 600;
    color: var(--fg); cursor: pointer; text-align: right; display: flex; align-items: center; gap: 10px;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-light); }
  .option-btn.picked { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
  .option-btn:disabled { cursor: default; }
  .opt-label {
    width: 34px; height: 34px; border-radius: 50%; background: var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.78rem; font-weight: 800; flex-shrink: 0;
  }
  .option-btn.picked .opt-label { background: var(--accent); color: #fff; }
  .next-row { display: flex; justify-content: flex-start; }
  .score-circle {
    width: 120px; height: 120px; border-radius: 50%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: 2rem; font-weight: 900; border: 6px solid; margin: 0 auto;
  }
  .score-circle.pass { border-color: var(--success); color: var(--success); background: var(--success-bg); }
  .score-circle.fail { border-color: var(--danger); color: var(--danger); background: var(--danger-bg); }
  .score-circle span { font-size: 0.72rem; font-weight: 700; opacity: 0.8; }
  .result-card { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 32px 24px; }
  .result-name { font-size: 1.3rem; font-weight: 900; }
  .verdict { padding: 8px 22px; border-radius: 99px; font-size: 1rem; font-weight: 800; }
  .verdict-pass { background: var(--success-bg); color: var(--success); }
  .verdict-fail { background: var(--danger-bg); color: var(--danger); }
  .result-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .records-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .records-table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
  .records-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; background: var(--surface); }
  .records-table th { background: var(--accent); color: #fff; padding: 12px 16px; font-weight: 700; text-align: right; white-space: nowrap; }
  .records-table td { padding: 12px 16px; border-top: 1px solid var(--border); vertical-align: middle; }
  .badge { display: inline-flex; padding: 3px 10px; border-radius: 99px; font-size: 0.8rem; font-weight: 800; }
  .badge-pass { background: var(--success-bg); color: var(--success); }
  .badge-fail { background: var(--danger-bg); color: var(--danger); }
  .password-prompt { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 36px 24px; }
  .password-prompt p { color: var(--fg-soft); font-size: 0.9rem; }
  .pw-input { max-width: 280px; text-align: center; direction: ltr; }
  .error-msg { color: var(--danger); font-size: 0.85rem; font-weight: 600; }
  .empty-state { color: var(--fg-soft); font-size: 0.92rem; padding: 32px; text-align: center; }
  .bottom-nav { display: flex; justify-content: center; }
  .rev-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
  .rev-head { font-weight: 800; color: var(--accent); font-size: 0.92rem; }
  .rev-lang { border-top: 1px dashed var(--border); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .rev-lbl { font-size: 0.75rem; font-weight: 800; color: var(--fg-soft); }
  .rev-q { font-weight: 700; line-height: 1.6; }
  .rev-opt { font-size: 0.92rem; padding: 6px 10px; border-radius: 8px; background: var(--bg); }
  .study-sec { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
  .study-sec h3 { color: var(--accent); font-size: 1.1rem; font-weight: 900; border-bottom: 2px solid var(--accent-light); padding-bottom: 8px; }
  .study-it { display: flex; flex-direction: column; gap: 4px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .study-it:last-child { border-bottom: none; padding-bottom: 0; }
  .study-q { font-weight: 700; line-height: 1.6; }
  .study-a { color: var(--success); font-weight: 600; line-height: 1.6; }
  .lang-chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .rev-opt.ok { background: var(--success-bg); color: var(--success); font-weight: 700; }
</style>

<div class="app">
  <div class="header">
    <h1 id="hdr-title">اختبار الوعي الصحي للموظفين</h1>
    <p id="hdr-sub">٤٠ سؤال من بنك أسئلة متنوع</p>
  </div>

  <div class="lang-bar">
    <span id="lbl-lang">اللغة:</span>
    <button class="lang-btn active" data-lang="ar">عربي</button>
    <button class="lang-btn" data-lang="en">English</button>
    <button class="lang-btn" data-lang="hi">हिंदी</button>
    <button class="lang-btn" data-lang="bn">বাংলা</button>
    <button class="lang-btn" data-lang="id">Indonesia</button>
  </div>

  <!-- START -->
  <div id="screen-start" class="screen active">
    <div class="card">
      <h2 id="s-title"></h2>
      <p id="s-sub"></p>
    </div>
    <div class="card input-group">
      <label id="lbl-name" for="emp-name"></label>
      <input type="text" id="emp-name" class="text-input" autocomplete="off">
      <p id="name-error" class="error-msg" style="display:none"></p>
    </div>
    <button class="btn btn-primary" id="btn-start">ابدأ الاختبار ◄</button>
    <div class="bottom-nav" style="gap:14px;flex-wrap:wrap"><button class="nav-link" id="nav-study">📖 المذكرة</button><button class="nav-link" id="nav-records">📋 سجل النتائج</button></div>
  </div>

  <!-- QUIZ -->
  <div id="screen-quiz" class="screen">
    <div class="quiz-header">
      <div class="quiz-meta" id="emp-display"></div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="q-counter" id="q-counter"></div>
    </div>
    <div class="card">
      <div class="q-category" id="q-cat"></div>
      <div class="q-text" id="q-text"></div>
      <div class="options" id="options"></div>
    </div>
    <div class="next-row" style="gap:10px;flex-wrap:wrap">
      <button class="btn btn-secondary" id="btn-prev" style="display:none"></button>
      <button class="btn btn-primary" id="btn-next" style="display:none"></button>
    </div>
  </div>

  <!-- RESULT -->
  <div id="screen-result" class="screen">
    <div class="card result-card">
      <div class="score-circle" id="score-circle">
        <div id="score-pct">0%</div>
        <span id="score-frac">0/40</span>
      </div>
      <div class="result-name" id="res-name"></div>
      <div class="verdict" id="res-verdict"></div>
      <div class="result-actions">
        <button class="btn btn-primary btn-small" id="btn-new-emp"></button>
        <button class="btn btn-secondary btn-small" id="btn-back-start"></button>
      </div>
    </div>
  </div>

  <!-- PASSWORD -->
  <div id="screen-password" class="screen">
    <div class="card password-prompt">
      <div style="font-size:2.5rem">🔒</div>
      <h2 id="pw-title"></h2>
      <p id="pw-sub"></p>
      <input type="password" id="pw-input" class="text-input pw-input" placeholder="••••">
      <p id="pw-error" class="error-msg" style="display:none"></p>
      <button class="btn btn-primary" id="btn-unlock"></button>
      <button class="nav-link" id="btn-pw-back"></button>
    </div>
  </div>

  <!-- RECORDS -->
  <div id="screen-records" class="screen">
    <div class="card records-header">
      <h2 id="rec-title"></h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary btn-small" id="btn-upload"></button>
        <button class="btn btn-danger btn-small" id="btn-clear"></button>
        <button class="btn btn-secondary btn-small" id="btn-review"></button>
        <button class="btn btn-secondary btn-small" id="btn-rec-back"></button>
      </div>
    </div>
    <div class="records-table-wrap">
      <table class="records-table">
        <thead>
          <tr>
            <th id="th-num">#</th><th id="th-name"></th><th id="th-score"></th>
            <th id="th-pct"></th><th id="th-verdict"></th><th id="th-date"></th>
          </tr>
        </thead>
        <tbody id="records-body"></tbody>
      </table>
    </div>
  </div>

  <!-- STUDY (public study notes from the book, all languages) -->
  <div id="screen-study" class="screen">
    <div class="card records-header">
      <h2 id="study-title"></h2>
      <button class="btn btn-secondary btn-small" id="btn-study-back"></button>
    </div>
    <div class="card"><div class="lang-chips" id="study-chips"></div></div>
    <div id="study-body" style="display:flex;flex-direction:column;gap:14px"></div>
  </div>

  <!-- REVIEW (all questions in all languages; reachable only after the password) -->
  <div id="screen-review" class="screen">
    <div class="card records-header">
      <h2 id="rev-title"></h2>
      <button class="btn btn-secondary btn-small" id="btn-rev-back"></button>
    </div>
    <div id="review-body" style="display:flex;flex-direction:column;gap:14px"></div>
  </div>
</div>

}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ───── QUIZ FLOW ─────
function startQuiz() {
  empName = document.getElementById('emp-name').value.trim();
  const err = document.getElementById('name-error');
  if (!empName) {
    err.textContent = T[lang].enterName;
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';
  // Random 40 questions, each with its options shuffled so the answer position changes.
  // 35 food-safety questions + 5 reasoning questions, shuffled together.
  const REASONING_CATS = ['Logic', 'Calculation', 'Prioritizing', 'Reasoning'];
  const isReasoning = i => REASONING_CATS.includes(BANK[i].cat.en);
  const allIdx = BANK.map((_, i) => i);
  const reasoningPick = shuffle(allIdx.filter(isReasoning)).slice(0, 5);
  const healthPick = shuffle(allIdx.filter(i => !isReasoning(i))).slice(0, QUIZ_LENGTH - 5);
  const picked40 = shuffle(reasoningPick.concat(healthPick));
  quiz = picked40.map(qi => {
    const order = shuffle([0, 1, 2, 3]);
    return { qi, order, correctPos: order.indexOf(BANK[qi].c) };
  });
  currentQ = 0;
  score = 0;
  picked = null;
  answers = quiz.map(() => null);
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion() {
  picked = answers[currentQ] ?? null;
  const item = quiz[currentQ];
  const bq = BANK[item.qi];
  const total = quiz.length;
  document.getElementById('emp-display').textContent = T[lang].empOf + ' ' + empName;
  document.getElementById('progress-fill').style.width = Math.round((currentQ / total) * 100) + '%';
  document.getElementById('q-counter').textContent = (currentQ + 1) + ' / ' + total;
  document.getElementById('q-cat').textContent = bq.cat[lang];
  document.getElementById('q-text').textContent = bq.q[lang];

  const labels = lang === 'ar' ? ['أ','ب','ج','د'] : ['A','B','C','D'];
  const opts = bq.o[lang];
  const wrap = document.getElementById('options');
  wrap.innerHTML = '';
  item.order.forEach((origIdx, pos) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn' + (picked === pos ? ' picked' : '');
    btn.innerHTML = '<span class="opt-label">' + labels[pos] + '</span>';
    const txt = document.createElement('span');
    txt.textContent = opts[origIdx];
    btn.appendChild(txt);
    btn.addEventListener('click', () => selectOption(pos));
    wrap.appendChild(btn);
  });

  const next = document.getElementById('btn-next');
  next.textContent = currentQ === total - 1 ? T[lang].finish : T[lang].next;
  next.style.display = picked !== null ? '' : 'none';
  next.onclick = nextQuestion;
  const prev = document.getElementById('btn-prev');
  prev.textContent = T[lang].prev;
  prev.style.display = currentQ > 0 ? '' : 'none';
  prev.onclick = prevQuestion;
}

// No feedback shown during the test, so the next employee cannot learn the answers.
// The employee can change the answer on the same question, or go back to earlier questions.
function selectOption(pos) {
  answers[currentQ] = pos;
  renderQuestion();
}

function nextQuestion() {
  if (answers[currentQ] === null || answers[currentQ] === undefined) return;
  currentQ++;
  if (currentQ >= quiz.length) { showResult(); return; }
  renderQuestion();
}

function prevQuestion() {
  if (currentQ === 0) return;
  currentQ--;
  renderQuestion();
}

// ───── RESULT ─────
function showResult() {
  const t = T[lang];
  const total = quiz.length;
  const log = quiz.map((item, i) => ({ qi: item.qi, order: item.order, chosen: answers[i], correctPos: item.correctPos }));
  score = log.filter(a => a.chosen === a.correctPos).length;
  const pct = Math.round((score / total) * 100);
  const pass = score >= PASS_SCORE;

  showScreen('result');
  const circle = document.getElementById('score-circle');
  circle.className = 'score-circle ' + (pass ? 'pass' : 'fail');
  document.getElementById('score-pct').textContent = pct + '%';
  document.getElementById('score-frac').textContent = score + '/' + total;
  document.getElementById('res-name').textContent = empName;
  const verdict = document.getElementById('res-verdict');
  verdict.textContent = pass ? t.pass : t.fail;
  verdict.className = 'verdict ' + (pass ? 'verdict-pass' : 'verdict-fail');
  document.getElementById('btn-new-emp').onclick = newEmployee;
  document.getElementById('btn-back-start').onclick = showStart;

  const now = new Date();
  const date = now.toLocaleDateString('ar-SA') + ' ' + now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
  records.push({ name: empName, score, total, pct, pass, date, sent: true });
  saveRecords();
  // List of wrong answers (Arabic text): question, what the employee chose, and the correct answer.
  const wrongLines = log
    .filter(a => a.chosen !== a.correctPos)
    .map((a, i) => {
      const bq = BANK[a.qi];
      return (i + 1) + ') ' + bq.q.ar +
        ' | إجابته: ' + bq.o.ar[a.order[a.chosen]] +
        ' | الصح: ' + bq.o.ar[a.order[a.correctPos]];
    });
  sendToSheet({ name: empName, score, total, pct, pass, wrong: wrongLines.join('\n') || 'لا يوجد' });
}

function newEmployee() {
  document.getElementById('emp-name').value = '';
  showScreen('start');
}

// ───── RECORDS ─────
function showRecords() {
  document.getElementById('pw-input').value = '';
  document.getElementById('pw-error').style.display = 'none';
  showScreen('password');
  document.getElementById('pw-input').focus();
}

function checkPassword() {
  const val = document.getElementById('pw-input').value;
  if (val === PASSWORD) {
    document.getElementById('pw-error').style.display = 'none';
    renderRecords();
    showScreen('records');
  } else {
    const e = document.getElementById('pw-error');
    e.textContent = T[lang].pwWrong;
    e.style.display = 'block';
  }
}

function renderRecords() {
  const t = T[lang];
  const tbody = document.getElementById('records-body');
  tbody.innerHTML = '';
  if (records.length === 0) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 6;
    td.className = 'empty-state';
    td.textContent = t.noRecords;
    tr.appendChild(td);
    tbody.appendChild(tr);
    return;
  }
  records.slice().reverse().forEach((r, i) => {
    const tr = document.createElement('tr');
    const cells = [
      String(records.length - i),
      r.name,
      r.score + ' / ' + r.total,
      r.pct + '%',
      null,
      r.date
    ];
    cells.forEach((val, ci) => {
      const td = document.createElement('td');
      if (ci === 4) {
        const b = document.createElement('span');
        b.className = 'badge ' + (r.pass ? 'badge-pass' : 'badge-fail');
        b.textContent = r.pass ? t.pass : t.fail;
        td.appendChild(b);
      } else {
        td.textContent = val;
        if (ci === 1) td.style.fontWeight = '700';
        if (ci === 5) { td.style.color = 'var(--fg-soft)'; td.style.fontSize = '0.82rem'; td.style.whiteSpace = 'nowrap'; }
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

// Sends records saved in this browser that were never sent to the sheet (e.g. older tests).
function uploadRecords() {
  const btn = document.getElementById('btn-upload');
  const pending = records.filter(r => !r.sent);
  if (pending.length === 0) { btn.textContent = T[lang].btnUploadDone; return; }
  pending.forEach((r, i) => setTimeout(() => {
    sendToSheet({ name: r.name, score: r.score, total: r.total, pct: r.pct, pass: r.pass,
                  wrong: r.wrong || 'مرفوع من السجل المحلي (بدون تفاصيل)' });
    r.sent = true;
    saveRecords();
  }, i * 400));
  setTimeout(() => { btn.textContent = T[lang].btnUploadDone; }, pending.length * 400 + 200);
}

let clearArmed = false;
function clearRecords() {
  const btn = document.getElementById('btn-clear');
  if (!clearArmed) {
    clearArmed = true;
    btn.textContent = T[lang].confirmClear;
    setTimeout(() => { clearArmed = false; btn.textContent = T[lang].btnClear; }, 4000);
    return;
  }
  clearArmed = false;
  records = [];
  saveRecords();
  renderRecords();
  btn.textContent = T[lang].btnClear;
}

function escHtml(s) { return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function showReview() {

function renderReview() {
  const letters = ['A','B','C','D'];
  const html = BANK.map((bq, i) => {
    const langs = REV_LANGS.map(([L, name]) => {
      const opts = bq.o[L].map((o, p) => {
        const ok = p === bq.c;
        return `<div class="rev-opt${ok ? ' ok' : ''}">${ok ? '✓ ' : ''}${escHtml(letters[p])}. ${escHtml(o)}</div>`;
      }).join('');
      return `<div class="rev-lang"><div class="rev-lbl">${name}</div><div class="rev-q">${escHtml(bq.q[L])}</div>${opts}</div>`;
    }).join('');
    return `<div class="rev-item"><div class="rev-head">${i + 1}. ${escHtml(bq.cat.en)} — ${escHtml(bq.cat.ar)}</div>${langs}</div>`;
  }).join('');
  document.getElementById('review-body').innerHTML = html;
}

// ───── STUDY NOTES (from the book; all languages; employees can open them freely) ─────
function showStudy() {
  if (!studyLang) studyLang = lang;
  renderStudy();
  showScreen('study');
}
function renderStudy() {
  const REAS = ['Logic', 'Calculation', 'Prioritizing', 'Reasoning'];
  const chipDefs = [['all', STUDY_T[lang].all], ...REV_LANGS];
  document.getElementById('study-chips').innerHTML = chipDefs.map(([L, name]) =>
    `<button class="lang-btn${(studyLang === L) ? ' active' : ''}" data-sl="${L}">${escHtml(name)}</button>`).join('');
  document.querySelectorAll('#study-chips [data-sl]').forEach(b =>
    b.addEventListener('click', () => { studyLang = b.dataset.sl; renderStudy(); }));

  const groups = new Map();
  BANK.filter(x => !REAS.includes(x.cat.en)).forEach(x => {
    if (!groups.has(x.cat.en)) groups.set(x.cat.en, []);
    groups.get(x.cat.en).push(x);
  });
  const show = L => studyLang === 'all' || studyLang === L;
  const html = [...groups.entries()].map(([, items]) => {
    const head = (studyLang === 'all' ? `${escHtml(items[0].cat.en)} / ${escHtml(items[0].cat.ar)}` : escHtml(items[0].cat[studyLang]));
    const body = items.map(it => {
      const langs = REV_LANGS.filter(([L]) => show(L)).map(([L, name]) =>
        `<div class="study-it"><div class="rev-lbl">${studyLang === 'all' ? name : ''}</div>` +
        `<div class="study-q">${escHtml(it.q[L])}</div>` +
        `<div class="study-a">✓ ${escHtml(it.o[L][it.c])}</div></div>`).join('');
      return langs;
    }).join('');
    return `<div class="study-sec"><h3>${head}</h3>${body}</div>`;
  }).join('');
  document.getElementById('study-body').innerHTML = html;
}
