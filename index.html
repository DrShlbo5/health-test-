े बिना तैयार भोजन छूने, या भोजन पर खांसने-छींकने से।","সরাসরি: নোংরা হাতে খাবার ছোঁয়া, গ্লাভস ছাড়া তৈরি খাবার সরাসরি ধরা, বা খাবারের উপর কাশি বা হাঁচি দেওয়া।","Secara langsung: menyentuh pangan dengan tangan kotor, menyentuh pangan siap saji tanpa sarung tangan, atau batuk atau bersin di atas pangan."],["li","بطريقة غير مباشرة: لمس الأسطح الملوثة ثم لمس الغذاء، استخدام أدوات ملوثة في تحضير الغذاء، ارتداء ملابس متسخة أثناء التعامل مع الغذاء.","Indirectly: touching contaminated surfaces then food, using contaminated tools to prepare food, wearing dirty clothing while handling food.","अप्रत्यक्ष रूप से: दूषित सतह छूकर फिर भोजन छूने, भोजन तैयार करने में दूषित औज़ार इस्तेमाल करने, भोजन संभालते समय गंदे कपड़े पहनने से।","পরোক্ষভাবে: দূষিত পৃষ্ঠ ছোঁয়ার পর খাবার ছোঁয়া, খাবার তৈরিতে দূষিত সরঞ্জাম ব্যবহার, খাবার নাড়াচাড়ার সময় নোংরা পোশাক পরা।","Secara tidak langsung: menyentuh permukaan tercemar lalu pangan, menggunakan peralatan tercemar untuk menyiapkan pangan, memakai pakaian kotor saat menangani pangan."],["li","من خلال الجروح المكشوفة: قد تنقل البكتيريا وتنقلها للغذاء.","Through open wounds: they can carry bacteria and transfer them to food.","खुले घावों के रास्ते: ये जीवाणु ले जाकर भोजन तक पहुँचा सकते हैं।","খোলা ক্ষতের মাধ্যমে: এরা ব্যাকটেরিয়া বহন করে খাবারে পৌঁছে দিতে পারে।","Melalui luka terbuka: dapat membawa bakteri dan memindahkannya ke pangan."],["li","من الحلي والمجوهرات: قد تحمل البكتيريا وتنقلها للغذاء.","From jewellery: they can carry bacteria and transfer them to food.","गहनों से: ये जीवाणु ले जाकर भोजन तक पहुँचा सकते हैं।","গয়না থেকে: এগুলো ব্যাকটেরিয়া বহন করে খাবারে নিতে পারে।","Dari perhiasan: dapat membawa bakteri dan memindahkannya ke pangan."],["li","عند المرض: التعامل مع الغذاء ونحن مرضى ينقل البكتيريا.","When ill: handling food while sick transfers bacteria.","बीमार होने पर: बीमारी में भोजन संभालने से जीवाणु फैलते हैं।","অসুস্থ অবস্থায়: অসুস্থ থেকে খাবার নাড়াচাড়া করলে ব্যাকটেরিয়া ছড়ায়।","Saat sakit: menangani pangan saat sakit memindahkan bakteri."],["n","ماذا يعني هذا لنا؟: كما علمنا سابقاً، الحفاظ على النظافة الشخصية لمتداولي الغذاء من الاشتراطات الأساسية للعاملين في منشآت الغذاء، حيث يجب على كل من يعمل في مجال الغذاء الالتزام بأعلى معايير النظافة الشخصية لتجنب تلوث الغذاء والتسبب في الأمراض.","What this means for us: as we learned earlier, keeping personal hygiene is a basic requirement for food handlers. Everyone working in food must meet the highest personal hygiene standards to avoid food contamination and disease.","हमारे लिए इसका अर्थ: जैसा पहले सीखा, भोजन संभालने वालों के लिए व्यक्तिगत स्वच्छता बुनियादी शर्त है। खाद्य क्षेत्र में काम करने वाले हर व्यक्ति को संदूषण और बीमारी से बचने के लिए सर्वोच्च स्वच्छता मानक अपनाने होंगे।","আমাদের জন্য এর অর্থ: আগে যেমন শিখেছি, খাবার পরিচালনাকারীদের ব্যক্তিগত পরিচ্ছন্নতা রক্ষা মৌলিক শর্ত। খাদ্য খাতে যে কেউ কাজ করুন, দূষণ ও রোগ এড়াতে সর্বোচ্চ ব্যক্তিগত পরিচ্ছন্নতার মান মানতে হবে।","Bagi kita: seperti yang sudah dipelajari, menjaga kebersihan pribadi penjamah pangan adalah syarat dasar. Setiap orang yang bekerja di bidang pangan harus memenuhi standar kebersihan pribadi tertinggi untuk menghindari kontaminasi pangan dan penyakit."],["h3","متى تبدأ النظافة الشخصية؟","When does personal hygiene start?","व्यक्तिगत स्वच्छता कब शुरू होती है?","ব্যক্তিগত পরিচ্ছন্নতা কখন শুরু হয়?","Kapan kebersihan pribadi dimulai?"],["p","النظافة الشخصية تبدأ قبل وصولك إلى العمل.","Personal hygiene starts before you arrive at work.","व्यक्तिगत स्वच्छता काम पर पहुँचने से पहले शुरू होती है।","ব্যক্তিগত পরিচ্ছন্নতা কাজে পৌঁছানোর আগেই শুরু হয়।","Kebersihan pribadi dimulai sebelum Anda tiba di tempat kerja."],["h3","في المنزل","At home","घर पर","বাড়িতে","Di rumah"],["p","بالاستحمام اليومي، غسل الشعر (واللحية) بانتظام، تنظيف الأسنان بشكل متكرر، الحفاظ على الأظافر قصيرة ونظيفة، وارتداء ملابس نظيفة كل يوم.","Daily bathing, washing hair (and beard) regularly, brushing teeth frequently, keeping nails short and clean, and wearing clean clothes every day.","रोज़ नहाना, बाल (और दाढ़ी) नियमित धोना, बार-बार दांत साफ़ करना, नाखून छोटे और साफ़ रखना, और हर दिन साफ़ कपड़े पहनना।","প্রতিদিন গোসল, নিয়মিত চুল (ও দাড়ি) ধোয়া, ঘন ঘন দাঁত ব্রাশ, নখ ছোট ও পরিষ্কার রাখা, এবং প্রতিদিন পরিষ্কার পোশাক পরা।","Mandi setiap hari, mencuci rambut (dan jenggot) secara teratur, menyikat gigi sering, menjaga kuku pendek dan bersih, serta memakai pakaian bersih setiap hari."],["h3","قبل الذهاب للعمل","Before going to work","काम पर जाने से पहले","কাজে যাওয়ার আগে","Sebelum pergi bekerja"],["li","عدم الذهاب للعمل إذا كنت تعاني من أعراض مثل: الحمى، الإسهال، التهاب الحلق المتقيؤ، أو صفار اليرقان (اصفرار الجلد والعينين).","Do not go to work if you have symptoms such as fever, diarrhoea, sore throat with vomiting, or jaundice (yellowing of skin and eyes).","यदि आपको बुखार, दस्त, उल्टी के साथ गले में खराश या पीलिया (त्वचा और आंखों का पीला होना) जैसे लक्षण हों तो काम पर न जाएँ।","জ্বর, ডায়রিয়া, বমিসহ গলাব্যথা, বা জন্ডিস (ত্বক ও চোখ হলুদ হওয়া) এর মতো লক্ষণ থাকলে কাজে যাবেন না।","Jangan bekerja jika mengalami gejala seperti demam, diare, sakit tenggorokan disertai muntah, atau kuning (ikterus) pada kulit dan mata."],["li","أبلغ المشرف وراجع الطبيب إذا شعرت بهذه الأعراض.","Tell your supervisor and see a doctor if you feel these symptoms.","इन लक्षणों पर पर्यवेक्षक को बताएँ और डॉक्टर को दिखाएँ।","এসব লক্ষণ দেখলে সুপারভাইজারকে জানান এবং ডাক্তার দেখান।","Beri tahu supervisor dan periksakan ke dokter jika merasakan gejala ini."],["h3","قبل بدء العمل","Before starting work","काम शुरू करने से पहले","কাজ শুরুর আগে","Sebelum mulai bekerja"],["li","اخلع الساعة والحلي.","Remove your watch and jewellery.","घड़ी और गहने उतारें।","ঘড়ি ও গয়না খুলে ফেলুন।","Lepaskan jam tangan dan perhiasan."],["li","ارتد ملابس العمل في المكان المخصص.","Put on work clothes in the designated place.","कार्य वस्त्र निर्धारित स्थान पर पहनें।","নির্ধারিত জায়গায় কাজের পোশাক পরুন।","Kenakan pakaian kerja di tempat yang ditentukan."],["li","اغسل يديك قبل لمس أي شيء في منطقة العمل.","Wash your hands before touching anything in the work area.","काम के क्षेत्र में कुछ भी छूने से पहले हाथ धोएँ।","কাজের এলাকায় কিছু স্পর্শ করার আগে হাত ধুন।","Cuci tangan sebelum menyentuh apa pun di area kerja."],["h3","الملابس المناسبة لمتداولي الغذاء","Suitable clothing for food handlers","भोजन संभालने वालों के लिए उपयुक्त कपड़े","খাবার পরিচালনাকারীদের উপযুক্ত পোশাক","Pakaian yang sesuai bagi penjamah pangan"],["p","ارتداء الملابس المناسبة أمر مهم جداً في العمل في مجال الغذاء.","Wearing suitable clothing is very important when working in food.","खाद्य क्षेत्र में काम करते समय उपयुक्त कपड़े पहनना बहुत ज़रूरी है।","খাদ্য খাতে কাজের সময় উপযুক্ত পোশাক পরা খুবই গুরুত্বপূর্ণ।","Mengenakan pakaian yang sesuai sangat penting saat bekerja di bidang pangan."],["li","الملابس النظيفة: ارتداء ملابس نظيفة كل يوم. الملابس يجب أن تكون: قابلة للغسل، ذات ألوان فاتحة، بها عدد قليل من الجيوب، في حالة جيدة، تغطي معظم ملابسك الخارجية.","Clean clothing: wear clean clothes every day. Clothing should be: washable, light coloured, with few pockets, in good condition, and cover most of your outer clothes.","साफ़ कपड़े: हर दिन साफ़ कपड़े पहनें। कपड़े ऐसे हों: धोने योग्य, हल्के रंग के, कम जेबों वाले, अच्छी हालत में, और बाहरी कपड़ों को अधिकतर ढकने वाले।","পরিষ্কার পোশাক: প্রতিদিন পরিষ্কার পোশাক পরুন। পোশাক হতে হবে: ধোয়ার উপযোগী, হালকা রঙের, কম পকেটযুক্ত, ভালো অবস্থায়, এবং বাইরের পোশাক বেশিরভাগ ঢাকে এমন।","Pakaian bersih: kenakan pakaian bersih setiap hari. Pakaian harus: dapat dicuci, berwarna terang, sedikit kantongnya, dalam kondisi baik, dan menutupi sebagian besar pakaian luar."],["h3","تغطية الرأس","Head covering","सिर ढकना","মাথার আবরণ","Penutup kepala"],["li","تغطّي الرأس واللحية عند إعداد الغذاء أو الدخول في مناطق إعداده أو تخزينه.","Cover the head and beard when preparing food or entering food preparation or storage areas.","भोजन तैयार करते समय या उसके तैयारी/भंडारण क्षेत्र में जाते समय सिर और दाढ़ी ढकें।","খাবার প্রস্তুত করার সময় বা প্রস্তুতি/সংরক্ষণ এলাকায় ঢুকলে মাথা ও দাড়ি ঢাকুন।","Tutup kepala dan jenggot saat menyiapkan pangan atau masuk area persiapan atau penyimpanan."],["li","استخدام قبعات نظيفة أو شبكات شعر.","Use clean caps or hair nets.","साफ़ टोपी या हेयर-नेट इस्तेमाल करें।","পরিষ্কার টুপি বা হেয়ারনেট ব্যবহার করুন।","Gunakan topi bersih atau jaring rambut."],["h3","الحلي والمجوهرات","Jewellery and watches","गहने और घड़ियाँ","গয়না ও ঘড়ি","Perhiasan dan jam"],["li","عدم ارتداء الحلي والساعات أثناء العمل.","Do not wear jewellery and watches while working.","काम के दौरान गहने और घड़ियाँ न पहनें।","কাজের সময় গয়না ও ঘড়ি পরবেন না।","Jangan memakai perhiasan dan jam saat bekerja."],["h3","الأحذية الخاصة","Special footwear","विशेष जूते","বিশেষ জুতা","Alas kaki khusus"],["li","ارتداء أحذية خاصة في مناطق التعامل مع الغذاء.","Wear special footwear in food handling areas.","भोजन संभालने के क्षेत्रों में विशेष जूते पहनें।","খাবার নাড়াচাড়ার এলাকায় বিশেষ জুতা পরুন।","Kenakan alas kaki khusus di area penanganan pangan."],["li","يجب أن تكون قابلة للغسل وفي حالة جيدة.","They must be washable and in good condition.","ये धोने योग्य और अच्छी हालत में होने चाहिए।","এগুলো ধোয়ার উপযোগী ও ভালো অবস্থায় থাকতে হবে।","Harus dapat dicuci dan dalam kondisi baik."],["h3","خارج مكان العمل","Outside the workplace","कार्यस्थल के बाहर","কর্মস্থলের বাইরে","Di luar tempat kerja"],["li","خلع ملابس العمل إذا غادرت مكان عملك (مثلاً للتدخين أو استخدام دورة المياه).","Take off work clothes if you leave your workplace (for example to smoke or use the toilet).","यदि आप कार्यस्थल छोड़ें (जैसे धूम्रपान या शौचालय के लिए) तो कार्य वस्त्र उतार दें।","কর্মস্থল ছাড়লে (যেমন ধূমপান বা টয়লেটে যেতে) কাজের পোশাক খুলে ফেলুন।","Lepas pakaian kerja jika meninggalkan tempat kerja (misalnya untuk merokok atau ke toilet)."],["h2","نظافة اليدين","Hand hygiene","हाथों की स्वच्छता","হাত পরিচ্ছন্নতা","Kebersihan tangan"],["h3","لماذا الاهتمام بغسل أيدينا؟","Why do we care about washing our hands?","हम हाथ क्यों धोते हैं?","আমরা হাত কেন ধুই?","Mengapa kita peduli mencuci tangan?"],["p","الأيدي النظيفة هي أهم أداة لسلامة الغذاء، حتى اليدين النظيفة ظاهرياً قد تحمل جراثيم.","Clean hands are the most important tool for food safety; even hands that look clean may carry germs.","साफ़ हाथ भोजन सुरक्षा का सबसे ज़रूरी साधन हैं; दिखने में साफ़ हाथों पर भी कीटाणु हो सकते हैं।","পরিষ্কার হাত খাদ্য নিরাপত্তার সবচেয়ে গুরুত্বপূর্ণ হাতিয়ার; দেখতে পরিষ্কার হাতেও জীবাণু থাকতে পারে।","Tangan bersih adalah alat terpenting untuk keamanan pangan; tangan yang tampak bersih pun bisa membawa kuman."],["h3","متى نغسل أيدينا؟","When do we wash our hands?","हमें हाथ कब धोने चाहिए?","আমরা কখন হাত ধুই?","Kapan kita mencuci tangan?"],["p","عند الوصول للعمل وقبل التعامل مع الغذاء والأواني، قبل ارتداء القفازات، وبين تغييرها، قبل وبعد التعامل مع الغذاء النيء، بعد استخدام دورات المياه، بعد لمس الجسم أو ملابس العمل، وبعد أخذ استراحة.","On arrival at work and before handling food and utensils, before putting on gloves and between changing them, before and after handling raw food, after using the toilet, after touching the body or work clothes, and after taking a break.","काम पर पहुँचने पर और भोजन व बर्तन संभालने से पहले, दस्ताने पहनने से पहले और बदलने के बीच, कच्चा भोजन संभालने से पहले और बाद में, शौचालय के बाद, शरीर या कार्य वस्त्र छूने के बाद, और ब्रेक के बाद।","কাজে পৌঁছে ও খাবার-বাসন নাড়াচাড়ার আগে, গ্লাভস পরার আগে ও বদলানোর মাঝে, কাঁচা খাবার নাড়াচাড়ার আগে ও পরে, টয়লেট ব্যবহারের পর, শরীর বা কাজের পোশাক ছোঁয়ার পর, এবং বিরতির পর।","Saat tiba di tempat kerja dan sebelum menangani pangan serta peralatan, sebelum memakai sarung tangan dan di antara penggantiannya, sebelum dan sesudah menangani pangan mentah, setelah menggunakan toilet, setelah menyentuh tubuh atau pakaian kerja, dan setelah istirahat."],["h3","كيف نغسل أيدينا؟","How do we wash our hands?","हम हाथ कैसे धोएँ?","আমরা কীভাবে হাত ধুই?","Bagaimana cara mencuci tangan?"],["p","في أحواض مخصصة بغسيل الأيدي فقط ولمدة 20 ثانية على الأقل بالماء الدافئ والصابون بالطريقة التالية:","In sinks reserved for handwashing only, for at least 20 seconds with warm water and soap, in the following way:","केवल हाथ धोने के लिए रखे सिंक में, कम से कम 20 सेकंड तक गुनगुने पानी और साबुन से, इस तरीके से:","শুধু হাত ধোয়ার জন্য নির্ধারিত বেসিনে, অন্তত ২০ সেকেন্ড গরম পানি ও সাবান দিয়ে, নিচের নিয়মে:","Di wastafel khusus cuci tangan saja, minimal 20 detik dengan air hangat dan sabun, dengan cara berikut:"],["li","1. بلل يديك بالماء الدافئ.","1. Wet your hands with warm water.","1. हाथ गुनगुने पानी से गीले करें।","১. গরম পানিতে হাত ভিজিয়ে নিন।","1. Basahi tangan dengan air hangat."],["li","2. ضع كمية مناسبة من الصابون.","2. Apply a suitable amount of soap.","2. उचित मात्रा में साबुन लगाएँ।","২. উপযুক্ত পরিমাণ সাবান লাগান।","2. Oleskan sabun secukupnya."],["li","3. افرك اليدين جيداً.","3. Rub your hands well.","3. हाथों को अच्छी तरह रगड़ें।","৩. হাত ভালো করে ঘষুন।","3. Gosok tangan dengan baik."],["li","4. افرك فيما بين وحول الأصابع.","4. Rub between and around the fingers.","4. उंगलियों के बीच और आसपास रगड़ें।","৪. আঙুলের ফাঁকে ও চারপাশে ঘষুন।","4. Gosok di sela dan sekitar jari."],["li","5. افرك ظهر كل يد مع راحة اليد الأخرى.","5. Rub the back of each hand with the palm of the other hand.","5. हर हाथ की पीठ को दूसरे हाथ की हथेली से रगड़ें।","৫. প্রতিটি হাতের পিঠ অন্য হাতের তালু দিয়ে ঘষুন।","5. Gosok punggung setiap tangan dengan telapak tangan yang lain."],["li","6. اشطف جيداً تحت الماء الجاري.","6. Rinse well under running water.","6. बहते पानी में अच्छी तरह धोएँ।","৬. বহমান পানিতে ভালো করে ধুয়ে নিন।","6. Bilas dengan baik di bawah air mengalir."],["li","7. استخدم مناديل ورقية للتجفيف.","7. Use paper towels to dry.","7. सुखाने के लिए कागज़ के तौलिये इस्तेमाल करें।","৭. শুকানোর জন্য কাগজের তোয়ালে ব্যবহার করুন।","7. Keringkan dengan tisu kertas."],["li","8. تخلص من المناديل في حاوية للنفايات.","8. Dispose of the tissues in a waste bin.","8. टिशू को कचरे के डिब्बे में डालें।","৮. তোয়ালে আবর্জনার পাত্রে ফেলুন।","8. Buang tisu ke tempat sampah."],["n","تذكر: الغسل الصحيح لليدين يمنع انتقال الجراثيم إلى الغذاء ويحمي صحة الجميع، لذلك التزم بالخطوات كل مرة.","Remember: correct handwashing stops germs passing to food and protects everyone's health, so follow the steps every time.","याद रखें: सही तरीके से हाथ धोने से कीटाणु भोजन तक नहीं पहुँचते और सबकी सेहत बचती है, इसलिए हर बार ये चरण अपनाएँ।","মনে রাখবেন: সঠিকভাবে হাত ধোয়া খাবারে জীবাণু যাওয়া আটকায় এবং সবার স্বাস্থ্য রক্ষা করে, তাই প্রতিবার এই ধাপগুলো মানুন।","Ingat: mencuci tangan dengan benar mencegah kuman berpindah ke pangan dan melindungi kesehatan semua orang, jadi ikuti langkah-langkah ini setiap kali."],["h2","الممارسات الصحية في مناطق التعامل مع الغذاء","Health practices in food handling areas","भोजन संभालने के क्षेत्रों में स्वास्थ्य पद्धतियाँ","খাবার পরিচালনার এলাকায় স্বাস্থ্য পদ্ধতি","Praktik kesehatan di area penanganan pangan"],["p","هي الممارسات والسلوكيات الصحية المهمة والتي يجب اتباعها في مناطق التعامل مع الغذاء:","These are the important health practices and behaviours that must be followed in food handling areas:","ये भोजन संभालने के क्षेत्र में पालन किए जाने वाले ज़रूरी स्वास्थ्य व्यवहार और आदतें हैं:","এগুলো খাবার পরিচালনার এলাকায় অনুসরণীয় গুরুত্বপূর্ণ স্বাস্থ্য পদ্ধতি ও আচরণ:","Ini adalah praktik dan perilaku kesehatan penting yang wajib diikuti di area penanganan pangan:"],["h3","التعامل مع الغذاء","Handling food","भोजन संभालना","খাবার পরিচালনা","Menangani pangan"],["p","لا تلمس الغذاء عالي الخطورة مباشرة باليدين، استخدم أدوات مناسبة مثل الملاعق والملاقط، واستخدم القفازات عند الضرورة.","Do not touch high-risk food directly with your hands; use suitable tools such as spoons and tongs, and use gloves when necessary.","उच्च-जोखिम भोजन को सीधे हाथ से न छुएँ; चम्मच और चिमटे जैसे उचित औज़ार इस्तेमाल करें, और ज़रूरत पर दस्ताने पहनें।","উচ্চ-ঝুঁকির খাবার সরাসরি হাতে ধরবেন না; চামচ ও চিমটার মতো উপযুক্ত সরঞ্জাম ব্যবহার করুন, প্রয়োজনে গ্লাভস পরুন।","Jangan menyentuh pangan berisiko tinggi langsung dengan tangan; gunakan alat seperti sendok dan penjepit, dan pakai sarung tangan bila perlu."],["h3","استخدام القفازات","Using gloves","दस्ताने इस्तेमाल करना","গ্লাভস ব্যবহার","Menggunakan sarung tangan"],["p","غيّرها القفازات كل نصف ساعة. غيّرها بعد التعامل مع النفايات أو بعد فترات الراحة. اغسل يديك قبل ارتداء قفازات جديدة. لا تستخدم القفازات لأغراض أخرى غير التعامل مع الغذاء.","Change gloves every half hour. Change them after handling waste or after breaks. Wash your hands before putting on new gloves. Do not use gloves for any purpose other than handling food.","दस्ताने हर आधे घंटे में बदलें। कचरा संभालने या ब्रेक के बाद बदलें। नए दस्ताने पहनने से पहले हाथ धोएँ। दस्ताने भोजन संभालने के अलावा किसी और काम के लिए न इस्तेमाल करें।","প্রতি আধা ঘণ্টায় গ্লাভস বদলান। আবর্জনা নাড়াচাড়ার পর বা বিরতির পরে বদলান। নতুন গ্লাভস পরার আগে হাত ধুন। খাবার নাড়াচাড়া ছাড়া অন্য কাজে গ্লাভস ব্যবহার করবেন না।","Ganti sarung tangan setiap setengah jam. Ganti setelah menangani sampah atau setelah istirahat. Cuci tangan sebelum memakai sarung tangan baru. Jangan gunakan sarung tangan untuk keperluan selain menangani pangan."],["h3","الكمامات وأغطية الرأس واللحية","Masks, head and beard covers","मास्क, सिर और दाढ़ी के आवरण","মাস্ক, মাথা ও দাড়ির আবরণ","Masker, penutup kepala dan jenggot"],["p","ارتد الكمامة لتغطية الأنف والفم، وغيّرها عند البلل أو بعد الراحة. استخدم أغطية الرأس لتغطية الشعر بالكامل، وأغطية الشعر للشعر الكثيف عند إعداد الغذاء، وغيّرها عند التلوث أو التساخ. اغسل يديك جيداً قبل ارتداء هذه الأدوات.","Wear a mask to cover the nose and mouth, and change it when wet or after a break. Use head covers to fully cover the hair, and hair nets for thick hair when preparing food, and change them when contaminated or dirty. Wash your hands well before putting on these items.","नाक-मुंह ढकने के लिए मास्क पहनें और गीला होने पर या ब्रेक के बाद बदलें। बालों को पूरी तरह ढकने के लिए सिर का आवरण, और भोजन तैयार करते समय घने बालों के लिए हेयर-नेट इस्तेमाल करें; दूषित या गंदा होने पर बदलें। इन्हें पहनने से पहले हाथ अच्छी तरह धोएँ।","নাক-মুখ ঢাকতে মাস্ক পরুন এবং ভিজে গেলে বা বিরতির পর বদলান। চুল পুরোপুরি ঢাকতে মাথার আবরণ, আর খাবার তৈরির সময় ঘন চুলের জন্য হেয়ারনেট ব্যবহার করুন; দূষিত বা নোংরা হলে বদলান। এগুলো পরার আগে হাত ভালো করে ধুন।","Pakai masker untuk menutup hidung dan mulut, dan ganti jika basah atau setelah istirahat. Gunakan penutup kepala untuk menutup rambut sepenuhnya, dan jaring rambut untuk rambut tebal saat menyiapkan pangan; ganti jika tercemar atau kotor. Cuci tangan dengan baik sebelum memakai perlengkapan ini."],["h3","الجروح والبثور","Wounds and boils","घाव और फोड़े","ক্ষত ও ফোসকা","Luka dan bisul"],["p","غطِّ الجروح والبثور بضمادات ملونة عازلة للماء أبلغ المشرف إذا سقطت ضمادة في الغذاء.","Cover cuts and boils with coloured, waterproof dressings; tell the supervisor if a dressing falls into food.","कट और फोड़ों को रंगीन, पानी-रोधी पट्टी से ढकें; पट्टी भोजन में गिरे तो पर्यवेक्षक को बताएँ।","কাটা ও ফোসকা রঙিন, জলরোধী ব্যান্ডেজে ঢাকুন; ব্যান্ডেজ খাবারে পড়লে সুপারভাইজারকে জানান।","Tutup luka dan bisul dengan plester berwarna tahan air; beri tahu supervisor jika plester jatuh ke pangan."],["h3","عند العطس والسعال","When sneezing and coughing","छींकते और खांसते समय","হাঁচি ও কাশির সময়","Saat bersin dan batuk"],["p","ابتعد عن الغذاء عند العطس أو السعال، غطِّ فمك بذراعك إذا لم تستطع الابتعاد، ثم اغسل يديك بعد العطس أو السعال.","Move away from food when sneezing or coughing; cover your mouth with your arm if you cannot move away, then wash your hands after sneezing or coughing.","छींकते या खांसते समय भोजन से दूर हटें; दूर न हो सकें तो बांह से मुंह ढकें, फिर छींक या खांसी के बाद हाथ धोएँ।","হাঁচি বা কাশির সময় খাবার থেকে দূরে সরুন; দূরে যেতে না পারলে বাহু দিয়ে মুখ ঢাকুন, তারপর হাঁচি বা কাশির পর হাত ধুন।","Menjauh dari pangan saat bersin atau batuk; tutup mulut dengan lengan jika tidak bisa menjauh, lalu cuci tangan setelah bersin atau batuk."],["h3","عدم الأكل والشرب في أماكن العمل","No eating or drinking in workplaces","कार्यस्थल पर न खाना, न पीना","কর্মস্থলে খাওয়া বা পান করা নিষেধ","Tidak makan dan minum di tempat kerja"],["p","كُل واشرب فقط في المناطق المخصصة لذلك.","Eat and drink only in the areas designated for this.","केवल इसके लिए निर्धारित क्षेत्रों में खाएँ-पीएँ।","শুধু নির্ধারিত জায়গায় খান ও পান করুন।","Makan dan minum hanya di area yang ditentukan untuk itu."],["h3","عدم التدخين","No smoking","धूम्रपान नहीं","ধূমপান নিষেধ","Tidak merokok"],["p","ممنوع التدخين في أي منطقة للتعامل مع الغذاء.","Smoking is prohibited in any food handling area.","भोजन संभालने के किसी भी क्षेत्र में धूम्रपान मना है।","খাবার নাড়াচাড়ার যেকোনো এলাকায় ধূমপান নিষিদ্ধ।","Merokok dilarang di semua area penanganan pangan."],["h3","الممارسات غير الصحية في مناطق التعامل مع الغذاء","Unhealthy practices in food handling areas","भोजन संभालने के क्षेत्रों में अस्वास्थ्यकर आदतें","খাবার নাড়াচাড়ার এলাকায় অস্বাস্থ্যকর অভ্যাস","Praktik tidak sehat di area penanganan pangan"],["p","الممارسات غير الصحية هي سلوكيات وعادات سيئة لمتداولي الغذاء يمكن أن تؤدي إلى تلوث الغذاء، تجنب هذه الأمثلة عند التواجد في مناطق التعامل مع الغذاء:","Unhealthy practices are bad habits of food handlers that can lead to food contamination. Avoid these examples when in food handling areas:","अस्वास्थ्यकर आदतें भोजन संभालने वालों की ऐसी बुरी आदतें हैं जो भोजन दूषित कर सकती हैं। भोजन क्षेत्र में इनसे बचें:","অস্বাস্থ্যকর পদ্ধতি হলো খাবার পরিচালনাকারীদের খারাপ অভ্যাস যা খাবার দূষিত করতে পারে। খাবার এলাকায় এগুলো এড়িয়ে চলুন:","Praktik tidak sehat adalah kebiasaan buruk penjamah pangan yang dapat menyebabkan kontaminasi. Hindari contoh berikut di area penanganan pangan:"],["li","استخدام أحواض غسل الأيدي لغسل الغذاء أو الأدوات.","Using hand-washing sinks to wash food or tools.","हाथ धोने के सिंक में भोजन या औज़ार धोना।","হাত ধোয়ার বেসিনে খাবার বা সরঞ্জাম ধোয়া।","Menggunakan wastafel cuci tangan untuk mencuci pangan atau peralatan."],["li","لمس الرأس، الأنف، أو لمس الجسم وتمشيط الشعر أو اللحية.","Touching the head, nose, body, or combing hair or beard.","सिर, नाक या शरीर छूना, या बाल-दाढ़ी में कंघी करना।","মাথা, নাক বা শরীর ছোঁয়া, বা চুল-দাড়ি আঁচড়ানো।","Menyentuh kepala, hidung, atau tubuh, atau menyisir rambut atau jenggot."],["li","لعق الأصابع لتذوق الغذاء أو النفخ لفتح الأكياس والعبوات.","Licking fingers to taste food, or blowing to open bags and packages.","भोजन चखने के लिए उंगलियाँ चाटना, या थैले/पैकेट खोलने के लिए फूंकना।","খাবার চাখতে আঙুল চাটা, বা ব্যাগ-প্যাকেট খুলতে ফুঁ দেওয়া।","Menjilat jari untuk mencicipi pangan, atau meniup untuk membuka kantong dan kemasan."],["li","ارتداء الكمامة بطريقة لا تغطي الأنف والفم بالكامل.","Wearing a mask in a way that does not fully cover the nose and mouth.","मास्क ऐसे पहनना कि नाक और मुंह पूरी तरह न ढकें।","নাক ও মুখ পুরোপুরি না ঢেকে মাস্ক পরা।","Memakai masker tidak menutupi hidung dan mulut sepenuhnya."],["li","وضع الملابس الخارجية في مناطق التعامل مع الغذاء.","Placing outer clothing in food handling areas.","भोजन क्षेत्र में बाहरी कपड़े रखना।","খাবার এলাকায় বাইরের পোশাক রাখা।","Meletakkan pakaian luar di area penanganan pangan."],["li","وضع الأغراض الشخصية في مناطق تحضير الغذاء.","Placing personal items in food preparation areas.","भोजन तैयार करने के क्षेत्र में निजी सामान रखना।","খাবার প্রস্তুতির এলাকায় ব্যক্তিগত জিনিস রাখা।","Meletakkan barang pribadi di area persiapan pangan."],["li","فتح حاويات النفايات باليد.","Opening waste containers by hand.","कचरे के डिब्बे हाथ से खोलना।","হাত দিয়ে আবর্জনার পাত্র খোলা।","Membuka tempat sampah dengan tangan."]]},{"t":["النظافة في منشآت الغذاء","Cleanliness in food establishments","खाद्य प्रतिष्ठानों में सफाई","খাদ্য প্রতিষ্ঠানে পরিচ্ছন্নতা","Kebersihan di usaha pangan"],"r":[["h2","أهمية التنظيف والتطهير في منشآت الغذاء","The importance of cleaning and sanitising in food establishments","खाद्य प्रतिष्ठानों में सफाई और सैनिटाइज़िंग का महत्व","খাদ্য প্রতিষ্ঠানে পরিষ্কার ও জীবাণুমুক্তকরণের গুরুত্ব","Pentingnya pembersihan dan sanitasi di usaha pangan"],["p","التنظيف والتطهير هما أساس عملنا. لنستوعب مدى أهميتهما ودورهما الكبير في ضمان سلامة الغذاء، وكيف يمكننا تطبيقهما بشكل فعال لضمان أفضل النتائج.","Cleaning and sanitising are the foundation of our work. Let us understand their importance and their major role in ensuring food safety, and how we can apply them effectively for the best results.","सफाई और सैनिटाइज़िंग हमारे काम की नींव हैं। आइए समझें कि ये कितने ज़रूरी हैं और भोजन सुरक्षा सुनिश्चित करने में इनकी बड़ी भूमिका क्या है, और इन्हें प्रभावी ढंग से कैसे लागू करें।","পরিষ্কার ও জীবাণুমুক্তকরণ আমাদের কাজের ভিত্তি। এদের গুরুত্ব ও খাদ্য নিরাপত্তা নিশ্চিত করতে এদের বড় ভূমিকা বুঝি, এবং সর্বোত্তম ফলের জন্য কীভাবে কার্যকরভাবে প্রয়োগ করব তা জানি।","Pembersihan dan sanitasi adalah dasar pekerjaan kita. Mari pahami betapa pentingnya keduanya dan peran besarnya dalam menjamin keamanan pangan, serta cara menerapkannya secara efektif untuk hasil terbaik."],["h3","ما هي أهمية التنظيف والتطهير؟","What is the importance of cleaning and sanitising?","सफाई और सैनिटाइज़िंग का महत्व क्या है?","পরিষ্কার ও জীবাণুমুক্তকরণের গুরুত্ব কী?","Apa pentingnya pembersihan dan sanitasi?"],["li","الحد من تلوث الغذاء والتسمم الغذائي.","Limiting food contamination and food poisoning.","भोजन संदूषण और फ़ूड पॉइज़निंग को सीमित करना।","খাদ্য দূষণ ও খাদ্যে বিষক্রিয়া কমানো।","Membatasi kontaminasi pangan dan keracunan pangan."],["li","توفير بيئة عمل آمنة.","Providing a safe work environment.","सुरक्षित कार्य वातावरण देना।","নিরাপদ কর্মপরিবেশ তৈরি করা।","Menyediakan lingkungan kerja yang aman."],["li","التقليل من خطر الغرامات لعدم الامتثال للوائح الغذائية.","Reducing the risk of fines for non-compliance with food regulations.","खाद्य नियमों का पालन न करने पर जुर्माने का खतरा घटाना।","খাদ্যবিধি না মানার জরিমানার ঝুঁকি কমানো।","Mengurangi risiko denda karena tidak mematuhi peraturan pangan."],["li","حماية المعدات وزيادة الأرباح.","Protecting equipment and increasing profits.","उपकरणों की सुरक्षा और मुनाफा बढ़ाना।","যন্ত্রপাতি রক্ষা ও মুনাফা বাড়ানো।","Melindungi peralatan dan meningkatkan keuntungan."],["li","جذب العملاء وتحسين صورة المنشأة.","Attracting customers and improving the establishment's image.","ग्राहकों को आकर्षित करना और प्रतिष्ठान की छवि सुधारना।","গ্রাহক আকর্ষণ ও প্রতিষ্ঠানের ভাবমূর্তি উন্নত করা।","Menarik pelanggan dan memperbaiki citra usaha."],["h3","ما هو التنظيف؟","What is cleaning?","सफाई क्या है?","পরিষ্কার কী?","Apa itu pembersihan?"],["li","إزالة بقايا الغذاء والأوساخ المرئية.","Removing food residues and visible dirt.","भोजन के अवशेष और दिखने वाली गंदगी हटाना।","খাবারের অবশিষ্টাংশ ও দৃশ্যমান ময়লা সরানো।","Menghilangkan sisa pangan dan kotoran yang terlihat."],["li","يتم باستخدام الماء الساخن والمنظفات.","It is done with hot water and detergents.","गर्म पानी और डिटर्जेंट से किया जाता है।","গরম পানি ও ডিটারজেন্ট দিয়ে করা হয়।","Dilakukan dengan air panas dan deterjen."],["h3","ما هو التطهير؟","What is sanitising?","सैनिटाइज़िंग क्या है?","জীবাণুমুক্তকরণ কী?","Apa itu sanitasi?"],["li","تقليل الحمل الميكروبي أو (عدد) الميكروبات إلى مستوى آمن أو إلى الحد المسموح به وفق المواصفات القياسية المعتمدة.","Reducing the microbial load, or number of microbes, to a safe level or to the permitted limit under approved standard specifications.","सूक्ष्मजीवों की संख्या (भार) को सुरक्षित स्तर या मान्य सीमा तक घटाना, जैसा स्वीकृत मानक में तय हो।","অণুজীবের ভার বা সংখ্যা নিরাপদ মাত্রায় বা অনুমোদিত সীমায় কমানো, স্বীকৃত মান অনুযায়ী।","Mengurangi beban atau jumlah mikroba hingga tingkat aman atau batas yang diizinkan sesuai spesifikasi standar yang ditetapkan."],["li","قتل البكتيريا والفيروسات بعد التنظيف.","Killing bacteria and viruses after cleaning.","सफाई के बाद जीवाणु और वायरस नष्ट करना।","পরিষ্কারের পর ব্যাকটেরিয়া ও ভাইরাস মারা।","Membunuh bakteri dan virus setelah pembersihan."],["li","يتم باستخدام مطهرات خاصة أو ماء ساخن جداً.","It is done with special sanitisers or very hot water.","विशेष सैनिटाइज़र या बहुत गर्म पानी से किया जाता है।","বিশেষ জীবাণুনাশক বা খুব গরম পানি দিয়ে করা হয়।","Dilakukan dengan sanitiser khusus atau air sangat panas."],["n","تذكر دائماً: التنظيف والتطهير ليسا مجرد مهام روتينية، بل هما جوهر عملنا في حماية سلامة الغذاء وصحة المستهلكين! نفهم الفرق بين التنظيف والتطهير: التنظيف يزيل الأوساخ المرئية والتطهير يقتل الميكروبات غير المرئية، نطبق كلا الإجراءين بدقة وفي الوقت المناسب.","Always remember: cleaning and sanitising are not just routine tasks; they are the core of our work in protecting food safety and consumers' health! We understand the difference: cleaning removes visible dirt, and sanitising kills invisible microbes. We apply both procedures accurately and at the right time.","हमेशा याद रखें: सफाई और सैनिटाइज़िंग केवल रोज़ के काम नहीं, भोजन सुरक्षा और उपभोक्ताओं के स्वास्थ्य की रक्षा के मूल हैं! फर्क समझें: सफाई दिखने वाली गंदगी हटाती है, और सैनिटाइज़िंग न दिखने वाले सूक्ष्मजीव मारती है। दोनों प्रक्रियाएँ सही समय पर सटीकता से करें।","সবসময় মনে রাখুন: পরিষ্কার ও জীবাণুমুক্তকরণ শুধু রুটিন কাজ নয়, খাদ্য নিরাপত্তা ও ভোক্তার স্বাস্থ্য রক্ষার মূল ভিত্তি! পার্থক্য বুঝি: পরিষ্কার দৃশ্যমান ময়লা সরায়, আর জীবাণুমুক্তকরণ অদৃশ্য অণুজীব মারে। দুটোই সঠিক সময়ে নির্ভুলভাবে করি।","Selalu ingat: pembersihan dan sanitasi bukan sekadar tugas rutin; keduanya inti pekerjaan kita dalam melindungi keamanan pangan dan kesehatan konsumen! Kita paham bedanya: pembersihan menghilangkan kotoran yang terlihat, sanitasi membunuh mikroba yang tak terlihat. Kita terapkan keduanya dengan tepat dan pada waktunya."],["h2","ماذا يجب تنظيفه وتطهيره؟","What must be cleaned and sanitised?","क्या साफ़ और सैनिटाइज़ करना चाहिए?","কী পরিষ্কার ও জীবাণুমুক্ত করতে হবে?","Apa yang harus dibersihkan dan disanitasi?"],["h3","الأسطح الملامسة للغذاء","Food-contact surfaces","भोजन के संपर्क वाली सतहें","খাবারের সংস্পর্শে আসা পৃষ্ঠ","Permukaan yang bersentuhan dengan pangan"],["li","ما هي الأمثلة؟ عربات النقل، طاولات الفحص، ميزان الوزن، الأواني، ألواح التقطيع، الطاولات، المعدات والأدوات.","What are examples? Transport trolleys, inspection tables, weighing scales, containers, cutting boards, tables, equipment and tools.","उदाहरण क्या हैं? परिवहन ट्रॉलियाँ, जांच मेज़ें, वज़न तराज़ू, बर्तन, कटिंग बोर्ड, मेज़ें, उपकरण और औज़ार।","উদাহরণ কী? পরিবহন ট্রলি, পরীক্ষার টেবিল, ওজন মাপার যন্ত্র, পাত্র, কাটার বোর্ড, টেবিল, যন্ত্র ও সরঞ্জাম।","Contohnya? Troli angkut, meja pemeriksaan, timbangan, wadah, talenan, meja, peralatan, dan perkakas."],["li","كيف نتعامل معها؟ تنظيف وتطهير بعد كل استخدام.","How do we handle them? Clean and sanitise after every use.","इन्हें कैसे संभालें? हर इस्तेमाल के बाद साफ़ और सैनिटाइज़ करें।","কীভাবে সামলাব? প্রতিটি ব্যবহারের পর পরিষ্কার ও জীবাণুমুক্ত করুন।","Bagaimana menanganinya? Bersihkan dan sanitasi setelah setiap penggunaan."],["li","لماذا؟ لأنها تمثل خطراً كبيراً للتلوث المباشر.","Why? Because they pose a major risk of direct contamination.","क्यों? क्योंकि इनसे सीधे संदूषण का बड़ा खतरा है।","কেন? কারণ এতে সরাসরি দূষণের বড় ঝুঁকি।","Mengapa? Karena menimbulkan risiko besar kontaminasi langsung."],["h3","الأسطح غير الملامسة للغذاء","Non-food-contact surfaces","भोजन के संपर्क में न आने वाली सतहें","খাবারের সংস্পর্শে না আসা পৃষ্ঠ","Permukaan yang tidak bersentuhan dengan pangan"],["li","ما هي الأمثلة؟ الجدران المحيطة، فتحات التهوية، مناطق استلام المواد الخام والأغذية، مناطق التخلص من النفايات، الحاويات الخارجية.","What are examples? Surrounding walls, ventilation openings, areas for receiving raw materials and food, waste disposal areas, external containers.","उदाहरण क्या हैं? आसपास की दीवारें, वेंटिलेशन के छेद, कच्चा माल और भोजन प्राप्त करने के क्षेत्र, कचरा निपटान क्षेत्र, बाहरी कंटेनर।","উদাহরণ কী? চারপাশের দেয়াল, বায়ু চলাচলের ছিদ্র, কাঁচামাল ও খাবার গ্রহণের জায়গা, আবর্জনা ফেলার জায়গা, বাইরের পাত্র।","Contohnya? Dinding sekitar, lubang ventilasi, area penerimaan bahan baku dan pangan, area pembuangan limbah, wadah luar."],["li","كيف نتعامل معها؟ تنظيف دوري منتظم.","How do we handle them? Regular scheduled cleaning.","इन्हें कैसे संभालें? नियमित, निर्धारित सफाई।","কীভাবে সামলাব? নিয়মিত নির্ধারিত পরিষ্কার।","Bagaimana menanganinya? Pembersihan terjadwal dan teratur."],["li","لماذا؟ لتقليل مخاطر التلوث غير المباشر.","Why? To reduce the risk of indirect contamination.","क्यों? अप्रत्यक्ष संदूषण का खतरा घटाने के लिए।","কেন? পরোক্ষ দূষণের ঝুঁকি কমাতে।","Mengapa? Untuk mengurangi risiko kontaminasi tidak langsung."],["h3","الأسطح الملامسة للأيدي","Hand-contact surfaces","हाथों के संपर्क वाली सतहें","হাতের সংস্পর্শে আসা পৃষ্ঠ","Permukaan yang bersentuhan dengan tangan"],["li","ما هي الأمثلة؟ مقابض الأبواب، مفاتيح الكهرباء، فتيات الغاز، أزرار تشغيل المعدات.","What are examples? Door handles, electrical switches, tap handles, equipment operating buttons.","उदाहरण क्या हैं? दरवाज़े के हैंडल, बिजली के स्विच, नल के हैंडल, उपकरणों के बटन।","উদাহরণ কী? দরজার হাতল, বিদ্যুতের সুইচ, কল-ট্যাপের হাতল, যন্ত্রের চালু-বন্ধের বোতাম।","Contohnya? Gagang pintu, saklar listrik, keran, tombol pengoperasian peralatan."],["li","كيف نتعامل معها؟ تنظيف وتطهير بشكل دوري.","How do we handle them? Clean and sanitise regularly.","इन्हें कैसे संभालें? नियमित रूप से साफ़ और सैनिटाइज़ करें।","কীভাবে সামলাব? নিয়মিত পরিষ্কার ও জীবাণুমুক্ত করুন।","Bagaimana menanganinya? Bersihkan dan sanitasi secara berkala."],["li","لماذا؟ لمنع انتقال البكتيريا من الأيدي للغذاء.","Why? To prevent bacteria passing from hands to food.","क्यों? हाथों से भोजन तक जीवाणु न पहुँचें इसलिए।","কেন? হাত থেকে খাবারে ব্যাকটেরিয়া যাওয়া ঠেকাতে।","Mengapa? Untuk mencegah bakteri berpindah dari tangan ke pangan."],["h3","أدوات التنظيف","Cleaning tools","सफाई के औज़ार","পরিষ্কারের সরঞ্জাম","Peralatan pembersih"],["li","ما هي الأمثلة؟ الممسحة، الفرشاة الخشنة، المكنسة، دلو التنظيف.","What are examples? Mop, scrubbing brush, broom, cleaning bucket.","उदाहरण क्या हैं? पोंछा, खुरदरा ब्रश, झाड़ू, सफाई की बाल्टी।","উদাহরণ কী? মপ, শক্ত ব্রাশ, ঝাড়ু, পরিষ্কারের বালতি।","Contohnya? Pel, sikat kasar, sapu, ember pembersih."],["li","كيف نتعامل معها؟ ننظفها ونطهرها ونجففها بعد كل استخدام.","How do we handle them? Clean, sanitise and dry them after every use.","इन्हें कैसे संभालें? हर इस्तेमाल के बाद साफ़, सैनिटाइज़ और सुखाएँ।","কীভাবে সামলাব? প্রতিটি ব্যবহারের পর পরিষ্কার, জীবাণুমুক্ত ও শুকাই।","Bagaimana menanganinya? Bersihkan, sanitasi, dan keringkan setelah setiap penggunaan."],["li","لماذا؟ لمنعها من أن تصبح مصدراً للتلوث.","Why? To stop them becoming a source of contamination.","क्यों? इन्हें संदूषण का स्रोत बनने से रोकने के लिए।","কেন? যাতে এগুলো দূষণের উৎস না হয়।","Mengapa? Agar tidak menjadi sumber kontaminasi."],["n","ماذا يعني هذا لنا؟: نميز بين أنواع الأسطح: نعرف أي الأسطح تحتاج لعناية أكثر. نركز على الأسطح الملامسة للغذاء: ننظفها ونطهرها بعد كل استخدام وقبل التعامل معها بحرص شديد، ولا نهمل الأسطح الأخرى. \"نظف حيثما كنت\" (As you Go) يشير إلى تنظيف وتطهير مناطق العمل بين المهام وحسب الحاجة، ويتضمن ذلك: مسح الانسكابات فوراً حدوثها؛ تنظيف وتطهير الأسطح بانتظام لتقليل البكتيريا إلى مستوى آمن؛ إزالة النفايات بشكل مستمر لتجنب تراكمها في مناطق تحضير الغذاء.","What this means for us: we distinguish between surface types and know which need more care. We focus on food-contact surfaces: clean and sanitise them after every use and handle them with great care, and do not neglect the other surfaces. \"Clean as you go\" means cleaning and sanitising work areas between tasks as needed. It includes: wiping spills immediately; cleaning and sanitising surfaces regularly to bring bacteria down to a safe level; removing waste continuously to avoid it piling up in food preparation areas.","हमारे लिए इसका अर्थ: हम सतहों के प्रकार पहचानते हैं और जानते हैं कि किन्हें ज़्यादा ध्यान चाहिए। हम भोजन-संपर्क सतहों पर ध्यान देते हैं: हर इस्तेमाल के बाद साफ़ और सैनिटाइज़ करते हैं, और अन्य सतहों की भी उपेक्षा नहीं करते। \"जैसे-जैसे काम करें, साफ़ करते चलें\" का मतलब है काम के बीच ज़रूरत अनुसार क्षेत्र साफ़ करना: गिरा तुरंत पोंछना; सतहों को नियमित साफ़-सैनिटाइज़ करना; और कचरा लगातार हटाना ताकि भोजन-क्षेत्र में जमा न हो।","আমাদের জন্য এর অর্থ: আমরা পৃষ্ঠের ধরন আলাদা করি এবং জানি কোনগুলোতে বেশি যত্ন লাগে। খাবার-সংস্পর্শী পৃষ্ঠে বেশি মনোযোগ দিই: প্রতিবার ব্যবহারের পর পরিষ্কার ও জীবাণুমুক্ত করি, এবং অন্যগুলোও অবহেলা করি না। \"কাজের সঙ্গে সঙ্গে পরিষ্কার\" মানে কাজের ফাঁকে দরকারমতো কর্মক্ষেত্র পরিষ্কার: ছিটকে পড়া সঙ্গে মোছা; পৃষ্ঠ নিয়মিত পরিষ্কার-জীবাণুমুক্ত করে ব্যাকটেরিয়া নিরাপদ মাত্রায় আনা; এবং আবর্জনা লাগাতার সরিয়ে খাবার-এলাকায় জমতে না দেওয়া।","Bagi kita: kita membedakan jenis permukaan dan tahu mana yang perlu perhatian lebih. Kita fokus pada permukaan yang bersentuhan dengan pangan: bersihkan dan sanitasi setelah setiap penggunaan dan tangani dengan sangat hati-hati, serta tidak mengabaikan permukaan lainnya. \"Bersihkan sambil jalan\" berarti membersihkan dan menyanitasi area kerja di sela-sela tugas sesuai kebutuhan: segera mengelap tumpahan; membersihkan dan menyanitasi permukaan secara rutin hingga bakteri turun ke tingkat aman; dan membuang sampah terus-menerus agar tidak menumpuk di area persiapan pangan."],["h2","كيف يتم التنظيف والتطهير؟","How is cleaning and sanitising carried out?","सफाई और सैनिटाइज़िंग कैसे की जाती है?","পরিষ্কার ও জীবাণুমুক্তকরণ কীভাবে করা হয়?","Bagaimana pembersihan dan sanitasi dilakukan?"],["p","لضمان تنفيذ التنظيف والتطهير بشكل سليم وفعال، هناك خطوات أساسية للوصول إلى النتائج المرجوة:","To ensure cleaning and sanitising are carried out properly and effectively, there are basic steps to reach the desired results:","सफाई और सैनिटाइज़िंग सही और प्रभावी ढंग से करने के लिए वांछित परिणाम तक पहुँचने के बुनियादी चरण हैं:","পরিষ্কার ও জীবাণুমুক্তকরণ সঠিক ও কার্যকরভাবে করতে, কাঙ্ক্ষিত ফল পেতে কিছু মৌলিক ধাপ আছে:","Untuk memastikan pembersihan dan sanitasi dilakukan dengan benar dan efektif, ada langkah dasar untuk mencapai hasil yang diinginkan:"],["h3","التنظيف الأولي","Initial cleaning","प्रारंभिक सफाई","প্রাথমিক পরিষ্কার","Pembersihan awal"],["p","إزالة بقايا الغذاء/المخلفات الظاهرة باستخدام المسح، أو الكشط، أو الشطف، أو النقع.","Removing visible food residue/waste by wiping, scraping, rinsing or soaking.","मसह कर, खुरचकर, धोकर या भिगोकर दिखने वाले भोजन अवशेष/कचरा हटाना।","মোছা, খুঁচিয়ে তোলা, ধোয়া বা ভেজানোর মাধ্যমে দৃশ্যমান খাবারের অবশিষ্টাংশ/আবর্জনা সরানো।","Menghilangkan sisa pangan/kotoran yang terlihat dengan mengelap, mengikis, membilas, atau merendam."],["h3","التنظيف الرئيسي","Main cleaning","मुख्य सफाई","মূল পরিষ্কার","Pembersihan utama"],["p","الغسيل بالماء الساخن (حوالي 50°م) والمنظفات، الكشط لإزالة بقايا الغذاء/المخلفات العالقة.","Washing with hot water (about 50°C) and detergents, scraping to remove stuck-on food residue/waste.","गर्म पानी (लगभग 50°C) और डिटर्जेंट से धोना, चिपकी भोजन-गंदगी खुरचकर हटाना।","গরম পানি (প্রায় ৫০°C) ও ডিটারজেন্ট দিয়ে ধোয়া, লেগে থাকা খাবার/আবর্জনা খুঁচিয়ে সরানো।","Mencuci dengan air hangat (sekitar 50°C) dan deterjen, mengikis untuk menghilangkan sisa pangan yang menempel."],["h3","الشطف الأولي","Initial rinse","प्रारंभिक धुलाई","প্রাথমিক ধোয়া","Bilasan awal"],["p","إزالة مخلفات الغسيل وبقايا المنظفات بالماء.","Removing washing residue and detergent remains with water.","पानी से धुलाई का मैल और डिटर्जेंट के अवशेष हटाना।","পানি দিয়ে ধোয়ার ময়লা ও ডিটারজেন্টের অবশেষ সরানো।","Membilas sisa cucian dan deterjen dengan air."],["h3","التطهير","Sanitising","सैनिटाइज़िंग","জীবাণুমুক্তকরণ","Sanitasi"],["p","استخدام المطهرات الكيميائية أو الماء الساخن جداً (82°م).","Using chemical sanitisers or very hot water (82°C).","रासायनिक सैनिटाइज़र या बहुत गर्म पानी (82°C) का इस्तेमाल।","রাসায়নিক জীবাণুনাশক বা খুব গরম পানি (৮২°C) ব্যবহার।","Menggunakan sanitiser kimia atau air sangat panas (82°C)."],["h3","الشطف النهائي (إن لزم)","Final rinse (if necessary)","अंतिम धुलाई (यदि ज़रूरी हो)","চূড়ান্ত ধোয়া (প্রয়োজনে)","Bilasan akhir (jika perlu)"],["p","إزالة بقايا المطهرات بالماء النظيف قد لا يكون ضرورياً مع بعض مواد التطهير (حسب تعليمات الاستخدام للمطهرات).","Removing sanitiser residue with clean water may not be necessary with some sanitisers (follow the sanitiser's instructions for use).","साफ़ पानी से सैनिटाइज़र के अवशेष हटाना कुछ सैनिटाइज़रों के साथ ज़रूरी नहीं हो सकता (सैनिटाइज़र के निर्देश देखें)।","পরিষ্কার পানি দিয়ে জীবাণুনাশকের অবশেষ সরানো কিছু জীবাণুনাশকের ক্ষেত্রে প্রয়োজন নাও হতে পারে (জীবাণুনাশকের ব্যবহার-নির্দেশ অনুসরণ করুন)।","Membilas sisa sanitiser dengan air bersih mungkin tidak perlu untuk sebagian sanitiser (ikuti petunjuk penggunaan sanitiser)."],["h3","التجفيف","Drying","सुखाना","শুকানো","Pengeringan"],["p","ترك الأسطح لتجف بالهواء، أو استخدام مناديل ورقية عالية الامتصاص.","Leave surfaces to air-dry, or use highly absorbent paper towels.","सतहों को हवा में सूखने दें, या बहुत सोखने वाले कागज़ के तौलिये इस्तेमाल करें।","পৃষ্ঠ বাতাসে শুকাতে দিন, অথবা অত্যন্ত শোষক কাগজের তোয়ালে ব্যবহার করুন।","Biarkan permukaan kering di udara, atau gunakan tisu kertas yang sangat menyerap."],["n","ماذا يعني هذا لنا؟: نتبع الترتيب الصحيح: نلتزم بالخطوات من التنظيف الأولي حتى التجفيف، ولا نتخطى أي خطوة مهما بدت بسيطة. نفهم أهمية كل خطوة: التنظيف الأولي يسهل عملية التنظيف الرئيسي، الشطف يمنع تفاعل الأسطح مع المنظفات. نستخدم درجات الحرارة المناسبة: نتأكد من استخدام الماء الساخن (حوالي 50°م) لتسهيل عمل المنظفات، والماء الساخن جداً (82°م) للتطهير. نهتم بالتطهير: نستخدم المطهرات بالتركيز الصحيح وتتبع تعليمات الشركة المصنعة بدقة. لا نهمل التجفيف: نتأكد من جفاف الأسطح لمنع نمو البكتيريا.","What this means for us: we follow the correct order: we keep to the steps from initial cleaning through to drying, and skip no step however simple it seems. We understand each step's importance: initial cleaning makes main cleaning easier, and rinsing stops surfaces reacting with detergents. We use the right temperatures: hot water (about 50°C) helps detergents work, and very hot water (82°C) is for sanitising. We care about sanitising: we use sanitisers at the correct concentration and follow the manufacturer's instructions exactly. We do not neglect drying: we make sure surfaces are dry to stop bacteria growing.","हमारे लिए इसका अर्थ: हम सही क्रम अपनाते हैं: प्रारंभिक सफाई से सुखाने तक हर चरण मानते हैं, कोई चरण चाहे कितना भी सरल लगे, छोड़ते नहीं। हर चरण का महत्व समझते हैं: प्रारंभिक सफाई मुख्य सफाई आसान बनाती है, और धुलाई सतह की डिटर्जेंट से प्रतिक्रिया रोकती है। सही तापमान: गर्म पानी (लगभग 50°C) डिटर्जेंट को काम करने देता है, और बहुत गर्म पानी (82°C) सैनिटाइज़िंग के लिए है। सैनिटाइज़र सही सांद्रता में और निर्माता के निर्देश के अनुसार इस्तेमाल करते हैं। सुखाने को नज़रअंदाज़ नहीं करते: सतहें सूखी रखते हैं ताकि जीवाणु न बढ़ें।","আমাদের জন্য এর অর্থ: আমরা সঠিক ক্রম মানি: প্রাথমিক পরিষ্কার থেকে শুকানো পর্যন্ত ধাপ মানি, কোনো ধাপ যত সহজই মনে হোক বাদ দিই না। প্রতিটি ধাপের গুরুত্ব বুঝি: প্রাথমিক পরিষ্কার মূল পরিষ্কার সহজ করে, এবং ধোয়া পৃষ্ঠের সঙ্গে ডিটারজেন্টের বিক্রিয়া রোধ করে। সঠিক তাপমাত্রা ব্যবহার করি: গরম পানি (প্রায় ৫০°C) ডিটারজেন্টকে কাজ করতে সাহায্য করে, এবং খুব গরম পানি (৮২°C) জীবাণুমুক্তকরণের জন্য। জীবাণুনাশক সঠিক ঘনত্বে ও প্রস্তুতকারকের নির্দেশে ব্যবহার করি। শুকানো অবহেলা করি না: ব্যাকটেরিয়া বৃদ্ধি রোধে পৃষ্ঠ শুকনো রাখি।","Bagi kita: kita mengikuti urutan yang benar: menjalankan langkah dari pembersihan awal hingga pengeringan, dan tidak melewatkan langkah apa pun meski tampak sepele. Kita memahami pentingnya setiap langkah: pembersihan awal mempermudah pembersihan utama, dan bilasan mencegah permukaan bereaksi dengan deterjen. Kita menggunakan suhu yang tepat: air hangat (sekitar 50°C) membantu deterjen bekerja, dan air sangat panas (82°C) untuk sanitasi. Kita memperhatikan sanitasi: menggunakan sanitiser dengan konsentrasi benar dan mengikuti petunjuk pabrikan dengan tepat. Kita tidak mengabaikan pengeringan: memastikan permukaan kering agar bakteri tidak tumbuh."],["h2","التنظيف والتطهير باستخدام الحوض الثلاثي","Cleaning and sanitising with the three-compartment sink","तीन-हौज़ सिंक से सफाई और सैनिटाइज़िंग","তিন-ট্যাংক সিংক দিয়ে পরিষ্কার ও জীবাণুমুক্তকরণ","Pembersihan dan sanitasi dengan bak tiga kompartemen"],["li","1 - التنظيف الأولي (حاوية نفايات): المسح، أو الكشط، أو النقع لإزالة بقايا الغذاء/المخلفات.","1 - Initial cleaning (waste container): wiping, scraping or soaking to remove food residue/waste.","1 - प्रारंभिक सफाई (कचरा पात्र): भोजन अवशेष/कचरा हटाने के लिए मसलना, खुरचना या भिगोना।","1 - প্রাথমিক পরিষ্কার (আবর্জনার পাত্র): খাবারের অবশিষ্টাংশ/আবর্জনা সরাতে মোছা, খুঁচানো বা ভেজানো।","1 - Pembersihan awal (wadah sampah): mengelap, mengikis, atau merendam untuk menghilangkan sisa pangan/kotoran."],["li","2 - التنظيف الرئيسي (الحوض الأول): الغسيل بالماء الساخن (حوالي 50°م) والمنظفات، لإزالة بقايا الغذاء العالقة.","2 - Main cleaning (first basin): washing with hot water (about 50°C) and detergent to remove stuck-on food residue.","2 - मुख्य सफाई (पहला हौज़): गर्म पानी (लगभग 50°C) और डिटर्जेंट से चिपकी भोजन-गंदगी हटाने के लिए धोना।","2 - মূল পরিষ্কার (প্রথম ট্যাংক): লেগে থাকা খাবারের অবশেষ সরাতে গরম পানি (প্রায় ৫০°C) ও ডিটারজেন্টে ধোয়া।","2 - Pembersihan utama (bak pertama): mencuci dengan air hangat (sekitar 50°C) dan deterjen untuk menghilangkan sisa pangan yang menempel."],["li","3 - الشطف (الحوض الثاني): الشطف بالماء لإزالة مخلفات الغسيل وبقايا المنظفات المذابة.","3 - Rinsing (second basin): rinsing with water to remove washing residue and dissolved detergent.","3 - धुलाई (दूसरा हौज़): पानी से धोकर धुलाई का मैल और घुला डिटर्जेंट हटाना।","3 - ধোয়া (দ্বিতীয় ট্যাংক): পানি দিয়ে ধুয়ে ময়লা ও গলে যাওয়া ডিটারজেন্ট সরানো।","3 - Pembilasan (bak kedua): membilas dengan air untuk menghilangkan sisa cucian dan deterjen yang larut."],["li","4 - التطهير (الحوض الثالث): الغمر في ماء ساخن (75°م لمدة 30 ثانية أو 82°م لمدة 10 ثوانٍ) أو استخدام مطهرات كيميائية خاصة.","4 - Sanitising (third basin): immersion in hot water (75°C for 30 seconds or 82°C for 10 seconds) or using special chemical sanitisers.","4 - सैनिटाइज़िंग (तीसरा हौज़): गर्म पानी में डुबाना (75°C पर 30 सेकंड या 82°C पर 10 सेकंड), या विशेष रासायनिक सैनिटाइज़र इस्तेमाल।","4 - জীবাণুমুক্তকরণ (তৃতীয় ট্যাংক): গরম পানিতে ডোবানো (৭৫°C-এ ৩০ সেকেন্ড বা ৮২°C-এ ১০ সেকেন্ড), অথবা বিশেষ রাসায়নিক জীবাণুনাশক ব্যবহার।","4 - Sanitasi (bak ketiga): merendam dalam air panas (75°C selama 30 detik atau 82°C selama 10 detik) atau memakai sanitiser kimia khusus."],["li","5 - التجفيف (أرفف التجفيف): الترك للتجفيف بالهواء (الأدوات مقلوبة)، أو استخدام مناديل ورقية عالية الامتصاص.","5 - Drying (drying racks): leave to air-dry (tools upside down), or use highly absorbent paper towels.","5 - सुखाना (सुखाने के रैक): हवा में सूखने दें (औज़ार उल्टे रखकर), या बहुत सोखने वाले कागज़ के तौलिये इस्तेमाल करें।","5 - শুকানো (শুকানোর র‍্যাক): বাতাসে শুকাতে দিন (যন্ত্র উল্টো করে), বা অত্যন্ত শোষক কাগজের তোয়ালে।","5 - Pengeringan (rak pengering): biarkan kering di udara (peralatan terbalik), atau gunakan tisu kertas yang sangat menyerap."],["h2","الممارسات الخاطئة للتنظيف والتطهير","Wrong cleaning and sanitising practices","सफाई और सैनिटाइज़िंग की गलत आदतें","পরিষ্কার ও জীবাণুমুক্তকরণের ভুল পদ্ধতি","Praktik salah dalam pembersihan dan sanitasi"],["li","إهمال تنظيف الأجزاء الصعبة في المعدات: يؤدي إلى تراكم الأوساخ والبكتيريا، يجب تنظيف كل أجزاء المعدات بعناية.","Neglecting to clean hard-to-reach parts of equipment: leads to build-up of dirt and bacteria; all parts of equipment must be cleaned carefully.","उपकरणों के कठिन हिस्सों की सफाई की उपेक्षा: गंदगी और जीवाणु जमा होते हैं; उपकरण के हर हिस्से को ध्यान से साफ़ करें।","যন্ত্রের কঠিন-নাগালের অংশ পরিষ্কার না করা: ময়লা ও ব্যাকটেরিয়া জমে; যন্ত্রের সব অংশ যত্ন নিয়ে পরিষ্কার করতে হবে।","Mengabaikan pembersihan bagian sulit dijangkau pada peralatan: menyebabkan penumpukan kotoran dan bakteri; semua bagian peralatan harus dibersihkan dengan hati-hati."],["li","استخدام معدات تنظيف غير سليمة: قد يسبب تلوث حيوي وكيميائي للأسطح، يترك بقايا مواد كيميائية على الأسطح.","Using unsound cleaning equipment: may cause biological and chemical contamination of surfaces, leaving chemical residues on them.","खराब सफाई उपकरण इस्तेमाल: सतहों पर जैविक और रासायनिक संदूषण कर सकते हैं, और रासायनिक अवशेष छोड़ सकते हैं।","ত্রুটিপূর্ণ পরিষ্কারের সরঞ্জাম ব্যবহার: পৃষ্ঠে জৈব ও রাসায়নিক দূষণ ঘটাতে পারে, রাসায়নিক অবশেষ রেখে যায়।","Memakai peralatan pembersih yang tidak layak: dapat menyebabkan kontaminasi biologis dan kimia pada permukaan, meninggalkan residu kimia."],["li","استخدام مواد كيميائية غير مناسبة: قد تترك بقايا على الأسطح الملامسة للغذاء، مما يمكن أن تسبب تلوث كيميائي للغذاء.","Using unsuitable chemicals: may leave residues on food-contact surfaces, which can chemically contaminate food.","अनुपयुक्त रसायन इस्तेमाल: भोजन-संपर्क सतहों पर अवशेष छोड़ सकते हैं, जिससे भोजन का रासायनिक संदूषण हो सकता है।","অনুপযুক্ত রাসায়নিক ব্যবহার: খাবারের সংস্পর্শী পৃষ্ঠে অবশেষ রেখে খাবার রাসায়নিকভাবে দূষিত করতে পারে।","Menggunakan bahan kimia yang tidak sesuai: dapat meninggalkan residu pada permukaan yang bersentuhan dengan pangan, yang bisa mencemari pangan secara kimia."],["li","سوء تخزين أدوات ومعدات التنظيف: تخزينها قرب الأواني يلوث هذه الأواني، يجب فصل معدات التنظيف عن أدوات الغذاء.","Poor storage of cleaning tools and equipment: storing them near containers contaminates those containers; cleaning equipment must be kept separate from food tools.","सफाई के औज़ार और उपकरण गलत रखना: बर्तनों के पास रखने से वे दूषित होते हैं; सफाई उपकरण भोजन के औज़ारों से अलग रखें।","পরিষ্কারের সরঞ্জাম ভুলভাবে রাখা: পাত্রের কাছে রাখলে সেগুলো দূষিত হয়; পরিষ্কারের সরঞ্জাম খাবারের সরঞ্জাম থেকে আলাদা রাখতে হবে।","Penyimpanan alat dan peralatan pembersih yang buruk: menyimpannya dekat wadah akan mencemari wadah tersebut; peralatan pembersih harus dipisahkan dari peralatan pangan."],["n","ماذا يعني هذا لنا؟ (الممارسات الخاطئة): تنظيف المعدات بعناية تامة وفحص جميع الأجزاء. استخدام معدات نظيفة وسليمة فقط عند التنظيف. تخزين معدات التنظيف بعيداً عن الغذاء. اتباع التعليمات دقيقاً عند استخدام المواد الكيميائية.","What this means for us (wrong practices): clean equipment with full care and check every part. Use only clean, sound equipment for cleaning. Store cleaning equipment away from food. Follow instructions precisely when using chemicals.","हमारे लिए इसका अर्थ (गलत आदतें): उपकरण पूरी सावधानी से साफ़ करें और हर हिस्सा जांचें। सफाई में केवल साफ़ और दुरुस्त उपकरण इस्तेमाल करें। सफाई उपकरण भोजन से दूर रखें। रसायन इस्तेमाल करते समय निर्देश सटीक मानें।","আমাদের জন্য এর অর্থ (ভুল পদ্ধতি): যন্ত্র পুরো যত্নে পরিষ্কার করি এবং প্রতিটি অংশ দেখি। পরিষ্কারে শুধু পরিষ্কার ও ভালো যন্ত্র ব্যবহার করি। পরিষ্কারের যন্ত্র খাবার থেকে দূরে রাখি। রাসায়নিক ব্যবহারে নির্দেশ হুবহু মানি।","Bagi kita (praktik salah): bersihkan peralatan dengan sangat teliti dan periksa setiap bagian. Gunakan hanya peralatan bersih dan layak untuk membersihkan. Simpan peralatan pembersih jauh dari pangan. Ikuti petunjuk dengan tepat saat memakai bahan kimia."],["h2","التخلص من النفايات","Waste disposal","कचरा निपटान","আবর্জনা অপসারণ","Pembuangan limbah"],["p","التعامل الصحيح مع النفايات أمر ضروري في منشآت الغذاء. دعنا نتعرف على أهميته وكيفية تطبيقه.","Correct waste handling is essential in food establishments. Let us learn its importance and how to apply it.","खाद्य प्रतिष्ठानों में कचरे को सही तरीके से संभालना अनिवार्य है। आइए इसका महत्व और तरीका समझें।","খাদ্য প্রতিষ্ঠানে আবর্জনার সঠিক ব্যবস্থাপনা অপরিহার্য। এর গুরুত্ব ও প্রয়োগ পদ্ধতি জানি।","Penanganan limbah yang benar sangat penting di usaha pangan. Mari pelajari pentingnya dan cara menerapkannya."],["h3","ما هي النفايات والمخلفات؟","What are waste and refuse?","कचरा और अपशिष्ट क्या हैं?","আবর্জনা ও বর্জ্য কী?","Apa itu limbah dan sampah?"],["p","بقايا الغذاء، ومواد التعبئة والتغليف المستعملة، أو أي مواد نريد التخلص منها.","Food leftovers, used packaging materials, or any materials we want to dispose of.","भोजन के बचे अवशेष, इस्तेमाल की गई पैकिंग सामग्री, या कोई भी सामग्री जिसे हम फेंकना चाहते हैं।","খাবারের অবশিষ্টাংশ, ব্যবহৃত প্যাকেজিং সামগ্রী, বা যেকোনো ফেলে দিতে চাওয়া বস্তু।","Sisa pangan, bahan kemasan bekas, atau bahan apa pun yang ingin dibuang."],["h3","لماذا النفايات خطيرة؟","Why is waste dangerous?","कचरा खतरनाक क्यों है?","আবর্জনা কেন বিপজ্জনক?","Mengapa limbah berbahaya?"],["li","مصدر للتلوث العرضي بالبكتيريا الضارة.","A source of accidental contamination with harmful bacteria.","हानिकारक जीवाणुओं से आकस्मिक संदूषण का स्रोत।","ক্ষতিকর ব্যাকটেরিয়ায় আকস্মিক দূষণের উৎস।","Sumber kontaminasi tidak sengaja dengan bakteri berbahaya."],["li","تجذب الآفات.","They attract pests.","कीटों को आकर्षित करता है।","পোকামাকড়কে আকৃষ্ট করে।","Menarik hama."],["li","تسبب التلوث الفيزيائي.","They cause physical contamination.","भौतिक संदूषण पैदा करता है।","ভৌত দূষণ ঘটায়।","Menyebabkan kontaminasi fisik."],["h3","كيف نتعامل مع النفايات داخل مناطق العمل؟","How do we handle waste inside work areas?","कार्य क्षेत्रों के भीतर कचरे को कैसे संभालें?","কর্মক্ষেত্রের ভেতরে আবর্জনা কীভাবে সামলাব?","Bagaimana menangani limbah di dalam area kerja?"],["li","وضع حاويات النفايات بعيداً عن منطقة التعامل مع الغذاء.","Place waste containers away from the food handling area.","कचरा पात्र भोजन संभालने के क्षेत्र से दूर रखें।","আবর্জনার পাত্র খাবার পরিচালনার এলাকা থেকে দূরে রাখুন।","Letakkan wadah sampah jauh dari area penanganan pangan."],["li","التأكد من أن حاويات النفايات بحالة جيدة ومغطاة.","Make sure waste containers are in good condition and covered.","सुनिश्चित करें कि कचरा पात्र अच्छी हालत में और ढके हों।","নিশ্চিত করুন আবর্জনার পাত্র ভালো অবস্থায় ও ঢাকা আছে।","Pastikan wadah sampah dalam kondisi baik dan tertutup."],["li","التخلص من النفايات سريعا في حاويات النفايات.","Dispose of waste quickly into waste containers.","कचरे को जल्दी कचरा पात्र में डालें।","দ্রুত আবর্জনার পাত্রে ফেলুন।","Buang limbah dengan cepat ke wadah sampah."],["h3","ما هي حاويات النفايات المثالية؟","What are ideal waste containers?","आदर्श कचरा पात्र कैसे होते हैं?","আদর্শ আবর্জনার পাত্র কেমন?","Seperti apa wadah sampah yang ideal?"],["li","مقاومة للتآكل.","Corrosion-resistant.","जंग-रोधी।","ক্ষয়-প্রতিরোধী।","Tahan korosi."],["li","تفتح بالقدم.","Opened by foot pedal.","पैर से खुलने वाले।","পায়ে চাপে খোলে।","Dibuka dengan kaki."],["li","مزودة بكيس بلاستيكي وغطاء محكم.","Fitted with a plastic bag and a tight lid.","प्लास्टिक थैली और कसकर बंद ढक्कन वाले।","প্লাস্টিকের ব্যাগ ও শক্ত ঢাকনাযুক্ত।","Dilengkapi kantong plastik dan tutup rapat."],["n","ماذا يعني هذا لنا؟: نضع الحاويات في الأماكن المناسبة بعيداً عن مناطق الغذاء، وفي أماكن يسهل الوصول إليها. نحافظ على نظافة حاويات النفايات: ننظفها ونطهرها بشكل دوري، ونتأكد من إغلاقها بإحكام دائماً. نتعامل مع النفايات بحذر: نفصل النفايات حسب نوعها ونتخلص منها بانتظام وبشكل آمن. نراقب امتلاء الحاويات: نفرغها قبل امتلائها تماماً، ونستبدل الأكياس البلاستيكية بانتظام. نبلغ عن أي مشاكل: نخبر المشرف عن أي حاويات تالفة.","What this means for us: we place containers in the right places, away from food areas but where they are easy to reach. We keep waste containers clean: we clean and sanitise them regularly and always make sure they are tightly closed. We handle waste carefully: we sort waste by type and dispose of it regularly and safely. We watch containers filling up: we empty them before they are completely full and replace plastic bags regularly. We report problems: we tell the supervisor about any damaged containers.","हमारे लिए इसका अर्थ: पात्र सही जगह रखते हैं, भोजन क्षेत्रों से दूर पर आसानी से पहुँच वाली जगह। कचरा पात्र साफ़ रखते हैं: नियमित साफ़ और सैनिटाइज़ करते हैं, और हमेशा कसकर बंद रखते हैं। कचरा सावधानी से संभालते हैं: प्रकार के अनुसार अलग करते हैं और नियमित व सुरक्षित तरीके से निपटाते हैं। पात्र भरने पर नज़र रखते हैं: पूरे भरने से पहले खाली करते हैं, और प्लास्टिक थैलियाँ नियमित बदलते हैं। समस्या की सूचना देते हैं: किसी भी टूटे पात्र की जानकारी पर्यवेक्षक को देते हैं।","আমাদের জন্য এর অর্থ: পাত্রগুলো খাবার এলাকা থেকে দূরে কিন্তু সহজে পৌঁছানোর জায়গায় রাখি। আবর্জনার পাত্র পরিষ্কার রাখি: নিয়মিত পরিষ্কার ও জীবাণুমুক্ত করি, এবং সবসময় শক্ত করে বন্ধ রাখি। আবর্জনা সাবধানে সামলাই: ধরন অনুযায়ী আলাদা করি এবং নিয়মিত ও নিরাপদে ফেলি। পাত্র ভরে যাচ্ছে কিনা লক্ষ্য রাখি: পুরোপুরি ভরার আগে খালি করি এবং প্লাস্টিকের ব্যাগ নিয়মিত বদলাই। সমস্যার খবর দিই: ভাঙা পাত্রের কথা সুপারভাইজারকে জানাই।","Bagi kita: kita menempatkan wadah di tempat yang tepat, jauh dari area pangan tetapi mudah dijangkau. Kita menjaga wadah sampah tetap bersih: membersihkan dan menyanitasinya secara rutin, dan selalu memastikan tertutup rapat. Kita menangani sampah dengan hati-hati: memilah sesuai jenis dan membuangnya secara teratur dan aman. Kita memantau wadah yang hampir penuh: mengosongkannya sebelum penuh dan mengganti kantong plastik secara berkala. Kita melaporkan masalah: memberi tahu supervisor tentang wadah yang rusak."],["h3","الممارسات الخاطئة للتعامل مع النفايات","Wrong waste-handling practices","कचरा संभालने की गलत आदतें","আবর্জনা পরিচালনার ভুল পদ্ধতি","Praktik salah penanganan limbah"],["li","سوء موضع حاويات النفايات: وضع الحاويات قريبة جداً من الغذاء، وترك الحاويات مكشوفة أثناء عدم الاستخدام.","Poor placement of waste containers: putting containers too close to food, and leaving containers uncovered when not in use.","कचरा पात्र गलत जगह: पात्र भोजन के बहुत पास रखना, और इस्तेमाल न होने पर खुले छोड़ना।","আবর্জনার পাত্র ভুল জায়গায়: পাত্র খাবারের খুব কাছে রাখা, এবং ব্যবহার না হলে খোলা রাখা।","Penempatan wadah sampah yang buruk: meletakkan wadah terlalu dekat pangan, dan membiarkan wadah terbuka saat tidak dipakai."],["li","ترك النفايات تتراكم: السماح بتجمع النفايات لفترات طويلة في مناطق التعامل مع الغذاء.","Letting waste pile up: allowing waste to collect for long periods in food handling areas.","कचरा जमा होने देना: भोजन संभालने के क्षेत्र में कचरे को लंबे समय तक जमा होने देना।","আবর্জনা জমতে দেওয়া: খাবার পরিচালনার এলাকায় দীর্ঘ সময় আবর্জনা জমতে দেওয়া।","Membiarkan limbah menumpuk: membiarkan limbah terkumpul lama di area penanganan pangan."],["li","التخلص غير السليم من النفايات: عدم اتباع الأساليب الصحية والسليمة في التخلص من النفايات بشكل آمن.","Improper disposal of waste: not following healthy and safe methods of disposing of waste.","कचरे का गलत निपटान: कचरा निपटाने के स्वच्छ और सुरक्षित तरीके न अपनाना।","আবর্জনার অনুপযুক্ত অপসারণ: আবর্জনা নিরাপদে ফেলার স্বাস্থ্যসম্মত পদ্ধতি না মানা।","Pembuangan limbah yang tidak benar: tidak mengikuti cara pembuangan yang sehat dan aman."],["li","استخدام حاويات غير مناسبة: استعمال حاويات بدون أغطية محكمة الغلق، ترك الحاويات مفتوحة مما يسمح بوصول الآفات.","Using unsuitable containers: using containers without tight-fitting lids, leaving containers open which lets pests in.","अनुपयुक्त पात्र: बिना कसे ढक्कन वाले पात्र इस्तेमाल करना, पात्र खुले छोड़ना जिससे कीट आते हैं।","অনুপযুক্ত পাত্র: শক্ত ঢাকনা ছাড়া পাত্র ব্যবহার, পাত্র খোলা রাখা যা পোকা ঢুকতে দেয়।","Memakai wadah yang tidak sesuai: memakai wadah tanpa tutup rapat, membiarkan wadah terbuka sehingga hama masuk."],["n","ماذا يعني هذا لنا؟ (النفايات): حاويات النفايات المغطاة بإحكام، والتخلص السريع من النفايات، والنظافة المستمرة لمكان العمل تحمي الغذاء وتمنع انتشار البكتيريا والآفات.","What this means for us (waste): tightly covered waste bins, quick waste disposal and continuous cleaning of the workplace protect food and stop bacteria and pests spreading.","हमारे लिए इसका अर्थ (कचरा): कसकर ढके कचरा पात्र, जल्दी कचरा निपटान, और कार्यस्थल की लगातार सफाई भोजन की रक्षा करते हैं और जीवाणु व कीटों का फैलाव रोकते हैं।","আমাদের জন্য এর অর্থ (আবর্জনা): শক্ত করে ঢাকা আবর্জনার পাত্র, দ্রুত আবর্জনা অপসারণ ও কর্মস্থলের নিয়মিত পরিষ্কার খাবার রক্ষা করে এবং ব্যাকটেরিয়া ও পোকামাকড় ছড়ানো বন্ধ করে।","Bagi kita (limbah): tempat sampah tertutup rapat, pembuangan limbah yang cepat, dan kebersihan tempat kerja yang terus-menerus melindungi pangan serta mencegah penyebaran bakteri dan hama."],["h2","مكافحة الآفات","Pest control","कीट नियंत्रण","পোকামাকড় দমন","Pengendalian hama"],["p","مكافحة الآفات أمر حيوي في منشآت الغذاء، حيث تنجذب الآفات لمنشآت الغذاء لتوفر الغذاء، الرطوبة، الدفء، والمأوى.","Pest control is vital in food establishments, as pests are drawn to food premises by the availability of food, moisture, warmth and shelter.","खाद्य प्रतिष्ठानों में कीट नियंत्रण बेहद ज़रूरी है, क्योंकि भोजन, नमी, गर्मी और आश्रय के कारण कीट वहाँ आकर्षित होते हैं।","খাদ্য প্রতিষ্ঠানে পোকামাকড় দমন অত্যাবশ্যক, কারণ খাবার, আর্দ্রতা, উষ্ণতা ও আশ্রয়ের কারণে পোকামাকড় সেখানে আকৃষ্ট হয়।","Pengendalian hama sangat penting di usaha pangan, karena hama tertarik oleh ketersediaan pangan, kelembapan, kehangatan, dan tempat berlindung."],["h3","ما هي الآفات الشائعة؟","What are common pests?","आम कीट कौन से हैं?","সাধারণ পোকামাকড় কী কী?","Apa saja hama yang umum?"],["li","الحشرات: الصراصير، الذباب، النمل.","Insects: cockroaches, flies, ants.","कीड़े: तिलचट्टे, मक्खियाँ, चींटियाँ।","পোকামাকড়: তেলাপোকা, মাছি, পিঁপড়া।","Serangga: kecoa, lalat, semut."],["li","القوارض: الجرذان والفئران.","Rodents: rats and mice.","कृंतक: चूहे और चुहिया।","ইঁদুর: বড় ইঁদুর ও ছোট ইঁদুর।","Hewan pengerat: tikus dan mencit."],["li","الطيور: الحمام والعصافير.","Birds: pigeons and sparrows.","पक्षी: कबूतर और गौरैया।","পাখি: কবুতর ও চড়ুই।","Burung: merpati dan pipit."],["li","حشرات المخازن: الخنافس.","Stored-product insects: beetles.","भंडारण के कीड़े: भृंग।","মজুত খাদ্যের পোকা: গুবরে পোকা।","Serangga gudang: kumbang."],["li","الحيوانات الأليفة: القطط والكلاب.","Pets: cats and dogs.","पालतू जानवर: बिल्ली और कुत्ते।","পোষা প্রাণী: বিড়াল ও কুকুর।","Hewan peliharaan: kucing dan anjing."],["h3","ما هي مخاطر الآفات؟","What are the risks of pests?","कीटों के खतरे क्या हैं?","পোকামাকড়ের ঝুঁকি কী?","Apa risiko hama?"],["li","نشر الأمراض والبكتيريا.","Spreading diseases and bacteria.","बीमारियाँ और जीवाणु फैलाना।","রোগ ও ব্যাকটেরিয়া ছড়ানো।","Menyebarkan penyakit dan bakteri."],["li","تلويث الغذاء وأسطح العمل.","Contaminating food and work surfaces.","भोजन और कार्य-सतहों को दूषित करना।","খাবার ও কর্মপৃষ্ঠ দূষিত করা।","Mencemari pangan dan permukaan kerja."],["li","إتلاف الغذاء والحاويات والإضرار بالمباني.","Destroying food and containers and damaging buildings.","भोजन और पात्र नष्ट करना और इमारतों को नुकसान पहुँचाना।","খাবার ও পাত্র নষ্ট করা এবং ভবনের ক্ষতি করা।","Merusak pangan dan wadah serta merusak bangunan."],["h3","لماذا مكافحة الآفات مهمة لنا؟","Why is pest control important to us?","कीट नियंत्रण हमारे लिए क्यों ज़रूरी है?","পোকামাকড় দমন আমাদের জন্য কেন গুরুত্বপূর্ণ?","Mengapa pengendalian hama penting bagi kita?"],["li","منع انتشار الأمراض.","Preventing the spread of disease.","बीमारी का फैलाव रोकना।","রোগ ছড়ানো রোধ।","Mencegah penyebaran penyakit."],["li","حماية مخزون الغذاء.","Protecting food stock.","खाद्य भंडार की रक्षा।","খাদ্য মজুত রক্ষা।","Melindungi persediaan pangan."],["li","توفير بيئة عمل نظيفة وآمنة.","Providing a clean and safe work environment.","स्वच्छ और सुरक्षित कार्य वातावरण देना।","পরিচ্ছন্ন ও নিরাপদ কর্মপরিবেশ দেওয়া।","Menyediakan lingkungan kerja yang bersih dan aman."],["li","تجنب شكاوى المستهلكين.","Avoiding consumer complaints.","उपभोक्ता शिकायतों से बचना।","ভোক্তার অভিযোগ এড়ানো।","Menghindari keluhan konsumen."],["li","الامتثال للأنظمة.","Compliance with regulations.","नियमों का पालन।","বিধি মেনে চলা।","Kepatuhan pada peraturan."],["n","ماذا يعني هذا لنا؟ (الآفات): مخاطر الآفات على عملنا: قد تؤدي إلى مرض كبيرة العملاء والمستهلكين، وجعل الغذاء غير صالح للاستهلاك، والتسبب بخسائر مادية لمكان العمل. مكافحة الآفات ضرورية لنا لحماية صحة عملائنا ومستهلكينا وزملائنا، والحفاظ على جودة الغذاء، وتجنب المشاكل النظامية والحفاظ على سمعة المنشأة ونعمل في مكان نظيف وصحي.","What this means for us (pests): the risks of pests to our work: they can make customers and consumers seriously ill, make food unfit to eat, and cause material losses to the workplace. Pest control is necessary for us to protect the health of our customers, consumers and colleagues, keep food quality, avoid regulatory problems, protect the establishment's reputation, and work in a clean and healthy place.","हमारे लिए इसका अर्थ (कीट): कीटों के खतरे: ग्राहकों और उपभोक्ताओं को गंभीर बीमार कर सकते हैं, भोजन खाने लायक नहीं रहता, और कार्यस्थल को आर्थिक नुकसान होता है। कीट नियंत्रण हमारे ग्राहकों, उपभोक्ताओं और साथियों के स्वास्थ्य, भोजन की गुणवत्ता, नियामक समस्याओं से बचने, प्रतिष्ठान की साख और स्वच्छ व स्वस्थ कार्य वातावरण के लिए ज़रूरी है।","আমাদের জন্য এর অর্থ (পোকামাকড়): কাজে পোকামাকড়ের ঝুঁকি: গ্রাহক ও ভোক্তাকে গুরুতর অসুস্থ করতে পারে, খাবার খাওয়ার অযোগ্য করতে পারে, এবং কর্মস্থলের বস্তুগত ক্ষতি ঘটাতে পারে। গ্রাহক, ভোক্তা ও সহকর্মীদের স্বাস্থ্য, খাবারের মান, বিধিগত সমস্যা এড়ানো, প্রতিষ্ঠানের সুনাম রক্ষা এবং পরিচ্ছন্ন-স্বাস্থ্যকর কর্মস্থলের জন্য পোকামাকড় দমন জরুরি।","Bagi kita (hama): risiko hama bagi pekerjaan kita: dapat membuat pelanggan dan konsumen sakit parah, membuat pangan tidak layak dimakan, dan menyebabkan kerugian materi di tempat kerja. Pengendalian hama diperlukan untuk melindungi kesehatan pelanggan, konsumen, dan rekan kerja, menjaga mutu pangan, menghindari masalah regulasi, melindungi reputasi usaha, serta bekerja di tempat yang bersih dan sehat."],["h3","علامات تفشي الإصابة بالآفات في منشآت الغذاء","Signs of a pest infestation in food establishments","खाद्य प्रतिष्ठानों में कीट संक्रमण के लक्षण","খাদ্য প্রতিষ্ঠানে পোকামাকড় আক্রমণের লক্ষণ","Tanda-tanda infestasi hama di usaha pangan"],["li","يرقات أو شرانق: وجود أطوار غير بالغة من الحشرات في الزوايا أو الشقوق.","Larvae or cocoons: presence of immature insect stages in corners or cracks.","लार्वा या कोकून: कोनों या दरारों में कीटों की अपरिपक्व अवस्थाएँ।","লার্ভা বা কোকুন: কোণ বা ফাটলে অপরিণত পোকার অবস্থা।","Larva atau kepompong: keberadaan tahap serangga belum dewasa di sudut atau celah."],["li","الأجسام الميتة: العثور على حشرات أو قوارض ميتة في المنشأة.","Dead bodies: finding dead insects or rodents on the premises.","मृत शरीर: परिसर में मरे कीड़े या कृंतक मिलना।","মৃত দেহ: প্রাঙ্গণে মৃত পোকা বা ইঁদুর পাওয়া।","Bangkai: menemukan serangga atau hewan pengerat mati di area usaha."],["li","فضلات الآفات: وجود بقع صغيرة داكنة أو كريات في الزوايا أو على الأرفف.","Pest droppings: small dark spots or pellets in corners or on shelves.","कीटों की बीट: कोनों या शेल्फ़ पर छोटे गहरे धब्बे या गोलियाँ।","পোকার বিষ্ঠা: কোণ বা তাকে ছোট গাঢ় দাগ বা গুটি।","Kotoran hama: bintik gelap kecil atau butiran di sudut atau rak."],["li","الآفات النشطة: رؤية الحشرات أو القوارض تتحرك في المنشأة.","Active pests: seeing insects or rodents moving around the premises.","सक्रिय कीट: परिसर में कीड़े या कृंतक चलते दिखना।","সক্রিয় পোকামাকড়: প্রাঙ্গণে পোকা বা ইঁদুর চলাফেরা করতে দেখা।","Hama aktif: melihat serangga atau hewan pengerat bergerak di area usaha."],["li","رائحة غير عادية: وجود روائح كريهة أو غريبة في المنشأة.","Unusual smell: unpleasant or strange odours in the premises.","असामान्य गंध: परिसर में बदबू या अजीब गंध।","অস্বাভাবিক গন্ধ: প্রাঙ্গণে বিশ্রী বা অদ্ভুত গন্ধ।","Bau tidak biasa: bau tidak sedap atau aneh di area usaha."],["li","أصوات خدش: سماع أصوات حركة أو قضم، خاصة في الليل.","Scratching sounds: hearing movement or gnawing sounds, especially at night.","खरोंचने की आवाज़: खासकर रात में चलने या कुतरने की आवाज़ सुनना।","আঁচড়ানোর শব্দ: বিশেষ করে রাতে চলাফেরা বা কাটার শব্দ শোনা।","Suara garukan: mendengar gerakan atau suara mengerat, terutama di malam hari."],["li","آثار الشحوم: بقع داكنة على الجدران أو الأرضيات ناتجة عن حركة القوارض.","Grease marks: dark stains on walls or floors caused by rodent movement.","चिकनाई के निशान: दीवारों या फ़र्श पर गहरे धब्बे, कृंतकों की आवाजाही से।","চর্বির দাগ: দেয়াল বা মেঝেতে ইঁদুরের চলাচলে গাঢ় দাগ।","Bekas minyak: noda gelap di dinding atau lantai akibat pergerakan hewan pengerat."],["li","علامات قضم أو تلف: وجود ثقوب أو تمزقات في العبوات والصناديق.","Gnawing or damage marks: holes or tears in packaging and boxes.","कुतरने या क्षति के निशान: पैकेट और डिब्बों में छेद या फटन।","কাটার বা ক্ষতির চিহ্ন: প্যাকেট ও বাক্সে ছিদ্র বা ছেঁড়া।","Tanda gigitan atau kerusakan: lubang atau sobekan pada kemasan dan kotak."],["h3","ممارسات خاطئة تسهل انتشار الآفات في منشآت الغذاء","Wrong practices that help pests spread in food establishments","गलत आदतें जो कीटों का फैलाव आसान करती हैं","খাদ্য প্রতিষ্ঠানে যেসব ভুল অভ্যাসে পোকামাকড় ছড়ায়","Praktik salah yang memudahkan penyebaran hama di usaha pangan"],["p","هناك ممارسات خاطئة تخلق بيئة مثالية لجذب الآفات وانتشارها في منشآت الغذاء. مثل السماح لها بدخول المنشأ، وإهمال النظافة، وسوء إدارة النفايات، وعدم صيانة المبنى بشكل صحيح، كلها عوامل تسهم في خلق ملاذ آمن للآفات وتعرض سلامة الغذاء للخطر.","There are wrong practices that create an ideal environment that attracts pests and lets them spread in food establishments: letting them in, neglecting cleanliness, poor waste management, and not maintaining the building properly. All these create a safe refuge for pests and put food safety at risk.","कुछ गलत आदतें कीटों के लिए आदर्श माहौल बनाती हैं और उन्हें खाद्य प्रतिष्ठानों में फैलने देती हैं: उन्हें अंदर आने देना, सफाई की उपेक्षा, कचरा प्रबंधन में कमी, और इमारत का ठीक रखरखाव न करना। ये सब कीटों को सुरक्षित ठिकाना देते हैं और भोजन की सुरक्षा खतरे में डालते हैं।","কিছু ভুল অভ্যাস পোকামাকড়ের জন্য আদর্শ পরিবেশ তৈরি করে এবং খাদ্য প্রতিষ্ঠানে তাদের ছড়াতে দেয়: তাদের ঢুকতে দেওয়া, পরিচ্ছন্নতা অবহেলা, আবর্জনা ব্যবস্থাপনার অভাব, ভবন ঠিকমতো রক্ষণাবেক্ষণ না করা। এসব পোকামাকড়ের নিরাপদ আশ্রয় তৈরি করে এবং খাদ্য নিরাপত্তা বিপন্ন করে।","Ada praktik salah yang menciptakan lingkungan ideal bagi hama untuk tertarik dan menyebar di usaha pangan: membiarkan mereka masuk, mengabaikan kebersihan, pengelolaan limbah yang buruk, dan tidak merawat bangunan dengan baik. Semua ini menciptakan tempat berlindung aman bagi hama dan membahayakan keamanan pangan."],["li","تخزين المواد الغذائية مباشرة على الأرض.","Storing food directly on the floor.","भोजन सीधे फ़र्श पर रखना।","খাবার সরাসরি মেঝেতে রাখা।","Menyimpan pangan langsung di lantai."],["li","عدم فحص المنتجات الغذائية للتأكد من خلوها من الآفات.","Not inspecting food products to confirm they are free of pests.","यह जांचे बिना भोजन रखना कि उसमें कीट नहीं हैं।","খাদ্যপণ্যে পোকামাকড় নেই তা যাচাই না করা।","Tidak memeriksa produk pangan untuk memastikan bebas hama."],["li","عدم الحفاظ على ترتيب ونظافة أماكن العمل.","Not keeping work areas tidy and clean.","कार्यस्थल का क्रम और सफाई न रखना।","কর্মস্থল গোছানো ও পরিষ্কার না রাখা।","Tidak menjaga kerapian dan kebersihan tempat kerja."],["li","ترك الأبواب والنوافذ مفتوحة.","Leaving doors and windows open.","दरवाज़े और खिड़कियाँ खुली छोड़ना।","দরজা ও জানালা খোলা রাখা।","Membiarkan pintu dan jendela terbuka."],["li","عدم الإبلاغ عن العيوب في الجدران أو الأرضيات، أو السقف.","Not reporting defects in walls, floors or ceiling.","दीवारों, फ़र्श या छत की खामियों की सूचना न देना।","দেয়াল, মেঝে বা ছাদের ত্রুটির খবর না দেওয়া।","Tidak melaporkan kerusakan pada dinding, lantai, atau langit-langit."],["li","عدم تثبيت أو استبدال أغطية الصرف عند الضرورة.","Not fixing or replacing drain covers when necessary.","ज़रूरत पड़ने पर नाली के ढक्कन ठीक या बदलना नहीं।","প্রয়োজনে ড্রেনের ঢাকনা ঠিক বা বদলানো না।","Tidak memasang atau mengganti tutup saluran bila diperlukan."],["li","ترك النفايات في حاويات مكشوفة أو تمزقات، ويجب التخلص منها بسرعة.","Leaving waste in open or torn containers; it must be disposed of quickly.","खुले या फटे पात्रों में कचरा छोड़ना; उसे जल्दी निपटाना चाहिए।","খোলা বা ছেঁড়া পাত্রে আবর্জনা ফেলে রাখা; দ্রুত সরাতে হবে।","Membiarkan limbah dalam wadah terbuka atau robek; harus segera dibuang."],["n","تذكر دائماً: في حال لاحظت علامات وجود آفات في المنشأة، فلا تحاول مكافحتها بنفسك إذا كانت كثيرة. أبلغ المشرف فوراً. كل ملاحظة صغيرة تساعد على حماية الغذاء وصحة الناس.","Always remember: if you notice signs of pests on the premises, do not try to control a large infestation yourself. Report it to the supervisor immediately. Every small observation helps protect food and people's health.","हमेशा याद रखें: परिसर में कीटों के लक्षण दिखें तो बड़े संक्रमण को खुद काबू करने की कोशिश न करें। तुरंत पर्यवेक्षक को बताएँ। हर छोटी जानकारी भोजन और लोगों के स्वास्थ्य की रक्षा में मदद करती है।","সবসময় মনে রাখুন: প্রাঙ্গণে পোকামাকড়ের লক্ষণ দেখলে বড় আক্রমণ নিজে দমন করার চেষ্টা করবেন না। অবিলম্বে সুপারভাইজারকে জানান। প্রতিটি ছোট খেয়াল খাবার ও মানুষের স্বাস্থ্য রক্ষায় সাহায্য করে।","Selalu ingat: jika melihat tanda hama di area usaha, jangan mencoba mengendalikan infestasi besar sendiri. Segera laporkan kepada supervisor. Setiap pengamatan kecil membantu melindungi pangan dan kesehatan masyarakat."],["h2","الاشتراطات العامة لمنشآت الغذاء","General requirements for food establishments","खाद्य प्रतिष्ठानों की सामान्य शर्तें","খাদ্য প্রতিষ্ঠানের সাধারণ শর্তাবলি","Persyaratan umum usaha pangan"],["h3","أهمية الاشتراطات العامة في منشآت الغذاء","Importance of general requirements in food establishments","खाद्य प्रतिष्ठानों में सामान्य शर्तों का महत्व","খাদ্য প্রতিষ্ঠানে সাধারণ শর্তাবলির গুরুত্ব","Pentingnya persyaratan umum di usaha pangan"],["p","هي مجموعة المتطلبات التي وضعتها وزارة البلديات والإسكان والتي يجب توفرها لضمان تشغيل منشآت الغذاء بسلامة.","These are the requirements set by the Ministry of Municipalities and Housing that must be met to ensure food establishments operate safely.","ये वे आवश्यकताएँ हैं जो नगरपालिका एवं आवास मंत्रालय ने तय की हैं और जिन्हें भोजन प्रतिष्ठानों के सुरक्षित संचालन के लिए पूरा करना ज़रूरी है।","এগুলো পৌর ও আবাসন মন্ত্রণালয়ের নির্ধারিত শর্ত, যা খাদ্য প্রতিষ্ঠান নিরাপদে চালানোর জন্য অবশ্যই পূরণ করতে হবে।","Ini adalah persyaratan yang ditetapkan oleh Kementerian Kota dan Perumahan yang harus dipenuhi untuk memastikan usaha pangan beroperasi dengan aman."],["p","يمكنك الاطلاع عليها ضمن موقع وزارة البلديات والإسكان ضمن الأنظمة واللوائح الوزارية. كما تتضمن اللائحة الفنية السعودية الخليجية SFDA.FD/GSO21 الاشتراطات الصحية لمصانع الغذية والعاملين بها.","You can view them on the Ministry of Municipalities and Housing website under its regulations. The Saudi-GCC technical regulation SFDA.FD/GSO21 also contains the health requirements for food factories and their workers.","आप इन्हें नगरपालिका एवं आवास मंत्रालय की वेबसाइट पर मंत्रालय के नियमों में देख सकते हैं। सऊदी-GCC तकनीकी नियम SFDA.FD/GSO21 में खाद्य कारखानों और उनके कर्मचारियों की स्वास्थ्य आवश्यकताएँ भी हैं।","আপনি পৌর ও আবাসন মন্ত্রণালয়ের ওয়েবসাইটে মন্ত্রণালয়ের বিধি-প্রবিধানের অধীনে এগুলো দেখতে পারেন। সৌদি-জিসিসি কারিগরি বিধি SFDA.FD/GSO21-এ খাদ্য কারখানা ও সেখানকার কর্মীদের স্বাস্থ্য শর্তও রয়েছে।","Anda dapat melihatnya di situs Kementerian Kota dan Perumahan pada bagian peraturan. Regulasi teknis Saudi-GCC SFDA.FD/GSO21 juga memuat persyaratan kesehatan bagi pabrik pangan dan pekerjanya."],["p","تشمل هذه المتطلبات تصميم المباني، جودة الموقع المناسب، وتوفير المرافق الضرورية للتحكم في المخاطر داخل المنشأة.","These requirements cover building design, the suitability of the site, and providing the facilities needed to control hazards inside the establishment.","इन आवश्यकताओं में भवन का डिज़ाइन, उपयुक्त स्थान की गुणवत्ता, और प्रतिष्ठान के भीतर खतरों पर नियंत्रण के लिए ज़रूरी सुविधाएँ शामिल हैं।","এই শর্তে ভবনের নকশা, উপযুক্ত স্থানের মান, এবং প্রতিষ্ঠানের ভেতরে ঝুঁকি নিয়ন্ত্রণের প্রয়োজনীয় সুবিধা অন্তর্ভুক্ত।","Persyaratan ini mencakup desain bangunan, kualitas lokasi yang sesuai, dan penyediaan fasilitas yang diperlukan untuk mengendalikan bahaya di dalam usaha."],["p","رغم أننا لسنا مسؤولين عن تصميم المباني، إلا أن فهمنا لهذه الاشتراطات يساعدنا على العمل بشكل أفضل وأكثر أماناً.","Although we are not responsible for designing buildings, understanding these requirements helps us work better and more safely.","यद्यपि हम भवन डिज़ाइन के ज़िम्मेदार नहीं, फिर भी इन आवश्यकताओं को समझने से हम बेहतर और सुरक्षित काम कर सकते हैं।","যদিও ভবন নকশার দায়িত্ব আমাদের নয়, এই শর্তগুলো বোঝা আমাদের আরও ভালো ও নিরাপদে কাজ করতে সাহায্য করে।","Meskipun kita tidak bertanggung jawab atas desain bangunan, memahami persyaratan ini membantu kita bekerja lebih baik dan lebih aman."],["h3","لماذا هذه الاشتراطات مهمة لنا؟","Why are these requirements important to us?","ये आवश्यकताएँ हमारे लिए क्यों ज़रूरी हैं?","এই শর্তগুলো আমাদের জন্য কেন গুরুত্বপূর্ণ?","Mengapa persyaratan ini penting bagi kita?"],["li","الالتزام بهذه الاشتراطات يؤمن منع التلوث بأنواعه (الميكروبي، الفيزيائي، والكيميائي).","Following these requirements ensures prevention of all types of contamination (microbiological, physical and chemical).","इन आवश्यकताओं का पालन सभी प्रकार के संदूषण (सूक्ष्मजैविक, भौतिक और रासायनिक) को रोकता है।","এই শর্ত মানলে সব ধরনের দূষণ (অণুজীবীয়, ভৌত ও রাসায়নিক) রোধ নিশ্চিত হয়।","Mematuhi persyaratan ini memastikan pencegahan semua jenis kontaminasi (mikrobiologis, fisik, dan kimia)."],["li","تساعدنا على إنتاج غذاء آمن للعملاء والمستهلكين.","They help us produce food that is safe for customers and consumers.","ये ग्राहकों और उपभोक्ताओं के लिए सुरक्षित भोजन बनाने में मदद करती हैं।","এগুলো গ্রাহক ও ভোক্তাদের জন্য নিরাপদ খাবার উৎপাদনে সাহায্য করে।","Membantu kita memproduksi pangan yang aman bagi pelanggan dan konsumen."],["li","تساعد في منع انتشار الآفات والأمراض.","They help prevent the spread of pests and diseases.","ये कीटों और बीमारियों का फैलाव रोकने में मदद करती हैं।","এগুলো পোকামাকড় ও রোগ ছড়ানো রোধে সাহায্য করে।","Membantu mencegah penyebaran hama dan penyakit."],["li","تجعل عملنا أسهل وأكثر كفاءة.","They make our work easier and more efficient.","ये हमारा काम आसान और अधिक कुशल बनाती हैं।","এগুলো আমাদের কাজ সহজ ও আরও দক্ষ করে।","Membuat pekerjaan kita lebih mudah dan efisien."],["li","تحمي صحتنا وسلامتنا في مكان العمل.","They protect our health and safety at work.","ये कार्यस्थल पर हमारे स्वास्थ्य और सुरक्षा की रक्षा करती हैं।","এগুলো কর্মস্থলে আমাদের স্বাস্থ্য ও নিরাপত্তা রক্ষা করে।","Melindungi kesehatan dan keselamatan kita di tempat kerja."],["h3","ماذا يجب أن نعرف عن الاشتراطات العامة؟","What should we know about the general requirements?","सामान्य शर्तों के बारे में हमें क्या जानना चाहिए?","সাধারণ শর্তাবলি সম্পর্কে আমাদের কী জানা উচিত?","Apa yang perlu kita ketahui tentang persyaratan umum?"],["h3","تصميم المنشأة","Facility design","प्रतिष्ठान का डिज़ाइन","প্রতিষ্ঠানের নকশা","Desain fasilitas"],["li","يسهل سير العمل من استلام المواد الأولية إلى تقديم الغذاء.","The workflow from receiving raw materials to serving food should be easy.","कच्चे माल की प्राप्ति से भोजन परोसने तक कार्यप्रवाह आसान होना चाहिए।","কাঁচামাল গ্রহণ থেকে খাবার পরিবেশন পর্যন্ত কাজের প্রবাহ সহজ হওয়া উচিত।","Alur kerja dari penerimaan bahan baku hingga penyajian pangan harus mudah."],["li","يفصل بين المناطق النظيفة وغير النظيفة لضمان عدم انتقال التلوث.","Clean and unclean areas must be separated to prevent contamination from spreading.","संदूषण फैलने से रोकने के लिए साफ़ और गंदे क्षेत्र अलग होने चाहिए।","দূষণ ছড়ানো রোধে পরিষ্কার ও অপরিষ্কার এলাকা আলাদা থাকতে হবে।","Area bersih dan kotor harus dipisahkan agar kontaminasi tidak menyebar."],["h3","الأسطح والأدوات/المعدات","Surfaces, tools and equipment","सतहें, औज़ार और उपकरण","পৃষ্ঠ, সরঞ্জাম ও যন্ত্র","Permukaan, perkakas, dan peralatan"],["li","الأرضيات والجدران والأسقف يجب أن تكون مقاومة للماء وسهلة التنظيف.","Floors, walls and ceilings must be water-resistant and easy to clean.","फ़र्श, दीवारें और छत पानी-रोधी और साफ़ करने में आसान होने चाहिए।","মেঝে, দেয়াল ও ছাদ জলরোধী ও পরিষ্কার করা সহজ হতে হবে।","Lantai, dinding, dan langit-langit harus tahan air dan mudah dibersihkan."],["li","الأدوات والمعدات يجب أن تكون مصنوعة من مواد آمنة وسهلة التنظيف.","Tools and equipment must be made from safe, easy-to-clean materials.","औज़ार और उपकरण सुरक्षित, साफ़ करने में आसान सामग्री से बने होने चाहिए।","সরঞ্জাম ও যন্ত্র নিরাপদ ও সহজে পরিষ্কারযোগ্য উপাদানে তৈরি হতে হবে।","Perkakas dan peralatan harus terbuat dari bahan aman dan mudah dibersihkan."],["h3","التهوية والإضاءة","Ventilation and lighting","वेंटिलेशन और रोशनी","বায়ু চলাচল ও আলো","Ventilasi dan pencahayaan"],["li","تهوية جيدة تمنع تراكم الروائح والحرارة.","Good ventilation prevents the build-up of odours and heat.","अच्छा वेंटिलेशन गंध और गर्मी जमा होने से रोकता है।","ভালো বায়ু চলাচল গন্ধ ও তাপ জমা রোধ করে।","Ventilasi yang baik mencegah penumpukan bau dan panas."],["li","إضاءة كافية تجعلنا نرى الغذاء بشكل جيد أثناء العمل.","Enough light so we can see the food clearly while working.","पर्याप्त रोशनी ताकि काम के दौरान भोजन अच्छी तरह दिखे।","পর্যাপ্ত আলো যাতে কাজের সময় খাবার ভালো দেখা যায়।","Cahaya yang cukup agar kita dapat melihat pangan dengan jelas saat bekerja."],["h3","مرافق غسل اليدين والمعدات","Handwashing and equipment-washing facilities","हाथ और उपकरण धोने की सुविधाएँ","হাত ও যন্ত্র ধোয়ার সুবিধা","Fasilitas cuci tangan dan peralatan"],["li","توفر أحواض لغسل اليدين مع الماء الدافئ والصابون.","Handwashing sinks with warm water and soap are provided.","गुनगुने पानी और साबुन के साथ हाथ धोने के सिंक उपलब्ध हों।","গরম পানি ও সাবানসহ হাত ধোয়ার বেসিন থাকবে।","Tersedia wastafel cuci tangan dengan air hangat d
