sihan pribadi dimulai sebelum Anda tiba di tempat kerja.", "व्यक्तिगत सरसफाइ काममा आइपुग्नु अघिदेखि नै सुरु हुन्छ।"], ["h3", "في المنزل", "At home", "घर पर", "বাড়িতে", "Di rumah", "घरमा"], ["p", "بالاستحمام اليومي، غسل الشعر (واللحية) بانتظام، تنظيف الأسنان بشكل متكرر، الحفاظ على الأظافر قصيرة ونظيفة، وارتداء ملابس نظيفة كل يوم.", "Daily bathing, washing hair (and beard) regularly, brushing teeth frequently, keeping nails short and clean, and wearing clean clothes every day.", "रोज़ नहाना, बाल (और दाढ़ी) नियमित धोना, बार-बार दांत साफ़ करना, नाखून छोटे और साफ़ रखना, और हर दिन साफ़ कपड़े पहनना।", "প্রতিদিন গোসল, নিয়মিত চুল (ও দাড়ি) ধোয়া, ঘন ঘন দাঁত ব্রাশ, নখ ছোট ও পরিষ্কার রাখা, এবং প্রতিদিন পরিষ্কার পোশাক পরা।", "Mandi setiap hari, mencuci rambut (dan jenggot) secara teratur, menyikat gigi sering, menjaga kuku pendek dan bersih, serta memakai pakaian bersih setiap hari.", "दैनिक नुहाउने, नियमित रूपमा कपाल (र दाह्री) धुने, बारम्बार दाँत माझ्ने, नङ छोटो र सफा राख्ने, र हरेक दिन सफा लुगा लगाउने।"], ["h3", "قبل الذهاب للعمل", "Before going to work", "काम पर जाने से पहले", "কাজে যাওয়ার আগে", "Sebelum pergi bekerja", "काममा जानु अघि"], ["li", "عدم الذهاب للعمل إذا كنت تعاني من أعراض مثل: الحمى، الإسهال، التهاب الحلق المتقيؤ، أو صفار اليرقان (اصفرار الجلد والعينين).", "Do not go to work if you have symptoms such as fever, diarrhoea, sore throat with vomiting, or jaundice (yellowing of skin and eyes).", "यदि आपको बुखार, दस्त, उल्टी के साथ गले में खराश या पीलिया (त्वचा और आंखों का पीला होना) जैसे लक्षण हों तो काम पर न जाएँ।", "জ্বর, ডায়রিয়া, বমিসহ গলাব্যথা, বা জন্ডিস (ত্বক ও চোখ হলুদ হওয়া) এর মতো লক্ষণ থাকলে কাজে যাবেন না।", "Jangan bekerja jika mengalami gejala seperti demam, diare, sakit tenggorokan disertai muntah, atau kuning (ikterus) pada kulit dan mata.", "ज्वरो, पखाला, वाकवाकीसहित घाँटी दुखाइ, वा कमलपित्त (छाला र आँखा पहेँलो हुनु) जस्ता लक्षण भए काममा नजानुहोस्।"], ["li", "أبلغ المشرف وراجع الطبيب إذا شعرت بهذه الأعراض.", "Tell your supervisor and see a doctor if you feel these symptoms.", "इन लक्षणों पर पर्यवेक्षक को बताएँ और डॉक्टर को दिखाएँ।", "এসব লক্ষণ দেখলে সুপারভাইজারকে জানান এবং ডাক্তার দেখান।", "Beri tahu supervisor dan periksakan ke dokter jika merasakan gejala ini.", "यस्ता लक्षण महसुस गर्नुभयो भने सुपरवाइजरलाई भन्नुहोस् र डाक्टरलाई देखाउनुहोस्।"], ["h3", "قبل بدء العمل", "Before starting work", "काम शुरू करने से पहले", "কাজ শুরুর আগে", "Sebelum mulai bekerja", "काम सुरु गर्नु अघि"], ["li", "اخلع الساعة والحلي.", "Remove your watch and jewellery.", "घड़ी और गहने उतारें।", "ঘড়ি ও গয়না খুলে ফেলুন।", "Lepaskan jam tangan dan perhiasan.", "घडी र गहना खोल्नुहोस्।"], ["li", "ارتد ملابس العمل في المكان المخصص.", "Put on work clothes in the designated place.", "कार्य वस्त्र निर्धारित स्थान पर पहनें।", "নির্ধারিত জায়গায় কাজের পোশাক পরুন।", "Kenakan pakaian kerja di tempat yang ditentukan.", "तोकिएको ठाउँमा काम गर्ने लुगा लगाउनुहोस्।"], ["li", "اغسل يديك قبل لمس أي شيء في منطقة العمل.", "Wash your hands before touching anything in the work area.", "काम के क्षेत्र में कुछ भी छूने से पहले हाथ धोएँ।", "কাজের এলাকায় কিছু স্পর্শ করার আগে হাত ধুন।", "Cuci tangan sebelum menyentuh apa pun di area kerja.", "कामको क्षेत्रमा केही छुनु अघि हात धुनुहोस्।"], ["h3", "الملابس المناسبة لمتداولي الغذاء", "Suitable clothing for food handlers", "भोजन संभालने वालों के लिए उपयुक्त कपड़े", "খাবার পরিচালনাকারীদের উপযুক্ত পোশাক", "Pakaian yang sesuai bagi penjamah pangan", "खाना ह्यान्डलरका लागि उपयुक्त पोशाक"], ["p", "ارتداء الملابس المناسبة أمر مهم جداً في العمل في مجال الغذاء.", "Wearing suitable clothing is very important when working in food.", "खाद्य क्षेत्र में काम करते समय उपयुक्त कपड़े पहनना बहुत ज़रूरी है।", "খাদ্য খাতে কাজের সময় উপযুক্ত পোশাক পরা খুবই গুরুত্বপূর্ণ।", "Mengenakan pakaian yang sesuai sangat penting saat bekerja di bidang pangan.", "खानामा काम गर्दा उपयुक्त पोशाक लगाउनु धेरै महत्त्वपूर्ण छ।"], ["li", "الملابس النظيفة: ارتداء ملابس نظيفة كل يوم. الملابس يجب أن تكون: قابلة للغسل، ذات ألوان فاتحة، بها عدد قليل من الجيوب، في حالة جيدة، تغطي معظم ملابسك الخارجية.", "Clean clothing: wear clean clothes every day. Clothing should be: washable, light coloured, with few pockets, in good condition, and cover most of your outer clothes.", "साफ़ कपड़े: हर दिन साफ़ कपड़े पहनें। कपड़े ऐसे हों: धोने योग्य, हल्के रंग के, कम जेबों वाले, अच्छी हालत में, और बाहरी कपड़ों को अधिकतर ढकने वाले।", "পরিষ্কার পোশাক: প্রতিদিন পরিষ্কার পোশাক পরুন। পোশাক হতে হবে: ধোয়ার উপযোগী, হালকা রঙের, কম পকেটযুক্ত, ভালো অবস্থায়, এবং বাইরের পোশাক বেশিরভাগ ঢাকে এমন।", "Pakaian bersih: kenakan pakaian bersih setiap hari. Pakaian harus: dapat dicuci, berwarna terang, sedikit kantongnya, dalam kondisi baik, dan menutupi sebagian besar pakaian luar.", "सफा लुगा: हरेक दिन सफा लुगा लगाउनुहोस्। लुगा धुन मिल्ने, हल्का रंगको, थोरै खल्ती भएको, राम्रो अवस्थाको, र बाहिरका लुगालाई अधिकांश ढाक्ने हुनुपर्छ।"], ["h3", "تغطية الرأس", "Head covering", "सिर ढकना", "মাথার আবরণ", "Penutup kepala", "टाउको ढाक्ने कपडा"], ["li", "تغطّي الرأس واللحية عند إعداد الغذاء أو الدخول في مناطق إعداده أو تخزينه.", "Cover the head and beard when preparing food or entering food preparation or storage areas.", "भोजन तैयार करते समय या उसके तैयारी/भंडारण क्षेत्र में जाते समय सिर और दाढ़ी ढकें।", "খাবার প্রস্তুত করার সময় বা প্রস্তুতি/সংরক্ষণ এলাকায় ঢুকলে মাথা ও দাড়ি ঢাকুন।", "Tutup kepala dan jenggot saat menyiapkan pangan atau masuk area persiapan atau penyimpanan.", "खाना तयार गर्दा वा खाना तयारी वा भण्डारण क्षेत्रमा प्रवेश गर्दा टाउको र दाह्री ढाक्नुहोस्।"], ["li", "استخدام قبعات نظيفة أو شبكات شعر.", "Use clean caps or hair nets.", "साफ़ टोपी या हेयर-नेट इस्तेमाल करें।", "পরিষ্কার টুপি বা হেয়ারনেট ব্যবহার করুন।", "Gunakan topi bersih atau jaring rambut.", "सफा टोपी वा कपाल ढाक्ने जाली (hair net) प्रयोग गर्नुहोस्।"], ["h3", "الحلي والمجوهرات", "Jewellery and watches", "गहने और घड़ियाँ", "গয়না ও ঘড়ি", "Perhiasan dan jam", "गहना र घडी"], ["li", "عدم ارتداء الحلي والساعات أثناء العمل.", "Do not wear jewellery and watches while working.", "काम के दौरान गहने और घड़ियाँ न पहनें।", "কাজের সময় গয়না ও ঘড়ি পরবেন না।", "Jangan memakai perhiasan dan jam saat bekerja.", "काम गर्दा गहना र घडी नलगाउनुहोस्।"], ["h3", "الأحذية الخاصة", "Special footwear", "विशेष जूते", "বিশেষ জুতা", "Alas kaki khusus", "विशेष जुत्ता"], ["li", "ارتداء أحذية خاصة في مناطق التعامل مع الغذاء.", "Wear special footwear in food handling areas.", "भोजन संभालने के क्षेत्रों में विशेष जूते पहनें।", "খাবার নাড়াচাড়ার এলাকায় বিশেষ জুতা পরুন।", "Kenakan alas kaki khusus di area penanganan pangan.", "खाना ह्यान्डल गर्ने क्षेत्रमा विशेष जुत्ता लगाउनुहोस्।"], ["li", "يجب أن تكون قابلة للغسل وفي حالة جيدة.", "They must be washable and in good condition.", "ये धोने योग्य और अच्छी हालत में होने चाहिए।", "এগুলো ধোয়ার উপযোগী ও ভালো অবস্থায় থাকতে হবে।", "Harus dapat dicuci dan dalam kondisi baik.", "तिनीहरू धुन मिल्ने र राम्रो अवस्थाका हुनुपर्छ।"], ["h3", "خارج مكان العمل", "Outside the workplace", "कार्यस्थल के बाहर", "কর্মস্থলের বাইরে", "Di luar tempat kerja", "कामको ठाउँ बाहिर"], ["li", "خلع ملابس العمل إذا غادرت مكان عملك (مثلاً للتدخين أو استخدام دورة المياه).", "Take off work clothes if you leave your workplace (for example to smoke or use the toilet).", "यदि आप कार्यस्थल छोड़ें (जैसे धूम्रपान या शौचालय के लिए) तो कार्य वस्त्र उतार दें।", "কর্মস্থল ছাড়লে (যেমন ধূমপান বা টয়লেটে যেতে) কাজের পোশাক খুলে ফেলুন।", "Lepas pakaian kerja jika meninggalkan tempat kerja (misalnya untuk merokok atau ke toilet).", "कामको ठाउँबाट बाहिर जाँदा (जस्तै चुरोट पिउन वा शौचालय जान) काम गर्ने लुगा खोल्नुहोस्।"], ["h2", "نظافة اليدين", "Hand hygiene", "हाथों की स्वच्छता", "হাত পরিচ্ছন্নতা", "Kebersihan tangan", "हात सरसफाइ"], ["h3", "لماذا الاهتمام بغسل أيدينا؟", "Why do we care about washing our hands?", "हम हाथ क्यों धोते हैं?", "আমরা হাত কেন ধুই?", "Mengapa kita peduli mencuci tangan?", "हात धुनुको महत्त्व किन?"], ["p", "الأيدي النظيفة هي أهم أداة لسلامة الغذاء، حتى اليدين النظيفة ظاهرياً قد تحمل جراثيم.", "Clean hands are the most important tool for food safety; even hands that look clean may carry germs.", "साफ़ हाथ भोजन सुरक्षा का सबसे ज़रूरी साधन हैं; दिखने में साफ़ हाथों पर भी कीटाणु हो सकते हैं।", "পরিষ্কার হাত খাদ্য নিরাপত্তার সবচেয়ে গুরুত্বপূর্ণ হাতিয়ার; দেখতে পরিষ্কার হাতেও জীবাণু থাকতে পারে।", "Tangan bersih adalah alat terpenting untuk keamanan pangan; tangan yang tampak bersih pun bisa membawa kuman.", "सफा हात खाना सुरक्षाको सबैभन्दा महत्त्वपूर्ण औजार हो; सफा देखिने हातमा पनि जीवाणु हुन सक्छन्।"], ["h3", "متى نغسل أيدينا؟", "When do we wash our hands?", "हमें हाथ कब धोने चाहिए?", "আমরা কখন হাত ধুই?", "Kapan kita mencuci tangan?", "हात कहिले धुने?"], ["p", "عند الوصول للعمل وقبل التعامل مع الغذاء والأواني، قبل ارتداء القفازات، وبين تغييرها، قبل وبعد التعامل مع الغذاء النيء، بعد استخدام دورات المياه، بعد لمس الجسم أو ملابس العمل، وبعد أخذ استراحة.", "On arrival at work and before handling food and utensils, before putting on gloves and between changing them, before and after handling raw food, after using the toilet, after touching the body or work clothes, and after taking a break.", "काम पर पहुँचने पर और भोजन व बर्तन संभालने से पहले, दस्ताने पहनने से पहले और बदलने के बीच, कच्चा भोजन संभालने से पहले और बाद में, शौचालय के बाद, शरीर या कार्य वस्त्र छूने के बाद, और ब्रेक के बाद।", "কাজে পৌঁছে ও খাবার-বাসন নাড়াচাড়ার আগে, গ্লাভস পরার আগে ও বদলানোর মাঝে, কাঁচা খাবার নাড়াচাড়ার আগে ও পরে, টয়লেট ব্যবহারের পর, শরীর বা কাজের পোশাক ছোঁয়ার পর, এবং বিরতির পর।", "Saat tiba di tempat kerja dan sebelum menangani pangan serta peralatan, sebelum memakai sarung tangan dan di antara penggantiannya, sebelum dan sesudah menangani pangan mentah, setelah menggunakan toilet, setelah menyentuh tubuh atau pakaian kerja, dan setelah istirahat.", "काममा आउँदा र खाना तथा भाँडा ह्यान्डल गर्नु अघि, पञ्जा लगाउनु अघि र फेर्नुअघि/बीचमा, काँचो खाना ह्यान्डल गर्नु अघि र पछि, शौचालय प्रयोग गरेपछि, शरीर वा कामको लुगा छोएपछि, र ब्रेक लिएपछि।"], ["h3", "كيف نغسل أيدينا؟", "How do we wash our hands?", "हम हाथ कैसे धोएँ?", "আমরা কীভাবে হাত ধুই?", "Bagaimana cara mencuci tangan?", "हात कसरी धुने?"], ["p", "في أحواض مخصصة بغسيل الأيدي فقط ولمدة 20 ثانية على الأقل بالماء الدافئ والصابون بالطريقة التالية:", "In sinks reserved for handwashing only, for at least 20 seconds with warm water and soap, in the following way:", "केवल हाथ धोने के लिए रखे सिंक में, कम से कम 20 सेकंड तक गुनगुने पानी और साबुन से, इस तरीके से:", "শুধু হাত ধোয়ার জন্য নির্ধারিত বেসিনে, অন্তত ২০ সেকেন্ড গরম পানি ও সাবান দিয়ে, নিচের নিয়মে:", "Di wastafel khusus cuci tangan saja, minimal 20 detik dengan air hangat dan sabun, dengan cara berikut:", "हात धुने मात्र प्रयोग गरिने सिङ्कमा, न्यानो पानी र साबुनले कम्तीमा 20 सेकेन्डसम्म, यस तरिकाले:"], ["li", "1. بلل يديك بالماء الدافئ.", "1. Wet your hands with warm water.", "1. हाथ गुनगुने पानी से गीले करें।", "১. গরম পানিতে হাত ভিজিয়ে নিন।", "1. Basahi tangan dengan air hangat.", "1. न्यानो पानीले हात भिजाउनुहोस्।"], ["li", "2. ضع كمية مناسبة من الصابون.", "2. Apply a suitable amount of soap.", "2. उचित मात्रा में साबुन लगाएँ।", "২. উপযুক্ত পরিমাণ সাবান লাগান।", "2. Oleskan sabun secukupnya.", "2. उपयुक्त मात्रामा साबुन लगाउनुहोस्।"], ["li", "3. افرك اليدين جيداً.", "3. Rub your hands well.", "3. हाथों को अच्छी तरह रगड़ें।", "৩. হাত ভালো করে ঘষুন।", "3. Gosok tangan dengan baik.", "3. हात राम्ररी रगड्नुहोस्।"], ["li", "4. افرك فيما بين وحول الأصابع.", "4. Rub between and around the fingers.", "4. उंगलियों के बीच और आसपास रगड़ें।", "৪. আঙুলের ফাঁকে ও চারপাশে ঘষুন।", "4. Gosok di sela dan sekitar jari.", "4. औंलाहरूका बीच र वरिपरि रगड्नुहोस्।"], ["li", "5. افرك ظهر كل يد مع راحة اليد الأخرى.", "5. Rub the back of each hand with the palm of the other hand.", "5. हर हाथ की पीठ को दूसरे हाथ की हथेली से रगड़ें।", "৫. প্রতিটি হাতের পিঠ অন্য হাতের তালু দিয়ে ঘষুন।", "5. Gosok punggung setiap tangan dengan telapak tangan yang lain.", "5. अर्को हातको हत्केलाले हरेक हातको पछाडिपट्टि रगड्नुहोस्।"], ["li", "6. اشطف جيداً تحت الماء الجاري.", "6. Rinse well under running water.", "6. बहते पानी में अच्छी तरह धोएँ।", "৬. বহমান পানিতে ভালো করে ধুয়ে নিন।", "6. Bilas dengan baik di bawah air mengalir.", "6. बगिरहेको पानीले राम्ररी पखाल्नुहोस्।"], ["li", "7. استخدم مناديل ورقية للتجفيف.", "7. Use paper towels to dry.", "7. सुखाने के लिए कागज़ के तौलिये इस्तेमाल करें।", "৭. শুকানোর জন্য কাগজের তোয়ালে ব্যবহার করুন।", "7. Keringkan dengan tisu kertas.", "7. सुकाउन कागजको तौलिया प्रयोग गर्नुहोस्।"], ["li", "8. تخلص من المناديل في حاوية للنفايات.", "8. Dispose of the tissues in a waste bin.", "8. टिशू को कचरे के डिब्बे में डालें।", "৮. তোয়ালে আবর্জনার পাত্রে ফেলুন।", "8. Buang tisu ke tempat sampah.", "8. टिस्यु फोहोर भाँडोमा फाल्नुहोस्।"], ["n", "تذكر: الغسل الصحيح لليدين يمنع انتقال الجراثيم إلى الغذاء ويحمي صحة الجميع، لذلك التزم بالخطوات كل مرة.", "Remember: correct handwashing stops germs passing to food and protects everyone's health, so follow the steps every time.", "याद रखें: सही तरीके से हाथ धोने से कीटाणु भोजन तक नहीं पहुँचते और सबकी सेहत बचती है, इसलिए हर बार ये चरण अपनाएँ।", "মনে রাখবেন: সঠিকভাবে হাত ধোয়া খাবারে জীবাণু যাওয়া আটকায় এবং সবার স্বাস্থ্য রক্ষা করে, তাই প্রতিবার এই ধাপগুলো মানুন।", "Ingat: mencuci tangan dengan benar mencegah kuman berpindah ke pangan dan melindungi kesehatan semua orang, jadi ikuti langkah-langkah ini setiap kali.", "याद राख्नुहोस्: सही हात धुने तरिकाले जीवाणु खानामा सर्न रोकिन्छ र सबैको स्वास्थ्य जोगिन्छ, त्यसैले हरेक पटक यी चरणहरू पालना गर्नुहोस्।"], ["h2", "الممارسات الصحية في مناطق التعامل مع الغذاء", "Health practices in food handling areas", "भोजन संभालने के क्षेत्रों में स्वास्थ्य पद्धतियाँ", "খাবার পরিচালনার এলাকায় স্বাস্থ্য পদ্ধতি", "Praktik kesehatan di area penanganan pangan", "खाना ह्यान्डलिङ क्षेत्रमा स्वास्थ्य अभ्यासहरू"], ["p", "هي الممارسات والسلوكيات الصحية المهمة والتي يجب اتباعها في مناطق التعامل مع الغذاء:", "These are the important health practices and behaviours that must be followed in food handling areas:", "ये भोजन संभालने के क्षेत्र में पालन किए जाने वाले ज़रूरी स्वास्थ्य व्यवहार और आदतें हैं:", "এগুলো খাবার পরিচালনার এলাকায় অনুসরণীয় গুরুত্বপূর্ণ স্বাস্থ্য পদ্ধতি ও আচরণ:", "Ini adalah praktik dan perilaku kesehatan penting yang wajib diikuti di area penanganan pangan:", "खाना ह्यान्डलिङ क्षेत्रमा पालना गर्नुपर्ने महत्त्वपूर्ण स्वास्थ्य अभ्यास र व्यवहारहरू यी हुन्:"], ["h3", "التعامل مع الغذاء", "Handling food", "भोजन संभालना", "খাবার পরিচালনা", "Menangani pangan", "खाना ह्यान्डल गर्ने"], ["p", "لا تلمس الغذاء عالي الخطورة مباشرة باليدين، استخدم أدوات مناسبة مثل الملاعق والملاقط، واستخدم القفازات عند الضرورة.", "Do not touch high-risk food directly with your hands; use suitable tools such as spoons and tongs, and use gloves when necessary.", "उच्च-जोखिम भोजन को सीधे हाथ से न छुएँ; चम्मच और चिमटे जैसे उचित औज़ार इस्तेमाल करें, और ज़रूरत पर दस्ताने पहनें।", "উচ্চ-ঝুঁকির খাবার সরাসরি হাতে ধরবেন না; চামচ ও চিমটার মতো উপযুক্ত সরঞ্জাম ব্যবহার করুন, প্রয়োজনে গ্লাভস পরুন।", "Jangan menyentuh pangan berisiko tinggi langsung dengan tangan; gunakan alat seperti sendok dan penjepit, dan pakai sarung tangan bila perlu.", "उच्च-जोखिमका खाना सिधै हातले नछुनुहोस्; चम्चा र चिम्टा जस्ता उपयुक्त औजार प्रयोग गर्नुहोस्, र आवश्यक परे पञ्जा लगाउनुहोस्।"], ["h3", "استخدام القفازات", "Using gloves", "दस्ताने इस्तेमाल करना", "গ্লাভস ব্যবহার", "Menggunakan sarung tangan", "पञ्जा प्रयोग"], ["p", "غيّرها القفازات كل نصف ساعة. غيّرها بعد التعامل مع النفايات أو بعد فترات الراحة. اغسل يديك قبل ارتداء قفازات جديدة. لا تستخدم القفازات لأغراض أخرى غير التعامل مع الغذاء.", "Change gloves every half hour. Change them after handling waste or after breaks. Wash your hands before putting on new gloves. Do not use gloves for any purpose other than handling food.", "दस्ताने हर आधे घंटे में बदलें। कचरा संभालने या ब्रेक के बाद बदलें। नए दस्ताने पहनने से पहले हाथ धोएँ। दस्ताने भोजन संभालने के अलावा किसी और काम के लिए न इस्तेमाल करें।", "প্রতি আধা ঘণ্টায় গ্লাভস বদলান। আবর্জনা নাড়াচাড়ার পর বা বিরতির পরে বদলান। নতুন গ্লাভস পরার আগে হাত ধুন। খাবার নাড়াচাড়া ছাড়া অন্য কাজে গ্লাভস ব্যবহার করবেন না।", "Ganti sarung tangan setiap setengah jam. Ganti setelah menangani sampah atau setelah istirahat. Cuci tangan sebelum memakai sarung tangan baru. Jangan gunakan sarung tangan untuk keperluan selain menangani pangan.", "हरेक आधा घण्टामा पञ्जा फेर्नुहोस्। फोहोर ह्यान्डल गरेपछि वा ब्रेकपछि फेर्नुहोस्। नयाँ पञ्जा लगाउनु अघि हात धुनुहोस्। खाना ह्यान्डल गर्ने बाहेक अन्य कुनै पनि प्रयोजनका लागि पञ्जा प्रयोग नगर्नुहोस्।"], ["h3", "الكمامات وأغطية الرأس واللحية", "Masks, head and beard covers", "मास्क, सिर और दाढ़ी के आवरण", "মাস্ক, মাথা ও দাড়ির আবরণ", "Masker, penutup kepala dan jenggot", "मास्क, टाउको र दाह्री ढाक्ने कपडा"], ["p", "ارتد الكمامة لتغطية الأنف والفم، وغيّرها عند البلل أو بعد الراحة. استخدم أغطية الرأس لتغطية الشعر بالكامل، وأغطية الشعر للشعر الكثيف عند إعداد الغذاء، وغيّرها عند التلوث أو التساخ. اغسل يديك جيداً قبل ارتداء هذه الأدوات.", "Wear a mask to cover the nose and mouth, and change it when wet or after a break. Use head covers to fully cover the hair, and hair nets for thick hair when preparing food, and change them when contaminated or dirty. Wash your hands well before putting on these items.", "नाक-मुंह ढकने के लिए मास्क पहनें और गीला होने पर या ब्रेक के बाद बदलें। बालों को पूरी तरह ढकने के लिए सिर का आवरण, और भोजन तैयार करते समय घने बालों के लिए हेयर-नेट इस्तेमाल करें; दूषित या गंदा होने पर बदलें। इन्हें पहनने से पहले हाथ अच्छी तरह धोएँ।", "নাক-মুখ ঢাকতে মাস্ক পরুন এবং ভিজে গেলে বা বিরতির পর বদলান। চুল পুরোপুরি ঢাকতে মাথার আবরণ, আর খাবার তৈরির সময় ঘন চুলের জন্য হেয়ারনেট ব্যবহার করুন; দূষিত বা নোংরা হলে বদলান। এগুলো পরার আগে হাত ভালো করে ধুন।", "Pakai masker untuk menutup hidung dan mulut, dan ganti jika basah atau setelah istirahat. Gunakan penutup kepala untuk menutup rambut sepenuhnya, dan jaring rambut untuk rambut tebal saat menyiapkan pangan; ganti jika tercemar atau kotor. Cuci tangan dengan baik sebelum memakai perlengkapan ini.", "नाक र मुख पूरै ढाक्ने गरी मास्क लगाउनुहोस्, र भिजेमा वा ब्रेकपछि फेर्नुहोस्। कपाल पूरै ढाक्न टाउको ढाक्ने कपडा प्रयोग गर्नुहोस्, र बाक्लो कपालका लागि कपाल ढाक्ने जाली प्रयोग गर्नुहोस्, र दूषित वा फोहोर भएमा फेर्नुहोस्। यी वस्तु लगाउनु अघि हात राम्ररी धुनुहोस्।"], ["h3", "الجروح والبثور", "Wounds and boils", "घाव और फोड़े", "ক্ষত ও ফোসকা", "Luka dan bisul", "घाउ र पिँडौला"], ["p", "غطِّ الجروح والبثور بضمادات ملونة عازلة للماء أبلغ المشرف إذا سقطت ضمادة في الغذاء.", "Cover cuts and boils with coloured, waterproof dressings; tell the supervisor if a dressing falls into food.", "कट और फोड़ों को रंगीन, पानी-रोधी पट्टी से ढकें; पट्टी भोजन में गिरे तो पर्यवेक्षक को बताएँ।", "কাটা ও ফোসকা রঙিন, জলরোধী ব্যান্ডেজে ঢাকুন; ব্যান্ডেজ খাবারে পড়লে সুপারভাইজারকে জানান।", "Tutup luka dan bisul dengan plester berwarna tahan air; beri tahu supervisor jika plester jatuh ke pangan.", "काटिएको घाउ र पिँडौलालाई रंगीन, पानी नपर्ने ड्रेसिङले ढाक्नुहोस्; ड्रेसिङ खानामा खसेमा सुपरवाइजरलाई भन्नुहोस्।"], ["h3", "عند العطس والسعال", "When sneezing and coughing", "छींकते और खांसते समय", "হাঁচি ও কাশির সময়", "Saat bersin dan batuk", "हाछ्युँ र खोक्दा"], ["p", "ابتعد عن الغذاء عند العطس أو السعال، غطِّ فمك بذراعك إذا لم تستطع الابتعاد، ثم اغسل يديك بعد العطس أو السعال.", "Move away from food when sneezing or coughing; cover your mouth with your arm if you cannot move away, then wash your hands after sneezing or coughing.", "छींकते या खांसते समय भोजन से दूर हटें; दूर न हो सकें तो बांह से मुंह ढकें, फिर छींक या खांसी के बाद हाथ धोएँ।", "হাঁচি বা কাশির সময় খাবার থেকে দূরে সরুন; দূরে যেতে না পারলে বাহু দিয়ে মুখ ঢাকুন, তারপর হাঁচি বা কাশির পর হাত ধুন।", "Menjauh dari pangan saat bersin atau batuk; tutup mulut dengan lengan jika tidak bisa menjauh, lalu cuci tangan setelah bersin atau batuk.", "हाछ्युँ वा खोक्दा खानाबाट टाढा हट्नुहोस्; टाढा हट्न नसके हातले मुख छोप्नुको सट्टा पाखुरासँग मुख छोप्नुहोस्, त्यसपछि हाछ्युँ वा खोकेपछि हात धुनुहोस्।"], ["h3", "عدم الأكل والشرب في أماكن العمل", "No eating or drinking in workplaces", "कार्यस्थल पर न खाना, न पीना", "কর্মস্থলে খাওয়া বা পান করা নিষেধ", "Tidak makan dan minum di tempat kerja", "कामको ठाउँमा खाने वा पिउने निषेध"], ["p", "كُل واشرب فقط في المناطق المخصصة لذلك.", "Eat and drink only in the areas designated for this.", "केवल इसके लिए निर्धारित क्षेत्रों में खाएँ-पीएँ।", "শুধু নির্ধারিত জায়গায় খান ও পান করুন।", "Makan dan minum hanya di area yang ditentukan untuk itu.", "तोकिएको क्षेत्रमा मात्र खानुहोस् र पिउनुहोस्।"], ["h3", "عدم التدخين", "No smoking", "धूम्रपान नहीं", "ধূমপান নিষেধ", "Tidak merokok", "धूम्रपान निषेध"], ["p", "ممنوع التدخين في أي منطقة للتعامل مع الغذاء.", "Smoking is prohibited in any food handling area.", "भोजन संभालने के किसी भी क्षेत्र में धूम्रपान मना है।", "খাবার নাড়াচাড়ার যেকোনো এলাকায় ধূমপান নিষিদ্ধ।", "Merokok dilarang di semua area penanganan pangan.", "कुनै पनि खाना ह्यान्डल गर्ने क्षेत्रमा धूम्रपान निषेध छ।"], ["h3", "الممارسات غير الصحية في مناطق التعامل مع الغذاء", "Unhealthy practices in food handling areas", "भोजन संभालने के क्षेत्रों में अस्वास्थ्यकर आदतें", "খাবার নাড়াচাড়ার এলাকায় অস্বাস্থ্যকর অভ্যাস", "Praktik tidak sehat di area penanganan pangan", "खाना ह्यान्डल गर्ने क्षेत्रमा अस्वस्थकर अभ्यासहरू"], ["p", "الممارسات غير الصحية هي سلوكيات وعادات سيئة لمتداولي الغذاء يمكن أن تؤدي إلى تلوث الغذاء، تجنب هذه الأمثلة عند التواجد في مناطق التعامل مع الغذاء:", "Unhealthy practices are bad habits of food handlers that can lead to food contamination. Avoid these examples when in food handling areas:", "अस्वास्थ्यकर आदतें भोजन संभालने वालों की ऐसी बुरी आदतें हैं जो भोजन दूषित कर सकती हैं। भोजन क्षेत्र में इनसे बचें:", "অস্বাস্থ্যকর পদ্ধতি হলো খাবার পরিচালনাকারীদের খারাপ অভ্যাস যা খাবার দূষিত করতে পারে। খাবার এলাকায় এগুলো এড়িয়ে চলুন:", "Praktik tidak sehat adalah kebiasaan buruk penjamah pangan yang dapat menyebabkan kontaminasi. Hindari contoh berikut di area penanganan pangan:", "अस्वस्थकर अभ्यास भनेको खाना ह्यान्डलरका खराब बानी हुन्, जसले खाना दूषण निम्त्याउन सक्छन्। खाना ह्यान्डलिङ क्षेत्रमा हुँदा यी उदाहरण टार्नुहोस्:"], ["li", "استخدام أحواض غسل الأيدي لغسل الغذاء أو الأدوات.", "Using hand-washing sinks to wash food or tools.", "हाथ धोने के सिंक में भोजन या औज़ार धोना।", "হাত ধোয়ার বেসিনে খাবার বা সরঞ্জাম ধোয়া।", "Menggunakan wastafel cuci tangan untuk mencuci pangan atau peralatan.", "खाना वा औजार धुन हात धुने सिङ्क प्रयोग गर्नु।"], ["li", "لمس الرأس، الأنف، أو لمس الجسم وتمشيط الشعر أو اللحية.", "Touching the head, nose, body, or combing hair or beard.", "सिर, नाक या शरीर छूना, या बाल-दाढ़ी में कंघी करना।", "মাথা, নাক বা শরীর ছোঁয়া, বা চুল-দাড়ি আঁচড়ানো।", "Menyentuh kepala, hidung, atau tubuh, atau menyisir rambut atau jenggot.", "टाउको, नाक, शरीर छुनु, वा कपाल वा दाह्री कोर्नु।"], ["li", "لعق الأصابع لتذوق الغذاء أو النفخ لفتح الأكياس والعبوات.", "Licking fingers to taste food, or blowing to open bags and packages.", "भोजन चखने के लिए उंगलियाँ चाटना, या थैले/पैकेट खोलने के लिए फूंकना।", "খাবার চাখতে আঙুল চাটা, বা ব্যাগ-প্যাকেট খুলতে ফুঁ দেওয়া।", "Menjilat jari untuk mencicipi pangan, atau meniup untuk membuka kantong dan kemasan.", "खाना चाख्न औंला चाट्नु, वा झोला र प्याकेज खोल्न फुक्नु।"], ["li", "ارتداء الكمامة بطريقة لا تغطي الأنف والفم بالكامل.", "Wearing a mask in a way that does not fully cover the nose and mouth.", "मास्क ऐसे पहनना कि नाक और मुंह पूरी तरह न ढकें।", "নাক ও মুখ পুরোপুরি না ঢেকে মাস্ক পরা।", "Memakai masker tidak menutupi hidung dan mulut sepenuhnya.", "नाक र मुख पूरै नढाक्ने गरी मास्क लगाउनु।"], ["li", "وضع الملابس الخارجية في مناطق التعامل مع الغذاء.", "Placing outer clothing in food handling areas.", "भोजन क्षेत्र में बाहरी कपड़े रखना।", "খাবার এলাকায় বাইরের পোশাক রাখা।", "Meletakkan pakaian luar di area penanganan pangan.", "बाहिरी लुगा खाना ह्यान्डल गर्ने क्षेत्रमा राख्नु।"], ["li", "وضع الأغراض الشخصية في مناطق تحضير الغذاء.", "Placing personal items in food preparation areas.", "भोजन तैयार करने के क्षेत्र में निजी सामान रखना।", "খাবার প্রস্তুতির এলাকায় ব্যক্তিগত জিনিস রাখা।", "Meletakkan barang pribadi di area persiapan pangan.", "व्यक्तिगत सामान खाना तयारी क्षेत्रमा राख्नु।"], ["li", "فتح حاويات النفايات باليد.", "Opening waste containers by hand.", "कचरे के डिब्बे हाथ से खोलना।", "হাত দিয়ে আবর্জনার পাত্র খোলা।", "Membuka tempat sampah dengan tangan.", "हातले फोहोर भाँडा खोल्नु।"]]}, {"t": ["النظافة في منشآت الغذاء", "Cleanliness in food establishments", "खाद्य प्रतिष्ठानों में सफाई", "খাদ্য প্রতিষ্ঠানে পরিচ্ছন্নতা", "Kebersihan di usaha pangan", "खाना प्रतिष्ठानमा सरसफाइ"], "r": [["h2", "أهمية التنظيف والتطهير في منشآت الغذاء", "The importance of cleaning and sanitising in food establishments", "खाद्य प्रतिष्ठानों में सफाई और सैनिटाइज़िंग का महत्व", "খাদ্য প্রতিষ্ঠানে পরিষ্কার ও জীবাণুমুক্তকরণের গুরুত্ব", "Pentingnya pembersihan dan sanitasi di usaha pangan", "खाना प्रतिष्ठानमा सफाइ र कीटाणुशोधनको महत्त्व"], ["p", "التنظيف والتطهير هما أساس عملنا. لنستوعب مدى أهميتهما ودورهما الكبير في ضمان سلامة الغذاء، وكيف يمكننا تطبيقهما بشكل فعال لضمان أفضل النتائج.", "Cleaning and sanitising are the foundation of our work. Let us understand their importance and their major role in ensuring food safety, and how we can apply them effectively for the best results.", "सफाई और सैनिटाइज़िंग हमारे काम की नींव हैं। आइए समझें कि ये कितने ज़रूरी हैं और भोजन सुरक्षा सुनिश्चित करने में इनकी बड़ी भूमिका क्या है, और इन्हें प्रभावी ढंग से कैसे लागू करें।", "পরিষ্কার ও জীবাণুমুক্তকরণ আমাদের কাজের ভিত্তি। এদের গুরুত্ব ও খাদ্য নিরাপত্তা নিশ্চিত করতে এদের বড় ভূমিকা বুঝি, এবং সর্বোত্তম ফলের জন্য কীভাবে কার্যকরভাবে প্রয়োগ করব তা জানি।", "Pembersihan dan sanitasi adalah dasar pekerjaan kita. Mari pahami betapa pentingnya keduanya dan peran besarnya dalam menjamin keamanan pangan, serta cara menerapkannya secara efektif untuk hasil terbaik.", "सफाइ र कीटाणुशोधन हाम्रो कामको आधार हो। तिनीहरूको महत्त्व, खाना सुरक्षा सुनिश्चित गर्नमा तिनीहरूको मुख्य भूमिका, र उत्तम परिणामका लागि तिनीहरूलाई प्रभावकारी रूपमा कसरी लागू गर्ने बुझौं।"], ["h3", "ما هي أهمية التنظيف والتطهير؟", "What is the importance of cleaning and sanitising?", "सफाई और सैनिटाइज़िंग का महत्व क्या है?", "পরিষ্কার ও জীবাণুমুক্তকরণের গুরুত্ব কী?"  and detergents.", "गर्म पानी और डिटर्जेंट से किया जाता है।", "গরম পানি ও ডিটারজেন্ট দিয়ে করা হয়।", "Dilakukan dengan air panas dan deterjen.", "यो न्यानो पानी र डिटर्जेन्टले गरिन्छ।"], ["h3", "ما هو التطهير؟", "What is sanitising?", "सैनिटाइज़िंग क्या है?", "জীবাণুমুক্তকরণ কী?", "Apa itu sanitasi?", "कीटाणुशोधन भनेको के हो?"], ["li", "تقليل الحمل الميكروبي أو (عدد) الميكروبات إلى مستوى آمن أو إلى الحد المسموح به وفق المواصفات القياسية المعتمدة.", "Reducing the microbial load, or number of microbes, to a safe level or to the permitted limit under approved standard specifications.", "सूक्ष्मजीवों की संख्या (भार) को सुरक्षित स्तर या मान्य सीमा तक घटाना, जैसा स्वीकृत मानक में तय हो।", "অণুজীবের ভার বা সংখ্যা নিরাপদ মাত্রায় বা অনুমোদিত সীমায় কমানো, স্বীকৃত মান অনুযায়ী।", "Mengurangi beban atau jumlah mikroba hingga tingkat aman atau batas yang diizinkan sesuai spesifikasi standar yang ditetapkan.", "सूक्ष्मजीवको संख्या (माइक्रोबियल लोड) सुरक्षित स्तरमा वा स्वीकृत मापदण्ड अनुसारको अनुमति सीमामा घटाउनु।"], ["li", "قتل البكتيريا والفيروسات بعد التنظيف.", "Killing bacteria and viruses after cleaning.", "सफाई के बाद जीवाणु और वायरस नष्ट करना।", "পরিষ্কারের পর ব্যাকটেরিয়া ও ভাইরাস মারা।", "Membunuh bakteri dan virus setelah pembersihan.", "सफाइ पछि जीवाणु र भाइरस मार्नु।"], ["li", "يتم باستخدام مطهرات خاصة أو ماء ساخن جداً.", "It is done with special sanitisers or very hot water.", "विशेष सैनिटाइज़र या बहुत गर्म पानी से किया जाता है।", "বিশেষ জীবাণুনাশক বা খুব গরম পানি দিয়ে করা হয়।", "Dilakukan dengan sanitiser khusus atau air sangat panas.", "यो विशेष कीटाणुनाशक वा धेरै तातो पानीले गरिन्छ।"], ["n", "تذكر دائماً: التنظيف والتطهير ليسا مجرد مهام روتينية، بل هما جوهر عملنا في حماية سلامة الغذاء وصحة المستهلكين! نفهم الفرق بين التنظيف والتطهير: التنظيف يزيل الأوساخ المرئية والتطهير يقتل الميكروبات غير المرئية، نطبق كلا الإجراءين بدقة وفي الوقت المناسب.", "Always remember: cleaning and sanitising are not just routine tasks; they are the core of our work in protecting food safety and consumers' health! We understand the difference: cleaning removes visible dirt, and sanitising kills invisible microbes. We apply both procedures accurately and at the right time.", "हमेशा याद रखें: सफाई और सैनिटाइज़िंग केवल रोज़ के काम नहीं, भोजन सुरक्षा और उपभोक्ताओं के स्वास्थ्य की रक्षा के मूल हैं! फर्क समझें: सफाई दिखने वाली गंदगी हटाती है, और सैनिटाइज़िंग न दिखने वाले सूक्ष्मजीव मारती है। दोनों प्रक्रियाएँ सही समय पर सटीकता से करें।", "সবসময় মনে রাখুন: পরিষ্কার ও জীবাণুমুক্তকরণ শুধু রুটিন কাজ নয়, খাদ্য নিরাপত্তা ও ভোক্তার স্বাস্থ্য রক্ষার মূল ভিত্তি! পার্থক্য বুঝি: পরিষ্কার দৃশ্যমান ময়লা সরায়, আর জীবাণুমুক্তকরণ অদৃশ্য অণুজীব মারে। দুটোই সঠিক সময়ে নির্ভুলভাবে করি।", "Selalu ingat: pembersihan dan sanitasi bukan sekadar tugas rutin; keduanya inti pekerjaan kita dalam melindungi keamanan pangan dan kesehatan konsumen! Kita paham bedanya: pembersihan menghilangkan kotoran yang terlihat, sanitasi membunuh mikroba yang tak terlihat. Kita terapkan keduanya dengan tepat dan pada waktunya.", "सधैं याद राख्नुहोस्: सफाइ र कीटाणुशोधन केवल दैनिक काम होइनन्; खाना सुरक्षा र उपभोक्ताको स्वास्थ्य जोगाउने हाम्रो कामको मुख्य आधार हुन्! हामी भिन्नता बुझ्छौं: सफाइले देखिने फोहोर हटाउँछ, र कीटाणुशोधनले नदेखिने सूक्ष्मजीव मार्छ। हामी दुवै प्रक्रिया सही तरिकाले र सही समयमा लागू गर्छौं।"], ["h2", "ماذا يجب تنظيفه وتطهيره؟", "What must be cleaned and sanitised?", "क्या साफ़ और सैनिटाइज़ करना चाहिए?", "কী পরিষ্কার ও জীবাণুমুক্ত করতে হবে?", "Apa yang harus dibersihkan dan disanitasi?", "के-के सफा र कीटाणुरहित गर्नुपर्छ?"], ["h3", "الأسطح الملامسة للغذاء", "Food-contact surfaces", "भोजन के संपर्क वाली सतहें", "খাবারের সংস্পর্শে আসা পৃষ্ঠ", "Permukaan yang bersentuhan dengan pangan", "खानासँग सम्पर्क हुने सतह"], ["li", "ما هي الأمثلة؟ عربات النقل، طاولات الفحص، ميزان الوزن، الأواني، ألواح التقطيع، الطاولات، المعدات والأدوات.", "What are examples? Transport trolleys, inspection tables, weighing scales, containers, cutting boards, tables, equipment and tools.", "उदाहरण क्या  pembuangan limbah, wadah luar.", "उदाहरण के हुन्? वरिपरिका भित्ता, भेन्टिलेसन खुल्ला ठाउँ, कच्चा पदार्थ र खाना प्राप्त गर्ने क्षेत्र, फोहोर फाल्ने क्षेत्र, बाहिरी कन्टेनर।"], ["li", "كيف نتعامل معها؟ تنظيف دوري منتظم.", "How do we handle them? Regular scheduled cleaning.", "इन्हें कैसे संभालें? नियमित, निर्धारित सफाई।", "কীভাবে সামলাব? নিয়মিত নির্ধারিত পরিষ্কার।", "Bagaimana menanganinya? Pembersihan terjadwal dan teratur.", "हामी कसरी ह्यान्डल गर्छौं? नियमित तालिकाअनुसार सफाइ।"], ["li", "لماذا؟ لتقليل مخاطر التلوث غير المباشر.", "Why? To reduce the risk of indirect contamination.", "क्यों? अप्रत्यक्ष संदूषण का खतरा घटाने के लिए।", "কেন? পরোক্ষ দূষণের ঝুঁকি কমাতে।", "Mengapa? Untuk mengurangi risiko kontaminasi tidak langsung.", "किन? अप्रत्यक्ष दूषणको जोखिम घटाउन।"], ["h3", "الأسطح الملامسة للأيدي", "Hand-contact surfaces", "हाथों के संपर्क वाली सतहें", "হাতের সংস্পর্শে আসা পৃষ্ঠ", "Permukaan yang bersentuhan dengan tangan", "हात छुने सतह"], ["li", "ما هي الأمثلة؟ مقابض الأبواب، مفاتيح الكهرباء، فتيات الغاز، أزرار تشغيل المعدات.", "What are examples? Door handles, electrical switches, tap handles, equipment operating buttons.", "उदाहरण क्या हैं? दरवाज़े के हैंडल, बिजली के स्विच, नल के हैंडल, उपकरणों के बटन।", "উদাহরণ কী? দরজার হাতল, বিদ্যুতের সুইচ, কল-ট্যাপের হাতল, যন্ত্রের চালু-বন্ধের বোতাম।", "Contohnya? Gagang pintu, saklar listrik, keran, tombol pengoperasian peralatan.", "उदाहरण के हुन्? ढोकाको ह्यान्डल, बिजुलीको स्विच, नलको ह्यान्डल, उपकरण चलाउने बटन।"], ["li", "كيف نتعامل معها؟ تنظيف وتطهير بشكل دوري.", "How do we handle them? Clean and sanitise regularly.", "इन्हें कैसे संभालें? नियमित रूप से साफ़ और सैनिटाइज़ करें।", "কীভাবে সামলাব? নিয়মিত পরিষ্কার ও জীবাণুমুক্ত করুন।", "Bagaimana menanganinya? Bersihkan dan sanitasi secara berkala.", "हामी कसरी ह्यान्डल गर्छौं? नियमित रूपमा सफा र कीटाणुरहित गर्नुहोस्।"], ["li", "لماذا؟ لمنع انتقال البكتيريا من الأيدي للغذاء.", "Why? To prevent bacteria passing from hands to food.", "क्यों? हाथों से भोजन तक जीवाणु न पहुँचें इसलिए।", "কেন? হাত থেকে খাবারে ব্যাকটেরিয়া যাওয়া ঠেকাতে।", "Mengapa? Untuk mencegah bakteri berpindah dari tangan ke pangan.", "किन? हातबाट खानामा जीवाणु सर्न रोक्न।"], ["h3", "أدوات التنظيف", "Cleaning tools", "सफाई के औज़ार", "পরিষ্কারের সরঞ্জাম", "Peralatan pembersih", "सफाइका औजार"], ["li", "ما هي الأمثلة؟ الممسحة، الفرشاة الخشنة، المكنسة، دلو التنظيف.", "What are examples? Mop, scrubbing brush, broom, cleaning bucket.", "उदाहरण क्या हैं? पोंछा, खुरदरा ब्रश, झाड़ू, सफाई की बाल्टी।", "উদাহরণ কী? মপ, শক্ত ব্রাশ, ঝাড়ু, পরিষ্কারের বালতি।", "Contohnya? Pel, sikat kasar, sapu, ember pembersih.", "उदाहरण के हुन्? पोछा, माझ्ने ब्रस, कुचो, सफाइको बाल्टी।"], ["li", "كيف نتعامل معها؟ ننظفها ونطهرها ونجففها بعد كل استخدام.", "How do we handle them? Clean, sanitise and dry them after every use.", "इन्हें कैसे संभालें? हर इस्तेमाल के बाद साफ़, सैनिटाइज़ और सुखाएँ।", "কীভাবে সামলাব? প্রতিটি ব্যবহারের পর পরিষ্কার, জীবাণুমুক্ত ও শুকাই।", "Bagaimana menanganinya? Bersihkan, sanitasi, dan keringkan setelah setiap penggunaan.", "हामी कसरी ह्यान्डल गर्छौं? हरेक प्रयोगपछि सफा, कीटाणुरहित र सुकाउनुहोस्।"], ["li", "لماذا؟ لمنعها من أن تصبح مصدراً للتلوث.", "Why? To stop them becoming a source of contamination.", "क्यों? इन्हें संदूषण का स्रोत बनने से रोकने के लिए।", "কেন? যাতে এগুলো দূষণের উৎস না হয়।", "Mengapa? Agar tidak menjadi sumber kontaminasi.", "किन? तिनीहरू दूषणको स्रोत बन्न नदिन।"], ["n", "ماذا يعني هذا لنا؟: نميز بين أنواع الأسطح: نعرف أي الأسطح تحتاج لعناية أكثر. نركز على الأسطح الملامسة للغذاء: ننظفها ونطهرها بعد كل استخدام وقبل التعامل معها بحرص شديد، ولا نهمل الأسطح الأخرى. \"نظف حيثما كنت\" (As you Go) يشير إلى تنظيف وتطهير مناطق العمل بين المهام وحسب الحاجة، ويتضمن ذلك: مسح الانسكابات فوراً حدوثها؛ تنظيف وتطهير الأسطح بانتظام لتقليل البكتيريا إلى مستوى آمن؛ إزالة النفايات بشكل مستمر لتجنب تراكمها في مناطق تحضير الغذاء.", "What this means for us: we distinguish between surface types and know which need more care. We focus on food-contact surfaces: clean and sanitise them after every use and handle them with great care, and do not neglect the other surfaces. \"Clean as you go\" means cleaning and sanitising work areas between tasks as needed. It includes: wiping spills immediately; cleaning and sanitising surfaces regularly to bring bacteria down to a safe level; removing waste continuously to avoid it piling up in food preparation areas.", "हमारे लिए इसका अर्थ: हम सतहों के प्रकार पहचानते हैं और जानते हैं कि किन्हें ज़्यादा ध्यान चाहिए। हम भोजन-संपर्क सतहों पर ध्यान देते हैं: हर इस्तेमाल के बाद साफ़ और सैनिटाइज़ करते हैं, और अन्य सतहों की भी उपेक्षा नहीं करते। \"जैसे-जैसे काम करें, साफ़ करते चलें\" का मतलब है काम के बीच ज़रूरत अनुसार क्षेत्र साफ़ करना: गिरा तुरंत पोंछना; सतहों को नियमित साफ़-सैनिटाइज़ करना; और कचरा लगातार हटाना ताकि भोजन-क्षेत्र में जमा न हो।", "আমাদের জন্য এর অর্থ: আমরা পৃষ্ঠের ধরন আলাদা করি এবং জানি কোনগুলোতে বেশি যত্ন লাগে। খাবার-সংস্পর্শী পৃষ্ঠে বেশি মনোযোগ দিই: প্রতিবার ব্যবহারের পর পরিষ্কার ও জীবাণুমুক্ত করি, এবং অন্যগুলোও অবহেলা করি না। \"কাজের সঙ্গে সঙ্গে পরিষ্কার\" মানে কাজের ফাঁকে দরকারমতো কর্মক্ষেত্র পরিষ্কার: ছিটকে পড়া সঙ্গে মোছা; পৃষ্ঠ নিয়মিত পরিষ্কার-জীবাণুমুক্ত করে ব্যাকটেরিয়া নিরাপদ মাত্রায় আনা; এবং আবর্জনা লাগাতার সরিয়ে খাবার-এলাকায় জমতে না দেওয়া।", "Bagi kita: kita membedakan jenis permukaan dan tahu mana yang perlu perhatian lebih. Kita fokus pada permukaan yang bersentuhan dengan pangan: bersihkan dan sanitasi setelah setiap penggunaan dan tangani dengan sangat hati-hati, serta tidak mengabaikan permukaan lainnya. \"Bersihkan sambil jalan\" berarti membersihkan dan menyanitasi area kerja di sela-sela tugas sesuai kebutuhan: segera mengelap tumpahan; membersihkan dan menyanitasi permukaan secara rutin hingga bakteri turun ke tingkat aman; dan membuang sampah terus-menerus agar tidak menumpuk di area persiapan pangan.", "हाम्रो लागि यसको अर्थ: हामी सतहका प्रकार छुट्याउँछौं र कुनलाई बढी ध्यान चाहिन्छ भनी जान्दछौं। हामी खानासँग सम्पर्क हुने सतहमा ध्यान केन्द्रित गर्छौं: हरेक प्रयोगपछि सफा र कीटाणुरहित गर्छौं र धेरै सावधानीसाथ ह्यान्डल गर्छौं, र अन्य सतहलाई बेवास्ता गर्दैनौं। \"काम गर्दै सफा गर्नुहोस्\" भनेको कामका बीचमा आवश्यकता अनुसार कार्यक्षेत्र सफा र कीटाणुरहित गर्नु हो। यसमा समावेश छ: फैलिएको पदार्थ तुरुन्तै पुछ्नु; सूक्ष्मजीव सुरक्षित स्तरमा ल्याउन नियमित रूपमा सतह सफा र कीटाणुरहित गर्नु; खाना तयारी क्षेत्रमा फोहोर थुप्रिन नदिन लगातार हटाउनु।"], ["h2", "كيف يتم التنظيف والتطهير؟", "How is cleaning and sanitising carried out?", "सफाई और सैनिटाइज़िंग कैसे की जाती है?", "পরিষ্কার ও জীবাণুমুক্তকরণ কীভাবে করা হয়?", "Bagaimana pembersihan dan sanitasi dilakukan?", "सफाइ र कीटाणुशोधन कसरी गरिन्छ?"], ["p", "لضمان تنفيذ التنظيف والتطهير بشكل سليم وفعال، هناك خطوات أساسية للوصول إلى النتائج المرجوة:", "To ensure cleaning and sanitising are carried out properly and effectively, there are basic steps to reach the desired results:", "सफाई और सैनिटाइज़िंग सही और प्रभावी ढंग से करने के लिए वांछित परिणाम तक पहुँचने के बुनियादी चरण हैं:", "পরিষ্কার ও জীবাণুমুক্তকরণ সঠিক ও কার্যকরভাবে করতে, কাঙ্ক্ষিত ফল পেতে কিছু মৌলিক ধাপ আছে:", "Untuk memastikan pembersihan dan sanitasi dilakukan dengan benar dan efektif, ada langkah dasar untuk mencapai hasil yang diinginkan:", "सफाइ र कीटाणुशोधन ठीकसँग र प्रभावकारी रूपमा गरिएको सुनिश्चित गर्न, इच्छित परिणाम पाउने आधारभूत चरणहरू छन्:"], ["h3", "التنظيف الأولي", "Initial cleaning", "प्रारंभिक सफाई", "প্রাথমিক পরিষ্কার", "Pembersihan awal", "प्रारम्भिक सफाइ"], ["p", "إزالة بقايا الغذاء/المخلفات الظاهرة باستخدام المسح، أو الكشط، أو الشطف، أو النقع.", "Removing visible food residue/waste by wiping, scraping, rinsing or soaking.", "मसह कर, खुरचकर, धोकर या भिगोकर दिखने वाले भोजन अवशेष/कचरा हटाना।", "মোছা, খুঁচিয়ে তোলা, ধোয়া বা ভেজানোর মাধ্যমে দৃশ্যমান খাবারের অবশিষ্টাংশ/আবর্জনা সরানো।", "Menghilangkan sisa pangan/kotoran yang terlihat dengan mengelap, mengikis, membilas, atau merendam.", "पुछेर, खुर्केर, पखालेर वा भिजाएर देखिने खानाको अवशेष/फोहोर हटाउनु।"], ["h3", "التنظيف الرئيسي", "Main cleaning", "मुख्य सफाई", "মূল পরিষ and follow the manufacturer's instructions exactly. We do not neglect drying: we make sure surfaces are dry to stop bacteria growing.", "हमारे लिए इसका अर्थ: हम सही क्रम अपनाते हैं: प्रारंभिक सफाई से सुखाने तक हर चरण मानते हैं, कोई चरण चाहे कितना भी सरल लगे, छोड़ते नहीं। हर चरण का महत्व समझते हैं: प्रारंभिक सफाई मुख्य सफाई आसान बनाती है, और धुलाई सतह की डिटर्जेंट से प्रतिक्रिया रोकती है। सही तापमान: गर्म पानी (लगभग 50°C) डिटर्जेंट को काम करने देता है, और बहुत गर्म पानी (82°C) सैनिटाइज़िंग के लिए है। सैनिटाइज़र सही सांद्रता में और निर्माता के निर्देश के अनुसार इस्तेमाल करते हैं। सुखाने को नज़रअंदाज़ नहीं करते: सतहें सूखी रखते हैं ताकि जीवाणु न बढ़ें।", "আমাদের জন্য এর অর্থ: আমরা সঠিক ক্রম মানি: প্রাথমিক পরিষ্কার থেকে শুকানো পর্যন্ত ধাপ মানি, কোনো ধাপ যত সহজই মনে হোক বাদ দিই না। প্রতিটি ধাপের গুরুত্ব বুঝি: প্রাথমিক পরিষ্কার মূল পরিষ্কার সহজ করে, এবং ধোয়া পৃষ্ঠের সঙ্গে ডিটারজেন্টের বিক্রিয়া রোধ করে। সঠিক তাপমাত্রা ব্যবহার করি: গরম পানি (প্রায় ৫০°C) ডিটারজেন্টকে কাজ করতে সাহায্য করে, এবং খুব গরম পানি (৮২°C) জীবাণুমুক্তকরণের জন্য। জীবাণুনাশক সঠিক ঘনত্বে ও প্রস্তুতকারকের নির্দেশে ব্যবহার করি। শুকানো অবহেলা করি না: ব্যাকটেরিয়া বৃদ্ধি রোধে পৃষ্ঠ শুকনো রাখি।", "Bagi kita: kita mengikuti urutan yang benar: menjalankan langkah dari pembersihan awal hingga pengeringan, dan tidak melewatkan langkah apa pun meski tampak sepele. Kita memahami pentingnya setiap langkah: pembersihan awal mempermudah pembersihan utama, dan bilasan mencegah permukaan bereaksi dengan deterjen. Kita menggunakan suhu yang tepat: air hangat (sekitar 50°C) membantu deterjen bekerja, dan air sangat panas (82°C) untuk sanitasi. Kita memperhatikan sanitasi: menggunakan sanitiser dengan konsentrasi benar dan mengikuti petunjuk pabrikan dengan tepat. Kita tidak mengabaikan pengeringan: memastikan permukaan kering agar bakteri tidak tumbuh.", "हाम्रो लागि यसको अर्थ: हामी सही क्रम पालना गर्छौं: प्रारम्भिक सफाइदेखि सुकाउनेसम्मका चरणहरू पालना गर्छौं, र जति सरल देखिए पनि कुनै चरण छोड्दैनौं। हामी हरेक चरणको महत्त्व बुझ्छौं: प्रारम्भिक सफाइले मुख्य सफाइलाई सजिलो बनाउँछ, र पखालाइले सतहले डिटर्जेन्टसँग प्रतिक्रिया गर्न रोक्छ। हामी सही तापक्रम प्रयोग गर्छौं: न्यानो पानी (करिब 50°C) ले डिटर्जेन्टलाई काम गर्न मद्दत गर्छ, र धेरै तातो पानी (82°C) कीटाणुशोधनका लागि हो। हामी कीटाणुशोधनको ख्याल राख्छौं: हामी सही सांद्रतामा कीटाणुनाशक प्रयोग गर्छौं र निर्माताका निर्देशन ठीक पालना गर्छौं। हामी सुकाउनलाई बेवास्ता गर्दैनौं: जीवाणु बढ्न नदिन सतह सुकेको पक्का गर्छौं।"], ["h2", "التنظيف والتطهير باستخدام الحوض الثلاثي", "Cleaning and sanitising with the three-compartment sink", "तीन-हौज़ सिंक से सफाई और सैनिटाइज़िंग", "তিন-ট্যাংক সিংক দিয়ে পরিষ্কার ও জীবাণুমুক্তকরণ", "Pembersihan dan sanitasi dengan bak tiga kompartemen", "तीन-डब्बे सिंकमा सफाइ र कीटाणुशोधन"], ["li", "1 - التنظيف الأولي (حاوية نفايات): المسح، أو الكشط، أو النقع لإزالة بقايا الغذاء/المخلفات.", "1 - Initial cleaning (waste container): wiping, scraping or soaking to remove food residue/waste.", "1 - प्रारंभिक सफाई (कचरा पात्र): भोजन अवशेष/कचरा हटाने के लिए मसलना, खुरचना या भिगोना।", "1 - প্রাথমিক পরিষ্কার (আবর্জনার পাত্র): খাবারের অবশিষ্টাংশ/আবর্জনা সরাতে মোছা, খুঁচানো বা ভেজানো।", "1 - Pembersihan awal (wadah sampah): mengelap, mengikis, atau merendam untuk menghilangkan sisa pangan/kotoran.", "1 - प्रारम्भिक सफाइ (फोहोर भाँडो): खाना अवशेष/फोहोर हटाउन पुछ्ने, खुर्कने वा भिजाउने।"], ["li", "2 - التنظيف الرئيسي (الحوض الأول): الغسيل بالماء الساخن (حوالي 50°م) والمنظفات، لإزالة بقايا الغذاء العالقة.", "2 - Main cleaning (first basin): washing with hot water (about 50°C) and detergent to remove stuck-on food residue.", "2 - मुख्य सफाई (पहला हौज़): गर्म पानी (लगभग 50°C) और डिटर्जेंट से चिपकी भोजन-गंदगी हटाने के लिए धोना।", "2 - মূল পরিষ্কার (প্রথম ট্যাংক): লেগে থাকা খাবারের অবশেষ সরাতে গরম পানি (প্রায় ৫০°C) ও ডিটারজেন্টে ধোয়া।", "2 - Pembersihan utama (bak pertama): mencuci dengan air hangat (sekitar 50°C) dan deterjen untuk menghilangkan sisa pangan yang menempel.", "2 - मुख्य सफाइ (पहिलो बेसिन): टाँसिएको खाना अवशेष हटाउन न्यानो पानी (करिब 50°C) र डिटर्जेन्टले धुने।"], ["li", "3 - الشطف (الحوض الثاني): الشطف بالماء لإزالة مخلفات الغسيل وبقايا المنظفات المذابة.", "3 - Rinsing (second basin): rinsing with water to remove washing residue and dissolved detergent.", "3 - धुलाई (दूसरा हौज़): पानी से धोकर धुलाई का मैल और घुला डिटर्जेंट हटाना।", "3 - ধোয়া (দ্বিতীয় ট্যাংক): পানি দিয়ে ধুয়ে ময়লা ও গলে যাওয়া ডিটারজেন্ট সরানো।", "3 - Pembilasan (bak kedua): membilas dengan air untuk menghilangkan sisa cucian dan deterjen yang larut.", "3 - पखाला (दोस्रो बेसिन): धुने सामग्री र घुलेको डिटर्जेन्ट हटाउन पानीले पखाल्ने।"], ["li", "4 - التطهير (الحوض الثالث): الغمر في ماء ساخن (75°م لمدة 30 ثانية أو 82°م لمدة 10 ثوانٍ) أو استخدام مطهرات كيميائية خاصة.", "4 - Sanitising (third basin): immersion in hot water (75°C for 30 seconds or 82°C for 10 seconds) or using special chemical sanitisers.", "4 - सैनिटाइज़िंग (तीसरा हौज़): गर्म पानी में डुबाना (75°C पर 30 सेकंड या 82°C पर 10 सेकंड), या विशेष रासायनिक सैनिटाइज़र इस्तेमाल।", "4 - জীবাণুমুক্তকরণ (তৃতীয় ট্যাংক): গরম পানিতে ডোবানো (৭৫°C-এ ৩০ সেকেন্ড বা ৮২°C-এ ১০ সেকেন্ড), অথবা বিশেষ রাসায়নিক জীবাণুনাশক ব্যবহার।", "4 - Sanitasi (bak ketiga): merendam dalam air panas (75°C selama 30 detik atau 82°C selama 10 detik) atau memakai sanitiser kimia khusus.", "4 - कीटाणुशोधन (तेस्रो बेसिन): तातो पानीमा डुबाउने (30 सेकेन्डका लागि 75°C वा 10 सेकेन्डका लागि 82°C) वा विशेष रासायनिक कीटाणुनाशक प्रयोग गर्ने।"], ["li", "5 - التجفيف (أرفف التجفيف): الترك للتجفيف بالهواء (الأدوات مقلوبة)، أو استخدام مناديل ورقية عالية الامتصاص.", "5 - Drying (drying racks): leave to air-dry (tools upside down), or use highly absorbent paper towels.", "5 - सुखाना (सुखाने के रैक): हवा में सूखने दें (औज़ार उल्टे रखकर), या बहुत सोखने वाले कागज़ के तौलिये इस्तेमाल करें।", "5 - শুকানো (শুকানোর র‍্যাক): বাতাসে শুকাতে দিন (যন্ত্র উল্টো করে), বা অত্যন্ত শোষক কাগজের তোয়ালে।", "5 - Pengeringan (rak pengering): biarkan kering di udara (peralatan terbalik), atau gunakan tisu kertas yang sangat menyera ى بشكل صحيح، كلها عوامل تسهم في خلق ملاذ آمن للآفات وتعرض سلامة الغذاء للخطر.", "There are wrong practices that create an ideal environment that attracts pests and lets them spread in food establishments: letting them in, neglecting cleanliness, poor waste management, and not maintaining the building properly. All these create a safe refuge for pests and put food safety at risk.", "कुछ गलत आदतें कीटों के लिए आदर्श माहौल बनाती हैं और उन्हें खाद्य प्रतिष्ठानों में फैलने देती हैं: उन्हें अंदर आने देना, सफाई की उपेक्षा, कचरा प्रबंधन में कमी, और इमारत का ठीक रखरखाव न करना। ये सब कीटों को सुरक्षित ठिकाना देते हैं और भोजन की सुरक्षा खतरे में डालते हैं।", "কিছু ভুল অভ্যাস পোকামাকড়ের জন্য আদর্শ পরিবেশ তৈরি করে এবং খাদ্য প্রতিষ্ঠানে তাদের ছড়াতে দেয়: তাদের ঢুকতে দেওয়া, পরিচ্ছন্নতা অবহেলা, আবর্জনা ব্যবস্থাপনার অভাব, ভবন ঠিকমতো রক্ষণাবেক্ষণ না করা। এসব পোকামাকড়ের নিরাপদ আশ্রয় তৈরি করে এবং খাদ্য নিরাপত্তা বিপন্ন করে।", "Ada praktik salah yang menciptakan lingkungan ideal bagi hama untuk tertarik dan menyebar di usaha pangan: membiarkan mereka masuk, mengabaikan kebersihan, pengelolaan limbah yang buruk, dan tidak merawat bangunan dengan baik. Semua ini menciptakan tempat berlindung aman bagi hama dan membahayakan keamanan pangan.", "त्यस्ता गलत अभ्यास छन् जसले कीरालाई आकर्षित गर्ने र फैलन दिने आदर्श वातावरण बनाउँछन्: तिनीहरूलाई भित्र पस्न दिनु, सफाइलाई बेवास्ता गर्नु, खराब फोहोर व्यवस्थापन, र भवनको उचित मर्मत नगर्नु। यी सबैले कीराका लागि सुरक्षित शरणस्थल बनाउँछन् र खानाको सुरक्षालाई जोखिममा पार्छन्।"], ["li", "تخزين المواد الغذائية مباشرة على الأرض.", "Storing food directly on the floor.", "भोजन सीधे फ़र्श पर रखना।", "খাবার সরাসরি মেঝেতে রাখা।", "Menyimpan pangan langsung di lantai.", "खाना सिधै भुइँमा राख्नु।"], ["li", "عدم فحص المنتجات الغذائية للتأكد من خلوها من الآفات.", "Not inspecting food products to confirm they are free of pests.", "यह जांचे बिना भोजन रखना कि उसमें कीट नहीं हैं।", "খাদ্যপণ্যে পোকামাকড় নেই তা যাচাই না করা।", "Tidak memeriksa produk pangan untuk mem ation helps protect food and people's health.", "हमेशा याद रखें: परिसर में कीटों के लक्षण दिखें तो बड़े संक्रमण को खुद काबू करने की कोशिश न करें। तुरंत पर्यवेक्षक को बताएँ। हर छोटी जानकारी भोजन और लोगों के स्वास्थ्य की रक्षा में मदद करती है।", "সবসময় মনে রাখুন: প্রাঙ্গণে পোকামাকড়ের লক্ষণ দেখলে বড় আক্রমণ নিজে দমন করার চেষ্টা করবেন না। অবিলম্বে সুপারভাইজারকে জানান। প্রতিটি ছোট খেয়াল খাবার ও মানুষের স্বাস্থ্য রক্ষায় সাহায্য করে।", "Selalu ingat: jika melihat tanda hama di area usaha, jangan mencoba mengendalikan infestasi besar sendiri. Segera laporkan kepada supervisor. Setiap pengamatan kecil membantu melindungi pangan dan kesehatan masyarakat.", "सधैं याद राख्नुहोस्: परिसरमा कीराका संकेत देख्नुभयो भने ठूलो संक्रमण आफैं नियन्त्रण गर्ने प्रयास नगर्नुहोस्। तुरुन्तै सुपरवाइजरलाई रिपोर्ट गर्नुहोस्। हरेक सानो अवलोकनले खाना र मानिसको स्वास्थ्य जोगाउन मद्दत गर्छ।"], ["h2", "الاشتراطات العامة لمنشآت الغذاء", "General requirements for food establishments", "खाद्य प्रतिष्ठानों की सामान्य शर्तें", "খাদ্য প্রতিষ্ঠানের সাধারণ শর্তাবলি", "Persyaratan umum usaha pangan", "खाद्य प्रतिष्ठानका सामान्य आवश्यकताहरू"], ["h3", "أهمية الاشتراطات العامة في منشآت الغذاء", "Importance of general requirements in food establishments", "खाद्य प्रतिष्ठानों में सामान्य शर्तों का महत्व", "খাদ্য প্রতিষ্ঠানে সাধারণ শর্তাবলির গুরুত্ব", "Pentingnya persyaratan umum di usaha pangan", "खाद्य प्रतिष्ठानमा सामान्य आवश्यकताको महत्त्व"], ["p", "هي مجموعة المتطلبات التي وضعتها وزارة البلديات والإسكان والتي يجب توفرها لضمان تشغيل منشآت الغذاء بسلامة.", "These are the requirements set by the Ministry of Municipalities and Housing that must be met to ensure food establishments operate safely.", "ये वे आवश्यकताएँ हैं जो नगरपालिका एवं आवास मंत्रालय ने तय की हैं और जिन्हें भोजन प्रतिष्ठानों के सुरक्षित संचालन के लिए पूरा करना ज़रूरी है।", "এগুলো পৌর ও আবাসন মন্ত্রণালয়ের নির্ধারিত শর্ত, যা খাদ্য প্রতিষ্ঠান নিরাপদে চালানোর জন্য অবশ্যই পূরণ করতে হবে।", "Ini adalah persyaratan yang ditetapkan oleh Kementerian Kota dan Perumahan yang harus dipenuhi untuk memastikan usaha pangan beroperasi dengan aman.", "यी नगरपालिका तथा आवास मन्त्रालयले तोकेका आवश्यकता हुन्, जुन खाद्य प्रतिष्ठानहरू सुरक्षित रूपमा सञ्चालन भएको सुनिश्चित गर्न पूरा गर्नुपर्छ।"], ["p", "يمكنك الاطلاع عليها ضمن موقع وزارة البلديات والإسكان ضمن الأنظمة واللوائح الوزارية. كما تتضمن اللائحة الفنية السعودية الخليجية SFDA.FD/GSO21 الاشتراطات الصحية لمصانع الغذية والعاملين بها.", "You can view them on the Ministry of Municipalities and Housing website under its regulations. The Saudi-GCC technical regulation SFDA.FD/GSO21 also contains the health requirements for food factories and their workers.", "आप इन्हें नगरपालिका एवं आवास मंत्रालय की वेबसाइट पर मंत्रालय के नियमों में देख सकते हैं। सऊदी-GCC तकनीकी नियम SFDA.FD/GSO21 में खाद्य कारखानों और उनके कर्मचारियों की स्वास्थ्य आवश्यकताएँ भी हैं।", "আপনি পৌর ও আবাসন মন্ত্রণালয়ের ওয়েবসাইটে মন্ত্রণালয়ের বিধি-প্রবিধানের অধীনে এগুলো দেখতে পারেন। সৌদি-জিসিসি কারিগরি বিধি SFDA.FD/GSO21-এ খাদ্য কারখানা ও সেখানকার কর্মীদের স্বাস্থ্য শর্তও রয়েছে।", "Anda dapat melihatnya di situs Kementerian Kota dan Perumahan pada bagian peraturan. Regulasi teknis Saudi-GCC SFDA.FD/GSO21 juga memuat persyaratan kesehatan bagi pabrik pangan dan pekerjanya.", "तपाईं नगरपालिका तथा आवास मन्त्रालयको वेबसाइटमा यसका नियमहरू अन्तर्गत हेर्न सक्नुहुन्छ। साउदी-GCC प्राविधिक नियमन SFDA.FD/GSO21 मा खाद्य कारखाना र तिनका कामदारका स्वास्थ्य आवश्यकता पनि छन्।"], ["p", "تشمل هذه المتطلبات تصميم المباني، جودة الموقع المناسب، وتوفير المرافق الضرورية للتحكم في المخاطر داخل المنشأة.", "These requirements cover building design, the suitability of the site, and providing the facilities needed to control hazards inside the establishment.", "इन आवश्यकताओं में भवन का डिज़ाइन, उपयुक्त स्थान की गुणवत्ता, और प्रतिष्ठान के भीतर खतरों पर नियंत्रण के लिए ज़रूरी सुविधाएँ शामिल हैं।", "এই শর্তে ভবনের নকশা, উপযুক্ত স্থানের মান, এবং প্রতিষ্ঠানের ভেতরে ঝুঁকি নিয়ন্ত্রণের প্রয়োজনীয় সুবিধা অন্তর্ভুক্ত।", "Persyaratan ini mencakup .", "कच्चा पदार्थ प्राप्त गर्नेदेखि खाना परोस्नेसम्मको कार्यप्रवाह सजिलो हुनुपर्छ।"], ["li", "يفصل بين المناطق النظيفة وغير النظيفة لضمان عدم انتقال التلوث.", "Clean and unclean areas must be separated to prevent contamination from spreading.", "संदूषण फैलने से रोकने के लिए साफ़ और गंदे क्षेत्र अलग होने चाहिए।", "দূষণ ছড়ানো রোধে পরিষ্কার ও অপরিষ্কার এলাকা আলাদা থাকতে হবে।", "Area bersih dan kotor harus dipisahkan agar kontaminasi tidak menyebar.", "दूषण फैलिन नदिन सफा र फोहोर क्षेत्र छुट्याइएको हुनुपर्छ।"], ["h3", "الأسطح والأدوات/المعدات", "Surfaces, tools and equipment", "सतहें, औज़ार और उपकरण", "পৃষ্ঠ, সরঞ্জাম ও যন্ত্র", "Permukaan, perkakas, dan peralatan", "सतह, औजार र उपकरण"], ["li", "الأرضيات والجدران والأسقف يجب أن تكون مقاومة للماء وسهلة التنظيف.", "Floors, walls and ceilings must be water-resistant and easy to clean.", "फ़र्श, दीवारें और छत पानी-रोधी और साफ़ करने में आसान होने चाहिए।", "মেঝে, দেয়াল ও ছাদ জলরোধী ও পরিষ্কার করা সহজ হতে হবে।", "Lantai, dinding, dan langit-langit harus tahan air dan mudah dibersihkan.", "भुइँ, भित्ता र छत पानी नसोस्ने र सजिलै सफा गर्न मिल्ने हुनुपर्छ।"], ["li", "الأدوات والمعدات يجب أن تكون مصنوعة من مواد آمنة وسهلة التنظيف.", "Tools and equipment must be made from safe, easy-to-clean materials.", "औज़ार और उपकरण सुरक्षित, साफ़ करने में आसान सामग्री से बने होने चाहिए।", "সরঞ্জাম ও যন্ত্র নিরাপদ ও সহজে পরিষ্কারযোগ্য উপাদানে তৈরি হতে হবে।", "Perkakas dan peralatan harus terbuat dari bahan aman dan mudah dibersihkan.", "औजार र उपकरण सुरक्षित, सजिलै सफा हुने सामग्रीबाट बनेका हुनुपर्छ।"], ["h3", "التهوية والإضاءة", "Ventilation and lighting", "वेंटिलेशन और रोशनी", "বায়ু চলাচল ও আলো", "Ventilasi dan pencahayaan", "भेन्टिलेसन र प्रकाश"], ["li", "تهوية جيدة تمنع تراكم الروائح والحرارة.", "Good ventilation prevents the build-up of odours and heat.", "अच्छा वेंटिलेशन गंध और गर्मी जमा होने से रोकता है।", "ভালো বায়ু চলাচল গন্ধ ও তাপ জমা রোধ করে।", "Ventilasi yang baik mencegah penumpukan bau dan panas.", "राम्रो भेन्टिलेसनले गन्ध र तातो जम्मा हुन रोक्छ।"], ["li", "إضاءة كافية تجعلنا نرى الغذاء بشكل جيد أثناء العمل.", "Enough light so we can see the food clearly while working.", "पर्याप्त रोशनी ताकि काम के दौरान भोजन अच्छी तरह दिखे।", "পর্যাপ্ত আলো যাতে কাজের সময় খাবার ভালো দেখা যায়।", "Cahaya yang cukup agar kita dapat melihat pangan dengan jelas saat bekerja.", "काम गर्दा खाना स्पष्ट देख्न पर्याप्त प्रकाश हुनुपर्छ।"], ["h3", "مرافق غسل اليدين والمعدات", "Handwashing and equipment-washing facilities", "हाथ और उपकरण धोने की सुविधाएँ", "হাত ও যন্ত্র ধোয়ার সুবিধা", "Fasilitas cuci tangan dan peralatan", "हात धुने र उपकरण धुने सुविधा"], ["li", "توفر أحواض لغسل اليدين مع الماء الدافئ والصابون.", "Handwashing sinks with warm water and soap are provided.", "गुनगुने पानी और साबुन के साथ हाथ धोने के सिंक उपलब्ध हों।", "গরম পানি ও সাবানসহ হাত ধোয়ার বেসিন থাকবে।", "Tersedia wastafel cuci tangan dengan air hangat dan sabun.", "न्यानो पानी र साबुन भएका हात धुने सिङ्क उपलब्ध हुनुपर्छ।"], ["li", "وجود أحواض منفصلة لغسل الغذاء والمعدات.", "Separate sinks exist for washing food and equipment.", "भोजन और उपकरण धोने के लिए अलग सिंक हों।", "খাবার ও যন্ত্র ধোয়ার জন্য আলাদা বেসিন থাকবে।", "Tersedia wastafel terpisah untuk mencuci pangan dan peralatan.", "खाना र उपकरण धुनका लागि छुट्टाछुट्टै सिङ्क हुन्छन्।"], ["n", "ماذا يعني هذا لنا؟ (الاشتراطات العامة): علينا العمل في أماكن نظيفة وواضحة تفصل بين المناطق التي تتعامل فيها مع المواد النيئة وتلك المناطق التي يتم فيها تحضير وتقديم الغذاء. هذا يمنع انتقال التلوث ويجعل العمل أكثر أماناً. الأدوات والمعدات التي نستخدمها يجب أن تكون مصنوعة من مواد آمنة وصحية وسهلة التنظيف. عند استخدام معدات تنظيف، نضمن أن الغذاء الذي نقدمه آمن وخالٍ من المخاطر.", "What this means for us (general requirements): we must work in clean, clearly organised places that separate areas where we handle raw materials from areas where food is prepared and served. This prevents contamination spreading and makes work safer. The tools and equipment we use must be made of safe, healthy, easy-to-clean materials. When we use cleaning equipment, we make sure the food we serve is safe and free of hazards.", "हमारे लिए इसका अर्थ (सामान्य शर्तें): हमें साफ़ और स्पष्ट रूप से व्यवस्थित जगहों पर काम करना चाहिए जहाँ कच्चे माल वाले क्षेत्र भोजन तैयार और परोसने वाले क्षेत्रों से अलग हों। इससे संदूषण नहीं फैलता और काम सुरक्षित होता है। हमारे औज़ार और उपकरण सुरक्षित, स्वच्छ और आसानी से साफ़ होने वाली सामग्री के होने चाहिए। सफाई उपकरण इस्तेमाल करते समय सुनिश्चित करें कि परोसा गया भोजन सुरक्षित और खतरों से मुक्त हो।", "আমাদের জন্য এর অর্থ (সাধারণ শর্তাবলি): আমাদের পরিষ্কার ও সুস্পষ্টভাবে গোছানো জায়গায় কাজ করতে হবে, যেখানে কাঁচামাল নাড়াচাড়ার এলাকা খাবার প্রস্তুত ও পরিবেশনের এলাকা থেকে আলাদা। এতে দূষণ ছড়ায় না এবং কাজ নিরাপদ হয়। আমরা যে সরঞ্জাম ও যন্ত্র ব্যবহার করি তা নিরাপদ, স্বাস্থ্যকর ও সহজে পরিষ্কারযোগ্য উপাদানে হতে হবে। পরিষ্কারের যন্ত্র ব্যবহারে নিশ্চিত করি যে পরিবেশিত খাবার নিরাপদ ও বিপদমুক্ত।", "Bagi kita (persyaratan umum): kita harus bekerja di tempat yang bersih dan tertata jelas, dengan memisahkan area penanganan bahan mentah dari area persiapan dan penyajian pangan. Ini mencegah kontaminasi menyebar dan membuat kerja lebih aman. Perkakas dan peralatan yang kita pakai harus terbuat dari bahan yang aman, sehat, dan mudah dibersihkan. Saat memakai peralatan pembersih, kita pastikan pangan yang disajikan aman dan bebas bahaya.", "हाम्रो लागि यसको अर्थ (सामान्य आवश्यकता): हामी सफा, स्पष्ट रूपमा व्यवस्थित ठाउँमा काम गर्नुपर्छ, जसले कच्चा पदार्थ ह्यान्डल गर्ने क्षेत्रलाई खाना तयार र परोसिने क्षेत्रबाट अलग गर्छ। यसले दूषण फैलिन रोक्छ र काम सुरक्षित बनाउँछ। हामीले प्रयोग गर्ने औजार र उपकरण सुरक्षित, स्वस्थ, सजिलै सफा हुने सामग्रीबाट बनेका हुनुपर्छ। हामी सफाइ उपकरण प्रयोग गर्दा हामीले परोस्ने खाना सुरक्षित र खतरामुक्त छ भनी पक्का गर्छौं।"], ["h3", "ما دورك في الحفاظ على الاشتراطات العامة؟", "What is your role in maintaining the general requirements?", "सामान्य शर्तों को बनाए रखने में आपकी भूमिका क्या है?", "সাধারণ শর্তাবলি বজায় রাখায় আপনার ভূমিকা কী?", "Apa peranmu dalam menjaga persyaratan umum?", "सामान्य आवश्यकता कायम राख्न तपाईंको भूमिका के हो?"], ["p", "كعاملين في منشآت الغذاء، لديك دور حيوي في ضمان الحفاظ على الاشتراطات العامة يومياً.", "As workers in food establishments, you have a vital role in maintaining the general requirements every day.", "खाद्य प्रतिष्ठान के कर्मचारी के रूप में, हर दिन सामान्य शर्तों को बनाए रखने में आपकी अहम भूमिका है।", "খাদ্য প্রতিষ্ঠানের কর্মী হিসেবে, প্রতিদিন সাধারণ শর্তাবলি বজায় রাখায় আপনার গুরুত্বপূর্ণ ভূমিকা আছে।", "Sebagai pekerja di usaha pangan, Anda memiliki peran vital dalam menjaga persyaratan umum setiap hari.", "खाद्य प्रतिष्ठानका कामदारका रूपमा, तपाईंको हरेक दिन सामान्य आवश्यकता कायम राख्न महत्त्वपूर्ण भूमिका छ।"], ["h3", "الحفاظ على سير العمل", "Maintaining the workflow", "कार्यप्रवाह बनाए रखना", "কাজের প্রবাহ বজায় রাখা", "Menjaga alur kerja", "कार्यप्रवाह कायम राख्नु"], ["p", "تتبع خطوات العمل بشكل صحيح، من الاستلام إلى تقديم الغذاء.", "Follow the work steps correctly, from receiving to serving food.", "प्राप्ति से भोजन परोसने तक कार्य के चरण सही क्रम में अपनाएँ।", "গ্রহণ থেকে পরিবেশন পর্যন্ত কাজের ধাপ সঠিকভাবে অনুসরণ করুন।", "Ikuti langkah kerja dengan benar, dari penerimaan hingga penyajian pangan.", "प्राप्त गर्नदेखि खाना परोस्नेसम्म काम गर्ने चरणहरू ठीकसँग पालना गर्नुहोस्।"], ["li", "مثال: لا تعيد الغذاء المطبوخ إلى منطقة النيئة.", "Example: do not return cooked food to the raw area.", "उदाहरण: पका भोजन वापस कच्चे क्षेत्र में न ले जाएँ।", "উদাহরণ: রান্না করা খাবার আবার কাঁচা এলাকায় ফেরত নিয়ে যাবেন না।", "Contoh: jangan kembalikan pangan matang ke area mentah.", "उदाहरण: पकाएको खाना काँचो क्षेत्रमा फिर्ता नलैजानुहोस्।"], ["li", "لماذا؟ لمنع التلوث العرضي وتحسين كفاءة العمل.", "Why? To prevent accidental contamination and improve work efficiency.", "क्यों? आकस्मिक संदूषण रोकने और काम की कुशलता बढ़ाने के लिए।", "কেন? আকস্মিক দূষণ রোধ ও কাজের দক্ষতা বাড়াতে।", "Mengapa? Untuk mencegah kontaminasi tidak sengaja dan meningkatkan efisiensi kerja.", "किन? अनजानमा दूषण रोक्न र काम ग rkakas dengan benar dan bersihkan serta sanitasi setelah setiap penggunaan.", "औजार ठीकसँग प्रयोग गर्नुहोस् र हरेक प्रयोगपछि सफा र कीटाणुरहित गर्नुहोस्।"], ["li", "مثال: تنظيف الأدوات وتخزينها بشكل صحيح بعد الاستخدام.", "Example: clean and store tools properly after use.", "उदाहरण: इस्तेमाल के बाद औज़ार साफ़ करें और सही तरीके से रखें।", "উদাহরণ: ব্যবহারের পর সরঞ্জাম সঠিকভাবে পরিষ্কার ও সংরক্ষণ করুন।", "Contoh: bersihkan dan simpan perkakas dengan benar setelah dipakai.", "उदाहरण: प्रयोगपछि औजार राम्ररी सफा गरेर भण्डारण गर्नुहोस्।"], ["li", "لماذا؟ للحفاظ عليها، وضمان سلامتها للاستخدام مع الغذاء.", "Why? To keep them in good condition and ensure they are safe for use with food.", "क्यों? उन्हें अच्छी हालत में रखने और भोजन के साथ सुरक्षित इस्तेमाल सुनिश्चित करने के लिए।", "কেন? এগুলো ভালো রাখতে এবং খাবারের সঙ্গে নিরাপদে ব্যবহার নিশ্চিত করতে।", "Mengapa? Untuk menjaganya tetap baik dan memastikan aman digunakan bersama pangan.", "किन? तिनीहरूलाई राम्रो अवस्थामा राख्न र खानासँग प्रयोग गर्न सुरक्षित रहन सुनिश्चित गर्न।"], ["h3", "الحفاظ على التهوية الجيدة", "Keeping good ventilation", "अच्छा वेंटिलेशन बनाए रखना", "ভালো বায়ু চলাচল বজায় রাখা", "Menjaga ventilasi yang baik", "राम्रो भेन्टिलेसन कायम राख्नु"], ["p", "تأكد من تشغيل أنظمة التهوية بانتظام.", "Make sure ventilation systems run regularly.", "सुनिश्चित करें कि वेंटिलेशन सिस्टम नियमित चलें।", "নিশ্চিত করুন বায়ু চলাচল ব্যবস্থা নিয়মিত চালু থাকে।", "Pastikan sistem ventilasi berjalan secara teratur.", "भेन्टिलेसन प्रणाली नियमित चलिरहेको पक्का गर्नुहोस्।"], ["li", "مثال: تشغيل مراوح الشفط أثناء الطهي وإبقاؤها مشغلة.", "Example: running extraction fans during cooking and keeping them on.", "उदाहरण: पकाते समय एग्ज़ॉस्ट पंखे चलाएँ और उन्हें चालू रखें।", "উদাহরণ: রান্নার সময় এক্সট্র্যাক্টর ফ্যান চালু রাখা।", "Contoh: menyalakan kipas pengisap saat memasak dan membiarkannya menyala.", "उदाहरण: पकाउँदा एक्जस्ट फ्यान चलाउनु र खुला राख्नु।"], ["li", "لماذا؟ لمنع تراكم الروائح والحرارة والحفاظ على بيئة عمل صحية.", "Why? To  खाना र उपकरणबीच क्रस-दूषण रोक्न।"], ["n", "تذكر دائماً: الإبلاغ الفوري عن أي مشاكل أو أعطال في المبنى أو المعدات للمشرف.", "Always remember: report any problems or faults in the building or equipment to your supervisor immediately.", "हमेशा याद रखें: इमारत या उपकरणों में किसी भी समस्या या खराबी की तुरंत सुपरवाइज़र को सूचना दें।", "সবসময় মনে রাখুন: ভবন বা সরঞ্জামের যেকোনো সমস্যা বা ত্রুটি তৎক্ষণাৎ সুপারভাইজারকে জানান।", "Ingat selalu: laporkan segera setiap masalah atau kerusakan pada bangunan atau peralatan kepada supervisor.", "सधैं याद राख्नुहोस्: कुनै पनि समस्या वा भवन वा उपकरणको खराबी तुरुन्तै सुपरवाइजरलाई रिपोर्ट गर्नुहोस्।"]]}, {"t": ["إدارة سلامة الغذاء", "Food safety management", "खाद्य सुरक्षा प्रबंधन", "খাদ্য নিরাপত্তা ব্যবস্থাপনা", "Manajemen keamanan pangan", "खाद्य सुरक्षा व्यवस्थापन"], "r": [["h2", "ما هي إدارة سلامة الغذاء؟", "What is food safety management?", "खाद्य सुरक्षा प्रबंधन क्या है?", "খাদ্য নিরাপত্তা ব্যবস্থাপনা কী?", "Apa itu manajemen keamanan pangan?", "खाद्य सुरक्षा व्यवस्थापन भनेको के हो?"], ["p", "إدارة سلامة الغذاء هي نظام شامل يهدف إلى ضمان سلامة الغذاء في جميع مراحل إنتاجه وتداوله. تبدأ بتحديد وتقييم المخاطر المحتملة التي تؤثر على سلامة الغذاء، ثم تضع تدابير السيطرة المناسبة للتحكم في هذه المخاطر أو تقليلها.", "Food safety management is a comprehensive system aimed at ensuring food is safe at every stage of production and handling. It starts by identifying and assessing the potential hazards that affect food safety, then sets appropriate control measures to manage or reduce these risks.", "खाद्य सुरक्षा प्रबंधन एक व्यापक प्रणाली है जिसका उद्देश्य उत्पादन और संभालने के हर चरण पर भोजन को सुरक्षित रखना है। यह संभावित खतरों की पहचान और मूल्यांकन से शुरू होता है, फिर इन जोखिमों को नियंत्रित या कम करने के लिए उचित नियंत्रण उपाय तय करता है।", "খাদ্য নিরাপত্তা ব্যবস্থাপনা এমন একটি সামগ্রিক ব্যবস্থা যা উৎপাদন ও পরিচালনার প্রতিটি ধাপে খাবার নিরাপদ রাখার লক্ষ্যে কাজ করে। এটি খাবারের নিরাপত্তাকে প্রভাবিত করতে পারে এমন সম্ভাব্য ঝুঁকি চিহ্নিত ও মূল্যায়ন দিয়ে শুরু হয়, তারপর এসব ঝুঁকি নিয়ন্ত্রণ বা কমানোর উপযুক্ত ব্যবস্থা ঠিক করে।", "Manajemen keamanan pangan adalah sistem menyeluruh untuk memastikan makanan aman di setiap tahap produksi dan penanganannya. Dimulai dengan mengidentifikasi dan menilai potensi bahaya yang memengaruhi keamanan pangan, lalu menetapkan tindakan pengendalian yang sesuai untuk mengelola atau mengurangi risiko tersebut.", "खाद्य सुरक्षा व्यवस्थापन उत्पादन र ह्यान्डलिङको हरेक चरणमा खाना सुरक्षित रहोस् भनी सुनिश्चित गर्न बनाइएको व्यापक प्रणाली हो। यसले खाद्य सुरक्षालाई असर गर्ने सम्भावित खतराहरू पहिचान र मूल्याङ्कन गरेर सुरु हुन्छ, त्यसपछि यी जोखिम व्यवस्थापन वा घटाउन उपयुक्त नियन्त्रण उपायहरू तय गर्छ।"], ["p", "يحدد إطار المتطلبات اللازمة لضمان سلامة الغذاء في كل مرحلة، موجهة العاملين لتطبيق ممارسات آمنة وصحية. يتم تطبيق هذه الإجراءات عملياً من خلال التداول الآمن للغذاء، بدءاً من الاستلام وحتى تقديم الخدمة.", "A framework sets the requirements needed to keep food safe at every stage, guiding workers to apply safe and hygienic practices. These actions are applied in practice through safe food handling, from receiving to serving.", "एक ढाँचा हर चरण पर भोजन को सुरक्षित रखने के लिए आवश्यक शर्तें तय करता है और कर्मचारियों को सुरक्षित व स्वच्छ तरीके अपनाने का मार्गदर्शन देता है। ये कदम व्यवहार में सुरक्षित खाद्य संभाल के ज़रिए लागू होते हैं, प्राप्ति से परोसने तक।", "প্রতিটি ধাপে খাবার নিরাপদ রাখার জন্য প্রয়োজনীয় শর্ত একটি কাঠামো ঠিক করে এবং কর্মীদের নিরাপদ ও স্বাস্থ্যসম্মত পদ্ধতি অনুসরণে পরিচালিত করে। গ্রহণ থেকে পরিবেশন পর্যন্ত নিরাপদ খাদ্য পরিচালনার মাধ্যমে এগুলো বাস্তবে প্রয়োগ হয়।", "Sebuah kerangka menetapkan persyaratan untuk menjaga makanan tetap aman di setiap tahap, membimbing pekerja menerapkan praktik yang aman dan higienis. Tindakan ini diterapkan melalui penanganan pangan yang aman, mulai dari penerimaan hingga penyajian.", "एउटा ढाँचाले हरेक चरणमा खाना सुरक्षित राख्न आवश्यक आवश्यकताहरू तोक्छ, र कामदारलाई सुरक्षित र सरसफाइयुक्त अभ्यास लागू गर्न मार्गदर्शन गर्छ। यी कार्यहरू प्राप्त गर्नेदेखि परोस्नेसम्म सुरक्षित खाना ह्यान्डलिङमार्फत व्यवहारमा लागू हुन्छन्।"], ["p", "تعتمد المنشآت الغذائية على أنظمة معترف بها عالمياً مثل الهاسب (HACCP) أو الآيزو 22000، والتي تركز على الوقاية وتحديد نقاط التحكم الحرجة. من خلال تطبيق إدارة سلامة الغذاء، تضمن المنشآت تقديم غذاء آمن وعالي الجودة، مع الامتثال للمعايير المحلية والدولية، والحفاظ على سمعتها في السوق.", "Food businesses rely on internationally recognised systems such as HACCP or ISO 22000, which focus on prevention and identifying critical control points. By applying food safety management, establishments provide safe, high-quality food, comply with local and international standards, and protect their reputation in the market.", "खाद्य व्यवसाय HACCP या ISO 22000 जैसी अंतरराष्ट्रीय मान्यता प्राप्त प्रणालियों पर निर्भर करते हैं, जो रोकथाम और महत्वपूर्ण नियंत्रण बिंदुओं की पहचान पर केंद्रित हैं। इनके ज़रिए प्रतिष्ठान सुरक्षित और उच्च गुणवत्ता का भोजन देते हैं, स्थानीय व अंतरराष्ट्रीय मानकों का पालन करते हैं और बाज़ार में अपनी साख बनाए रखते हैं।", "খাদ্য ব্যবসাগুলো HACCP বা ISO 22000-এর মতো আন্তর্জাতিকভাবে স্বীকৃত ব্যবস্থার ওপর নির্ভর করে, যা প্রতিরোধ এবং সংকটপূর্ণ নিয়ন্ত্রণ বিন্দু চিহ্নিতকরণে গুরুত্ব দেয়। এর মাধ্যমে প্রতিষ্ঠানগুলো নিরাপদ ও উচ্চমানের খাবার সরবরাহ করে, স্থানীয় ও আন্তর্জাতিক মান মেনে চলে এবং বাজারে সুনাম ধরে রাখে।", "Usaha pangan mengandalkan sistem yang diakui secara internasional seperti HACCP atau ISO 22000, yang berfokus pada pencegahan dan penentuan titik kendali kritis. Dengan menerapkan manajemen keamanan pangan, usaha menyediakan makanan yang aman dan berkualitas, memenuhi standar lokal dan internasional, serta menjaga reputasinya di pasar.", "खाद्य व्यवसायहरू HACCP वा ISO 22000 जस्ता अन्तर्राष्ट्रिय मान्यता प्राप्त प्रणालीमा भर पर्छन्, जसले रोकथाम र महत्त्वपूर्ण नियन्त्रण बिन्दु पहिचानमा ध्यान दिन्छन्। खाद्य सुरक्षा व्यवस्थापन लागू गरेर प्रतिष्ठानहरूले सुरक्षित, उच्च गुणस्तरको खाना दिन्छन्, स्थानीय र अन्तर्राष्ट्रिय मापदण्डको पालना गर्छन्, र बजारमा आफ्नो साख जोगाउँछन्।"], ["n", "رغم أن إعداد نظام إدارة سلامة المنشأة هو مسؤولية إدارة المنشأة، فإن نجاح هذا النظام يعتمد على جهود كل فرد في المنشأة. بمجرد وضع النظام، يصبح كل منا جزءاً مهماً من عملية تنفيذه والحفاظ عليه.", "Although setting up the food safety management system is the responsibility of management, its success depends on the efforts of every person in the establishment. Once the system is in place, each of us becomes an important part of carrying it out and maintaining it.", "हालाँकि खाद्य सुरक्षा प्रबंधन प्रणाली तैयार करना प्रबंधन की ज़िम्मेदारी है, पर इसकी सफलता प्रतिष्ठान के हर व्यक्ति के प्रयासों पर निर्भर करती है। एक बार प्रणाली लागू हो जाने पर, हम में से हर कोई इसे चलाने और बनाए रखने का महत्वपूर्ण हिस्सा बन जाता है।", "যদিও খাদ্য নিরাপত্তা ব্যবস্থাপনা ব্যবস্থা তৈরি করা ব্যবস্থাপনার দায়িত্ব, এর সফলতা প্রতিষ্ঠানের প্রত্যেক ব্যক্তির প্রচেষ্টার ওপর নির্ভর করে। ব্যবস্থা চালু হলে আমাদের প্রত্যেকেই এটি বাস্তবায়ন ও রক্ষণাবেক্ষণের গুরুত্বপূর্ণ অংশ হয়ে যাই।", "Meski menyiapkan sistem manajemen keamanan pangan adalah tanggung jawab manajemen, keberhasilannya bergantung pada upaya setiap orang di usaha ini. Setelah sistem berjalan, masing-masing dari kita menjadi bagian penting dalam melaksanakan dan menjaganya.", "खाद्य सुरक्षा व्यवस्थापन प्रणाली स्थापना गर्ने जिम्मेवारी व्यवस्थापनको भए पनि, यसको सफलता प्रतिष्ठानको हरेक व्यक्तिको प्रयासमा निर्भर गर्छ। प्रणाली स्थापना भएपछि हामी हरेक जना यसलाई लागू र कायम राख्ने महत्त्वपूर्ण हिस्सा बन्छौं।"], ["n", "تذكر دائماً: التداول الآمن للغذاء في المنشآت هو التطبيق العملي لنظام سلامة الغذاء في جميع مراحل التعامل مع الغذاء: الاستلام، التخزين، التحضير، التقديم، والخدمة!", "Always remember: safe food handling in establishments is the practical application of the food safety system at every stage of dealing with food: receiving, storage, preparation, serving and service!", "हमेशा याद रखें: प्रतिष्ठानों में सुरक्षित खाद्य संभाल खाद्य सुरक्षा प्रणाली का व्यावहारिक रूप है, जो भोजन के हर चरण पर लागू होता है: प्राप्ति, भंडारण, तैयारी, परोसना और सेवा!", "সবসময় মনে রাখুন: প্রতিষ্ঠানে নিরাপদ খাদ্য পরিচালনা হলো খাদ্য নিরাপত্তা ব্যবস্থার বাস্তব প্রয়োগ, যা খাবারের প্রতিটি ধাপে প্রযোজ্য: গ্রহণ, সংরক্ষণ, প্রস্তুতি, পরিবেশন ও সেবা!", "Ingat selalu: penanganan pangan yang aman di usaha adalah penerapan sistem keamanan pangan di setiap tahap: penerimaan, penyimpanan, persiapan, penyajian dan layanan!", "सधैं याद राख्नुहोस्: प्रतिष्ठानमा सुरक्षित खाना ह्यान्डलिङ भनेको खाद्य सुरक्षा प्रणालीको व्यावहारिक प्रयोग हो, जसले खाना सम्बन्धी हरेक चरणमा लागू हुन्छ: प्राप्त गर्ने, भण्डारण, तयारी, परोस्ने र सेवा!"]]}, {"t": ["نظام الهاسب (HACCP)", "HACCP system", "HACCP प्रणाली", "HACCP ব্যবস্থা", "Sistem HACCP", "HACCP प्रणाली"], "r": [["h2", "ما هو نظام الهاسب (HACCP)؟", "What is the HACCP system?", "HACCP प्रणाली क्या है?", "HACCP ব্যবস্থা কী?", "Apa itu sistem HACCP?", "HACCP प्रणाली भनेको के हो?"], ["li", "هو اختصار لـ \"تحليل المخاطر ونقاط التحكم الحرجة\" Hazard Analysis Critical Control Points - HACCP.", "HACCP stands for Hazard Analysis and Critical Control Points.", "HACCP का अर्थ है खतरा विश्लेषण और महत्वपूर्ण नियंत्रण बिंदु (Hazard Analysis Critical Control Points)।", "HACCP মানে হলো বিপদ বিশ্লেষণ ও সংকটপূর্ণ নিয়ন্ত্রণ বিন্দু (Hazard Analysis Critical Control Points)।", "HACCP adalah singkatan dari Hazard Analysis Critical Control Points (Analisis Bahaya dan Titik Kendali Kritis).", "HACCP भनेको Hazard Analysis and Critical Control Points (खतरा विश्लेषण र महत्त्वपूर्ण नियन्त्रण बिन्दु) हो।"], ["li", "نظام عالمي معترف به لإدارة سلامة الغذاء.", "An internationally recognised system for managing food safety.", "खाद्य सुरक्षा प्रबंधन के लिए एक अंतरराष्ट्रीय मान्यता प्राप्त प्रणाली।", "খাদ্য নিরাপত্তা ব্যবস্থাপনার একটি আন্তর্জাতিক স্বীকৃত পদ্ধতি।", "Sistem yang diakui secara internasional untuk mengelola keamanan pangan.", "खाद्य सुरक्षा व्यवस्थापनका लागि अन्तर्राष्ट्रिय मान्यता प्राप्त प्रणाली।"], ["li", "يساعد المنشآت الغذائية على تحديد وتقييم والتحكم في المخاطر المهمة التي قد تؤثر على سلامة الغذاء.", "It helps food businesses identify, assess and control the important hazards that may affect food safety.", "यह खाद्य व्यवसायों को उन महत्वपूर्ण खतरों की पहचान, मूल्यांकन और नियंत्रण में मदद करता है जो भोजन की सुरक्षा को प्रभावित कर सकते हैं।", "এটি খাদ্য ব্যবসাকে খাদ্য নিরাপত্তাকে প্রভাবিত করতে পারে এমন গুরুত্বপূর্ণ বিপদ চিহ্নিত, মূল্যায়ন ও নিয়ন্ত্রণে সাহায্য করে।", "Membantu usaha pangan mengidentifikasi, menilai dan mengendalikan bahaya penting yang dapat memengaruhi keamanan pangan.", "यसले खाद्य व्यवसायहरूलाई खाद्य सुरक्षामा असर गर्न सक्ने महत्त्वपूर्ण खतराहरू पहिचान, मूल्याङ्कन र नियन्त्रण गर्न मद्दत गर्छ।"], ["li", "يتكون من 7 مبادئ، 12 خطوة لتنفيذه.", "It consists of 7 principles and 12 steps for implementation.", "इसमें 7 सिद्धांत और लागू करने के लिए 12 चरण हैं।", "এতে ৭টি নীতি ও বাস্তবায়নের জন্য ১২টি ধাপ রয়েছে।", "Terdiri dari 7 prinsip dan 12 langkah pelaksanaan.", "यसमा कार्यान्वयनका लागि 7 सिद्धान्त र 12 चरण छन्।"], ["h3", "كيف يعمل نظام الهاسب؟", "How does HACCP work?", "HACCP कैसे काम करता है?", "HACCP কীভাবে কাজ করে?", "Bagaimana cara kerja HACCP?", "HACCP कसरी काम गर्छ?"], ["li", "يحدد جميع النقاط في عملية إنتاج الغذاء حيث قد تحدث مخاطر.", "It identifies all points in the food production process where hazards may occur.", "यह भोजन उत्पादन की हर उस प्रक्रिया-बिंदु की पहचान करता है जहाँ खतरा उत्पन्न हो सकता है।", "এটি খাদ্য উৎপাদনের সব সেই বিন্দু চিহ্নিত করে যেখানে বিপদ ঘটতে পারে।", "Mengidentifikasi semua titik dalam proses produksi pangan tempat bahaya dapat terjadi.", "यसले खाना उत्पादन प्रक्रियाका सबै बिन्दु पहिचान गर्छ जहाँ खतरा हुन सक्छ।"], ["li", "يقرر أي من هذه النقاط حرجة لسلامة المنتج النهائي.", "It decides which of these points are critical to the safety of the final product.", "यह तय करता है कि इनमें से कौन-से बिंदु अंतिम उत्पाद की सुरक्षा के लिए महत्वपूर्ण हैं।", "এসবের মধ্যে কোনগুলো চূড়ান্ত পণ্যের নিরাপত্তার জন্য সংকটপূর্ণ তা নির্ধারণ করে।", "Menentukan titik mana yang kritis bagi keamanan produk akhir.", "यी मध्ये कुन बिन्दु अन्तिम उत्पादनको सुरक्
