الأغذية التي يمكن أن تكون بيئة لنمو البكتيريا الضارة.","What this means for us: understanding spore formation helps us store food properly, such as controlling temperature and moisture to prevent bacterial growth. We handle canned foods carefully and check for leaks or swelling. Knowing how dangerous bacteria are makes us more careful with foods that can become a breeding ground for harmful bacteria.","हमारे लिए इसका अर्थ: बीजाणु बनने को समझने से हम भोजन सही तरह रख सकते हैं, जैसे जीवाणु वृद्धि रोकने के लिए तापमान और नमी नियंत्रित करना। डिब्बाबंद खाद्य सावधानी से संभालें और रिसाव या फूलना जांचें। खतरनाक जीवाणुओं को जानकर हम उन खाद्य पदार्थों के प्रति अधिक सतर्क रहते हैं जो हानिकारक जीवाणुओं का घर बन सकते हैं।","আমাদের জন্য এর অর্থ: স্পোর তৈরি বোঝা খাবার সঠিকভাবে সংরক্ষণে সাহায্য করে, যেমন ব্যাকটেরিয়া বৃদ্ধি রোধে তাপমাত্রা ও আর্দ্রতা নিয়ন্ত্রণ। টিনজাত খাবার সাবধানে পরিচালনা করি এবং ফুটো বা ফোলা আছে কিনা দেখি। ব্যাকটেরিয়ার বিপদ জানলে ক্ষতিকর ব্যাকটেরিয়ার আবাস হতে পারে এমন খাবারে আমরা বেশি সতর্ক থাকি।","Bagi kita: memahami pembentukan spora membantu kita menyimpan pangan dengan benar, misalnya mengendalikan suhu dan kelembapan untuk mencegah pertumbuhan bakteri. Kita menangani makanan kaleng dengan hati-hati dan memeriksa kebocoran atau penggembungan. Mengetahui bahaya bakteri membuat kita lebih waspada terhadap pangan yang bisa menjadi tempat berkembang bakteri berbahaya."],["h2","السيطرة على البكتيريا","Controlling bacteria","जीवाणुओं पर नियंत्रण","ব্যাকটেরিয়া নিয়ন্ত্রণ","Mengendalikan bakteri"],["h3","حماية الغذاء من التلوث","Protecting food from contamination","भोजन को संदूषण से बचाना","খাবারকে দূষণ থেকে রক্ষা","Melindungi pangan dari kontaminasi"],["li","غسل اليدين بشكل متكرر وصحيح.","Wash hands frequently and correctly.","बार-बार और सही तरीके से हाथ धोएँ।","বারবার ও সঠিকভাবে হাত ধুন।","Cuci tangan secara sering dan benar."],["li","الإبلاغ عن أي أعراض مرضية.","Report any symptoms of illness.","बीमारी के किसी भी लक्षण की सूचना दें।","অসুস্থতার যেকোনো লক্ষণ জান التغليف المحددة.","Use the specified packaging methods.","निर्धारित पैकिंग तरीके इस्तेमाल करें।","নির্ধারিত প্যাকেজিং পদ্ধতি ব্যবহার করুন।","Gunakan metode pengemasan yang ditentukan."],["li","تقديم الغذاء المطبوخ فوراً.","Serve cooked food immediately.","पका भोजन तुरंत परोसें।","রান্না করা খাবার সঙ্গে সঙ্গে পরিবেশন করুন।","Sajikan pangan matang segera."],["h3","القضاء على البكتيريا في الغذاء النيء","Destroying bacteria in raw food","कच्चे भोजन में जीवाणु नष्ट करना","কাঁচা খাবারের ব্যাকটেরিয়া ধ্বংস","Membunuh bakteri pada pangan mentah"],["li","طبخ الغذاء حتى يصل إلى درجة الحرارة المطلوبة.","Cook food until it reaches the required temperature.","भोजन को आवश्यक तापमान तक पकाएँ।","খাবার প্রয়োজনীয় তাপমাত্রায় পৌঁছানো পর্যন্ত রান্না করুন।","Masak pangan hingga mencapai suhu yang disyaratkan."],["li","غسل وتطهير الخضار والفاكهة حسب التعليمات.","Wash and sanitise vegetables and fruit according to instructions.","सब्ज़ियाँ और फल निर्देशानुसार धोएँ और सैनिटाइज़ करें।","সবজি ও ফল নির্দেশনা অনুযায়ী ধুয়ে জীবাণুমুক্ত করুন।","Cuci dan sanitasi sayur dan buah sesuai petunjuk."],["h3","حماية المستهلكين","Protecting consumers","उपभोक्ताओं की रक्षा","ভোক্তাদের রক্ষা","Melindungi konsumen"],["li","الإبلاغ عن أي غذاء يشتبه في فساده أو انتهاء صلاحيته.","Report any food suspected of spoilage or expiry.","जिस भोजन के खराब होने या समाप्त होने का शक हो, उसकी सूचना दें।","নষ্ট বা মেয়াদোত্তীর্ণ সন্দেহ হলে যেকোনো খাবার জানান।","Laporkan pangan yang diduga rusak atau kedaluwarsa."],["li","عدم تقديم أي غذاء مشكوك في سلامته.","Do not serve any food whose safety is in doubt.","जिस भोजन की सुरक्षा पर शक हो, उसे न परोसें।","নিরাপত্তা নিয়ে সন্দেহ আছে এমন কোনো খাবার পরিবেশন করবেন না।","Jangan sajikan pangan yang diragukan keamanannya."],["p","للمزيد عن النظافة الشخصية للعاملين ونظافة المنشآت الغذائية، يرجى الرجوع إلى الأجزاء المخصصة لهذه المواضيع.","For more on personal hygiene of workers and cleanliness of food establishments, please refer to the sections dedicated to these topics.","कर्मचारियों की व्यक्तिगत स्वच्छता और खाद्य प्रतिष्ठानों की सफाई के बारे में अधिक जानकारी के लिए इन विषयों के लिए समर्पित भाग देखें।","কর্মীদের ব্যক্তিগত পরিচ্ছন্নতা ও খাদ্য প্রতিষ্ঠানের পরিচ্ছন্নতা সম্পর্কে আরও জানতে এসব বিষয়ের জন্য নির্ধারিত অংশ দেখুন।","Untuk informasi lebih lanjut tentang kebersihan pribadi pekerja dan kebersihan usaha pangan, lihat bagian yang khusus membahas topik ini."],["n","التحكم في الحرارة والوقت أساسي لسلامة الغذاء!","Controlling temperature and time is essential for food safety!","सुरक्षित भोजन के लिए तापमान और समय पर नियंत्रण अनिवार्य है!","খাদ্য নিরাপত্তায় তাপমাত্রা ও সময় নিয়ন্ত্রণ অপরিহার্য!","Mengendalikan suhu dan waktu sangat penting untuk keamanan pangan!"],["h2","أنواع الأغذية","Types of food","खाद्य पदार्थों के प्रकार","খাবারের ধরন","Jenis pangan"],["li","الأغذية عالية الخطورة: أغذية جاهزة للأكل، مطبوخة أو معالجة، وغنية بالبروتين ورطبة. من أمثلتها: اللحوم المطبوخة، الوجبات الجاهزة، منتجات البيض، منتجات الألبان. لماذا هي خطرة؟ تسمح بنمو البكتيريا بسرعة إذا لم تُحفظ بشكل صحيح. كيف نتعامل معها؟ حفظها خارج \"منطقة الخطر\" (5°م و63°م). تغطيتها دائماً لحمايتها من التلوث. مراقبة دقيقة لوقت ودرجة الحرارة.","High-risk foods: ready-to-eat, cooked or processed, protein-rich and moist foods. Examples: cooked meat, ready meals, egg products, dairy products. Why are they risky? They let bacteria grow quickly if not stored correctly. How do we handle them? Keep them outside the danger zone (5°C to 63°C), always cover them to protect them from contamination, and closely monitor time and temperature.","उच्च-जोखिम भोजन: खाने के लिए तैयार, पका या प्रसंस्कृत, प्रोटीन-युक्त और नम भोजन। उदाहरण: पका मांस, तैयार भोजन, अंडे के उत्पाद, डेयरी उत्पाद। ये जोखिमभरे क्यों हैं? सही तरह न रखे जाएँ तो जीवाणु तेज़ी से बढ़ते हैं। इन्हें कैसे संभालें? इन्हें खतरे के क्षेत्र (5°C से 63°C) से बाहर रखें, संदूषण से बचाने के लिए हमेशा ढकें, और समय व तापमान पर बारीकी से नज़र रखें।","উচ্চ-ঝুঁকির খাবার: খাওয়ার জন্য প্রস্তুত, রান্না বা প্রক্রিয়াজাত, প্রোটিনসমৃদ্ধ ও আর্দ্র খাবার। উদাহরণ: রান্না করা মাংস, তৈরি খাবার, ডিমজাত পণ্য, দুগ্ধজাত পণ্য। কেন ঝুঁকিপূর্ণ? সঠিকভাবে না রাখলে ব্যাকটেরিয়া দ্রুত বাড়ে। কীভাবে সামলাব? বিপদসীমার (৫°C থেকে ৬৩°C) বাইরে রাখি, দূষণ থেকে বাঁচাতে সবসময় ঢেকে রাখি, এবং সময় ও তাপমাত্রা ঘনিষ্ঠভাবে দেখি।","Pangan berisiko tinggi: pangan siap saji, dimasak atau diolah, kaya protein, dan lembap. Contoh: daging matang, makanan siap saji, produk telur, produk susu. Mengapa berisiko? Bakteri cepat berkembang jika tidak disimpan dengan benar. Bagaimana menanganinya? Simpan di luar zona bahaya (5°C–63°C), selalu tutup untuk melindungi dari kontaminasi, dan pantau waktu serta suhu dengan cermat."],["li","الأغذية النيئة: أغذية تدعم نمو البكتيريا بسهولة، من أمثلتها: الجاهز للأكل: الفواكه والخضروات. التي تحتاج للطهي: اللحوم، الدواجن، الأسماك، البيض. كيف نتعامل معها؟ غسل الفواكه والخضروات جيداً قبل الاستخدام. تخزين الأغذية النيئة بعيداً عن الأغذية الجاهزة للأكل. التبريد أو التجميد لإبطاء نمو البكتيريا. الطهي الجيد لقتل البكتيريا.","Raw foods: foods that readily support bacterial growth. Examples: ready-to-eat fruit and vegetables; foods that need cooking: meat, poultry, fish, eggs. How do we handle them? Wash fruit and vegetables well before use. Store raw foods away from ready-to-eat foods. Chill or freeze to slow bacterial growth. Cook thoroughly to kill bacteria.","कच्चे भोजन: ऐसे खाद्य जो जीवाणु वृद्धि को आसानी से सहारा देते हैं। उदाहरण: खाने के लिए तैयार फल और सब्ज़ियाँ; पकाने योग्य भोजन: मांस, मुर्गी, मछली, अंडे। इन्हें कैसे संभालें? उपयोग से पहले फल-सब्ज़ियाँ अच्छी तरह धोएँ। कच्चे भोजन को तैयार भोजन से दूर रखें। जीवाणु वृद्धि धीमी करने के लिए ठंडा या जमाएँ। जीवाणु मारने के लिए अच्छी तरह पकाएँ।","কাঁচা খাবার: যেসব খাবার ব্যাকটেরিয়া বৃদ্ধিতে সহজে সহায়ক। উদাহরণ: খাওয়ার উপযোগী ফল ও সবজি; রান্না দরকার এমন খাবার: মাংস, হাঁস-মুরগি, মাছ, ডিম। কীভাবে সামলাব? ব্যবহারের আগে ফল ও সবজি ভালো করে ধুই। কাঁচা খাবার তৈরি খাবার থেকে আলাদা রাখি। ব্যাকটেরিয়ার বৃদ্ধি ধীর করতে ঠান্ডা বা হিমায়িত করি। ব্যাকটেরিয়া মারতে ভালোভাবে রান্না করি।","Pangan mentah: pangan yang mudah mendukung pertumbuhan bakteri. Contoh: buah dan sayur siap makan; pangan yang perlu dimasak: daging, unggas, ikan, telur. Bagaimana menanganinya? Cuci buah dan sayur dengan baik sebelum digunakan. Simpan pangan mentah terpisah dari pangan siap saji. Dinginkan atau bekukan untuk memperlambat pertumbuhan bakteri. Masak hingga matang sempurna untuk membunuh bakteri."],["li","الأغذية منخفضة الخطورة: أغذية لا تدعم نمو البكتيريا بسهولة، من أمثلتها: منتجات عالية الحموضة (الخل، المخللات)، منتجات عالية السكر (الشوكولاتة، المربى)، منتجات جافة (الحبوب، الخبز، البسكويت)، منتجات عالية الملوحة (اللحوم المجففة). كيف نتعامل معها؟ لا تحتاج تبريد أو تجميد عادة. حمايتها من الملوثات الخارجية.","Low-risk foods: foods that do not readily support bacterial growth. Examples: highly acidic products (vinegar, pickles), high-sugar products (chocolate, jam), dry products (grains, bread, biscuits), high-salt products (dried meat). How do we handle them? They usually do not need chilling or freezing. Protect them from external contamination.","कम-जोखिम भोजन: ऐसे खाद्य जो जीवाणु वृद्धि को आसानी से सहारा नहीं देते। उदाहरण: अधिक अम्लीय उत्पाद (सिरका, अचार), अधिक चीनी वाले उत्पाद (चॉकलेट, मुरब्बा), सूखे उत्पाद (अनाज, ब्रेड, बिस्कुट), अधिक नमक वाले उत्पाद (सूखा मांस)। इन्हें कैसे संभालें? आमतौर पर ठंडा या जमाने की ज़रूरत नहीं। बाहरी संदूषण से बचाएँ।","নিম্ন-ঝুঁকির খাবার: যেসব খাবার ব্যাকটেরিয়া বৃদ্ধিতে সহজে সহায়ক নয়। উদাহরণ: অতি অম্লীয় পণ্য (সিরকা, আচার), অতি চিনিযুক্ত পণ্য (চকোলেট, জ্যাম), শুকনো পণ্য (শস্য, রুটি, বিস্কুট), অতি লবণাক্ত পণ্য (শুকনো মাংস)। কীভাবে সামলাব? সাধারণত ঠান্ডা বা হিমায়নের প্রয়োজন নেই। বাইরের দূষণ থেকে রক্ষা করি।","Pangan berisiko rendah: pangan yang tidak mudah mendukung pertumbuhan bakteri. Contoh: produk sangat asam (cuka, acar), produk tinggi gula (cokelat, selai), produk kering (biji-bijian, roti, biskuit), produk tinggi garam (daging kering). Bagaimana menanganinya? Biasanya tidak perlu didinginkan atau dibekukan. Lindungi dari kontaminasi luar."],["h2","الجراثيم الأخرى","Other microbes","अन्य सूक्ष्मजीव","অন্যান্য জীবাণু","Mikroba lainnya"],["h3","الفيروسات","Viruses","वायरस","ভাইরাস","Virus"],["li","صغيرة جداً وأصغر من البكتيريا.","Very small, smaller than bacteria.","बहुत छोटे, जीवाणुओं से भी छोटे।","খুব ছোট, ব্যাকটেরিয়ার চেয়েও ছোট।","Sangat kecil, lebih kecil dari bakteri."],["li","لا تحتاج للتكاثر في الغذاء لتسبب المرض.","They do not need to multiply in food to cause illness.","बीमारी पैदा करने के लिए इन्हें भोजन में बढ़ने की ज़रूरत नहीं।","অসুখ ঘটাতে খাবারে বাড়ার দরকার নেই।","Tidak perlu berkembang biak di dalam pangan untuk menyebabkan sakit."],["li","تستخدم الغذاء فقط كوسيلة للدخول إلى الجسم.","They use food only as a way into the body.","वे भोजन को केवल शरीर में प्रवेश का माध्यम बनाते हैं।","তারা খাবারকে কেবল শরীরে প্রবেশের মাধ্যম হিসেবে ব্যবহার করে।","Mereka hanya menggunakan pangan sebagai jalan masuk ke tubuh."],["li","تتأثر داخل أنسجة جسم الإنسان بعد تناولها.","They multiply inside the body's tissues after being eaten.","खाने के बाद ये शरीर के ऊतकों के भीतर बढ़ते हैं।","খাওয়ার পর এরা শরীরের টিস্যুর ভেতরে বাড়ে।","Setelah dimakan, mereka berkembang biak di dalam jaringan tubuh."],["li","لا تعتمد على الغذاء للبقاء، لذا أنواع الغذاء معرضة للتلوث بها.","They do not depend on food to survive, so any type of food can be contaminated by them.","ये जीवित रहने के लिए भोजन पर निर्भर नहीं, इसलिए हर तरह का भोजन इनसे दूषित हो सकता है।","এরা বাঁচার জন্য খাবারের উপর নির্ভর করে না, তাই যেকোনো ধরনের খাবার এদের দ্বারা দূষিত হতে পারে।","Mereka tidak bergantung pada pangan untuk bertahan hidup, sehingga semua jenis pangan berisiko tercemar."],["li","يمكن القضاء عليها بالطهي الجيد.","They can be destroyed by thorough cooking.","अच्छी तरह पकाने से इन्हें नष्ट किया जा सकता है।","ভালোভাবে রান্না করলে এদের ধ্বংস করা যায়।","Dapat dimusnahkan dengan memasak yang benar."],["h3","الفطريات (العفن)","Fungi (moulds)","फफूंद (मोल्ड)","ছত্রাক (মোল্ড)","Jamur (kapang)"],["li","تنمو وتتكاثر مباشرة على الغذاء.","They grow and multiply directly on food.","ये सीधे भोजन पर उगते और बढ़ते हैं।","এরা সরাসরি খাবারের উপর জন্মে ও বাড়ে।","Tumbuh dan berkembang biak langsung pada pangan."],["li","تحتاج للرطوبة والهواء للنمو.","They need moisture and air to grow.","बढ़ने के लिए इन्हें नमी और हवा चाहिए।","বাড়ার জন্য আর্দ্রতা ও বাতাস দরকার।","Membutuhkan kelembapan dan udara untuk tumbuh."],["li","يمكنها النمو في درجات حرارة متنوعة، حتى في الثلاجة.","They can grow at various temperatures, even in the fridge.","ये कई तापमानों पर बढ़ सकते हैं, फ्रिज में भी।","এরা নানা তাপমাত্রায় বাড়তে পারে, এমনকি ফ্রিজেও।","Dapat tumbuh pada berbagai suhu, bahkan di dalam kulkas."],["li","تنتشر عن طريق نشر الأبواغ (تشبه الغبار) في الهواء.","They spread by releasing spores (like dust) into the air.","ये धूल जैसे बीजाणु हवा में छोड़कर फैलते हैं।","এরা ধুলোর মতো স্পোর বাতাসে ছড়িয়ে ছড়ায়।","Menyebar dengan melepaskan spora (seperti debu) ke udara."],["li","بعض أنواعها تنتج سموماً ضارة في الغذاء.","Some types produce harmful toxins in food.","इनकी कुछ किस्में भोजन में हानिकारक विष बनाती हैं।","এদের কিছু প্রজাতি খাবারে ক্ষতিকর টক্সিন তৈরি করে।","Beberapa jenis menghasilkan toksin berbahaya pada pangan."],["h3","الطفيليات","Parasites","परजीवी","পরজীবী","Parasit"],["li","لا تتأثر في الغذاء نفسه.","They are not affected within the food itself.","भोजन के भीतर ये प्रभावित नहीं होते।","খাবারের ভেতরে এরা প্রভাবিত হয় না।","Tidak berkembang di dalam pangan itu sendiri."],["li","تحتاج لمضيف حي (إنسان أو حيوان) للتكاثر.","They need a living host (human or animal) to multiply.","बढ़ने के लिए इन्हें जीवित मेज़बान (मनुष्य या जानवर) चाहिए।","বাড়ার জন্য একটি জীবন্ত পোষক (মানুষ বা প্রাণী) দরকার।","Membutuhkan inang hidup (manusia atau hewan) untuk berkembang biak."],["li","تنتقل عبر الغذاء من مضيف لآخر.","They pass through food from one host to another.","ये भोजन के ज़रिए एक मेज़बान से दूसरे तक पहुँचते हैं।","খাবারের মাধ্যমে এক পোষক থেকে অন্য পোষকে যায়।","Berpindah melalui pangan dari satu inang ke inang lain."],["li","يمكن أن تبقى في الغذاء لفترات طويلة دون أن تتكاثر.","They can remain in food for long periods without multiplying.","ये बिना बढ़े लंबे समय तक भोजन में रह सकते हैं।","বাড়া ছাড়াই দীর্ঘ সময় খাবারে থাকতে পারে।","Dapat bertahan dalam pangan dalam waktu lama tanpa berkembang biak."],["li","تُقتل بالطهي الجيد أو التجميد لفترات طويلة.","They are killed by thorough cooking or long freezing.","अच्छी तरह पकाने या लंबे समय तक जमाने से ये मर जाते हैं।","ভালোভাবে রান্না বা দীর্ঘ সময় হিমায়নে এরা মারা যায়।","Dimatikan dengan memasak sempurna atau pembekuan dalam waktu lama."],["n","ماذا يعني هذا لنا؟ (الجراثيم الأخرى): نظافتنا الشخصية مهمة جداً لمنع انتشار الفيروسات. الفطريات: نحتاج لفحص الغذاء بانتظام ومنع الرطوبة الزائدة. الطفيليات: طهي الغذاء جيداً وغسل الخضروات والفواكه مهم جداً.","What this means for us (other microbes): personal cleanliness is very important to prevent viruses from spreading. Moulds: we need to check food regularly and prevent excess moisture. Parasites: cooking food well and washing vegetables and fruit is very important.","हमारे लिए इसका अर्थ (अन्य सूक्ष्मजीव): वायरस फैलने से रोकने के लिए व्यक्तिगत स्वच्छता बहुत ज़रूरी है। फफूंद: भोजन की नियमित जांच करें और अतिरिक्त नमी से बचें। परजीवी: भोजन अच्छी तरह पकाना और सब्ज़ियाँ-फल धोना बहुत ज़रूरी है।","আমাদের জন্য এর অর্থ (অন্যান্য জীবাণু): ভাইরাস ছড়ানো রোধে ব্যক্তিগত পরিচ্ছন্নতা খুব গুরুত্বপূর্ণ। ছত্রাক: খাবার নিয়মিত পরীক্ষা করতে হবে এবং অতিরিক্ত আর্দ্রতা রোধ করতে হবে। পরজীবী: খাবার ভালো করে রান্না করা এবং সবজি-ফল ধোয়া খুব জরুরি।","Bagi kita (mikroba lain): kebersihan pribadi sangat penting untuk mencegah penyebaran virus. Kapang: kita perlu memeriksa pangan secara rutin dan mencegah kelembapan berlebih. Parasit: memasak pangan dengan baik serta mencuci sayur dan buah sangat penting."],["h2","أنتبه دائماً","Always pay attention","हमेशा सतर्क रहें","সবসময় সতর্ক থাকুন","Selalu perhatikan"],["li","يجب حفظ الغذاء النيء مغطى وفي الجزء السفلي من الثلاجة لمنع تساقط السوائل على الأغذية الأخرى.","Store raw food covered and on the bottom shelf of the fridge to prevent drips onto other foods.","कच्चा भोजन ढककर फ्रिज के निचले हिस्से में रखें, ताकि तरल दूसरे भोजन पर न टपके।","কাঁচা খাবার ঢেকে ফ্রিজের নিচের অংশে রাখুন, যাতে অন্য খাবারে তরল না পড়ে।","Simpan pangan mentah tertutup dan di rak bawah kulkas agar cairannya tidak menetes ke pangan lain."],["li","التلوث المباشر في الثلاجة يحدث من تلامس أو تقاطر السوائل من الغذاء النيء إلى المطهي.","Direct contamination in the fridge happens when liquids from raw food touch or drip onto cooked food.","फ्रिज में सीधा संदूषण तब होता है जब कच्चे भोजन के तरल पके भोजन को छूते या उस पर टपकते हैं।","ফ্রিজে সরাসরি দূষণ ঘটে যখন কাঁচা খাবারের তরল রান্না করা খাবার স্পর্শ করে বা তাতে চুঁইয়ে পড়ে।","Kontaminasi langsung di kulkas terjadi ketika cairan dari pangan mentah menyentuh atau menetes ke pangan matang."],["li","يجب تغطية الغذاء في كل الأوقات لحمايته من التلوث.","Food must be covered at all times to protect it from contamination.","संदूषण से बचाने के लिए भोजन हर समय ढका होना चाहिए।","দূষণ থেকে রক্ষা করতে খাবার সবসময় ঢাকা রাখতে হবে।","Pangan harus selalu ditutup untuk melindunginya dari kontaminasi."],["li","متداولو الغذاء المصدر الرئيسي للتلوث العرضي في منشآت الغذاء.","Food handlers are the main source of accidental contamination in food establishments.","खाद्य प्रतिष्ठानों में आकस्मिक संदूषण का मुख्य स्रोत भोजन संभालने वाले कर्मचारी हैं।","খাদ্য প্রতিষ্ঠানে আকস্মিক দূষণের প্রধান উৎস খাবার পরিচালনাকারীরা।","Penjamah pangan adalah sumber utama kontaminasi tidak sengaja di usaha pangan."]]},{"t":["تلوث الغذاء الكيميائي والفيزيائي","Chemical and physical food contamination","रासायनिक और भौतिक खाद्य संदूषण","রাসায়নিক ও ভৌত খাদ্য দূষণ","Kontaminasi kimia dan fisik pada pangan"],"r":[["h2","ما هي ملوثات الغذاء الكيميائية؟","What are chemical food contaminants?","रासायनिक खाद्य प्रदूषक क्या हैं?","রাসায়নিক খাদ্য দূষক কী?","Apa itu kontaminan kimia pada pangan?"],["p","مواد يمكن أن تسبب مشاكل صحية عند وصولها للغذاء وتناولها مثل: السموم، المواد الكيميائية الخطرة، وبقايا المواد الكيميائية في الغذاء.","Substances that can cause health problems when they reach food and are eaten, such as toxins, hazardous chemicals, and chemical residues in food.","ऐसे पदार्थ जो भोजन तक पहुँचने और खाए जाने पर स्वास्थ्य समस्याएँ पैदा कर सकते हैं, जैसे विष, खतरनाक रसायन और भोजन में रासायनिक अवशेष।","খাবারে পৌঁছে খেলে স্বাস্থ্য সমস্যা সৃষ্টি করতে পারে এমন পদার্থ, যেমন টক্সিন, বিপজ্জনক রাসায়নিক ও খাবারে রাসায়নিক অবশিষ্টাংশ।","Zat yang dapat menyebabkan masalah kesehatan saat masuk ke pangan dan dikonsumsi, seperti toksin, bahan kimia berbahaya, dan residu kimia dalam pangan."],["h3","كيف يؤثر تلوث الغذاء الكيميائي على عملنا وعلى المستهلكين؟","How does chemical contamination affect our work and consumers?","रासायनिक संदूषण हमारे काम और उपभोक्ताओं को कैसे प्रभावित करता है?","রাসায়নিক দূষণ আমাদের কাজ ও ভোক্তাদের কীভাবে প্রভাবিত করে?","Bagaimana kontaminasi kimia memengaruhi pekerjaan kita dan konsumen?"],["li","التسمم الغذائي: يحدث بسرعة بعد تناول الغذاء الملوث. مثال: تلوث الغذاء بمواد التنظيف أو المبيدات الحشرية.","Food poisoning: occurs quickly after eating contaminated food. Example: food contaminated with cleaning materials or insecticides.","खाद्य विषाक्तता: दूषित भोजन खाने के तुरंत बाद होती है। उदाहरण: सफाई सामग्री या कीटनाशक से दूषित भोजन।","খাদ্যে বিষক্রিয়া: দূষিত খাবার খাওয়ার পরপরই ঘটে। উদাহরণ: পরিষ্কারক বা কীটনাশকে দূষিত খাবার।","Keracunan pangan: terjadi cepat setelah makan pangan terkontaminasi. Contoh: pangan tercemar bahan pembersih atau insektisida."],["li","الأمراض المزمنة: تحدث بعد تناول كميات قليلة من المواد الكيميائية لفترة طويلة قد تسبب أمراضاً خطيرة مثل السرطان.","Chronic illness: occurs after eating small amounts of chemicals over a long period, which may cause serious diseases such as cancer.","दीर्घकालिक रोग: लंबे समय तक थोड़ी मात्रा में रसायन खाने से होता है, जिससे कैंसर जैसे गंभीर रोग हो सकते हैं।","দীর্ঘমেয়াদি রোগ: দীর্ঘ সময় অল্প পরিমাণ রাসায়নিক খাওয়ার ফলে হয়, যা ক্যানসারের মতো গুরুতর রোগ ঘটাতে পারে।","Penyakit kronis: terjadi setelah mengonsumsi bahan kimia dalam jumlah kecil dalam waktu lama, yang dapat menyebabkan penyakit serius seperti kanker."],["h3","ما هي مصادر ملوثات الغذاء الكيميائية؟","What are the sources of chemical food contaminants?","रासायनिक खाद्य प्रदूषकों के स्रोत क्या हैं?","রাসায়নিক খাদ্য দূষকের উৎস কী?","Apa sumber kontaminan kimia pada pangan?"],["li","الممارسات الخاطئة في التعامل مع الغذاء.","Incorrect handling practices.","भोजन संभालने की गलत प्रथाएँ।","খাবার পরিচালনার ভুল পদ্ধতি।","Praktik penanganan pangan yang keliru."],["li","المضافات الغذائية.","Food additives.","खाद्य योजक।","খাদ্য সংযোজন।","Bahan tambahan pangan."],["li","الحاويات والأواني.","Containers and utensils.","कंटेनर और बर्तन।","পাত্র ও বাসন।","Wadah dan peralatan."],["li","التخزين والشحن.","Storage and transport.","भंडारण और परिवहन।","সংরক্ষণ ও পরিবহন।","Penyimpanan dan pengangkutan."],["li","عمليات التنظيف والصيانة (زيوت، مواد تنظيف).","Cleaning and maintenance operations (oils, cleaning materials).","सफाई और रखरखाव (तेल, सफाई सामग्री)।","পরিষ্কার ও রক্ষণাবেক্ষণ (তেল, পরিষ্কারক)।","Operasi pembersihan dan perawatan (minyak, bahan pembersih)."],["li","المواد الأولية (العناصر الكيميائية الثقيلة).","Raw materials (heavy metal elements).","कच्चा माल (भारी धात्विक तत्व)।","কাঁচামাল (ভারী ধাতব উপাদান)।","Bahan baku (unsur logam berat)."],["li","زيوت القلي: لا تستخدمها لفترات طويلة. كل مرة تسخنها تكونت مواد كيميائية ضارة.","Frying oils: do not use them for long periods. Each time they are heated, harmful chemicals form.","तलने का तेल: लंबे समय तक इस्तेमाल न करें। हर बार गर्म करने पर हानिकारक रसायन बनते हैं।","ভাজার তেল: দীর্ঘ সময় ব্যবহার করবেন না। প্রতিবার গরম করলে ক্ষতিকর রাসায়নিক তৈরি হয়।","Minyak goreng: jangan dipakai terlalu lama. Setiap kali dipanaskan, terbentuk bahan kimia berbahaya."],["li","المبيدات الحشرية.","Insecticides.","कीटनाशक।","কীটনাশক।","Insektisida."],["h3","كيف تصل ملوثات الغذاء الكيميائية إلى الغذاء؟","How do chemical food contaminants reach food?","रासायनिक खाद्य प्रदूषक भोजन तक कैसे पहुँचते हैं?","রাসায়নিক খাদ্য দূষক খাবারে কীভাবে পৌঁছায়?","Bagaimana kontaminan kimia mencapai pangan?"],["li","بدون قصد (عن طريق الخطأ)، مثل: وصول مواد التنظيف أو زيوت الآلات إلى الغذاء.","Unintentionally (by mistake), such as cleaning materials or machine oils reaching food.","अनजाने में (गलती से), जैसे सफाई सामग्री या मशीन का तेल भोजन तक पहुँचना।","অনিচ্ছাকৃতভাবে (ভুলক্রমে), যেমন পরিষ্কারক বা যন্ত্রের তেল খাবারে পৌঁছানো।","Tanpa sengaja (karena kesalahan), misalnya bahan pembersih atau minyak mesin masuk ke pangan."],["li","بقصد (متعمد)، مثل: إضافة مواد كيميائية للغذاء بكميات أكثر من المسموح.","Intentionally, such as adding chemicals to food in quantities greater than permitted.","जानबूझकर, जैसे भोजन में अनुमति से अधिक मात्रा में रसायन मिलाना।","ইচ্ছাকৃতভাবে, যেমন অনুমোদিত মাত্রার বেশি রাসায়নিক খাবারে মেশানো।","Dengan sengaja, misalnya menambahkan bahan kimia ke pangan melebihi batas yang diizinkan."],["n","ماذا يعني هذا لنا؟: كل شخص يتعامل مع المواد الكيميائية بحذر، فهو يعرف أن كل مادة تحتاج إلى التعامل الصحيح. نعرف أنواع المواد الكيميائية، وكيفية تخزينها، ومتى تكون الحاجة إليها. عند الشك في وجود تلوث كيميائي، نخبر المشرف فوراً.","What this means for us: everyone handles chemicals with care, knowing each substance needs correct handling. We know the types of chemicals, how to store them and when they are needed. If we suspect chemical contamination, we tell the supervisor immediately.","हमारे लिए इसका अर्थ: हर कोई रसायनों को सावधानी से संभालता है, यह जानते हुए कि हर पदार्थ को सही तरीके से संभालना ज़रूरी है। हम रसायनों के प्रकार, उनके भंडारण और ज़रूरत का समय जानते हैं। रासायनिक संदूषण का शक हो तो तुरंत पर्यवेक्षक को बताएँ।","আমাদের জন্য এর অর্থ: প্রত্যেকে রাসায়নিক সতর্কতার সঙ্গে পরিচালনা করে, জানে প্রতিটি পদার্থের সঠিক ব্যবহার দরকার। রাসায়নিকের ধরন, সংরক্ষণ ও প্রয়োজনের সময় আমরা জানি। রাসায়নিক দূষণের সন্দেহ হলে অবিলম্বে সুপারভাইজারকে জানাই।","Bagi kita: setiap orang menangani bahan kimia dengan hati-hati, sadar bahwa setiap zat perlu penanganan yang benar. Kita mengenali jenis bahan kimia, cara menyimpannya, dan kapan dibutuhkan. Jika curiga ada kontaminasi kimia, segera laporkan kepada supervisor."],["h2","التحكم في تلوث الغذاء الكيميائي","Controlling chemical food contamination","रासायनिक खाद्य संदूषण पर नियंत्रण","রাসায়নিক খাদ্য দূষণ নিয়ন্ত্রণ","Mengendalikan kontaminasi kimia pada pangan"],["p","التحكم في الملوثات الكيميائية أمر ضروري لضمان سلامة الغذاء وصحة المستهلكين. فيما يلي الطرق الرئيسية للتحكم في الملوثات الكيميائية ومنع وصولها للغذاء:","Controlling chemical contaminants is essential to ensure food safety and consumers' health. The main ways to control chemical contaminants and prevent them reaching food are:","रासायनिक प्रदूषकों पर नियंत्रण भोजन की सुरक्षा और उपभोक्ताओं के स्वास्थ्य के लिए अनिवार्य है। रासायनिक प्रदूषकों पर नियंत्रण और उन्हें भोजन तक पहुँचने से रोकने के मुख्य तरीके:","খাদ্য নিরাপত্তা ও ভোক্তার স্বাস্থ্য নিশ্চিত করতে রাসায়নিক দূষক নিয়ন্ত্রণ অপরিহার্য। রাসায়নিক দূষক নিয়ন্ত্রণ ও খাবারে পৌঁছানো ঠেকানোর প্রধান উপায়:","Pengendalian kontaminan kimia sangat penting untuk menjamin keamanan pangan dan kesehatan konsumen. Cara utama mengendalikan kontaminan kimia dan mencegah masuk ke pangan:"],["h3","المواد الأولية","Raw materials","कच्चा माल","কাঁচামাল","Bahan baku"],["p","التحقق من سلامة المواد الأولية عند استلامها. إبلاغ المشرف عن أي مشكلة في المواد الأولية.","Check the safety of raw materials on receipt. Report any problem with raw materials to the supervisor.","प्राप्ति पर कच्चे माल की सुरक्षा जांचें। कच्चे माल की किसी भी समस्या की सूचना पर्यवेक्षक को दें।","পাওয়ার সময় কাঁচামালের নিরাপত্তা যাচাই করুন। কাঁচামালের যেকোনো সমস্যা সুপারভাইজারকে জানান।","Periksa keamanan bahan baku saat diterima. Laporkan setiap masalah bahan baku kepada supervisor."],["h3","التعامل مع المواد الكيميائية","Handling chemicals","रसायनों को संभालना","রাসায়নিক পরিচালনা","Menangani bahan kimia"],["p","تخزين المواد الكيميائية في الأماكن المخصصة. استخدام العبوات الأصلية للمواد الكيميائية. اتباع تعليمات الشركة المصنعة للمواد الكيميائية.","Store chemicals in designated areas. Use the original containers for chemicals. Follow the manufacturer's instructions for chemicals.","रसायनों को निर्धारित स्थानों पर रखें। रसायनों के मूल पैकेट इस्तेमाल करें। निर्माता के निर्देशों का पालन करें।","রাসায়নিক নির্ধারিত স্থানে সংরক্ষণ করুন। রাসায়নিকের আসল পাত্র ব্যবহার করুন। প্রস্তুতকারকের নির্দেশনা মেনে চলুন।","Simpan bahan kimia di tempat yang ditentukan. Gunakan wadah asli bahan kimia. Ikuti petunjuk pabrikan bahan kimia."],["h3","المضافات الغذائية","Food additives","खाद्य योजक","খাদ্য সংযোজন","Bahan tambahan pangan"],["p","استخدام المضافات المعتمدة فقط. اتباع الإرشادات بدقة (الكمية، الوقت، طريقة الإضافة).","Use only approved additives. Follow the guidance precisely (quantity, time, method of addition).","केवल स्वीकृत योजक इस्तेमाल करें। निर्देशों का सटीक पालन करें (मात्रा, समय, मिलाने का तरीका)।","শুধু অনুমোদিত সংযোজন ব্যবহার করুন। নির্দেশনা নিখুঁতভাবে মেনে চলুন (পরিমাণ, সময়, মেশানোর পদ্ধতি)।","Gunakan hanya bahan tambahan yang disetujui. Ikuti petunjuk dengan tepat (jumlah, waktu, cara penambahan)."],["h3","الحاويات والأواني","Containers and utensils","कंटेनर और बर्तन","পাত্র ও বাসন","Wadah dan peralatan"],["p","عدم استخدام أواني تتفاعل مع الغذاء. تجنب استخدام الحاويات المخصصة للمواد الكيميائية للغذاء فقط. عدم استخدام زجاجات المياه للمواد الكيميائية. عدم ترك العلب المعدنية المفتوحة في الثلاجة.","Do not use utensils that react with food. Avoid using containers meant for chemicals for food. Do not use water bottles for chemicals. Do not leave open metal cans in the fridge.","ऐसे बर्तन न इस्तेमाल करें जो भोजन से प्रतिक्रिया करें। रसायनों के लिए बने कंटेनर भोजन के लिए न लें। पानी की बोतलों में रसायन न रखें। खुले धातु के डिब्बे फ्रिज में न छोड़ें।","খাবারের সঙ্গে বিক্রিয়া করে এমন বাসন ব্যবহার করবেন না। রাসায়নিকের পাত্র খাবারের জন্য ব্যবহার করবেন না। পানির বোতলে রাসায়নিক রাখবেন না। খোলা ধাতব টিন ফ্রিজে রাখবেন না।","Jangan gunakan peralatan yang bereaksi dengan pangan. Hindari wadah bahan kimia untuk pangan. Jangan gunakan botol air untuk bahan kimia. Jangan biarkan kaleng logam terbuka di kulkas."],["h3","عمليات الصيانة","Maintenance operations","रखरखाव संचालन","রক্ষণাবেক্ষণ","Operasi perawatan"],["p","إبلاغ المشرف عن أي مشاكل في المعدات. عدم محاولة إصلاح المعدات دون تدريب مناسب.","Report any equipment problems to the supervisor. Do not try to repair equipment without suitable training.","उपकरण की किसी भी समस्या की सूचना पर्यवेक्षक को दें। उचित प्रशिक्षण के बिना उपकरण ठीक करने की कोशिश न करें।","যন্ত্রপাতির যেকোনো সমস্যা সুপারভাইজারকে জানান। উপযুক্ত প্রশিক্ষণ ছাড়া যন্ত্র মেরামতের চেষ্টা করবেন না।","Laporkan masalah peralatan kepada supervisor. Jangan mencoba memperbaiki peralatan tanpa pelatihan yang sesuai."],["h3","التخزين والنقل","Storage and transport","भंडारण और परिवहन","সংরক্ষণ ও পরিবহন","Penyimpanan dan pengangkutan"],["p","تخزين ونقل المواد الكيميائية بعيداً عن الغذاء.","Store and transport chemicals away from food.","रसायनों को भोजन से दूर रखें और ले जाएँ।","রাসায়নিক খাবার থেকে দূরে সংরক্ষণ ও পরিবহন করুন।","Simpan dan angkut bahan kimia jauh dari pangan."],["h3","استخدام المبيدات الحشرية","Using insecticides","कीटनाशकों का उपयोग","কীটনাশক ব্যবহার","Penggunaan insektisida"],["p","استخدام المبيدات بعيداً عن الغذاء. تغطية الغذاء المكشوف قبل الرش. غسل السطوح جيداً بعد الرش. إبلاغ المشرف عن أي غذاء يُشتبه بتلوثه.","Use pesticides far from food. Cover exposed food before spraying. Wash surfaces well after spraying. Report any food suspected of contamination to the supervisor.","कीटनाशक भोजन से दूर इस्तेमाल करें। छिड़काव से पहले खुला भोजन ढकें। छिड़काव के बाद सतहें अच्छी तरह धोएँ। दूषित होने का शक वाले भोजन की सूचना पर्यवेक्षक को दें।","খাবার থেকে দূরে কীটনাশক ব্যবহার করুন। স্প্রে করার আগে খোলা খাবার ঢেকে দিন। স্প্রের পর পৃষ্ঠ ভালো করে ধুন। দূষণের সন্দেহ হলে যেকোনো খাবার সুপারভাইজারকে জানান।","Gunakan pestisida jauh dari pangan. Tutup pangan yang terbuka sebelum disemprot. Cuci permukaan dengan baik setelah disemprot. Laporkan pangan yang diduga tercemar kepada supervisor."],["n","تنبيه دائماً: تخزين المواد الكيميائية أو وضعها على مقربة من الغذاء أو المعدات أو الأسطح التي تتصل بالغذاء يمكن أن يسبب التلوث الكيميائي.","Always remember: storing chemicals or placing them near food, equipment or surfaces that contact food can cause chemical contamination.","हमेशा याद रखें: रसायनों को भोजन, उपकरणों या भोजन के संपर्क वाली सतहों के पास रखने से रासायनिक संदूषण हो सकता है।","সবসময় মনে রাখুন: রাসায়নিক খাবার, যন্ত্রপাতি বা খাবারের সংস্পর্শে আসা পৃষ্ঠের কাছে রাখলে রাসায়নিক দূষণ হতে পারে।","Selalu ingat: menyimpan bahan kimia atau meletakkannya dekat pangan, peralatan, atau permukaan yang bersentuhan dengan pangan dapat menyebabkan kontaminasi kimia."],["h2","ما هي ملوثات الغذاء الفيزيائية؟","What are physical food contaminants?","भौतिक खाद्य प्रदूषक क्या हैं?","ভৌত খাদ্য দূষক কী?","Apa itu kontaminan fisik pada pangan?"],["p","أي شيء غريب وضار يدخل الغذاء، عادة ما تكون أشياء يمكن رؤيتها أو الشعور بها.","Any foreign and harmful object that gets into food, usually things that can be seen or felt.","भोजन में घुसने वाली कोई भी बाहरी और हानिकारक वस्तु, आमतौर पर वे चीज़ें जिन्हें देखा या महसूस किया जा सकता है।","খাবারে ঢুকে পড়া যেকোনো বিদেশি ও ক্ষতিকর বস্তু, সাধারণত যা দেখা বা অনুভব করা যায়।","Benda asing dan berbahaya yang masuk ke pangan, biasanya benda yang dapat dilihat atau dirasakan."],["h3","كيف يؤثر الغذاء الفيزيائي على عملنا وعلى المستهلكين؟","How does physical contamination affect our work and consumers?","भौतिक संदूषण हमारे काम और उपभोक्ताओं को कैसे प्रभावित करता है?","ভৌত দূষণ আমাদের কাজ ও ভোক্তাদের কীভাবে প্রভাবিত করে?","Bagaimana kontaminasi fisik memengaruhi pekerjaan kita dan konsumen?"],["li","المستهلكون يلاحظونها بسهولة أثناء الأكل، وتسبب استياء وشكاوى فورية.","Consumers notice them easily while eating, causing immediate dissatisfaction and complaints.","उपभोक्ता इन्हें खाते समय आसानी से देख लेते हैं, जिससे तुरंत असंतोष और शिकायतें होती हैं।","ভোক্তারা খাওয়ার সময় সহজে লক্ষ্য করেন, যা তাৎক্ষণিক অসন্তোষ ও অভিযোগ ঘটায়।","Konsumen mudah menyadarinya saat makan, menimbulkan ketidakpuasan dan keluhan segera."],["li","قد تسبب إصابات مثل: جروح في الفم، نزيف، اختناق، كسر في الأسنان.","They may cause injuries such as: mouth cuts, bleeding, choking, broken teeth.","इनसे चोटें लग सकती हैं, जैसे मुंह में कट, खून बहना, दम घुटना, दांत टूटना।","এতে আঘাত হতে পারে, যেমন মুখে কাটা, রক্তপাত, শ্বাসরোধ, দাঁত ভাঙা।","Dapat menyebabkan cedera seperti luka mulut, pendarahan, tersedak, gigi patah."],["li","قد تنقل أمراضاً، بعضها يحمل بكتيريا أو مواد كيميائية ضارة.","They may transmit diseases, some carrying bacteria or harmful chemicals.","ये बीमारियाँ फैला सकते हैं, कुछ में जीवाणु या हानिकारक रसायन होते हैं।","এরা রোগ ছড়াতে পারে, কিছুতে ব্যাকটেরিয়া বা ক্ষতিকর রাসায়নিক থাকে।","Dapat menularkan penyakit, sebagian membawa bakteri atau bahan kimia berbahaya."],["h3","ما هي مصادر ملوثات الغذاء الفيزيائية؟","What are the sources of physical food contaminants?","भौतिक खाद्य प्रदूषकों के स्रोत क्या हैं?","ভৌত খাদ্য দূষকের উৎস কী?","Apa sumber kontaminan fisik pada pangan?"],["li","العاملون: مثل الشعر والساعات واليد وحلي.","Workers: such as hair, watches, hands and jewellery.","कर्मचारी: जैसे बाल, घड़ियाँ, हाथ और गहने।","কর্মী: যেমন চুল, ঘড়ি, হাত ও গয়না।","Pekerja: seperti rambut, jam tangan, tangan, dan perhiasan."],["li","المعدات والأدوات: مثل قطع معدنية صغيرة.","Equipment and tools: such as small metal pieces.","उपकरण और औज़ार: जैसे छोटे धातु के टुकड़े।","যন্ত্র ও সরঞ্জাম: যেমন ছোট ধাতব টুকরো।","Peralatan dan perkakas: seperti potongan logam kecil."],["li","المواد الأولية: مثل العظام في اللحم.","Raw materials: such as bones in meat.","कच्चा माल: जैसे मांस में हड्डियाँ।","কাঁচামাল: যেমন মাংসে হাড়।","Bahan baku: seperti tulang dalam daging."],["li","بيئة العمل: مثل الغبار أو قطع الطلاء.","Work environment: such as dust or paint flakes.","कार्य वातावरण: जैसे धूल या पेंट के टुकड़े।","কর্মপরিবেশ: যেমন ধুলো বা রঙের টুকরো।","Lingkungan kerja: seperti debu atau serpihan cat."],["li","مواد التعبئة: مثل قطع بلاستيكية.","Packaging materials: such as plastic pieces.","पैकिंग सामग्री: जैसे प्लास्टिक के टुकड़े।","প্যাকেজিং সামগ্রী: যেমন প্লাস্টিকের টুকরো।","Bahan kemasan: seperti potongan plastik."],["li","الحشرات والقوارض: مثل بقايا الحشرات.","Insects and rodents: such as insect remains.","कीड़े और कृंतक: जैसे कीड़ों के अवशेष।","পোকামাকড় ও ইঁদুর: যেমন পোকার অবশেষ।","Serangga dan hewan pengerat: seperti sisa serangga."],["h3","كيف تصل ملوثات الغذاء الفيزيائية إلى الغذاء؟","How do physical contaminants reach food?","भौतिक प्रदूषक भोजन तक कैसे पहुँचते हैं?","ভৌত দূষক খাবারে কীভাবে পৌঁছায়?","Bagaimana kontaminan fisik mencapai pangan?"],["li","موجودة طبيعياً في السمك: مثل العظام.","Naturally present in fish: such as bones.","मछली में स्वाभाविक रूप से मौजूद: जैसे हड्डियाँ।","মাছে স্বাভাবিকভাবে থাকে: যেমন কাঁটা।","Secara alami ada pada ikan: seperti tulang."],["li","أثناء الإنتاج الأولي: مثل الأتربة في الخضروات.","During primary production: such as soil on vegetables.","प्राथमिक उत्पादन के दौरान: जैसे सब्ज़ियों पर मिट्टी।","প্রাথমিক উৎপাদনের সময়: যেমন সবজিতে মাটি।","Selama produksi primer: seperti tanah pada sayuran."],["li","أثناء التجهيز والتحضير: مثل قطع زجاج أو معدن.","During preparation: such as pieces of glass or metal.","तैयारी के दौरान: जैसे कांच या धातु के टुकड़े।","প্রস্তুতির সময়: যেমন কাঁচ বা ধাতুর টুকরো।","Selama persiapan: seperti pecahan kaca atau logam."],["n","ماذا يعني هذا لنا؟ (ملوثات فيزيائية): علينا أن نكون منتبهين دائماً لاحتمال وجود ملوثات فيزيائية في كل مرحلة من مراحل تحضير الغذاء. الإبلاغ الفوري عن أي مشكلة أو خلل جزء أساسي من الحفاظ على سلامة الغذاء.","What this means for us (physical contaminants): we must always be alert to the possibility of physical contaminants at every stage of food preparation. Reporting any problem or fault immediately is a basic part of keeping food safe.","हमारे लिए इसका अर्थ (भौतिक प्रदूषक): भोजन तैयार करने के हर चरण में भौतिक प्रदूषकों की संभावना के प्रति हमें सदा सतर्क रहना होगा। किसी भी समस्या की तुरंत सूचना देना भोजन की सुरक्षा का मूल हिस्सा है।","আমাদের জন্য এর অর্থ (ভৌত দূষক): খাবার প্রস্তুতির প্রতিটি ধাপে ভৌত দূষকের সম্ভাবনার বিষয়ে আমাদের সবসময় সতর্ক থাকতে হবে। যেকোনো সমস্যা বা ত্রুটি তাৎক্ষণিক জানানো খাদ্য নিরাপত্তার মূল অংশ।","Bagi kita (kontaminan fisik): kita harus selalu waspada terhadap kemungkinan kontaminan fisik di setiap tahap persiapan pangan. Melaporkan setiap masalah atau kerusakan dengan segera adalah bagian dasar menjaga keamanan pangan."],["h2","التحكم في تلوث الغذاء الفيزيائي","Controlling physical food contamination","भौतिक खाद्य संदूषण पर नियंत्रण","ভৌত খাদ্য দূষণ নিয়ন্ত্রণ","Mengendalikan kontaminasi fisik pada pangan"],["h3","مواد التعبئة والتغليف","Packaging materials","पैकिंग सामग्री","প্যাকেজিং সামগ্রী","Bahan kemasan"],["p","إزالة الغلاف الخارجي بعيداً عن مناطق إعداد الغذاء، وإعادة تعبئة الغذاء في حاويات نظيفة ومحكمة الإغلاق.","Remove outer packaging away from food preparation areas, and repack food in clean, tightly sealed containers.","भोजन तैयार करने के क्षेत्र से दूर बाहरी पैकिंग हटाएँ, और भोजन को साफ़ व कसकर बंद डिब्बों में दोबारा रखें।","খাবার প্রস্তুতির জায়গা থেকে দূরে বাইরের প্যাকেজিং সরান, এবং খাবার পরিষ্কার ও শক্ত করে বন্ধ পাত্রে আবার রাখুন।","Buang kemasan luar jauh dari area persiapan pangan, dan kemas ulang pangan dalam wadah bersih yang tertutup rapat."],["h3","المواد الأولية","Raw materials","कच्चा माल","কাঁচামাল","Bahan baku"],["p","فحص المواد الأولية بدقة عند استلامها، وتصفية السوائل وغربلة الحبوب لتخلص من الشوائب.","Carefully inspect raw materials on receipt, and drain liquids and sieve grains to remove impurities.","प्राप्ति पर कच्चे माल की बारीकी से जांच करें, और अशुद्धियाँ हटाने के लिए तरल छानें और अनाज चालें।","পাওয়ার সময় কাঁচামাল ভালোভাবে পরীক্ষা করুন, এবং অমেধ্য সরাতে তরল ঝরান ও শস্য চালুন।","Periksa bahan baku dengan teliti saat diterima, dan tiriskan cairan serta ayak biji-bijian untuk membuang kotoran."],["h3","المعدات والأدوات","Equipment and tools","उपकरण और औज़ार","যন্ত্র ও সরঞ্জাম","Peralatan dan perkakas"],["p","تنظيف وتطهير المعدات بعد كل استخدام، والإبلاغ عن أي معدات تالفة. عدم استخدام الأدوات الخشبية أو الزجاجية في المناطق المخصصة لتحضير الغذاء. والإبلاغ فوراً عن أي كسر في الزجاج أو الأدوات.","Clean and sanitise equipment after every use, and report any damaged equipment. Do not use wooden or glass tools in food preparation areas. Report any breakage of glass or tools immediately.","हर इस्तेमाल के बाद उपकरण साफ़ और सैनिटाइज़ करें, और क्षतिग्रस्त उपकरण की सूचना दें। भोजन तैयार करने के क्षेत्र में लकड़ी या कांच के औज़ार इस्तेमाल न करें। कांच या औज़ार टूटने की तुरंत सूचना दें।","প্রতিবার ব্যবহারের পর যন্ত্র পরিষ্কার ও জীবাণুমুক্ত করুন, এবং ক্ষতিগ্রস্ত যন্ত্রের খবর দিন। খাবার প্রস্তুতির জায়গায় কাঠ বা কাঁচের সরঞ্জাম ব্যবহার করবেন না। কাঁচ বা সরঞ্জাম ভাঙলে তাৎক্ষণিক জানান।","Bersihkan dan sanitasi peralatan setelah setiap penggunaan, dan laporkan peralatan yang rusak. Jangan gunakan perkakas kayu atau kaca di area persiapan pangan. Laporkan segera jika ada kaca atau perkakas pecah."],["h3","التخزين الآمن","Safe storage","सुरक्षित भंडारण","নিরাপদ সংরক্ষণ","Penyimpanan yang aman"],["p","تخزين الغذاء في حاويات محكمة الإغلاق وتجنب تخزين الغذاء على الأرض مباشرة.","Store food in tightly closed containers and avoid storing food directly on the floor.","भोजन को कसकर बंद डिब्बों में रखें और सीधे फ़र्श पर रखने से बचें।","খাবার শক্ত করে বন্ধ পাত্রে রাখুন এবং সরাসরি মেঝেতে রাখা এড়ান।","Simpan pangan dalam wadah tertutup rapat dan hindari menyimpan pangan langsung di lantai."],["h3","بيئة العمل","Work environment","कार्य वातावरण","কর্মপরিবেশ","Lingkungan kerja"],["p","تنظيف مكان العمل باستمرار، والإبلاغ فوراً عن أي تلف. تنظيف أدوات النظافة وتطهيرها ونظافتها بعد الاستخدام والتأكد من نظافتها، وتخزينها بعيداً عن الغذاء.","Keep the workplace clean at all times, and report any damage immediately. Clean, sanitise and dry cleaning tools after use, and store them away from food.","कार्यस्थल हमेशा साफ़ रखें, और कोई भी क्षति तुरंत बताएँ। इस्तेमाल के बाद सफाई के औज़ार साफ़, सैनिटाइज़ और सुखाकर भोजन से दूर रखें।","কর্মস্থল সবসময় পরিষ্কার রাখুন, এবং যেকোনো ক্ষতি তাৎক্ষণিক জানান। ব্যবহারের পর পরিষ্কারের সরঞ্জাম পরিষ্কার, জীবাণুমুক্ত ও শুকিয়ে খাবার থেকে দূরে রাখুন।","Jaga tempat kerja tetap bersih, dan laporkan setiap kerusakan segera. Bersihkan, sanitasi, dan keringkan alat kebersihan setelah digunakan, lalu simpan jauh dari pangan."],["h3","متداولو الغذاء","Food handlers","खाद्य संभालने वाले कर्मचारी","খাবার পরিচালনাকারী","Penjamah pangan"],["p","ارتداء ملابس واقية وغطاء للرأس، بعيداً عن الغذاء. عدم الإبلاغ عن الجروح أو الأشياء المفقودة. عدم ارتداء المجوهرات أثناء العمل. استخدام ضمادات ملونة.","Wear protective clothing and a head covering, away from food. Do not fail to report wounds or missing items. Do not wear jewellery while working. Use coloured dressings.","सुरक्षात्मक कपड़े और सिर ढकना पहनें, और भोजन से दूर रहें। घाव या गुम वस्तुओं की सूचना न देना गलत है। काम के दौरान गहने न पहनें। रंगीन पट्टी इस्तेमाल करें।","সুরক্ষামূলক পোশাক ও মাথার আবরণ পরুন, খাবার থেকে দূরে থাকুন। ক্ষত বা হারানো জিনিসের খবর না দেওয়া ঠিক নয়। কাজের সময় গয়না পরবেন না। রঙিন ব্যান্ডেজ ব্যবহার করুন।","Kenakan pakaian pelindung dan penutup kepala, jauhkan dari pangan. Jangan tidak melaporkan luka atau benda yang hilang. Jangan memakai perhiasan saat bekerja. Gunakan plester berwarna."],["n","ماذا يعني هذا لنا؟: ملابسنا النظيفة تمنع التلوث وتحد من انتقال البكتيريا للغذاء. مظهرنا النظيف يُرضي المستهلكين والعملاء، ونُظهر اهتمامنا بسلامة الغذاء. نغطي رؤوسنا لمنع سقوط الشعر في الغذاء. نتجنب الحلي لمنع تلوث الغذاء بالبكتيريا ومنع سقوط الحلي في الغذاء. نحمي الغذاء حتى خارج مكان العمل، ولا نتحرك بملابس العمل خارج مناطق التعامل مع الغذاء، ونحافظ على نظافة ملابس العمل دائماً.","What this means for us: clean clothing prevents contamination and limits the transfer of bacteria to food. A clean appearance pleases consumers and customers and shows our care for food safety. We cover our heads to stop hair falling into food. We avoid jewellery to prevent bacterial contamination and to stop it falling into food. We protect food even outside the workplace, do not move in work clothes outside food handling areas, and always keep work clothes clean.","हमारे लिए इसका अर्थ: साफ़ कपड़े संदूषण रोकते हैं और जीवाणुओं को भोजन तक पहुँचने से सीमित करते हैं। साफ़ रूप उपभोक्ताओं को संतुष्ट करता है और खाद्य सुरक्षा के प्रति हमारी चिंता दिखाता है। बालों को भोजन में गिरने से रोकने के लिए सिर ढकते हैं। गहने पहनने से बचते हैं ताकि संदूषण और उनके गिरने का खतरा न रहे। भोजन की सुरक्षा कार्यस्थल से बाहर भी करते हैं, काम के कपड़ों में भोजन-क्षेत्र से बाहर नहीं जाते, और कपड़े हमेशा साफ़ रखते हैं।","আমাদের জন্য এর অর্থ: পরিষ্কার পোশাক দূষণ রোধ করে এবং ব্যাকটেরিয়া খাবারে যাওয়া সীমিত করে। পরিষ্কার চেহারা ভোক্তা ও গ্রাহককে খুশি করে এবং খাদ্য নিরাপত্তায় আমাদের যত্ন দেখায়। চুল খাবারে না পড়তে মাথা ঢাকি। দূষণ ও গয়না পড়ে যাওয়া ঠেকাতে গয়না পরি না। কর্মস্থলের বাইরেও খাবার রক্ষা করি, খাবার-এলাকার বাইরে কাজের পোশাকে যাই না, এবং কাজের পোশাক সবসময় পরিষ্কার রাখি।","Bagi kita: pakaian bersih mencegah kontaminasi dan membatasi perpindahan bakteri ke pangan. Penampilan bersih menyenangkan konsumen dan menunjukkan kepedulian kita pada keamanan pangan. Kita menutup kepala agar rambut tidak jatuh ke pangan. Kita menghindari perhiasan agar tidak mencemari dan tidak terjatuh ke pangan. Kita menjaga pangan bahkan di luar tempat kerja, tidak keluar area pangan dengan pakaian kerja, dan selalu menjaga pakaian kerja tetap bersih."]]},{"t":["فساد الأغذية","Food spoilage","भोजन का खराब होना","খাবার নষ্ট হওয়া","Kerusakan pangan"],"r":[["h2","ما هو فساد الأغذية؟","What is food spoilage?","भोजन का खराब होना क्या है?","খাবার নষ্ট হওয়া কী?","Apa itu kerusakan pangan?"],["p","فساد الغذاء هو عملية تدهور أو تحلل الغذاء تؤدي إلى:","Food spoilage is a process of deterioration or breakdown of food that leads to:","भोजन का खराब होना एक ऐसी प्रक्रिया है जिसमें भोजन बिगड़ता या टूटता है और इससे:","খাবার নষ্ট হওয়া এমন একটি প্রক্রিয়া যাতে খাবার খারাপ হয় বা ভেঙে যায় এবং:","Kerusakan pangan adalah proses memburuknya atau terurainya pangan yang menyebabkan:"],["li","تغير اللون، الرائحة، الملمس، والطعم.","Changes in colour, smell, texture and taste.","रंग, गंध, बनावट और स्वाद में बदलाव।","রং, গন্ধ, গঠন ও স্বাদের পরিবর্তন।","Perubahan warna, bau, tekstur, dan rasa."],["li","تحول في الغذاء يجعله غير صالح للأكل.","A change that makes the food unfit to eat.","ऐसा बदलाव जिससे भोजन खाने योग्य नहीं रहता।","এমন পরিবর্তন যাতে খাবার খাওয়ার অনুপযুক্ত হয়।","Perubahan yang membuat pangan tidak layak dimakan."],["h3","أنواع الأغذية حسب سرعة الفساد","Types of food by spoilage speed","खराब होने की गति के अनुसार भोजन के प्रकार","নষ্ট হওয়ার গতি অনুযায়ী খাবারের ধরন","Jenis pangan menurut kecepatan kerusakan"],["li","1. سريعة الفساد: مثل اللبن، السمك، اللحوم، الخضروات الورقية.","1. Highly perishable: such as milk, fish, meat and leafy vegetables.","1. जल्दी खराब होने वाले: जैसे दूध, मछली, मांस और हरी पत्तेदार सब्ज़ियाँ।","১. দ্রুত নষ্ট হয়: যেমন দুধ, মাছ, মাংস ও পাতাযুক্ত সবজি।","1. Mudah rusak: seperti susu, ikan, daging, dan sayuran berdaun."],["li","2. بطيئة الفساد: مثل البطاطس، الجزر، التفاح، البصل.","2. Slowly perishable: such as potatoes, carrots, apples and onions.","2. धीरे खराब होने वाले: जैसे आलू, गाजर, सेब और प्याज़।","২. ধীরে নষ্ট হয়: যেমন আলু, গাজর, আপেল ও পেঁয়াজ।","2. Lambat rusak: seperti kentang, wortel, apel, dan bawang."],["li","3. غير قابلة للفساد: مثل الحبوب، البقوليات، السكر، الدقيق.","3. Non-perishable: such as grains, pulses, sugar and flour.","3. खराब न होने वाले: जैसे अनाज, दालें, चीनी और आटा।","৩. না-পচনশীল: যেমন শস্য, ডাল, চিনি ও ময়দা।","3. Tidak mudah rusak: seperti biji-bijian, kacang-kacangan, gula, dan tepung."],["h3","أسباب فساد الأغذية","Causes of food spoilage","भोजन खराब होने के कारण","খাবার নষ্টের কারণ","Penyebab kerusakan pangan"],["li","التحلل بسبب الكائنات الدقيقة (مثل البكتيريا والعفن والخمائر) والإنزيمات.","Breakdown caused by microorganisms (such as bacteria, moulds and yeasts) and enzymes.","सूक्ष्मजीवों (जैसे जीवाणु, फफूंद और यीस्ट) और एंज़ाइम से विघटन।","অণুজীব (যেমন ব্যাকটেরিয়া, ছত্রাক ও ইস্ট) ও এনজাইমের কারণে ভাঙন।","Penguraian oleh mikroorganisme (seperti bakteri, kapang, dan khamir) dan enzim."],["li","الإصابة بالآفات، مثل الحشرات في الدقيق أو الذباب على اللحوم.","Infestation by pests, such as insects in flour or flies on meat.","कीटों का संक्रमण, जैसे आटे में कीड़े या मांस पर मक्खियाँ।","পোকামাকড়ের আক্রমণ, যেমন ময়দায় পোকা বা মাংসে মাছি।","Serangan hama, seperti serangga pada tepung atau lalat pada daging."],["li","تضرر نسيج الغذاء، مثل حروق التجميد.","Damage to food tissue, such as freezer burn.","भोजन के ऊतकों को नुकसान, जैसे फ्रीज़र बर्न।","খাবারের টিস্যুর ক্ষতি, যেমন ফ্রিজার বার্ন।","Kerusakan jaringan pangan, seperti freezer burn."],["li","التلوث الكيميائي، مثل تأثر الغذاء برائحة مواد التنظيف القوية.","Chemical contamination, such as food absorbing the smell of strong cleaning materials.","रासायनिक संदूषण, जैसे भोजन का तेज़ सफाई-सामग्री की गंध सोख लेना।","রাসায়নিক দূষণ, যেমন খাবারে কড়া পরিষ্কারকের গন্ধ লাগা।","Kontaminasi kimia, seperti pangan menyerap bau bahan pembersih yang kuat."],["h3","العوامل التي تزيد من سرعة فساد الأغذية","Factors that speed up food spoilage","वे कारक जो भोजन का खराब होना तेज़ करते हैं","যেসব কারণে খাবার দ্রুত নষ্ট হয়","Faktor yang mempercepat kerusakan pangan"],["li","عدم التحكم في درجة الحرارة والرطوبة أثناء تخزين المواد الغذائية.","Failure to control temperature and humidity while storing food.","भोजन भंडारण के दौरान तापमान और नमी पर नियंत्रण न होना।","খাবার সংরক্ষণের সময় তাপমাত্রা ও আর্দ্রতা নিয়ন্ত্রণ না করা।","Tidak mengendalikan suhu dan kelembapan saat menyimpan pangan."],["li","عدم حماية الغذاء من التلوث.","Not protecting food from contamination.","भोजन को संदूषण से न बचाना।","খাবারকে দূষণ থেকে না রক্ষা করা।","Tidak melindungi pangan dari kontaminasi."],["li","التلوث بالآفات وخاصة الحشرات.","Pest contamination, especially insects.","कीटों से संदूषण, विशेषकर कीड़े।","পোকামাকড় থেকে দূষণ, বিশেষ করে কীটপতঙ্গ।","Kontaminasi hama, terutama serangga."],["n","ماذا يعني هذا لنا؟: اليقظة دائماً: نراقب علامات الفساد في كل الأغذية. نتعرف على الأغذية سريعة الفساد ونعطيها اهتماماً خاصاً. تذكر دائماً: قد يؤدي التعامل مع الغذاء الفاسد إلى فقدان الوظيفة إذا تم اكتشاف تقصير من العامل!","What this means for us: always stay alert, watch for spoilage signs in all foods. Know the fast-spoiling foods and give them special attention. Always remember: handling spoiled food may cost you your job if a worker's negligence is discovered!","हमारे लिए इसका अर्थ: हमेशा सतर्क रहें, हर भोजन में खराब होने के संकेत देखें। जल्दी खराब होने वाले भोजन को पहचानें और उन पर विशेष ध्यान दें। याद रखें: खराब भोजन संभालने की लापरवाही पकड़ी गई तो नौकरी भी जा सकती है!","আমাদের জন্য এর অর্থ: সবসময় সতর্ক থাকুন, সব খাবারে নষ্টের লক্ষণ লক্ষ্য করুন। দ্রুত নষ্ট হওয়া খাবার চিনুন ও তাতে বিশেষ নজর দিন। মনে রাখবেন: নষ্ট খাবার নাড়াচাড়ায় গাফিলতি ধরা পড়লে চাকরিও যেতে পারে!","Bagi kita: selalu waspada, perhatikan tanda kerusakan pada semua pangan. Kenali pangan yang cepat rusak dan beri perhatian khusus. Ingat: menangani pangan rusak karena kelalaian bisa menyebabkan kehilangan pekerjaan!"],["h2","علامات فساد الأغذية","Signs of food spoilage","भोजन खराब होने के लक्षण","খাবার নষ্টের লক্ষণ","Tanda-tanda kerusakan pangan"],["li","رائحة سيئة: نتيجة لنمو البكتيريا، تحلل البروتينات أو نمو العفن.","Bad smell: result of bacterial growth, protein breakdown or mould growth.","बुरी गंध: जीवाणु वृद्धि, प्रोटीन के टूटने या फफूंद के बढ़ने का परिणाम।","খারাপ গন্ধ: ব্যাকটেরিয়ার বৃদ্ধি, প্রোটিন ভাঙন বা ছত্রাক জন্মানোর ফল।","Bau busuk: akibat pertumbuhan bakteri, penguraian protein, atau pertumbuhan kapang."],["li","رؤية العفن: ظهور عفن أسود أو أخضر/أزرق/رمادي على الغذاء، ووجود رطوبة داخل العبوة.","Visible mould: black, green, blue or grey mould on food, and moisture inside the package.","फफूंद दिखना: भोजन पर काली, हरी, नीली या भूरी फफूंद, और पैकेट के भीतर नमी।","দৃশ্যমান ছত্রাক: খাবারে কালো, সবুজ, নীল বা ধূসর ছত্রাক, এবং প্যাকেটের ভেতরে আর্দ্রতা।","Kapang terlihat: kapang hitam, hijau, biru, atau abu-abu pada pangan, dan kelembapan di dalam kemasan."],["li","تغير اللون: تغير لون اللحم إلى الرمادي/البني أو الأخضر مع رائحة كريهة.","Colour change: meat turns grey, brown or green with an unpleasant smell.","रंग बदलना: मांस का रंग भूरा, धूसर या हरा हो जाता है और उससे बदबू आती है।","রং বদলানো: মাংস ধূসর, বাদামি বা সবুজ হয়ে যায়, সঙ্গে বিশ্রী গন্ধ।","Perubahan warna: daging berubah abu-abu, cokelat, atau hijau dengan bau tidak sedap."],["li","معلبات منتفخة: علامة على وجود غازات من نمو البكتيريا، قد يحدث بسبب سوء الإغلاق أو ثقوب في العلبة.","Swollen cans: a sign of gas from bacterial growth; may be caused by poor sealing or holes in the can.","फूले हुए डिब्बे: जीवाणु वृद्धि से बनी गैस का संकेत; खराब सील या डिब्बे में छेद से भी हो सकता है।","ফোলা টিন: ব্যাকটেরিয়ার বৃদ্ধিতে গ্যাসের লক্ষণ; খারাপ সিল বা টিনে ছিদ্র থেকেও হতে পারে।","Kaleng menggembung: tanda gas dari pertumbuhan bakteri; dapat disebabkan penutupan buruk atau lubang pada kaleng."],["li","نكهة سيئة: نتيجة لنمو البكتيريا، تزنخ الدهون أو امتصاص نكهات غريبة.","Off-taste: result of bacterial growth, fats turning rancid, or absorbing strange flavours.","बुरा स्वाद: जीवाणु वृद्धि, वसा के खट्टे होने या अजीब स्वाद सोखने का परिणाम।","খারাপ স্বাদ: ব্যাকটেরিয়ার বৃদ্ধি, চর্বি বিকৃত হওয়া বা অদ্ভুত স্বাদ শোষণের ফল।","Rasa tidak enak: akibat pertumbuhan bakteri, lemak tengik, atau menyerap rasa asing."],["li","جفاف الغذاء: نتيجة لتخزين طويل الأمد، التغليف غير المحكم أو التجميد غير الصحيح.","Dried-out food: result of long storage, poor packaging or incorrect freezing.","भोजन सूखना: लंबे भंडारण, खराब पैकिंग या गलत जमाव का परिणाम।","খাবার শুকিয়ে যাওয়া: দীর্ঘ সংরক্ষণ, খারাপ প্যাকেজিং বা ভুল হিমায়নের ফল।","Pangan mengering: akibat penyimpanan lama, kemasan kurang rapat, atau pembekuan yang tidak benar."],["h2","السيطرة على فساد الأغذية","Controlling food spoilage","भोजन खराब होने पर नियंत्रण","খাবার নষ্ট রোধ","Mengendalikan kerusakan pangan"],["h3","كيف يتم الحد من فساد الأغذية؟","How is food spoilage limited?","भोजन खराब होने को कैसे रोका जाता है?","খাবার নষ্ট কীভাবে কমানো হয়?","Bagaimana kerusakan pangan dikurangi?"],["li","فحص الغذاء عند الاستلام.","Inspect food on receipt.","भोजन प्राप्त होने पर जांचें।","খাবার পাওয়ার সময় পরীক্ষা করুন।","Periksa pangan saat diterima."],["li","التحقق من تواريخ الصلاحية.","Check expiry dates.","समाप्ति तिथियाँ जांचें।","মেয়াদের তারিখ যাচাই করুন।","Periksa tanggal kedaluwarsa."],["li","الإبلاغ عن أي علامات تلف.","Report any signs of damage.","खराब होने के किसी भी संकेत की सूचना दें।","নষ্টের কোনো লক্ষণ জানান।","Laporkan setiap tanda kerusakan."],["li","فصل الأغذية عالية الخطورة عن النيئة.","Separate high-risk foods from raw ones.","उच्च-जोखिम भोजन को कच्चे भोजन से अलग रखें।","উচ্চ-ঝুঁকির খাবার কাঁচা খাবার থেকে আলাদা রাখুন।","Pisahkan pangan berisiko tinggi dari pangan mentah."],["li","حماية وتغطية الغذاء.","Protect and cover food.","भोजन की रक्षा करें और उसे ढकें।","খাবার রক্ষা ও ঢেকে রাখুন।","Lindungi dan tutup pangan."],["li","التنظيف والتطهير المنتظم.","Regular cleaning and sanitising.","नियमित सफाई और सैनिटाइज़िंग।","নিয়মিত পরিষ্কার ও জীবাণুমুক্তকরণ।","Pembersihan dan sanitasi rutin."],["n","للمزيد عن النظافة الشخصية للعاملين ونظافة المنشآت الغذائية، يرجى الرجوع إلى الأجزاء المخصصة لهذه المواضيع.","For more on workers' personal hygiene and food establishment cleanliness, please refer to the sections dedicated to these topics.","कर्मचारियों की व्यक्तिगत स्वच्छता और खाद्य प्रतिष्ठान की सफाई के बारे में अधिक जानकारी के लिए इन विषयों के भाग देखें।","কর্মীদের ব্যক্তিগত পরিচ্ছন্নতা ও খাদ্য প্রতিষ্ঠানের পরিচ্ছন্নতা সম্পর্কে জানতে এই বিষয়ের অংশগুলো দেখুন।","Untuk informasi lebih lanjut tentang kebersihan pribadi pekerja dan kebersihan usaha pangan, lihat bagian yang membahas topik ini."],["n","ماذا يعني هذا لنا؟: التخزين الصحيح مهم جداً: نخزن كل نوع من الغذاء في درجة الحرارة المناسبة. نفصل الأغذية النيئة عن الأغذية الجاهزة للأكل. لا نتردد في رفض استلام أغذية تبدو فاسدة.","What this means for us: correct storage is very important: store each type of food at the right temperature. Separate raw foods from ready-to-eat foods. Do not hesitate to reject food that looks spoiled.","हमारे लिए इसका अर्थ: सही भंडारण बहुत ज़रूरी है: हर भोजन को उसके सही तापमान पर रखें। कच्चे भोजन को तैयार भोजन से अलग रखें। खराब दिखने वाला भोजन लेने से न हिचकें।","আমাদের জন্য এর অর্থ: সঠিক সংরক্ষণ খুব গুরুত্বপূর্ণ: প্রতিটি খাবার সঠিক তাপমাত্রায় রাখুন। কাঁচা খাবার তৈরি খাবার থেকে আলাদা রাখুন। নষ্ট মনে হওয়া খাবার নিতে দ্বিধা করবেন না।","Bagi kita: penyimpanan yang benar sangat penting: simpan setiap jenis pangan pada suhu yang tepat. Pisahkan pangan mentah dari pangan siap saji. Jangan ragu menolak pangan yang terlihat rusak."],["h2","المخاطر الصحية للغذاء غير الآمن","Health risks of unsafe food","असुरक्षित भोजन के स्वास्थ्य खतरे","অনিরাপদ খাবারের স্বাস্থ্য ঝুঁকি","Risiko kesehatan pangan tidak aman"],["h3","تهديدات الغذاء غير الآمن على الصحة","Threats of unsafe food to health","असुरक्षित भोजन से स्वास्थ्य को खतरे","অনিরাপদ খাবার থেকে স্বাস্থ্য ঝুঁকি","Ancaman pangan tidak aman bagi kesehatan"],["p","يُعتبر الغذاء غير آمن إذا كان غير صالح للاستهلاك الآدمي أو قد يُسبب ضرراً على صحة المستهلك. ومن أبرز الحالات التي يُعتبر فيها الغذاء غير آمن:","Food is considered unsafe if it is unfit for human consumption or may harm consumers' health. The most notable cases in which food is considered unsafe are:","भोजन असुरक्षित माना जाता है यदि वह मानव उपभोग के लिए उपयुक्त नहीं या उपभोक्ता के स्वास्थ्य को नुकसान पहुँचा सकता है। असुरक्षित माने जाने की प्रमुख स्थितियाँ:","মানুষের খাওয়ার অনুপযোগী হলে বা ভোক্তার স্বাস্থ্যের ক্ষতি করতে পারলে খাবারকে অনিরাপদ ধরা হয়। যেসব ক্ষেত্রে খাবার অনিরাপদ বিবেচিত হয়:","Pangan dianggap tidak aman jika tidak layak dikonsumsi manusia atau dapat membahayakan kesehatan konsumen. Kasus paling menonjol: "],["li","كونه فاسداً.","It is spoiled.","वह खराब हो।","এটি নষ্ট হওয়া।","Pangan sudah rusak."],["li","احتواؤه على مواد ضارة أو غير مناسبة للاستهلاك.","It contains harmful or unsuitable substances for consumption.","उसमें हानिकारक या खाने के लिए अनुपयुक्त पदार्थ हों।","এতে ক্ষতিকর বা খাওয়ার অনুপযোগী পদার্থ থাকা।","Mengandung zat berbahaya atau tidak sesuai untuk dikonsumsi."],["p","يُعرف الغذاء الآمن بأنه الغذاء الذي لا يُسبب أي ضرر للمستهلك عند تناوله. ومع ذلك، يمكن أن يتحول الغذاء الآمن إلى مصدر تهديد صحي إذا تم تداوله أو التعامل معه بطرق غير صحيحة، مثل سوء التخزين أو عدم الالتزام بممارسات النظافة.","Safe food is food that does not harm the consumer when eaten. However, safe food can become a health threat if it is handled or prepared in incorrect ways, such as poor storage or failure to follow hygiene practices.","सुरक्षित भोजन वह है जो खाने पर उपभोक्ता को नुकसान न पहुँचाए। फिर भी, यदि उसे गलत तरीके से संभाला या तैयार किया जाए, जैसे खराब भंडारण या स्वच्छता नियमों की अनदेखी, तो सुरक्षित भोजन भी स्वास्थ्य के लिए खतरा बन सकता है।","যে খাবার খেলে ভোক্তার ক্ষতি হয় না তাকে নিরাপদ খাবার বলে। তবে ভুলভাবে নাড়াচাড়া বা প্রস্তুত করলে, যেমন খারাপ সংরক্ষণ বা পরিচ্ছন্নতার নিয়ম না মানলে, নিরাপদ খাবারও স্বাস্থ্য ঝুঁকিতে পরিণত হতে পারে।","Pangan aman adalah pangan yang tidak membahayakan konsumen saat dimakan. Namun, pangan aman dapat menjadi ancaman kesehatan jika ditangani atau disiapkan dengan cara yang salah, misalnya penyimpanan buruk atau tidak mengikuti praktik kebersihan."],["p","وهناك أربعة أنواع رئيسية من التهديدات والمخاطر على الصحة المرتبطة بالغذاء غير الآمن:","There are four main types of threats and health hazards linked to unsafe food:","असुरक्षित भोजन से जुड़े स्वास्थ्य खतरों और जोखिमों की चार मुख्य श्रेणियाँ हैं:","অনিরাপদ খাবারের সঙ্গে জড়িত স্বাস্থ্য ঝুঁকির চারটি প্রধান ধরন আছে:","Ada empat jenis ancaman dan bahaya kesehatan utama yang terkait pangan tidak aman:"],["li","1. التسمم الغذائي.","1. Food poisoning.","1. फ़ूड पॉइज़निंग।","১. খাদ্যে বিষক্রিয়া।","1. Keracunan pangan."],["li","2. الأمراض المنقولة عن طريق الغذاء.","2. Foodborne diseases.","2. भोजन से फैलने वाली बीमारियाँ।","২. খাবারবাহিত রোগ।","2. Penyakit bawaan pangan."],["li","3. الحساسية الغذائية.","3. Food allergies.","3. भोजन एलर्जी।","৩. খাদ্য অ্যালার্জি।","3. Alergi pangan."],["li","4. الأضرار غير المرضية.","4. Non-disease injuries (physical hazards).","4. गैर-रोग संबंधी नुकसान।","৪. অ-রোগজনিত ক্ষতি।","4. Cedera non-penyakit."],["p","من خلال فهم هذه التهديدات، يمكننا تعزيز الوعي، واتباع الممارسات الصحية السليمة في جميع مراحل التعامل مع الغذاء، مما يساهم في حماية صحة المستهلكين وتعزيز سمعة المنشآت الغذائية.","By understanding these threats, we can raise awareness and follow sound health practices at every stage of handling food, which helps protect consumers' health and strengthens the reputation of food establishments.","इन खतरों को समझकर हम जागरूकता बढ़ा सकते हैं और भोजन संभालने के हर चरण में सही स्वास्थ्य पद्धतियाँ अपना सकते हैं, जिससे उपभोक्ताओं का स्वास्थ्य बचता है और प्रतिष्ठान की साख मजबूत होती है।","এসব ঝুঁকি বুঝে আমরা সচেতনতা বাড়াতে ও খাবার পরিচালনার প্রতিটি ধাপে সঠিক স্বাস্থ্য পদ্ধতি মানতে পারি, যা ভোক্তার স্বাস্থ্য রক্ষা ও খাদ্য প্রতিষ্ঠানের সুনাম বাড়াতে সাহায্য করে।","Dengan memahami ancaman ini, kita dapat meningkatkan kesadaran dan mengikuti praktik kesehatan yang baik di setiap tahap penanganan pangan, yang membantu melindungi kesehatan konsumen dan memperkuat reputasi usaha pangan."],["n","ماذا يعني هذا لنا؟: متداولو الغذاء يجب أن ندرك حقيقة أن الغذاء غير الآمن يؤدي إلى العديد من المخاطر الصحية، لذلك يجب أن نتأكد خلال العمل من عدم تسببنا في إصابة المستهلكين أو تضررهم. نتيجة عدم الالتزام بمعايير ومتطلبات سلامة الغذاء. تذكر دائماً: الغذاء غير الآمن يؤدي إلى انتشار الأمراض والتسمم الغذائي، مما يشكل خطراً على صحة الناس وسلامتهم!","What this means for us: food handlers must understand that unsafe food leads to many health risks, so at work we must make sure we do not cause consumers to be injured or harmed as a result of not meeting food safety standards and requirements. Always remember: unsafe food spreads disease and food poisoning, posing a risk to people's health and safety!","हमारे लिए इसका अर्थ: भोजन संभालने वालों को समझना चाहिए कि असुरक्षित भोजन से कई स्वास्थ्य खतरे होते हैं, इसलिए हमें सुनिश्चित करना चाहिए कि खाद्य सुरक्षा मानकों का पालन न करने से उपभोक्ता आहत या प्रभावित न हों। हमेशा याद रखें: असुरक्षित भोजन से बीमारी और फ़ूड पॉइज़निंग फैलती है, जो लोगों के स्वास्थ्य और सुरक्षा के लिए खतरा है!","আমাদের জন্য এর অর্থ: খাবার পরিচালনাকারীদের বুঝতে হবে যে অনিরাপদ খাবার অনেক স্বাস্থ্য ঝুঁকি তৈরি করে, তাই খাদ্য নিরাপত্তার মান ও শর্ত না মানায় যেন ভোক্তারা ক্ষতিগ্রস্ত না হন তা কাজে নিশ্চিত করতে হবে। সবসময় মনে রাখুন: অনিরাপদ খাবার রোগ ও খাদ্যে বিষক্রিয়া ছড়ায়, যা মানুষের স্বাস্থ্য ও নিরাপত্তার জন্য ঝুঁকি!","Bagi kita: penjamah pangan harus memahami bahwa pangan tidak aman menimbulkan banyak risiko kesehatan, jadi dalam bekerja kita harus memastikan tidak menyebabkan konsumen cedera karena tidak memenuhi standar dan persyaratan keamanan pangan. Ingat: pangan tidak aman menyebarkan penyakit dan keracunan pangan, yang membahayakan kesehatan dan keselamatan masyarakat!"],["h3","التسمم الغذائي","Food poisoning","फ़ूड पॉइज़निंग","খাদ্যে বিষক্রিয়া","Keracunan pangan"],["p","التسمم الغذائي هو مصطلح يعبر عن مجموعة من الأمراض الناجمة عن تناول غذاء ملوث، ويُعتبر من أكثر المخاطر الصحية شيوعًا المرتبطة بالغذاء غير الآمن. تشير التقديرات إلى أن 600 مليون شخص حول العالم يصابون بأمراض نتيجة تناول غذاء ملوث سنوياً، مما يؤدي إلى حوالي 420,000 حالة وفاة، ويتميز بالتالي:","Food poisoning is a term for a group of illnesses caused by eating contaminated food, and it is one of the most common health risks linked to unsafe food. Estimates indicate that 600 million people worldwide fall ill from eating contaminated food each year, leading to about 420,000 deaths. It is characterised by the following:","फ़ूड पॉइज़निंग दूषित भोजन खाने से होने वाली बीमारियों के समूह के लिए शब्द है और असुरक्षित भोजन से जुड़ा सबसे आम स्वास्थ्य खतरा है। अनुमान है कि हर साल दुनिया भर में 60 करोड़ लोग दूषित भोजन से बीमार होते हैं, जिससे लगभग 4,20,000 मौतें होती हैं। इसकी विशेषताएँ:","খাদ্যে বিষক্রিয়া হলো দূষিত খাবার খাওয়ার কারণে সৃষ্ট রোগের একটি গোষ্ঠী এবং অনিরাপদ খাবারের সঙ্গে জড়িত সবচেয়ে সাধারণ স্বাস্থ্য ঝুঁকি। অনুমান অনুযায়ী প্রতি বছর বিশ্বে ৬০ কোটি মানুষ দূষিত খাবার খেয়ে অসুস্থ হয়, যাতে প্রায় ৪ লক্ষ ২০ হাজার মৃত্যু ঘটে। এর বৈশিষ্ট্য:","Keracunan pangan adalah istilah untuk sekelompok penyakit akibat mengonsumsi pangan terkontaminasi, dan merupakan salah satu risiko kesehatan paling umum yang terkait pangan tidak aman. Perkiraan menunjukkan 600 juta orang di dunia sakit akibat pangan terkontaminasi setiap tahun, menyebabkan sekitar 420.000 kematian. Ciri-cirinya:"],["li","يحدث التسمم الغذائي بسبب تكاثر البكتيريا في الغذاء أو عليه.","Food poisoning is caused by bacteria multiplying in or on food.","फ़ूड पॉइज़निंग भोजन में या उस पर जीवाणुओं के बढ़ने से होती है।","খাবারের ভেতরে বা উপরে ব্যাকটেরিয়ার বৃদ্ধিতে খাদ্যে বিষক্রিয়া হয়।","Keracunan pangan terjadi karena bakteri berkembang biak di dalam atau pada pangan."],["li","مرض حاد مع أعراض سريعة.","An acute illness with rapid symptoms.","तीव्र रोग, लक्षण जल्दी दिखते हैं।","দ্রুত লক্ষণসহ তীব্র অসুখ।","Penyakit akut dengan gejala cepat."],["li","عادة الأعراض تكون خفيفة، لكن يمكن أن تكون خطيرة أحيانا وقد تؤدي إلى الموت.","Symptoms are usually mild, but can sometimes be serious and may lead to death.","लक्षण आमतौर पर हल्के होते हैं, पर कभी-कभी गंभीर और मृत्यु तक का कारण बन सकते हैं।","লক্ষণ সাধারণত হালকা, তবে কখনো গুরুতর হতে পারে এবং মৃত্যুও ঘটাতে পারে।","Gejalanya biasanya ringan, tetapi kadang bisa serius dan berujung kematian."],["li","الأعراض الشائعة: ألم في البطن، تقيؤ، غثيان، إسهال، حمى.","Common symptoms: abdominal pain, vomiting, nausea, diarrhoea, fever.","आम लक्षण: पेट दर्द, उल्टी, मतली, दस्त, बुखार।","সাধারণ লক্ষণ: পেটে ব্যথা, বমি, বমিভাব, ডায়রিয়া, জ্বর।","Gejala umum: nyeri perut, muntah, mual, diare, demam."],["li","تظهر الأعراض عادة بين ساعتين و36 ساعة بعد تناول الملوث وتسمى بفترة الحضانة.","Symptoms usually appear between 2 and 36 hours after eating the contaminated food; this is called the incubation period.","लक्षण आमतौर पर दूषित भोजन खाने के 2 से 36 घंटे के भीतर दिखते हैं; इसे इनक्यूबेशन काल कहते हैं।","দূষিত খাবার খাওয়ার ২ থেকে ৩৬ ঘণ্টার মধ্যে লক্ষণ দেখা দেয়; একে ইনকিউবেশন সময়কাল বলে।","Gejala biasanya muncul 2 hingga 36 jam setelah makan pangan terkontaminasi; ini disebut masa inkubasi."],["li","قد تستمر الأعراض من يوم إلى أسبوع.","Symptoms may last from one day to a week.","लक्षण एक दिन से एक सप्ताह तक रह सकते हैं।","লক্ষণ এক দিন থেকে এক সপ্তাহ পর্যন্ত থাকতে পারে।","Gejala dapat berlangsung dari satu hari hingga satu minggu."],["li","من الممكن أن يكون تفشي التسمم الغذائي وهي إصابة عدد من الأشخاص بأعراض مرضية متشابهة خلال فترة زمنية قصيرة بعد تناول غذاء ملوث مشترك.","An outbreak of food poisoning is when a number of people develop similar symptoms within a short period after eating the same contaminated food.","खाद्य विषाक्तता का प्रकोप तब होता है जब कई लोग एक ही दूषित भोजन खाने के बाद थोड़े समय में एक जैसे लक्षणों से बीमार हों।","খাদ্যে বিষক্রিয়ার প্রাদুর্ভাব মানে একই দূষিত খাবার খাওয়ার পর অল্প সময়ে অনেক মানুষের একই রকম লক্ষণ দেখা দেওয়া।","Wabah keracunan pangan adalah ketika sejumlah orang mengalami gejala serupa dalam waktu singkat setelah makan pangan terkontaminasi yang sama."],["h3","من هم الأشخاص الأكثر عرضة لخطر الإصابة بالتسمم؟","Who is most at risk of food poisoning?","फ़ूड पॉइज़निंग का सबसे अधिक खतरा किन लोगों को है?","খাদ্যে বিষক্রিয়ার ঝুঁকি সবচেয়ে বেশি কাদের?","Siapa yang paling berisiko keracunan pangan?"],["li","المسنون.","Older people.","बुज़ुर्ग।","বয়স্ক মানুষ।","Lansia."],["li","الأطفال تحت سن 5 سنوات.","Children under 5 years.","5 वर्ष से कम आयु के बच्चे।","৫ বছরের কম বয়সী শিশু।","Anak di bawah 5 tahun."],["li","الأشخاص المصابون بأمراض خطيرة.","People with serious illnesses.","गंभीर बीमारियों से ग्रस्त लोग।","গুরুতর অসুখে আক্রান্ত মানুষ।","Orang dengan penyakit serius."],["li","النساء الحوامل.","Pregnant women.","गर्भवती महिलाएँ।","গর্ভবতী নারী।","Ibu hamil."],["li","متداولو الغذاء، خاصة عند التعامل مع الغذاء النيء.","Food handlers, especially when handling raw food.","भोजन संभालने वाले, विशेषकर कच्चे भोजन से काम करते समय।","খাবার পরিচালনাকারী, বিশেষ করে কাঁচা খাবারের সঙ্গে কাজ করার সময়।","Penjamah pangan, terutama saat menangani pangan mentah."],["n","ماذا يعني هذا لنا؟: التسمم الغذائي يعني لنا كعاملين في مجال الغذاء خطر حقيقي على صحة الناس. علينا فهم خطره الشديد لأن أي شخص يصيبه التسمم بالإصابة. يجب توخي مزيد من الحذر لحماية الفئات الأكثر عرضة: نحذر من غذاء المسنين، الأطفال الصغار، والمرضى. نحن كعاملين معرضون للخطر أيضاً لتعاملنا مع الغذاء النيء.","What this means for us: food poisoning means a real risk to people's health for us as food workers. We must understand how serious it is, because anyone can be affected. We must be extra careful to protect the most vulnerable groups: be careful with food for older people, young children and patients. We as workers are also at risk because we handle raw food.","हमारे लिए इसका अर्थ: खाद्य क्षेत्र के कर्मचारी के रूप में फ़ूड पॉइज़निंग लोगों के स्वास्थ्य के लिए असली खतरा है। इसकी गंभीरता समझना ज़रूरी है, क्योंकि कोई भी इससे प्रभावित हो सकता है। सबसे कमज़ोर वर्गों की रक्षा के लिए अतिरिक्त सावधानी रखें: बुज़ुर्गों, छोटे बच्चों और मरीज़ों के भोजन पर खास ध्यान दें। कच्चा भोजन संभालने से हम कर्मचारी भी खतरे में हैं।","আমাদের জন্য এর অর্থ: খাদ্য খাতের কর্মী হিসেবে খাদ্যে বিষক্রিয়া মানুষের স্বাস্থ্যের জন্য প্রকৃত ঝুঁকি। এর গুরুত্ব বোঝা জরুরি, কারণ যে কেউ আক্রান্ত হতে পারে। সবচেয়ে দুর্বল গোষ্ঠী রক্ষায় বাড়তি সতর্ক থাকতে হবে: বয়স্ক, ছোট শিশু ও রোগীদের খাবারে বিশেষ যত্ন নিন। কাঁচা খাবার নাড়াচাড়ার কারণে আমরা কর্মীরাও ঝুঁকিতে আছি।","Bagi kita: keracunan pangan berarti risiko nyata bagi kesehatan masyarakat. Kita harus memahami betapa seriusnya, karena siapa pun bisa terdampak. Harus lebih berhati-hati melindungi kelompok rentan: perhatikan pangan untuk lansia, anak kecil, dan pasien. Kita sebagai pekerja juga berisiko karena menangani pangan mentah."],["h3","البكتيريا المسببة للتسمم الغذائي الأكثر شيوعا","The most common bacteria causing food poisoning","सबसे आम फ़ूड पॉइज़निंग जीवाणु","সবচেয়ে সাধারণ খাদ্যে বিষক্রিয়ার ব্যাকটেরিয়া","Bakteri paling umum penyebab keracunan pangan"],["li","السالمونيلا (Salmonella): توجد داخل الدواجن واللحوم، في أجسام الحيوانات والبشر. تتواجد في الدجاج واللحوم النيئة، البيض غير المطبوخة جيداً، والبيض النيء. ماذا يعني هذا لنا؟ حفظ البيض في الثلاجة عند درجة حرارة 5°م أو أقل. طبخ الدجاج واللحوم جيداً. غسل أيدينا جيداً بعد لمس اللحوم والدواجن النيئة. استخدام أدوات وألواح تقطيع منفصلة للحوم والدواجن النيئة.","Salmonella: found inside poultry and meat, in animal and human bodies. Found in chicken and raw meat, under-cooked eggs and raw eggs. What this means for us: keep eggs in the fridge at 5°C or below; cook chicken and meat thoroughly; wash hands well after touching raw meat and poultry; use separate utensils and cutting boards for raw meat and poultry.","सैल्मोनेला: मुर्गी और मांस के भीतर, जानवरों और इंसानों के शरीर में मिलता है। चिकन, कच्चे मांस, अधपके और कच्चे अंडों में पाया जाता है। हमारे लिए: अंडे 5°C या उससे कम पर फ्रिज में रखें; चिकन और मांस अच्छी तरह पकाएँ; कच्चा मांस या मुर्गी छूने के बाद हाथ अच्छी तरह धोएँ; कच्चे मांस और मुर्गी के लिए अलग औज़ार और कटिंग बोर्ड रखें।","সালমোনেলা: হাঁস-মুরগি ও মাংসের ভেতরে এবং প্রাণী ও মানুষের শরীরে পাওয়া যায়। মুরগি ও কাঁচা মাংস, ভালোভাবে রান্না না হওয়া ও কাঁচা ডিমে থাকে। আমাদের জন্য: ডিম ৫°C বা তার কমে ফ্রিজে রাখুন; মুরগি ও মাংস ভালো করে রান্না করুন; কাঁচা মাংস ও মুরগি ছোঁয়ার পর হাত ভালো করে ধুন; কাঁচা মাংস ও মুরগির জন্য আলাদা সরঞ্জাম ও কাটার বোর্ড ব্যবহার করুন।","Salmonella: ditemukan di dalam unggas dan daging, pada tubuh hewan dan manusia. Terdapat pada ayam, daging mentah, telur kurang matang, dan telur mentah. Bagi kita: simpan telur di kulkas pada 5°C atau lebih rendah; masak ayam dan daging dengan sempurna; cuci tangan dengan baik setelah menyentuh daging dan unggas mentah; gunakan peralatan dan talenan terpisah untuk daging dan unggas mentah."],["li","ستافيلوكوكس أوريس (Staphylococcus aureus): على جلد الإنسان، في الجروح، وفي الأنف والحنجرة. توجد في الحليب غير المبستر، الكاسترد، والكريمة (الكريمة)، الجبن. لماذا يعني هذا لنا؟ النظافة الشخصية مهمة جداً: نغسل أيدينا بالماء والصابون بشكل متكرر. لا نعمل في تحضير الغذاء إذا كان لدينا جروح أو التهابات في الجلد، خاصة على اليدين أو المعصمين. استخدام قفازات نظيفة عند التعامل مع الغذاء الجاهز للأكل.","Staphylococcus aureus: on human skin, in wounds, and in the nose and throat. Found in unpasteurised milk, custard, cream and cheese. What this means for us: personal hygiene is very important: wash hands with soap and water frequently. Do not work in food preparation if we have wounds or skin infections, especially on the hands or wrists. Use clean gloves when handling ready-to-eat food.","स्टैफिलोकॉकस ऑरियस: इंसान की त्वचा पर, घावों में, और नाक-गले में। बिना पाश्चराइज़्ड दूध, कस्टर्ड, क्रीम और पनीर में मिलता है। हमारे लिए: व्यक्तिगत स्वच्छता बहुत ज़रूरी है: साबुन और पानी से बार-बार हाथ धोएँ। हाथों या कलाई पर घाव या त्वचा संक्रमण हो तो भोजन तैयार न करें। तैयार भोजन संभालते समय साफ दस्ताने पहनें।","স্ট্যাফাইলোকক্কাস অরিয়াস: মানুষের ত্বকে, ক্ষতে, এবং নাক-গলায়। পাস্তুরিত না করা দুধ, কাস্টার্ড, ক্রিম ও পনিরে পাওয়া যায়। আমাদের জন্য: ব্যক্তিগত পরিচ্ছন্নতা খুব জরুরি: সাবান ও পানি দিয়ে বারবার হাত ধুন। হাত বা কব্জিতে ক্ষত বা ত্বক সংক্রমণ থাকলে খাবার তৈরির কাজ করবেন না। তৈরি খাবার ধরার সময় পরিষ্কার গ্লাভস ব্যবহার করুন।","Staphylococcus aureus: pada kulit manusia, di luka, dan di hidung serta tenggorokan. Ditemukan pada susu tidak dipasteurisasi, puding, krim, dan keju. Bagi kita: kebersihan pribadi sangat penting: cuci tangan dengan sabun dan air secara sering. Jangan bekerja menyiapkan pangan jika ada luka atau infeksi kulit, terutama di tangan atau pergelangan. Gunakan sarung tangan bersih saat menangani pangan siap saji."],["li","كلوستريديم بيرفرينجنز (Clostridium perfringens): في التربة والغبار، في براز الحيوانات، في اللحوم النيئة. توجد في صلصة اللحوم، منتجات اللحوم والدجاج المطبوخ. لماذا يعني هذا لنا؟ طهي اللحوم والدواجن بشكل كامل. الطهي غير الكامل خطير! حفظ الغذاء الساخن عند درجة حرارة 63°م أو أعلى دائماً. تجنب إعداد الغذاء قبل وقت طويل من تقديمه.","Clostridium perfringens: in soil and dust, in animal faeces, in raw meat. Found in meat sauce, cooked meat and poultry products. What this means for us: cook meat and poultry completely; incomplete cooking is dangerous! Keep hot food at 63°C or above at all times. Avoid preparing food long before serving.","क्लॉस्ट्रिडियम परफ्रिंजेंस: मिट्टी और धूल में, जानवरों के मल में, कच्चे मांस में। मांस की ग्रेवी, पके मांस और मुर्गी उत्पादों में मिलता है। हमारे लिए: मांस और मुर्गी पूरी तरह पकाएँ; अधूरा पकाना खतरनाक है! गर्म भोजन हमेशा 63°C या उससे ऊपर रखें। परोसने से बहुत पहले भोजन न बनाएँ।","ক্লস্ট্রিডিয়াম পারফ্রিনজেনস: মাটি ও ধুলোয়, প্রাণীর মলে, কাঁচা মাংসে। মাংসের সসে, রান্না করা মাংস ও মুরগির পণ্যে পাওয়া যায়। আমাদের জন্য: মাংস ও মুরগি সম্পূর্ণ রান্না করুন; অসম্পূর্ণ রান্না বিপজ্জনক! গরম খাবার সবসময় ৬৩°C বা তার উপরে রাখুন। পরিবেশনের অনেক আগে খাবার প্রস্তুত করা এড়ান।","Clostridium perfringens: di tanah dan debu, dalam kotoran hewan, pada daging mentah. Ditemukan pada saus daging, produk daging dan ayam matang. Bagi kita: masak daging dan unggas sepenuhnya; memasak tidak sempurna itu berbahaya! Simpan pangan panas pada 63°C atau lebih setiap saat. Hindari menyiapkan pangan jauh sebelum disajikan."],["li","كلوستريديم بوتولينوم (Clostridium botulinum): في التربة والغبار، الأسماك، وفي الخضروات النيئة. توجد في المعلبات المنتفخة، المنتجات المعبأة بتفريغ الهواء. لماذا يعني هذا لنا؟ فحص المعلبات بعناية قبل استخدامها. عدم استخدام أي معلبات بها: انتفاخ، تشققات في اللحام، كسر في الجسم الداخلي، أي تسرب أو تقوب.","Clostridium botulinum: in soil and dust, fish, and raw vegetables. Found in swollen cans and vacuum-packed products. What this means for us: check cans carefully before use. Do not use any cans that are swollen, have cracks in the seams, dents in the body, or any leaks or holes.","क्लॉस्ट्रिडियम बोटुलिनम: मिट्टी और धूल में, मछली में, और कच्ची सब्ज़ियों में। फूले हुए डिब्बों और वैक्यूम-पैक उत्पादों में मिलता है। हमारे लिए: उपयोग से पहले डिब्बे ध्यान से जांचें। फूले, सीवन में दरार, अंदर से पिचके या रिसाव/छेद वाले डिब्बे कभी न इस्तेमाल करें।","ক্লস্ট্রিডিয়াম বোটুলিনাম: মাটি ও ধুলোয়, মাছে এবং কাঁচা সবজিতে। ফোলা টিন ও ভ্যাকুয়াম-প্যাকড পণ্যে পাওয়া যায়। আমাদের জন্য: ব্যবহারের আগে টিন ভালো করে দেখুন। ফোলা, জোড়ায় ফাটল, ভেতরে বসে যাওয়া বা ফুটো/ছিদ্র থাকলে কোনো টিন ব্যবহার করবেন না।","Clostridium botulinum: di tanah dan debu, ikan, dan sayuran mentah. Ditemukan pada kaleng menggembung dan produk kemasan vakum. Bagi kita: periksa kaleng dengan teliti sebelum digunakan. Jangan gunakan kaleng yang menggembung, retak pada sambungan, penyok di badan, atau bocor/berlubang."],["li","باسيلس سيريوس (Bacillus cereus): في الأرز، في الذرة، في التربة وفي الغبار. توجد في الأرز المطبوخ، السلطات، والتوابل. لماذا يعني هذا لنا؟ لا نترك الأرز المطبوخ في درجة الغرفة لفترة طويلة. تبريد الأغذية الساخنة بسرعة (خلال ساعتين) إلى درجة حرارة أقل من 5°م. عند إعادة تسخين الأرز، نتأكد من أنه يصل إلى درجة حرارة 82°م على الأقل.","Bacillus cereus: in rice, maize, soil and dust. Found in cooked rice, salads and spices. What this means for us: do not leave cooked rice at room temperature for a long time. Cool hot food quickly (within 2 hours) to below 5°C. When reheating rice, make sure it reaches at least 82°C.","बैसिलस सेरियस: चावल, मक्का, मिट्टी और धूल में। पके चावल, सलाद और मसालों में मिलता है। हमारे लिए: पका चावल कमरे के तापमान पर देर तक न छोड़ें। गर्म भोजन जल्दी (2 घंटे में) 5°C से नीचे ठंडा करें। चावल फिर गर्म करते समय पक्का करें कि वह कम से कम 82°C तक पहुँचे।","ব্যাসিলাস সেরিয়াস: চাল, ভুট্টা, মাটি ও ধুলোয়। রান্না করা ভাত, সালাদ ও মসলায় পাওয়া যায়। আমাদের জন্য: রান্না করা ভাত ঘরের তাপমাত্রায় দীর্ঘক্ষণ রাখবেন না। গরম খাবার দ্রুত (২ ঘণ্টার মধ্যে) ৫°C-এর নিচে ঠান্ডা করুন। ভাত আবার গরম করার সময় নিশ্চিত করুন অন্তত ৮২°C-এ পৌঁছেছে।","Bacillus cereus: pada nasi, jagung, tanah, dan debu. Ditemukan pada nasi matang, salad, dan rempah. Bagi kita: jangan biarkan nasi matang lama di suhu ruang. Dinginkan pangan panas dengan cepat (dalam 2 jam) hingga di bawah 5°C. Saat memanaskan ulang nasi, pastikan mencapai minimal 82°C."]]},{"t":["النظافة الشخصية للعاملين","Personal hygiene for workers","कर्मचारियों की व्यक्तिगत स्वच्छता","কর্মীদের ব্যক্তিগত পরিচ্ছন্নতা","Kebersihan pribadi pekerja"],"r":[["h2","النظافة الشخصية للعاملين","Workers' personal hygiene","कर्मचारियों की व्यक्तिगत स्वच्छता","কর্মীদের ব্যক্তিগত পরিচ্ছন্নতা","Kebersihan pribadi pekerja"],["h3","ماذا نعني بالنظافة الشخصية؟","What do we mean by personal hygiene?","व्यक्तिगत स्वच्छता से हमारा क्या मतलब है?","ব্যক্তিগত পরিচ্ছন্নতা বলতে আমরা কী বুঝি?","Apa yang dimaksud dengan kebersihan pribadi?"],["li","هي مجموعة من القواعد البسيطة التي نتبعها للحفاظ على نظافتنا.","It is a set of simple rules we follow to keep ourselves clean.","यह सरल नियमों का समूह है जिन्हें हम अपनी सफाई के लिए मानते हैं।","এটি সাধারণ নিয়মের সেট যা আমরা নিজেদের পরিষ্কার রাখতে মেনে চলি।","Serangkaian aturan sederhana yang kita ikuti untuk menjaga kebersihan diri."],["li","تشمل الاهتمام بنظافة أجسامنا وملابسنا، واتباع عادات سليمة وصحية أثناء العمل.","It includes caring for the cleanliness of our bodies and clothes, and following sound, healthy habits at work.","इसमें शरीर और कपड़ों की सफाई पर ध्यान और काम के दौरान सही, स्वस्थ आदतें अपनाना शामिल है।","এতে শরীর ও পোশাকের পরিচ্ছন্নতা এবং কাজের সময় সুস্থ অভ্যাস মেনে চলা অন্তর্ভুক্ত।","Mencakup menjaga kebersihan tubuh dan pakaian, serta mengikuti kebiasaan sehat saat bekerja."],["li","الهدف الرئيسي هو منع انتشار الأمراض وحماية الغذاء من التلوث.","The main aim is to prevent the spread of disease and protect food from contamination.","मुख्य उद्देश्य रोगों का फैलाव रोकना और भोजन को संदूषण से बचाना है।","মূল উদ্দেশ্য রোগ ছড়ানো রোধ ও খাবারকে দূষণ থেকে রক্ষা করা।","Tujuan utamanya adalah mencegah penyebaran penyakit dan melindungi pangan dari kontaminasi."],["h3","لماذا النظافة الشخصية مهمة في عملنا؟","Why is personal hygiene important in our work?","हमारे काम में व्यक्तिगत स्वच्छता क्यों ज़रूरी है?","আমাদের কাজে ব্যক্তিগত পরিচ্ছন্নতা কেন গুরুত্বপূর্ণ?","Mengapa kebersihan pribadi penting dalam pekerjaan kita?"],["li","كثير منا قد يحمل بكتيريا ضارة دون أن يعرف.","Many of us may carry harmful bacteria without knowing it.","हममें से कई लोग बिना जाने हानिकारक जीवाणु लिए रहते हैं।","আমাদের অনেকেই না জেনে ক্ষতিকর ব্যাকটেরিয়া বহন করতে পারি।","Banyak dari kita mungkin membawa bakteri berbahaya tanpa menyadarinya."],["li","إذا لم نهتم بنظافتنا، قد تنتقل هذه البكتيريا إلى الغذاء.","If we do not care about our cleanliness, these bacteria may pass to food.","यदि हम अपनी सफाई पर ध्यान न दें, तो ये जीवाणु भोजन तक पहुँच सकते हैं।","আমরা নিজেদের পরিচ্ছন্নতায় যত্ন না নিলে এসব ব্যাকটেরিয়া খাবারে যেতে পারে।","Jika kita tidak peduli kebersihan, bakteri ini bisa berpindah ke pangan."],["li","نظافتنا تحمي عملاءنا من الأمراض المنقولة عبر الغذاء.","Our cleanliness protects our customers from foodborne diseases.","हमारी सफाई ग्राहकों को भोजन से फैलने वाली बीमारियों से बचाती है।","আমাদের পরিচ্ছন্নতা গ্রাহকদের খাবারবাহিত রোগ থেকে রক্ষা করে।","Kebersihan kita melindungi pelanggan dari penyakit bawaan pangan."],["li","الحفاظ عليها من اشتراطات العمل في مجال الغذاء.","Maintaining it is one of the requirements of working in food.","इसे बनाए रखना खाद्य क्षेत्र में काम की शर्तों में से एक है।","এটি বজায় রাখা খাদ্য খাতে কাজের শর্তগুলোর একটি।","Menjaganya merupakan salah satu persyaratan bekerja di bidang pangan."],["h3","كيف قد تنتقل البكتيريا منا إلى للغذاء؟","How can bacteria pass from us to food?","जीवाणु हमसे भोजन तक कैसे पहुँच सकते हैं?","ব্যাকটেরিয়া আমাদের থেকে খাবারে কীভাবে যেতে পারে?","Bagaimana bakteri dapat berpindah dari kita ke pangan?"],["li","بطريقة مباشرة: عند لمس الغذاء بأيدٍ متسخة، لمس الغذاء الجاهز للأكل مباشرة بدون قفازات، أو السعال أو العطس على الغذاء.","Directly: when touching food with dirty hands, touching ready-to-eat food directly without gloves, or coughing or sneezing on food.","सीधे: गंदे हाथों से भोजन छूने, दस्ताने पहन
