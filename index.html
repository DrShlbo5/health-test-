<script>
const PASS_PCT = 0.6;         // pass at 60% of total points (ordering questions carry 1-4 points)
const SHEET_URL = "https://script.google.com/macros/s/AKfycbyUF34JXE3kdRJp0h9y3lJvFsy1F1T0MFvdWcFyzfcGucQ9oWv8EbSm3LsE7tfdDDsn/exec";

// Sends the result to the Google Sheet. Fire-and-forget: no-cors means we cannot read the reply,
// but the Apps Script still receives and writes the row.
function sendToSheet(data) {
  try {
    fetch(SHEET_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
  } catch (e) {}
}
const QUIZ_LENGTH = 60;       // 40 multiple-choice + 20 true/false
const PASSWORD = "1122";
const TEST_CODE = "1234"; // code the manager gives employees when they are allowed to take the test
const CODE_T = {
  ar: { lbl: "رمز الاختبار (من المدير)", err: "رمز الاختبار غير صحيح" },
  en: { lbl: "Test code (from the manager)", err: "Incorrect test code" },
  hi: { lbl: "परीक्षा कोड (प्रबंधक से)", err: "परीक्षा कोड गलत है" },
  bn: { lbl: "পরীক্ষার কোড (ম্যানেজারের কাছ থেকে)", err: "পরীক্ষার কোড ভুল" },
  id: { lbl: "Kode tes (dari manajer)", err: "Kode tes salah" }
};

// Each question: q = question text, o = options (same order in all languages), c = index of correct option.
// Options are shuffled per employee, so the position of the answer is never fixed.

  {"cat":{"ar":"التنظيف والتطهير","en":"Cleaning and sanitizing","hi":"सफाई और सैनिटाइज़िंग","bn":"পরিষ্কার ও জীবাণুমুক্তকরণ","id":"Pembersihan dan sanitasi"},"q":{"ar":"ما درجة حرارة الماء المناسبة للغسيل الرئيسي للأواني والمعدات؟","en":"What water temperature is suitable for the main wash of utensils and equipment?","hi":"बर्तनों और उपकरणों की मुख्य धुलाई के लिए कौन सा पानी का तापमान उपयुक्त है?","bn":"বাসনপত্র ও সরঞ্জাম মূল ধোয়ার জন্য কোন পানির তাপমাত্রা উপযুক্ত?","id":"Berapa suhu air yang sesuai untuk pencucian utama peralatan dan perlengkapan?"},"o":{"ar":["حوالي 25°م","حوالي 82°م","حوالي 50°م","حوالي 100°م"],"en":["About 25°C","About 82°C","About 50°C","About 100°C"],"hi":["लगभग 25°C","लगभग 82°C","लगभग 50°C","लगभग 100°C"],"bn":["প্রায় ২৫°C","প্রায় ৮২°C","প্রায় ৫০°C","প্রায় ১০০°C"],"id":["Sekitar 25°C","Sekitar 82°C","Sekitar 50°C","Sekitar 100°C"]},"c":2},
  {"cat":{"ar":"التنظيف والتطهير","en":"Cleaning and sanitizing","hi":"सफाई और सैनिटाइज़िंग","bn":"পরিষ্কার ও জীবাণুমুক্তকরণ","id":"Pembersihan dan sanitasi"},"q":{"ar":"في الحوض الثالث، ما الطريقة الصحيحة للتطهير بالماء الساخن؟","en":"In the third sink, what is the correct hot-water sanitizing method?","hi":"तीसरे डिब्बे में गर्म पानी से सैनिटाइज़िंग का सही तरीका क्या है?","bn":"তৃতীয় কক্ষে গরম পানি দিয়ে জীবাণুমুক্ত করার সঠিক উপায় কী?","id":"Di bak ketiga, apa cara sanitasi dengan air panas yang benar?"},"o":{"ar":["الغمر في ماء بدرجة ٥٠°م لمدة دقيقة ثم التجفيف بالهواء","الغمر في ماء بدرجة ٢٥°م لمدة ٥ ثوانٍ ثم الشطف بالمنشفة","الشطف بالماء البارد فقط ثم ترك الأدوات تجف في الهواء الطلق","الغمر في ماء بدرجة ٨٢°م لمدة ١٠ ثوانٍ أو ٧٥°م لمدة ٣٠ ثانية"],"en":["Immerse in water at 50°C for one minute and then air dry","Immerse in water at 25°C for 5 seconds, then rinse with a towel","Rinse with cold water only and then leave the utensils to dry in the open air","Immerse in water at 82°C for 10 seconds or 75°C for 30 seconds"],"hi":["50°C पानी में एक मिनट डुबोएँ और फिर हवा में सुखाएँ","25°C पानी में 5 सेकंड डुबोएँ, फिर तौलिए से पोंछें","केवल ठंडे पानी से धोएँ और फिर बर्तनों को खुली हवा में सूखने दें","82°C पानी में 10 सेकंड या 75°C पर 30 सेकंड डुबोएँ"],"bn":["৫০°C পানিতে এক মিনিট ডুবিয়ে তারপর বাতাসে শুকান","২৫°C পানিতে ৫ সেকেন্ড ডুবিয়ে তারপর তোয়ালে দিয়ে মুছুন","শুধু ঠান্ডা পানিতে ধুয়ে তারপর খোলা বাতাসে বাসন শুকাতে দিন","৮২°C পানিতে ১০ সেকেন্ড বা ৭৫°C পানিতে ৩০ সেকেন্ড ডুবান"],"id":["Rendam dalam air 50°C selama satu menit lalu keringkan udara","Rendam dalam air 25°C selama 5 detik lalu bilas dengan handuk","Bilas hanya dengan air dingin lalu biarkan peralatan kering di udara terbuka","Rendam dalam air 82°C selama 10 detik atau 75°C selama 30 detik"]},"c":3},
  {"cat":{"ar":"التنظيف والتطهير","en":"Cleaning and sanitizing","hi":"सफाई और सैनिटाइज़िंग","bn":"পরিষ্কার ও জীবাণুমুক্তকরণ","id":"Pembersihan dan sanitasi"},"q":{"ar":"كم مدة التلامس المناسبة لمحلول المطهر الكيميائي على السطح؟","en":"What is the appropriate contact time for a chemical sanitizer solution on a surface?","hi":"किसी सतह पर रासायनिक सैनिटाइज़र घोल का उचित संपर्क समय कितना है?","bn":"কোনো পৃষ্ঠে রাসায়নিক স্যানিটাইজার দ্রবণের উপযুক্ত সংস্পর্শের সময় কত?","id":"Berapa lama waktu kontak yang tepat untuk larutan sanitizer kimia pada permukaan?"},"o":{"ar":["من ٣٠ ثانية إلى ٥ دقائق، أو حسب ما هو مكتوب على بطاقة المنتج","أقل من ثانية، مجرد رشة سريعة ثم مسح","ساعة كاملة بغض النظر عن المنتج المستخدم","لا حاجة لأي وقت تلامس بعد أن يبدو السطح مبللاً أو جافاً"],"en":["30 seconds to 5 minutes, or as the product label states","Less than one second, just a quick spray and wipe","A full hour, regardless of the product used","No contact time is needed once the surface looks wet and dry"],"hi":["30 सेकंड से 5 मिनट, या जैसा उत्पाद के लेबल पर लिखा हो","एक सेकंड से भी कम, बस एक त्वरित छिड़काव और पोंछना","पूरा एक घंटा, इस्तेमाल किए गए उत्पाद की परवाह किए बिना","कोई संपर्क समय ज़रूरी नहीं, सतह गीली या सूखी दिखे तब भी"],"bn":["৩০ সেকেন্ড থেকে ৫ মিনিট, অথবা পণ্যের লেবেলে যা লেখা আছে","এক সেকেন্ডেরও কম, শুধু দ্রুত স্প্রে করে মুছে নেওয়া","পুরো এক ঘণ্টা, ব্যবহৃত পণ্য যাই হোক না কেন","কোনো সময়ের দরকার নেই, তল ভেজা বা শুকনো যাই দেখাক"],"id":["30 detik sampai 5 menit, atau sesuai petunjuk label produk","Kurang dari satu detik, cukup semprot cepat lalu lap","Satu jam penuh, tidak peduli jenis produk yang dipakai","Tidak perlu waktu kontak, baik permukaan terlihat basah maupun kering"]},"c":0},
  {"cat":{"ar":"التنظيف والتطهير","en":"Cleaning and sanitizing","hi":"सफाई और सैनिटाइज़िंग","bn":"পরিষ্কার ও জীবাণুমুক্তকরণ","id":"Pembersihan dan sanitasi"},"q":{"ar":"لماذا تُترك الأسطح لتجف بالهواء بدلاً من مسحها بمنشفة قماشية؟","en":"Why are surfaces left to air-dry instead of being wiped with a cloth towel?","hi":"सतहों को कपड़े के तौलिये से पोंछने के बजाय हवा में क्यों सूखने दिया जाता है?","bn":"কাপড়ের তোয়ালে দিয়ে মোছার বদলে পৃষ্ঠ বাতাসে শুকাতে দেওয়া হয় কেন?","id":"Mengapa permukaan dibiarkan kering di udara daripada dilap dengan handuk kain?"},"o":{"ar":["الهواء وحده يقتل كل الميكروبات في كل الحالات، لذلك لا حاجة للمناشف","قد تنقل المناشف القماشية الجراثيم وتسبب إعادة التلوث","التجفيف بالهواء أسرع دائماً من أي طريقة أخرى في المطبخ","هو يمنع الصدأ فقط على الأسطح المعدنية للمعدات والأدوات"],"en":["Air alone kills all microbes in every case, so towels are not needed","Cloth towels can spread germs and cause re-contamination","Air drying is always faster than any other method in the kitchen","It only prevents rust on the metal surfaces of the equipment"],"hi":["अकेली हवा हर स्थिति में सारे सूक्ष्मजीव मार देती है, इसलिए तौलिए की ज़रूरत नहीं","कपड़े के तौलिए कीटाणु फैला सकते हैं और दोबारा संदूषण कर सकते हैं","हवा में सुखाना रसोई की किसी भी दूसरी विधि से हमेशा तेज़ होता है","यह केवल उपकरणों की धातु की सतहों पर जंग रोकता है"],"bn":["বাতাস একাই সব ক্ষেত্রে সব জীবাণু মেরে ফেলে, তাই তোয়ালের দরকার নেই","কাপড়ের তোয়ালে জীবাণু ছড়াতে পারে এবং পুনরায় দূষণ ঘটাতে পারে","রান্নাঘরের অন্য যেকোনো পদ্ধতির চেয়ে বাতাসে শুকানো সবসময় দ্রুত","এটি শুধু যন্ত্রপাতির ধাতব পৃষ্ঠে মরিচা পড়া আটকায়"],"id":["Udara saja membunuh semua mikroba dalam setiap kasus, jadi handuk tidak diperlukan","Handuk kain dapat menyebarkan kuman dan menyebabkan kontaminasi ulang","Pengeringan udara selalu lebih cepat daripada metode lain di dapur","Itu hanya mencegah karat pada permukaan logam peralatan"]},"c":1},
  {"cat":{"ar":"المواد الكيميائية","en":"Chemicals","hi":"रसायन","bn":"রাসায়নিক","id":"Bahan kimia"},"q":{"ar":"أين يجب تخزين المواد الكيميائية في المنشأة؟","en":"Where should chemicals be stored in the establishment?","hi":"प्रतिष्ठान में रसायनों को कहां रखना चाहिए?","bn":"প্রতিষ্ঠানে রাসায়নিক কোথায় রাখা উচিত?","id":"Di mana bahan kimia harus disimpan di fasilitas?"},"o":{"ar":["على الرف العلوي فوق الطعام حتى تكون محمية من الأطفال","بجانب أدوات التقديم حتى يصل إليها الموظفون بسرعة","في أماكن مخصصة بعيداً عن الطعام ومعدات تجهيزه","في زجاجات مشروبات غازية فارغة موضوعة بجانب رفوف منطقة الطبخ"],"en":["On the top shelf above food, so they are protected from children","Next to the serving utensils so staff can reach them quickly","In dedicated places away from food and food-prep equipment","In empty soft-drink bottles stored beside the cooking area shelves"],"hi":["भोजन के ऊपर वाली सबसे ऊँची शेल्फ़ पर, ताकि बच्चों से सुरक्षित रहें","परोसने वाले बर्तनों के पास, ताकि स्टाफ़ जल्दी पहुँच सके","अलग निर्धारित जगहों पर, भोजन और भोजन तैयार करने के उपकरणों से दूर","खाली सॉफ़्ट-ड्रिंक की बोतलों में, पकाने वाले क्षेत्र की शेल्फ़ों के पास"],"bn":["খাবারের উপরের তাকে, শিশুদের নাগাল থেকে রক্ষা করতে","পরিবেশনের পাত্রের পাশে, যাতে কর্মীরা দ্রুত পৌঁছাতে পারে","নির্দিষ্ট আলাদা জায়গায়, খাবার ও খাবার প্রস্তুতের যন্ত্রপাতি থেকে দূরে","খালি সফট-ড্রিঙ্কের বোতলে, রান্নার জায়গার তাকের পাশে রেখে"],"id":["Di rak paling atas di atas makanan agar terlindungi dari anak-anak","Di samping peralatan saji agar staf dapat cepat menjangkaunya","Di tempat khusus yang terpisah dari makanan dan peralatan pengolahan makanan","Dalam botol minuman ringan kosong yang disimpan di dekat rak area masak"]},"c":2},
  {"cat":{"ar":"المواد الكيميائية","en":"Chemicals","hi":"रसायन","bn":"রাসায়নিক","id":"Bahan kimia"},"q":{"ar":"هل يجوز استخدام عبوة كانت تحتوي على مادة تنظيف لتعبئة الماء أو العصائر؟","en":"Is it allowed to use a container that held cleaning chemicals to store water or juice?","hi":"क्या सफाई रसायन वाले डिब्बे में पानी या जूस भरना अनुमत है?","bn":"পরিষ্কারক রাসায়নিকের পাত্রে পানি বা জুস রাখা কি অনুমোদিত?","id":"Bolehkah wadah bekas bahan pembersih dipakai untuk menyimpan air atau jus?"},"o":{"ar":["نعم، إذا شُطفت جيداً بالماء الساخن عدة مرات","نعم، إذا بدت العبوة نظيفة ولم يبقَ عليها أي ملصق","نعم، إذا كانت كمية المادة الكيميائية المتبقية فيها قليلة جداً","لا، لا يجوز استخدام عبوات المواد الكيميائية للطعام"],"en":["Yes, if it is rinsed well with hot water several times","Yes, if the container looks clean and has no label left","Yes, if only a small amount of chemical was left inside it","No, chemical containers must not be used for food"],"hi":["हाँ, अगर गर्म पानी से कई बार अच्छी तरह धो लिया गया हो","हाँ, अगर कंटेनर साफ़ दिखता हो और उस पर कोई लेबल न बचा हो","हाँ, अगर उसके अंदर रसायन की बहुत थोड़ी मात्रा बची हो","नहीं, रसायन के कंटेनर भोजन के लिए इस्तेमाल नहीं किए जा सकते"],"bn":["হ্যাঁ, গরম পানি দিয়ে কয়েকবার ভালোভাবে ধুয়ে নিলে","হ্যাঁ, পাত্র পরিষ্কার দেখালে এবং তাতে কোনো লেবেল না থাকলে","হ্যাঁ, ভেতরে যদি রাসায়নিক সামান্য পরিমাণে অবশিষ্ট থাকে","না, রাসায়নিকের পাত্র খাবারের জন্য ব্যবহার করা যাবে না"],"id":["Ya, jika sudah dibilas dengan air panas beberapa kali","Ya, jika wadahnya terlihat bersih dan tidak ada label yang tersisa","Ya, jika hanya tersisa sedikit bahan kimia di dalamnya","Tidak, wadah bahan kimia tidak boleh digunakan untuk makanan"]},"c":3},
  {"cat":{"ar":"الملوثات الفيزيائية","en":"Physical contamination","hi":"भौतिक संदूषण","bn":"ভৌত দূষণ","id":"Kontaminasi fisik"},"q":{"ar":"أي مما يلي يُعد من الملوثات الفيزيائية الناتجة عن المعدات؟","en":"Which of these is a physical contaminant from equipment?","hi":"इनमें से कौन सा उपकरणों से होने वाला भौतिक संदूषक है?","bn":"এর মধ্যে কোনটি সরঞ্জাম থেকে আসা ভৌত দূষক?","id":"Manakah yang merupakan kontaminan fisik dari peralatan?"},"o":{"ar":["قطع معدنية صغيرة من أدوات مكسورة","جراثيم السالمونيلا التي تبقى في زوايا المعدات الرطبة","بقايا منظف كيميائي بسبب سوء شطف المعدات","أبواغ العفن التي تنمو في الزوايا الرطبة لغرفة التخزين"],"en":["Small metal pieces from broken tools","Salmonella bacteria that survive in damp equipment corners","Chemical cleaner residue left after poor rinsing of equipment","Mould spores growing in damp corners of the storage room"],"hi":["टूटे औज़ारों से निकले छोटे धात्विक टुकड़े","साल्मोनेला बैक्टीरिया जो नम उपकरणों के कोनों में बचे रहते हैं","खराब धुलाई के कारण उपकरण पर बचा रसायन क्लीनर का अवशेष","भंडार कक्ष के नम कोनों में उगने वाले फफूंद के बीजाणु"],"bn":["ভাঙা যন্ত্র থেকে আসা ছোট ধাতব টুকরো","স্যালমোনেলা জীবাণু যা ভেজা যন্ত্রপাতির কোণে টিকে থাকে","ভালোভাবে না ধোয়ায় যন্ত্রে লেগে থাকা রাসায়নিক পরিষ্কারকের অবশেষ","স্টোর রুমের ভেজা কোণে জন্মানো ছাতার বীজাণু"],"id":["Potongan logam kecil dari peralatan yang rusak","Bakteri Salmonella yang bertahan di sudut peralatan yang lembap","Sisa pembersih kimia akibat pembilasan peralatan yang buruk","Spora jamur yang tumbuh di sudut lembap ruang penyimpanan"]},"c":0},
  {"cat":{"ar":"الملوثات الفيزيائية","en":"Physical contamination","hi":"भौतिक संदूषण","bn":"ভৌত দূষণ","id":"Kontaminasi fisik"},"q":{"ar":"عند كسر زجاجة أو أداة زجاجية قرب الغذاء، ما الإجراء الصحيح؟","en":"A glass bottle or glass tool breaks near food. What is the correct action?","hi":"खाने के पास कांच की बोतल या कांच का औज़ार टूट जाता है। सही कदम क्या है?","bn":"খাবারের কাছে কাঁচের বোতল বা কাঁচের যন্ত্র ভেঙে যায়। সঠিক পদক্ষেপ কী?","id":"Botol kaca atau alat kaca pecah dekat makanan. Apa tindakan yang benar?"},"o":{"ar":["نظّف القطع بسرعة بقطعة قماش واستمر في العمل بشكل طبيعي في المنطقة","أوقف العمل في المنطقة وأبلغ فوراً ولا تستخدم أي طعام مكشوف","انقل الزجاج بعيداً عن الطعام فقط دون إبلاغ أي شخص بذلك إطلاقاً","أكمل الطلب أولاً وأبلغ بهدوء في نهاية الوردية بعد الانتهاء منه"],"en":["Clean up the pieces quickly with a cloth and continue working normally in the area","Stop work in the area, report immediately, and do not use any exposed food","Only move the glass away from the food without reporting it to anyone at all","Finish the order first and report it calmly at the end of the shift, once done"],"hi":["टुकड़ों को जल्दी से कपड़े से साफ़ करें और उस क्षेत्र में सामान्य रूप से काम जारी रखें","काम उस क्षेत्र में रोकें, तुरंत सूचना दें, और खुला कोई भी खाना इस्तेमाल न करें","कांच को केवल खाने से दूर खिसकाएँ, किसी को बताए बिना","पहले ऑर्डर पूरा करें और शिफ़्ट के अंत में शांति से रिपोर्ट करें"],"bn":["টুকরোগুলো কাপড় দিয়ে দ্রুত পরিষ্কার করে এলাকায় স্বাভাবিকভাবে কাজ চালিয়ে যান","ওই এলাকার কাজ থামান, সঙ্গে সঙ্গে জানান, এবং খোলা কোনো খাবার ব্যবহার করবেন না","কাচ শুধু খাবার থেকে সরান, কাউকে না জানিয়ে","আগে অর্ডার শেষ করুন, তারপর শিফটের শেষে শান্তভাবে জানান"],"id":["Bersihkan pecahannya dengan kain dengan cepat dan lanjutkan bekerja seperti biasa di area itu","Hentikan kerja di area itu, segera laporkan, dan jangan gunakan makanan yang terbuka","Hanya pindahkan kaca dari makanan tanpa melaporkannya kepada siapa pun sama sekali","Selesaikan pesanan dulu lalu laporkan dengan tenang di akhir shift setelah selesai"]},"c":1},
  {"cat":{"ar":"مكافحة الآفات","en":"Pest control","hi":"कीट नियंत्रण","bn":"কীটপতঙ্গ নিয়ন্ত্রণ","id":"Pengendalian hama"},"q":{"ar":"ما العلامة الأوضح على وجود نشاط للقوارض في المنشأة؟","en":"What is the clearest sign of rodent activity in the establishment?","hi":"प्रतिष्ठान में कृंतकों की गतिविधि का सबसे स्पष्ट संकेत क्या है?","bn":"প্রতিষ্ঠানে ইঁদুরের সক্রিয়তার সবচেয়ে স্পষ্ট লক্ষণ কী?","id":"Apa tanda paling jelas adanya aktivitas tikus di fasilitas?"},"o":{"ar":["رائحة عطر قوية تبقى في غرفة التخزين طوال اليوم","صوت الأجهزة الكهربائية التي تعمل في منطقة التخزين","فضلات طازجة وآثار قضم أو تمزق في المواد والتغليف","بقع ملونة على الجدران تبدو كعلامات دهان قديم"],"en":["A strong perfume smell that stays in the storage room all day","The sound of electrical appliances running in the storage area","Fresh droppings and gnaw marks or tears in packaging","Coloured stains on walls that look like old paint marks"],"hi":["तेज़ इत्र जैसी गंध जो पूरे दिन भंडार कक्ष में रहती है","भंडार क्षेत्र में चलते बिजली उपकरणों की आवाज़","ताज़ी बीट और सामान या पैकिंग में कुतरे या फटे निशान","दीवारों पर रंगीन धब्बे जो पुराने पेंट के निशान जैसे दिखें"],"bn":["কড়া সুগন্ধির গন্ধ যা সারাদিন স্টোর রুমে থাকে","স্টোর এলাকায় চালু থাকা বৈদ্যুতিক যন্ত্রের শব্দ","তাজা মল এবং উপাদান বা প্যাকেটে কাটার দাগ বা ছেঁড়া","দেয়ালে রঙিন দাগ যা পুরনো রঙের দাগের মতো দেখায়"],"id":["Bau parfum yang kuat dan bertahan di ruang penyimpanan sepanjang hari","Suara peralatan listrik yang menyala di area penyimpanan","Kotoran segar dan bekas gigitan atau robekan pada kemasan","Noda berwarna di dinding yang terlihat seperti bekas cat lama"]},"c":2},
  {"cat":{"ar":"مكافحة الآفات","en":"Pest control","hi":"कीट नियंत्रण","bn":"কীটপতঙ্গ নিয়ন্ত্রণ","id":"Pengendalian hama"},"q":{"ar":"أي علامة تشير إلى وجود الصراصير في المنشأة؟","en":"Which sign indicates cockroaches in the establishment?","hi":"कौन सा संकेत प्रतिष्ठान में तिलचट्टों की उपस्थिति दर्शाता है?","bn":"কোন লক্ষণ প্রতিষ্ঠানে তেলাপোকার উপস্থিতি নির্দেশ করে?","id":"Tanda apa yang menunjukkan adanya kecoa di fasilitas?"},"o":{"ar":["ألوان زاهية مطلية على الأرضية بالقرب من باب المدخل الرئيسي","بقع رطوبة على الجدران بالقرب من منطقة المغسلة فقط","أصوات خدش قادمة من الجدران ليلاً فقط","نقاط داكنة صغيرة أو حبيبات دقيقة في الزوايا وعلى الرفوف"],"en":["Bright colours painted on the floor near the main entrance door","Moisture stains on the walls near the sink area only","Scratching sounds coming from the walls at night only","Small dark spots or tiny pellets in corners and on shelves"],"hi":["मुख्य प्रवेश द्वार के पास फ़र्श पर पेंट किए गए चमकीले रंग","केवल सिंक क्षेत्र के पास की दीवारों पर नमी के दाग","केवल रात में दीवारों से आने वाली खरोंच जैसी आवाज़ें","कोनों और शेल्फ़ों पर छोटे काले धब्बे या बहुत छोटी गोलियाँ"],"bn":["প্রধান প্রবেশপথের কাছে মেঝেতে আঁকা উজ্জ্বল রঙ","শুধু সিঙ্কের কাছের দেয়ালে আর্দ্রতার দাগ","শুধু রাতে দেয়াল থেকে আসা আঁচড়ের শব্দ","কোণে ও তাকে ছোট কালো দাগ বা ছোট ছোট বিষ্ঠার দানা"],"id":["Warna cerah yang dicat di lantai dekat pintu masuk utama","Noda lembap di dinding dekat area wastafel saja","Suara gesekan dari dinding hanya pada malam hari","Bintik hitam kecil atau butiran kecil di sudut dan pada rak"]},"c":3},

  {"cat":{"ar":"الأمراض المنقولة بالغذاء","en":"Foodborne illness","hi":"खाद्य जनित बीमारी","bn":"খাদ্যবাহিত রোগ","id":"Penyakit bawaan makanan"},"q":{"ar":"ما الإجراء الصحيح مع الأرز المطبوخ لتجنب بكتيريا الباسيلس سيريوس؟","en":"What is the correct action with cooked rice to avoid Bacillus cereus?","hi":"बैसिलस सेरियस से बचने के लिए पके चावल के साथ सही कदम क्या है?","bn":"ব্যাসিলাস সেরিয়াস এড়াতে রান্না করা ভাতের সঙ্গে সঠিক পদক্ষেপ কী?","id":"Apa tindakan yang benar pada nasi matang untuk menghindari Bacillus cereus?"},"o":{"ar":["تبريده بسرعة وتجنب تركه طويلاً في الحرارة وإعادة تسخينه إلى ٨٢°م","تركه في درجة حرارة الغرفة حتى صباح اليوم التالي للراحة","تبريده ببطء في الغرفة وتغطيته وهو ما زال دافئاً","إعادة تسخينه إلى ٤٠°م فقط وإبقاؤه دافئاً لبقية اليوم"],"en":["Cool it quickly, avoid long room-temperature holding, and reheat to 82°C","Leave it at room temperature until the next morning, which is convenient for the staff","Cool it slowly in the room and cover it while it is still warm","Reheat it only to 40°C and keep it warm for the rest of the day"],"hi":["जल्दी ठंडा करना, कमरे के तापमान पर देर तक न रखना, और 82°C तक दोबारा गरम करना","सुविधा के लिए अगली सुबह तक कमरे के तापमान पर छोड़ देना","कमरे में धीरे-धीरे ठंडा होने देना और गरम रहते ढक देना","केवल 40°C तक गरम करना और पूरे दिन गरम रखना"],"bn":["দ্রুত ঠান্ডা করা, ঘরের তাপমাত্রায় দীর্ঘক্ষণ না রাখা, এবং ৮২°C পর্যন্ত আবার গরম করা","সুবিধার জন্য পরের দিন সকাল পর্যন্ত ঘরের তাপমাত্রায় রেখে দেওয়া","ঘরে ধীরে ঠান্ডা হতে দেওয়া এবং গরম থাকতেই ঢেকে রাখা","শুধু ৪০°C পর্যন্ত গরম করা এবং সারাদিন গরম রাখা"],"id":["Dinginkan dengan cepat, hindari dibiarkan lama di suhu ruang, dan panaskan ulang hingga 82°C","Membiarkannya di suhu ruang sampai keesokan pagi agar praktis","Dinginkan perlahan di ruangan dan tutup saat masih hangat","Panaskan ulang hanya sampai 40°C dan biarkan hangat sepanjang hari"]},"c":0},
  {"cat":{"ar":"الحساسية الغذائية","en":"Food allergy","hi":"खाद्य एलर्जी","bn":"খাদ্য অ্যালার্জি","id":"Alergi makanan"},"q":{"ar":"متى تظهر أعراض الحساسية الغذائية عادةً بعد تناول الطعام المسبب لها؟","en":"When do food allergy symptoms usually appear after eating the trigger food?","hi":"जिस खाने से एलर्जी होती है, उसे खाने के बाद लक्षण आमतौर पर कब दिखते हैं?","bn":"যে খাবারে অ্যালার্জি, তা খাওয়ার পর সাধারণত কখন লক্ষণ দেখা দেয়?","id":"Kapan gejala alergi makanan biasanya muncul setelah memakan makanan pemicunya?"},"o":{"ar":["بعد أسبوع تقريباً من تناول الطعام نفسه","خلال دقائق أو بضع ساعات بعد الأكل","لا تظهر أبداً لأن الجسم يتكيف مع الطعام بسرعة","فقط بعد شهر كامل من تناول الطعام بانتظام"],"en":["After a week or so of eating the same food","Within minutes or a few hours after eating","Never, because the body adapts to the food quickly","Only after a full month of regular eating the food"],"hi":["एक हफ़्ते या उसके आसपास लगातार वही खाना खाने के बाद","खाने के कुछ मिनट या कुछ घंटों के भीतर","कभी नहीं, क्योंकि शरीर खाने के लिए जल्दी ढल जाता है","केवल एक पूरे महीने तक नियमित खाने के बाद"],"bn":["এক সপ্তাহ বা তার কাছাকাছি একই খাবার খাওয়ার পর","খাওয়ার কয়েক মিনিট বা কয়েক ঘণ্টার মধ্যে","কখনোই না, কারণ শরীর খাবারের সঙ্গে দ্রুত অভ্যস্ত হয়ে যায়","শুধু এক পূর্ণ মাস নিয়মিত খাওয়ার পর"],"id":["Sekitar seminggu setelah terus memakan makanan yang sama","Dalam hitungan menit atau beberapa jam setelah makan","Tidak pernah, karena tubuh cepat menyesuaikan diri dengan makanan","Hanya setelah sebulan penuh makan secara rutin"]},"c":1},

  {"cat":{"ar":"الأمراض المنقولة بالغذاء","en":"Foodborne illness","hi":"खाद्य जनित बीमारी","bn":"খাদ্যবাহিত রোগ","id":"Penyakit bawaan makanan"},"q":{"ar":"خلال كم ساعة تقريباً تظهر أعراض التسمم الغذائي الناتج عن الميكروبات عادةً؟","en":"Roughly how many hours after eating contaminated food do microbial food poisoning symptoms usually appear?","hi":"दूषित खाना खाने के बाद सूक्ष्मजीव से होने वाला खाद्य विषाक्तता का लक्षण आमतौर पर कितने घंटों में दिखता है?","bn":"দূষিত খাবার খাওয়ার কত ঘণ্টা পরে সাধারণত অণুজীবজনিত খাদ্যে বিষক্রিয়ার লক্ষণ দেখা দেয়?","id":"Berapa jam kira-kira gejala keracunan makanan akibat mikroba biasanya muncul setelah makan?"},"o":{"ar":["خلال دقيقتين فقط، بمجرد بلع الطعام","عادةً بين ساعتين و٣٦ ساعة بعد الأكل","بعد شهرين، بعد هضم الطعام تماماً","دائماً بعد يوم واحد دون أي استثناء لأي شخص"],"en":["Within 2 minutes only, as soon as the food is swallowed","Usually between 2 and 36 hours after eating","After 2 months, once the food is fully digested","Always after one day, without exceptions for anyone"],"hi":["केवल 2 मिनट के भीतर, खाना निगलते ही","आमतौर पर खाने के 2 से 36 घंटे के बीच","2 महीने बाद, खाना पूरी तरह पचने के बाद","हमेशा एक दिन बाद, किसी के लिए कोई अपवाद नहीं"],"bn":["শুধু ২ মিনিটের মধ্যে, খাবার গেলার সঙ্গে সঙ্গে","সাধারণত খাওয়ার ২ থেকে ৩৬ ঘণ্টার মধ্যে","২ মাস পরে, খাবার পুরোপুরি হজম হওয়ার পর","সবসময় একদিন পরে, কারও জন্য কোনো ব্যতিক্রম ছাড়া"],"id":["Hanya dalam 2 menit, segera setelah makanan ditelan","Biasanya antara 2 dan 36 jam setelah makan","Setelah 2 bulan, setelah makanan sepenuhnya tercerna","Selalu setelah satu hari, tanpa pengecualian untuk siapa pun"]},"c":1},
  {"cat":{"ar":"الفئات الأكثر عرضة","en":"High-risk groups","hi":"उच्च जोखिम वाले समूह","bn":"উচ্চ ঝুঁকির গোষ্ঠী","id":"Kelompok berisiko tinggi"},"q":{"ar":"أي فئة هي الأكثر عرضة للإصابة بالتسمم الغذائي وخطورته؟","en":"Which group is most at risk of food poisoning and its severe effects?","hi":"खाद्य विषाक्तता और उसके गंभीर असर का सबसे अधिक खतरा किस समूह को है?","bn":"খাদ্যে বিষক্রিয়া ও তার গুরুতর প্রভাবের সবচেয়ে বেশি ঝুঁকিতে কোন গোষ্ঠী?","id":"Kelompok mana yang paling berisiko terkena keracunan makanan dan dampak beratnya?"},"o":{"ar":["البالغون الأصحاء فقط لأن جهازهم المناعي هو الأقوى","الرياضيون الذين يتدربون بقوة ويتناولون كميات كبيرة من البروتين يومياً","الأطفال دون ٥ سنوات وكبار السن والحوامل","موظفو المكاتب الذين يجلسون على المكاتب ونادراً ما يتعاملون مع الطعام"],"en":["Healthy adults only, since they have the strongest immune systems","Athletes who train hard and eat large amounts of protein daily","Children under 5, older people and pregnant women","Office staff who sit at desks and rarely handle any food"],"hi":["केवल स्वस्थ वयस्क, क्योंकि उनकी रोग-प्रतिरोधक क्षमता सबसे मज़बूत होती है","एथलीट जो कड़ी ट्रेनिंग करते हैं और रोज़ाना भारी मात्रा में प्रोटीन लेते हैं","5 वर्ष से कम बच्चे, बुज़ुर्ग और गर्भवती महिलाएँ","ऑफ़िस स्टाफ़ जो डेस्क पर बैठते हैं और शायद ही कभी खाना संभालते हैं"],"bn":["শুধু সুস্থ প্রাপ্তবয়স্করা, কারণ তাদের রোগ-প্রতিরোধ ক্ষমতা সবচেয়ে শক্তিশালী","যে অ্যাথলেটরা কঠোর প্রশিক্ষণ নেন এবং প্রতিদিন প্রচুর প্রোটিন খান","৫ বছরের নিচে শিশু, বয়স্ক মানুষ ও গর্ভবতী নারী","অফিস কর্মী যারা ডেস্কে বসে থাকেন এবং খুব কমই খাবার নিয়ে কাজ করেন"],"id":["Hanya orang dewasa yang sehat karena sistem kekebalan tubuhnya paling kuat","Atlet yang berlatih keras dan makan banyak protein setiap hari","Anak di bawah 5 tahun, lansia, dan ibu hamil","Karyawan kantor yang duduk di meja dan jarang menangani makanan"]},"c":2},
  {"cat":{"ar":"فساد الأغذية","en":"Food spoilage","hi":"खाद्य खराब होना","bn":"খাবার নষ্ট হওয়া","id":"Pembusukan makanan"},"q":{"ar":"أي هذه الأغذية تُعد سريعة الفساد؟","en":"Which of these foods spoil quickly?","hi":"इनमें से कौन से खाद्य पदार्थ जल्दी खराब होते हैं?","bn":"এর মধ্যে কোন খাবারগুলো দ্রুত নষ্ট হয়?","id":"Manakah makanan berikut yang cepat rusak?"},"o":{"ar":["السكر والدقيق","الزيت والملح","المعلبات المغلقة","اللبن والسمك واللحم"],"en":["Sugar and flour","Oil and salt","Sealed canned goods","Milk, fish and meat"],"hi":["चीनी और आटा","तेल और नमक","बंद डिब्बाबंद सामान","दूध, मछली और मांस"],"bn":["চিনি ও ময়দা","তেল ও লবণ","বন্ধ টিনজাত খাবার","দুধ, মাছ ও মাংস"],"id":["Gula dan tepung","Minyak dan garam","Makanan kaleng tertutup","Susu, ikan, dan daging"]},"c":3},
  {"cat":{"ar":"فساد الأغذية","en":"Food spoilage","hi":"खाद्य खराब होना","bn":"খাবার নষ্ট হওয়া","id":"Pembusukan makanan"},"q":{"ar":"ما الفرق بين تاريخ \"استخدام قبل\" (Use by) و\"يفضل قبل\" (Best before)؟","en":"What is the difference between \"Use by\" and \"Best before\" dates?","hi":"\"Use by\" और \"Best before\" तारीख में क्या अंतर है?","bn":"\"Use by\" ও \"Best before\" তারিখের মধ্যে পার্থক্য কী?","id":"Apa perbedaan antara tanggal \"Use by\" dan \"Best before\"?"},"o":{"ar":["تاريخ الاستخدام يتعلق بالسلامة، وتاريخ الأفضلية يتعلق بالجودة","لا فرق بين التاريخين على ملصقات الطعام","تاريخ الأفضلية يتعلق بالسلامة فقط، لذلك يجب اتباعه دائماً","تاريخ الاستخدام يتعلق بالطعم فقط ويمكن تجاهله لسلامة الطعام"],"en":["Use by relates to safety; Best before relates to quality","There is no difference between the two dates on food labels","Best before relates to safety only, so it must always be followed","Use by relates to taste only and can be ignored for food safety"],"hi":["'उपयोग तिथि' सुरक्षा से और 'सर्वोत्तम पूर्व तिथि' गुणवत्ता से जुड़ी है","खाने के लेबल पर इन दोनों तारीखों में कोई फ़र्क नहीं है","'सर्वोत्तम पूर्व तिथि' केवल सुरक्षा से जुड़ी है, इसलिए हमेशा उसका पालन करें","'उपयोग तिथि' केवल स्वाद से जुड़ी है और खाने की सुरक्षा के लिए अनदेखी की जा सकती है"],"bn":["'ব্যবহারের শেষ তারিখ' নিরাপত্তার সঙ্গে এবং 'সেরা ব্যবহারের তারিখ' মানের সঙ্গে সম্পর্কিত","খাবারের লেবেলে দুই তারিখের মধ্যে কোনো পার্থক্য নেই","'সেরা ব্যবহারের তারিখ' শুধু নিরাপত্তার সঙ্গে সম্পর্কিত, তাই সবসময় মানা উচিত","'ব্যবহারের শেষ তারিখ' শুধু স্বাদের সঙ্গে সম্পর্কিত এবং নিরাপত্তার জন্য উপেক্ষা করা যায়"],"id":["'Gunakan sebelum' berkaitan dengan keamanan; 'Sebaiknya dikonsumsi sebelum' berkaitan dengan mutu","Tidak ada perbedaan antara kedua tanggal pada label makanan","'Sebaiknya dikonsumsi sebelum' hanya berkaitan dengan keamanan sehingga harus selalu diikuti","'Gunakan sebelum' hanya berkaitan dengan rasa dan bisa diabaikan demi keamanan makanan"]},"c":0},

  {"cat":{"ar":"الميزان الحراري","en":"Thermometer use","hi":"थर्मामीटर का उपयोग","bn":"থার্মোমিটার ব্যবহার","id":"Penggunaan termometer"},"q":{"ar":"عند قياس حرارة قطعة لحم، إلى أي عمق يجب إدخال مقياس الحرارة؟","en":"When measuring a piece of meat, how deep should the thermometer probe go?","hi":"मांस के टुकड़े का तापमान मापते समय थर्मामीटर को कितनी गहराई तक डालना चाहिए?","bn":"মাংসের টুকরোর তাপমাত্রা মাপার সময় থার্মোমিটার কতটা গভীরে ঢোকাতে হবে?","id":"Saat mengukur suhu sepotong daging, seberapa dalam probe termometer harus dimasukkan?"},"o":{"ar":["فقط ١ سم على سطح اللحم حيث يسهل الوصول إليه","١٠ سم عمقاً حتى يصل المسبار إلى وسط القطعة","حوالي ٢.٥ سم داخل الجزء الأسمك من اللحم","العمق لا يهم طالما يتحرك المسبار هنا وهناك"],"en":["Only 1 cm on the surface of the meat, where it is easy to reach","10 cm deep, so the probe reaches the middle of the piece","About 2.5 cm into the thickest part of the meat","Depth does not matter as long as the probe moves around"],"hi":["केवल सतह पर 1 सेमी, जहाँ पहुँचना आसान है","10 सेमी गहराई तक, ताकि प्रोब टुकड़े के बीच तक पहुँचे","मांस के सबसे मोटे हिस्से में लगभग 2.5 सेमी अंदर","गहराई मायने नहीं रखती, बस प्रोब इधर-उधर घुमाया जाए"],"bn":["শুধু মাংসের উপরে ১ সেমি, যেখানে পৌঁছানো সহজ","১০ সেমি গভীরে, যাতে প্রোব টুকরোর মাঝখান পর্যন্ত পৌঁছায়","মাংসের সবচেয়ে মোটা অংশে প্রায় ২.৫ সেমি ভেতরে","গভীরতা জরুরি নয়, প্রোব এদিক-ওদিক নাড়ালেই হলো"],"id":["Hanya 1 cm di permukaan daging yang mudah dijangkau","Sedalam 10 cm agar probe mencapai bagian tengah potongan","Sekitar 2,5 cm ke dalam bagian daging yang paling tebal","Kedalaman tidak penting selama probe digerakkan ke sana kemari"]},"c":2},
  {"cat":{"ar":"التخزين في الثلاجة","en":"Fridge storage","hi":"फ्रिज में भंडारण","bn":"ফ্রিজে সংরক্ষণ","id":"Penyimpanan di kulkas"},"q":{"ar":"أين يُخزن الغذاء النيء في الثلاجة؟","en":"Where should raw food be stored in the fridge?","hi":"फ्रिज में कच्चा खाना कहां रखना चाहिए?","bn":"ফ্রিজে কাঁচা খাবার কোথায় রাখা উচিত?","id":"Di mana makanan mentah harus disimpan di kulkas?"},"o":{"ar":["فوق الطعام الجاهز للأكل حتى يقطر اللحم النيء بشكل أقل","بجانب الخضروات على الرف الأوسط في الثلاجة","على الرف العلوي حيث يسهل رؤيته والوصول إليه يومياً","على الرف السفلي، بعيداً عن الطعام الجاهز للأكل"],"en":["Above ready-to-eat food so that the raw meat drips less often","Next to the vegetables on the middle shelf of the fridge","On the top shelf, where it is easy to see and reach daily","On the lowest shelf, away from ready-to-eat food"],"hi":["तैयार खाने के ऊपर, ताकि कच्चे मांस से कम टपके","फ़्रिज की बीच वाली शेल्फ़ पर सब्ज़ियों के बगल में","सबसे ऊपर की शेल्फ़ पर, जहाँ रोज़ाना देखना और पहुँचना आसान हो","सबसे निचली शेल्फ़ पर, तैयार खाने से दूर"],"bn":["তৈরি খাবারের উপরে, যাতে কাঁচা মাংস থেকে কম চুঁইয়ে পড়ে","ফ্রিজের মাঝের তাকে সবজির পাশে","সবচেয়ে উপরের তাকে, যেখানে প্রতিদিন দেখা ও পৌঁছানো সহজ","সবচেয়ে নিচের তাকে, তৈরি খাবার থেকে দূরে"],"id":["Di atas makanan siap saji agar daging mentah lebih jarang menetes","Di samping sayuran pada rak tengah kulkas","Di rak paling atas, tempat yang mudah dilihat dan dijangkau setiap hari","Di rak paling bawah, jauh dari makanan siap saji"]},"c":3},
  {"cat":{"ar":"التغطية","en":"Covering food","hi":"खाना ढकना","bn":"খাবার ঢেকে রাখা","id":"Menutup makanan"},"q":{"ar":"متى يجب تغطية الغذاء؟","en":"When must food be covered?","hi":"खाने को कब ढकना ज़रूरी है?","bn":"কখন খাবার ঢেকে রাখা বাধ্যতামূলক?","id":"Kapan makanan harus ditutup?"},"o":{"ar":["في كل الأوقات، لحمايته من التلوث","فقط أثناء فترات التخزين الطويلة في الثلاجة والمجمدة","فقط ليلاً عندما يكون المكان مغلقاً لليوم","غير مطلوب إطلاقاً إذا بدت الثلاجة والمطبخ نظيفين"],"en":["At all times, to protect it from contamination","Only during long storage periods in the fridge and freezer","Only at night when the establishment is closed for the day","Not needed at all if the fridge and kitchen look clean"],"hi":["हर समय, उसे संदूषण से बचाने के लिए","केवल फ़्रिज और फ़्रीज़र में लंबे समय तक रखने के दौरान","केवल रात में, जब प्रतिष्ठान दिन के लिए बंद हो","फ़्रिज और रसोई साफ़ दिखें तो इसकी बिल्कुल ज़रूरत नहीं"],"bn":["সবসময়, দূষণ থেকে রক্ষা করতে","শুধু ফ্রিজ ও ফ্রিজারে দীর্ঘসময় রাখার সময়","শুধু রাতে, যখন দিনের জন্য প্রতিষ্ঠান বন্ধ থাকে","ফ্রিজ ও রান্নাঘর পরিষ্কার দেখালে এটির একেবারেই দরকার নেই"],"id":["Setiap saat, untuk melindunginya dari kontaminasi","Hanya selama penyimpanan lama di kulkas dan freezer","Hanya pada malam hari ketika tempat usaha tutup untuk hari itu","Tidak perlu sama sekali jika kulkas dan dapur terlihat bersih"]},"c":0},
  {"cat":{"ar":"التذويب","en":"Thawing","hi":"पिघलाना","bn":"গলানো","id":"Pencairan"},"q":{"ar":"أين يجب أن يُذاب الغذاء المجمد بطريقة آمنة؟","en":"Where should frozen food be thawed safely?","hi":"जमे हुए खाने को सुरक्षित रूप से कहां पिघलाना चाहिए?","bn":"হিমায়িত খাবার নিরাপদভাবে কোথায় গলানো উচিত?","id":"Di mana makanan beku harus dicairkan dengan aman?"},"o":{"ar":["على طاولة الطعام في حرارة الغرفة لعدة ساعات","في الثلاجة، على حرارة من ٠ إلى ٤°م، حتى يذوب تماماً","في ماء ساخن جداً يُحافظ على غليان سريع","في ضوء الشمس المباشر خلال ساعات بعد الظهر في الخارج"],"en":["On the dining table at room temperature for several hours","In the fridge, kept at 0 to 4°C, until fully thawed","In very hot water that is kept at a fast rolling boil","In direct sunlight during the afternoon hours outdoors"],"hi":["डाइनिंग टेबल पर कमरे के तापमान पर कई घंटों तक","फ़्रिज में, 0 से 4°C पर रखकर, पूरी तरह पिघलने तक","बहुत गर्म पानी में जो तेज़ उबाल पर रखा गया हो","दोपहर में बाहर सीधी धूप में"],"bn":["ডাইনিং টেবিলে ঘরের তাপমাত্রায় কয়েক ঘণ্টা","ফ্রিজে, ০ থেকে ৪°C তাপমাত্রায়, সম্পূর্ণ গলে যাওয়া পর্যন্ত","খুব গরম পানিতে যা দ্রুত টগবগে ফোটানো হচ্ছে","বাইরে দুপুরের সময় সরাসরি রোদে"],"id":["Di atas meja makan pada suhu ruang selama beberapa jam","Di dalam kulkas, pada suhu 0 sampai 4°C, hingga benar-benar mencair","Di dalam air sangat panas yang dijaga mendidih cepat","Di bawah sinar matahari langsung pada siang hari di luar"]},"c":1},
  {"cat":{"ar":"التخزين الجاف","en":"Dry storage","hi":"सूखा भंडारण","bn":"শুকনো সংরক্ষণ","id":"Penyimpanan kering"},"q":{"ar":"ما أقل ارتفاع للأرفف عن الأرض في منطقة التخزين الجاف؟","en":"What is the minimum height of shelves above the floor in dry storage?","hi":"सूखे भंडारण में शेल्फ़ का फ़र्श से न्यूनतम ऊंचाई कितनी होनी चाहिए?","bn":"শুকনো মজুত এলাকায় মেঝে থেকে তাকের ন্যূনতম উচ্চতা কত?","id":"Berapa tinggi minimum rak dari lantai di area penyimpanan kering?"},"o":{"ar":["حوالي ٥ سم فوق الأرض، بالقدر الذي يسمح للعمال بالتنظيف","لا فرق في الارتفاع مطلوب للبضائع المخزنة إطلاقاً","على ارتفاع ١٥ سم على الأقل فوق الأرض لتدفق الهواء","حوالي ٥٠ سم فوق الأرض، ويسهل على الموظفين الوصول إليها"],"en":["About 5 cm above the floor, just enough for the cleaners","No difference in height is needed for the stored goods","At least 15 cm above the floor for air flow","About 50 cm above the floor, reachable for the staff"],"hi":["फ़र्श से लगभग 5 सेमी ऊपर, बस सफ़ाई करने वालों के लिए काफ़ी","भंडारित सामान के लिए ऊँचाई में कोई फ़र्क ज़रूरी नहीं","फ़र्श से कम से कम 15 सेमी ऊपर, हवा के आने-जाने के लिए","फ़र्श से लगभग 50 सेमी ऊपर, ताकि स्टाफ़ आसानी से पहुँच सके"],"bn":["মেঝে থেকে প্রায় ৫ সেমি উপরে, শুধু পরিষ্কারকদের জন্য যথেষ্ট","মজুত পণ্যের জন্য উচ্চতার কোনো পার্থক্য দরকার নেই","মেঝে থেকে কমপক্ষে ১৫ সেমি উপরে, বাতাস চলাচলের জন্য","মেঝে থেকে প্রায় ৫০ সেমি উপরে, কর্মীরা সহজে পৌঁছাতে পারেন"],"id":["Sekitar 5 cm di atas lantai, cukup untuk petugas kebersihan","Tidak perlu perbedaan tinggi untuk barang yang disimpan","Setidaknya 15 cm di atas lantai untuk sirkulasi udara","Sekitar 50 cm di atas lantai agar mudah dijangkau staf"]},"c":2},
  {"cat":{"ar":"الاستلام","en":"Receiving goods","hi":"सामान प्राप्त करना","bn":"মাল গ্রহণ","id":"Penerimaan barang"},"q":{"ar":"عند استلام شحنة لحوم مجمدة، ما أعلى درجة حرارة مقبولة لها؟","en":"When receiving frozen meat, what is the highest acceptable temperature?","hi":"जमे हुए मांस की डिलीवरी लेते समय अधिकतम स्वीकार्य तापमान क्या है?","bn":"হিমায়িত মাংসের চালান গ্রহণের সময় সর্বোচ্চ গ্রহণযোগ্য তাপমাত্রা কত?","id":"Saat menerima daging beku, berapa suhu tertinggi yang diterima?"},"o":{"ar":["حوالي -٥°م طالما يبدو اللحم متجمداً تماماً","٠°م وهي الحرارة الطبيعية لمنطقة التخزين المبرد","٥°م وهي الحرارة المعتادة للثلاجة","-١٨°م أو أقل، للحفاظ على اللحم مجمداً بأمان"],"en":["-5°C or so, as long as the meat looks frozen solid","0°C, which is normal for the chilled storage area","5°C, which is the usual temperature of a fridge","-18°C or below, to keep the meat safely frozen"],"hi":["लगभग -5°C, जब तक मांस पूरी तरह जमा दिखे","0°C, जो ठंडे भंडारण क्षेत्र के लिए सामान्य है","5°C, जो फ़्रिज का सामान्य तापमान है","-18°C या उससे कम, ताकि मांस सुरक्षित रूप से जमा रहे"],"bn":["প্রায় -৫°C, যতক্ষণ মাংস শক্ত হয়ে জমে আছে বলে মনে হয়","০°C, যা শীতল মজুত এলাকার স্বাভাবিক তাপমাত্রা","৫°C, যা ফ্রিজের সাধারণ তাপমাত্রা","-১৮°C বা তার নিচে, মাংস নিরাপদে জমে রাখতে"],"id":["Sekitar -5°C, selama daging terlihat beku keras","0°C, yang normal untuk area penyimpanan dingin","5°C, yang merupakan suhu umum kulkas","-18°C atau lebih rendah, agar daging tetap beku dengan aman"]},"c":3},
  {"cat":{"ar":"الفصل","en":"Separation","hi":"अलग रखना","bn":"আলাদা রাখা","id":"Pemisahan"},"q":{"ar":"ما الهدف الرئيسي من الفصل بين المناطق النظيفة وغير النظيفة في المنشأة؟","en":"What is the main purpose of separating clean and unclean areas in the establishment?","hi":"प्रतिष्ठान में साफ और गंदे क्षेत्रों को अलग रखने का मुख्य उद्देश्य क्या है?","bn":"প্রতিষ্ঠানে পরিষ্কার ও অপরিষ্কার এলাকা আলাদা রাখার প্রধান উদ্দেশ্য কী?","id":"Apa tujuan utama memisahkan area bersih dan kotor di fasilitas?"},"o":{"ar":["لمنع انتقال التلوث بين المناطق","لتوفير مساحة عمل أكبر للموظفين في المطبخ","فقط لتسهيل جدول التنظيف على المشرفين","لتقليل عدد الموظفين المطلوبين لكل وردية"],"en":["To prevent contamination moving between areas","To provide more working space for the staff in the kitchen","Only to make the cleaning schedule easier for the supervisors","To reduce the number of staff needed for each shift"],"hi":["क्षेत्रों के बीच संदूषण फैलने से रोकने के लिए","रसोई में कर्मचारियों के लिए अधिक काम की जगह देने के लिए","केवल पर्यवेक्षकों के लिए सफ़ाई का कार्यक्रम आसान बनाने के लिए","हर शिफ़्ट में ज़रूरी कर्मचारियों की संख्या कम करने के लिए"],"bn":["এলাকাগুলোর মধ্যে দূষণ ছড়ানো রোধ করতে","রান্নাঘরে কর্মীদের জন্য বেশি কাজের জায়গা দিতে","শুধু সুপারভাইজারদের জন্য পরিষ্কারের সূচি সহজ করতে","প্রতি শিফটে প্রয়োজনীয় কর্মীর সংখ্যা কমাতে"],"id":["Untuk mencegah kontaminasi berpindah antar area","Untuk memberi lebih banyak ruang kerja bagi staf di dapur","Hanya untuk mempermudah jadwal pembersihan bagi supervisor","Untuk mengurangi jumlah staf yang dibutuhkan setiap shift"]},"c":0},

  {"cat":{"ar":"النظافة الشخصية","en":"Personal hygiene","hi":"व्यक्तिगत स्वच्छता","bn":"ব্যক্তিগত পরিচ্ছন্নতা","id":"Kebersihan pribadi"},"q":{"ar":"ما الهدف الرئيسي من النظافة الشخصية للعاملين في منشآت الغذاء؟","en":"What is the main goal of personal hygiene for food-establishment workers?","hi":"खाद्य प्रतिष्ठानों में कर्मचारियों की व्यक्तिगत स्वच्छता का मुख्य लक्ष्य क्या है?","bn":"খাদ্য প্রতিষ্ঠানের কর্মীদের ব্যক্তিগত পরিচ্ছন্নতার মূল লক্ষ্য কী?","id":"Apa tujuan utama kebersihan pribadi bagi pekerja di fasilitas makanan?"},"o":{"ar":["فقط لزيادة الإنتاج وتسريع الإخراج اليومي للوجبات","لتحسين شكل الزي الذي يرتديه الموظفون","منع انتشار الأمراض وحماية الطعام من التلوث","لتسريع الخدمة خلال ساعات الذروة في اليوم"],"en":["Only to increase production and speed up daily output of meals","To improve the look of the uniform worn by the staff","Prevent disease spread and protect food from contamination","To speed up service during the busiest hours of the day"],"hi":["केवल उत्पादन बढ़ाने और रोज़ का भोजन तेज़ी से बनाने के लिए","कर्मचारियों की वर्दी का रूप बेहतर बनाने के लिए","बीमारियों के फैलाव को रोकना और खाने को संदूषण से बचाना","दिन के सबसे व्यस्त समय में सेवा तेज़ करने के लिए"],"bn":["শুধু উৎপাদন বাড়াতে এবং প্রতিদিনের খাবার তৈরি দ্রুত করতে","কর্মীদের পোশাকের চেহারা উন্নত করতে","রোগ ছড়ানো রোধ করা এবং খাবারকে দূষণ থেকে রক্ষা করা","দিনের সবচেয়ে ব্যস্ত সময়ে পরিবেশন দ্রুত করতে"],"id":["Hanya untuk meningkatkan produksi dan mempercepat keluaran makanan harian","Untuk memperbaiki penampilan seragam yang dikenakan staf","Mencegah penyebaran penyakit dan melindungi makanan dari kontaminasi","Untuk mempercepat pelayanan pada jam tersibuk di hari itu"]},"c":2},
  {"cat":{"ar":"نظافة الأدوات","en":"Equipment cleaning","hi":"उपकरण सफाई","bn":"সরঞ্জাম পরিষ্কার","id":"Pembersihan peralatan"},"q":{"ar":"متى يجب تنظيف وتطهير أدوات التقطيع والمعدات؟","en":"When should cutting tools and equipment be cleaned and sanitized?","hi":"कटिंग औज़ारों और उपकरणों को कब साफ और सैनिटाइज़ करना चाहिए?","bn":"কাটার যন্ত্র ও সরঞ্জাম কখন পরিষ্কার ও জীবাণুমুক্ত করা উচিত?","id":"Kapan alat potong dan peralatan harus dibersihkan dan disanitasi?"},"o":{"ar":["مرة واحدة في الأسبوع فقط، عادةً في يوم زيارة المفتش","فقط عندما تبدو متسخة بشكل واضح للعامل","في نهاية الشهر، خلال التنظيف الشهري العام","بعد كل استخدام وقبل تحضير الطعام التالي"],"en":["Once a week only, usually on the day the inspector visits","Only when they look visibly dirty to the eye of the worker","At the end of the month, during the general monthly cleaning","After every use and before preparing the next food"],"hi":["केवल सप्ताह में एक बार, आमतौर पर निरीक्षक के आने के दिन","केवल तब जब कर्मचारी को वे साफ़ तौर पर गंदे दिखें","महीने के अंत में, मासिक सामान्य सफ़ाई के दौरान","हर उपयोग के बाद और अगला खाना तैयार करने से पहले"],"bn":["শুধু সপ্তাহে একবার, সাধারণত পরিদর্শকের আসার দিনে","শুধু যখন কর্মীর চোখে স্পষ্ট নোংরা দেখায়","মাসের শেষে, মাসিক সাধারণ পরিষ্কারের সময়","প্রতিবার ব্যবহারের পর এবং পরের খাবার তৈরির আগে"],"id":["Hanya seminggu sekali, biasanya pada hari kunjungan pemeriksa","Hanya ketika terlihat jelas kotor di mata pekerja","Di akhir bulan, saat pembersihan umum bulanan","Setelah setiap penggunaan dan sebelum makanan berikutnya disiapkan"]},"c":3},
  {"cat":{"ar":"الحرائق","en":"Fire safety","hi":"आग से सुरक्षा","bn":"অগ্নি নিরাপত্তা","id":"Keselamatan kebakaran"},"q":{"ar":"ماذا يجب أن تفعل عند اشتعال حريق زيت في المطبخ؟","en":"What should you do if cooking oil catches fire in the kitchen?","hi":"रसोई में खाना पकाने के तेल में आग लग जाए तो क्या करना चाहिए?","bn":"রান্নাঘরে রান্নার তেলে আগুন লাগলে কী করা উচিত?","id":"Apa yang harus dilakukan jika minyak masak terbakar di dapur?"},"o":{"ar":["تغطية الوعاء بإحكام لخنق النار، ولا تستخدم الماء أبداً","صب الماء عليه مباشرة لتبريد النيران بسرعة","تركه يحترق من تلقاء نفسه مع تهوية الغرفة","تحريكه بقوة بملعقة طويلة لنشر اللهب"],"en":["Cover the pan tightly and smother it, never use water","Pour water on it directly to cool the flames quickly down","Let it burn out on its own while the room is ventilated","Stir it vigorously with a long spoon to spread the flames"],"hi":["कड़ाही को कसकर ढककर आग को बुझाएँ, कभी पानी का इस्तेमाल न करें","लपटों को जल्दी ठंडा करने के लिए सीधे उस पर पानी डालें","कमरे में हवा रहते उसे अपने आप जल जाने दें","लपटें फैलाने के लिए लंबे चम्मच से उसे ज़ोर से हिलाएँ"],"bn":["কড়াই শক্ত করে ঢেকে আগুন নিভান, কখনো পানি ব্যবহার করবেন না","আগুন দ্রুত ঠান্ডা করতে সরাসরি তার উপর পানি ঢালুন","ঘর বাতাস চলাচলের সময় নিজে নিজে জ্বলে শেষ হতে দিন","শিখা ছড়াতে লম্বা চামচ দিয়ে জোরে নাড়ুন"],"id":["Tutup wajan rapat-rapat untuk memadamkan api, jangan pernah gunakan air","Langsung siram air agar api cepat reda","Biarkan terbakar sendiri sambil ruangan diventilasi","Aduk kuat-kuat dengan sendok panjang agar api menyebar"]},"c":0},

  {"cat":{"ar":"السلامة المهنية","en":"Occupational safety","hi":"व्यावसायिक सुरक्षा","bn":"পেশাগত নিরাপত্তা","id":"Keselamatan kerja"},"q":{"ar":"ماذا يجب أن يحدث عند تعرض الشخص لحرق بالماء المغلي؟","en":"What should be done when someone is scalded by boiling water?","hi":"उबलते पानी से जलने पर क्या करना चाहिए?","bn":"ফুটন্ত পানিতে পুড়লে কী করা উচিত?","id":"Apa yang harus dilakukan jika seseorang tersiram air mendidih?"},"o":{"ar":["وضع الزبدة أو الزيت على الحرق لتهدئة المنطقة المؤلمة","تركه مكشوفاً للهواء الساخن حتى تتنفس البشرة بحرية","تبريد الحرق بالماء البارد لمدة ١٠ إلى ٢٠ دقيقة","فرك الجلد بقوة لإيقاف الألم واحمرار الجلد بسرعة"],"en":["Apply butter or oil to the burn to soothe the painful area","Leave it exposed to hot air so the skin can breathe freely","Cool the burn with cold water for 10 to 20 minutes","Rub the skin firmly to stop the pain and the redness fast"],"hi":["जलने वाली जगह पर मक्खन या तेल लगाना ताकि दर्द कम हो","उसे गर्म हवा में खुला छोड़ना ताकि त्वचा आराम से साँस ले सके","जलने की जगह को 10 से 20 मिनट तक ठंडे पानी से ठंडा करें","दर्द और लालिमा तुरंत रोकने के लिए त्वचा को ज़ोर से रगड़ना"],"bn":["পোড়া জায়গায় মাখন বা তেল লাগানো, যাতে ব্যথা কমে","গরম বাতাসে খোলা রেখে দেওয়া যাতে ত্বক স্বাধীনভাবে শ্বাস নিতে পারে","পোড়া জায়গা ১০ থেকে ২০ মিনিট ঠান্ডা পানিতে ঠান্ডা করুন","ব্যথা ও লালচে ভাব দ্রুত থামাতে ত্বক জোরে ঘষা"],"id":["Mengoleskan mentega atau minyak pada luka bakar agar terasa lebih nyaman","Membiarkannya terbuka di udara panas agar kulit bisa bernapas bebas","Mendinginkan luka bakar dengan air dingin selama 10 sampai 20 menit","Menggosok kulit dengan kuat untuk menghentikan nyeri dan kemerahan dengan cepat"]},"c":2},
  {"cat":{"ar":"الإسعافات الأولية","en":"First aid","hi":"प्राथमिक उपचार","bn":"প্রাথমিক চিকিৎসা","id":"Pertolongan pertama"},"q":{"ar":"ما الذي يجب فعله بالجرح قبل تقديم الإسعافات الأولية؟","en":"What should be done to a wound before giving first aid?","hi":"प्राथमिक उपचार देने से पहले घाव के साथ क्या करना चाहिए?","bn":"প্রাথমিক চিকিৎসার আগে ক্ষতের সঙ্গে কী করা উচিত?","id":"Apa yang harus dilakukan pada luka sebelum memberi pertolongan pertama?"},"o":{"ar":["الضغط عليه بأصابع متسخة لوقف النزيف بسرعة","النفخ عليه بلطف ثم تركه مكشوفاً في الهواء","تركه مكشوفاً ليجف بسرعة في الهواء الطلق خارجاً","غسل اليدين وتنظيف الجرح بالصابون والماء ثم تغطيته"],"en":["Press it with dirty fingers to stop the bleeding quickly","Blow on it gently and then leave it uncovered in the air","Leave it uncovered so it can dry out quickly in the open air outside","Wash hands, clean the wound with soap and water, and cover it"],"hi":["गंदी उंगलियों से दबाना ताकि खून जल्दी रुके","धीरे से उस पर फूँकना और फिर उसे खुला छोड़ देना","उसे खुला छोड़ना ताकि वह बाहर खुली हवा में जल्दी सूख जाए","हाथ धोकर घाव को साबुन और पानी से साफ़ करना और फिर ढकना"],"bn":["নোংরা আঙুল দিয়ে চাপ দেওয়া যাতে দ্রুত রক্ত বন্ধ হয়","আলতো করে তাতে ফুঁ দিয়ে তারপর খোলা রেখে দেওয়া","খোলা রেখে দেওয়া যাতে বাইরে খোলা হাওয়ায় দ্রুত শুকিয়ে যায়","হাত ভালো করে ধুয়ে সাবান ও পানি দিয়ে ক্ষত পরিষ্কার করে ঢেকে দেওয়া"],"id":["Menekannya dengan jari kotor agar pendarahan cepat berhenti","Meniupnya perlahan lalu membiarkannya terbuka di udara","Membiarkannya terbuka agar cepat kering di udara terbuka di luar","Cuci tangan, bersihkan luka dengan sabun dan air, lalu tutup lukanya"]},"c":3},
  {"cat":{"ar":"الحساسية الغذائية","en":"Food allergy","hi":"खाद्य एलर्जी","bn":"খাদ্য অ্যালার্জি","id":"Alergi makanan"},"q":{"ar":"عند سؤال عميل عن مكونات طبق يعاني من حساسية شديدة من المكسرات، ما أفضل تصرف؟","en":"A customer with a severe nut allergy asks about a dish's ingredients. What is the best response?","hi":"गंभीर मेवा एलर्जी वाला ग्राहक किसी व्यंजन की सामग्री पूछता है। सबसे अच्छा जवाब क्या है?","bn":"তীব্র বাদাম অ্যালার্জিযুক্ত গ্রাহক একটি খাবারের উপাদান জানতে চান। সবচেয়ে ভালো উত্তর কী?","id":"Pelanggan dengan alergi kacang berat bertanya tentang bahan suatu hidangan. Apa respons terbaik?"},"o":{"ar":["فحص المكونات والأدوات والإجابة بصدق عن مخاطر التلوث المتبادل","التأكد من أن الطبق آمن حتى يتمكن الزبون من طلبه","التخمين حسب الوصفة المعتادة لأن معظم الأطباق متشابهة","إخبار الزبون بأن يزيل المكسرات من الطبق بنفسه"],"en":["Check ingredients and equipment, and answer honestly about risks","Confirm the dish is safe so that the customer can order it","Guess based on the usual recipe, since most dishes in the kitchen are made the same way","Tell the customer to remove the nuts from the dish themselves"],"hi":["सामग्री और उपकरणों की जाँच करें और क्रॉस-संदूषण के जोखिम पर ईमानदारी से जवाब दें","यह सुनिश्चित करना कि व्यंजन सुरक्षित है ताकि ग्राहक उसे ऑर्डर कर सके","सामान्य रेसिपी के आधार पर अनुमान लगाना, क्योंकि ज़्यादातर व्यंजन एक जैसे होते हैं","ग्राहक से कहना कि वे खुद व्यंजन से मेवे निकाल दें"],"bn":["উপাদান ও যন্ত্রপাতি পরীক্ষা করে ক্রস-দূষণের ঝুঁকি সম্পর্কে সৎভাবে উত্তর দেওয়া","গ্রাহক যাতে অর্ডার দিতে পারেন সেজন্য নিশ্চিত করা যে খাবারটি নিরাপদ","সাধারণ রেসিপি দেখে আন্দাজ করা, কারণ বেশিরভাগ খাবার একই রকম","গ্রাহককে বলা যে তিনি নিজেই খাবার থেকে বাদামগুলো সরিয়ে নেবেন"],"id":["Memeriksa bahan dan peralatan, lalu menjawab jujur tentang risikonya","Memastikan hidangan aman agar pelanggan mau memesannya","Menebak berdasarkan resep biasa karena sebagian besar hidangan serupa","Menyuruh pelanggan membuang kacangnya dari hidangan sendiri"]},"c":0},
  {"cat":{"ar":"منطق","en":"Logic","hi":"तर्क","bn":"যুক্তি","id":"Logika"},"q":{"ar":"بعض المتدربين نجحوا في الاختبار. وكل من نجح حضر الدورة. أي عبارة صحيحة بالضرورة؟","en":"Some trainees passed the test. Everyone who passed attended the course. Which statement must be true?","hi":"कुछ प्रशिक्षु परीक्षा में पास हुए। जो भी पास हुआ वह कोर्स में आया था। कौन सा कथन अनिवार्य रूप से सही है?","bn":"কিছু প্রশিক্ষণার্থী পরীক্ষায় পাস করেছেন। যাঁরা পাস করেছেন তাঁরা সবাই কোর্সে এসেছিলেন। কোন বিবৃতিটি অবশ্যই সত্য?","id":"Beberapa peserta lulus ujian. Semua yang lulus mengikuti kursus. Pernyataan mana yang pasti benar?"},"o":{"ar":["كل المتدربين حضروا الدورة","بعض المتدربين حضروا الدورة","لم يرسب أي متدرب","كل من حضر الدورة نجح"],"en":["All trainees attended the course","Some trainees attended the course","No trainee failed","Everyone who attended the course passed"],"hi":["सभी प्रशिक्षु कोर्स में आए","कुछ प्रशिक्षु कोर्स में आए","कोई प्रशिक्षु फेल नहीं हुआ","कोर्स में आने वाला हर कोई पास हुआ"],"bn":["সব প্রশিক্ষণার্থী কোর্সে এসেছিলেন","কিছু প্রশিক্ষণার্থী কোর্সে এসেছিলেন","কোনো প্রশিক্ষণার্থী ফেল করেননি","কোর্সে আসা প্রত্যেকে পাস করেছে"],"id":["Semua peserta mengikuti kursus","Beberapa peserta mengikuti kursus","Tidak ada peserta yang gagal","Semua yang mengikuti kursus lulus"]},"c":1},
  {"cat":{"ar":"حساب","en":"Calculation","hi":"गणना","bn":"হিসাব","id":"Hitungan"},"q":{"ar":"يُعد مطبخ 12 صينية، كل صينية فيها 8 حصص. تم التخلص من 15 حصة بسبب سوء التخزين. كم حصة قُدِّمت؟","en":"A kitchen prepares 12 trays with 8 portions each. 15 portions are thrown away due to poor storage. How many portions were served?","hi":"एक रसोई में 12 ट्रे बनती हैं, हर ट्रे में 8 हिस्से। खराब भंडारण की वजह से 15 हिस्से फेंके गए। कितने हिस्से परोसे गए?","bn":"একটি রান্নাঘরে ১২টি ট্রে তৈরি হয়, প্রতিটিতে ৮ পরিবেশন। খারাপ সংরক্ষণের কারণে ১৫টি পরিবেশন ফেলা হয়েছে। কতটি পরিবেশন করা হয়েছে?","id":"Sebuah dapur menyiapkan 12 nampan, masing-masing berisi 8 porsi. 15 porsi dibuang karena penyimpanan buruk. Berapa porsi yang disajikan?"},"o":{"ar":["84 حصة","91 حصة","81 حصة","87 حصة"],"en":["84 portions","91 portions","81 portions","87 portions"],"hi":["84 हिस्से","91 हिस्से","81 हिस्से","87 हिस्से"],"bn":["৮৪ পরিবেশন","৯১ পরিবেশন","৮১ পরিবেশন","৮৭ পরিবেশন"],"id":["84 porsi","91 porsi","81 porsi","87 porsi"]},"c":2},
  {"cat":{"ar":"حساب","en":"Calculation","hi":"गणना","bn":"হিসাব","id":"Hitungan"},"q":{"ar":"تحتاج وصفة صلصة 250 غراماً من الطحين لتحضير 10 حصص. كم غراماً تحتاج لـ16 حصة بنفس النسب؟","en":"A sauce recipe needs 250 g of flour for 10 portions. How many grams are needed for 16 portions at the same ratio?","hi":"एक सॉस की रेसिपी में 10 हिस्सों के लिए 250 ग्राम आटा चाहिए। उसी अनुपात में 16 हिस्सों के लिए कितने ग्राम चाहिए?","bn":"একটি সসের রেসিপিতে ১০ পরিবেশনের জন্য ২৫০ গ্রাম ময়দা লাগে। একই অনুপাতে ১৬ পরিবেশনের জন্য কত গ্রাম লাগবে?","id":"Resep saus membutuhkan 250 g tepung untuk 10 porsi. Berapa gram untuk 16 porsi dengan perbandingan yang sama?"},"o":{"ar":["350 غراماً","425 غراماً","450 غراماً","400 غرام"],"en":["350 g","425 g","450 g","400 g"],"hi":["350 ग्राम","425 ग्राम","450 ग्राम","400 ग्राम"],"bn":["৩৫০ গ্রাম","৪২৫ গ্রাম","৪৫০ গ্রাম","৪০০ গ্রাম"],"id":["350 g","425 g","450 g","400 g"]},"c":3},
  {"cat":{"ar":"أولويات","en":"Prioritizing","hi":"प्राथमिकता","bn":"অগ্রাধিকার","id":"Prioritas"},"q":{"ar":"ثلاث مهام: ثلاجة معطلة فيها حليب، وجرد مخزون الغد، وتنظيف الأرضية. ما الترتيب الأصح؟","en":"Three tasks: a broken fridge holding milk, tomorrow's stock count, and mopping the floor. What is the best order?","hi":"तीन काम हैं: दूध वाला खराब फ्रिज, कल के स्टॉक की गिनती, और फर्श पोंछना। सबसे सही क्रम क्या है?","bn":"তিনটি কাজ: দুধসহ নষ্ট ফ্রিজ, আগামীকালের স্টক গণনা, এবং মেঝে মোছা। সবচেয়ে ভালো ক্রম কোনটি?","id":"Tiga tugas: kulkas rusak berisi susu, penghitungan stok besok, dan mengepel lantai. Urutan terbaik?"},"o":{"ar":["نقل الحليب إلى ثلاجة تعمل، وإصلاح المعطلة، ثم عدّ المخزون والتنظيف","عدّ المخزون ثم التنظيف ثم إصلاح الثلاجة ونقل الحليب لاحقاً","التنظيف أولاً ثم عدّ المخزون ثم التعامل مع الثلاجة والحليب في نهاية الوردية كلها","إصلاح الثلاجة ثم عدّ المخزون ثم التنظيف ثم نقل الحليب أخيراً"],"en":["Move the milk to a working fridge, fix the broken one, then count and mop","Count stock, mop, then fix the fridge and move the milk later on","Mop the floor first, then count the stock, and only then deal with the fridge and the milk","Fix the fridge, count stock, mop, then move the milk last of all"],"hi":["दूध को किसी चालू फ़्रिज में रखें, खराब को ठीक करें, फिर स्टॉक गिनें और पोंछा लगाएँ","स्टॉक गिनें, पोंछा लगाएँ, फिर फ़्रिज ठीक करें और दूध बाद में हटाएँ","पहले फ़र्श पोंछें, फिर स्टॉक गिनें, और फ़्रिज व दूध से आख़िर में शिफ़्ट के अंत में निपटें","फ़्रिज ठीक करें, स्टॉक गिनें, पोंछा लगाएँ, फिर सबसे आख़िर में दूध हटाएँ"],"bn":["দুধ একটি চালু ফ্রিজে সরান, খারাপটি ঠিক করুন, তারপর স্টক গুনুন ও মোছা দিন","স্টক গুনুন, মোছা দিন, তারপর ফ্রিজ ঠিক করুন এবং দুধ পরে সরান","আগে মেঝে মুছুন, তারপর স্টক গুনুন, এবং শিফটের শেষে ফ্রিজ ও দুধ নিয়ে ভাবুন","ফ্রিজ ঠিক করুন, স্টক গুনুন, মোছা দিন, তারপর সবশেষে দুধ সরান"],"id":["Pindahkan susu ke kulkas yang berfungsi, perbaiki yang rusak, lalu hitung stok dan pel","Hitung stok, pel, lalu perbaiki kulkas dan pindahkan susu nanti","Pel dulu, lalu hitung stok, dan tangani kulkas serta susu di akhir shift saja","Perbaiki kulkas, hitung stok, pel, lalu pindahkan susu paling akhir"]},"c":0},
  {"cat":{"ar":"منطق","en":"Logic","hi":"तर्क","bn":"যুক্তি","id":"Logika"},"q":{"ar":"كل الطهاة في هذا المطبخ يرتدون غطاء الرأس. أحمد لا يرتدي غطاء رأس. أي عبارة صحيحة؟","en":"Every chef in this kitchen wears a hairnet. Ahmed does not wear a hairnet. Which statement is correct?","hi":"इस रसोई में हर शेफ हेयरनेट पहनता है। अहमद हेयरनेट नहीं पहनता। कौन सा कथन सही है?","bn":"এই রান্নাঘরের প্রতিটি শেফ হেয়ারনেট পরেন। আহমেদ হেয়ারনেট পরেন না। কোন বিবৃতিটি সঠিক?","id":"Setiap koki di dapur ini memakai penutup kepala. Ahmed tidak memakai penutup kepala. Pernyataan mana yang benar?"},"o":{"ar":["أحمد طاهٍ بالتأكيد وقد نسي غطاء الرأس اليوم فقط","أحمد ليس طاهياً في هذا المطبخ، حسب القاعدة","أحمد ربما يكون طاهياً لأن غطاء الرأس ليس مطلوباً دائماً","أحمد يرتدي غطاء الرأس أحياناً، لذلك قد يكون طاهياً"],"en":["Ahmed is definitely a chef who simply forgot his hairnet today","Ahmed is not a chef in this kitchen, as the rule shows","Ahmed may be a chef, because hairnets are not always required","Ahmed sometimes wears a hairnet, so he might be a chef"],"hi":["अहमद पक्का शेफ़ है, बस आज उसने हेयरनेट पहनना भूल गया","इस नियम के अनुसार, अहमद इस रसोई में शेफ़ नहीं है","अहमद शायद शेफ़ हो, क्योंकि हेयरनेट हमेशा ज़रूरी नहीं होता","अहमद कभी-कभी हेयरनेट पहनता है, इसलिए वह शेफ़ हो सकता है"],"bn":["আহমদ নিশ্চিত একজন শেফ, আজ শুধু হেয়ারনেট পরতে ভুলে গেছে","এই নিয়ম অনুযায়ী, আহমদ এই রান্নাঘরের শেফ নয়","আহমদ হয়তো শেফ, কারণ হেয়ারনেট সবসময় বাধ্যতামূলক নয়","আহমদ মাঝে মাঝে হেয়ারনেট পরে, তাই সে শেফ হতে পারে"],"id":["Ahmed pasti seorang koki yang hari ini lupa memakai penutup kepala","Berdasarkan aturan ini, Ahmed bukan koki di dapur ini","Ahmed mungkin koki, karena penutup kepala tidak selalu wajib","Ahmed kadang memakai penutup kepala, jadi ia mungkin seorang koki"]},"c":1},
  {"cat":{"ar":"نمط","en":"Reasoning","hi":"तर्क","bn":"যুক্তি","id":"Penalaran"},"q":{"ar":"أي رقم لا ينتمي للمجموعة: 4، 9، 16، 25، 36، 42؟","en":"Which number does not belong in this group: 4, 9, 16, 25, 36, 42?","hi":"इस समूह में कौन सी संख्या सही नहीं बैठती: 4, 9, 16, 25, 36, 42?","bn":"এই গ্রুপে কোন সংখ্যাটি মেলে না: ৪, ৯, ১৬, ২৫, ৩৬, ৪২?","id":"Angka mana yang tidak termasuk dalam kelompok ini: 4, 9, 16, 25, 36, 42?"},"o":{"ar":["9","25","42","36"],"en":["9","25","42","36"],"hi":["9","25","42","36"],"bn":["৯","২৫","৪২","৩৬"],"id":["9","25","42","36"]},"c":2},
  {"cat":{"ar":"حساب","en":"Calculation","hi":"गणना","bn":"হিসাব","id":"Hitungan"},"q":{"ar":"عامل ينظف 4 محطات في 20 دقيقة بنفس السرعة. كم دقيقة يحتاج لتنظيف 7 محطات؟","en":"A worker cleans 4 stations in 20 minutes at a steady pace. How many minutes will 7 stations take?","hi":"एक कर्मचारी 20 मिनट में 4 स्टेशन साफ करता है, एक समान गति से। 7 स्टेशन में कितने मिनट लगेंगे?","bn":"একজন কর্মী সমান গতিতে ২০ মিনিটে ৪টি স্টেশন পরিষ্কার করেন। ৭টি স্টেশনে কত মিনিট লাগবে?","id":"Seorang pekerja membersihkan 4 stasiun dalam 20 menit dengan kecepatan tetap. Berapa menit untuk 7 stasiun?"},"o":{"ar":["30 دقيقة","40 دقيقة","45 دقيقة","35 دقيقة"],"en":["30 minutes","40 minutes","45 minutes","35 minutes"],"hi":["30 मिनट","40 मिनट","45 मिनट","35 मिनट"],"bn":["৩০ মিনিট","৪০ মিনিট","৪৫ মিনিট","৩৫ মিনিট"],"id":["30 menit","40 menit","45 menit","35 menit"]},"c":3},
  {"cat":{"ar":"أولويات","en":"Prioritizing","hi":"प्राथमिकता","bn":"অগ্রাধিকার","id":"Prioritas"},"q":{"ar":"وصل المفتش أثناء تفريغ شحنة لحم نيء عند الباب الخلفي، وشكا زبون عند الكاونتر. ما الأولوية؟","en":"An inspector arrives while raw meat is being unloaded at the back door, and a customer complains at the counter. What is the priority?","hi":"पिछले दरवाज़े पर कच्चे मांस की उतराई चल रही है, तभी इंस्पेक्टर आता है और काउंटर पर एक ग्राहक शिकायत करता है। प्राथमिकता क्या है?","bn":"পিছনের দরজায় কাঁচা মাংস নামানো হচ্ছে, এমন সময় একজন পরিদর্শক আসেন এবং কাউন্টারে একজন গ্রাহক অভিযোগ করেন। অগ্রাধিকার কী?","id":"Seorang inspektur datang saat daging mentah sedang dibongkar di pintu belakang, dan pelanggan mengeluh di kasir. Apa prioritasnya?"},"o":{"ar":["إدخال اللحم النيء إلى التخزين البارد أولاً حفاظاً على سلامة الطعام","تحية المفتش أولاً ثم التعامل مع باقي المهام","معالجة شكوى الزبون أولاً لأنها أكثر إلحاحاً","إنهاء الأوراق أولاً حتى يراها المفتش فوراً"],"en":["Get the raw meat into cold storage first, to protect food safety","Greet the inspector first and then deal with the other tasks","Address the customer complaint first, because an unhappy customer is more urgent right now","Finish the paperwork first so the inspector can see it at once"],"hi":["कच्चे मांस को पहले ठंडे भंडारण में रखें, ताकि खाने की सुरक्षा बनी रहे","पहले निरीक्षक का स्वागत करें और फिर बाकी काम देखें","पहले ग्राहक की शिकायत सुलझाएँ क्योंकि वह ज़्यादा ज़रूरी है","पहले कागज़ात पूरे करें ताकि निरीक्षक उन्हें तुरंत देख सके"],"bn":["কাঁচা মাংস আগে ঠান্ডা মজুত জায়গায় রাখুন, খাবারের নিরাপত্তা বজায় রাখতে","আগে পরিদর্শককে স্বাগত জানিয়ে তারপর বাকি কাজ দেখুন","আগে গ্রাহকের অভিযোগ মেটান, কারণ সেটি বেশি জরুরি","আগে কাগজপত্র শেষ করুন যাতে পরিদর্শক তা তৎক্ষণাৎ দেখতে পারেন"],"id":["Masukkan daging mentah ke penyimpanan dingin dulu, demi menjaga keamanan makanan","Sambut pemeriksa terlebih dahulu lalu tangani tugas lainnya","Tangani keluhan pelanggan dulu karena lebih mendesak","Selesaikan administrasi dulu agar pemeriksa bisa langsung melihatnya"]},"c":0},
  {"cat":{"ar":"صح أو غلط","en":"True or False","hi":"सही या गलत","bn":"সত্য না মিথ্যা","id":"Benar atau Salah"},"q":{"en":"Bacteria grow fastest between 5°C and 63°C.","ar":"تتكاثر البكتيريا بأسرع ما يمكن بين ٥°م و٦٣°م.","hi":"जीवाणु 5°C से 63°C के बीच सबसे तेज़ बढ़ते हैं।","bn":"জীবাণু ৫°C থেকে ৬৩°C তাপমাত্রার মধ্যে সবচেয়ে দ্রুত বাড়ে।","id":"Bakteri tumbuh paling cepat antara 5°C dan 63°C."},"o":{"ar":["صح","غلط"],"en":["True","False"],"hi":["सही","गलत"],"bn":["সত্য","মিথ্যা"],"id":["Benar","Salah"]},"c":0,"tf":true},
  {"cat":{"ar":"صح أو غلط","en":"True or False","hi":"सही या गलत","bn":"সত্য না মিথ্যা","id":"Benar atau Salah"},"q":{"en":"Frozen food can be thawed on the kitchen counter at room temperature.","ar":"يمكن إذابة الطعام المجمد على طاولة المطبخ في حرارة الغرفة.","hi":"जमे हुए खाने को रसोई के काउंटर पर कमरे के तापमान पर पिघलाया जा सकता है।","bn":"জমা খাবার রান্নাঘরের কাউন্টারে ঘরের তাপমাত্রায় গলানো যায়।","id":"Makanan beku boleh dicairkan di meja dapur pada suhu ruang."},"o":{"ar":["صح","غلط"],"en":["True","False"],"hi":["सही","गलत"],"bn":["সত্য","মিথ্যা"],"id":["Benar","Salah"]},"c":1,"tf":true},
  {"cat":{"ar":"صح أو غلط","en":"True or False","hi":"सही या गलत","bn":"সত্য না মিথ্যা","id":"Benar atau Salah"},"q":{"en":"Handwashing with soap should last at least 20 seconds.","ar":"يجب أن يستغرق غسل اليدين بالصابون ٢٠ ثانية على الأقل.","hi":"साबुन से हाथ धोने में कम से कम 20 सेकंड लगने चाहिए।","bn":"সাবান দিয়ে হাত ধোয়ায় কমপক্ষে ২০ সেকেন্ড লাগা উচিত।","id":"Mencuci tangan dengan sabun harus berlangsung minimal 20 detik."},"o":{"ar":["صح","غلط"],"en":["True","False"],"hi":["सही","गलत"],"bn":["সত্য","মিথ্যা"],"id":["Benar","Salah"]},"c":0,"tf":true},
  {"cat":{"ar":"صح أو غلط","en":"True or False","hi":"सही या गलत","bn":"সত্য না মিথ্যা","id":"Benar atau Salah"},"q":{"en":"A worker with diarrhoea may keep working if he wears gloves.","ar":"يجوز للعامل المصاب بالإسهال أن يستمر في العمل إذا لبس القفازات.","hi":"दस्त वाला कर्मचारी दस्ताने पहनकर काम जारी रख सकता है।","bn":"ডায়রিয়া আক্রান্ত কর্মী গ্লাভস পরলে কাজ চালিয়ে যেতে পারেন।","id":"Pekerja yang diare boleh tetap bekerja asalkan memakai sarung tangan."},"o":{"ar":["صح","غلط"],"en":["True","False"],"hi":["सही","गलत"],"bn":["সত্য","মিথ্যা"],"id":["Benar","Salah"]},"c":1,"tf":true},
  {"cat":{"ar":"صح أو غلط","en":"True or False","hi":"सही या गलत","bn":"সত্য না মিথ্যা","id":"Benar atau Salah"},"q":{"en":"Cooked rice should be cooled quickly and not left at room temperature for long.","ar":"يجب تبريد الأرز المطبوخ بسرعة وعدم تركه في حرارة الغرفة لفترة طويلة.","hi":"पका चावल जल्दी ठंडा करना चाहिए और कमरे के तापमान पर लंबे समय तक नहीं छोड़ना चाहिए।","bn":"রান্না করা ভাত দ্রুত ঠান্ডা করতে হবে এবং ঘরের তাপমাত্রায় দীর্ঘক্ষণ রাখা যাবে না।","id":"Nasi matang harus didinginkan dengan cepat dan tidak dibiarkan lama di suhu ruang."},"o":{"ar":["صح","غلط"],"en":["True","False"],"hi":["सही","गलत"],"bn":["সত্য","মিথ্যা"],"id":["Benar","Salah"]},"c":0,"tf":true},
  {"cat":{"ar":"صح أو غلط","en":"True or False","hi":"सही या गलत","bn":"সত্য না মিথ্যা","id":"Benar atau Salah"},"q":{"en":"Chemicals may be stored on the top shelf above food.","ar":"يجوز تخزين المواد الكيميائية على الرف العلوي فوق الطعام.","hi":"रसायनों को भोजन के ऊपर वाली शेल्फ़ पर रखा जा सकता है।","bn":"খাবারের উপরের তাকে রাসায়নিক রাখা যায়।","id":"Bahan kimia boleh disimpan di rak paling atas di atas makanan."},"o":{"ar":["صح","غلط"],"en":["True","False"],"hi":["सही","गलत"],"bn":["সত্য","মিথ্যা"],"id":["Benar","Salah"]},"c":1,"tf":true},

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ───── QUIZ FLOW ─────
function startQuiz() {
  empName = document.getElementById('emp-name').value.trim();
  const err = document.getElementById('name-error');
  if (!empName) {
    err.textContent = T[lang].enterName;
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';
  const codeErr = document.getElementById('code-error');
  if (document.getElementById('test-code').value.trim() !== TEST_CODE) {
    codeErr.textContent = CODE_T[lang].err;
    codeErr.style.display = 'block';
    return;
  }
  codeErr.style.display = 'none';
  // 60 questions: 30 food-safety + 5 reasoning multiple-choice, 20 true/false, 5 ordering.
  // Options are shuffled per employee so the answer position changes.
  const REASONING_CATS = ['Logic', 'Calculation', 'Prioritizing', 'Reasoning'];
  const isTF = i => !!BANK[i].tf;
  const isOrd = i => !!BANK[i].ordering;
  const isReasoning = i => REASONING_CATS.includes(BANK[i].cat.en);
  const allIdx = BANK.map((_, i) => i);
  const mcIdx = allIdx.filter(i => !isTF(i) && !isOrd(i));
  const TF_COUNT = 20, ORD_COUNT = 5, REASON_COUNT = 5;
  const reasoningPick = shuffle(mcIdx.filter(isReasoning)).slice(0, REASON_COUNT);
  const healthPick = shuffle(mcIdx.filter(i => !isReasoning(i))).slice(0, QUIZ_LENGTH - TF_COUNT - ORD_COUNT - REASON_COUNT);
  const tfPick = shuffle(allIdx.filter(isTF)).slice(0, TF_COUNT);
  const ordPick = shuffle(allIdx.filter(isOrd)).slice(0, ORD_COUNT);
  const picked60 = shuffle(reasoningPick.concat(healthPick, tfPick, ordPick));
  quiz = picked60.map(qi => {
    if (isOrd(qi)) {
      // Steps are shown in a shuffled order; the employee gives each one a rank 1-4.
      return { qi, order: shuffle([0, 1, 2, 3]), ordering: true, correctPos: null };
    }
    const order = shuffle(BANK[qi].o.ar.map((_, k) => k));
    return { qi, order, correctPos: order.indexOf(BANK[qi].c) };
  });
  currentQ = 0;
  score = 0;
  picked = null;
  answers = quiz.map(it => it.ordering ? [null, null, null, null] : null);
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion() {
  picked = answers[currentQ] ?? null;
  const item = quiz[currentQ];
  const bq = BANK[item.qi];
  const total = quiz.length;
  document.getElementById('emp-display').textContent = T[lang].empOf + ' ' + empName;
  document.getElementById('progress-fill').style.width = Math.round((currentQ / total) * 100) + '%';
  document.getElementById('q-counter').textContent = (currentQ + 1) + ' / ' + total;
  document.getElementById('q-cat').textContent = bq.cat[lang];
  document.getElementById('q-text').textContent = bq.q[lang];

  const labels = lang === 'ar' ? ['أ','ب','ج','د'] : ['A','B','C','D'];
  const opts = bq.o[lang];
  const wrap = document.getElementById('options');
  wrap.innerHTML = '';
  if (item.ordering) {
    // item.order[k] is the step shown in row k; answers[currentQ][k] is the rank (1-4) the employee gave it.
    item.order.forEach((stepIdx, k) => {
      const row = document.createElement('div');
      row.className = 'ord-row';
      const txt = document.createElement('div');
      txt.className = 'ord-text';
      txt.textContent = opts[stepIdx];
      row.appendChild(txt);
      const ranks = document.createElement('div');
      ranks.className = 'ord-ranks';
      [1, 2, 3, 4].forEach(n => {
        const b = document.createElement('button');
        b.className = 'num-btn' + (answers[currentQ][k] === n ? ' picked' : '');
        b.textContent = n;
        b.addEventListener('click', () => setRank(k, n));
        ranks.appendChild(b);
      });
      row.appendChild(ranks);
      wrap.appendChild(row);
    });
  } else item.order.forEach((origIdx, pos) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn' + (picked === pos ? ' picked' : '');
    btn.innerHTML = '<span class="opt-label">' + labels[pos] + '</span>';
    const txt = document.createElement('span');
    txt.textContent = opts[origIdx];
    btn.appendChild(txt);
    btn.addEventListener('click', () => selectOption(pos));
    wrap.appendChild(btn);
  });

  const next = document.getElementById('btn-next');
  next.textContent = currentQ === total - 1 ? T[lang].finish : T[lang].next;
  next.style.display = isAnswered(currentQ) ? '' : 'none';
  next.onclick = nextQuestion;
  const prev = document.getElementById('btn-prev');
  prev.textContent = T[lang].prev;
  prev.style.display = currentQ > 0 ? '' : 'none';
  prev.onclick = prevQuestion;
}

// No feedback shown during the test, so the next employee cannot learn the answers.
// The employee can change the answer on the same question, or go back to earlier questions.
function selectOption(pos) {
  answers[currentQ] = pos;
  renderQuestion();
}

function isAnswered(i) {
  const a = answers[i];
  if (quiz[i].ordering) return Array.isArray(a) && a.every(v => v !== null);
  return a !== null && a !== undefined;
}

// Give step k the rank n. If another step already has rank n, that step takes k's old rank (swap).
function setRank(k, n) {
  const arr = answers[currentQ].slice();
  const other = arr.indexOf(n);
  if (other !== -1 && other !== k) arr[other] = arr[k];
  arr[k] = n;
  answers[currentQ] = arr;
  renderQuestion();
}

// Points: ordering questions are worth 1-4 by difficulty (BANK pts); every other question is worth 1.
function itemPoints(item) { return item.ordering ? BANK[item.qi].pts : 1; }

function isCorrect(item, a) {
  if (item.ordering) return a.every((n, k) => n - 1 === item.order[k]);
  return a === item.correctPos;
}

function nextQuestion() {
  if (!isAnswered(currentQ)) return;
  currentQ++;
  if (currentQ >= quiz.length) { showResult(); return; }
  renderQuestion();
}

function prevQuestion() {
  if (currentQ === 0) return;
  currentQ--;
  renderQuestion();
}

// ───── RESULT ─────
function showResult() {
  const t = T[lang];
  const log = quiz.map((item, i) => ({ qi: item.qi, order: item.order, chosen: answers[i], correctPos: item.correctPos, ordering: !!item.ordering, ok: isCorrect(item, answers[i]), pts: itemPoints(item) }));
  const totalPts = log.reduce((sum, a) => sum + a.pts, 0);
  score = log.filter(a => a.ok).reduce((sum, a) => sum + a.pts, 0);
  const total = totalPts;
  const pct = Math.round((score / total) * 100);
  const pass = score >= Math.ceil(totalPts * PASS_PCT);

  showScreen('result');
  const circle = document.getElementById('score-circle');
  circle.className = 'score-circle ' + (pass ? 'pass' : 'fail');
  document.getElementById('score-pct').textContent = pct + '%';
  document.getElementById('score-frac').textContent = score + '/' + totalPts;
  document.getElementById('res-name').textContent = empName;
  const verdict = document.getElementById('res-verdict');
  verdict.textContent = pass ? t.pass : t.fail;
  verdict.className = 'verdict ' + (pass ? 'verdict-pass' : 'verdict-fail');
  document.getElementById('btn-new-emp').onclick = newEmployee;
  document.getElementById('btn-back-start').onclick = showStart;

  const now = new Date();
  const date = now.toLocaleDateString('ar-SA') + ' ' + now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
  records.push({ name: empName, score, total, pct, pass, date, sent: true });
  saveRecords();
  // List of wrong answers (Arabic text): question, what the employee chose, and the correct answer.
  const wrongLines = log
    .filter(a => !a.ok)
    .map((a, i) => {
      const bq = BANK[a.qi];
      if (a.ordering) {
        // Chosen sequence: steps sorted by the rank given; correct sequence: canonical order.
        const chosenSeq = [1, 2, 3, 4].map(r => {
          const k = a.chosen.indexOf(r);
          return k === -1 ? '—' : bq.o.ar[a.order[k]];
        }).join(' ← ');
        return (i + 1) + ') ' + bq.q.ar + ' | إجابته: ' + chosenSeq + ' | الصح: ' + bq.o.ar.join(' ← ');
      }
      return (i + 1) + ') ' + bq.q.ar +
        ' | إجابته: ' + bq.o.ar[a.order[a.chosen]] +
        ' | الصح: ' + bq.o.ar[a.order[a.correctPos]];
    });
  sendToSheet({ name: empName, score, total, pct, pass, wrong: wrongLines.join('\n') || 'لا يوجد' });
}

function renderRecords() {
  const t = T[lang];
  const tbody = document.getElementById('records-body');
  tbody.innerHTML = '';
  if (records.length === 0) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 6;
    td.className = 'empty-state';
    td.textContent = t.noRecords;
    tr.appendChild(td);
    tbody.appendChild(tr);
    return;
  }
  records.slice().reverse().forEach((r, i) => {
    const tr = document.createElement('tr');
    const cells = [
      String(records.length - i),
      r.name,
      r.score + ' / ' + r.total,
      r.pct + '%',
      null,
      r.date
    ];
    cells.forEach((val, ci) => {
      const td = document.createElement('td');
      if (ci === 4) {
        const b = document.createElement('span');
        b.className = 'badge ' + (r.pass ? 'badge-pass' : 'badge-fail');
        b.textContent = r.pass ? t.pass : t.fail;
        td.appendChild(b);
      } else {
        td.textContent = val;
        if (ci === 1) td.style.fontWeight = '700';
        if (ci === 5) { td.style.color = 'var(--fg-soft)'; td.style.fontSize = '0.82rem'; td.style.whiteSpace = 'nowrap'; }
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

// Sends records saved in this browser that were never sent to the sheet (e.g. older tests).
function uploadRecords() {
  const btn = document.getElementById('btn-upload');
  const pending = records.filter(r => !r.sent);
  if (pending.length === 0) { btn.textContent = T[lang].btnUploadDone; return; }
  pending.forEach((r, i) => setTimeout(() => {
    sendToSheet({ name: r.name, score: r.score, total: r.total, pct: r.pct, pass: r.pass,
                  wrong: r.wrong || 'مرفوع من السجل المحلي (بدون تفاصيل)' });
    r.sent = true;
    saveRecords();
  }, i * 400));
  setTimeout(() => { btn.textContent = T[lang].btnUploadDone; }, pending.length * 400 + 200);
}

let clearArmed = false;
function clearRecords() {
  const btn = document.getElementById('btn-clear');
  if (!clearArmed) {
    clearArmed = true;
    btn.textContent = T[lang].confirmClear;
    setTimeout(() => { clearArmed = false; btn.textContent = T[lang].btnClear; }, 4000);
    return;
  }
  clearArmed = false;
  records = [];
  saveRecords();
  renderRecords();
  btn.textContent = T[lang].btnClear;
}

const REV_LANGS = [['ar','عربي'],['en','English'],['hi','हिंदी'],['bn','বাংলা'],['id','Indonesia']];
function escHtml(s) { return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function showReview() {

function renderReview() {
  const letters = ['A','B','C','D'];
  const html = BANK.map((bq, i) => {
    const langs = REV_LANGS.map(([L, name]) => {
      const opts = bq.o[L].map((o, p) => {
        const ok = p === bq.c;
        return `<div class="rev-opt${ok ? ' ok' : ''}">${ok ? '✓ ' : ''}${escHtml(letters[p])}. ${escHtml(o)}</div>`;
      }).join('');
      return `<div class="rev-lang"><div class="rev-lbl">${name}</div><div class="rev-q">${escHtml(bq.q[L])}</div>${opts}</div>`;
    }).join('');
    return `<div class="rev-item"><div class="rev-head">${i + 1}. ${escHtml(bq.cat.en)} — ${escHtml(bq.cat.ar)}</div>${langs}</div>`;
  }).join('');
  document.getElementById('review-body').innerHTML = html;
}

const STUDY_NOTES = [{"t":["مقدمة لك","Introduction for you","आपके लिए परिचय","আপনার জন্য ভূমিকা","Pengantar untuk Anda"],"r":[["h2","الاحترافية في العمل","Professionalism at work","कार्य में व्यावसायिकता","কর্মক্ষেত্রে পেশাদারিত্ব","Profesionalisme di tempat kerja"],["p","عزيزي العامل / العاملة في منشأة الغذاء، مرحباً بك في برنامج التثقيف الصحي للعاملين! لأنك عنصر أساسي في نجاح منشأتك، فإن فهمك لأهمية الاحترافية سيمكنك من تقديم أفضل ما لديك كل يوم.","Dear food establishment worker, welcome to the Health Education Programme for employees! As an essential part of your establishment's success, understanding the importance of professionalism lets you give your best every day.","प्रिय खाद्य प्रतिष्ठान कर्मचारी, स्वास्थ्य शिक्षा कार्यक्रम में आपका स्वागत है! आपके प्रतिष्ठान की सफलता में आप एक अहम भूमिका निभाते हैं। व्यावसायिकता का महत्व समझकर आप हर दिन अपना सर्वश्रेष्ठ दे सकते हैं।","প্রিয় খাদ্য প্রতিষ্ঠানের কর্মী, কর্মীদের স্বাস্থ্য শিক্ষা কর্মসূচিতে স্বাগতম! আপনার প্রতিষ্ঠানের সাফল্যে আপনি একটি মৌলিক উপাদান। পেশাদারিত্বের গুরুত্ব বুঝলে আপনি প্রতিদিন সেরাটা দিতে পারবেন।","Pekerja yang terhormat di establishmen pangan, selamat datang di Program Pendidikan Kesehatan untuk pekerja! Sebagai bagian penting dari keberhasilan usaha Anda, memahami pentingnya profesionalisme membantu Anda memberikan yang terbaik setiap hari."],["p","الاحترافية ليست مجرد سلوك، بل هي التزام بالجودة والسلامة، مما يسهم في تحسين تجربة العملاء ويعزز من سمعة المنشأة.","Professionalism is not just behaviour. It is a commitment to quality and safety, which improves the customer's experience and strengthens the establishment's reputation.","व्यावसायिकता केवल व्यवहार नहीं, बल्कि गुणवत्ता और सुरक्षा के प्रति प्रतिबद्धता है, जो ग्राहकों का अनुभव बेहतर बनाती है और प्रतिष्ठान की साख बढ़ाती है।","পেশাদারিত্ব শুধু আচরণ নয়, এটি মান ও নিরাপত্তার প্রতি অঙ্গীকার, যা গ্রাহকের অভিজ্ঞতা উন্নত করে এবং প্রতিষ্ঠানের সুনাম বাড়ায়।","Profesionalisme bukan sekadar perilaku, melainkan komitmen pada mutu dan keamanan, yang meningkatkan pengalaman pelanggan dan memperkuat reputasi usaha."],["p","نحن هنا لدعمك، ونتطلع إلى رؤية تأثيرك الإيجابي في مكان العمل.","We are here to support you, and we look forward to seeing your positive impact at work.","हम आपकी मदद के लिए यहाँ हैं, और कार्यस्थल पर आपका सकारात्मक प्रभाव देखने की प्रतीक्षा है।","আমরা আপনাকে সহায়তা করতে এখানে আছি, এবং কর্মক্ষেত্রে আপনার ইতিবাচক প্রভাব দেখতে আগ্রহী।","Kami di sini untuk mendukung Anda, dan kami berharap melihat dampak positif Anda di tempat kerja."],["h3","ما هي الاحترافية في العمل؟","What is professionalism at work?","कार्य में व्यावसायिकता क्या है?","কর্মক্ষেত্রে পেশাদারিত্ব কী?","Apa itu profesionalisme di tempat kerja?"],["p","الاحترافية هي التزامك بأداء عملك بأفضل طريقة ممكنة. إنها تعني:","Professionalism means doing your work in the best possible way. It means:","व्यावसायिकता का अर्थ है अपना काम सर्वोत्तम तरीके से करने की प्रतिबद्धता। इसका मतलब है:","পেশাদারিত্ব মানে সর্বোত্তম উপায়ে কাজ করার অঙ্গীকার। এর অর্থ:","Profesionalisme berarti berkomitmen melakukan pekerjaan Anda dengan cara terbaik. Artinya:"],["li","الالتزام بقواعد العمل وخاصة السلامة والنظافة.","Following work rules, especially safety and hygiene.","कार्य के नियमों, विशेषकर सुरक्षा और स्वच्छता, का पालन करना।","কাজের নিয়ম, বিশেষ করে নিরাপত্তা ও পরিচ্ছন্নতা মেনে চলা।","Mematuhi aturan kerja, terutama keselamatan dan kebersihan."],["li","التعامل باحترام مع الزملاء والعملاء.","Treating colleagues and customers with respect.","साथियों और ग्राहकों से सम्मानपूर्वक व्यवहार करना।","সহকর্মী ও গ্রাহকদের সঙ্গে শ্রদ্ধাশীল আচরণ করা।","Memperlakukan rekan kerja dan pelanggan dengan hormat."],["li","إنجاز مهامك بدقة وإتقان.","Completing your tasks accurately and skilfully.","अपने कार्य सटीकता और कुशलता से पूरे करना।","আপনার কাজ নির্ভুল ও দক্ষতার সঙ্গে সম্পন্ন করা।","Menyelesaikan tugas dengan teliti dan terampil."],["li","التدريب والتطوير المستمر لمهاراتك.","Continuous training and developing your skills.","अपने कौशल का लगातार प्रशिक्षण और विकास करना।","ক্রমাগত প্রশিক্ষণ নিয়ে নিজের দক্ষতা উন্নত করা।","Pelatihan dan pengembangan keterampilan secara berkelanjutan."],["h3","لماذا الاحترافية في العمل مهمة لك؟","Why is professionalism at work important to you?","कार्य में व्यावसायिकता आपके लिए क्यों महत्वपूर्ण है?","কর্মক্ষেত্রে পেশাদারিত্ব আপনার জন্য কেন গুরুত্বপূর্ণ?","Mengapa profesionalisme di tempat kerja penting bagi Anda?"],["li","تحمي صحتك وصحة العملاء: تقلل من خطر الإصابات في العمل وتضمن تقديم غذاء آمن للمستهلكين.","It protects your health and customers' health: it reduces the risk of workplace injuries and ensures safe food for consumers.","यह आपके और ग्राहकों के स्वास्थ्य की रक्षा करता है: कार्यस्थल पर चोट का खतरा घटाता है और उपभोक्ताओं को सुरक्षित भोजन सुनिश्चित करता है।","এটি আপনার ও গ্রাহকদের স্বাস্থ্য রক্ষা করে: কর্মক্ষেত্রে দুর্ঘটনার ঝুঁকি কমায় এবং ভোক্তাদের নিরাপদ খাবার নিশ্চিত করে।","Melindungi kesehatan Anda dan pelanggan: mengurangi risiko kecelakaan kerja dan memastikan makanan aman bagi konsumen."],["li","تطور مسيرتك المهنية: تزيد فرصك في الترقية وتجعلك موظفاً قيماً في المنشأة.","It develops your career: it increases your chances of promotion and makes you a valued employee.","यह आपके करियर को आगे बढ़ाता है: पदोन्नति के अवसर बढ़ते हैं और आप प्रतिष्ठान के लिए मूल्यवान कर्मचारी बनते हैं।","এটি আপনার পেশাগত অগ্রগতি ঘটায়: পদোন্নতির সুযোগ বাড়ে এবং আপনি একজন মূল্যবান কর্মী হন।","Mengembangkan karier Anda: meningkatkan peluang promosi dan menjadikan Anda karyawan yang dihargai."],["li","تحسن بيئة العمل: تخلق جواً إيجابياً مع زملائك وتقلل من الضغط والتوتر في العمل.","It improves the work environment: it creates a positive atmosphere with colleagues and reduces stress and tension.","यह कार्य वातावरण बेहतर बनाता है: साथियों के साथ सकारात्मक माहौल बनता है और तनाव कम होता है।","এটি কর্মপরিবেশ উন্নত করে: সহকর্মীদের সঙ্গে ইতিবাচক পরিবেশ তৈরি হয় এবং চাপ ও উত্তেজনা কমে।","Memperbaiki lingkungan kerja: menciptakan suasana positif dengan rekan dan mengurangi tekanan."],["li","تعزز ثقتك بنفسك: تشعر بالفخر بعملك الجي
