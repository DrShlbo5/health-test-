ूध) सुरक्षित हुन्छन् र पानी नपरेसम्म तिनमा जीवाणु बढ्दैनन्।"], ["h3", "3. الوقت", "3. Time", "3. समय", "৩. সময়", "3. Waktu", "3. समय"], ["li", "كلما طالت مدة بقاء الغذاء في درجة حرارة الغرفة، زاد نمو البكتيريا.", "The longer food stays at room temperature, the more bacteria grow.", "भोजन कमरे के तापमान पर जितनी देर रहेगा, जीवाणु उतने बढ़ेंगे।", "খাবার ঘরের তাপমাত্রায় যত বেশি সময় থাকবে, ব্যাকটেরিয়া তত বাড়বে।", "Semakin lama pangan berada pada suhu ruang, semakin banyak bakteri yang tumbuh.", "खाना कोठाको तापक्रममा जति लामो बस्छ, त्यति धेरै जीवाणु बढ्छन्।"], ["h3", "4. الدفء (درجة الحرارة)", "4. Warmth (temperature)", "4. तापमान", "৪. তাপমাত্রা", "4. Suhu", "4. न्यानोपन (तापक्रम)"], ["li", "تحت 5°م: البكتيريا تنمو بشكل بطيء جداً.", "Below 5°C: bacteria grow very slowly.", "5°C से नीचे: जीवाणु बहुत धीरे बढ़ते हैं।", "৫°C-এর নিচে: ব্যাকটেরিয়া খুব ধীরে বাড়ে।", "Di bawah 5°C: bakteri tumbuh sangat lambat.", "5°C भन्दा तल: जीवाणु निकै बिस्तारै बढ्छन्।"], ["li", "المنطقة الخطرة: البكتيريا تنمو بشكل سريع بين 5°م و63°م.", "Danger zone: bacteria grow rapidly between 5°C and 63°C.", "खतरे का क्षेत्र: 5°C और 63°C के बीच जीवाणु तेज़ी से बढ़ते हैं।", "বিপদসীমা: ৫°C থেকে ৬৩°C-এর মধ্যে ব্যাকটেরিয়া দ্রুত বাড়ে।", "Zona bahaya: bakteri tumbuh cepat antara 5°C dan 63°C.", "खतराको दायरा: 5°C र 63°C बीच जीवाणु छिटो बढ्छन्।"], ["li", "أفضل درجة حرارة لنمو البكتيريا: حوالي 37°م (درجة حرارة الجسم).", "Best temperature for bacterial growth: about 37°C (body temperature).", "जीवाणु वृद्धि का सबसे अच्छा तापमान: लगभग 37°C (शरीर का तापमान)।", "ব্যাকটেরিয়া বৃদ্ধির সেরা তাপমাত্রা: প্রায় ৩৭°C (শরীরের তাপমাত্রা)।", "Suhu terbaik pertumbuhan bakteri: sekitar 37°C (suhu tubuh).", "जीवाणु बढ्न सबैभन्दा उपयुक्त तापक्रम: करिब 37°C (शरीरको तापक्रम)।"], ["li", "فوق 63°م: تتوقف البكتيريا عن النمو.", "Above 63°C: bacteria stop growing.", "63°C से ऊपर: जीवाणु बढ़ना बंद कर देते हैं।", "৬৩°C-এর উপরে: ব্যাকটেরিয়ার বৃদ্ধি থেমে যায়।", "Di atas 63°C: bakteri berhenti tumbuh.", "63°C भन्दा माथि: जीवाणुको वृद्धि रोकिन्छ।"], ["li", "من 75°م وأعلى: تموت معظم البكتيريا الضارة.", "From 75°C and above: most harmful bacteria die.", "75°C और उससे ऊपर: अधिकांश हानिकारक जीवाणु मर जाते हैं।", "৭৫°C বা তার বেশিতে: বেশিরভাগ ক্ষতিকর ব্যাকটেরিয়া মারা যায়।", "Dari 75°C ke atas: sebagian besar bakteri berbahaya mati.", "75°C र सोभन्दा माथि: अधिकांश हानिकारक जीवाणु मर्छन्।"], ["n", "ماذا يعني هذا لنا؟: لا نعتمد على التجميد (-12 إلى -22°م) لقتل البكتيريا، فهي تبقى في حالة سكون فقط. نراقب درجة حرارة الثلاجات (1 إلى 4°م) بانتظام لضمان بقائها تحت 5°م. نقلل وقت بقاء الغذاء في النطاق الحراري الخطر (5 إلى 63°م) قدر الإمكان. نحافظ على درجة حرارة الأغذية الساخنة فوق 63°م دائماً. نستخدم مقياس حرارة للتأكد من وصول درجة حرارة الغذاء إلى 75°م على الأقل.", "What this means for us: we do not rely on freezing (-12 to -22°C) to kill bacteria; it only keeps them dormant. We check fridge temperatures (1 to 4°C) regularly to keep them below 5°C. We minimise the time food spends in the danger zone (5 to 63°C). We always keep hot food above 63°C. We use a thermometer to confirm food reaches at least 75°C.", "हमारे लिए इसका अर्थ: हम जीवाणु मारने के लिए जमाव (-12 से -22°C) पर निर्भर नहीं रहते; उससे वे केवल सुप्त होते हैं। हम फ्रिज का तापमान (1 से 4°C) नियमित जांचते हैं ताकि वह 5°C से नीचे रहे। भोजन खतरे के क्षेत्र (5 से 63°C) में कम से कम समय रहे। गर्म भोजन हमेशा 63°C से ऊपर रखें। थर्मामीटर से पक्का करें कि भोजन कम से कम 75°C तक पहुँचे।", "আমাদের জন্য এর অর্থ: ব্যাকটেরিয়া মারতে আমরা হিমায়নের (-১২ থেকে -২২°C) উপর নির্ভর করি না; তাতে কেবল ওরা নিষ্ক্রিয় থাকে। ফ্রিজের তাপমাত্রা (১ থেকে ৪°C) নিয়মিত দেখি যেন ৫°C-এর নিচে থাকে। খাবার বিপদসীমায় (৫ থেকে ৬৩°C) যতটা সম্ভব কম রাখি। গরম খাবার সবসময় ৬৩°C-এর উপরে রাখি। থার্মোমিটারে যাচাই করি খাবার অন্তত ৭৫°C-এ পৌঁছেছে।", "Bagi kita: kita tidak mengandalkan pembekuan (-12 sampai -22°C) untuk membunuh bakteri; itu hanya membuatnya dormant. Kita memeriksa suhu kulkas (1 sampai 4°C) secara rutin agar tetap di bawah 5°C. Kita meminimalkan waktu pangan berada di zona bahaya (5 sampai 63°C). Pangan panas selalu dijaga di atas 63°C. Kita memakai termometer untuk memastikan pangan mencapai minimal 75°C.", "हाम्रो लागि यसको अर्थ: हामी जीवाणु मार्न जमाउने (-12 देखि -22°C) मा भरोसा गर्दैनौं; यसले तिनीहरूलाई केवल सुषुप्त बनाउँछ। हामी फ्रिजको तापक्रम (1 देखि 4°C) नियमित जाँच्छौं ताकि त्यो 5°C भन्दा तल रहोस्। हामी खानाले खतराको दायरा (5 देखि 63°C) मा बिताउने समय न्यूनतम बनाउँछौं। हामी तातो खाना सधैं 63°C भन्दा माथि राख्छौं। हामी थर्मोमिटरले खाना कम्तीमा 75°C पुग्यो भनी पक्का गर्छौं।"], ["h2", "الجراثيم المتبوغة والسموم البكتيرية", "Spore-forming bacteria and bacterial toxins", "बीजाणु बनाने वाले जीवाणु और जीवाणु विष", "স্পোর-গঠনকারী ব্যাকটেরিয়া ও ব্যাকটেরিয়াল টক্সিন", "Bakteri pembentuk spora dan toksin bakteri", "बीजाणु बनाउने जीवाणु र जीवाणुजन्य विष"], ["h3", "الجراثيم المتبوغة", "Spore-forming bacteria", "बीजाणु बनाने वाले जीवाणु", "স্পোর-গঠনকারী ব্যাকটেরিয়া", "Bakteri pembentuk spora", "बीजाणु बनाउने जीवाणु"], ["p", "عندما تصبح الظروف غير مناسبة لنمو البكتيريا - مثل ارتفاع درجات الحرارة أو عدم توفر الرطوبة - تموت معظم البكتيريا. لكن هناك أنواع من البكتيريا تستطيع النجاة عن طريق تكوين أبواغ، وهي تراكيب خلوية صلبة تحتوي على البكتيريا، مما يسمح للبكتيريا بالتوقف عن النشاط حتى تتحسن البيئة المحيطة، ويعود البوغ إلى شكل البكتيريا ويصبح نشطاً وقادراً على النمو والتكاثر من جديد.", "When conditions are unsuitable for bacterial growth, such as high temperature or lack of moisture, most bacteria die. But some bacteria survive by forming spores, which are hard cell structures containing the bacterium. This lets the bacterium stop being active until the surroundings improve, and then the spore returns to the bacterial form, becomes active again and can grow and multiply.", "जब परिस्थितियाँ जीवाणु वृद्धि के लिए अनुकूल नहीं रहतीं, जैसे उच्च तापमान या नमी की कमी, तो अधिकांश जीवाणु मर जाते हैं। लेकिन कुछ जीवाणु बीजाणु (स्पोर) बनाकर बच जाते हैं, जो सख्त कोशिका संरचनाएँ हैं और जीवाणु को अपने भीतर रखती हैं। इससे जीवाणु सक्रिय होना रोक देता है जब तक माहौल सुधर न जाए; फिर बीजाणु जीवाणु के रूप में लौटकर फिर से बढ़ता और फैलता है।", "যখন পরিবেশ ব্যাকটেরিয়া বৃদ্ধির উপযোগী থাকে না, যেমন উচ্চ তাপমাত্রা বা আর্দ্রতার অভাবে, তখন বেশিরভাগ ব্যাকটেরিয়া মরে যায়। কিন্তু কিছু ব্যাকটেরিয়া স্পোর তৈরি করে বেঁচে থাকে, যা ব্যাকটেরিয়া ধারণকারী শক্ত কোষ কাঠামো। এতে পরিবেশ ভালো হওয়া পর্যন্ত ব্যাকটেরিয়া সক্রিয়তা বন্ধ রাখে; তারপর স্পোর আবার ব্যাকটেরিয়ায় রূপ নিয়ে সক্রিয় হয়ে বাড়ে ও ছড়ায়।", "Ketika kondisi tidak sesuai untuk pertumbuhan bakteri, seperti suhu tinggi atau tidak adanya kelembapan, sebagian besar bakteri mati. Namun beberapa bakteri bertahan dengan membentuk spora, yaitu struktur sel keras yang berisi bakteri. Ini membuat bakteri berhenti aktif sampai lingkungan membaik; kemudian spora kembali menjadi bakteri, aktif lagi, dan dapat tumbuh serta berkembang biak.", "जब जीवाणु बढ्न अनुपयुक्त अवस्था हुन्छ, जस्तै उच्च तापक्रम वा चिस्यानको अभाव, अधिकांश जीवाणु मर्छन्। तर केही जीवाणु बीजाणु (स्पोर) बनाएर बाँच्छन्, जुन जीवाणु भएको कडा कोष संरचना हो। यसले जीवाणु वातावरण सुधिँदासम्म निष्क्रिय रहन सक्छ, र त्यसपछि बीजाणु फेरि जीवाणुको रूपमा फर्केर सक्रिय भई बढ्न र फैलिन सक्छ।"], ["li", "أمثلة على الجراثيم المتبوغة التي تشكل خطراً في منشآت الغذاء:", "Examples of spore-forming bacteria that pose a risk in food establishments:", "खाद्य प्रतिष्ठानों में खतरा पैदा करने वाले बीजाणु-जीवाणुओं के उदाहरण:", "খাদ্য প্রতিষ্ঠানে ঝুঁকি সৃষ্টিকারী স্পোর-গঠনকারী ব্যাকটেরিয়ার উদাহরণ:", "Contoh bakteri pembentuk spora yang berisiko di usaha pangan:", "खाना प्रतिष्ठानमा जोखिम हुने बीजाणु बनाउने जीवाणुका उदाहरण:"], ["li", "بكتيريا الباسيلس سيريس: توجد عادة في الأرز المطبوخ وأطباق الأرز.", "Bacillus cereus: usually found in cooked rice and rice dishes.", "बैसिलस सेरियस: आमतौर पर पके चावल और चावल के व्यंजनों में मिलता है।", "ব্যাসিলাস সেরিয়াস: সাধারণত রান্না করা ভাত ও ভাতের পদে পাওয়া যায়।", "Bacillus cereus: biasanya ditemukan pada nasi matang dan hidangan nasi.", "बेसिलस सेरियस: सामान्यतया पकाएको भात र भातका परिकारमा पाइन्छ।"], ["li", "بكتيريا الكلوستريديوم بيرفرنجنز: تتواجد في اللحوم وأحياناً في التربة العالقة بالخضروات.", "Clostridium perfringens: found in meat, and sometimes in soil clinging to vegetables.", "क्लॉस्ट्रिडियम परफ्रिंजेंस: मांस में मिलता है, और कभी-कभी सब्ज़ियों पर चिपकी मिट्टी में।", "ক্লস্ট্রিডিয়াম পারফ্রিনজেনস: মাংসে পাওয়া যায়, কখনো সবজিতে লেগে থাকা মাটিতেও।", "Clostridium perfringens: ditemukan pada daging, dan kadang pada tanah yang menempel di sayuran.", "क्लोस्ट्रिडियम पर्फ्रिन्जेन्स: मासुमा पाइन्छ, र कहिलेकाहीँ तरकारीमा टाँसिएको माटोमा।"], ["h3", "السموم البكتيرية", "Bacterial toxins", "जीवाणु विष", "ব্যাকটেরিয়াল টক্সিন", "Toksin bakteri", "जीवाणुजन्य विष"], ["p", "تنتج بعض البكتيريا مواد سامة (تسمى التوكسين) داخل الغذاء. قد تسبب هذه السموم المرض حتى لو تم طهي الغذاء وقتل البكتيريا، لأن بعض هذه السموم مقاوم للحرارة. على سبيل المثال، السم الذي تنتجه بكتيريا ستافيلوكوكس أوريس يبقى فعالاً حتى بعد عملية الطهي، مما يعني أن قتل البكتيريا لا يمنع التسمم الغذائي.", "Some bacteria produce toxic substances (called toxins) inside food. These toxins can cause illness even if the food is cooked and the bacteria are killed, because some toxins are heat-resistant. For example, the toxin produced by Staphylococcus aureus remains active even after cooking, meaning that killing the bacteria does not prevent food poisoning.", "कुछ जीवाणु भोजन के भीतर विषैले पदार्थ (जिन्हें टॉक्सिन कहते हैं) बनाते हैं। ये टॉक्सिन भोजन पकाकर जीवाणु मार देने पर भी बीमारी पैदा कर सकते हैं, क्योंकि कुछ टॉक्सिन गर्मी-रोधी होते हैं। उदाहरण के लिए, स्टैफिलोकॉकस ऑरियस द्वारा बना विष पकाने के बाद भी सक्रिय रहता है; यानी जीवाणु मारने से फ़ूड पॉइज़निंग नहीं रुकती।", "কিছু ব্যাকটেরিয়া খাবারের ভেতরে বিষাক্ত পদার্থ (টক্সিন) তৈরি করে। খাবার রান্না করে ব্যাকটেরিয়া মারা হলেও এই টক্সিন অসুখ ঘটাতে পারে, কারণ কিছু টক্সিন তাপ-প্রতিরোধী। যেমন স্ট্যাফাইলোকক্কাস অরিয়াসের টক্সিন রান্নার পরও সক্রিয় থাকে; অর্থাৎ ব্যাকটেরিয়া মারলেই খাদ্যে বিষক্রিয়া বন্ধ হয় না।", "Beberapa bakteri menghasilkan zat beracun (disebut toksin) di dalam pangan. Toksin ini dapat menyebabkan sakit meski pangan sudah dimasak dan bakterinya mati, karena sebagian toksin tahan panas. Contohnya, toksin dari Staphylococcus aureus tetap aktif setelah dimasak, sehingga membunuh bakteri tidak mencegah keracunan pangan.", "केही जीवाणुले खानाभित्र विषाक्त पदार्थ (जसलाई विष भनिन्छ) उत्पादन गर्छन्। खाना पकाइएको र जीवाणु मरेको भए पनि यी विषले बिरामी बनाउन सक्छन्, किनभने केही विष तातोसँग प्रतिरोधी हुन्छन्। उदाहरणका लागि, स्टाफिलोकोकस अरियसले बनाएको विष पकाएपछि पनि सक्रिय रहन्छ, यसको मतलब जीवाणु मार्दा मात्र खाना विषाक्तता रोकिँदैन।"], ["h3", "أمثلة على البكتيريا التي تنتج السموم", "Examples of bacteria that produce toxins", "विष बनाने वाले जीवाणुओं के उदाहरण", "টক্সিন তৈরিকারী ব্যাকটেরিয়ার উদাহরণ", "Contoh bakteri penghasil toksin", "विष बनाउने जीवाणुका उदाहरण"], ["li", "بكتيريا الكلوستريديوم بوتولينوم: تتواجد في الأسماك، اللحوم، الخضروات، والصلصات المحفوظة أو المعبأة تحت تفريغ. تنتج سموماً تؤثر على الجهاز العصبي، وقد تؤدي إلى حالات تسمم خطيرة قد تصل إلى الوفاة.", "Clostridium botulinum: found in fish, meat, vegetables, and sauces that are canned or vacuum-packed. It produces toxins that affect the nervous system and can cause serious poisoning that may lead to death.", "क्लॉस्ट्रिडियम बोटुलिनम: मछली, मांस, सब्ज़ियों और डिब्बाबंद या वैक्यूम-पैक सॉस में मिलता है। यह नसों पर असर डालने वाले विष बनाता है, जिससे गंभीर विषाक्तता और मृत्यु तक हो सकती है।", "ক্লস্ট্রিডিয়াম বোটুলিনাম: মাছ, মাংস, সবজি এবং টিনজাত বা ভ্যাকুয়াম-প্যাকড সসে পাওয়া যায়। এটি স্নায়ুতন্ত্রে প্রভাব ফেলা টক্সিন তৈরি করে, যা গুরুতর বিষক্রিয়া ও মৃত্যু ঘটাতে পারে।", "Clostridium botulinum: ditemukan pada ikan, daging, sayuran, dan saus yang dikalengkan atau dikemas vakum. Ia menghasilkan toksin yang memengaruhi sistem saraf dan dapat menyebabkan keracunan serius hingga kematian.", "क्लोस्ट्रिडियम बोटुलिनम: डिब्बाबन्द वा भ्याकुम-प्याक गरिएका माछा, मासु, तरकारी र ससमा पाइन्छ। यसले स्नायु प्रणालीमा असर गर्ने विष उत्पादन गर्छ, जसले गम्भीर विषाक्तता निम्त्याउन सक्छ र मृत् গ্ধজাত পণ্য। কেন ঝুঁকিপূর্ণ? সঠিকভাবে না রাখলে ব্যাকটেরিয়া দ্রুত বাড়ে। কীভাবে সামলাব? বিপদসীমার (৫°C থেকে ৬৩°C) বাইরে রাখি, দূষণ থেকে বাঁচাতে সবসময় ঢেকে রাখি, এবং সময় ও তাপমাত্রা ঘনিষ্ঠভাবে দেখি।", "Pangan berisiko tinggi: pangan siap saji, dimasak atau diolah, kaya protein, dan lembap. Contoh: daging matang, makanan siap saji, produk telur, produk susu. Mengapa berisiko? Bakteri cepat berkembang jika tidak disimpan dengan benar. Bagaimana menanganinya? Simpan di luar zona bahaya (5°C–63°C), selalu tutup untuk melindungi dari kontaminasi, dan pantau waktu serta suhu dengan cermat.", "उच्च जोखिमका खाना: तयार-खाने, पकाइएका वा प्रशोधित, प्रोटिन धेरै र चिस्यान भएका खाना। उदाहरण: पकाएको मासु, तयार परिकार, अण्डाका परिकार, दुग्ध पदार्थ। किन जोखिमपूर्ण? सही तरिकाले भण्डारण नगरिए जीवाणु छिटो बढ्न दिन्छन्। हामी कसरी ह्यान्डल गर्छौं? खतराको दायरा (5°C देखि 63°C) बाहिर राख्नुहोस्, दूषणबाट जोगाउन सधैं ढाक्नुहोस्, र समय र तापक्रम नजिकबाट निगरानी गर्नुहोस्।"], ["li", "الأغذية النيئة: أغذية تدعم نمو البكتيريا بسهولة، من أمثلتها: الجاهز للأكل: الفواكه والخضروات. التي تحتاج للطهي: اللحوم، الدواجن، الأسماك، البيض. كيف نتعامل معها؟ غسل الفواكه والخضروات جيداً قبل الاستخدام. تخزين الأغذية النيئة بعيداً عن الأغذية الجاهزة للأكل. التبريد أو التجميد لإبطاء نمو البكتيريا. الطهي الجيد لقتل البكتيريا.", "Raw foods: foods that readily support bacterial growth. Examples: ready-to-eat fruit and vegetables; foods that need cooking: meat, poultry, fish, eggs. How do we handle them? Wash fruit and vegetables well before use. Store raw foods away from ready-to-eat foods. Chill or freeze to slow bacterial growth. Cook thoroughly to kill bacteria.", "कच्चे भोजन: ऐसे खाद्य जो जीवाणु वृद्धि को आसानी से सहारा देते हैं। उदाहरण: खाने के लिए तैयार फल और सब्ज़ियाँ; पकाने योग्य भोजन: मांस, मुर्गी, मछली, अंडे। इन्हें कैसे संभालें? उपयोग से पहले फल-सब्ज़ियाँ अच्छी तरह धोएँ। कच्चे भोजन को तैयार भोजन से दूर रखें। जीवाणु वृद्धि धीमी करने के लिए ठंडा या जमाएँ। जीवाणु मारने के लिए अच्छी तरह पकाएँ।", "কাঁচা খাবার: যেসব খাবার ব্যাকটেরিয়া বৃদ্ধিতে সহজে সহায়ক। উদাহরণ: খাওয়ার উপযোগী ফল ও সবজি; রান্না দরকার এমন খাবার: মাংস, হাঁস-মুরগি, মাছ, ডিম। কীভাবে সামলাব? ব্যবহারের আগে ফল ও সবজি ভালো করে ধুই। কাঁচা খাবার তৈরি খাবার থেকে আলাদা রাখি। ব্যাকটেরিয়ার বৃদ্ধি ধীর করতে ঠান্ডা বা হিমায়িত করি। ব্যাকটেরিয়া মারতে ভালোভাবে রান্না করি।", "Pangan mentah: pangan yang mudah mendukung pertumbuhan bakteri. Contoh: buah dan sayur siap makan; pangan yang perlu dimasak: daging, unggas, ikan, telur. Bagaimana menanganinya? Cuci buah dan sayur dengan baik sebelum digunakan. Simpan pangan mentah terpisah dari pangan siap saji. Dinginkan atau bekukan untuk memperlambat pertumbuhan bakteri. Masak hingga matang sempurna untuk membunuh bakteri.", "काँचो खाना: जीवाणु वृद्धिलाई सजिलै सहयोग गर्ने खाना। उदाहरण: तयार-खाने फलफूल र तरकारी; पकाउन आवश्यक खाना: मासु, कुखुरा, माछा, अण्डा। हामी कसरी ह्यान्डल गर्छौं? प्रयोग गर्नु अघि फलफूल र तरकारी राम्ररी धुनुहोस्। काँचो खाना तयार-खाने खानाबाट टाढा भण्डारण गर्नुहोस्। जीवाणु वृद्धि सुस्त बनाउन चिसो वा जमाउनुहोस्। जीवाणु मार्न राम्रोसँग पकाउनुहोस्।"], ["li", "الأغذية منخفضة الخطورة: أغذية لا تدعم نمو البكتيريا بسهولة، من أمثلتها: منتجات عالية الحموضة (الخل، المخللات)، منتجات عالية السكر (الشوكولاتة، المربى)، منتجات جافة (الحبوب، الخبز، البسكويت)، منتجات عالية الملوحة (اللحوم المجففة). كيف نتعامل معها؟ لا تحتاج تبريد أو تجميد عادة. حمايتها من الملوثات الخارجية.", "Low-risk foods: foods that do not readily support bacterial growth. Examples: highly acidic products (vinegar, pickles), high-sugar products (chocolate, jam), dry products (grains, bread, biscuits), high-salt products (dried meat). How do we handle them? They usually do not need chilling or freezing. Protect them from external contamination.", "कम-जोखिम भोजन: ऐसे खाद्य जो जीवाणु वृद्धि को आसानी से सहारा नहीं देते। उदाहरण: अधिक अम्लीय उत्पाद (सिरका, अचार), अधिक चीनी वाले उत्पाद (चॉकलेट, मुरब्बा), सूखे उत्पाद (अनाज, ब्रेड, बिस्कुट), अधिक नमक वाले उत्पाद (सूखा मांस)। इन्हें कैसे संभालें? आमतौर पर ठंडा या जमाने की ज़रूरत नहीं। बाहरी संदूषण से बचाएँ।", "নিম্ন-ঝুঁকির খাবার: যেসব খাবার ব্যাকটেরিয়া বৃদ্ধিতে সহজে সহায়ক নয়। উদাহরণ: অতি অম্লীয় পণ্য (সিরকা, আচার), অতি চিনিযুক্ত পণ্য (চকোলেট, জ্যাম), শুকনো পণ্য (শস্য, রুটি, বিস্কুট), অতি লবণাক্ত পণ্য (শুকনো মাংস)। কীভাবে সামলাব? সাধারণত ঠান্ডা বা হিমায়নের প্রয়োজন নেই। বাইরের দূষণ থেকে রক্ষা করি।", "Pangan berisiko rendah: pangan yang tidak mudah mendukung pertumbuhan bakteri. Contoh: produk sangat asam (cuka, acar), produk tinggi gula (cokelat, selai), produk kering (biji-bijian, roti, biskuit), produk tinggi garam (daging kering). Bagaimana menanganinya? Biasanya tidak perlu didinginkan atau dibekukan. Lindungi dari kontaminasi luar.", "कम जोखिमका खाना: जीवाणु वृद्धिलाई सजिलै सहयोग नगर्ने खाना। उदाहरण: अत्यधिक अमिलो उत्पादन (सिरका, अचार), धेरै चिनी भएका उत्पादन (चकलेट, जाम), सुख्खा उत्पादन (अन्न, रोटी, बिस्कुट), धेरै नुन भएका उत्पादन (सुकेको मासु)। हामी कसरी ह्यान्डल गर्छौं? सामान्यतया चिसो वा जमाउन आवश्यक पर्दैन। बाहिरी दूषणबाट जोगाउनुहोस्।"], ["h2", "الجراثيم الأخرى", "Other microbes", "अन्य सूक्ष्मजीव", "অন্যান্য জীবাণু", "Mikroba lainnya", "अन्य सूक्ष्मजीव"], ["h3", "الفيروسات", "Viruses", "वायरस", "ভাইরাস", "Virus", "भाइरस"], ["li", "صغيرة جداً وأصغر من البكتيريا.", "Very small, smaller than bacteria.", "बहुत छोटे, जीवाणुओं से भी छोटे।", "খুব ছোট, ব্যাকটেরিয়ার চেয়েও ছোট।", "Sangat kecil, lebih kecil dari bakteri.", "धेरै साना, जीवाणुभन्दा साना।"], ["li", "لا تحتاج للتكاثر في الغذاء لتسبب المرض.", "They do not need to multiply in food to cause illness.", "बीमारी पैदा करने के लिए इन्हें भोजन में बढ़ने की ज़रूरत नहीं।", "অসুখ ঘটাতে খাবারে বাড়ার দরকার নেই।", "Tidak perlu berkembang biak di dalam pangan untuk menyebabkan sakit.", "रोग लाग्न खानामा बढ्नु आवश्यक छैन।"], ["li", "تستخدم الغذاء فقط كوسيلة للدخول إلى الجسم.", "They use food only as a way into the body.", "वे भोजन को केवल शरीर में प्रवेश का माध्यम बनाते हैं।", "তারা খাবারকে কেবল শরীরে প্রবেশের মাধ্যম হিসেবে ব্যবহার করে।", "Mereka hanya menggunakan pangan s r insecticides.", "खाद्य विषाक्तता: दूषित भोजन खाने के तुरंत बाद होती है। उदाहरण: सफाई सामग्री या कीटनाशक से दूषित भोजन।", "খাদ্যে বিষক্রিয়া: দূষিত খাবার খাওয়ার পরপরই ঘটে। উদাহরণ: পরিষ্কারক বা কীটনাশকে দূষিত খাবার।", "Keracunan pangan: terjadi cepat setelah makan pangan terkontaminasi. Contoh: pangan tercemar bahan pembersih atau insektisida.", "खाना विषाक्तता: दूषित खाना खाएपछि छिट्टै हुन्छ। उदाहरण: सफाई सामग्री वा कीटनाशकले दूषित खाना।"], ["li", "الأمراض المزمنة: تحدث بعد تناول كميات قليلة من المواد الكيميائية لفترة طويلة قد تسبب أمراضاً خطيرة مثل السرطان.", "Chronic illness: occurs after eating small amounts of chemicals over a long period, which may cause serious diseases such as cancer.", "दीर्घकालिक रोग: लंबे समय तक थोड़ी मात्रा में रसायन खाने से होता है, जिससे कैंसर जैसे गंभीर रोग हो सकते हैं।", "দীর্ঘমেয়াদি রোগ: দীর্ঘ সময় অল্প পরিমাণ রাসায়নিক খাওয়ার ফলে হয়, যা ক্যানসারের মতো গুরুতর রোগ ঘটাতে পারে।", "Penyakit kronis: terjadi setelah mengonsumsi bahan kimia dalam jumlah kecil dalam waktu lama, yang dapat menyebabkan penyakit serius seperti kanker.", "दीर्घकालीन रोग: लामो समयसम्म थोरै मात्रामा रसायन खाँदा हुन्छ, जसले क्यान्सर जस्ता गम्भीर रोग निम्त्याउन सक्छ।"], ["h3", "ما هي مصادر ملوثات الغذاء الكيميائية؟", "What are the sources of chemical food contaminants?", "रासायनिक खाद्य प्रदूषकों के स्रोत क्या हैं?", "রাসায়নিক খাদ্য দূষকের উৎস কী?", "Apa sumber kontaminan kimia pada pangan?", "रासायनिक खाना दूषकका स्रोतहरू के हुन्?"], ["li", "الممارسات الخاطئة في التعامل مع الغذاء.", "Incorrect handling practices.", "भोजन संभालने की गलत प्रथाएँ।", "খাবার পরিচালনার ভুল পদ্ধতি।", "Praktik penanganan pangan yang keliru.", "गलत ह्यान्डलिङ अभ्यास।"], ["li", "المضافات الغذائية.", "Food additives.", "खाद्य योजक।", "খাদ্য সংযোজন।", "Bahan tambahan pangan.", "खानामा थपिने तत्त्वहरू (additives)।"], ["li", "الحاويات والأواني.", "Containers and utensils.", "कंटेनर और बर्तन।", "পাত্র ও বাসন।", "Wadah dan peralatan.", "भाँडा र कन्टेनरहरू।"], ["li", "التخزين والشحن.", "Storage and transport.", "भंडारण और परिवहन।", "সংরক্ষণ ও পরিবহন।", "Penyimpanan dan pengangkutan.", "भण्डारण र ढुवानी।"], ["li", "عمليات التنظيف والصيانة (زيوت، مواد تنظيف).", "Cleaning and maintenance operations (oils, cleaning materials).", "सफाई और रखरखाव (तेल, सफाई सामग्री)।", "পরিষ্কার ও রক্ষণাবেক্ষণ (তেল, পরিষ্কারক)।", "Operasi pembersihan dan perawatan (minyak, bahan pembersih).", "सफाई र मर्मत कार्य (तेल, सफाई सामग्री)।"], ["li", "المواد الأولية (العناصر الكيميائية الثقيلة).", "Raw materials (heavy metal elements).", "कच्चा माल (भारी धात्विक तत्व)।", "কাঁচামাল (ভারী ধাতব উপাদান)।", "Bahan baku (unsur logam berat).", "कच्चा पदार्थ (भारी धातुका तत्त्व)।"], ["li", "زيوت القلي: لا تستخدمها لفترات طويلة. كل مرة تسخنها تكونت مواد كيميائية ضارة.", "Frying oils: do not use them for long periods. Each time they are heated, harmful chemicals form.", "तलने का तेल: लंबे समय तक इस्तेमाल न करें। हर बार गर्म करने पर हानिकारक रसायन बनते हैं।", "ভাজার তেল: দীর্ঘ সময় ব্যবহার করবেন না। প্রতিবার গরম করলে ক্ষতিকর রাসায়নিক তৈরি হয়।", "Minyak goreng: jangan dipakai terlalu lama. Setiap kali dipanaskan, terbentuk bahan kimia berbahaya.", "फ्राइङ तेल: लामो समयसम्म प्रयोग नगर्नुहोस्। हरेक पटक तताउँदा हानिकारक रसायन बन्छन्।"], ["li", "المبيدات الحشرية.", "Insecticides.", "कीटनाशक।", "কীটনাশক।", "Insektisida.", "कीटनाशक।"], ["h3", "كيف تصل ملوثات الغذاء الكيميائية إلى الغذاء؟", "How do chemical food contaminants reach food?", "रासायनिक खाद्य प्रदूषक भोजन तक कैसे पहुँचते हैं?", "রাসায়নিক খাদ্য দূষক খাবারে কীভাবে পৌঁছায়?", "Bagaimana kontaminan kimia mencapai pangan?", "रासायनिक खाना दूषकहरू खानामा कसरी पुग्छन्?"], ["li", "بدون قصد (عن طريق الخطأ)، مثل: وصول مواد التنظيف أو زيوت الآلات إلى الغذاء.", "Unintentionally (by mistake), such as cleaning materials or machine oils reaching food.", "अनजाने में (गलती से), जैसे सफाई सामग्री या मशीन का तेल भोजन तक पहुँचना।", "অনিচ্ছাকৃতভাবে (ভুলক্রমে), যেমন পরিষ্কারক বা যন্ত্রের তেল খাবারে পৌঁছানো।", "Tanpa sengaja (karena kesalahan), misalnya bahan pembersih atau minyak mesin masuk ke pangan.", "अनजानमा (गल्तीले), जस्तै सफाई सामग्री वा मेसिनको तेल खानामा पुग्नु।"], ["li", "بقصد (متعمد)، مثل: إضافة مواد كيميائية للغذاء بكميات أكثر من المسموح.", "Intentionally, such as adding chemicals to food in quantities greater than permitted.", "जानबूझकर, जैसे भोजन में अनुमति से अधिक मात्रा में रसायन मिलाना।", "ইচ্ছাকৃতভাবে, যেমন অনুমোদিত মাত্রার বেশি রাসায়নিক খাবারে মেশানো।", "Dengan sengaja, misalnya menambahkan bahan kimia ke pangan melebihi batas yang diizinkan.", "जानाजानी, जस्तै अनुमति भन्दा बढी मात्रामा खानामा रसायन हाल्नु।"], ["n", "ماذا يعني هذا لنا؟: كل شخص يتعامل مع المواد الكيميائية بحذر، فهو يعرف أن كل مادة تحتاج إلى التعامل الصحيح. نعرف أنواع المواد الكيميائية، وكيفية تخزينها، ومتى تكون الحاجة إليها. عند الشك في وجود تلوث كيميائي، نخبر المشرف فوراً.", "What this means for us: everyone handles chemicals with care, knowing each substance needs correct handling. We know the types of chemicals, how to store them and when they are needed. If we suspect chemical contamination, we tell the supervisor immediately.", "हमारे लिए इसका अर्थ: हर कोई रसायनों को सावधानी से संभालता है, यह जानते हुए कि हर पदार्थ को सही तरीके से संभालना ज़रूरी है। हम रसायनों के प्रकार, उनके भंडारण और ज़रूरत का समय जानते हैं। रासायनिक संदूषण का शक हो तो तुरंत पर्यवेक्षक को बताएँ।", "আমাদের জন্য এর অর্থ: প্রত্যেকে রাসায়নিক সতর্কতার সঙ্গে পরিচালনা করে, জানে প্রতিটি পদার্থের সঠিক ব্যবহার দরকার। রাসায়নিকের ধরন, সংরক্ষণ ও প্রয়োজনের সময় আমরা জানি। রাসায়নিক দূষণের সন্দেহ হলে অবিলম্বে সুপারভাইজারকে জানাই।", "Bagi kita: setiap orang menangani bahan kimia dengan hati-hati, sadar bahwa setiap zat perlu penanganan yang benar. Kita mengenali jenis bahan kimia, cara menyimpannya, dan kapan dibutuhkan. Jika curiga ada kontaminasi kimia, segera laporkan kepada supervisor.", "हाम्रो लागि यसको अर्थ: हरेक व्यक्तिले रसायनलाई सावधानीसाथ ह्यान्डल गर्छ, हरेक पदार्थलाई सही तरिकाले ह्यान्डल गर्नुपर्ने कुरा जान्दै। हामीलाई रसायनका प्रकार, तिनीहरूलाई कसरी भण्डारण गर्ने, र कहिले चाहिन्छ थाहा हुन्छ। रासायनिक दूषणको शंका लागेमा हामी तुरुन्तै सुपरवाइजरलाई भन्छौं।"], ["h2", "التحكم في تلوث الغذاء الكيميائي", "Controlling chemical food contamination", "रासायनिक खाद्य संदूषण पर नियंत्रण", "রাসায়নিক খাদ্য দূষণ নিয়ন্ত্রণ", "Mengendalikan kontaminasi kimia pada pangan", "रासायनिक खाना दूषण नियन्त्रण"], ["p", "التحكم في الملوثات الكيميائية أمر ضروري لضمان سلامة الغذاء وصحة المستهلكين. فيما يلي الطرق الرئيسية للتحكم في الملوثات الكيميائية ومنع وصولها للغذاء:", "Controlling chemical contaminants is essential to ensure food safety and consumers' health. The main ways to control chemical contaminants and prevent them reaching food are:", "रासायनिक प्रदूषकों पर नियंत्रण भोजन की सुरक्षा और उपभोक्ताओं के स्वास्थ्य के लिए अनिवार्य है। रासायनिक प्रदूषकों पर नियंत्रण और उन्हें भोजन तक पहुँचने से रोकने के मुख्य तरीके:", "খাদ্য নিরাপত্তা ও ভোক্তার স্বাস্থ্য নিশ্চিত করতে রাসায়নিক দূষক নিয়ন্ত্রণ অপরিহার্য। রাসায়নিক দূষক নিয়ন্ত্রণ ও খাবারে পৌঁছানো ঠেকানোর প্রধান উপায়:", "Pengendalian kontaminan kimia sangat penting untuk menjamin keamanan pangan dan kesehatan konsumen. Cara utama mengendalikan kontaminan kimia dan mencegah masuk ke pangan:", "रासायनिक दूषक नियन्त्रण गर्नु खाद्य सुरक्षा र उपभोक्ताको स्वास्थ्य सुनिश्चित गर्न अत्यावश्यक छ। रासायनिक दूषकलाई नियन्त्रण गरेर खानामा पुग्न नदिने मुख्य तरिका हो:"], ["h3", "المواد الأولية", "Raw materials", "कच्चा माल", "কাঁচামাল", "Bahan baku", "कच्चा पदार्थ"], ["p", "التحقق من سلامة المواد الأولية عند استلامها. إبلاغ المشرف عن أي مشكلة في المواد الأولية.", "Check the safety of raw materials on receipt. Report any problem with raw materials to the supervisor.", "प्राप्ति पर कच्चे माल की सुरक्षा जांचें। कच्चे माल की किसी भी समस्या की सूचना पर्यवेक्षक को दें।", "পাওয়ার সময় কাঁচামালের নিরাপত্তা যাচাই করুন। কাঁচামালের যেকোনো সমস্যা সুপারভাইজারকে জানান।", "Periksa keamanan bahan baku saat diterima. Laporkan setiap masalah bahan baku kepada supervisor.", "प्राप्त गर्दा कच्चा पदार्थको सुरक्षा जाँच गर्नुहोस्। कच्चा पदार्थमा कुनै समस्या भेटिए सुपरवाइजरलाई रिपोर्ट गर्नुहोस्।"], ["h3", "التعامل مع المواد الكيميائية", "Handling chemicals", "रसायनों को संभालना", "রাসায়নিক পরিচালনা", "Menangani bahan kimia", "रसायन ह्यान्डल गर्ने"], ["p", "تخزين المواد الكيميائية في الأماكن المخصصة. استخدام العبوات الأصلية للمواد الكيميائية. اتباع تعليمات الشركة المصنعة للمواد الكيميائية.", "Store chemicals in designated areas. Use the original containers for chemicals. Follow the manufacturer's instructions for chemicals.", "रसायनों को निर्धारित स्थानों पर रखें। रसायनों के मूल पैकेट इस्तेमाल करें। निर्माता के निर्देशों का पालन करें।", "রাসায়নিক নির্ধারিত স্থানে সংরক্ষণ করুন। রাসায়নিকের আসল পাত্র ব্যবহার করুন। প্রস্তুতকারকের নির্দেশনা মেনে চলুন।", "Simpan bahan kimia di tempat yang ditentukan. Gunakan wadah asli bahan kimia. Ikuti petunjuk pabrikan bahan kimia.", "रसायन तोकिएका ठाउँमा भण्डारण गर्नुहोस्। रसायनका लागि मूल कन्टेनर प्रयोग गर्नुहोस्। रसायनका लागि निर्माताका निर्देशन पालना गर्नुहोस्।"], ["h3", "المضافات الغذائية", "Food additives", "खाद्य योजक", "খাদ্য সংযোজন", "Bahan tambahan pangan", "खानामा थपिने तत्त्वहरू"], ["p", "استخدام المضافات المعتمدة فقط. اتباع الإرشادات بدقة (الكمية، الوقت، طريقة الإضافة).", "Use only approved additives. Follow the guidance precisely (quantity, time, method of addition).", "केवल स्वीकृत योजक इस्तेमाल करें। निर्देशों का सटीक पालन करें (मात्रा, समय, मिलाने का तरीका)।", "শুধু অনুমোদিত সংযোজন ব্যবহার করুন। নির্দেশনা নিখুঁতভাবে মেনে চলুন (পরিমাণ, সময়, মেশানোর পদ্ধতি)।", "Gunakan hanya bahan tambahan yang disetujui. Ikuti petunjuk dengan tepat (jumlah, waktu, cara penambahan).", "केवल स्वीकृत थप तत्त्व प्रयोग गर्नुहोस्। निर्देशन ठीकसँग पालना गर्नुहोस् (मात्रा, समय, थप्ने तरिका)।"], ["h3", "الحاويات والأواني", "Containers and utensils", "कंटेनर और बर्तन", "পাত্র ও বাসন", "Wadah dan peralatan", "कन्टेनर र भाँडाहरू"], ["p", "عدم استخدام أواني تتفاعل مع الغذاء. تجنب استخدام الحاويات المخصصة للمواد الكيميائية للغذاء فقط. عدم استخدام زجاجات المياه للمواد الكيميائية. عدم ترك العلب المعدنية المفتوحة في الثلاجة.", "Do not use utensils that react with food. Avoid using containers meant for chemicals for food. Do not use water bottles for chemicals. Do not leave open metal cans in the fridge.", "ऐसे बर्तन न इस्तेमाल करें जो भोजन से प्रतिक्रिया करें। रसायनों के लिए बने कंटेनर भोजन के लिए न लें। पानी की बोतलों में रसायन न रखें। खुले धातु के डिब्बे फ्रिज में न छोड़ें।", "খাবারের সঙ্গে বিক্রিয়া করে এমন বাসন ব্যবহার করবেন না। রাসায়নিকের পাত্র খাবারের জন্য ব্যবহার করবেন না। পানির বোতলে রাসায়নিক রাখবেন না। খোলা ধাতব টিন ফ্রিজে রাখবেন না।", "Jangan gunakan peralatan yang bereaksi dengan pangan. Hindari wadah bahan kimia untuk pangan. Jangan gunakan botol air untuk bahan kimia. Jangan biarkan kaleng logam terbuka di kulkas.", "खानासँग प्रतिक्रिया गर्ने भाँडा प्रयोग नगर्नुहोस्। रसायनका लागि बनेका कन्टेनर खानाका लागि प्रयोग नगर्नुहोस्। पानीका बोतल रसायनका लागि प्रयोग नगर्नुहोस्। खुला धातुका डिब्बा फ्रिजमा नराख्नुहोस्।"], ["h3", "عمليات الصيانة", "Maintenance operations", "रखरखाव संचालन", "রক্ষণাবেক্ষণ", "Operasi perawatan", "मर्मत कार्य"], ["p", "إبلاغ المشرف عن أي مشاكل في المعدات. عدم محاولة إصلاح المعدات دون تدريب مناسب.", "Report any equipment problems to the supervisor. Do not try to repair equipment without suitable training.", "उपकरण की किसी भी समस्या की सूचना पर्यवेक्षक को दें। उचित प्रशिक्षण के बिना उपकरण ठीक करने की कोशिश न करें।", "যন্ত্রপাতির যেকোনো সমস্যা সুপারভাইজারকে জানান। উপযুক্ত প্রশিক্ষণ ছাড়া যন্ত্র মেরামতের চেষ্টা করবেন না।", "Laporkan masalah peralatan kepada supervisor. Jangan mencoba memperbaiki peralatan tanpa pelatihan yang sesuai.", "उपकरणको कुनै समस्या सुपरवाइजरलाई रिपोर्ट गर्नुहोस्। उपयुक्त तालिम बिना उपकरण मर्मत गर्ने प्रयास नगर्नुहोस्।"], ["h3", "التخزين والنقل", "Storage and transport", "भंडारण और परिवहन", "সংরক্ষণ ও পরিবহন", "Penyimpanan dan pengangkutan", "भण्डारण र ढुवानी"], ["p", "تخزين ونقل المواد الكيميائية بعيداً عن الغذاء.", "Store and transport chemicals away from food.", "रसायनों को भोजन से दूर रखें और ले जाएँ।", "রাসায়নিক খাবার থেকে দূরে সংরক্ষণ ও পরিবহন করুন।", "Simpan dan angkut bahan kimia jauh dari pangan.", "रसायन खानाबाट टाढा भण्डारण र ढुवानी गर्नुहोस्।"], ["h3", "استخدام المبيدات الحشرية", "Using insecticides", "कीटनाशकों का उपयोग", "কীটনাশক ব্যবহার", "Penggunaan insektisida", "कीटनाशक प्रयोग"], ["p", "استخدام المبيدات بعيداً عن الغذاء. تغطية الغذاء المكشوف قبل الرش. غسل السطوح جيداً بعد الرش. إبلاغ المشرف عن أي غذاء يُشتبه بتلوثه.", "Use pesticides far from food. Cover exposed food before spraying. Wash surfaces well after spraying. Report any food suspected of contamination to the supervisor.", "कीटनाशक भोजन से दूर इस्तेमाल करें। छिड़काव से पहले खुला भोजन ढकें। छिड़काव के बाद सतहें अच्छी तरह धोएँ। दूषित होने का शक वाले भोजन की सूचना पर्यवेक्षक को दें।", "খাবার থেকে দূরে কীটনাশক ব্যবহার করুন। স্প্রে করার আগে খোলা খাবার ঢেকে দিন। স্প্রের পর পৃষ্ঠ ভালো করে ধুন। দূষণের সন্দেহ হলে যেকোনো খাবার সুপারভাইজারকে জানান।", "Gunakan pestisida jauh dari pangan. Tutup pangan yang terbuka sebelum disemprot. Cuci permukaan dengan baik setelah disemprot. Laporkan pangan yang diduga tercemar kepada supervisor.", "कीटनाशक खानाबाट टाढा प्रयोग गर्नुहोस्। स्प्रे गर्नु अघि खुला खाना ढाक्नुहोस्। स्प्रे गरेपछि सतह राम्ररी धुनुहोस्। दूषणको शंका लागेको कुनै पनि खाना सुपरवाइजरलाई रिपोर्ट गर्नुहोस्।"], ["n", "تنبيه دائماً: تخزين المواد الكيميائية أو وضعها على مقربة من الغذاء أو المعدات أو الأسطح التي تتصل بالغذاء يمكن أن يسبب التلوث الكيميائي.", "Always remember: storing chemicals or placing them near food, equipment or surfaces that contact food can cause chemical contamination.", "हमेशा याद रखें: रसायनों को भोजन, उपकरणों या भोजन के संपर्क वाली सतहों के पास रखने से रासायनिक संदूषण हो सकता है।", "সবসময় মনে রাখুন: রাসায়নিক খাবার, যন্ত্রপাতি বা খাবারের সংস্পর্শে আসা পৃষ্ঠের কাছে রাখলে রাসায়নিক দূষণ হতে পারে।", "Selalu ingat: menyimpan bahan kimia atau meletakkannya dekat pangan, peralatan, atau permukaan yang bersentuhan dengan pangan dapat menyebabkan kontaminasi kimia.", rtutup rapat.", "बाहिरी प्याकेजिङ खाना तयारी क्षेत्रबाट टाढा हटाउनुहोस्, र खाना सफा, कसेर बन्द गरिएको भाँडोमा पुनः प्याक गर्नुहोस्।"], ["h3", "المواد الأولية", "Raw materials", "कच्चा माल", "কাঁচামাল", "Bahan baku", "कच्चा पदार्थ"], ["p", "فحص المواد الأولية بدقة عند استلامها، وتصفية السوائل وغربلة الحبوب لتخلص من الشوائب.", "Carefully inspect raw materials on receipt, and drain liquids and sieve grains to remove impurities.", "प्राप्ति पर कच्चे माल की बारीकी से जांच करें, और अशुद्धियाँ हटाने के लिए तरल छानें और अनाज चालें।", "পাওয়ার সময় কাঁচামাল ভালোভাবে পরীক্ষা করুন, এবং অমেধ্য সরাতে তরল ঝরান ও শস্য চালুন।", "Periksa bahan baku dengan teliti saat diterima, dan tiriskan cairan serta ayak biji-bijian untuk membuang kotoran.", "प्राप्त गर्दा कच्चा पदार्थ सावधानीसाथ जाँच गर्नुहोस्, र अशुद्धता हटाउन तरल निकाल्नुहोस् र अन्न चाल्नुहोस्।"], ["h3", "المعدات والأدوات", "Equipment and tools", "उपकरण और औज़ार", "যন্ত্র ও সরঞ্জাম", "Peralatan dan perkakas", "उपकरण र औजार"], ["p", "تنظيف وتطهير المعدات بعد كل استخدام، والإبلاغ عن أي معدات تالفة. عدم استخدام الأدوات الخشبية أو الزجاجية في المناطق المخصصة لتحضير الغذاء. والإبلاغ فوراً عن أي كسر في الزجاج أو الأدوات.", "Clean and sanitise equipment after every use, and report any damaged equipment. Do not use wooden or glass tools in food preparation areas. Report any breakage of glass or tools immediately.", "हर इस्तेमाल के बाद उपकरण साफ़ और सैनिटाइज़ करें, और क्षतिग्रस्त उपकरण की सूचना दें। भोजन तैयार करने के क्षेत्र में लकड़ी या कांच के औज़ार इस्तेमाल न करें। कांच या औज़ार टूटने की तुरंत सूचना दें।", "প্রতিবার ব্যবহারের পর যন্ত্র পরিষ্কার ও জীবাণুমুক্ত করুন, এবং ক্ষতিগ্রস্ত যন্ত্রের খবর দিন। খাবার প্রস্তুতির জায়গায় কাঠ বা কাঁচের সরঞ্জাম ব্যবহার করবেন না। কাঁচ বা সরঞ্জাম ভাঙলে তাৎক্ষণিক জানান।", "Bersihkan dan sanitasi peralatan setelah setiap penggunaan, dan laporkan peralatan yang rusak. Jangan gunakan perkakas kayu atau kaca di area persiapan pangan. Laporkan segera jika ada kaca atau perkakas pecah.", "हरेक प्रयोगपछि उपकरण सफा र कीटाणुरहित गर्नुहोस्, र कुनै बिग्रिएको उपकरण रिपोर्ट गर्नुहोस्। खाना तयारी क्षेत्रमा काठ वा काँचका औजार प्रयोग नगर्नुहोस्। काँच वा औजार फुटेको तुरुन्तै रिपोर्ट गर्नुहोस्।"], ["h3", "التخزين الآمن", "Safe storage", "सुरक्षित भंडारण", "নিরাপদ সংরক্ষণ", "Penyimpanan yang aman", "सुरक्षित भण्डारण"], ["p", "تخزين الغذاء في حاويات محكمة الإغلاق وتجنب تخزين الغذاء على الأرض مباشرة.", "Store food in tightly closed containers and avoid storing food directly on the floor.", "भोजन को कसकर बंद डिब्बों में रखें और सीधे फ़र्श पर रखने से बचें।", "খাবার শক্ত করে বন্ধ পাত্রে রাখুন এবং সরাসরি মেঝেতে রাখা এড়ান।", "Simpan pangan dalam wadah tertutup rapat dan hindari menyimpan pangan langsung di lantai.", "खाना कसेर बन्द भाँडोमा भण्डारण गर्नुहोस्, र खाना सिधै भुइँमा नराख्नुहोस्।"], ["h3", "بيئة العمل", "Work environment", "कार्य वातावरण", "কর্মপরিবেশ", "Lingkungan kerja", "कामको वातावरण"], ["p", "تنظيف مكان العمل باستمرار، والإبلاغ فوراً عن أي تلف. تنظيف أدوات النظافة وتطهيرها ونظافتها بعد الاستخدام والتأكد من نظافتها، وتخزينها بعيداً عن الغذاء.", "Keep the workplace clean at all times, and report any damage immediately. Clean, sanitise and dry cleaning tools after use, and store them away from food.", "कार्यस्थल हमेशा साफ़ रखें, और कोई भी क्षति तुरंत बताएँ। इस्तेमाल के बाद सफाई के औज़ार साफ़, सैनिटाइज़ और सुखाकर भोजन से दूर रखें।", "কর্মস্থল সবসময় পরিষ্কার রাখুন, এবং যেকোনো ক্ষতি তাৎক্ষণিক জানান। ব্যবহারের পর পরিষ্কারের সরঞ্জাম পরিষ্কার, জীবাণুমুক্ত ও শুকিয়ে খাবার থেকে দূরে রাখুন।", "Jaga tempat kerja tetap bersih, dan laporkan setiap kerusakan segera. Bersihkan, sanitasi, dan keringkan alat kebersihan setelah digunakan, lalu simpan jauh dari pangan.", "कामको ठाउँ सधैं सफा राख्नुहोस्, र कुनै बिग्रिएको भाग तुरुन्तै रिपोर्ट गर्नुहोस्। प्रयोगपछि सफा औजार सफा, कीटाणुरहित र सुकाएर खानाबाट टाढा भण्डारण गर्नुहोस्।"], ["h3", "متداولو الغذاء", "Food handlers", "खाद्य संभालने वाले कर्मचारी", "খাবার পরিচালনাকারী", "Penjamah pangan", "खाना ह्यान्डलरहरू"], ["p", "ارتداء ملابس واقية وغطاء للرأس، بعيداً عن الغذاء. عدم الإبلاغ عن الجروح أو الأشياء المفقودة. عدم ارتداء المجوهرات أثناء العمل. استخدام ضمادات ملونة.", "Wear protective clothing and a head covering, away from food. Do not fail to report wounds or missing items. Do not wear jewellery while working. Use coloured dressings.", "सुरक्षात्मक कपड़े और सिर ढकना पहनें, और भोजन से दूर रहें। घाव या गुम वस्तुओं की सूचना न देना गलत है। काम के दौरान गहने न पहनें। रंगीन पट्टी इस्तेमाल करें।", "সুরক্ষামূলক পোশাক ও মাথার আবরণ পরুন, খাবার থেকে দূরে থাকুন। ক্ষত বা হারানো জিনিসের খবর না দেওয়া ঠিক নয়। কাজের সময় গয়না পরবেন না। রঙিন ব্যান্ডেজ ব্যবহার করুন।", "Kenakan pakaian pelindung dan penutup kepala, jauhkan dari pangan. Jangan tidak melaporkan luka atau benda yang hilang. Jangan memakai perhiasan saat bekerja. Gunakan plester berwarna.", "सुरक्षात्मक पोशाक र टाउको ढाक्ने कपडा लगाउनुहोस्, खानाबाट टाढा। घाउ वा हराएको वस्तु रिपोर्ट गर्न नभुल्नुहोस्। काम गर्दा गहना नलगाउनुहोस्। रंगीन ड्रेसिङ प्रयोग गर्नुहोस्।"], ["n", "ماذا يعني هذا لنا؟: ملابسنا النظيفة تمنع التلوث وتحد من انتقال البكتيريا للغذاء. مظهرنا النظيف يُرضي المستهلكين والعملاء، ونُظهر اهتمامنا بسلامة الغذاء. نغطي رؤوسنا لمنع سقوط الشعر في الغذاء. نتجنب الحلي لمنع تلوث الغذاء بالبكتيريا ومنع سقوط الحلي في الغذاء. نحمي الغذاء حتى خارج مكان العمل، ولا نتحرك بملابس العمل خارج مناطق التعامل مع الغذاء، ونحافظ على نظافة ملابس العمل دائماً.", "What this means for us: clean clothing prevents contamination and limits the transfer of bacteria to food. A clean appearance pleases consumers and customers and shows our care for food safety. We cover our heads to stop hair falling into food. We avoid jewellery to prevent bacterial contamination and to stop it falling into food. We protect food even outside the workplace, do not move in work clothes outside food handling areas, and always keep work clothes clean.", "हमारे लिए इसका अर्थ: साफ़ कपड़े संदूषण रोकते हैं और जीवाणुओं को भोजन तक पहुँचने से सीमित करते हैं। साफ़ रूप उपभोक्ताओं को संतुष्ट करता है और खाद्य सुरक्षा के प्रति हमारी चिंता दिखाता है। बालों को भोजन में गिरने से रोकने के लिए सिर ढकते हैं। गहने पहनने से बचते हैं ताकि संदूषण और उनके गिरने का खतरा न रहे। भोजन की सुरक्षा कार्यस्थल से बाहर भी करते हैं, काम के कपड़ों में भोजन-क्षेत्र से बाहर नहीं जाते, और कपड़े हमेशा साफ़ रखते हैं।", "আমাদের জন্য এর অর্থ: পরিষ্কার পোশাক দূষণ রোধ করে এবং ব্যাকটেরিয়া খাবারে যাওয়া সীমিত করে। পরিষ্কার চেহারা ভোক্তা ও গ্রাহককে খুশি করে এবং খাদ্য নিরাপত্তায় আমাদের যত্ন দেখায়। চুল খাবারে না পড়তে মাথা ঢাকি। দূষণ ও গয়না পড়ে যাওয়া ঠেকাতে গয়না পরি না। কর্মস্থলের বাইরেও খাবার রক্ষা করি, খাবার-এলাকার বাইরে কাজের পোশাকে যাই না, এবং কাজের পোশাক সবসময় পরিষ্কার রাখি।", "Bagi kita: pakaian bersih mencegah kontaminasi dan membatasi perpindahan bakteri ke pangan. Penampilan bersih menyenangkan konsumen dan menunjukkan kepedulian kita pada keamanan pangan. Kita menutup kepala agar rambut tidak jatuh ke pangan. Kita menghindari perhiasan agar tidak mencemari dan tidak terjatuh ke pangan. Kita menjaga pangan bahkan di luar tempat kerja, tidak keluar area pangan dengan pakaian kerja, dan selalu menjaga pakaian kerja tetap bersih.", "हाम्रो लागि यसको अर्थ: सफा पोशाकले दूषण रोक्छ र जीवाणु खानामा सर्ने सीमित गर्छ। सफा देखिने रूपले उपभोक्ता र ग्राहकलाई खुसी बनाउँछ र खाद्य सुरक्षाप्रतिको हाम्रो हेरचाह देखाउँछ। हामी टाउको ढाक्छौं ताकि कपाल खानामा नपरोस्। हामी दूषण रोक्न र खानामा नखसोस् भनेर गहना लगाउँदैनौं। हामी कार्यस्थल बाहिर पनि खानाको रक्षा गर्छौं, खाना ह्यान्डल गर्ने क्षेत्र बाहिर काम गर्ने पोशाकमा हिँड्दैनौं, र काम गर्ने पोशाक सधैं सफा राख्छौं।"]]}, {"t": ["فساد الأغذية", "Food spoilage", "भोजन का खराब होना", "খাবার নষ্ট হওয়া", "Kerusakan pangan", "खाना बिग्रने"], "r": [["h2", "ما هو فساد الأغذية؟", "What is food spoilage?", "भोजन का खराब होना क्या है?", "খাবার নষ্ট হওয়া কী?", "Apa itu kerusakan pangan?", "खाना बिग्रने भनेको के हो?"], ["p", "فساد الغذاء هو عملية تدهور أو تحلل الغذاء تؤدي إلى:", "Food spoilage is a process of deterioration or breakdown of food that leads to:", "भोजन का खराब होन  রোগ ও খাদ্যে বিষক্রিয়া ছড়ায়, যা মানুষের স্বাস্থ্য ও নিরাপত্তার জন্য ঝুঁকি!", "Bagi kita: penjamah pangan harus memahami bahwa pangan tidak aman menimbulkan banyak risiko kesehatan, jadi dalam bekerja kita harus memastikan tidak menyebabkan konsumen cedera karena tidak memenuhi standar dan persyaratan keamanan pangan. Ingat: pangan tidak aman menyebarkan penyakit dan keracunan pangan, yang membahayakan kesehatan dan keselamatan masyarakat!", "हाम्रो लागि यसको अर्थ: खाना ह्यान्डलरहरूले बुझ्नुपर्छ कि असुरक्षित खानाले धेरै स्वास्थ्य जोखिम निम्त्याउँछ, त्यसैले कामको क्रममा खाद्य सुरक्षा मापदण्ड र आवश्यकताहरू पूरा नगरेर उपभोक्ता चोटपटक वा हानिमा नपरोस् भन्ने हामीले सुनिश्चित गर्नुपर्छ। सधैं याद राख्नुहोस्: असुरक्षित खानाले रोग र खाना विषाक्तता फैलाउँछ, जसले मानिसको स्वास्थ्य र सुरक्षामा जोखिम पुर्‍याउँछ!"], ["h3", "التسمم الغذائي", "Food poisoning", "फ़ूड पॉइज़निंग", "খাদ্যে বিষক্রিয়া", "Keracunan pangan", "खाना विषाक्तता"], ["p", "التسمم الغذائي هو مصطلح يعبر عن مجموعة من الأمراض الناجمة عن تناول غذاء ملوث، ويُعتبر من أكثر المخاطر الصحية شيوعًا المرتبطة بالغذاء غير الآمن. تشير التقديرات إلى أن 600 مليون شخص حول العالم يصابون بأمراض نتيجة تناول غذاء ملوث سنوياً، مما يؤدي إلى حوالي 420,000 حالة وفاة، ويتميز بالتالي:", "Food poisoning is a term for a group of illnesses caused by eating contaminated food, and it is one of the most common health risks linked to unsafe food. Estimates indicate that 600 million people worldwide fall ill from eating contaminated food each year, leading to about 420,000 deaths. It is characterised by the following:", "फ़ूड पॉइज़निंग दूषित भोजन खाने से होने वाली बीमारियों के समूह के लिए शब्द है और असुरक्षित भोजन से जुड़ा सबसे आम स्वास्थ्य खतरा है। अनुमान है कि हर साल दुनिया भर में 60 करोड़ लोग दूषित भोजन से बीमार होते हैं, जिससे लगभग 4,20,000 मौतें होती हैं। इसकी विशेषताएँ:", "খাদ্যে বিষক্রিয়া হলো দূষিত খাবার খাওয়ার কারণে সৃষ্ট রোগের একটি গোষ্ঠী এবং অনিরাপদ খাবারের সঙ্গে জড়িত সবচেয়ে সাধারণ স্বাস্থ্য ঝুঁকি। অনুমান অনুযায়ী প্রতি বছর বিশ্বে ৬০ কোটি মানুষ দূষিত খাবার খেয়ে অসুস্থ হয়, যাতে প্রায় ৪ লক্ষ ২০ হাজার মৃত্যু ঘটে। এর বৈশিষ্ট্য:", "Keracunan pangan adalah istilah untuk sekelompok penyakit akibat mengonsumsi pangan terkontaminasi, dan merupakan salah satu risiko kesehatan paling umum yang terkait pangan tidak aman. Perkiraan menunjukkan 600 juta orang di dunia sakit akibat pangan terkontaminasi setiap tahun, menyebabkan sekitar 420.000 kematian. Ciri-cirinya:", "खाना विषाक्तता भनेको दूषित खाना खाँदा लाग्ने रोगहरूको समूहको नाम हो, र यो असुरक्षित खानासँग सम्बन्धित सबैभन्दा सामान्य स्वास्थ्य जोखिमहरू मध्ये एक हो। अनुमानअनुसार विश्वभर हरेक वर्ष 60 करोड मानिस दूषित खाना खाएर बिरामी पर्छन्, जसबाट करिब 4,20,000 जनाको मृत्यु हुन्छ। यसका विशेषताहरू यी हुन्:"], ["li", "يحدث التسمم الغذائي بسبب تكاثر البكتيريا في الغذاء أو عليه.", "Food poisoning is caused by bacteria multiplying in or on food.", "फ़ूड पॉइज़निंग भोजन में या उस पर जीवाणुओं के बढ़ने से होती है।", "খাবারের ভেতরে বা উপরে ব্যাকটেরিয়ার বৃদ্ধিতে খাদ্যে বিষক্রিয়া হয়।", "Keracunan pangan terjadi karena bakteri berkembang biak di dalam atau pada pangan.", "खाना विषाक्तता खानामा वा खानामाथि जीवाणु बढ्दा हुन्छ।"], ["li", "مرض حاد مع أعراض سريعة.", "An acute illness with rapid symptoms.", "तीव्र रोग, लक्षण जल्दी दिखते हैं।", "দ্রুত লক্ষণসহ তীব্র অসুখ।", "Penyakit akut dengan gejala cepat.", "छिटो लक्षण देखिने तीव्र रोग।"], ["li", "عادة الأعراض تكون خفيفة، لكن يمكن أن تكون خطيرة أحيانا وقد تؤدي إلى الموت.", "Symptoms are usually mild, but can sometimes be serious and may lead to death.", "लक्षण आमतौर पर हल्के होते हैं, पर कभी-कभी गंभीर और मृत्यु तक का कारण बन सकते हैं।", "লক্ষণ সাধারণত হালকা, তবে কখনো গুরুতর হতে পারে এবং মৃত্যুও ঘটাতে পারে।", "Gejalanya biasanya ringan, tetapi kadang bisa serius dan berujung kematian.", "लक्षणहरू सामान्यतया हल्का हुन्छन्, तर कहिलेकाहीँ गम्भीर हुन सक्छन् र मृत्युसम्म पुर्‍याउन सक्छन्।"], ["li", "الأعراض الشائعة: ألم في البطن، تقيؤ، غثيان، إسهال، حمى.", "Common symptoms: abdominal pain, vomiting, nausea, diarrhoea, fever.", "आम लक्षण: पेट दर्द, उल्टी, मतली, दस्त, बुखार।", "সাধারণ লক্ষণ: পেটে ব্যথা, বমি, বমিভাব, ডায়রিয়া, জ্বর।", "Gejala umum: nyeri perut, muntah, mual, diare, demam.", "सामान्य लक्षणहरू: पेट दुखाइ, बान्ता, वाकवाकी, पखाला, ज्वरो।"], ["li", "تظهر الأعراض عادة بين ساعتين و36 ساعة بعد تناول الملوث وتسمى بفترة الحضانة.", "Symptoms usually appear between 2 and 36 hours after eating the contaminated food; this is called the incubation period.", "लक्षण आमतौर पर दूषित भोजन खाने के 2 से 36 घंटे के भीतर दिखते हैं; इसे इनक्यूबेशन काल कहते हैं।", "দূষিত খাবার খাওয়ার ২ থেকে ৩৬ ঘণ্টার মধ্যে লক্ষণ দেখা দেয়; একে ইনকিউবেশন সময়কাল বলে।", "Gejala biasanya muncul 2 hingga 36 jam setelah makan pangan terkontaminasi; ini disebut masa inkubasi.", "लक्षणहरू सामान्यतया दूषित खाना खाएको 2 देखि 36 घण्टाभित्र देखिन्छन्; यसलाई इन्क्युबेसन अवधि भनिन्छ।"], ["li", "قد تستمر الأعراض من يوم إلى أسبوع.", "Symptoms may last from one day to a week.", "लक्षण एक दिन से एक सप्ताह तक रह सकते हैं।", "লক্ষণ এক দিন থেকে এক সপ্তাহ পর্যন্ত থাকতে পারে।", "Gejala dapat berlangsung dari satu hari hingga satu minggu.", "लक्षणहरू एक दिनदेखि एक हप्तासम्म रहन सक्छन्।"], ["li", "من الممكن أن يكون تفشي التسمم الغذائي وهي إصابة عدد من الأشخاص بأعراض مرضية متشابهة خلال فترة زمنية قصيرة بعد تناول غذاء ملوث مشترك.", "An outbreak of food poisoning is when a number of people develop similar symptoms within a short period after eating the same contaminated food.", "खाद्य विषाक्तता का प्रकोप तब होता है जब कई लोग एक ही दूषित भोजन खाने के बाद थोड़े समय में एक जैसे लक्षणों से बीमार हों।", "খাদ্যে বিষক্রিয়ার প্রাদুর্ভাব মানে একই দূষিত খাবার খাওয়ার পর অল্প সময়ে অনেক মানুষের একই রকম লক্ষণ দেখা দেওয়া।", "Wabah keracunan pangan adalah ketika sejumlah orang mengalami gejala serupa dalam waktu singkat setelah makan pangan terkontaminasi yang sama.", "खाना विषाक्तताको प्रकोप भनेको एउटै दूषित खाना खाएपछि छोटो अवधिमा धेरै मानिसमा मिल्दोजुल्दो लक्षण देखिनु हो।"], ["h3", "من هم الأشخاص الأكثر عرضة لخطر الإصابة بالتسمم؟", "Who is most at risk of food poisoning?", "फ़ूड पॉइज़निंग का सबसे अधिक खतरा किन लोगों को है?", "খাদ্যে বিষক্রিয়ার ঝুঁকি সবচেয়ে বেশি কাদের?", "Siapa yang paling berisiko keracunan pangan?", "खाना विषाक्ततामा सबैभन्दा बढी जोखिममा को छ?"], ["li", "المسنون.", "Older people.", "बुज़ुर्ग।", "বয়স্ক মানুষ।", "Lansia.", "बूढाबूढी।"], ["li", "الأطفال تحت سن 5 سنوات.", "Children under 5 years.", "5 वर्ष से कम आयु के बच्चे।", "৫ বছরের কম বয়সী শিশু।", "Anak di bawah 5 tahun.", "5 वर्षमुनिका बालबालिका।"], ["li", "الأشخاص المصابون بأمراض خطيرة.", "People with serious illnesses.", "गंभीर बीमारियों से ग्रस्त लोग।", "গুরুতর অসুখে আক্রান্ত মানুষ।", "Orang dengan penyakit serius.", "गम्भीर रोग भएका मानिस।"], ["li", "النساء الحوامل.", "Pregnant women.", "गर्भवती महिलाएँ।", "গর্ভবতী নারী।", "Ibu hamil.", "गर्भवती महिला।"], ["li", "متداولو الغذاء، خاصة عند التعامل مع الغذاء النيء.", "Food handlers, especially when handling raw food.", "भोजन संभालने वाले, विशेषकर कच्चे भोजन से काम करते समय।", "খাবার পরিচালনাকারী, বিশেষ করে কাঁচা খাবারের সঙ্গে কাজ করার সময়।", "Penjamah pangan, terutama saat menangani pangan mentah.", "खाना ह्यान्डलरहरू, विशेष गरी काँचो खाना ह्यान्डल गर्दा।"], ["n", "ماذا يعني هذا لنا؟: التسمم الغذائي يعني لنا كعاملين في مجال الغذاء خطر حقيقي على صحة الناس. علينا فهم خطره الشديد لأن أي شخص يصيبه التسمم بالإصابة. يجب توخي مزيد من الحذر لحماية الفئات الأكثر عرضة: نحذر من غذاء المسنين، الأطفال الصغار، والمرضى. نحن كعاملين معرضون للخطر أيضاً لتعاملنا مع الغذاء النيء.", "What this means for us: food poisoning means a real risk to people's health for us as food workers. We must understand how serious it is, because anyone can be affected. We must be extra careful to protect the most vulnerable groups: be careful with food for older people, young children and patients. We as workers are also at risk because we handle raw food.", "हमारे लिए इसका अर्थ: खाद्य क्षेत्र के कर्मचारी के रूप में फ़ूड पॉइज़निंग लोगों के स्वास्थ्य के लिए असली खतरा है। इसकी गंभीरता समझना ज़रूरी है, क्योंकि कोई भी इससे प्रभावित हो सकता है। सबसे कमज़ोर वर्गों की रक्षा के लिए अतिरिक्त सावधानी रखें: बुज़ुर्गों, छोटे बच्चों और मरीज़ों के भोजन पर खास ध्यान दें। कच्चा भोजन संभालने से हम कर्मचारी भी खतरे में हैं।", "আমাদের জন্য এর অর্থ: খাদ্য খাতের কর্মী হিসেবে খাদ্যে বিষক্রিয়া মানুষের স্বাস্থ্যের জন্য প্রকৃত ঝুঁকি। এর গুরুত্ব বোঝা জরুরি, কারণ যে কেউ আক্রান্ত হতে পারে। সবচেয়ে দুর্বল গোষ্ঠী রক্ষায় বাড়তি সতর্ক থাকতে হবে: বয়স্ক, ছোট শিশু ও রোগীদের খাবারে বিশেষ যত্ন নিন। কাঁচা খাবার নাড়াচাড়ার কারণে আমরা কর্মীরাও ঝুঁকিতে আছি।", "Bagi kita: keracunan pangan berarti risiko nyata bagi kesehatan masyarakat. Kita harus memahami betapa seriusnya, karena siapa pun bisa terdampak. Harus lebih berhati-hati melindungi kelompok rentan: perhatikan pangan untuk lansia, anak kecil, dan pasien. Kita sebagai pekerja juga berisiko karena menangani pangan mentah.", "हाम्रो लागि यसको अर्थ: खाना विषाक्तता खाद्य कामदारका रूपमा हाम्रो लागि मानिसको स्वास्थ्यमा वास्तविक जोखिम हो। यो कति गम्भीर छ भनेर हामीले बुझ्नुपर्छ, किनभने जोसुकैलाई असर हुन सक्छ। सबैभन्दा कमजोर समूहको सुरक्षा गर्न हामीले विशेष सावधानी अपनाउनुपर्छ: बूढाबूढी, साना बालबालिका र बिरामीको खानामा ध्यान दिनुहोस्। हामी कामदारहरू पनि जोखिममा छौं किनभने हामी काँचो खाना ह्यान्डल गर्छौं।"], ["h3", "البكتيريا المسببة للتسمم الغذائي الأكثر شيوعا", "The most common bacteria causing food poisoning", "सबसे आम फ़ूड पॉइज़निंग जीवाणु", "সবচেয়ে সাধারণ খাদ্যে বিষক্রিয়ার ব্যাকটেরিয়া", "Bakteri paling umum penyebab keracunan pangan", "खाना विषाक्तता निम्त्याउने सबैभन्दा सामान्य जीवाणु"], ["li", "السالمونيلا (Salmonella): توجد داخل الدواجن واللحوم، في أجسام الحيوانات والبشر. تتواجد في الدجاج واللحوم النيئة، البيض غير المطبوخة جيداً، والبيض النيء. ماذا يعني هذا لنا؟ حفظ البيض في الثلاجة عند درجة حرارة 5°م أو أقل. طبخ الدجاج واللحوم جيداً. غسل أيدينا جيداً بعد لمس اللحوم والدواجن النيئة. استخدام أدوات وألواح تقطيع منفصلة للحوم والدواجن النيئة.", "Salmonella: found inside poultry and meat, in animal and human bodies. Found in chicken and raw meat, under-cooked eggs and raw eggs. What this means for us: keep eggs in the fridge at 5°C or below; cook chicken and meat thoroughly; wash hands well after touching raw meat and poultry; use separate utensils and cutting boards for raw meat and poultry.", "सैल्मोनेला: मुर्गी और मांस के भीतर, जानवरों और इंसानों के शरीर में मिलता है। चिकन, कच्चे मांस, अधपके और कच्चे अंडों में पाया जाता है। हमारे लिए: अंडे 5°C या उससे कम पर फ्रिज में रखें; चिकन और मांस अच्छी तरह पकाएँ; कच्चा मांस या मुर्गी छूने के बाद हाथ अच्छी तरह धोएँ; कच्चे मांस और मुर्गी के लिए अलग औज़ार और कटिंग बोर्ड रखें।", "সালমোনেলা: হাঁস-মুরগি ও মাংসের ভেতরে এবং প্রাণী ও মানুষের শরীরে পাওয়া যায়। মুরগি ও কাঁচা মাংস, ভালোভাবে রান্না না হওয়া ও কাঁচা ডিমে থাকে। আমাদের জন্য: ডিম ৫°C বা তার কমে ফ্রিজে রাখুন; মুরগি ও মাংস ভালো করে রান্না করুন; কাঁচা মাংস ও মুরগি ছোঁয়ার পর হাত ভালো করে ধুন; কাঁচা মাংস ও মুরগির জন্য আলাদা সরঞ্জাম ও কাটার বোর্ড ব্যবহার করুন।", "Salmonella: ditemukan di dalam unggas dan daging, pada tubuh hewan dan manusia. Terdapat pada ayam, daging mentah, telur kurang matang, dan telur mentah. Bagi kita: simpan telur di kulkas pada 5°C atau lebih rendah; masak ayam dan daging dengan sempurna; cuci tangan dengan baik setelah menyentuh daging dan unggas mentah; gunakan peralatan dan talenan terpisah untuk daging dan unggas mentah.", "साल्मोनेला: कुखुरा र मासुभित्र, जनावर र मानिसको शरीरमा पाइन्छ। कुखुरा र काँचो मासु, नराम्ररी पकाइएका अण्डा र काँचो अण्डामा पाइन्छ। हाम्रो लागि यसको अर्थ: अण्डा 5°C वा सो भन्दा कम तापक्रममा फ्रिजमा राख्नुहोस्; कुखुरा र मासु राम्ररी पकाउनुहोस्; काँचो मासु र कुखुरा छोएपछि हात राम्ररी धुनुहोस्; काँचो मासु र कुखुराका लागि छुट्टै भाँडा र काट्ने बोर्ड प्रयोग गर्नुहोस्।"], ["li", "ستافيلوكوكس أوريس (Staphylococcus aureus): على جلد الإنسان، في الجروح، وفي الأنف والحنجرة. توجد في الحليب غير المبستر، الكاسترد، والكريمة (الكريمة)، الجبن. لماذا يعني هذا لنا؟ النظافة الشخصية مهمة جداً: نغسل أيدينا بالماء والصابون بشكل متكرر. لا نعمل في تحضير الغذاء إذا كان لدينا جروح أو التهابات في الجلد، خاصة على اليدين أو المعصمين. استخدام قفازات نظيفة عند التعامل مع الغذاء الجاهز للأكل.", "Staphylococcus aureus: on human skin, in wounds, and in the nose and throat. Found in unpasteurised milk, custard, cream and cheese. What this means for us: personal hygiene is very important: wash hands with soap and water frequently. Do not work in food preparation if we have wounds or skin infections, especially on the hands or wrists. Use clean gloves when handling ready-to-eat food.", "स्टैफिलोकॉकस ऑरियस: इंसान की त्वचा पर, घावों में, और नाक-गले में। बिना पाश्चराइज़्ड दूध, कस्टर्ड, क्रीम और पनीर में मिलता है। हमारे लिए: व्यक्तिगत स्वच्छता बहुत ज़रूरी है: साबुन और पानी से बार-बार हाथ धोएँ। हाथों या कलाई पर घाव या त्वचा संक्रमण हो तो भोजन तैयार न करें। तैयार भोजन संभालते समय साफ दस्ताने पहनें।", "স্ট্যাফাইলোকক্কাস অরিয়াস: মানুষের ত্বকে, ক্ষতে, এবং নাক-গলায়। পাস্তুরিত না করা দুধ, কাস্টার্ড, ক্রিম ও পনিরে পাওয়া যায়। আমাদের জন্য: ব্যক্তিগত পরিচ্ছন্নতা খুব জরুরি: সাবান ও পানি দিয়ে বারবার হাত ধুন। হাত বা কব্জিতে ক্ষত বা ত্বক সংক্রমণ থাকলে খাবার তৈরির কাজ করবেন না। তৈরি খাবার ধরার সময় পরিষ্কার গ্লাভস ব্যবহার করুন।", "Staphylococcus aureus: pada kulit manusia, di luka, dan di hidung serta tenggorokan. Ditemukan pada susu tidak dipasteurisasi, puding, krim, dan keju. Bagi kita: kebersihan pribadi sangat penting: cuci tangan dengan sabun dan air secara sering. Jangan bekerja menyiapkan pangan jika ada luka atau infeksi kulit, terutama di tangan atau pergelangan. Gunakan sarung tangan bersih saat menangani pangan siap saji.", "स्टाफिलोकोकस अरियस: मानिसको छाला, घाउ, नाक र घाँटीमा। पाश्चराइज नगरिएको दूध, कस्टर्ड, क्रिम र चीजमा पाइन्छ। हाम्रो लागि यसको अर्थ: व्यक्तिगत सरसफाइ धेरै महत्त्वपूर्ण छ: बारम्बार साबुन र पानीले हात धुनुहोस्। हातमा वा मणिबन्धमा घाउ वा छालाको संक्रमण भए खाना तयारीमा काम नगर्नुहोस्। तयार-खाने खाना ह्यान्डल गर्दा सफा पञ्जा प्रयोग गर्नुहोस्।"], ["li", "كلوستريديم بيرفرينجنز (Clostridium perfringens): في التربة والغبار، في براز الحيوانات، في اللحوم النيئة. توجد في صلصة اللحوم، منتجات اللحوم والدجاج المطبوخ. لماذا يعني هذا لنا؟ طهي اللحوم والدواجن بشكل كامل. الطهي غير الكامل خطير! حفظ الغذاء الساخن عند درجة حرارة 63°م أو أعلى دائماً. تجنب إعداد الغذاء قبل وقت طويل من تقديمه.", "Clostridium perfringens: in soil and dust, in animal faeces, in raw meat. Found in meat sauce, cooked meat and poultry products. What this means for us: cook meat and poultry completely; incomplete cooking is dangerous! Keep hot food at 63°C or above at all times. Avoid preparing food long before serving.", "क्लॉस्ट्रिडियम परफ्रिंजेंस: मिट्टी और धूल में, जानवरों के मल में, कच्चे मांस में। मांस की ग्रेवी, पके मांस और मुर्गी उत्पादों में मिलता है। हमारे लिए: मांस और मुर्गी पूरी तरह पकाएँ; अधूरा पकाना खतरनाक है! गर्म भोजन हमेशा 63°C या उससे ऊपर रखें। परोसने से बहुत पहले भोजन न बनाएँ।", "ক্লস্ট্রিডিয়াম পারফ্রিনজেনস: মাটি ও ধুলোয়, প্রাণীর মলে, কাঁচা মাংসে। মাংসের সসে, রান্না করা মাংস ও মুরগির পণ্যে পাওয়া যায়। আমাদের জন্য: মাংস ও মুরগি সম্পূর্ণ রান্না করুন; অসম্পূর্ণ রান্না বিপজ্জনক! গরম খাবার সবসময় ৬৩°C বা তার উপরে রাখুন। পরিবেশনের অনেক আগে খাবার প্রস্তুত করা এড়ান।", "Clostridium perfringens: di tanah dan debu, dalam kotoran hewan, pada daging mentah. Ditemukan pada saus daging, produk daging dan ayam matang. Bagi kita: masak daging dan unggas sepenuhnya; memasak tidak sempurna itu berbahaya! Simpan pangan panas pada 63°C atau lebih setiap saat. Hindari menyiapkan pangan jauh sebelum disajikan.", "क्लोस्ट्रिडियम पर्फ्रिन्जेन्स: माटो र धुलो, जनावरको दिसा, काँचो मासुमा। मासुको सस, पकाएको मासु र कुखुराका उत्पादनमा पाइन्छ। हाम्रो लागि यसको अर्थ: मासु र कुखुरा पूरै पकाउनुहोस्; अधूरो पकाउनु खतरनाक छ! खाना सधैं 63°C वा सो भन्दा माथि राख्नुहोस्। सेवा गर्नुभन्दा धेरै अगाडि खाना तयार गर्नबाट बच्नुहोस्।"], ["li", "كلوستريديم بوتولينوم (Clostridium botulinum): في التربة والغبار، الأسماك، وفي الخضروات النيئة. توجد في المعلبات المنتفخة، المنتجات المعبأة بتفريغ الهواء. لماذا يعني هذا لنا؟ فحص المعلبات بعناية قبل استخدامها. عدم استخدام أي معلبات بها: انتفاخ، تشققات في اللحام، كسر في الجسم الداخلي، أي تسرب أو تقوب.", "Clostridium botulinum: in soil and dust, fish, and raw vegetables. Found in swollen cans and vacuum-packed products. What this means for us: check cans carefully before use. Do not use any cans that are swollen, have cracks in the seams, dents in the body, or any leaks or holes.", "क्लॉस्ट्रिडियम बोटुलिनम: मिट्टी और धूल में, मछली में, और कच्ची सब्ज़ियों में। फूले हुए डिब्बों और वैक्यूम-पैक उत्पादों में मिलता है। हमारे लिए: उपयोग से पहले डिब्बे ध्यान से जांचें। फूले, सीवन में दरार, अंदर से पिचके या रिसाव/छेद वाले डिब्बे कभी न इस्तेमाल करें।", "ক্লস্ট্রিডিয়াম বোটুলিনাম: মাটি ও ধুলোয়, মাছে এবং কাঁচা সবজিতে। ফোলা টিন ও ভ্যাকুয়াম-প্যাকড পণ্যে পাওয়া যায়। আমাদের জন্য: ব্যবহারের আগে টিন ভালো করে দেখুন। ফোলা, জোড়ায় ফাটল, ভেতরে বসে যাওয়া বা ফুটো/ছিদ্র থাকলে কোনো টিন ব্যবহার করবেন না।", "Clostridium botulinum: di tanah dan debu, ikan, dan sayuran mentah. Ditemukan pada kaleng menggembung dan produk kemasan vakum. Bagi kita: periksa kaleng dengan teliti sebelum digunakan. Jangan gunakan kaleng yang menggembung, retak pada sambungan, penyok di badan, atau bocor/berlubang.", "क्लोस्ट्रिडियम बोटुलिनम: माटो र धुलो, माछा र काँचो तरकारीमा। सुन्निएका डिब्बा र भ्याकुम-प्याक गरिएका उत्पादनमा पाइन्छ। हाम्रो लागि यसको अर्थ: प्रयोग गर्नु अघि डिब्बा राम्ररी जाँच गर्नुहोस्। सुन्निएका, सिममा दरार, शरीरमा डेन्ट, वा कुनै चुहिने वा प्वाल भएका डिब्बा प्रयोग नगर्नुहोस्।"], ["li", "باسيلس سيريوس (Bacillus cereus): في الأرز، في الذرة، في التربة وفي الغبار. توجد في الأرز المطبوخ، السلطات، والتوابل. لماذا يعني هذا لنا؟ لا نترك الأرز المطبوخ في درجة الغرفة لفترة طويلة. تبريد الأغذية الساخنة بسرعة (خلال ساعتين) إلى درجة حرارة أقل من 5°م. عند إعادة تسخين الأرز، نتأكد من أنه يصل إلى درجة حرارة 82°م على الأقل.", "Bacillus cereus: in rice, maize, soil and dust. Found in cooked rice, salads and spices. What this means for us: do not leave cooked rice at room temperature for a long time. Cool hot food quickly (within 2 hours) to below 5°C. When reheating rice, make sure it reaches at least 82°C.", "बैसिलस सेरियस: चावल, मक्का, मिट्टी और धूल में। पके चावल, सलाद और मसालों में मिलता है। हमारे लिए: पका चावल कमरे के तापमान पर देर तक न छोड़ें। गर्म भोजन जल्दी (2 घंटे में) 5°C से नीचे ठंडा करें। चावल फिर गर्म करते समय पक्का करें कि वह कम से कम 82°C तक पहुँचे।", "ব্যাসিলাস সেরিয়াস: চাল, ভুট্টা, মাটি ও ধুলোয়। রান্না করা ভাত, সালাদ ও মসলায় পাওয়া যায়। আমাদের জন্য: রান্না করা ভাত ঘরের তাপমাত্রায় দীর্ঘক্ষণ রাখবেন না। গরম খাবার দ্রুত (২ ঘণ্টার মধ্যে) ৫°C-এর নিচে ঠান্ডা করুন। ভাত আবার গরম করার সময় নিশ্চিত করুন অন্তত ৮২°C-এ পৌঁছেছে।", "Bacillus cereus: pada nasi, jagung, tanah, dan debu. Ditemukan pada nasi matang, salad, dan rempah. Bagi kita: jangan biarkan nasi matang lama di suhu ruang. Dinginkan pangan panas dengan cepat (dalam 2 jam) hingga di bawah 5°C. Saat memanaskan ulang nasi, pastikan mencapai minimal 82°C.", "बेसिलस सेरियस: चामल, मकै, माटो र धुलोमा। पकाएको भात, सलाद र मसलामा पाइन्छ। हाम्रो लागि यसको अर्थ: पकाएको भात लामो समय कोठाको तापक्रममा नछोड्नुहोस्। तातो खाना छिटो (2 घण्टाभित्र) 5°C भन्दा तल चिसो गर्नुहोस्। भात तताउँदा कम्तीमा 82°C पुगेको पक्का गर्नुहोस्।"]]}, {"t": ["النظافة الشخصية للعاملين", "Personal hygiene for workers", "कर्मचारियों की व्यक्तिगत स्वच्छता", "কর্মীদের ব্যক্তিগত পরিচ্ছন্নতা", "Kebersihan pribadi pekerja", "कामदारको व्यक्तिगत सरसफाइ"], "r": [["h2", "النظافة الشخصية للعاملين", "Workers' personal hygiene", "कर्मचारियों की व्यक्तिगत स्वच्छता", "কর্মীদের ব্যক্তিগত পরিচ্ছন্নতা", "Kebersihan pribadi pekerja", "कामदारको व्यक्तिगत सरसफाइ"], ["h3", "ماذا نعني بالنظافة الشخصية؟", "What do we mean by personal hygiene?", "व्यक्तिगत स्वच्छता से हमारा क्या मतलब है?", "ব্যক্তিগত পরিচ্ছন্নতা বলতে আমরা কী বুঝি?", "Apa yang dimaksud dengan kebersihan pribadi?", "व्यक्तिगत सरसफाइ भनेको के हो?"], ["li", "هي مجموعة من القواعد البسيطة التي نتبعها للحفاظ على نظافتنا.", "It is a set of simple rules we follow to keep ourselves clean.", "यह सरल नियमों का समूह है जिन्हें हम अपनी सफाई के लिए मानते हैं।", "এটি সাধারণ নিয়মের সেট যা আমরা নিজেদের পরিষ্কার রাখতে মেনে চলি।", "Serangkaian aturan sederhana yang kita ikuti untuk menjaga kebersihan diri.", "यो हामीले आफूलाई सफा राख्न पालना गर्ने सरल नियमहरूको समूह हो।"], ["li", "تشمل الاهتمام بنظافة أجسامنا وملابسنا، واتباع عادات سليمة وصحية أثناء العمل.", "It includes caring for the cleanliness of our bodies and clothes, and following sound, healthy habits at work.", "इसमें शरीर और कपड़ों की सफाई पर ध्यान और काम के दौरान सही, स्वस्थ आदतें अपनाना शामिल है।", "এতে শরীর ও পোশাকের পরিচ্ছন্নতা এবং কাজের সময় সুস্থ অভ্যাস মেনে চলা অন্তর্ভুক্ত।", "Mencakup menjaga kebersihan tubuh dan pakaian, serta mengikuti kebiasaan sehat saat bekerja.", "यसमा हाम्रो शरीर र लुगाको सफाइको हेरचाह, र काममा राम्रो, स्वस्थ बानीहरू पालना गर्नु पर्छ।"], ["li", "الهدف الرئيسي هو منع انتشار الأمراض وحماية الغذاء من التلوث.", "The main aim is to prevent the spread of disease and protect food from contamination.", "मुख्य उद्देश्य रोगों का फैलाव रोकना और भोजन को संदूषण से बचाना है।", "মূল উদ্দেশ্য রোগ ছড়ানো রোধ ও খাবারকে দূষণ থেকে রক্ষা করা।", "Tujuan utamanya adalah mencegah penyebaran penyakit dan melindungi pangan dari kontaminasi.", "मुख्य उद्देश्य रोगको फैलावट रोक्नु र खानालाई दूषणबाट जोगाउनु हो।"], ["h3", "لماذا النظافة الشخصية مهمة في عملنا؟", "Why is personal hygiene important in our work?", "हमारे काम में व्यक्तिगत स्वच्छता क्यों ज़रूरी है?", "আমাদের কাজে ব্যক্তিগত পরিচ্ছন্নতা কেন গুরুত্বপূর্ণ?", "Mengapa kebersihan pribadi penting dalam pekerjaan kita?", "हाम्रो काममा व्यक्तिगत सरसफाइ किन महत्त्वपूर्ण छ?"], ["li", "كثير منا قد يحمل بكتيريا ضارة دون أن يعرف.", "Many of us may carry harmful bacteria without knowing it.", "हममें से कई लोग बिना जाने हानिकारक जीवाणु लिए रहते हैं।", "আমাদের অনেকেই না জেনে ক্ষতিকর ব্যাকটেরিয়া বহন করতে পারি।", "Banyak dari kita mungkin membawa bakteri berbahaya tanpa menyadarinya.", "हामी धेरैले थाहा नपाई हानिकारक जीवाणु बोकेका हुन सक्छौं।"], ["li", "إذا لم نهتم بنظافتنا، قد تنتقل هذه البكتيريا إلى الغذاء.", "If we do not care about our cleanliness, these bacteria may pass to food.", "यदि हम अपनी सफाई पर ध्यान न दें, तो ये जीवाणु भोजन तक पहुँच सकते हैं।", "আমরা নিজেদের পরিচ্ছন্নতায় যত্ন না নিলে এসব ব্যাকটেরিয়া খাবারে যেতে পারে।", "Jika kita tidak peduli kebersihan, bakteri ini bisa berpindah ke pangan.", "हामीले आफ्नो सरसफाइको ख्याल नगरे, यी जीवाणु खानामा सर्न सक्छन्।"], ["li", "نظافتنا تحمي عملاءنا من الأمراض المنقولة عبر الغذاء.", "Our cleanliness protects our customers from foodborne diseases.", "हमारी सफाई ग्राहकों को भोजन से फैलने वाली बीमारियों से बचाती है।", "আমাদের পরিচ্ছন্নতা গ্রাহকদের খাবারবাহিত রোগ থেকে রক্ষা করে।", "Kebersihan kita melindungi pelanggan dari penyakit bawaan pangan.", "हाम्रो सरसफाइले ग्राहकलाई खानामार्फत लाग्ने रोगबाट जोगाउँछ।"], ["li", "الحفاظ عليها من اشتراطات العمل في مجال الغذاء.", "Maintaining it is one of the requirements of working in food.", "इसे बनाए रखना खाद्य क्षेत्र में काम की शर्तों में से एक है।", "এটি বজায় রাখা খাদ্য খাতে কাজের শর্তগুলোর একটি।", "Menjaganya merupakan salah satu persyaratan bekerja di bidang pangan.", "यसलाई कायम राख्नु खाना क्षेत्रमा काम गर्नुको एक आवश्यकता हो।"], ["h3", "كيف قد تنتقل البكتيريا منا إلى للغذاء؟", "How can bacteria pass from us to food?", "जीवाणु हमसे भोजन तक कैसे पहुँच सकते हैं?", "ব্যাকটেরিয়া আমাদের থেকে খাবারে কীভাবে যেতে পারে?", "Bagaimana bakteri dapat berpindah dari kita ke pangan?", "जीवाणु हामीबाट खानामा कसरी सर्न सक्छ?"], ["li", "بطريقة مباشرة: عند لمس الغذاء بأيدٍ متسخة، لمس الغذاء الجاهز للأكل مباشرة بدون قفازات، أو السعال أو العطس على الغذاء.", "Directly: when touching food with dirty hands, touching ready-to-eat food directly without gloves, or coughing or sneezing on food.", "सीधे: गंदे हाथों से भोजन छूने, दस्ताने पहने बिना तैयार भोजन छूने, या भोजन पर खांसने-छींकने से।", "সরাসরি: নোংরা হাতে খাবার ছোঁয়া, গ্লাভস ছাড়া তৈরি খাবার সরাসরি ধরা, বা খাবারের উপর কাশি বা হাঁচি দেওয়া।", "Secara langsung: menyentuh pangan dengan tangan kotor, menyentuh pangan siap saji tanpa sarung tangan, atau batuk atau bersin di
